<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>今日の予定</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eef4fb;
color:#333;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}

.app-box{
max-width:560px;
margin:0 auto;
padding:18px 14px 34px;
}

.badge{
display:inline-block;
background:#1976d2;
color:#fff;
border-radius:999px;
padding:10px 18px;
font-size:17px;
font-weight:900;
}

.header{
text-align:center;
margin-bottom:16px;
}

.card{
background:#fff;
border-radius:26px;
padding:24px;
box-shadow:0 8px 22px rgba(0,0,0,.10);
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
margin:0 0 10px;
color:#1976d2;
}

.lead{
font-size:18px;
font-weight:800;
text-align:center;
line-height:1.6;
color:#666;
margin-bottom:22px;
}

.info{
background:#f7f9fa;
border-left:8px solid #1976d2;
border-radius:14px;
padding:18px;
margin-bottom:16px;
font-size:21px;
font-weight:900;
line-height:1.8;
}

.calendarBtn{
display:block;
width:100%;
background:#2eaf66;
color:#fff;
text-decoration:none;
text-align:center;
padding:22px;
border-radius:20px;
font-size:24px;
font-weight:900;
margin-top:18px;
}

.back{
display:block;
margin-top:20px;
text-align:center;
font-size:20px;
font-weight:900;
text-decoration:none;
color:#666;
}
</style>
</head>

<body>

<div class="app-box">

<div class="header">
<span class="badge">利用者ページ</span>
</div>

<div class="card">

<h1 class="title">今日の予定</h1>

<div class="lead">
病院・買い物・予定を確認できます
</div>

<div id="yoteiArea">
<div class="info">予定を読み込み中...</div>
</div>

<a
id="calendarBtn"
class="calendarBtn"
target="_blank">
📅 Googleカレンダーを開く
</a>

<a href="index.html" class="back">
トップへ戻る
</a>

</div>

</div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbwC3CPMJlMl5o37qcxIcedcikLuxe6y_ANRjAeFnO9KtPEk9rw-LTu72Dyoq2XJKPET/exec';

async function loadYotei(){

try{

const res =
await fetch(
GAS_URL + '?mode=yotei'
);

const data =
await res.json();

let html='';

data.forEach(item=>{

html += `
<div class="info">
📅 ${item.date || ''}<br>
🕒 ${item.time || ''}<br>
${item.title || ''}<br>
${item.detail || ''}
</div>
`;

});

document.getElementById('yoteiArea').innerHTML =
html || '<div class="info">本日の予定はありません</div>';

}
catch(e){

document.getElementById('yoteiArea').innerHTML =
'<div class="info">予定の取得に失敗しました</div>';

}

}

document.getElementById("calendarBtn").href =
"https://calendar.google.com/calendar/u/0/r";

loadYotei();

</script>

</body>
</html>
