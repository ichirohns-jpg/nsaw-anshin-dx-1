<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ゴミの日｜あんしん生活ボタン</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:560px;
margin:auto;
padding:18px 14px 34px;
}

.card{
background:#fff;
border-radius:26px;
padding:24px 20px;
box-shadow:0 8px 22px rgba(0,0,0,.10);
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
color:#2eaf66;
margin:0 0 10px;
}

.lead{
font-size:19px;
font-weight:800;
text-align:center;
line-height:1.6;
color:#555;
margin:0 0 20px;
}

.areaBox{
background:#f0fff5;
border:3px solid #c9f0d7;
border-radius:20px;
padding:18px;
font-size:23px;
font-weight:900;
text-align:center;
line-height:1.6;
margin-bottom:18px;
}

.gomiBox{
background:#f7f9fb;
border-radius:20px;
padding:18px;
margin-bottom:14px;
font-size:22px;
font-weight:900;
line-height:1.7;
}

.day{
color:#2eaf66;
font-size:26px;
}

.btn{
display:block;
width:100%;
border:none;
text-decoration:none;
border-radius:22px;
padding:22px 18px;
margin-top:18px;
font-size:24px;
font-weight:900;
color:#fff;
text-align:center;
background:#2eaf66;
}

.back{
display:block;
margin-top:22px;
text-align:center;
font-size:20px;
font-weight:900;
text-decoration:none;
color:#1976d2;
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<h1 class="title">ゴミの日</h1>

<div class="lead">
設定した市と地区から<br>
ゴミの日を表示します。
</div>

<div class="areaBox" id="areaBox">
地域を確認しています
</div>

<div id="gomiList"></div>

<a class="btn" href="setting.html">
⚙ 地域設定を直す
</a>

<a href="index.html" class="back">
トップへ戻る
</a>

</div>

</div>

<script>
const city = localStorage.getItem("city") || "志木市";
const area = localStorage.getItem("area") || "";

document.getElementById("areaBox").innerHTML =
city + "<br>" + (area || "地区未設定");

const gomiData = [
  {
    city:"志木市",
    keyword:"柏町",
    burn:"月・木",
    plastic:"水",
    bottle:"第1・第3 金",
    paper:"第2・第4 金"
  },
  {
    city:"志木市",
    keyword:"本町",
    burn:"火・金",
    plastic:"水",
    bottle:"第1・第3 木",
    paper:"第2・第4 木"
  },
  {
    city:"志木市",
    keyword:"幸町",
    burn:"月・木",
    plastic:"水",
    bottle:"第1・第3 金",
    paper:"第2・第4 金"
  },
  {
    city:"志木市",
    keyword:"館",
    burn:"火・金",
    plastic:"水",
    bottle:"第1・第3 木",
    paper:"第2・第4 木"
  },
  {
    city:"志木市",
    keyword:"中宗岡",
    burn:"月・木",
    plastic:"水",
    bottle:"第1・第3 火",
    paper:"第2・第4 火"
  },
  {
    city:"志木市",
    keyword:"上宗岡",
    burn:"月・木",
    plastic:"水",
    bottle:"第1・第3 火",
    paper:"第2・第4 火"
  },
  {
    city:"志木市",
    keyword:"下宗岡",
    burn:"火・金",
    plastic:"水",
    bottle:"第1・第3 月",
    paper:"第2・第4 月"
  },
  {
    city:"志木市",
    keyword:"宗岡",
    burn:"月・木",
    plastic:"水",
    bottle:"第1・第3 火",
    paper:"第2・第4 火"
  }
];

function findGomi(){
  let hit = null;

  for(let i=0;i<gomiData.length;i++){
    const row = gomiData[i];

    if(row.city === city && area.indexOf(row.keyword) !== -1){
      hit = row;
      break;
    }
  }

  if(!hit && city === "志木市"){
    hit = {
      city:"志木市",
      keyword:"未設定",
      burn:"設定画面で地区を入れてください",
      plastic:"設定画面で地区を入れてください",
      bottle:"設定画面で地区を入れてください",
      paper:"設定画面で地区を入れてください"
    };
  }

  return hit;
}

function showGomi(){
  const hit = findGomi();
  const box = document.getElementById("gomiList");

  if(!hit){
    box.innerHTML =
      '<div class="gomiBox">この市のゴミ情報はまだ登録されていません。</div>';
    return;
  }

  box.innerHTML =
    '<div class="gomiBox"><div class="day">燃えるゴミ</div>' + hit.burn + '</div>' +
    '<div class="gomiBox"><div class="day">プラスチック</div>' + hit.plastic + '</div>' +
    '<div class="gomiBox"><div class="day">びん・かん・ペットボトル</div>' + hit.bottle + '</div>' +
    '<div class="gomiBox"><div class="day">紙・布</div>' + hit.paper + '</div>';
}

showGomi();
</script>

</body>
</html>
