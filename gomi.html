<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ゴミ収集案内</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
padding:15px;
}

.wrap{
max-width:900px;
margin:auto;
}

.header{
background:linear-gradient(135deg,#00a86b,#00c27a);
color:#fff;
padding:24px;
border-radius:24px;
text-align:center;
font-size:34px;
font-weight:900;
margin-bottom:16px;
}

.card{
background:#fff;
border-radius:24px;
padding:20px;
margin-bottom:16px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.box{
border-radius:20px;
padding:20px;
margin-bottom:16px;
}

.today{
background:#e9fff1;
border:3px solid #00a86b;
}

.tomorrow{
background:#eef6ff;
border:3px solid #2196f3;
}

.next{
background:#fff5df;
border:3px solid #ff9800;
}

.label{
font-size:24px;
font-weight:900;
margin-bottom:12px;
}

.type{
font-size:34px;
font-weight:900;
margin-bottom:10px;
}

.msg{
font-size:18px;
line-height:1.7;
}

.btn{
width:100%;
border:none;
border-radius:18px;
padding:18px;
font-size:24px;
font-weight:900;
cursor:pointer;
margin-top:10px;
}

.readBtn{
background:#1976d2;
color:#fff;
}

.backBtn{
background:#555;
color:#fff;
}

</style>

</head>

<body>

<div class="wrap">

<div class="header">
🗑 今日と明日のゴミ
</div>

<div class="card">

<div class="box today">

<div class="label">
🟢 今日のゴミ
</div>

<div
id="todayType"
class="type">
読込中...
</div>

<div
id="todayMsg"
class="msg">
読込中...
</div>

</div>

<div class="box tomorrow">

<div class="label">
🔵 明日のゴミ
</div>

<div
id="tomorrowType"
class="type">
読込中...
</div>

<div
id="tomorrowMsg"
class="msg">
読込中...
</div>

</div>

<div class="box next">

<div class="label">
🟠 次回のゴミ
</div>

<div
id="nextType"
class="type">
読込中...
</div>

<div
id="nextMsg"
class="msg">
読込中...
</div>

</div>

<button
class="btn readBtn"
onclick="speakGarbage()">
🔊 音声で読む
</button>

<button
class="btn backBtn"
onclick="history.back()">
戻る
</button>

</div>

<script>

const SHEET_ID =
"149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc";

const SHEET_NAME =
"ゴミ";

function cell(row,index){

return row.c[index]
? (row.c[index].v || row.c[index].f || "")
: "";

}

function weekName(offset){

const d =
new Date();

d.setDate(
d.getDate()+offset
);

return [
"日",
"月",
"火",
"水",
"木",
"金",
"土"
][d.getDay()];

}

async function loadGarbage(){

const params =
new URLSearchParams(
location.search
);

const city =
params.get("city") || "志木市";

const area =
params.get("area") || "本町";

const url =
"https://docs.google.com/spreadsheets/d/" +
SHEET_ID +
"/gviz/tq?sheet=" +
encodeURIComponent(SHEET_NAME) +
"&tqx=out:json";

try{

const txt =
await fetch(url)
.then(r=>r.text());

const json =
JSON.parse(
txt.substring(47).slice(0,-2)
);

const rows =
json.table.rows;

const today =
weekName(0);

const tomorrow =
weekName(1);

let todayData = null;
let tomorrowData = null;
let nextData = null;

rows.forEach(row=>{

const cityName =
cell(row,0);

const areaName =
cell(row,1);

const week =
String(cell(row,2));

if(
cityName === city &&
areaName === area
){

if(
week.indexOf(today) > -1
){

todayData = {
type:cell(row,3),
msg:cell(row,6) || cell(row,4)
};

}

if(
week.indexOf(tomorrow) > -1
){

tomorrowData = {
type:cell(row,3),
msg:cell(row,6) || cell(row,4)
};

}

if(
!nextData &&
week !== today &&
week !== tomorrow
){

nextData = {
type:cell(row,3),
msg:cell(row,6) || cell(row,4)
};

}

}

});

if(todayData){

document.getElementById(
"todayType"
).innerHTML =
todayData.type;

document.getElementById(
"todayMsg"
).innerHTML =
todayData.msg;

}else{

document.getElementById(
"todayType"
).innerHTML =
"収集なし";

document.getElementById(
"todayMsg"
).innerHTML =
"本日の収集はありません";

}

if(tomorrowData){

document.getElementById(
"tomorrowType"
).innerHTML =
tomorrowData.type;

document.getElementById(
"tomorrowMsg"
).innerHTML =
tomorrowData.msg;

}else{

document.getElementById(
"tomorrowType"
).innerHTML =
"収集なし";

document.getElementById(
"tomorrowMsg"
).innerHTML =
"明日の収集はありません";

}

if(nextData){

document.getElementById(
"nextType"
).innerHTML =
nextData.type;

document.getElementById(
"nextMsg"
).innerHTML =
nextData.msg;

}else{

document.getElementById(
"nextType"
).innerHTML =
"未設定";

document.getElementById(
"nextMsg"
).innerHTML =
"次回収集情報なし";

}

}catch(error){

document.getElementById(
"todayType"
).innerHTML =
"取得失敗";

document.getElementById(
"tomorrowType"
).innerHTML =
"取得失敗";

document.getElementById(
"nextType"
).innerHTML =
"取得失敗";

}

}

function speakGarbage(){

const text =

"今日のゴミは" +
document.getElementById(
"todayType"
).innerText +

"です。" +

document.getElementById(
"todayMsg"
).innerText +

"。明日のゴミは" +

document.getElementById(
"tomorrowType"
).innerText +

"です。" +

document.getElementById(
"tomorrowMsg"
).innerText +

"。次回のゴミは" +

document.getElementById(
"nextType"
).innerText +

"です。";

const speech =
new SpeechSynthesisUtterance(
text
);

speech.lang =
"ja-JP";

speech.rate = 1;

speech.pitch = 1;

speechSynthesis.cancel();
speechSynthesis.speak(
speech
);

}

loadGarbage();

</script>

</body>
</html>
