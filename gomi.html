<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ゴミ収集案内</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
padding:15px;
}

.wrap{
max-width:900px;
margin:auto;
}

.header{
background:linear-gradient(
135deg,
#0f172a,
#334155
);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
font-size:36px;
font-weight:900;
margin-bottom:18px;
line-height:1.5;
box-shadow:0 10px 24px rgba(0,0,0,.15);
}

.card{
background:#fff;
border-radius:28px;
padding:22px;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.box{
border-radius:22px;
padding:22px;
margin-bottom:18px;
}

.today{
background:#ecfff5;
border:4px solid #10b981;
}

.tomorrow{
background:#eff6ff;
border:4px solid #3b82f6;
}

.label{
font-size:26px;
font-weight:900;
margin-bottom:12px;
}

.date{
font-size:20px;
font-weight:900;
margin-bottom:12px;
color:#64748b;
}

.type{
font-size:38px;
font-weight:900;
margin-bottom:12px;
}

.msg{
font-size:20px;
line-height:1.8;
}

.nextBox{
background:#fff7ed;
border:4px solid #f97316;
border-radius:22px;
padding:22px;
margin-top:18px;
}

.nextTitle{
font-size:24px;
font-weight:900;
margin-bottom:10px;
}

.nextText{
font-size:28px;
font-weight:900;
}

.btn{
width:100%;
border:none;
border-radius:20px;
padding:20px;
font-size:24px;
font-weight:900;
cursor:pointer;
margin-top:12px;
}

.btn{
background:#10b981;
color:#fff;
}

.btn:active{
transform:scale(.98);
}

.info{
font-size:18px;
line-height:1.8;
color:#475569;
margin-top:10px;
}

.footer{
text-align:center;
font-size:16px;
color:#64748b;
padding:20px;
}

@media(max-width:768px){

.header{
font-size:30px;
padding:22px;
}

.type{
font-size:32px;
}

.label{
font-size:22px;
}

.nextText{
font-size:24px;
}

.btn{
font-size:22px;
padding:18px;
}

}

</style>
</head>

<body>

<div class="wrap">

<div class="header">
🗑️ ゴミ収集案内
</div>

<div id="result">

<div class="card">

<div class="box today">

<div class="label">
本日の収集
</div>

<div class="date" id="todayDate">
読み込み中...
</div>

<div class="type" id="todayType">
確認中...
</div>

<div class="msg">
本日の収集内容を表示します
</div>

</div>

<div class="box tomorrow">

<div class="label">
次回の収集
</div>

<div class="date" id="nextDate">
確認中...
</div>

<div class="type" id="nextType">
確認中...
</div>

</div>

<div class="nextBox">

<div class="nextTitle">
地区情報
</div>

<div class="nextText" id="areaName">
読み込み中...
</div>

</div>

</div>

</div>
