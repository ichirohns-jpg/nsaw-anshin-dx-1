<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>今日と明日のゴミ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#f5f7fb;
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
padding:15px;
}

.wrap{
max-width:800px;
margin:auto;
}

.card{
background:#fff;
border-radius:20px;
padding:20px;
margin-bottom:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.title{
font-size:30px;
font-weight:900;
text-align:center;
margin-bottom:20px;
}

.box{
padding:20px;
border-radius:15px;
margin-bottom:15px;
}

.today{
background:#e8fff0;
}

.tomorrow{
background:#eef5ff;
}

.label{
font-size:22px;
font-weight:900;
margin-bottom:10px;
}

.type{
font-size:32px;
font-weight:900;
margin-bottom:10px;
}

.msg{
font-size:18px;
line-height:1.6;
}

button{
width:100%;
padding:18px;
border:none;
border-radius:15px;
font-size:22px;
font-weight:900;
margin-top:10px;
cursor:pointer;
}

.readBtn{
background:#1976d2;
color:#fff;
}

.homeBtn{
background:#666;
color:#fff;
}

</style>
</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
🗑 ゴミ収集案内
</div>

<div class="box today">

<div class="label">
🟢 今日のゴミ
</div>

<div id="todayType" class="type">
読込中...
</div>

<div id="todayMsg" class="msg">
読込中...
</div>

</div>

<div class="box tomorrow">

<div class="label">
🔵 明日のゴミ
</div>

<div id="tomorrowType" class="type">
読込中...
</div>

<div id="tomorrowMsg" class="msg">
読込中...
</div>

</div>

<button
class="readBtn"
onclick="speakGarbage()">
🔊 読み上げ
</button>

<button
class="homeBtn"
onclick="history.back()">
戻る
</button>

</div>

<script>

const SHEET_ID =
"149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc";

const SHEET_NAME =
"ゴミ";

function getWeek(offset){

const d = new Date();

d.setDate(
d.getDate()+offset
);

return [
"日","月","火","水","木","金","土"
][d.getDay()];

}

function cell(row,index){

return row.c[index]
? (row.c[index].v || row.c[index].f || "")
: "";

}

async function loadGarbage(){

const params =
new URLSearchParams(
location.search
);

const city =
params.get("city") || "志木市";

const area =
params.get("area") || "本町";

const url =
"https://docs.google.com/spreadsheets/d/" +
SHEET_ID +
"/gviz/tq?sheet=" +
encodeURIComponent(SHEET_NAME) +
"&tqx=out:json";

try{

const txt =
await fetch(url)
.then(r=>r.text());

const json =
JSON.parse(
txt.substring(47).slice(0,-2)
);

const rows =
json.table.rows;

const today =
getWeek(0);

const tomorrow =
getWeek(1);

let todayData = null;
let tomorrowData = null;

rows.forEach(row=>{

const cityName =
cell(row,0);

const areaName =
cell(row,1);

const week =
String(cell(row,2));

if(
cityName === city &&
areaName === area
){

if(
week.indexOf(today) > -1
){

todayData = {
type:cell(row,3),
msg:cell(row,6) || cell(row,4)
};

}

if(
week.indexOf(tomorrow) > -1
){

tomorrowData = {
type:cell(row,3),
msg:cell(row,6) || cell(row,4)
};

}

}

});

if(todayData){

document.getElementById(
"todayType"
).innerHTML =
todayData.type;

document.getElementById(
"todayMsg"
).innerHTML =
todayData.msg;

}else{

document.getElementById(
"todayType"
).innerHTML =
"収集なし";

document.getElementById(
"todayMsg"
).innerHTML =
"本日の収集はありません";

}

if(tomorrowData){

document.getElementById(
"tomorrowType"
).innerHTML =
tomorrowData.type;

document.getElementById(
"tomorrowMsg"
).innerHTML =
tomorrowData.msg;

}else{

document.getElementById(
"tomorrowType"
).innerHTML =
"収集なし";

document.getElementById(
"tomorrowMsg"
).innerHTML =
"明日の収集はありません";

}

}catch(error){

document.getElementById(
"todayType"
).innerHTML =
"取得失敗";

document.getElementById(
"tomorrowType"
).innerHTML =
"取得失敗";

}

}

function speakGarbage(){

const text =

"今日のゴミは" +

document.getElementById(
"todayType"
).innerText +

"です。" +

document.getElementById(
"todayMsg"
).innerText +

"。明日のゴミは" +

document.getElementById(
"tomorrowType"
).innerText +

"です。" +

document.getElementById(
"tomorrowMsg"
).innerText;

const speech =
new SpeechSynthesisUtterance(
text
);

speech.lang =
"ja-JP";

speech.rate = 1;

speech.pitch = 1;

speechSynthesis.speak(
speech
);

}

loadGarbage();

</script>

</div>

</body>
</html>
