<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>今日のゴミ</title>

<link rel="icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
background:linear-gradient(180deg,#000000 0%,#08111d 50%,#000000 100%);
color:#fff;
min-height:100vh;
}

.wrap{
max-width:800px;
margin:auto;
padding:16px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:20px;
margin-bottom:16px;
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
margin-bottom:20px;
}

.today{
font-size:40px;
font-weight:900;
text-align:center;
margin:20px 0;
color:#00e676;
}

.tomorrow{
font-size:26px;
font-weight:900;
text-align:center;
margin:20px 0;
color:#64b5f6;
}

.area{
font-size:22px;
text-align:center;
margin-bottom:20px;
}

button{
width:100%;
border:none;
border-radius:22px;
padding:24px;
font-size:24px;
font-weight:900;
color:#fff;
cursor:pointer;
margin-bottom:12px;
}

.home-btn{
background:linear-gradient(135deg,#455a64,#607d8b);
}

.info{
background:rgba(255,255,255,.08);
padding:18px;
border-radius:18px;
line-height:1.8;
font-size:18px;
}

</style>

</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
🚮 今日のゴミ
</div>

<div
id="area"
class="area">
地域確認中...
</div>

<div
id="today"
class="today">
確認中...
</div>

<div
id="tomorrow"
class="tomorrow">
確認中...
</div>

</div>

<div class="card">

<div class="info">

収集日の朝8時までに
ゴミを出してください。

</div>

</div>

<button
class="home-btn"
onclick="history.back()">
🏠 戻る
</button>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

const USER_ID =
new URLSearchParams(
location.search
).get("id") || "";

const week = [
"日",
"月",
"火",
"水",
"木",
"金",
"土"
];

async function loadUser(){

try{

const response =
await fetch(
GAS_URL +
"?action=user&id=" +
encodeURIComponent(USER_ID)
);

const json =
await response.json();

const user =
json.data || {};

const address =
String(
user.address || ""
);

document.getElementById(
"area"
).innerHTML =
address || "住所未登録";

judgeGomi(address);

}catch(error){

document.getElementById(
"today"
).innerHTML =
"取得失敗";

}

}

function judgeGomi(address){

const day =
new Date().getDay();

const tomorrowDay =
(day + 1) % 7;

let todayText = "";
let tomorrowText = "";

if(address.indexOf("志木市") > -1){

if(day===1){
todayText="燃えるゴミ";
}
else if(day===3){
todayText="資源ゴミ";
}
else if(day===5){
todayText="燃えないゴミ";
}
else{
todayText="収集なし";
}

if(tomorrowDay===1){
tomorrowText="明日：燃えるゴミ";
}
else if(tomorrowDay===3){
tomorrowText="明日：資源ゴミ";
}
else if(tomorrowDay===5){
tomorrowText="明日：燃えないゴミ";
}
else{
tomorrowText="明日：収集なし";
}

}

else if(address.indexOf("新座市") > -1){

todayText =
(day===2 || day===5)
? "燃えるゴミ"
: "収集なし";

tomorrowText =
(tomorrowDay===2 || tomorrowDay===5)
? "明日：燃えるゴミ"
: "明日：収集なし";

}

else if(address.indexOf("朝霞市") > -1){

todayText =
(day===1 || day===4)
? "燃えるゴミ"
: "収集なし";

tomorrowText =
(tomorrowDay===1 || tomorrowDay===4)
? "明日：燃えるゴミ"
: "明日：収集なし";

}

else if(address.indexOf("和光市") > -1){

todayText =
(day===2 || day===4)
? "燃えるゴミ"
: "収集なし";

tomorrowText =
(tomorrowDay===2 || tomorrowDay===4)
? "明日：燃えるゴミ"
: "明日：収集なし";

}

else{

todayText =
"地域未設定";

tomorrowText =
"住所登録が必要";

}

document.getElementById(
"today"
).innerHTML =
"🚮 " + todayText;

document.getElementById(
"tomorrow"
).innerHTML =
tomorrowText;

}

loadUser();

</script>

</body>
</html>
