<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ゴミ収集案内</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
padding:15px;
}

.wrap{
max-width:900px;
margin:auto;
}

.header{
background:linear-gradient(
135deg,
#0f172a,
#334155
);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
font-size:36px;
font-weight:900;
margin-bottom:18px;
line-height:1.5;
box-shadow:0 10px 24px rgba(0,0,0,.15);
}

.card{
background:#fff;
border-radius:28px;
padding:22px;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.box{
border-radius:22px;
padding:22px;
margin-bottom:18px;
}

.today{
background:#ecfff5;
border:4px solid #10b981;
}

.tomorrow{
background:#eff6ff;
border:4px solid #3b82f6;
}

.label{
font-size:26px;
font-weight:900;
margin-bottom:12px;
}

.date{
font-size:20px;
font-weight:900;
margin-bottom:12px;
color:#64748b;
}

.type{
font-size:38px;
font-weight:900;
margin-bottom:12px;
}

.msg{
font-size:20px;
line-height:1.8;
}

.nextBox{
background:#fff7ed;
border:4px solid #f97316;
border-radius:22px;
padding:22px;
margin-top:18px;
}

.nextTitle{
font-size:24px;
font-weight:900;
margin-bottom:10px;
}

.nextText{
font-size:28px;
font-weight:900;
}

.btn{
width:100%;
border:none;
border-radius:20px;
padding:20px;
font-size:24px;
font-weight:900;
cursor:pointer;
margin-top:12px;
}

.readBtn{
background:#2563eb;
color:#fff;
}

.backBtn{
background:#475569;
color:#fff;
}

.loading{
font-size:24px;
font-weight:900;
text-align:center;
padding:30px;
}

</style>

</head>

<body>

<div class="wrap">

<div class="header">
🗑️ 今日のゴミ<br>
🗑️ 明日のゴミ
</div>

<div class="card">

<div class="box today">

<div class="label">
🟢 今日
</div>

<div id="todayDate" class="date">
読込中...
</div>

<div id="todayType" class="type">
読込中...
</div>

<div id="todayMsg" class="msg">
読込中...
</div>

</div>

<div class="box tomorrow">

<div class="label">
🔵 明日
</div>

<div id="tomorrowDate" class="date">
読込中...
</div>

<div id="tomorrowType" class="type">
読込中...
</div>

<div id="tomorrowMsg" class="msg">
読込中...
</div>

</div>

<div class="nextBox">

<div class="nextTitle">
📅 次回収集予定
</div>

<div id="nextText" class="nextText">
確認中...
</div>

</div>

<button
class="btn readBtn"
onclick="speakGarbage()">
🔊 音声で読む
</button>

<button
class="btn backBtn"
onclick="history.back()">
🏠 戻る
</button>

</div>

</div>

<script>

const SHEET_ID =
"149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc";

const SHEET_NAME =
"ゴミ";

function cell(row,index){

return row.c[index]
? (row.c[index].v || row.c[index].f || "")
: "";

}

const weekNames =
["日","月","火","水","木","金","土"];

const todayDateObj =
new Date();

const tomorrowDateObj =
new Date();

tomorrowDateObj.setDate(
todayDateObj.getDate()+1
);

document.getElementById(
"todayDate"
).innerHTML =

`${todayDateObj.getFullYear()}年${todayDateObj.getMonth()+1}月${todayDateObj.getDate()}日（${weekNames[todayDateObj.getDay()]}）`;

document.getElementById(
"tomorrowDate"
).innerHTML =

`${tomorrowDateObj.getFullYear()}年${tomorrowDateObj.getMonth()+1}月${tomorrowDateObj.getDate()}日（${weekNames[tomorrowDateObj.getDay()]}）`;

document.getElementById(
"todayType"
).innerHTML =
"可燃ごみ";

document.getElementById(
"todayMsg"
).innerHTML =
"朝8時30分までに出してください";

document.getElementById(
"tomorrowType"
).innerHTML =
"収集なし";

document.getElementById(
"tomorrowMsg"
).innerHTML =
"明日の収集はありません";

document.getElementById(
"nextText"
).innerHTML =
"次回は可燃ごみ";

function speakGarbage(){

const text =

"今日のゴミは" +

document.getElementById(
"todayType"
).innerText +

"です。" +

document.getElementById(
"todayMsg"
).innerText +

"。明日のゴミは" +

document.getElementById(
"tomorrowType"
).innerText +

"です。";

const speech =
new SpeechSynthesisUtterance(
text
);

speech.lang =
"ja-JP";

speech.rate = 1;

speech.pitch = 1;

speechSynthesis.cancel();

speechSynthesis.speak(
speech
);

}

</script>

</body>
</html>
