<script>

const GAS_URL='https://script.google.com/macros/s/AKfycby1NsOe0hOQALNR5Tx2DwwIMS8E-a7nCGa-wZG9vSi8I_DvrnQlKisxhA2ppR8RDehX/exec';

const USER_NAME=
localStorage.getItem("name")||"山口さん";

const USER_CITY=
localStorage.getItem("city")||"志木市";

const USER_AREA=
localStorage.getItem("area")||"";

document.querySelector(".badge").innerHTML=
USER_NAME+" さん";

async function sendData(type,content,level){

const status=
document.getElementById('status');

status.innerHTML='送信中...';

try{

navigator.geolocation.getCurrentPosition(
async function(pos){

const gps=
pos.coords.latitude+
","+pos.coords.longitude;

await fetch(GAS_URL,{
method:'POST',
headers:{
'Content-Type':'text/plain'
},
body:JSON.stringify({
name:USER_NAME,
city:USER_CITY,
area:USER_AREA,
type:type,
content:content,
level:level,
gps:gps,
time:new Date().toLocaleString('ja-JP')
}),
keepalive:true
});

status.innerHTML=
'送信完了<br>'+content;

});

}catch(e){

status.innerHTML='通信エラー';

}

}

</script>
