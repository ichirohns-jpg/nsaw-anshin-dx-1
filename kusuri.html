<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>お薬・元気だよ</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.app-box{
max-width:560px;
margin:0 auto;
padding:18px 14px 34px;
}

.header{
text-align:center;
margin-bottom:16px;
}

.badge{
display:inline-block;
background:#1976d2;
color:#fff;
border-radius:999px;
padding:10px 18px;
font-size:17px;
font-weight:900;
}

.card{
background:#fff;
border-radius:26px;
padding:24px 20px;
box-shadow:0 8px 22px rgba(0,0,0,.10);
margin-bottom:18px;
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
margin:0 0 8px;
color:#1976d2;
}

.lead{
font-size:19px;
font-weight:800;
text-align:center;
line-height:1.6;
color:#555;
margin:0 0 22px;
}

.user-box{
background:#f2f8ff;
border:3px solid #d8eafd;
border-radius:20px;
padding:16px;
font-size:22px;
font-weight:900;
text-align:center;
line-height:1.6;
margin-bottom:18px;
}

.section-title{
font-size:23px;
font-weight:900;
margin:22px 0 14px;
padding-left:10px;
border-left:7px solid #1976d2;
}

.menu-btn{
display:block;
width:100%;
border:none;
border-radius:22px;
padding:24px 18px;
margin-bottom:16px;
font-size:27px;
font-weight:900;
color:#fff;
text-align:left;
cursor:pointer;
box-shadow:0 6px 12px rgba(0,0,0,.13);
}

.btn-green{background:#2eaf66}
.btn-blue{background:#1976d2}
.btn-orange{background:#f39c12}
.btn-red{background:#e53935}

.status{
background:#f7f9fb;
border:3px solid #e1e7ee;
border-radius:20px;
padding:18px;
margin-top:20px;
text-align:center;
font-size:22px;
font-weight:900;
line-height:1.7;
color:#444;
}

.back{
display:block;
margin-top:22px;
text-align:center;
font-size:20px;
font-weight:900;
text-decoration:none;
color:#1976d2;
}
</style>
</head>

<body>

<div class="app-box">

  <div class="header">
    <span class="badge" id="userBadge">利用者ページ</span>
  </div>

  <div class="card">

    <h1 class="title">お薬・元気だよ</h1>
    <p class="lead">
      押すだけで家族ページに反映します。<br>
      緊急時は「助けてください」を押します。
    </p>

    <div class="user-box" id="userBox">
      山口さん<br>志木市
    </div>

    <div class="section-title">今日の状態</div>

    <button class="menu-btn btn-green" onclick="sendData('見守り','😊 元気です','通常')">
      😊 元気です
    </button>

    <button class="menu-btn btn-orange" onclick="sendData('相談','😓 少し困っています','注意')">
      😓 少し困っています
    </button>

    <button class="menu-btn btn-red" onclick="sendData('緊急','🚨 助けてください','緊急')">
      🚨 助けてください
    </button>

    <div class="section-title">お薬</div>

    <button class="menu-btn btn-blue" onclick="sendData('薬','☀ 朝の薬を飲みました','通常')">
      ☀ 朝の薬
    </button>

    <button class="menu-btn btn-blue" onclick="sendData('薬','🌤 昼の薬を飲みました','通常')">
      🌤 昼の薬
    </button>

    <button class="menu-btn btn-blue" onclick="sendData('薬','🌙 夜の薬を飲みました','通常')">
      🌙 夜の薬
    </button>

    <div class="status" id="status">
      本日の状態：未送信
    </div>

    <a href="index.html" class="back">トップへ戻る</a>

  </div>

</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbwC3CPMJlMl5o37qcxIcedcikLuxe6y_ANRjAeFnO9KtPEk9rw-LTu72Dyoq2XJKPET/dev";

const params = new URLSearchParams(location.search);
const urlId = params.get("id");

if(urlId){
  localStorage.setItem("personId", urlId);
}

const PERSON_ID = localStorage.getItem("personId") || urlId || "yamaguchi";
const USER_NAME = localStorage.getItem("name") || "山口さん";
const USER_CITY = localStorage.getItem("city") || "志木市";
const USER_AREA = localStorage.getItem("area") || "";
const USER_TEL = localStorage.getItem("tel") || "";

document.getElementById("userBadge").innerHTML = USER_NAME + " さん";

document.getElementById("userBox").innerHTML =
  USER_NAME + "<br>" +
  USER_CITY + " " + USER_AREA;

function nowText(){
  return new Date().toLocaleString("ja-JP");
}

function saveLocal(type, content, level, gpsText){
  const time = nowText();

  localStorage.setItem("status", content);
  localStorage.setItem("statusType", type);
  localStorage.setItem("statusLevel", level);
  localStorage.setItem("statusTime", time);

  if(gpsText){
    localStorage.setItem("latestGps", gpsText);

    const parts = gpsText.split(",");
    if(parts.length === 2){
      localStorage.setItem("lat", parts[0]);
      localStorage.setItem("lng", parts[1]);
      localStorage.setItem("gpsSavedAt", time);
    }
  }

  if(type === "薬"){
    const oldLog = localStorage.getItem("kusuriLog") || "";
    const newLine = time + "　" + content;
    localStorage.setItem(
      "kusuriLog",
      newLine + (oldLog ? "<br>" + oldLog : "")
    );
  }
}

function sendToGas(type, content, level, gpsText){
  return fetch(
    GAS_URL,
    {
      method:"POST",
      headers:{
        "Content-Type":"text/plain"
      },
      body:JSON.stringify({
        personId:PERSON_ID,
        name:USER_NAME,
        tel:USER_TEL,
        city:USER_CITY,
        area:USER_AREA,
        type:type,
        content:content,
        level:level,
        gps:gpsText || "",
        time:nowText()
      }),
      keepalive:true
    }
  );
}

function sendData(type, content, level){
  const status = document.getElementById("status");
  status.innerHTML = "送信中…<br>" + content;

  const completeLocal = function(gpsText){
    saveLocal(type, content, level, gpsText);

    sendToGas(type, content, level, gpsText)
      .then(function(){
        status.innerHTML =
          "送信完了<br>" +
          content + "<br>" +
          "<span style='font-size:18px;color:#666'>家族ページに反映しました</span>";
      })
      .catch(function(){
        status.innerHTML =
          "スマホ内には保存しました。<br>" +
          content + "<br>" +
          "<span style='font-size:18px;color:#c00'>通信できない場合は、あとで再確認してください。</span>";
      });
  };

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      function(pos){
        const gpsText =
          pos.coords.latitude + "," + pos.coords.longitude;

        completeLocal(gpsText);
      },
      function(){
        const oldLat = localStorage.getItem("lat");
        const oldLng = localStorage.getItem("lng");
        const oldGps = oldLat && oldLng ? oldLat + "," + oldLng : "";
        completeLocal(oldGps);
      },
      {
        enableHighAccuracy:true,
        timeout:10000,
        maximumAge:0
      }
    );
  }else{
    completeLocal("");
  }
}
</script>

</body>
</html>
