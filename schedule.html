<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>今日の予定</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
}

.header{
background:linear-gradient(135deg,#0f766e,#14b8a6);
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:36px;
font-weight:900;
}

.card{
background:#fff;
border-radius:30px;
padding:24px;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.label{
font-size:22px;
font-weight:900;
margin-bottom:8px;
}

.input{
width:100%;
padding:18px;
font-size:22px;
border:2px solid #cbd5e1;
border-radius:18px;
margin-bottom:16px;
}

.btn{
display:block;
width:100%;
padding:24px;
border:none;
border-radius:24px;
font-size:26px;
font-weight:900;
color:#fff;
text-decoration:none;
text-align:center;
margin-bottom:14px;
cursor:pointer;
}

.save{
background:#16a34a;
}

.home{
background:#475569;
}

.result{
background:#f1f5f9;
padding:20px;
border-radius:20px;
font-size:22px;
font-weight:900;
text-align:center;
}

</style>

</head>

<body>

<div class="header">
<h1>📅 今日の予定</h1>
</div>

<div class="card">

<div class="label">病院</div>
<input id="hospital" class="input">

<div class="label">買い物</div>
<input id="shopping" class="input">

<div class="label">デイサービス</div>
<input id="dayservice" class="input">

<div class="label">メモ</div>
<input id="memo" class="input">

<button
class="btn save"
onclick="saveSchedule()">
保存する
</button>

</div>

<div class="card">

<div
id="result"
class="result">
予定未登録
</div>

</div>

<a
href="index.html"
class="btn home">
🏠 トップへ戻る
</a>

<script>

function saveSchedule(){

const text =
'病院：' +
document.getElementById('hospital').value +
'<br><br>買い物：' +
document.getElementById('shopping').value +
'<br><br>デイサービス：' +
document.getElementById('dayservice').value +
'<br><br>メモ：' +
document.getElementById('memo').value;

document.getElementById('result').innerHTML =
text;

}

</script>

</body>
</html>
