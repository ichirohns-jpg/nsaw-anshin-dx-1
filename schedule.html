<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>予定一覧</title>

<link rel="icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
background:linear-gradient(180deg,#000000 0%,#08111d 50%,#000000 100%);
color:#fff;
min-height:100vh;
}

.wrap{
max-width:760px;
margin:auto;
padding:16px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:20px;
margin-bottom:16px;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
margin-bottom:20px;
}

.name{
font-size:26px;
font-weight:900;
text-align:center;
margin-bottom:10px;
}

.section{
font-size:20px;
font-weight:900;
margin-bottom:10px;
color:#00d4ff;
}

.item{
background:rgba(255,255,255,.08);
border-radius:18px;
padding:14px;
margin-bottom:10px;
}

.time{
font-size:14px;
opacity:.7;
margin-bottom:5px;
}

.text{
font-size:18px;
line-height:1.6;
}

button{
width:100%;
border:none;
cursor:pointer;
color:#fff;
font-weight:900;
padding:20px;
border-radius:20px;
font-size:22px;
margin-bottom:12px;
}

.add-btn{
background:linear-gradient(135deg,#00a3c4,#00d4ff);
}

.home-btn{
background:linear-gradient(135deg,#37474f,#607d8b);
}

</style>

</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
📅 予定一覧
</div>

<div
id="userName"
class="name">
読み込み中...
</div>

</div>

<div class="card">

<div class="section">
📌 予定
</div>

<div id="scheduleArea">
読み込み中...
</div>

</div>

<div class="card">

<button
class="add-btn"
onclick="location.href='schedule-edit.html?id='+USER_ID">
📝 予定登録
</button>

<button
class="home-btn"
onclick="location.href='app.html?id='+USER_ID">
😊 本人ページ
</button>

<button
class="home-btn"
onclick="location.href='index.html'">
🏠 ホームへ戻る
</button>

</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

const params =
new URLSearchParams(location.search);

const USER_ID =
params.get("id") || "";

async function loadUser(){

try{

const response =
await fetch(
GAS_URL +
"?action=user&id=" +
encodeURIComponent(USER_ID)
);

const json =
await response.json();

document.getElementById("userName").innerHTML =
(json.data || {}).name || "利用者";

}catch(error){

document.getElementById("userName").innerHTML =
"利用者";

}

}

async function loadSchedule(){

try{

const response =
await fetch(
GAS_URL +
"?action=dashboard&id=" +
encodeURIComponent(USER_ID)
);

const json =
await response.json();

const history =
json.history || [];

let html = "";

history.forEach(item=>{

if(item.status !== "予定"){
return;
}

html += `
<div class="item">

<div class="time">
${item.time || ""}
</div>

<div class="text">
${item.memo || ""}
</div>

</div>
`;

});

document.getElementById("scheduleArea").innerHTML =
html || "予定はありません";

}catch(error){

document.getElementById("scheduleArea").innerHTML =
"取得エラー";

}

}

loadUser();
loadSchedule();

</script>

</body>
</html>
