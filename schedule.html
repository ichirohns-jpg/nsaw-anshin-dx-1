<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>予定一覧｜見守りDX</title>

<link rel="icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
background:linear-gradient(180deg,#000000 0%,#08111d 50%,#000000 100%);
color:#ffffff;
min-height:100vh;
}

.wrap{
max-width:900px;
margin:auto;
padding:16px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:20px;
margin-bottom:16px;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
margin-bottom:10px;
}

.name{
font-size:24px;
font-weight:900;
text-align:center;
margin-bottom:20px;
}

.schedule{
background:rgba(255,255,255,.08);
border-radius:20px;
padding:16px;
margin-bottom:12px;
}

.date{
font-size:18px;
font-weight:900;
color:#00d4ff;
margin-bottom:6px;
}

.text{
font-size:18px;
font-weight:900;
margin-bottom:6px;
}

.memo{
opacity:.8;
line-height:1.6;
}

button{
width:100%;
border:none;
cursor:pointer;
color:#fff;
font-weight:900;
padding:18px;
border-radius:18px;
font-size:18px;
margin-bottom:10px;
}

.add-btn{
background:linear-gradient(135deg,#00a3c4,#00d4ff);
}

.home-btn{
background:linear-gradient(135deg,#455a64,#607d8b);
}

.footer{
text-align:center;
padding:20px;
opacity:.6;
font-size:12px;
}

</style>

</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
📅 予定一覧
</div>

<div
id="userName"
class="name">
読み込み中...
</div>

<div id="scheduleArea">

<div class="schedule">
予定を読み込み中...
</div>

</div>

</div>

<div class="card">

<button
class="add-btn"
onclick="location.href='schedule-edit.html?id='+USER_ID">
📝 予定登録
</button>

<button
class="home-btn"
onclick="location.href='app.html?id='+USER_ID">
😊 本人ページ
</button>

<button
class="home-btn"
onclick="location.href='index.html'">
🏠 ホームへ戻る
</button>

</div>

<div class="footer">
NSAW 予定管理
</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

const params =
new URLSearchParams(location.search);

const USER_ID =
params.get("id") || "";

async function loadSchedule(){

try{

const response =
await fetch(
GAS_URL +
"?action=schedules&id=" +
encodeURIComponent(USER_ID)
);

const json =
await response.json();

const user =
json.user || {};

const schedules =
json.data || [];

document.getElementById("userName").innerHTML =
user.name || "利用者";

let html = "";

schedules.forEach(item=>{

html += `
<div class="schedule">

<div class="date">
${item.date || ""}
 ${item.time || ""}
</div>

<div class="text">
${item.title || ""}
</div>

<div class="memo">
${item.memo || ""}
</div>

</div>
`;

});

document.getElementById("scheduleArea").innerHTML =
html || `
<div class="schedule">
予定はありません
</div>
`;

}catch(error){

document.getElementById("scheduleArea").innerHTML =
`
<div class="schedule">
取得エラー
</div>
`;

}

}

loadSchedule();

</script>

</body>
</html>
