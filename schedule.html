<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>予定管理</title>

<link rel="icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
background:linear-gradient(180deg,#000000 0%,#08111d 50%,#000000 100%);
color:#fff;
min-height:100vh;
}

.wrap{
max-width:800px;
margin:auto;
padding:16px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:20px;
margin-bottom:16px;
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
margin-bottom:20px;
}

input,
select,
textarea{
width:100%;
padding:18px;
border:none;
border-radius:18px;
margin-bottom:12px;
font-size:18px;
background:rgba(255,255,255,.1);
color:#fff;
}

option{
color:#000;
}

textarea{
height:100px;
}

button{
width:100%;
border:none;
border-radius:22px;
padding:24px;
font-size:24px;
font-weight:900;
color:#fff;
cursor:pointer;
margin-bottom:12px;
}

.save-btn{
background:linear-gradient(135deg,#00c853,#00e676);
}

.home-btn{
background:linear-gradient(135deg,#455a64,#607d8b);
}

.item{
background:rgba(255,255,255,.08);
padding:15px;
border-radius:18px;
margin-bottom:10px;
}

</style>

</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
📅 予定管理
</div>

<input
type="date"
id="date">

<input
type="time"
id="time">

<select id="title">

<option value="">
予定を選択
</option>

<option>
病院
</option>

<option>
デイサービス
</option>

<option>
買い物
</option>

<option>
散歩
</option>

<option>
食事会
</option>

<option>
その他
</option>

</select>

<input
id="place"
placeholder="場所">

<textarea
id="memo"
placeholder="メモ"></textarea>

<button
class="save-btn"
onclick="saveSchedule()">
💾 予定登録
</button>

<button
class="home-btn"
onclick="history.back()">
🏠 戻る
</button>

</div>

<div class="card">

<div id="scheduleArea">
読み込み中...
</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

const USER_ID =
new URLSearchParams(
location.search
).get("id") || "";

async function saveSchedule(){

try{

const body =
new URLSearchParams();

body.append(
"action",
"scheduleAdd"
);

body.append(
"id",
USER_ID
);

body.append(
"date",
document.getElementById(
"date"
).value
);

body.append(
"time",
document.getElementById(
"time"
).value
);

body.append(
"title",
document.getElementById(
"title"
).value
);

body.append(
"place",
document.getElementById(
"place"
).value
);

body.append(
"memo",
document.getElementById(
"memo"
).value
);

const response =
await fetch(
GAS_URL,
{
method:"POST",
headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},
body:body.toString()
}
);

const json =
await response.json();

if(json.status==="OK"){

alert(
"予定を登録しました"
);

loadSchedules();

}

}catch(error){

alert(
"登録失敗"
);

}

}

async function loadSchedules(){

try{

const response =
await fetch(
GAS_URL +
"?action=scheduleList&id=" +
encodeURIComponent(USER_ID)
);

const json =
await response.json();

const data =
json.data || [];

let html = "";

data.forEach(item=>{

html += `
<div class="item">

<div style="
font-size:20px;
font-weight:900;
margin-bottom:5px;
">
📅 ${item.title || ""}
</div>

<div>
🕒 ${item.date || ""} ${item.time || ""}
</div>

<div>
📍 ${item.place || ""}
</div>

<div>
📝 ${item.memo || ""}
</div>

</div>
`;

});

document.getElementById(
"scheduleArea"
).innerHTML =
html ||
"予定はありません";

}catch(error){

document.getElementById(
"scheduleArea"
).innerHTML =
"取得失敗";

}

}

loadSchedules();

</script>

</body>
</html>
