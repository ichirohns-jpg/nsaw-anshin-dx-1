<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>予定案内</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
}

.header{
background:linear-gradient(135deg,#f59e0b,#d97706);
color:#fff;
padding:30px;
border-radius:32px;
text-align:center;
margin-bottom:20px;
}

.header h1{
font-size:42px;
font-weight:900;
}

.card{
background:#fff;
border-radius:28px;
padding:22px;
margin-bottom:18px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.title{
font-size:32px;
font-weight:900;
margin-bottom:16px;
}

.input{
width:100%;
padding:20px;
font-size:24px;
border-radius:18px;
border:2px solid #d1d5db;
margin-bottom:14px;
}

.textarea{
width:100%;
height:140px;
padding:20px;
font-size:24px;
border-radius:18px;
border:2px solid #d1d5db;
margin-bottom:14px;
resize:none;
}

.btn{
width:100%;
padding:24px;
border:none;
border-radius:22px;
font-size:28px;
font-weight:900;
color:#fff;
cursor:pointer;
}

.orange{
background:#ea580c;
}

.blue{
background:#2563eb;
}

.scheduleBox{
background:#f8fafc;
border-radius:22px;
padding:20px;
margin-top:12px;
font-size:24px;
line-height:1.8;
}

.home{
display:block;
text-align:center;
background:#475569;
color:#fff;
text-decoration:none;
padding:22px;
border-radius:24px;
font-size:26px;
font-weight:900;
margin-top:20px;
}

</style>

</head>

<body>

<div class="header">
<h1>📅 予定案内</h1>
</div>

<div class="card">

<div class="title">
予定登録
</div>

<input
id="scheduleDate"
type="date"
class="input">

<input
id="scheduleTime"
type="time"
class="input">

<input
id="scheduleTitle"
type="text"
class="input"
placeholder="歯医者・病院・買い物">

<input
id="schedulePlace"
type="text"
class="input"
placeholder="場所">

<textarea
id="scheduleMemo"
class="textarea"
placeholder="メモ"></textarea>

<button
class="btn orange"
onclick="saveSchedule()">
📅 予定を登録
</button>

</div>

<div class="card">

<div class="title">
今日の予定
</div>

<div
id="todaySchedule"
class="scheduleBox">
読込中...
</div>

</div>

<div class="card">

<div class="title">
明日の予定
</div>

<div
id="tomorrowSchedule"
class="scheduleBox">
読込中...
</div>

</div>

<button
class="btn blue"
onclick="speakSchedule()">
🔊 読み上げ
</button>

<a
href="index.html"
class="home">
🏠 トップへ戻る
</a>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec';

function saveSchedule(){

const date =
document.getElementById('scheduleDate').value;

const time =
document.getElementById('scheduleTime').value;

const title =
document.getElementById('scheduleTitle').value;

const place =
document.getElementById('schedulePlace').value;

const memo =
document.getElementById('scheduleMemo').value;

if(!date || !time || !title){

alert('日付・時間・予定内容を入力してください');

return;

}

const params =
new URLSearchParams();

params.append(
'action',
'scheduleAdd'
);

params.append(
'id',
localStorage.getItem('userId') || ''
);

params.append(
'name',
localStorage.getItem('userName') || ''
);

params.append(
'date',
date
);

params.append(
'time',
time
);

params.append(
'title',
title
);

params.append(
'place',
place
);

params.append(
'memo',
memo
);

fetch(
GAS_URL,
{
method:'POST',
body:params
}
)
.then(r=>r.json())
.then(data=>{

if(data.status==='OK'){

alert('予定を登録しました');

loadSchedules();

document.getElementById(
'scheduleTitle'
).value='';

document.getElementById(
'schedulePlace'
).value='';

document.getElementById(
'scheduleMemo'
).value='';

}else{

alert('登録失敗');

}

})
.catch(()=>{

alert('通信エラー');

});

}

function loadSchedules(){

const id =
localStorage.getItem('userId') || '';

fetch(
GAS_URL +
'?action=scheduleList&id=' +
encodeURIComponent(id)
)

.then(r=>r.json())

.then(res=>{

if(
!res.data ||
!res.data.length
){

document.getElementById(
'todaySchedule'
).innerHTML =
'予定はありません';

document.getElementById(
'tomorrowSchedule'
).innerHTML =
'予定はありません';

return;

}

const today =
new Date()
.toISOString()
.split('T')[0];

const tomorrowObj =
new Date();

tomorrowObj.setDate(
tomorrowObj.getDate()+1
);

const tomorrow =
tomorrowObj
.toISOString()
.split('T')[0];

let todayHtml='';
let tomorrowHtml='';

res.data.forEach(item=>{

const html =

'📅 ' +
(item.time || '') +

'<br>' +

(item.title || '') +

'<br>' +

(item.place || '') +

'<br><br>';

if(item.date===today){

todayHtml += html;

}

if(item.date===tomorrow){

tomorrowHtml += html;

}

});

document.getElementById(
'todaySchedule'
).innerHTML =
todayHtml || '予定はありません';

document.getElementById(
'tomorrowSchedule'
).innerHTML =
tomorrowHtml || '予定はありません';

});

}

function speakSchedule(){

const speech =
new SpeechSynthesisUtterance(

'今日の予定。' +

document.getElementById(
'todaySchedule'
).innerText +

'。明日の予定。' +

document.getElementById(
'tomorrowSchedule'
).innerText

);

speech.lang='ja-JP';

speechSynthesis.speak(
speech
);

}

window.onload =
loadSchedules;

</script>

</body>
</html>
