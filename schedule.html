<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>今日の予定｜見守りDX</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:560px;
margin:auto;
padding:16px;
}

.header{
background:#1976d2;
color:#fff;
border-radius:26px;
padding:22px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.back{
font-size:16px;
font-weight:900;
margin-bottom:12px;
cursor:pointer;
}

.title{
font-size:34px;
font-weight:900;
}

.sub{
font-size:16px;
margin-top:6px;
opacity:.95;
}

.card{
background:#fff;
border-radius:26px;
padding:20px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.day{
font-size:20px;
font-weight:900;
color:#1976d2;
margin-bottom:14px;
}

.item{
border-left:8px solid #1976d2;
background:#f7fbff;
border-radius:18px;
padding:16px;
margin-bottom:14px;
}

.time{
font-size:22px;
font-weight:900;
color:#1976d2;
}

.text{
font-size:22px;
font-weight:900;
margin-top:6px;
}

.memo{
font-size:16px;
font-weight:700;
color:#666;
margin-top:6px;
line-height:1.6;
}

.doneBtn{
width:100%;
border:none;
border-radius:18px;
padding:16px;
font-size:22px;
font-weight:900;
color:#fff;
background:#43a047;
margin-top:12px;
cursor:pointer;
}

.doneBtn:active{
transform:scale(.97);
}

.footer{
display:flex;
justify-content:space-around;
margin-top:20px;
padding:18px 0;
background:#fff;
border-radius:22px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
font-size:14px;
font-weight:900;
color:#666;
}

.toast{
position:fixed;
left:50%;
bottom:30px;
transform:translateX(-50%);
background:#1976d2;
color:#fff;
padding:16px 24px;
border-radius:18px;
font-size:18px;
font-weight:900;
display:none;
z-index:9999;
box-shadow:0 6px 18px rgba(0,0,0,.2);
}

</style>
</head>

<body>

<div class="wrap">

<div class="header">

<div class="back" onclick="location.href='index.html'">
← トップへ戻る
</div>

<div class="title">
📅 今日の予定
</div>

<div class="sub">
病院・薬・訪問予定を確認します
</div>

</div>

<div class="card">

<div class="day">
今日の予定
</div>

<div class="item">

<div class="time">
09:00
</div>

<div class="text">
朝の薬
</div>

<div class="memo">
飲み終わったら確認ボタンを押してください
</div>

<button class="doneBtn" onclick="done('朝の薬を確認しました')">
✅ 確認しました
</button>

</div>

<div class="item">

<div class="time">
14:00
</div>

<div class="text">
訪問予定
</div>

<div class="memo">
支援者が訪問確認を行います
</div>

<button class="doneBtn" onclick="done('訪問予定を確認しました')">
✅ 確認しました
</button>

</div>

<div class="item">

<div class="time">
18:00
</div>

<div class="text">
夜の薬
</div>

<div class="memo">
夜の薬を忘れずに確認してください
</div>

<button class="doneBtn" onclick="done('夜の薬を確認しました')">
✅ 確認しました
</button>

</div>

</div>

<div class="footer">

<div onclick="location.href='index.html'">
見守り
</div>

<div>
予定
</div>

<div>
地域情報
</div>

<div>
設定
</div>

</div>

</div>

<div id="toast" class="toast"></div>

<script>

function done(text){

const toast=document.getElementById("toast");

toast.innerText=text;

toast.style.display="block";

setTimeout(function(){
toast.style.display="none";
},2000);

}

</script>

</body>
</html>
