<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>カレンダー予定</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
}

.header{
background:linear-gradient(135deg,#ea580c,#fb923c);
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:#fff;
padding:24px;
border-radius:24px;
margin-bottom:16px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.title{
font-size:24px;
font-weight:900;
margin-bottom:12px;
}

.input{
width:100%;
padding:18px;
font-size:22px;
border:2px solid #cbd5e1;
border-radius:18px;
margin-bottom:14px;
}

.btn{
display:block;
width:100%;
padding:24px;
border:none;
border-radius:24px;
font-size:26px;
font-weight:900;
cursor:pointer;
color:#fff;
margin-bottom:12px;
}

.orange{
background:#ea580c;
}

.blue{
background:#2563eb;
}

.green{
background:#16a34a;
}

.gray{
background:#475569;
}

.item{
background:#f8fafc;
padding:16px;
border-radius:16px;
margin-bottom:10px;
font-size:20px;
font-weight:900;
line-height:1.8;
}

</style>
</head>

<body>

<div class="header">
<h1>📅 カレンダー予定</h1>
</div>

<div class="card">

<div class="title">
予定登録
</div>

<input
id="date"
class="input"
type="date">

<input
id="time"
class="input"
type="time">

<input
id="title"
class="input"
placeholder="病院・買い物・薬局など">

<button
class="btn orange"
onclick="saveSchedule()">

📅 保存する

</button>

<button
class="btn blue"
onclick="startVoice()">

🎤 音声で予定入力

</button>

<button
class="btn green"
onclick="readSchedule()">

🔊 予定を聞く

</button>

</div>

<div class="card">

<div class="title">
今日・明日・今後の予定
</div>

<div id="scheduleList">

予定なし

</div>

</div>

<a
href="index.html"
class="btn gray">

🏠 トップへ戻る

</a>

<script>

function saveSchedule(){

const schedules =
JSON.parse(
localStorage.getItem(
'schedules'
) || '[]'
);

const item = {

date:
document.getElementById(
'date'
).value,

time:
document.getElementById(
'time'
).value,

title:
document.getElementById(
'title'
).value

};

if(!item.date || !item.title){

alert(
'日付と予定を入力してください'
);

return;

}

schedules.push(item);

schedules.sort((a,b)=>
(a.date+a.time).localeCompare(
b.date+b.time
)
);

localStorage.setItem(
'schedules',
JSON.stringify(
schedules
)
);

loadSchedules();

}

function loadSchedules(){

const schedules =
JSON.parse(
localStorage.getItem(
'schedules'
) || '[]'
);

if(!schedules.length){

document.getElementById(
'scheduleList'
).innerHTML =
'予定なし';

return;

}

let html='';

schedules.forEach(item=>{

html +=

'<div class="item">' +

'📅 ' +
item.date +

'<br>' +

'🕒 ' +
(item.time || '') +

'<br>' +

'📍 ' +
item.title +

'</div>';

});

document.getElementById(
'scheduleList'
).innerHTML =
html;

}

function startVoice(){

if(!('webkitSpeechRecognition' in window)){

alert(
'音声入力に対応していません'
);

return;

}

const rec =
new webkitSpeechRecognition();

rec.lang='ja-JP';

rec.start();

rec.onresult=function(e){

const text =
e.results[0][0].transcript;

document.getElementById(
'title'
).value =
text;

};

}

function readSchedule(){

const schedules =
JSON.parse(
localStorage.getItem(
'schedules'
) || '[]'
);

let text =
'予定はありません';

if(schedules.length){

text =
'予定をお知らせします。';

schedules.forEach(item=>{

text +=

item.date +

' ' +

(item.time || '') +

' ' +

item.title +

'。';

});

}

speechSynthesis.speak(
new SpeechSynthesisUtterance(
text
)
);

}

loadSchedules();

</script>

</body>
</html>
