<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>今日の予定</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
}

.header{
background:linear-gradient(135deg,#ea580c,#fb923c);
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:36px;
font-weight:900;
}

.card{
background:#fff;
padding:24px;
border-radius:24px;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.label{
font-size:22px;
font-weight:900;
margin-bottom:8px;
}

.input{
width:100%;
padding:18px;
font-size:22px;
border:2px solid #cbd5e1;
border-radius:18px;
margin-bottom:16px;
}

.btn{
display:block;
width:100%;
padding:24px;
border:none;
border-radius:24px;
font-size:28px;
font-weight:900;
cursor:pointer;
margin-bottom:14px;
color:#fff;
}

.orange{
background:#ea580c;
}

.gray{
background:#475569;
}

.result{
background:#f8fafc;
padding:20px;
border-radius:20px;
font-size:22px;
font-weight:900;
line-height:1.8;
}

</style>

</head>

<body>

<div class="header">
<h1>📅 今日の予定</h1>
</div>

<div class="card">

<div class="label">
🏥 病院
</div>

<input
id="hospital"
class="input"
placeholder="病院名">

<div class="label">
🕒 病院時間
</div>

<input
id="hospitalTime"
class="input"
type="time">

<div class="label">
🛒 買い物
</div>

<input
id="shopping"
class="input"
placeholder="買い物内容">

<div class="label">
🕒 買い物時間
</div>

<input
id="shoppingTime"
class="input"
type="time">

<div class="label">
🚌 デイサービス
</div>

<input
id="dayservice"
class="input"
placeholder="デイサービス">

<div class="label">
🕒 デイサービス時間
</div>

<input
id="dayserviceTime"
class="input"
type="time">

<div class="label">
💊 服薬
</div>

<input
id="medicineTime"
class="input"
placeholder="朝・昼・夕・寝る前">

<div class="label">
📝 メモ
</div>

<input
id="memo"
class="input"
placeholder="自由入力">

<button
class="btn orange"
onclick="saveSchedule()">
保存する
</button>

</div>

<div
id="result"
class="result">

予定未登録

</div>

<a
href="app.html"
class="btn gray">
🏠 本人ページへ戻る
</a>

<script>

function saveSchedule(){

const data = {

hospital:
document.getElementById('hospital').value,

hospitalTime:
document.getElementById('hospitalTime').value,

shopping:
document.getElementById('shopping').value,

shoppingTime:
document.getElementById('shoppingTime').value,

dayservice:
document.getElementById('dayservice').value,

dayserviceTime:
document.getElementById('dayserviceTime').value,

medicineTime:
document.getElementById('medicineTime').value,

memo:
document.getElementById('memo').value

};

localStorage.setItem(
'scheduleData',
JSON.stringify(data)
);

document.getElementById(
'result'
).innerHTML =

'🏥 ' + data.hospital +
'<br>' +
'🛒 ' + data.shopping +
'<br>' +
'🚌 ' + data.dayservice +
'<br>' +
'💊 ' + data.medicineTime;

}

</script>

</body>
</html>
