<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>今日の予定</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#eef3f8;
font-family:
"Hiragino Sans",
"Yu Gothic",
sans-serif;
}

.wrap{
max-width:760px;
margin:auto;
padding:18px;
}

.bigBtn{

width:100%;

background:white;

border:none;

border-radius:34px;

padding:38px 24px;

margin-bottom:22px;

font-size:42px;

font-weight:900;

line-height:1.3;

text-align:center;

color:#00897b;

box-shadow:
0 8px 20px rgba(0,0,0,.08);

position:relative;

}

.bigBtn::before{

content:'';

position:absolute;

left:0;
top:0;
bottom:0;

width:18px;

background:#00897b;

border-top-left-radius:34px;
border-bottom-left-radius:34px;

}

.card{

background:white;

border-radius:30px;

padding:24px;

margin-bottom:22px;

box-shadow:
0 8px 20px rgba(0,0,0,.08);

}

.date{

font-size:24px;

font-weight:900;

color:#666;

margin-bottom:8px;

}

.time{

font-size:44px;

font-weight:900;

color:#00897b;

margin-bottom:8px;

}

.title{

font-size:34px;

font-weight:900;

line-height:1.4;

}

.smallBtn{

width:100%;

background:#e53935;

border:none;

border-radius:22px;

padding:18px;

margin-top:18px;

font-size:26px;

font-weight:900;

color:white;

}

.backBtn{

width:100%;

background:#546e7a;

border:none;

border-radius:34px;

padding:34px;

margin-top:10px;

font-size:38px;

font-weight:900;

color:white;

}

.empty{

background:white;

border-radius:30px;

padding:34px;

font-size:34px;

font-weight:900;

text-align:center;

color:#7d8b99;

box-shadow:
0 8px 20px rgba(0,0,0,.08);

}

</style>
</head>

<body>

<div class="wrap">

<button
class="bigBtn"
onclick="addSchedule()">

＋ 予定を追加

</button>

<div id="scheduleList"></div>

<button
class="backBtn"
onclick="location.href='garbage.html'">

戻る

</button>

</div>

<script>

function renderSchedule(){

let list =
JSON.parse(
localStorage.getItem(
'todayScheduleList'
) || '[]'
);

const box =
document.getElementById(
'scheduleList'
);

if(list.length===0){

box.innerHTML=`

<div class="empty">

予定はありません

</div>

`;

return;

}

box.innerHTML='';

list.forEach((item,index)=>{

box.innerHTML += `

<div class="card">

<div class="date">

${item.date}

</div>

<div class="time">

${item.time}

</div>

<div class="title">

${item.title}

</div>

<button
class="smallBtn"
onclick="deleteSchedule(${index})">

削除

</button>

</div>

`;

});

}

function addSchedule(){

const date =
prompt(
'日付\n例：2026/05/30'
);

if(!date)return;

const time =
prompt(
'時間\n例：15:00'
);

if(!time)return;

const title =
prompt(
'予定\n例：病院'
);

if(!title)return;

let list =
JSON.parse(
localStorage.getItem(
'todayScheduleList'
) || '[]'
);

list.push({

date:date,
time:time,
title:title

});

localStorage.setItem(
'todayScheduleList',
JSON.stringify(list)
);

renderSchedule();

}

function deleteSchedule(index){

let list =
JSON.parse(
localStorage.getItem(
'todayScheduleList'
) || '[]'
);

list.splice(index,1);

localStorage.setItem(
'todayScheduleList',
JSON.stringify(list)
);

renderSchedule();

}

window.onload=function(){

renderSchedule();

};

</script>

</body>
</html>
