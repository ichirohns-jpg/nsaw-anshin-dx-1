<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>予定案内</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
}

.header{
background:linear-gradient(
135deg,
#0f172a,
#1e293b,
#334155
);
color:#fff;
padding:30px;
border-radius:32px;
text-align:center;
margin-bottom:20px;
}

.header h1{
font-size:42px;
font-weight:900;
}

.card{
background:#fff;
border-radius:28px;
padding:22px;
margin-bottom:18px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.title{
font-size:32px;
font-weight:900;
margin-bottom:16px;
}

.input{
width:100%;
padding:20px;
font-size:24px;
border-radius:18px;
border:2px solid #d1d5db;
margin-bottom:14px;
}

.textarea{
width:100%;
height:120px;
padding:20px;
font-size:24px;
border-radius:18px;
border:2px solid #d1d5db;
margin-bottom:14px;
resize:none;
}

.btn{
width:100%;
padding:24px;
border:none;
border-radius:22px;
font-size:28px;
font-weight:900;
color:#fff;
cursor:pointer;
}

.orange{
background:#ea580c;
}

.scheduleBox{
background:#f8fafc;
border-radius:22px;
padding:20px;
margin-top:12px;
font-size:24px;
line-height:1.8;
}

.home{
display:block;
text-align:center;
background:#475569;
color:#fff;
text-decoration:none;
padding:22px;
border-radius:24px;
font-size:26px;
font-weight:900;
margin-top:20px;
}

.guide{
background:#fff7ed;
padding:18px;
border-radius:18px;
font-size:22px;
font-weight:900;
line-height:1.8;
margin-bottom:18px;
}

</style>

</head>

<body>

<div class="header">
<h1>📅 予定案内</h1>
</div>

<div class="card">

<div class="title">
予定登録
</div>

<div class="guide">

入力例<br>
📅 6月25日<br>
🏥 歯医者<br>
📝 保険証持参

</div>

<input
id="scheduleDate"
type="date"
class="input">

<input
id="scheduleTitle"
type="text"
class="input"
placeholder="歯医者・病院・買い物">

<textarea
id="scheduleMemo"
class="textarea"
placeholder="保険証持参・送迎あり"></textarea>

<button
class="btn orange"
onclick="saveSchedule()">

📅 予定を登録

</button>

</div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbxH23_zris78LFP_5d0lXJe7gFwbVESIX5uNT0eGEKIPWgf71m-bM1CFX64fBu-wBmk/exec';

function saveSchedule(){

const date =
document.getElementById(
'scheduleDate'
).value;

const title =
document.getElementById(
'scheduleTitle'
).value;

const memo =
document.getElementById(
'scheduleMemo'
).value;

if(!date || !title){

alert(
'予定日と予定内容を入力してください'
);

return;

}

const userId =
localStorage.getItem(
'userId'
) ||
new URLSearchParams(location.search).get('id') ||
'';

const form =
new FormData();

form.append(
'action',
'scheduleAdd'
);

form.append(
'id',
userId
);

form.append(
'name',
localStorage.getItem(
'userName'
) || ''
);

form.append(
'date',
date
);

form.append(
'time',
''
);

form.append(
'title',
title
);

form.append(
'place',
''
);

form.append(
'memo',
memo
);

fetch(
GAS_URL,
{
method:'POST',
body:form
}
)

.then(r=>r.text())

.then(()=>{

alert(
'予定を登録しました'
);

loadSchedules();

})

.catch(()=>{

alert(
'登録失敗'
);

});

}

function loadSchedules(){

const userId =
localStorage.getItem(
'userId'
) ||
new URLSearchParams(location.search).get('id') ||
'';

fetch(
GAS_URL +
'?action=scheduleList&id=' +
encodeURIComponent(userId)
)

.then(r=>r.json())

.then(data=>{

let html='';

if(
!data.data ||
!data.data.length
){

html =
'予定はありません';

}else{

data.data.forEach(item=>{

html +=

'📅 ' +
(item.date || '') +

'<br>' +

'🏥 ' +
(item.title || '') +

'<br>' +

(item.memo || '') +

'<br><br>';

});

}

document.getElementById(
'todaySchedule'
).innerHTML =
html;

document.getElementById(
'tomorrowSchedule'
).innerHTML =
html;

})

.catch(()=>{

document.getElementById(
'todaySchedule'
).innerHTML =
'取得失敗';

document.getElementById(
'tomorrowSchedule'
).innerHTML =
'取得失敗';

});

}

window.onload =
loadSchedules;

</script>

<div class="card">

<div class="title">
登録済み予定
</div>

<div
id="todaySchedule"
class="scheduleBox">

読込中...

</div>

</div>

<div class="card">

<div class="title">
支援者も同じ予定を確認できます
</div>

<div
id="tomorrowSchedule"
class="scheduleBox">

読込中...

</div>

</div>

<a
href="index.html"
class="home">

🏠 トップへ戻る

</a>

</body>
</html>
