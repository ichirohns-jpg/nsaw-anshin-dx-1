<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>予定管理</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
background:#101827;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
color:#fff;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
padding:28px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
box-shadow:0 12px 30px rgba(0,0,0,.35);
}

.header h1{
font-size:34px;
font-weight:900;
}

.header p{
margin-top:8px;
font-size:16px;
color:#cbd5e1;
font-weight:700;
}

.card{
background:linear-gradient(135deg,#1e293b,#0f172a);
padding:24px;
border-radius:28px;
margin-bottom:18px;
box-shadow:0 12px 30px rgba(0,0,0,.35);
}

.label{
font-size:22px;
font-weight:900;
margin-bottom:8px;
}

.input{
width:100%;
padding:18px;
font-size:22px;
border:none;
border-radius:18px;
margin-bottom:16px;
}

.btn{
display:block;
width:100%;
padding:26px;
border:none;
border-radius:24px;
font-size:28px;
font-weight:900;
cursor:pointer;
margin-bottom:12px;
color:#fff;
}

.orange{
background:linear-gradient(135deg,#ea580c,#fb923c);
}

.gray{
background:linear-gradient(135deg,#475569,#334155);
text-decoration:none;
text-align:center;
}

.green{
background:linear-gradient(135deg,#16a34a,#22c55e);
}

.result{
background:#fff;
color:#111827;
padding:22px;
border-radius:22px;
font-size:22px;
font-weight:900;
line-height:1.8;
}

.item{
padding:14px;
margin-bottom:10px;
border-radius:18px;
background:#f8fafc;
}

.time{
color:#ea580c;
font-size:20px;
font-weight:900;
}

.title{
font-size:22px;
font-weight:900;
}

.memo{
font-size:18px;
color:#475569;
margin-top:4px;
}

</style>
</head>

<body>

<div class="header">
<h1>📅 予定管理</h1>
<p>予定を登録します</p>
</div>

<div class="card">

<div class="label">
📅 日付
</div>

<input
id="scheduleDate"
class="input"
type="date">

<div class="label">
🕒 時間
</div>

<input
id="scheduleTime"
class="input"
type="time">

<div class="label">
📝 予定
</div>

<input
id="scheduleTitle"
class="input"
placeholder="病院・買い物・来客など">

<div class="label">
📋 メモ
</div>

<input
id="scheduleMemo"
class="input"
placeholder="補足内容">

<button
class="btn orange"
onclick="saveSchedule()">

保存する

</button>

</div>

<div class="card">

<div class="label">
📅 登録済み予定
</div>

<div
id="result"
class="result">

予定未登録

</div>

</div>

<a
href="app.html"
class="btn gray">

🏠 本人ページへ戻る

</a>

<script>

let schedules =
JSON.parse(
localStorage.getItem(
'schedules'
) || '[]'
);

showSchedules();

function saveSchedule(){

const date =
document.getElementById(
'scheduleDate'
).value;

const time =
document.getElementById(
'scheduleTime'
).value;

const title =
document.getElementById(
'scheduleTitle'
).value;

const memo =
document.getElementById(
'scheduleMemo'
).value;

if(
!date ||
!title
){
alert(
'日付と予定を入力してください'
);
return;
}

schedules.push({

date:date,
time:time,
title:title,
memo:memo,
created:new Date().toLocaleString('ja-JP')

});

schedules.sort(function(a,b){

const aa =
a.date + ' ' + a.time;

const bb =
b.date + ' ' + b.time;

return aa.localeCompare(bb);

});

localStorage.setItem(
'schedules',
JSON.stringify(
schedules
)
);

document.getElementById(
'scheduleDate'
).value = '';

document.getElementById(
'scheduleTime'
).value = '';

document.getElementById(
'scheduleTitle'
).value = '';

document.getElementById(
'scheduleMemo'
).value = '';

showSchedules();

}

function showSchedules(){

if(
schedules.length === 0
){

document.getElementById(
'result'
).innerHTML =
'予定未登録';

return;

}

let html = '';

schedules.forEach(function(item,index){

html +=

'<div class="item">' +

'<div class="time">' +

item.date +
' ' +
(item.time || '')

+

'</div>' +

'<div class="title">' +

item.title +

'</div>' +

'<div class="memo">' +

(item.memo || '')

+

'</div>' +

'</div>';

});

document.getElementById(
'result'
).innerHTML =
html;

}

</script>

</body>
</html>
