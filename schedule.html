<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>予定案内</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
}

.header{
background:linear-gradient(135deg,#f59e0b,#d97706);
color:#fff;
padding:30px;
border-radius:32px;
text-align:center;
margin-bottom:20px;
}

.header h1{
font-size:42px;
font-weight:900;
}

.card{
background:#fff;
border-radius:28px;
padding:22px;
margin-bottom:18px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.title{
font-size:32px;
font-weight:900;
margin-bottom:16px;
}

.input{
width:100%;
padding:20px;
font-size:24px;
border-radius:18px;
border:2px solid #d1d5db;
margin-bottom:14px;
}

.textarea{
width:100%;
height:140px;
padding:20px;
font-size:24px;
border-radius:18px;
border:2px solid #d1d5db;
margin-bottom:14px;
resize:none;
}

.btn{
width:100%;
padding:24px;
border:none;
border-radius:22px;
font-size:28px;
font-weight:900;
color:#fff;
cursor:pointer;
}

.orange{
background:#ea580c;
}

.blue{
background:#2563eb;
}

.scheduleBox{
background:#f8fafc;
border-radius:22px;
padding:20px;
margin-top:12px;
font-size:24px;
line-height:1.8;
}

.home{
display:block;
text-align:center;
background:#475569;
color:#fff;
text-decoration:none;
padding:22px;
border-radius:24px;
font-size:26px;
font-weight:900;
margin-top:20px;
}

</style>

</head>

<body>

<div class="header">
<h1>📅 予定案内</h1>
</div>

<div class="card">

<div class="title">
予定登録
</div>

<input
id="scheduleDate"
type="date"
class="input">

<input
id="scheduleTitle"
type="text"
class="input"
placeholder="病院・買い物・デイサービス">

<textarea
id="scheduleMemo"
class="textarea"
placeholder="メモ"></textarea>

<button
class="btn orange"
onclick="saveSchedule()">
📅 予定を登録
</button>

</div>

<div class="card">

<div class="title">
今日の予定
</div>

<div
id="todaySchedule"
class="scheduleBox">
予定はありません
</div>

</div>

<div class="card">

<div class="title">
明日の予定
</div>

<div
id="tomorrowSchedule"
class="scheduleBox">
予定はありません
</div>

</div>

<button
class="btn blue"
onclick="speakSchedule()">
🔊 読み上げ
</button>

<a
href="index.html"
class="home">
🏠 トップへ戻る
</a>

<script>

function saveSchedule(){

const date=
document.getElementById('scheduleDate').value;

const title=
document.getElementById('scheduleTitle').value;

const memo=
document.getElementById('scheduleMemo').value;

if(!date || !title){

alert('予定を入力してください');

return;

}

const data={
date:date,
title:title,
memo:memo,
time:new Date().toLocaleString('ja-JP')
};

localStorage.setItem(
'nsawSchedule',
JSON.stringify(data)
);

loadSchedule();

alert('登録しました');

}

function loadSchedule(){

const raw=
localStorage.getItem('nsawSchedule');

if(!raw)return;

const data=
JSON.parse(raw);

const today=
new Date().toISOString().split('T')[0];

const tomorrowDate=
new Date();

tomorrowDate.setDate(
tomorrowDate.getDate()+1
);

const tomorrow=
tomorrowDate
.toISOString()
.split('T')[0];

if(data.date===today){

document.getElementById(
'todaySchedule'
).innerHTML=

'📅 ' +
data.title +

'<br><br>' +

(data.memo || 'メモなし');

}else{

document.getElementById(
'todaySchedule'
).innerHTML=
'予定はありません';

}

if(data.date===tomorrow){

document.getElementById(
'tomorrowSchedule'
).innerHTML=

'📅 ' +
data.title +

'<br><br>' +

(data.memo || 'メモなし');

}else{

document.getElementById(
'tomorrowSchedule'
).innerHTML=
'予定はありません';

}

}

function speakSchedule(){

const todayText=
document.getElementById(
'todaySchedule'
).innerText;

const tomorrowText=
document.getElementById(
'tomorrowSchedule'
).innerText;

const speech=
new SpeechSynthesisUtterance(

'今日の予定。' +
todayText +

'。明日の予定。' +
tomorrowText

);

speech.lang='ja-JP';

speechSynthesis.speak(
speech
);

}

window.onload=
loadSchedule;

</script>

</body>
</html>
