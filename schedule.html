<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>予定案内</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
}

.header{
background:linear-gradient(135deg,#f59e0b,#d97706);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
margin-bottom:16px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:#fff;
border-radius:24px;
padding:20px;
margin-bottom:16px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.title{
font-size:24px;
font-weight:900;
margin-bottom:12px;
}

.data{
font-size:22px;
line-height:1.8;
font-weight:700;
}

.speakBtn{
width:100%;
border:none;
background:#2563eb;
color:#fff;
padding:18px;
border-radius:18px;
font-size:22px;
font-weight:900;
margin-bottom:16px;
}

.home{
display:block;
background:#475569;
color:#fff;
text-decoration:none;
padding:20px;
border-radius:20px;
text-align:center;
font-size:22px;
font-weight:900;
}

</style>

</head>

<body>

<div class="header">
<h1>📅 予定案内</h1>
</div>

<button
class="speakBtn"
onclick="readSchedule()">
🔊 読み上げ
</button>

<div class="card">

<div class="title">
今日の予定
</div>

<div id="todayArea" class="data">
読込中...
</div>

</div>

<div class="card">

<div class="title">
明日の予定
</div>

<div id="tomorrowArea" class="data">
読込中...
</div>

</div>

<a
href="index.html"
class="home">
🏠 トップへ戻る
</a>

<script>

const schedules =
JSON.parse(
localStorage.getItem(
'schedules'
) || '[]'
);

const today =
new Date();

const todayStr =
today.toISOString().split('T')[0];

const tomorrow =
new Date();

tomorrow.setDate(
today.getDate()+1
);

const tomorrowStr =
tomorrow.toISOString().split('T')[0];

let todayHtml='';
let tomorrowHtml='';

schedules.forEach(item=>{

if(item.date===todayStr){

todayHtml +=

(item.time||'') +

' ' +

(item.title||'') +

'<br>';

}

if(item.date===tomorrowStr){

tomorrowHtml +=

(item.time||'') +

' ' +

(item.title||'') +

'<br>';

}

});

if(!todayHtml){

todayHtml =
'予定はありません';

}

if(!tomorrowHtml){

tomorrowHtml =
'予定はありません';

}

document.getElementById(
'todayArea'
).innerHTML =
todayHtml;

document.getElementById(
'tomorrowArea'
).innerHTML =
tomorrowHtml;

function readSchedule(){

const text =

'今日の予定は ' +

document.getElementById(
'todayArea'
).innerText +

'。明日の予定は ' +

document.getElementById(
'tomorrowArea'
).innerText;

speechSynthesis.cancel();

speechSynthesis.speak(
new SpeechSynthesisUtterance(
text
)
);

}

</script>

</body>
</html>
