<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>スケジュール｜見守りDX</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
background:
linear-gradient(
180deg,
#050505 0%,
#101827 50%,
#000000 100%
);
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#fff;
min-height:100vh;
}

.wrap{
max-width:760px;
margin:auto;
padding:18px;
}

.header{
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.15);
border-radius:28px;
padding:24px;
margin-bottom:18px;
}

.back{
font-size:18px;
font-weight:900;
cursor:pointer;
margin-bottom:14px;
}

.title{
font-size:38px;
font-weight:900;
}

.sub{
margin-top:8px;
font-size:15px;
opacity:.8;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.15);
border-radius:24px;
padding:18px;
margin-bottom:16px;
}

.day{
font-size:24px;
font-weight:900;
margin-bottom:16px;
}

.item{
background:rgba(255,255,255,.08);
border-left:8px solid #42a5f5;
border-radius:18px;
padding:16px;
margin-bottom:14px;
}

.time{
font-size:26px;
font-weight:900;
color:#42a5f5;
}

.text{
font-size:24px;
font-weight:900;
margin-top:6px;
}

.memo{
font-size:15px;
line-height:1.7;
margin-top:8px;
opacity:.9;
}

.doneBtn{
width:100%;
border:none;
border-radius:18px;
padding:18px;
font-size:22px;
font-weight:900;
color:#fff;
background:
linear-gradient(
135deg,
#00c853,
#00e676
);
margin-top:14px;
cursor:pointer;
}

.navBtn{
width:100%;
border:none;
border-radius:20px;
padding:18px;
font-size:22px;
font-weight:900;
cursor:pointer;
color:#fff;
margin-bottom:12px;
}

.homeBtn{
background:
linear-gradient(
135deg,
#455a64,
#78909c
);
}

.topBtn{
background:
linear-gradient(
135deg,
#673ab7,
#9575cd
);
}

.toast{
position:fixed;
left:50%;
bottom:30px;
transform:translateX(-50%);
background:#1976d2;
color:#fff;
padding:16px 24px;
border-radius:18px;
font-size:18px;
font-weight:900;
display:none;
z-index:9999;
}

.footer{
text-align:center;
padding:20px;
font-size:12px;
opacity:.6;
}

</style>
</head>

<body>

<div class="wrap">

<div class="header">

<div
class="back"
onclick="location.href='index.html'">
← ホームへ戻る
</div>

<div class="title">
スケジュール
</div>

<div class="sub">
病院・薬・訪問予定を確認します
</div>

</div>

<div class="card">

<div class="day">
今日の予定
</div>

<div class="item">

<div class="time">
09:00
</div>

<div class="text">
朝の薬
</div>

<div class="memo">
飲み終わったら確認してください
</div>

<button
class="doneBtn"
onclick="done('朝の薬を確認しました')">
✅ 確認しました
</button>

</div>

<div class="item">

<div class="time">
14:00
</div>

<div class="text">
訪問予定
</div>

<div class="memo">
支援者が訪問予定です
</div>

<button
class="doneBtn"
onclick="done('訪問予定を確認しました')">
✅ 確認しました
</button>

</div>

<div class="item">

<div class="time">
18:00
</div>

<div class="text">
夜の薬
</div>

<div class="memo">
夜の薬を忘れずに飲みましょう
</div>

<button
class="doneBtn"
onclick="done('夜の薬を確認しました')">
✅ 確認しました
</button>

</div>

</div>

<div class="card">

<button
class="navBtn homeBtn"
onclick="location.href='index.html'">
ホームへ戻る
</button>

<button
class="navBtn topBtn"
onclick="window.scrollTo({top:0,behavior:'smooth'})">
先頭へ戻る
</button>

</div>

<div class="footer">
NSAW スケジュール
</div>

</div>

<div
id="toast"
class="toast">
</div>

<script>

function done(text){

const toast =
document.getElementById("toast");

toast.innerText =
text;

toast.style.display =
"block";

setTimeout(function(){

toast.style.display =
"none";

},2000);

}

</script>

</body>
</html>
