<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbxHknfXsWiwwIhuJ88JFDNRi51jEvD-vgzdeld3YTnfL_0CsrhKmTzxaWUFLVnisRCp/exec";

function loadSchedules(){

document.getElementById("list").innerHTML =
"読み込み中...";

fetch(
GAS_URL + "?action=scheduleList"
)
.then(r=>r.json())
.then(data=>{

let html = "";

(data.data || []).forEach(v=>{

html += `
<div class="item">

<div class="date">
📅 ${v.date || ""}
</div>

<div class="time">
⏰ ${v.time || ""}
</div>

<div class="name">
👤 ${v.name || ""}
</div>

<div class="schedule-title">
${v.title || ""}
</div>

<div class="place">
📍 ${v.place || ""}
</div>

<div class="memo">
${v.memo || ""}
</div>

</div>
`;

});

document.getElementById("list").innerHTML =
html || "予定なし";

})
.catch(()=>{

document.getElementById("list").innerHTML =
"取得エラー";

});

}

loadSchedules();

</script>
