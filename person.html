<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本人</title>
</head>
<body>

<h2>本人送信</h2>

<input id="id" placeholder="ID"><br>
<input id="name" placeholder="名前"><br>

<select id="status">
<option>元気</option>
<option>注意</option>
<option>緊急</option>
</select><br>

<textarea id="memo"></textarea><br>

<button onclick="send()">送信</button>

<div id="result"></div>

<script>

const GAS_URL="https://script.google.com/macros/s/AKfycbwYDtQ7KDatOw6D-8GvxprBrcZsmOL19mvNBIt6dE2_RB4aks8eCsD1D4-9_rv1nUN6/exec";

function send(){

const payload={
type:"record",
id:id.value,
name:name.value,
status:status.value,
memo:memo.value,
source:"person",
method:"post"
};

fetch(GAS_URL,{
method:"POST",
headers:{"Content-Type":"text/plain"},
body:JSON.stringify(payload)
})

.then(r=>r.text())
.then(t=>{
const d=JSON.parse(t);
result.innerText=d.status;
});

}

</script>

</body>
</html>
