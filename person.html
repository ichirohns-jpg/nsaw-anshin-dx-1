<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>本人ページ</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

h1{
margin:0;
background:#1565c0;
color:#fff;
padding:28px 18px;
text-align:center;
font-size:34px;
font-weight:900;
}

.wrap{
max-width:760px;
margin:auto;
padding:18px;
}

.card{
background:#fff;
border-radius:22px;
padding:18px;
margin-bottom:16px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.lead{
font-size:18px;
line-height:1.7;
font-weight:700;
}

.btn{
display:block;
width:100%;
padding:24px;
margin:14px 0;
border-radius:16px;
font-size:22px;
font-weight:900;
color:#fff;
text-align:center;
text-decoration:none;
}

.genki{background:#43a047;}
.komari{background:#fb8c00;}
.help{background:#e53935;}
.kusuri{background:#1e88e5;}
.home{background:#607d8b;}

</style>
</head>

<body>

<h1>本人ページ</h1>

<div class="wrap">

<div class="card">
<div class="lead">
ボタンを押すだけで記録されます
</div>
</div>

<a class="btn genki" href="#" onclick="send('genki')">😊 元気です</a>
<a class="btn komari" href="#" onclick="send('komari')">⚠️ 少し困っています</a>
<a class="btn help" href="#" onclick="send('help')">🚨 助けてください</a>
<a class="btn kusuri" href="#" onclick="send('kusuri')">💊 薬を飲みました</a>

<a class="btn home" href="index.html">🏠 戻る</a>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbxKT-6glAdXnR6ylyUB1YZbSRYKZ3dGtVl4w7lO8YW9jCWGa1vCHwpG7167pX2KIYZ2/exec";

function send(status){

  const userId = "A001";

  const payload = {
    id: userId,
    status: status,
    datetime: new Date().toISOString()
  };

  fetch(GAS_URL, {
    method: "POST",
    mode: "cors",
    cache: "no-cache",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(payload)
  })
  .then(r => r.text())
  .then(() => {
    alert("記録しました");
  })
  .catch(() => {
    alert("送信エラー");
  });

}

</script>

</body>
</html>
