<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>利用者ページ</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#eef3f8;font-family:"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:760px;margin:auto;padding:16px}
.card{background:#fff;border-radius:24px;padding:20px;margin-bottom:18px;box-shadow:0 6px 16px rgba(0,0,0,.08)}
.name{font-size:34px;font-weight:900;color:#1976d2}
.area{font-size:20px;font-weight:900;color:#666;margin-top:8px}
.statusBox{background:#e8f5e9;border-radius:20px;padding:18px;margin-top:18px}
.statusLabel{font-size:18px;font-weight:900;color:#666}
.status{font-size:34px;font-weight:900;color:#2e7d32;margin-top:10px}
.statusTime{font-size:20px;font-weight:900;color:#666;margin-top:10px}
.orangeBtn,.grayBtn{
width:100%;
border:none;
border-radius:20px;
padding:24px;
font-size:28px;
font-weight:900;
color:#fff;
margin-bottom:16px;
}
.orangeBtn{background:#fb8c00}
.grayBtn{background:#546e7a}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<div class="name" id="personName">
利用者
</div>

<div class="area" id="personArea">
志木市
</div>

<div class="statusBox">

<div class="statusLabel">
最新状態
</div>

<div class="status" id="personStatus">
確認中...
</div>

<div class="statusTime" id="personTime">
</div>

</div>

</div>

<button
class="orangeBtn"
onclick="openMed()">
💊 薬の確認
</button>

<button
class="grayBtn"
onclick="location.href='support2.html'">
一覧へ戻る
</button>

</div>

<script>
const SHEET_ID='13qavSy8Thod2S_UWtHf0C7s-IDVcpYYEMvRNPHpabjY';

function cell(c){
return c?String(c.v??c.f??'').trim():'';
}

function formatDate(v){
if(!v)return'';
return String(v);
}

const params=new URLSearchParams(location.search);
const targetName=params.get('name')||'利用者';

document.getElementById('personName').textContent=targetName;

function receiveLogs(json){

const rows=json.table.rows||[];

const logs=rows.map(r=>{
const c=r.c||[];
return{
date:cell(c[0]),
name:cell(c[1]),
text:cell(c[2])
};
});

const personLogs=
logs.filter(l=>l.name.includes(targetName));

const latest=
personLogs[personLogs.length-1];

if(latest){

document.getElementById('personStatus').textContent=
latest.text;

document.getElementById('personTime').textContent=
formatDate(latest.date);

}else{

document.getElementById('personStatus').textContent=
'今日はまだ確認がありません';

}

}

function openMed(){
location.href=
'med.html?name='+
encodeURIComponent(targetName);
}

window.google={
visualization:{
Query:{
setResponse:receiveLogs
}
}
};

const s=document.createElement('script');

s.src=
'https://docs.google.com/spreadsheets/d/'
+SHEET_ID+
'/gviz/tq?sheet='+
encodeURIComponent('見守り記録')+
'&tqx=out:json';

document.body.appendChild(s);
</script>

</body>
</html>
