<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NSAW 見守りDX / 予定</title>

<style>
:root{
  --bg:#f5f7fb;
  --text:#0f172a;
  --blue:#2563eb;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Hiragino Sans","Yu Gothic",sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
}

.wrap{
  max-width:720px;
  margin:0 auto;
  padding:18px;
}

/* ヘッダー */
.header{
  background:linear-gradient(135deg,#1d4ed8,#60a5fa);
  color:#fff;
  padding:28px;
  border-radius:22px;
  text-align:center;
}

.header h1{
  font-size:22px;
  font-weight:900;
}

.header p{
  font-size:13px;
  margin-top:6px;
  opacity:.9;
}

/* 今日 */
.today{
  background:#fff;
  margin-top:14px;
  padding:26px;
  border-radius:18px;
  text-align:center;
  font-size:30px;
  font-weight:900;
  box-shadow:0 6px 16px rgba(0,0,0,0.06);
}

/* リスト */
.list{
  margin-top:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.item{
  background:#fff;
  padding:18px;
  border-radius:16px;
  box-shadow:0 6px 14px rgba(0,0,0,0.05);
  display:flex;
  justify-content:space-between;
  font-weight:700;
}

.time{
  color:#64748b;
  font-size:12px;
}

.footer{
  text-align:center;
  font-size:12px;
  color:#64748b;
  margin-top:18px;
}
</style>

</head>

<body>

<div class="wrap">

  <div class="header">
    <h1>NSAW 見守りDX</h1>
    <p>今日の予定</p>
  </div>

  <div class="today">
    📅 今日の予定
  </div>

  <div class="list">

    <div class="item">
      <span>病院</span>
      <span class="time">10:00</span>
    </div>

    <div class="item">
      <span>薬の確認</span>
      <span class="time">12:00</span>
    </div>

    <div class="item">
      <span>散歩</span>
      <span class="time">15:00</span>
    </div>

  </div>

  <div class="footer">
    予定ページ
  </div>

</div>

</body>
</html>
