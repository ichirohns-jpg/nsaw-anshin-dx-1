<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>家族へLINE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
text-align:center;
}

.header{
background:linear-gradient(135deg,#06c755,#00b900);
color:#fff;
padding:28px;
border-radius:28px;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:#fff;
padding:24px;
border-radius:24px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
margin-bottom:16px;
}

.line{
font-size:22px;
font-weight:900;
margin:20px 0;
word-break:break-all;
}

.lineBtn{
display:block;
width:100%;
padding:26px;
border:none;
border-radius:24px;
background:#06c755;
color:#fff;
font-size:30px;
font-weight:900;
text-decoration:none;
}

.home{
display:block;
margin-top:16px;
padding:20px;
background:#475569;
color:#fff;
text-decoration:none;
border-radius:20px;
font-size:22px;
font-weight:900;
}

</style>

</head>

<body>

<div class="header">
<h1>💬 家族へLINE</h1>
</div>

<div class="card">

<div>
登録されているLINE
</div>

<div id="lineArea" class="line">
未登録
</div>

<a
id="lineBtn"
class="lineBtn"
href="#"
target="_blank">

💬 LINEを開く

</a>

</div>

<a
href="index.html"
class="home">
🏠 トップへ戻る
</a>

<script>

const line =
localStorage.getItem(
'familyLine'
) || '';

if(line){

document.getElementById(
'lineArea'
).innerHTML =
line;

document.getElementById(
'lineBtn'
).href =
line;

}else{

document.getElementById(
'lineArea'
).innerHTML =
'LINE未登録';

document.getElementById(
'lineBtn'
).style.display =
'none';

}

</script>

</body>
</html>
