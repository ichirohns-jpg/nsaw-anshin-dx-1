<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>OpenAI 音声入力DX</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
padding:20px;
background:#eef4f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#123;
}

.wrap{
max-width:720px;
margin:auto;
}

.card{
background:#fff;
border-radius:28px;
padding:24px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.title{
font-size:40px;
font-weight:900;
text-align:center;
color:#1565c0;
margin-bottom:12px;
line-height:1.4;
}

.sub{
font-size:23px;
text-align:center;
line-height:1.7;
margin-bottom:22px;
font-weight:800;
}

.note{
font-size:21px;
line-height:1.7;
font-weight:800;
color:#555;
background:#fff8e1;
border-radius:20px;
padding:18px;
margin-bottom:20px;
}

.btnRow{
display:flex;
gap:12px;
margin-bottom:18px;
}

.recBtn,
.stopBtn,
.clearBtn{
flex:1;
border:none;
border-radius:24px;
padding:24px 8px;
color:white;
font-size:23px;
font-weight:900;
cursor:pointer;
}

.recBtn{
background:#1976d2;
}

.stopBtn{
background:#d32f2f;
}

.clearBtn{
background:#777;
}

.transBtn{
width:100%;
border:none;
border-radius:24px;
padding:26px 14px;
background:#6a1b9a;
color:white;
font-size:30px;
font-weight:900;
cursor:pointer;
margin-top:18px;
}

.readBtn{
width:100%;
border:none;
border-radius:24px;
padding:24px 14px;
background:#ef6c00;
color:white;
font-size:28px;
font-weight:900;
cursor:pointer;
margin-top:18px;
}

.saveBtn{
width:100%;
border:none;
border-radius:24px;
padding:28px 14px;
background:#2e7d32;
color:white;
font-size:32px;
font-weight:900;
cursor:pointer;
margin-top:18px;
}

.resultBox{
background:#f5f7fa;
border-radius:22px;
padding:20px;
min-height:190px;
font-size:30px;
font-weight:700;
line-height:1.8;
white-space:pre-wrap;
}

.status{
margin-top:20px;
font-size:25px;
font-weight:900;
text-align:center;
color:#666;
white-space:pre-wrap;
line-height:1.6;
}

.linkBtn{
display:block;
text-align:center;
text-decoration:none;
background:#555;
color:white;
border-radius:24px;
padding:24px 14px;
font-size:26px;
font-weight:900;
margin-top:18px;
}

@media(max-width:600px){

body{
padding:14px;
}

.title{
font-size:33px;
}

.sub{
font-size:20px;
}

.note{
font-size:19px;
}

.recBtn,
.stopBtn,
.clearBtn{
font-size:20px;
padding:20px 6px;
}

.resultBox{
font-size:26px;
}

.transBtn{
font-size:26px;
padding:24px 10px;
}

.readBtn{
font-size:25px;
}

.saveBtn{
font-size:28px;
}

.status{
font-size:23px;
}

.linkBtn{
font-size:24px;
}

}
</style>
</head>

<body>

<div class="wrap">
<div class="card">

<div class="title">
OpenAI 音声入力DX
</div>

<div class="sub">
録音 → OpenAI文字起こし → 確認 → 登録
</div>

<div class="note">
今度はブラウザ標準の音声認識ではなく、録音した音声をOpenAIで文字起こしします。<br>
間違っていたら「消す」を押して、もう一度録音してください。
</div>

<div class="btnRow">
<button class="recBtn" id="recBtn">🎤 録音</button>
<button class="stopBtn" id="stopBtn">■ 停止</button>
<button class="clearBtn" id="clearBtn">🗑 消す</button>
</div>

<div class="resultBox" id="resultBox">
ここにOpenAIの文字起こし結果が表示されます
</div>

<button class="transBtn" id="transBtn">
🧠 OpenAIで文字起こし
</button>

<button class="readBtn" id="readBtn">
🔊 内容を確認する
</button>

<button class="saveBtn" id="saveBtn">
✅ 登録する
</button>

<div class="status" id="status">
待機中
</div>

<a class="linkBtn" href="today.html">
📅 今日の予定を見る
</a>

</div>
</div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbxjhRqORuP56x4qPkQZxsxgna_VV4CFKihxlyvywu4zSka3HkhLyzmLqT1Z-VxuOj4L/exec';

const recBtn =
document.getElementById("recBtn");

const stopBtn =
document.getElementById("stopBtn");

const clearBtn =
document.getElementById("clearBtn");

const transBtn =
document.getElementById("transBtn");

const readBtn =
document.getElementById("readBtn");

const saveBtn =
document.getElementById("saveBtn");

const resultBox =
document.getElementById("resultBox");

const statusBox =
document.getElementById("status");

let mediaRecorder =
null;

let audioChunks =
[];

let audioBlob =
null;

let audioMimeType =
"";

function speak(text){

speechSynthesis.cancel();

const uttr =
new SpeechSynthesisUtterance(text);

uttr.lang =
"ja-JP";

uttr.rate =
0.95;

speechSynthesis.speak(uttr);

}

function getText(){

const text =
resultBox.innerText.trim();

if(text === "ここにOpenAIの文字起こし結果が表示されます"){
return "";
}

return text;

}

function resetAll(){

audioChunks =
[];

audioBlob =
null;

audioMimeType =
"";

resultBox.innerText =
"ここにOpenAIの文字起こし結果が表示されます";

statusBox.innerText =
"消しました。もう一度録音できます。";

speak(
"消しました。もう一度録音できます。"
);

}

function pickMimeType(){

if(MediaRecorder.isTypeSupported("audio/webm;codecs=opus")){
return "audio/webm;codecs=opus";
}

if(MediaRecorder.isTypeSupported("audio/webm")){
return "audio/webm";
}

if(MediaRecorder.isTypeSupported("audio/mp4")){
return "audio/mp4";
}

if(MediaRecorder.isTypeSupported("audio/mpeg")){
return "audio/mpeg";
}

return "";

}

function blobToBase64(blob){

return new Promise((resolve,reject) => {

const reader =
new FileReader();

reader.onloadend =
() => {

const dataUrl =
reader.result;

const base64 =
String(dataUrl).split(",")[1];

resolve(base64);

};

reader.onerror =
reject;

reader.readAsDataURL(blob);

});

}

recBtn.onclick =
async () => {

try{

speechSynthesis.cancel();

audioChunks =
[];

audioBlob =
null;

resultBox.innerText =
"";

statusBox.innerText =
"マイクを準備中...";

const stream =
await navigator.mediaDevices.getUserMedia({
audio:true
});

audioMimeType =
pickMimeType();

const options =
audioMimeType
? { mimeType: audioMimeType }
: {};

mediaRecorder =
new MediaRecorder(
stream,
options
);

mediaRecorder.ondataavailable =
(event) => {

if(event.data && event.data.size > 0){

audioChunks.push(event.data);

}

};

mediaRecorder.onstop =
() => {

audioBlob =
new Blob(
audioChunks,
{
type:
audioMimeType ||
"audio/webm"
}
);

stream.getTracks().forEach(track => {
track.stop();
});

statusBox.innerText =
"録音しました。OpenAIで文字起こしを押してください。";

speak(
"録音しました。文字起こしを押してください。"
);

};

mediaRecorder.start();

statusBox.innerText =
"録音中です。話し終わったら停止を押してください。";

}catch(error){

console.error(error);

statusBox.innerText =
"録音できませんでした。マイク許可を確認してください。";

alert(
"録音できませんでした。マイク許可を確認してください。"
);

}

};

stopBtn.onclick =
() => {

try{

if(mediaRecorder && mediaRecorder.state !== "inactive"){

mediaRecorder.stop();

statusBox.innerText =
"停止しました。";

}

}catch(error){

console.error(error);

}

};

clearBtn.onclick =
() => {

try{

if(mediaRecorder && mediaRecorder.state !== "inactive"){

mediaRecorder.stop();

}

}catch(e){}

resetAll();

};

transBtn.onclick =
async () => {

if(!audioBlob){

alert(
"録音がありません。先に録音してください。"
);

speak(
"録音がありません。先に録音してください。"
);

return;

}

statusBox.innerText =
"OpenAIで文字起こし中...";

try{

const base64 =
await blobToBase64(audioBlob);

const response =
await fetch(
GAS_URL,
{
method:"POST",
headers:{
"Content-Type":"text/plain;charset=utf-8"
},
body:JSON.stringify({
mode:"transcribe",
audioBase64:base64,
mimeType:audioBlob.type || audioMimeType || "audio/webm"
})
}
);

const data =
await response.json();

console.log(data);

if(!data.ok){

statusBox.innerText =
"文字起こし失敗\n" +
(data.error || "");

alert(
data.error ||
data.body ||
"OpenAI文字起こしに失敗しました"
);

speak(
"文字起こしに失敗しました。"
);

return;

}

resultBox.innerText =
data.text || "";

statusBox.innerText =
"文字起こし完了";

speak(
"文字起こししました。内容を確認してください。"
);

}catch(error){

console.error(error);

statusBox.innerText =
"通信エラー";

alert(
"通信エラーです。GAS URL、OpenAIキー、デプロイ設定を確認してください。"
);

speak(
"通信エラーです。"
);

}

};

readBtn.onclick =
() => {

const text =
getText();

if(!text){

statusBox.innerText =
"文字起こし結果がありません";

speak(
"文字起こし結果がありません。"
);

return;

}

statusBox.innerText =
"読み上げ確認中";

speak(
"登録する内容は、" +
text +
"、です。よろしければ登録するを押してください。"
);

};

saveBtn.onclick =
async () => {

const text =
getText();

if(!text){

alert(
"登録する文字がありません"
);

speak(
"登録する文字がありません。"
);

return;

}

statusBox.innerText =
"登録中...";

try{

const url =
GAS_URL +
'?mode=voice&text=' +
encodeURIComponent(text) +
'&t=' +
Date.now();

const response =
await fetch(url);

const data =
await response.json();

console.log(data);

if(data.ok){

if(data.calendar_registered === true){

statusBox.innerText =
"登録成功：カレンダー登録済み";

speak(
"カレンダーに登録しました。"
);

}else{

statusBox.innerText =
"登録成功：" +
(data.category || "記録");

speak(
"記録しました。"
);

}

}else{

statusBox.innerText =
"登録失敗\n" +
(data.error || data.message || "");

speak(
"登録に失敗しました。"
);

alert(
data.error ||
data.message ||
"登録に失敗しました"
);

}

}catch(error){

console.error(error);

statusBox.innerText =
"通信エラー";

speak(
"通信エラーです。"
);

alert(
"通信エラーです。GAS URLかデプロイ設定を確認してください。"
);

}

};

</script>

</body>
</html>
