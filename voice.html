<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音声入力DX</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
padding:12px;
background:#eef4f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#123;
}

.wrap{
max-width:720px;
margin:auto;
}

.card{
background:#fff;
border-radius:26px;
padding:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.title{
font-size:30px;
font-weight:900;
text-align:center;
color:#1565c0;
line-height:1.35;
margin:0 0 10px;
}

.status{
font-size:22px;
font-weight:900;
text-align:center;
line-height:1.5;
color:#666;
white-space:pre-wrap;
margin:8px 0 14px;
}

.inputBox{
width:100%;
min-height:230px;
border:none;
outline:none;
resize:vertical;
background:#f5f7fa;
border-radius:24px;
padding:20px;
font-size:30px;
font-weight:900;
line-height:1.7;
color:#123;
margin-bottom:14px;
}

.inputBox::placeholder{
color:#999;
}

.actionRow{
display:flex;
gap:12px;
margin-bottom:12px;
}

.saveBtn,
.clearBtn{
flex:1;
border:none;
border-radius:24px;
padding:24px 8px;
font-size:26px;
font-weight:900;
color:white;
cursor:pointer;
}

.saveBtn{
background:#2e7d32;
}

.clearBtn{
background:#777;
}

.readBtn{
width:100%;
border:none;
border-radius:24px;
padding:22px 12px;
font-size:25px;
font-weight:900;
color:white;
background:#ef6c00;
cursor:pointer;
margin-bottom:12px;
}

.linkBtn{
display:block;
text-align:center;
text-decoration:none;
background:#555;
color:white;
border-radius:24px;
padding:22px 12px;
font-size:24px;
font-weight:900;
margin-top:12px;
}

.guide{
background:#fff8e1;
border-radius:20px;
padding:16px;
font-size:20px;
font-weight:900;
line-height:1.7;
color:#555;
margin-bottom:14px;
}

.small{
font-size:18px;
font-weight:800;
line-height:1.6;
color:#666;
text-align:center;
margin-top:10px;
}

@media(max-width:600px){

.card{
padding:16px;
border-radius:24px;
}

.title{
font-size:28px;
}

.inputBox{
font-size:27px;
min-height:220px;
}

.saveBtn,
.clearBtn{
font-size:24px;
padding:22px 6px;
}

.readBtn{
font-size:23px;
}

.status{
font-size:21px;
}

.linkBtn{
font-size:22px;
}

.guide{
font-size:19px;
}

.small{
font-size:17px;
}

}
</style>
</head>

<body>

<div class="wrap">
<div class="card">

<div class="title">
音声入力DX
</div>

<div class="status" id="status">
入力欄を押して、iPhoneのマイクで話してください
</div>

<div class="guide">
① 下の入力欄を押す<br>
② キーボードのマイクで話す<br>
③ 文字を確認する<br>
④ 登録する
</div>

<textarea class="inputBox" id="inputBox" placeholder="ここを押して、iPhoneのマイクで話してください。例：6月5日13時病院"></textarea>

<button class="readBtn" id="readBtn">
🔊 内容を聞く
</button>

<div class="actionRow">

<button class="clearBtn" id="clearBtn">
🗑 消す
</button>

<button class="saveBtn" id="saveBtn">
✅ 登録する
</button>

</div>

<a class="linkBtn" href="today.html">
📅 今日の予定を見る
</a>

<div class="small">
勝手に録音しません。<br>
入力欄に入った文字だけを登録します。
</div>

</div>
</div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbxjhRqORuP56x4qPkQZxsxgna_VV4CFKihxlyvywu4zSka3HkhLyzmLqT1Z-VxuOj4L/exec';

const inputBox =
document.getElementById("inputBox");

const readBtn =
document.getElementById("readBtn");

const clearBtn =
document.getElementById("clearBtn");

const saveBtn =
document.getElementById("saveBtn");

const statusBox =
document.getElementById("status");

function speak(text){

speechSynthesis.cancel();

const uttr =
new SpeechSynthesisUtterance(text);

uttr.lang =
"ja-JP";

uttr.rate =
0.95;

speechSynthesis.speak(uttr);

}

function getText(){

return inputBox.value.trim();

}

readBtn.onclick =
() => {

const text =
getText();

if(!text){

statusBox.innerText =
"文字がありません";

speak(
"まだ文字がありません。入力欄を押して話してください。"
);

return;

}

statusBox.innerText =
"読み上げ確認中";

speak(
"登録する内容は、" +
text +
"、です。よろしければ登録するを押してください。"
);

};

clearBtn.onclick =
() => {

inputBox.value =
"";

statusBox.innerText =
"消しました";

speak(
"消しました。もう一度入力してください。"
);

inputBox.focus();

};

saveBtn.onclick =
async () => {

const text =
getText();

if(!text){

alert(
"登録する文字がありません"
);

speak(
"登録する文字がありません。"
);

return;

}

statusBox.innerText =
"登録中...";

try{

const url =
GAS_URL +
'?mode=voice&text=' +
encodeURIComponent(text) +
'&t=' +
Date.now();

const response =
await fetch(url);

const data =
await response.json();

console.log(data);

if(data.ok){

if(data.calendar_registered === true){

statusBox.innerText =
"登録成功：カレンダー登録済み";

speak(
"カレンダーに登録しました。"
);

}else{

statusBox.innerText =
"登録成功：" +
(data.category || "記録");

speak(
"記録しました。"
);

}

}else{

statusBox.innerText =
"登録失敗\n" +
(data.error || data.message || "");

speak(
"登録に失敗しました。"
);

alert(
data.error ||
data.message ||
"登録に失敗しました"
);

}

}catch(error){

console.error(error);

statusBox.innerText =
"通信エラー";

speak(
"通信エラーです。"
);

alert(
"通信エラーです。GAS URLかデプロイ設定を確認してください。"
);

}

};

</script>

</body>
</html>
