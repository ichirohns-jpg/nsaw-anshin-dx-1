<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音声入力DX</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
padding:12px;
background:#eef4f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#123;
}

.wrap{
max-width:720px;
margin:auto;
}

.card{
background:#fff;
border-radius:26px;
padding:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.title{
font-size:30px;
font-weight:900;
text-align:center;
color:#1565c0;
margin:0 0 10px;
}

.status{
font-size:22px;
font-weight:900;
text-align:center;
line-height:1.5;
color:#666;
white-space:pre-wrap;
margin:8px 0 14px;
}

.inputBox{
width:100%;
min-height:240px;
border:none;
outline:none;
resize:vertical;
background:#f5f7fa;
border-radius:24px;
padding:20px;
font-size:30px;
font-weight:900;
line-height:1.7;
color:#123;
margin-bottom:14px;
}

.inputBox::placeholder{
color:#999;
}

.actionRow{
display:flex;
gap:12px;
margin-bottom:12px;
}

.saveBtn,
.clearBtn{
flex:1;
border:none;
border-radius:24px;
padding:24px 8px;
font-size:26px;
font-weight:900;
color:white;
cursor:pointer;
}

.saveBtn{background:#2e7d32}
.clearBtn{background:#777}

.readBtn{
width:100%;
border:none;
border-radius:24px;
padding:22px 12px;
font-size:25px;
font-weight:900;
color:white;
background:#ef6c00;
cursor:pointer;
margin-bottom:12px;
}

.stopReadBtn{
width:100%;
border:none;
border-radius:24px;
padding:20px 12px;
font-size:24px;
font-weight:900;
color:white;
background:#8d6e63;
cursor:pointer;
margin-bottom:12px;
}

.linkBtn{
display:block;
text-align:center;
text-decoration:none;
background:#555;
color:white;
border-radius:24px;
padding:22px 12px;
font-size:24px;
font-weight:900;
margin-top:12px;
}

.guide{
background:#fff8e1;
border-radius:20px;
padding:16px;
font-size:20px;
font-weight:900;
line-height:1.7;
color:#555;
margin-bottom:14px;
}

.small{
font-size:18px;
font-weight:800;
line-height:1.6;
color:#666;
text-align:center;
margin-top:10px;
}

@media(max-width:600px){
.card{padding:16px;border-radius:24px}
.title{font-size:28px}
.inputBox{font-size:27px;min-height:220px}
.saveBtn,.clearBtn{font-size:24px;padding:22px 6px}
.readBtn{font-size:23px}
.stopReadBtn{font-size:22px}
.status{font-size:21px}
.linkBtn{font-size:22px}
.guide{font-size:19px}
.small{font-size:17px}
}
</style>
</head>

<body>

<div class="wrap">
<div class="card">

<div class="title">
音声入力DX
</div>

<div class="status" id="status">
入力欄を押して、iPhoneのマイクで話してください
</div>

<div class="guide">
① 入力欄を押す<br>
② キーボードのマイクで話す<br>
③ 文字を見て確認する<br>
④ 合っていれば登録する
</div>

<textarea class="inputBox" id="inputBox" placeholder="ここを押して、iPhoneのマイクで話してください。例：6月5日13時病院"></textarea>

<button class="readBtn" id="readBtn">
🔊 内容を聞く
</button>

<button class="stopReadBtn" id="stopReadBtn">
■ 読み上げ停止
</button>

<div class="actionRow">
<button class="clearBtn" id="clearBtn">
🗑 消す
</button>

<button class="saveBtn" id="saveBtn">
✅ 登録する
</button>
</div>

<a class="linkBtn" href="today.html">
📅 今日の予定を見る
</a>

<div class="small">
勝手に録音しません。<br>
勝手に読み上げません。<br>
入力欄に入った文字だけを登録します。
</div>

</div>
</div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbyuvE3vVhq63yNMasPZhaJR3zMat9ShOAY7sDBZtIkRWUJ231LamYQDaJ7ro-qX05Fk/exec';

const inputBox =
document.getElementById("inputBox");

const readBtn =
document.getElementById("readBtn");

const stopReadBtn =
document.getElementById("stopReadBtn");

const clearBtn =
document.getElementById("clearBtn");

const saveBtn =
document.getElementById("saveBtn");

const statusBox =
document.getElementById("status");

let currentAudio =
null;

inputBox.value =
"";

function getText(){

return inputBox.value.trim();

}

function stopAudio(){

try{

if(currentAudio){

currentAudio.pause();
currentAudio.currentTime = 0;
currentAudio = null;

}

}catch(e){}

}

async function openAiSpeak(text){

stopAudio();

if(!text){

statusBox.innerText =
"読む文字がありません";

return;

}

statusBox.innerText =
"OpenAIで読み上げ音声を作っています...";

try{

const response =
await fetch(
GAS_URL,
{
method:"POST",
headers:{
"Content-Type":"text/plain;charset=utf-8"
},
body:JSON.stringify({
mode:"tts",
text:text
})
}
);

const data =
await response.json();

console.log(data);

if(!data.ok){

statusBox.innerText =
"読み上げ失敗\n" +
(data.error || data.body || "");

alert(
data.error ||
data.body ||
"読み上げに失敗しました"
);

return;

}

const audioSrc =
"data:" +
(data.mimeType || "audio/mpeg") +
";base64," +
data.audioBase64;

currentAudio =
new Audio(audioSrc);

currentAudio.onended =
() => {

statusBox.innerText =
"読み上げ終了";

currentAudio =
null;

};

currentAudio.onerror =
() => {

statusBox.innerText =
"音声再生エラー";

currentAudio =
null;

};

statusBox.innerText =
"読み上げ中...";

await currentAudio.play();

}catch(error){

console.error(error);

statusBox.innerText =
"通信エラー";

alert(
"通信エラーです。GAS URL、OpenAIキー、デプロイ設定を確認してください。"
);

}

}

readBtn.onclick =
async () => {

const text =
getText();

if(!text){

statusBox.innerText =
"文字がありません";

alert(
"まだ文字がありません。入力欄を押して話してください。"
);

return;

}

await openAiSpeak(
"登録する内容は、" +
text +
"、です。よろしければ登録するを押してください。"
);

};

stopReadBtn.onclick =
() => {

stopAudio();

statusBox.innerText =
"読み上げを止めました";

};

clearBtn.onclick =
() => {

stopAudio();

inputBox.value =
"";

statusBox.innerText =
"消しました";

inputBox.focus();

};

saveBtn.onclick =
async () => {

stopAudio();

const text =
getText();

if(!text){

alert(
"登録する文字がありません"
);

statusBox.innerText =
"登録する文字がありません";

return;

}

statusBox.innerText =
"登録中...";

try{

const url =
GAS_URL +
'?mode=voice&text=' +
encodeURIComponent(text) +
'&t=' +
Date.now();

const response =
await fetch(url);

const data =
await response.json();

console.log(data);

if(data.ok){

if(data.calendar_registered === true){

statusBox.innerText =
"登録成功：カレンダー登録済み";

}else{

statusBox.innerText =
"登録成功：" +
(data.category || "記録");

}

}else{

statusBox.innerText =
"登録失敗\n" +
(data.error || data.message || "");

alert(
data.error ||
data.message ||
"登録に失敗しました"
);

}

}catch(error){

console.error(error);

statusBox.innerText =
"通信エラー";

alert(
"通信エラーです。GAS URLかデプロイ設定を確認してください。"
);

}

};

</script>

</body>
</html>
