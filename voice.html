<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>音声入力DX</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:20px;
background:#eef4f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#123;
}

.wrap{
max-width:720px;
margin:auto;
}

.card{
background:#fff;
border-radius:28px;
padding:24px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.title{
font-size:42px;
font-weight:900;
text-align:center;
color:#1565c0;
margin-bottom:12px;
}

.sub{
font-size:24px;
text-align:center;
line-height:1.7;
margin-bottom:28px;
}

.btnRow{
display:flex;
gap:14px;
margin-bottom:24px;
}

.micBtn,
.stopBtn,
.saveBtn{
flex:1;
border:none;
border-radius:24px;
padding:28px 14px;
color:white;
font-size:30px;
font-weight:900;
cursor:pointer;
}

.micBtn{
background:#1976d2;
}

.stopBtn{
background:#d32f2f;
}

.saveBtn{
background:#2e7d32;
margin-top:18px;
width:100%;
}

.resultBox{
background:#f5f7fa;
border-radius:22px;
padding:20px;
min-height:180px;
font-size:30px;
font-weight:700;
line-height:1.8;
white-space:pre-wrap;
}

.status{
margin-top:18px;
font-size:24px;
font-weight:900;
text-align:center;
color:#666;
}

@media(max-width:600px){

.title{
font-size:34px;
}

.sub{
font-size:20px;
}

.micBtn,
.stopBtn,
.saveBtn{
font-size:24px;
padding:22px 10px;
}

.resultBox{
font-size:26px;
}

}

</style>
</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
音声入力DX
</div>

<div class="sub">
しゃべる → 文字になる → 登録する
</div>

<div class="btnRow">

<button class="micBtn" id="micBtn">
🎤 話す
</button>

<button class="stopBtn" id="stopBtn">
■ 終了
</button>

</div>

<div class="resultBox" id="resultBox">
ここに音声認識結果が表示されます
</div>

<button class="saveBtn" id="saveBtn">
登録する
</button>

<div class="status" id="status">
待機中
</div>

</div>

</div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbwcI22by_MWHxYExwuQf4b4GQmQjkYdUSPWeicmG7b2j99SutkILo3Bxow5WjlExcw/exec';

const micBtn = document.getElementById("micBtn");
const stopBtn = document.getElementById("stopBtn");
const saveBtn = document.getElementById("saveBtn");
const resultBox = document.getElementById("resultBox");
const statusBox = document.getElementById("status");

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

let recognition;

if(!SpeechRecognition){

resultBox.innerText =
"このブラウザは音声認識に対応していません";

}else{

recognition = new SpeechRecognition();

recognition.lang = "ja-JP";
recognition.interimResults = true;
recognition.continuous = true;

micBtn.onclick = () => {

resultBox.innerText = "";

recognition.start();

statusBox.innerText = "聞き取り中";

};

stopBtn.onclick = () => {

recognition.stop();

statusBox.innerText = "停止しました";

};

recognition.onresult = (event) => {

let text = "";

for(let i = 0; i < event.results.length; i++){

text += event.results[i][0].transcript;

}

resultBox.innerText = text;

};

recognition.onerror = (event) => {

statusBox.innerText =
"エラー：" + event.error;

};

recognition.onend = () => {

speechSynthesis.speak(
new SpeechSynthesisUtterance(
"登録内容を確認してください"
)
);

};

}

saveBtn.onclick = async () => {

const text = resultBox.innerText.trim();

if(!text || text === "ここに音声認識結果が表示されます"){

alert("音声がありません");

return;

}

statusBox.innerText = "登録中...";

try{

const response = await fetch(GAS_URL,{

method:"POST",

body:JSON.stringify({
text:text
})

});

const data = await response.json();

statusBox.innerText =
"登録完了：" + data.category;

speechSynthesis.speak(
new SpeechSynthesisUtterance(
"登録しました"
)
);

}catch(error){

statusBox.innerText =
"登録失敗";

}

};

</script>

</body>
</html>
