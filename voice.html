<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>音声メモ｜見守りDX</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>

*{margin:0;padding:0;box-sizing:border-box}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:560px;
margin:auto;
padding:16px;
}

.header{
background:#6a1b9a;
color:#fff;
border-radius:26px;
padding:22px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.back{
font-size:16px;
font-weight:900;
margin-bottom:12px;
cursor:pointer;
}

.title{
font-size:34px;
font-weight:900;
}

.sub{
font-size:16px;
margin-top:6px;
opacity:.95;
}

.card{
background:#fff;
border-radius:26px;
padding:20px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.mic{
font-size:90px;
text-align:center;
margin-top:10px;
margin-bottom:20px;
}

.text{
font-size:22px;
font-weight:800;
line-height:1.8;
text-align:center;
color:#555;
margin-bottom:20px;
}

.result{
background:#f3e5f5;
border-radius:18px;
padding:18px;
font-size:22px;
font-weight:800;
line-height:1.8;
min-height:140px;
}

.btn{
width:100%;
border:none;
border-radius:24px;
padding:24px;
font-size:28px;
font-weight:900;
color:#fff;
background:#8e24aa;
margin-top:18px;
cursor:pointer;
}

.stopBtn{
background:#d32f2f;
}

.footer{
display:flex;
justify-content:space-around;
margin-top:20px;
padding:18px 0;
background:#fff;
border-radius:22px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
font-size:14px;
font-weight:900;
color:#666;
}

</style>
</head>

<body>

<div class="wrap">

<div class="header">

<div class="back" onclick="location.href='index.html'">
← トップへ戻る
</div>

<div class="title">
🎤 音声メモ
</div>

<div class="sub">
話した内容を記録します
</div>

</div>

<div class="card">

<div class="mic">
🎤
</div>

<div class="text">
ボタンを押して話してください
</div>

<div id="result" class="result">
ここに音声メモが表示されます
</div>

<button class="btn" onclick="startRecognition()">
🎤 話し始める
</button>

<button class="btn stopBtn" onclick="stopRecognition()">
⏹ 停止
</button>

</div>

<div class="footer">

<div onclick="location.href='index.html'">
見守り
</div>

<div onclick="location.href='schedule.html'">
予定
</div>

<div onclick="location.href='gomi.html'">
ゴミ
</div>

<div onclick="location.href='news.html'">
地域情報
</div>

</div>

</div>

<script>

let recognition;

if('webkitSpeechRecognition' in window){

recognition=new webkitSpeechRecognition();

recognition.lang='ja-JP';

recognition.continuous=true;

recognition.onresult=function(event){

let text='';

for(let i=event.resultIndex;i<event.results.length;i++){

text+=event.results[i][0].transcript;

}

document.getElementById('result').innerText=text;

};

}

function startRecognition(){

if(recognition){
recognition.start();
}

}

function stopRecognition(){

if(recognition){
recognition.stop();
}

}

</script>

</body>
</html>
