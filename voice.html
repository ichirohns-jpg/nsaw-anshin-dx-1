<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>音声案内</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
}

.header{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:#fff;
border-radius:24px;
padding:20px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
margin-bottom:16px;
}

.voiceBtn{
width:100%;
border:none;
border-radius:28px;
padding:34px;
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
font-size:34px;
font-weight:900;
margin-bottom:16px;
cursor:pointer;
}

.stopBtn{
width:100%;
border:none;
border-radius:28px;
padding:28px;
background:#ef4444;
color:#fff;
font-size:28px;
font-weight:900;
cursor:pointer;
}

.title{
font-size:24px;
font-weight:900;
margin-bottom:12px;
}

.result{
font-size:22px;
line-height:1.8;
font-weight:700;
min-height:120px;
}

.home{
display:block;
text-decoration:none;
background:#475569;
color:#fff;
padding:20px;
border-radius:20px;
text-align:center;
font-size:22px;
font-weight:900;
}

</style>

</head>

<body>

<div class="header">
<h1>🎤 音声案内</h1>
</div>

<div class="card">

<button
class="voiceBtn"
onclick="startVoice()">

🎤 話しかける

</button>

<button
class="stopBtn"
onclick="stopVoice()">

🔇 停止

</button>

</div>

<div class="card">

<div class="title">
🎤 聞き取り内容
</div>

<div
id="speechArea"
class="result">

待機中

</div>

</div>

<div class="card">

<div class="title">
🤖 音声案内
</div>

<div
id="resultArea"
class="result">

ボタンを押して話してください

</div>

</div>

<a
href="index.html"
class="home">

🏠 トップへ戻る

</a>

<script>

let recognition;

function stopVoice(){

try{

speechSynthesis.cancel();

if(recognition){
recognition.stop();
}

}catch(e){}

document.getElementById(
'resultArea'
).innerHTML =
'停止しました';

}

function speak(text){

speechSynthesis.cancel();

const speech =
new SpeechSynthesisUtterance(
text
);

speech.lang='ja-JP';

speech.rate=0.9;

speechSynthesis.speak(
speech
);

document.getElementById(
'resultArea'
).innerHTML =
text;

}

function startVoice(){

if(
!('webkitSpeechRecognition' in window)
){

alert('音声認識未対応');

return;

}

recognition =
new webkitSpeechRecognition();

recognition.lang =
'ja-JP';

recognition.start();

recognition.onresult =
function(e){

const text =
e.results[0][0].transcript;

document.getElementById(
'speechArea'
).innerHTML =
text;

speak(
'聞き取りました。' +
text
);

};

}

</script>

</body>
</html>
