<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>予定を入れる</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:12px;
  background:#eef4f8;
  font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  color:#123;
}

.wrap{
  max-width:720px;
  margin:0 auto;
}

.card{
  background:white;
  border-radius:28px;
  padding:18px;
  box-shadow:0 8px 22px rgba(0,0,0,.08);
}

.title{
  font-size:40px;
  font-weight:900;
  text-align:center;
  color:#1565c0;
  margin:0 0 18px;
  line-height:1.3;
}

.status{
  background:#fff8e1;
  border-radius:22px;
  padding:18px;
  font-size:28px;
  font-weight:900;
  line-height:1.5;
  text-align:center;
  color:#333;
  margin-bottom:18px;
}

.inputBox{
  width:100%;
  min-height:260px;
  border:4px solid #d7e6ff;
  outline:none;
  resize:none;
  background:#f8fbff;
  border-radius:26px;
  padding:20px;
  font-size:34px;
  font-weight:900;
  line-height:1.6;
  color:#123;
  margin-bottom:18px;
}

.inputBox::placeholder{
  color:#999;
}

.bigBtn{
  width:100%;
  border:none;
  border-radius:28px;
  padding:28px 12px;
  font-size:32px;
  font-weight:900;
  color:white;
  cursor:pointer;
  margin-bottom:14px;
}

.saveBtn{
  background:#2e7d32;
}

.clearBtn{
  background:#777;
}

.linkBtn{
  display:block;
  width:100%;
  text-align:center;
  text-decoration:none;
  border-radius:28px;
  padding:26px 12px;
  font-size:30px;
  font-weight:900;
  color:white;
  background:#1976d2;
  margin-top:4px;
}

@media(max-width:600px){
  .title{
    font-size:34px;
  }

  .status{
    font-size:24px;
  }

  .inputBox{
    font-size:30px;
    min-height:240px;
  }

  .bigBtn{
    font-size:28px;
    padding:26px 10px;
  }

  .linkBtn{
    font-size:27px;
  }
}
</style>
</head>

<body>

<div class="wrap">
<div class="card">

<h1 class="title">
予定を入れる
</h1>

<div class="status" id="statusBox">
下の白いところを押して<br>
マイクで話してください
</div>

<textarea
  class="inputBox"
  id="inputBox"
  placeholder="例：6月3日13時歯医者"
  autocomplete="off"
  autocorrect="off"
  autocapitalize="off"
  spellcheck="false"
></textarea>

<button class="bigBtn saveBtn" id="saveBtn">
✅ 登録する
</button>

<button class="bigBtn clearBtn" id="clearBtn">
🗑 消す
</button>

<a class="linkBtn" href="today.html?v=newgas1">
📅 今日の予定を見る
</a>

</div>
</div>

<script>
const GAS_URL =
'https://script.google.com/macros/s/AKfycbw4YiYDnGsBAliOBrOp8m7hAWuLI-reu4J2vXKcVnERsU95uvgRS9a8avVhwvpALp3I/exec';

const inputBox =
document.getElementById("inputBox");

const saveBtn =
document.getElementById("saveBtn");

const clearBtn =
document.getElementById("clearBtn");

const statusBox =
document.getElementById("statusBox");

let isSaving =
false;

function stopAllSpeech(){
  try{
    if(window.speechSynthesis){
      window.speechSynthesis.cancel();
    }
  }catch(e){}
}

window.addEventListener("load",function(){
  stopAllSpeech();
  inputBox.value = "";
});

window.addEventListener("pageshow",function(){
  stopAllSpeech();
});

inputBox.addEventListener("focus",function(){
  statusBox.innerHTML =
  "マイクで話してください";
});

inputBox.addEventListener("input",function(){
  statusBox.innerHTML =
  "文字を確認して<br>よければ登録";
});

function getText(){
  return inputBox.value.trim();
}

clearBtn.onclick =
function(){
  stopAllSpeech();
  inputBox.value = "";
  statusBox.innerHTML =
  "消しました<br>もう一度話せます";
  inputBox.focus();
};

saveBtn.onclick =
async function(){

  stopAllSpeech();

  if(isSaving){
    return;
  }

  const text =
  getText();

  if(!text){
    alert("文字がありません");
    statusBox.innerHTML =
    "文字がありません";
    return;
  }

  isSaving =
  true;

  saveBtn.disabled =
  true;

  statusBox.innerHTML =
  "登録中...";

  try{

    const url =
    GAS_URL +
    '?mode=voice&text=' +
    encodeURIComponent(text) +
    '&t=' +
    Date.now();

    const response =
    await fetch(url);

    const data =
    await response.json();

    console.log(data);

    if(data.ok === true || data.status === "success"){

      statusBox.innerHTML =
      "登録しました";

      inputBox.value =
      "";

    }else{

      statusBox.innerHTML =
      "登録できません";

      alert(
        data.error ||
        data.message ||
        "登録に失敗しました"
      );

    }

  }catch(error){

    console.error(error);

    statusBox.innerHTML =
    "通信エラー";

    alert(
      "通信エラーです"
    );

  }finally{

    isSaving =
    false;

    saveBtn.disabled =
    false;

  }

};
</script>

</body>
</html>
