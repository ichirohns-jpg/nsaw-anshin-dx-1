<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>今日の予定</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:12px;
  background:#eef4f8;
  font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  color:#123;
}

.wrap{
  max-width:720px;
  margin:auto;
}

.card{
  background:#fff;
  border-radius:26px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.title{
  font-size:32px;
  font-weight:900;
  text-align:center;
  color:#1565c0;
  margin:0 0 12px;
}

.status{
  font-size:22px;
  font-weight:900;
  text-align:center;
  line-height:1.5;
  color:#666;
  white-space:pre-wrap;
  margin:8px 0 14px;
}

.sectionTitle{
  font-size:30px;
  font-weight:900;
  color:#1565c0;
  margin:0 0 14px;
}

.event{
  background:#f5f7fa;
  border-radius:22px;
  padding:18px;
  margin-bottom:14px;
}

.time{
  font-size:28px;
  font-weight:900;
  color:#d84315;
  margin-bottom:8px;
}

.eventTitle{
  font-size:28px;
  font-weight:900;
  line-height:1.6;
  white-space:pre-wrap;
}

.empty{
  background:#f5f7fa;
  border-radius:22px;
  padding:20px;
  font-size:26px;
  font-weight:900;
  color:#666;
  line-height:1.6;
}

.reloadBtn{
  width:100%;
  border:none;
  border-radius:24px;
  padding:22px 12px;
  font-size:25px;
  font-weight:900;
  color:white;
  background:#1976d2;
  cursor:pointer;
  margin-bottom:12px;
}

.backBtn{
  display:block;
  text-align:center;
  text-decoration:none;
  background:#555;
  color:white;
  border-radius:24px;
  padding:22px 12px;
  font-size:24px;
  font-weight:900;
}

.error{
  background:#fff3f3;
  border-radius:22px;
  padding:20px;
  font-size:24px;
  font-weight:900;
  color:#b71c1c;
  line-height:1.6;
  white-space:pre-wrap;
}

.small{
  font-size:18px;
  font-weight:800;
  line-height:1.6;
  color:#666;
  text-align:center;
  margin-top:10px;
}

@media(max-width:600px){
  .card{
    padding:16px;
    border-radius:24px;
  }

  .title{
    font-size:29px;
  }

  .sectionTitle{
    font-size:27px;
  }

  .time{
    font-size:25px;
  }

  .eventTitle{
    font-size:25px;
  }

  .empty{
    font-size:23px;
  }

  .reloadBtn,
  .backBtn{
    font-size:22px;
  }

  .status{
    font-size:20px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
今日の予定
</div>

<div class="status" id="status">
予定を読み込み中...
</div>

<button class="reloadBtn" id="reloadBtn">
予定を更新する
</button>

<a class="backBtn" href="voice.html?v=reset1">
音声入力へ戻る
</a>

<div class="small">
このページは読み上げません。<br>
Googleカレンダーの予定を大きな文字で表示します。
</div>

</div>

<div class="card">

<div class="sectionTitle">
今日
</div>

<div id="todayBox">
<div class="empty">
読み込み中...
</div>
</div>

</div>

<div class="card">

<div class="sectionTitle">
明日
</div>

<div id="tomorrowBox">
<div class="empty">
読み込み中...
</div>
</div>

</div>

</div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbyuvE3vVhq63yNMasPZhaJR3zMat9ShOAY7sDBZtIkRWUJ231LamYQDaJ7ro-qX05Fk/exec';

const statusBox =
document.getElementById("status");

const todayBox =
document.getElementById("todayBox");

const tomorrowBox =
document.getElementById("tomorrowBox");

const reloadBtn =
document.getElementById("reloadBtn");

function stopAllSpeech(){
  try{
    if(window.speechSynthesis){
      window.speechSynthesis.cancel();
    }
  }catch(e){}
}

window.addEventListener("load",function(){
  stopAllSpeech();
});

window.addEventListener("pageshow",function(){
  stopAllSpeech();
});

window.addEventListener("pagehide",function(){
  stopAllSpeech();
});

function escapeHtml(str){
  return String(str || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function buildEvents(events,emptyText){

  if(!events || events.length === 0){

    return `
      <div class="empty">
      ${emptyText}
      </div>
    `;

  }

  let html =
  "";

  events.forEach(function(ev){

    html += `
      <div class="event">
        <div class="time">
          ${escapeHtml(ev.start)} 〜 ${escapeHtml(ev.end)}
        </div>
        <div class="eventTitle">
          ${escapeHtml(ev.title)}
        </div>
      </div>
    `;

  });

  return html;

}

async function loadSchedule(){

  stopAllSpeech();

  statusBox.innerText =
  "予定を読み込み中...";

  todayBox.innerHTML =
  '<div class="empty">読み込み中...</div>';

  tomorrowBox.innerHTML =
  '<div class="empty">読み込み中...</div>';

  try{

    const url =
    GAS_URL +
    '?mode=today&t=' +
    Date.now();

    const response =
    await fetch(url);

    const data =
    await response.json();

    console.log(data);

    if(!data.ok){

      throw new Error(
        data.error ||
        data.message ||
        "予定を取得できませんでした"
      );

    }

    todayBox.innerHTML =
    buildEvents(
      data.today,
      "今日の予定はありません"
    );

    tomorrowBox.innerHTML =
    buildEvents(
      data.tomorrow,
      "明日の予定はありません"
    );

    statusBox.innerText =
    "予定を読み込みました";

  }catch(error){

    console.error(error);

    statusBox.innerText =
    "読み込み失敗";

    todayBox.innerHTML =
    `
      <div class="error">
      ${escapeHtml(error.message || String(error))}
      </div>
    `;

    tomorrowBox.innerHTML =
    `
      <div class="empty">
      予定を表示できません
      </div>
    `;

  }

}

reloadBtn.onclick =
function(){
  loadSchedule();
};

loadSchedule();

</script>

</body>
</html>
