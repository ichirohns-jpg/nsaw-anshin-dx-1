<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音声入力DX</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
padding:12px;
background:#eef4f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#123;
}

.wrap{
max-width:720px;
margin:auto;
}

.card{
background:#fff;
border-radius:26px;
padding:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.title{
font-size:30px;
font-weight:900;
text-align:center;
color:#1565c0;
line-height:1.35;
margin:0 0 8px;
}

.status{
font-size:22px;
font-weight:900;
text-align:center;
line-height:1.5;
color:#666;
white-space:pre-wrap;
margin:8px 0 14px;
}

.mainBtn{
width:100%;
border:none;
border-radius:30px;
padding:36px 12px;
font-size:38px;
font-weight:900;
color:white;
background:#1976d2;
cursor:pointer;
box-shadow:0 8px 18px rgba(0,0,0,.18);
margin-bottom:14px;
}

.mainBtn.recording{
background:#d32f2f;
}

.mainBtn.processing{
background:#6a1b9a;
}

.resultBox{
background:#f5f7fa;
border-radius:24px;
padding:20px;
min-height:190px;
font-size:30px;
font-weight:900;
line-height:1.7;
white-space:pre-wrap;
margin-bottom:14px;
}

.actionRow{
display:flex;
gap:12px;
margin-bottom:12px;
}

.saveBtn,
.clearBtn{
flex:1;
border:none;
border-radius:24px;
padding:24px 8px;
font-size:26px;
font-weight:900;
color:white;
cursor:pointer;
}

.saveBtn{
background:#2e7d32;
}

.clearBtn{
background:#777;
}

.readBtn{
width:100%;
border:none;
border-radius:24px;
padding:22px 12px;
font-size:25px;
font-weight:900;
color:white;
background:#ef6c00;
cursor:pointer;
margin-bottom:12px;
}

.linkBtn{
display:block;
text-align:center;
text-decoration:none;
background:#555;
color:white;
border-radius:24px;
padding:22px 12px;
font-size:24px;
font-weight:900;
margin-top:12px;
}

.small{
font-size:18px;
font-weight:800;
line-height:1.6;
color:#666;
text-align:center;
margin-top:10px;
}
