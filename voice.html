<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>音声入力DX</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
padding:20px;
background:#eef4f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#123;
}

.wrap{max-width:720px;margin:auto}

.card{
background:#fff;
border-radius:28px;
padding:24px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.title{
font-size:42px;
font-weight:900;
text-align:center;
color:#1565c0;
margin-bottom:12px;
}

.sub{
font-size:24px;
text-align:center;
line-height:1.7;
margin-bottom:24px;
}

.note{
font-size:22px;
line-height:1.7;
font-weight:800;
color:#555;
background:#fff8e1;
border-radius:20px;
padding:18px;
margin-bottom:20px;
}

.btnRow{
display:flex;
gap:12px;
margin-bottom:18px;
}

.micBtn,.stopBtn,.clearBtn{
flex:1;
border:none;
border-radius:24px;
padding:24px 8px;
color:white;
font-size:24px;
font-weight:900;
cursor:pointer;
}

.micBtn{background:#1976d2}
.stopBtn{background:#d32f2f}
.clearBtn{background:#777}

.readBtn{
width:100%;
border:none;
border-radius:24px;
padding:24px 12px;
background:#ef6c00;
color:white;
font-size:28px;
font-weight:900;
cursor:pointer;
margin-top:18px;
}

.saveBtn{
width:100%;
border:none;
border-radius:24px;
padding:28px 14px;
background:#2e7d32;
color:white;
font-size:32px;
font-weight:900;
cursor:pointer;
margin-top:18px;
}

.resultBox{
background:#f5f7fa;
border-radius:22px;
padding:20px;
min-height:190px;
font-size:30px;
font-weight:700;
line-height:1.8;
white-space:pre-wrap;
}

.status{
margin-top:20px;
font-size:26px;
font-weight:900;
text-align:center;
color:#666;
white-space:pre-wrap;
}

.linkBtn{
display:block;
text-align:center;
text-decoration:none;
background:#555;
color:white;
border-radius:24px;
padding:24px 14px;
font-size:26px;
font-weight:900;
margin-top:18px;
}

@media(max-width:600px){
body{padding:14px}
.title{font-size:34px}
.sub{font-size:20px}
.note{font-size:20px}
.micBtn,.stopBtn,.clearBtn{font-size:21px;padding:20px 6px}
.resultBox{font-size:26px}
.readBtn{font-size:25px}
.saveBtn{font-size:28px}
.status{font-size:24px}
.linkBtn{font-size:24px}
}
</style>
</head>

<body>

<div class="wrap">
<div class="card">

<div class="title">音声入力DX</div>

<div class="sub">
しゃべる → 確認 → 登録
</div>

<div class="note">
前の内容は、話すたびに自動で消えます。<br>
間違ったら「消す」を押して、もう一度しゃべってください。
</div>

<div class="btnRow">
<button class="micBtn" id="micBtn">🎤 話す</button>
<button class="stopBtn" id="stopBtn">■ 終了</button>
<button class="clearBtn" id="clearBtn">🗑 消す</button>
</div>

<div class="resultBox" id="resultBox">
ここに音声認識結果が表示されます
</div>

<button class="readBtn" id="readBtn">
🔊 内容を確認する
</button>

<button class="saveBtn" id="saveBtn">
✅ 登録する
</button>

<div class="status" id="status">
待機中
</div>

<a class="linkBtn" href="today.html">
📅 今日の予定を見る
</a>

</div>
</div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbwj-czUnQmBRJy1jWOY-O6O5_By2-Hgjsnb2No_HrdHYVxb5KVz3I9ysjrjmdvl1nLX/exec';

const micBtn = document.getElementById("micBtn");
const stopBtn = document.getElementById("stopBtn");
const clearBtn = document.getElementById("clearBtn");
const readBtn = document.getElementById("readBtn");
const saveBtn = document.getElementById("saveBtn");
const resultBox = document.getElementById("resultBox");
const statusBox = document.getElementById("status");

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

let recognition = null;
let listening = false;
let finalText = "";

function speak(text){

speechSynthesis.cancel();

const uttr =
new SpeechSynthesisUtterance(text);

uttr.lang = "ja-JP";
uttr.rate = 0.95;

speechSynthesis.speak(uttr);

}

function resetText(){

finalText = "";

resultBox.innerText =
"ここに音声認識結果が表示されます";

}

function getText(){

const text =
resultBox.innerText.trim();

if(text === "ここに音声認識結果が表示されます"){
return "";
}

return text;

}

function stopRecognition(){

try{

if(recognition && listening){
recognition.stop();
}

}catch(e){}

listening = false;

}

function createRecognition(){

recognition =
new SpeechRecognition();

recognition.lang =
"ja-JP";

recognition.interimResults =
true;

recognition.continuous =
false;

recognition.onstart =
() => {

listening = true;
statusBox.innerText = "聞き取り中";

};

recognition.onresult =
(event) => {

let interimText = "";

for(let i = 0; i < event.results.length; i++){

const transcript =
event.results[i][0].transcript;

if(event.results[i].isFinal){

finalText += transcript;

}else{

interimText += transcript;

}

}

resultBox.innerText =
(finalText + interimText).trim();

};

recognition.onerror =
(event) => {

listening = false;

statusBox.innerText =
"エラー：" + event.error;

};

recognition.onend =
() => {

listening = false;

const text =
getText();

if(text){

statusBox.innerText =
"認識しました";

speak(
"認識しました。内容を確認してください。"
);

}else{

statusBox.innerText =
"待機中";

}

};

}

if(!SpeechRecognition){

resultBox.innerText =
"このブラウザは音声認識に対応していません";

statusBox.innerText =
"未対応";

}else{

createRecognition();

}

micBtn.onclick =
() => {

speechSynthesis.cancel();

try{
if(recognition && listening){
recognition.abort();
}
}catch(e){}

finalText = "";
resultBox.innerText = "";
statusBox.innerText = "聞き取り準備中";

createRecognition();

setTimeout(() => {
recognition.start();
}, 200);

};

stopBtn.onclick =
() => {

stopRecognition();

statusBox.innerText =
"停止しました";

};

clearBtn.onclick =
() => {

try{
if(recognition && listening){
recognition.abort();
}
}catch(e){}

listening = false;

resetText();

statusBox.innerText =
"消しました。もう一度しゃべれます。";

speak(
"消しました。もう一度しゃべってください。"
);

};

readBtn.onclick =
() => {

const text =
getText();

if(!text){

statusBox.innerText =
"音声がありません";

speak(
"まだ音声がありません。"
);

return;

}

statusBox.innerText =
"読み上げ確認中";

speak(
"登録する内容は、" +
text +
"、です。よろしければ登録するを押してください。"
);

};

saveBtn.onclick =
async () => {

const text =
getText();

if(!text){

alert("音声がありません");

speak(
"音声がありません。"
);

return;

}

statusBox.innerText =
"登録中...";

try{

const url =
GAS_URL +
'?mode=voice&text=' +
encodeURIComponent(text) +
'&t=' +
Date.now();

const response =
await fetch(url);

const data =
await response.json();

console.log(data);

if(data.ok){

if(data.calendar_registered === true){

statusBox.innerText =
"登録成功：カレンダー登録済み";

speak(
"カレンダーに登録しました。"
);

}else{

statusBox.innerText =
"登録成功：" +
(data.category || "記録");

speak(
"記録しました。"
);

}

}else{

statusBox.innerText =
"登録失敗\n" +
(data.error || data.message || "");

speak(
"登録に失敗しました。"
);

alert(
data.error ||
data.message ||
"登録に失敗しました"
);

}

}catch(error){

console.error(error);

statusBox.innerText =
"通信エラー";

speak(
"通信エラーです。"
);

alert(
"通信エラーです。GAS URLかデプロイ設定を確認してください。"
);

}

};

</script>

</body>
</html>
