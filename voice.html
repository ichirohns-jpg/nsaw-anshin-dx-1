<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>音声入力DX</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
padding:20px;
background:#eef4f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#123;
}

.wrap{
max-width:720px;
margin:auto;
}

.card{
background:#fff;
border-radius:28px;
padding:24px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.title{
font-size:42px;
font-weight:900;
text-align:center;
color:#1565c0;
margin-bottom:12px;
}

.sub{
font-size:24px;
text-align:center;
line-height:1.7;
margin-bottom:28px;
}

.btnRow{
display:flex;
gap:14px;
margin-bottom:18px;
}

.micBtn,
.stopBtn,
.clearBtn{
flex:1;
border:none;
border-radius:24px;
padding:26px 12px;
color:white;
font-size:28px;
font-weight:900;
cursor:pointer;
}

.micBtn{
background:#1976d2;
}

.stopBtn{
background:#d32f2f;
}

.clearBtn{
background:#777;
}

.saveBtn{
width:100%;
border:none;
border-radius:24px;
padding:30px 14px;
background:#2e7d32;
color:white;
font-size:34px;
font-weight:900;
cursor:pointer;
margin-top:18px;
}

.readBtn{
width:100%;
border:none;
border-radius:24px;
padding:26px 14px;
background:#ef6c00;
color:white;
font-size:30px;
font-weight:900;
cursor:pointer;
margin-top:18px;
}

.resultBox{
background:#f5f7fa;
border-radius:22px;
padding:20px;
min-height:190px;
font-size:30px;
font-weight:700;
line-height:1.8;
white-space:pre-wrap;
}

.status{
margin-top:20px;
font-size:28px;
font-weight:900;
text-align:center;
color:#666;
white-space:pre-wrap;
}

.linkBtn{
display:block;
text-align:center;
text-decoration:none;
background:#555;
color:white;
border-radius:24px;
padding:24px 14px;
font-size:28px;
font-weight:900;
margin-top:18px;
}

.note{
font-size:22px;
line-height:1.7;
font-weight:800;
color:#555;
background:#fff8e1;
border-radius:20px;
padding:18px;
margin-bottom:20px;
}

@media(max-width:600px){

body{
padding:14px;
}

.title{
font-size:34px;
}

.sub{
font-size:20px;
}

.micBtn,
.stopBtn,
.clearBtn{
font-size:22px;
padding:22px 8px;
}

.saveBtn{
font-size:28px;
padding:24px 12px;
}

.readBtn{
font-size:26px;
padding:22px 12px;
}

.resultBox{
font-size:26px;
}

.status{
font-size:24px;
}

.linkBtn{
font-size:24px;
}

.note{
font-size:20px;
}

}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
音声入力DX
</div>

<div class="sub">
しゃべる → 確認 → 登録
</div>

<div class="note">
間違っていたら「消す」を押して、もう一度しゃべってください。<br>
細かい修正はせず、やり直す方式です。
</div>

<div class="btnRow">

<button class="micBtn" id="micBtn">
🎤 話す
</button>

<button class="stopBtn" id="stopBtn">
■ 終了
</button>

<button class="clearBtn" id="clearBtn">
🗑 消す
</button>

</div>

<div class="resultBox" id="resultBox">
ここに音声認識結果が表示されます
</div>

<button class="readBtn" id="readBtn">
🔊 内容を確認する
</button>

<button class="saveBtn" id="saveBtn">
✅ 登録する
</button>

<div class="status" id="status">
待機中
</div>

<a class="linkBtn" href="today.html">
📅 今日の予定を見る
</a>

</div>

</div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbwj-czUnQmBRJy1jWOY-O6O5_By2-Hgjsnb2No_HrdHYVxb5KVz3I9ysjrjmdvl1nLX/exec';

const micBtn =
document.getElementById("micBtn");

const stopBtn =
document.getElementById("stopBtn");

const clearBtn =
document.getElementById("clearBtn");

const readBtn =
document.getElementById("readBtn");

const saveBtn =
document.getElementById("saveBtn");

const resultBox =
document.getElementById("resultBox");

const statusBox =
document.getElementById("status");

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

let recognition;

function speak(text){

speechSynthesis.cancel();

const uttr =
new SpeechSynthesisUtterance(text);

uttr.lang =
"ja-JP";

uttr.rate =
0.95;

speechSynthesis.speak(uttr);

}

function getText(){

return resultBox.innerText.trim();

}

function isEmptyText(text){

return (
!text ||
text === "ここに音声認識結果が表示されます"
);

}

if(!SpeechRecognition){

resultBox.innerText =
"このブラウザは音声認識に対応していません";

statusBox.innerText =
"未対応";

}else{

recognition =
new SpeechRecognition();

recognition.lang =
"ja-JP";

recognition.interimResults =
true;

recognition.continuous =
true;

micBtn.onclick =
() => {

resultBox.innerText =
"";

recognition.start();

statusBox.innerText =
"聞き取り中";

};

stopBtn.onclick =
() => {

recognition.stop();

statusBox.innerText =
"停止しました";

};

recognition.onresult =
(event) => {

let text =
"";

for(
let i = 0;
i < event.results.length;
i++
){

text +=
event.results[i][0].transcript;

}

resultBox.innerText =
text;

};

recognition.onerror =
(event) => {

statusBox.innerText =
"エラー：" +
event.error;

};

recognition.onend =
() => {

const text =
getText();

if(!isEmptyText(text)){

speak(
"認識しました。内容を確認してください。"
);

}

};

}

clearBtn.onclick =
() => {

resultBox.innerText =
"ここに音声認識結果が表示されます";

statusBox.innerText =
"消しました。もう一度しゃべれます。";

speak(
"消しました。もう一度しゃべってください。"
);

};

readBtn.onclick =
() => {

const text =
getText();

if(isEmptyText(text)){

speak(
"まだ音声がありません。"
);

statusBox.innerText =
"音声がありません";

return;

}

statusBox.innerText =
"読み上げ確認中";

speak(
"登録する内容は、" +
text +
"、です。よろしければ登録するを押してください。"
);

};

saveBtn.onclick =
async () => {

const text =
getText();

if(isEmptyText(text)){

alert("音声がありません");

speak(
"音声がありません。"
);

return;

}

statusBox.innerText =
"登録前確認中...";

speak(
"登録します。" +
text
);

setTimeout(
async () => {

statusBox.innerText =
"登録中...";

try{

const url =
GAS_URL +
'?mode=voice&text=' +
encodeURIComponent(text) +
'&t=' +
Date.now();

const response =
await fetch(url);

const data =
await response.json();

console.log(data);

if(data.ok){

if(data.calendar_registered === true){

statusBox.innerText =
"登録成功：カレンダー登録済み";

speak(
"カレンダーに登録しました。"
);

}else{

statusBox.innerText =
"登録成功：" +
(data.category || "記録");

speak(
"記録しました。"
);

}

}else{

statusBox.innerText =
"登録失敗\n" +
(data.error || data.message || "");

speak(
"登録に失敗しました。"
);

alert(
data.error ||
data.message ||
"登録に失敗しました"
);

}

}catch(error){

console.error(error);

statusBox.innerText =
"通信エラー";

speak(
"通信エラーです。"
);

alert(
"通信エラーです。GAS URLかデプロイ設定を確認してください。"
);

}

},
900
);

};

</script>

</body>
</html>
