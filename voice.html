<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>音声入力DX</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
background:#eef4f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#123;
}

.wrap{
max-width:700px;
margin:auto;
padding:20px;
}

.card{
background:white;
border-radius:28px;
padding:24px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.title{
font-size:42px;
font-weight:900;
text-align:center;
margin-bottom:10px;
color:#1565c0;
}

.sub{
font-size:22px;
text-align:center;
margin-bottom:24px;
line-height:1.6;
}

.micBtn{
width:100%;
border:none;
border-radius:24px;
padding:36px 20px;
font-size:42px;
font-weight:900;
background:#1976d2;
color:white;
cursor:pointer;
margin-bottom:24px;
}

.micBtn:active{
transform:scale(.98);
}

.resultBox{
background:#f5f7fa;
border-radius:22px;
padding:20px;
min-height:180px;
font-size:30px;
line-height:1.8;
font-weight:700;
white-space:pre-wrap;
}

.status{
margin-top:18px;
font-size:24px;
font-weight:900;
text-align:center;
color:#666;
}

@media(max-width:600px){

.title{
font-size:34px;
}

.sub{
font-size:20px;
}

.micBtn{
font-size:36px;
padding:30px 16px;
}

.resultBox{
font-size:28px;
}

}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
音声入力DX
</div>

<div class="sub">
しゃべる → 文字になる → 登録する
</div>

<button class="micBtn" id="micBtn">
🎤 話す
</button>

<div class="resultBox" id="result">
ここに音声認識結果が表示されます
</div>

<div class="status" id="status">
待機中
</div>

</div>

</div>

<script>

const micBtn = document.getElementById("micBtn");
const result = document.getElementById("result");
const statusText = document.getElementById("status");

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

alert("このブラウザは音声認識に対応していません");

}else{

const recognition = new SpeechRecognition();

recognition.lang = "ja-JP";
recognition.interimResults = false;
recognition.continuous = false;

micBtn.onclick = () => {

recognition.start();

statusText.innerText = "聞き取り中...";

};

recognition.onresult = (event) => {

const text = event.results[0][0].transcript;

result.innerText = text;

statusText.innerText = "音声認識完了";

speak("登録内容を確認してください");

};

recognition.onerror = () => {

statusText.innerText = "音声認識エラー";

};

recognition.onend = () => {

statusText.innerText = "待機中";

};

}

function speak(text){

const uttr = new SpeechSynthesisUtterance(text);

uttr.lang = "ja-JP";

speechSynthesis.speak(uttr);

}

</script>

</body>
</html>
