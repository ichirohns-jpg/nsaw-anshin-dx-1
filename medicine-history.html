<!DOCTYPE html>
<html lang="ja">

<link rel="icon" href="icon.png">

<style>

*{margin:0;padding:0;box-sizing:border-box}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:560px;
margin:auto;
padding:16px;
}

.header{
background:#3949ab;
color:#fff;
border-radius:26px;
padding:22px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.back{

font-weight:900;
margin-bottom:12px;

}

.title{

font-weight:900;
}

.sub{
font-size:16px;
margin-top:6px;
opacity:.95;
}

.card{
background:#fff;
border-radius:26px;
padding:20px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.item{
background:#eef2ff;
border-left:8px solid #3949ab;
border-radius:18px;
padding:18px;
margin-bottom:16px;
}

.time{
font-size:18px;
font-weight:900;
color:#3949ab;
margin-bottom:8px;
}

.name{
font-size:28px;
font-weight:900;
margin-bottom:8px;
}

.status{
font-size:20px;
font-weight:800;
color:#555;
}

.ok{
color:#2e7d32;
}

.ng{
color:#d32f2f;
}

.footer{
display:flex;
justify-content:space-around;
margin-top:20px;
padding:18px 0;
background:#fff;
border-radius:22px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
font-size:14px;
font-weight:900;
color:#666;
}

</style>
</head>

<body>

</div>

<div class="card">
