<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>服薬履歴</title>

<style>

*{margin:0;padding:0;box-sizing:border-box}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
}

.header{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:36px;
font-weight:900;
}

.card{
background:#fff;
padding:20px;
border-radius:24px;
margin-bottom:14px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.time{
font-size:16px;
color:#64748b;
margin-bottom:8px;
font-weight:900;
}

.status{
font-size:24px;
font-weight:900;
color:#2563eb;
}

.btn{
display:block;
width:100%;
padding:22px;
background:#475569;
color:#fff;
text-decoration:none;
text-align:center;
border-radius:20px;
font-size:24px;
font-weight:900;
margin-top:14px;
}

</style>

</head>

<body>

<div class="header">
<h1>💊 服薬履歴</h1>
</div>

<div id="list">

<div class="card">

<div class="time">
読込中...
</div>

<div class="status">
履歴取得中
</div>

</div>

</div>

<a href="index.html" class="btn">
🏠 トップへ戻る
</a>

<script>

const SHEET_ID =
'149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc';

const SHEET_NAME =
'見守り記録';

const url =
'https://docs.google.com/spreadsheets/d/' +
SHEET_ID +
'/gviz/tq?sheet=' +
encodeURIComponent(SHEET_NAME) +
'&tqx=out:json';

fetch(url)
.then(r=>r.text())
.then(text=>{

const json =
JSON.parse(
text.substring(47,text.length-2)
);

let html='';

json.table.rows.reverse().forEach(row=>{

const time =
row.c[0] ? row.c[0].v : '';

const name =
row.c[1] ? row.c[1].v : '';

const status =
row.c[2] ? row.c[2].v : '';

if(
!String(status).includes('薬')
) return;

html +=

'<div class="card">' +

'<div class="time">' +
time +
'</div>' +

'<div class="status">' +
name +
'<br>' +
status +
'</div>' +

'</div>';

});

document.getElementById(
'list'
).innerHTML =

html ||

'<div class="card"><div class="status">履歴なし</div></div>';

});

</script>

</body>
</html>
