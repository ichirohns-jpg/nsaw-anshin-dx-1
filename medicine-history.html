<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>服薬履歴</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
background:#101827;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
color:#fff;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:linear-gradient(135deg,#1e293b,#0f172a);
padding:22px;
border-radius:24px;
margin-bottom:14px;
}

.item{
background:rgba(255,255,255,.08);
padding:18px;
border-radius:18px;
font-size:22px;
font-weight:900;
line-height:1.8;
}

.blue{
border-left:8px solid #3b82f6;
}

.btn{
display:block;
width:100%;
padding:22px;
border-radius:22px;
text-decoration:none;
text-align:center;
font-size:24px;
font-weight:900;
color:#fff;
background:linear-gradient(135deg,#475569,#334155);
margin-top:16px;
}

</style>
</head>

<body>

<div class="header">
<h1>💊 服薬履歴</h1>
</div>

<div class="card">

<div id="historyArea" class="item blue">

履歴なし

</div>

</div>

<a href="history.html" class="btn">
📋 見守り履歴へ戻る
</a>

<a href="index.html" class="btn">
🏠 トップへ戻る
</a>

<script>

const medicine =
JSON.parse(
localStorage.getItem(
'medicineStatus'
) || '{}'
);

let html = '';

if(medicine.morning){
html += '☑ 朝　' + medicine.morningTime + '<br><br>';
}

if(medicine.noon){
html += '☑ 昼　' + medicine.noonTime + '<br><br>';
}

if(medicine.evening){
html += '☑ 夕方　' + medicine.eveningTime + '<br><br>';
}

if(medicine.night){
html += '☑ 寝る前　' + medicine.nightTime + '<br><br>';
}

if(html){
document.getElementById(
'historyArea'
).innerHTML = html;
}

</script>

</body>
</html>
