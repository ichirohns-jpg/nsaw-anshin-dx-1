<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>周辺施設｜見守りDX</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>

*{margin:0;padding:0;box-sizing:border-box}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:560px;
margin:auto;
padding:16px;
}

.header{
background:#0277bd;
color:#fff;
border-radius:26px;
padding:22px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.back{
font-size:16px;
font-weight:900;
margin-bottom:12px;
cursor:pointer;
}

.title{
font-size:34px;
font-weight:900;
}

.sub{
font-size:16px;
margin-top:6px;
opacity:.95;
}

.card{
background:#fff;
border-radius:26px;
padding:20px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.item{
background:#e3f2fd;
border-left:8px solid #0277bd;
border-radius:18px;
padding:18px;
margin-bottom:16px;
}

.name{
font-size:26px;
font-weight:900;
color:#01579b;
margin-bottom:8px;
}

.text{
font-size:18px;
font-weight:700;
color:#555;
line-height:1.7;
}

.btn{
width:100%;
border:none;
border-radius:22px;
padding:20px;
font-size:24px;
font-weight:900;
color:#fff;
background:#0277bd;
margin-top:14px;
cursor:pointer;
}

.btn:active{
transform:scale(.97);
}

.footer{
display:flex;
justify-content:space-around;
margin-top:20px;
padding:18px 0;
background:#fff;
border-radius:22px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
font-size:14px;
font-weight:900;
color:#666;
}

</style>
</head>

<body>

<div class="wrap">

<div class="header">

<div class="back" onclick="location.href='index.html'">
← トップへ戻る
</div>

<div class="title">
📍 周辺施設
</div>

<div class="sub">
近くの施設を確認します
</div>

</div>

<div class="card">

<div class="item">
<div class="name">🏪 近くのコンビニ</div>
<div class="text">現在地周辺のコンビニをGoogleマップで探します。</div>
<button class="btn" onclick="openMap('コンビニ')">地図で見る</button>
</div>

<div class="item">
<div class="name">🚻 近くのトイレ</div>
<div class="text">近くの公衆トイレや利用できる施設を探します。</div>
<button class="btn" onclick="openMap('トイレ')">地図で見る</button>
</div>

<div class="item">
<div class="name">🌳 近くの公園</div>
<div class="text">休憩できる公園をGoogleマップで探します。</div>
<button class="btn" onclick="openMap('公園')">地図で見る</button>
</div>

<div class="item">
<div class="name">💊 近くの薬局</div>
<div class="text">近くの薬局をGoogleマップで探します。</div>
<button class="btn" onclick="openMap('薬局')">地図で見る</button>
</div>

</div>

<div class="footer">

<div onclick="location.href='index.html'">見守り</div>
<div onclick="location.href='schedule.html'">予定</div>
<div onclick="location.href='gomi.html'">ゴミ</div>
<div onclick="location.href='news.html'">地域情報</div>

</div>

</div>

<script>

function openMap(keyword){
window.open("https://www.google.com/maps/search/"+encodeURIComponent(keyword),"_blank");
}

</script>

</body>
</html>
