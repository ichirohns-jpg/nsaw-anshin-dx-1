<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>相談｜見守りDX</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>

*{margin:0;padding:0;box-sizing:border-box}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:560px;
margin:auto;
padding:16px;
}

.header{
background:#1976d2;
color:#fff;
border-radius:26px;
padding:22px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.back{
font-size:16px;
font-weight:900;
margin-bottom:12px;
cursor:pointer;
}

.title{
font-size:34px;
font-weight:900;
}

.sub{
font-size:16px;
margin-top:6px;
opacity:.95;
}

.card{
background:#fff;
border-radius:26px;
padding:20px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

textarea{
width:100%;
height:260px;
border:none;
outline:none;
resize:none;
font-size:26px;
font-weight:800;
line-height:1.8;
background:#f7fbff;
border-radius:20px;
padding:18px;
}

.btn{
width:100%;
border:none;
border-radius:24px;
padding:24px;
font-size:26px;
font-weight:900;
color:#fff;
background:#1976d2;
margin-top:18px;
cursor:pointer;
}

.callBtn{
background:#43a047;
}

.footer{
display:flex;
justify-content:space-around;
margin-top:20px;
padding:18px 0;
background:#fff;
border-radius:22px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
font-size:14px;
font-weight:900;
color:#666;
}

</style>
</head>

<body>

<div class="wrap">

<div class="header">

<div class="back" onclick="location.href='index.html'">
← トップへ戻る
</div>

<div class="title">
💬 相談
</div>

<div class="sub">
困っていることを書いてください
</div>

</div>

<div class="card">

<textarea id="consult" placeholder="困っていることを、そのまま書いてください"></textarea>

<button class="btn" onclick="saveConsult()">
💾 相談内容を保存
</button>

<button class="btn callBtn" onclick="location.href='tel:0484731111'">
📞 市役所代表へ電話
</button>

</div>

<div class="footer">

<div onclick="location.href='index.html'">
見守り
</div>

<div onclick="location.href='calendar.html'">
予定
</div>

<div onclick="location.href='gomi.html'">
ゴミ
</div>

<div onclick="location.href='news.html'">
地域情報
</div>

</div>

</div>

<script>

window.onload=function(){

const saved=localStorage.getItem("consultText");

if(saved){
document.getElementById("consult").value=saved;
}

};

function saveConsult(){

const text=document.getElementById("consult").value;

localStorage.setItem("consultText",text);

alert("相談内容を保存しました");

}

</script>

</body>
</html>
