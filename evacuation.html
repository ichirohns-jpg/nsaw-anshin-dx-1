<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>避難所案内</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
}

.header{
background:linear-gradient(
135deg,
#0f172a,
#1e293b,
#334155
);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:#fff;
padding:24px;
border-radius:24px;
margin-bottom:16px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.btn{
display:block;
width:100%;
padding:28px;
border:none;
border-radius:24px;
background:#f59e0b;
color:#fff;
font-size:30px;
font-weight:900;
}

.result{
font-size:20px;
line-height:1.8;
font-weight:700;
margin-top:20px;
}

.home{
display:block;
background:#475569;
color:#fff;
text-decoration:none;
padding:20px;
border-radius:20px;
text-align:center;
font-size:22px;
font-weight:900;
}

.mapBtn{
display:block;
margin-top:12px;
padding:18px;
border-radius:18px;
background:#2563eb;
color:#fff;
text-decoration:none;
text-align:center;
font-size:22px;
font-weight:900;
}

</style>

</head>

<body>

<div class="header">
<h1>🏃 避難所案内</h1>
</div>

<div class="card">

<button
class="btn"
onclick="showEvacuation()">

🏃 避難所を探す

</button>

<div
id="result"
class="result">

ボタンを押してください

</div>

<a
id="mapBtn"
class="mapBtn"
target="_blank"
style="display:none">

📍 Googleマップで開く

</a>

</div>

<a
href="index.html"
class="home">

🏠 トップへ戻る

</a>

<script>

function showEvacuation(){

const city =
localStorage.getItem(
'city'
) || '';

const url =
'https://www.google.com/maps/search/避難所+' +
encodeURIComponent(city);

document.getElementById(
'result'
).innerHTML =

city +

' の避難所をGoogleマップで表示します';

const btn =
document.getElementById(
'mapBtn'
);

btn.href =
url;

btn.style.display =
'block';

window.open(
url,
'_blank'
);

}

</script>

</body>
</html>
