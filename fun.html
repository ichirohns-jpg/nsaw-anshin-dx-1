<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>お楽しみ動画</title>

<meta property="og:title" content="お楽しみ動画">
<meta property="og:description" content="地域の暮らしに役立つ動画・楽しい動画をお届け">
<meta property="og:image" content="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#f4f6f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2937;
}

header{
background:linear-gradient(135deg,#16a34a,#22c55e);
color:#fff;
padding:24px;
text-align:center;
font-size:32px;
font-weight:900;
}

.wrap{
max-width:1000px;
margin:auto;
padding:15px;
}

.card{
background:#fff;
border-radius:24px;
overflow:hidden;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.thumb{
width:100%;
aspect-ratio:16/9;
object-fit:cover;
display:block;
background:#ddd;
}

.body{
padding:18px;
}

.date{
font-size:14px;
color:#94a3b8;
margin-bottom:12px;
font-weight:700;
}

.genre{
display:inline-block;
background:#dcfce7;
color:#16a34a;
padding:6px 12px;
border-radius:999px;
font-size:14px;
font-weight:900;
margin-bottom:12px;
}

.title{
font-size:24px;
font-weight:900;
line-height:1.5;
margin-bottom:10px;
}

.desc{
font-size:18px;
line-height:1.8;
color:#475569;
margin-bottom:14px;
white-space:pre-wrap;
}

.memo{
font-size:15px;
line-height:1.7;
color:#64748b;
background:#f8fafc;
padding:12px;
border-radius:14px;
margin-bottom:14px;
}

.btn{
display:block;
background:#16a34a;
color:#fff;
text-decoration:none;
padding:16px;
text-align:center;
border-radius:14px;
font-size:20px;
font-weight:900;
margin-top:10px;
}

.sectionTitle{
font-size:28px;
font-weight:900;
margin:24px 0 14px;
}

.home{
display:block;
background:#475569;
color:#fff;
text-decoration:none;
padding:18px;
text-align:center;
border-radius:18px;
font-size:22px;
font-weight:900;
margin-top:20px;
}

</style>

<script>

const SHEET_ID =
'149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc';

const SHEET_NAME =
'お楽しみ動画';

function getVal(c){

if(!c) return '';

return c.f || c.v || '';

}

function makeImageUrl(url){

url = String(url || '').trim();

if(url.includes('drive.google.com/file/d/')){

const id =
url.split('/file/d/')[1].split('/')[0];

return 'https://docs.google.com/uc?export=view&id=' + id;

}

if(url.includes('open?id=')){

const id =
url.split('open?id=')[1].split('&')[0];

return 'https://docs.google.com/uc?export=view&id=' + id;

}

return url;

}

function loadSheet(){

const s =
document.createElement('script');

s.src =
'https://docs.google.com/spreadsheets/d/' +
SHEET_ID +
'/gviz/tq?sheet=' +
encodeURIComponent(SHEET_NAME) +
'&tqx=out:json;responseHandler:handleSheet';

document.body.appendChild(s);

}

function handleSheet(json){

const rows =
json.table.rows;

rows.reverse();

let latest='';
let archive='';

rows.forEach((row,index)=>{

if(!row.c) return;

const date =
getVal(row.c[0]);

const title =
getVal(row.c[2]);

const image =
makeImageUrl(
getVal(row.c[3])
);

const desc =
getVal(row.c[4]);

const video =
getVal(row.c[5]);

const genre =
getVal(row.c[7]);

const memo =
getVal(row.c[8]);

const html =

'<div class="card">' +

(image ?

'<img class="thumb" src="' +
image +
'" loading="lazy">' : '') +

'<div class="body">' +

'<div class="date">' +
date +
'</div>' +

(genre ?

'<div class="genre">' +
genre +
'</div>'

: '') +

'<div class="title">' +
title +
'</div>' +

'<div class="desc">' +
desc +
'</div>' +

(memo ?

'<div class="memo">' +
memo +
'</div>'

: '') +

(video ?

'<a class="btn" target="_blank" href="' +
video +
'">' +
'▶ 動画を見る' +
'</a>'

: '') +

'</div>' +

'</div>';

if(index === 0){

latest += html;

}else{

archive += html;

}

});

document.getElementById(
'latest-area'
).innerHTML =
latest || '動画がありません';

document.getElementById(
'archive-area'
).innerHTML =
archive;

}

</script>

</head>

<body onload="loadSheet()">

<header>

🎬 お楽しみ動画

</header>

<div class="wrap">

<div id="latest-area">

読込中...

</div>

<div class="sectionTitle">

📚 アーカイブ

</div>

<div id="archive-area"></div>

<a
href="index.html"
class="home">

🏠 トップへ戻る

</a>

</div>

</body>
</html>
