<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>お楽しみ動画</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#f4f6f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.header{
background:linear-gradient(135deg,#ff9800,#ffb74d);
color:#fff;
padding:24px;
text-align:center;
font-size:32px;
font-weight:900;
}

.wrap{
max-width:900px;
margin:auto;
padding:15px;
}

.card{
background:#fff;
border-radius:20px;
overflow:hidden;
margin-bottom:16px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.thumb{
width:100%;
aspect-ratio:16/9;
border:none;
}

.body{
padding:16px;
}

.title{
font-size:22px;
font-weight:900;
margin-bottom:10px;
}

.desc{
line-height:1.7;
font-size:16px;
}

.btn{
display:block;
width:100%;
background:#ff9800;
color:#fff;
text-decoration:none;
text-align:center;
padding:18px;
font-size:20px;
font-weight:900;
border-radius:16px;
margin-top:12px;
}

</style>

</head>

<body>

<div class="header">
🎬 お楽しみ動画
</div>

<div class="wrap">

<div id="videoList">

<div class="card">

<div class="body">
読込中...
</div>

</div>

</div>

</div>

<script>

const SHEET_ID =
"149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc";

const SHEET_NAME =
"お楽しみ動画";

const url =
"https://docs.google.com/spreadsheets/d/" +
SHEET_ID +
"/gviz/tq?sheet=" +
encodeURIComponent(SHEET_NAME) +
"&tqx=out:json";

function getVal(cell){

if(!cell) return "";

return cell.v || cell.f || "";

}

function youtubeEmbed(url){

if(!url) return "";

if(url.includes("watch?v=")){

return url.replace(
"watch?v=",
"embed/"
);

}

if(url.includes("youtu.be/")){

const id =
url.split("youtu.be/")[1]
.split("?")[0];

return
"https://www.youtube.com/embed/" +
id;

}

if(url.includes("/shorts/")){

const id =
url.split("/shorts/")[1]
.split("?")[0];

return
"https://www.youtube.com/embed/" +
id;

}

return "";

}

function handleSheet(json){

const rows =
json.table.rows || [];

rows.reverse();

let html = "";

rows.forEach(row=>{

const cells = row.c || [];

const title =
getVal(cells[1]);

const desc =
getVal(cells[2]);

let videoUrl = "";

cells.forEach(cell=>{

const txt =
JSON.stringify(cell || {});

if(
txt.includes("youtube.com") ||
txt.includes("youtu.be")
){

const m =
txt.match(
/https?:\/\/[^\s"'\}]+/
);

if(m){

videoUrl =
m[0]
.replace(/\\/g,"");

}

}

});

const embedUrl =
youtubeEmbed(videoUrl);

html += `

<div class="card">

<iframe
class="thumb"
src="${embedUrl}"
allowfullscreen>
</iframe>

<div class="body">

<div class="title">
${title}
</div>

<div class="desc">
${desc}
</div>

<a
class="btn"
href="${videoUrl}"
target="_blank">
YouTubeで見る
</a>

</div>

</div>

`;

});

document.getElementById(
"videoList"
).innerHTML =
html || "動画がありません";

}

const script =
document.createElement(
"script"
);

script.src =
url +
"&callback=handleSheet";

document.body.appendChild(
script
);

</script>

</body>
</html>
