<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>お楽しみ動画｜NSAW</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:#eef4fb;
color:#1f2d3d;
}

.wrap{
max-width:560px;
margin:auto;
padding:16px;
}

.header{
background:#1976d2;
color:#fff;
padding:20px;
border-radius:20px;
font-weight:900;
font-size:22px;
margin-bottom:16px;
}

.card{
background:#fff;
padding:16px;
border-radius:20px;
margin:10px 0;
box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.title{
font-size:18px;
font-weight:900;
margin-bottom:6px;
}

.text{
font-size:15px;
color:#444;
line-height:1.6;
}
</style>

</head>

<body>

<div class="wrap">

<div class="header">
🎬 お楽しみ動画
</div>

<div id="content"></div>

</div>

<script>

async function loadFun(){

const url = "https://script.google.com/macros/s/AKfycbxsgeub9qA9q5EnfZgOEVah2H5YC9dEy_n2UqMkviD8Wy5IcVsL-CsMmNE0ZvDMbGFd/exec";

try{

const res = await fetch(url);
const data = await res.json();

let html = "";

data.forEach(d=>{
if(d.type !== "fun") return;

html += `
<div class="card">
<div class="title">${d.title || ""}</div>
<div class="text">${d.text || ""}</div>
</div>
`;
});

document.getElementById("content").innerHTML = html;

}catch(e){

document.getElementById("content").innerHTML =
"<div class='card'>データ取得エラー</div>";

}

}

loadFun();

</script>

</body>
</html>
