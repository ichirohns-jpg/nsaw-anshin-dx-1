<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>お楽しみ動画</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}

.header{
background:linear-gradient(135deg,#0f172a,#334155);
color:#fff;
padding:30px;
text-align:center;
}

.header h1{
font-size:40px;
font-weight:900;
}

.wrap{
max-width:1000px;
margin:auto;
padding:18px;
}

.card{
background:#fff;
border-radius:28px;
overflow:hidden;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.video{
width:100%;
aspect-ratio:16/9;
border:none;
}

.body{
padding:20px;
}

.title{
font-size:30px;
font-weight:900;
margin-bottom:12px;
}

.desc{
font-size:20px;
line-height:1.8;
margin-bottom:12px;
}

.btn{
display:block;
margin-top:16px;
padding:18px;
text-align:center;
background:#ea580c;
color:#fff;
text-decoration:none;
border-radius:18px;
font-size:22px;
font-weight:900;
}

</style>

</head>

<body>

<div class="header">
<h1>🎬 お楽しみ動画</h1>
</div>

<div class="wrap">

<div id="videoList">
読込中...
</div>

<script>

const SHEET_ID =
"149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc";

const SHEET_NAME =
"お楽しみ動画";

const url =
"https://docs.google.com/spreadsheets/d/" +
SHEET_ID +
"/gviz/tq?sheet=" +
encodeURIComponent(SHEET_NAME) +
"&tqx=out:json";

function getVal(cell){
return cell ? (cell.v || cell.f || "") : "";
}

function youtubeEmbed(url){

if(url.includes("watch?v="))
return url.replace(
"watch?v=",
"embed/"
);

if(url.includes("youtu.be/")){

const id =
url.split("youtu.be/")[1]
.split("?")[0];

return
"https://www.youtube.com/embed/" +
id;

}

return url;

}

window.handleSheet =
function(json){

const rows =
json.table.rows || [];

rows.reverse();

let html = "";

rows.forEach(row=>{

const c =
row.c || [];

const title =
getVal(c[2]);

const desc =
getVal(c[4]);

const video =
getVal(c[5]);

html += `

<div class="card">

<iframe
class="video"
src="${youtubeEmbed(video)}"
allowfullscreen>
</iframe>

<div class="body">

<div class="title">
${title}
</div>

<div class="desc">
${desc}
</div>

<a
href="${video}"
target="_blank"
class="btn">
YouTubeで見る
</a>

</div>

</div>

`;

});

document.getElementById(
"videoList"
).innerHTML = html;

};

const script =
document.createElement("script");

script.src =
url +
"&callback=handleSheet";

document.body.appendChild(script);

</script>

</div>

</body>
</html>
