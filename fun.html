<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>お楽しみ動画</title>

<meta property="og:title" content="お楽しみ動画">
<meta property="og:description" content="地域の暮らしに役立つ動画・楽しい動画をお届け">
<meta property="og:image" content="https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/top.jpg">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#f4f6f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2937;
}

header{
background:linear-gradient(135deg,#16a34a,#22c55e);
color:#fff;
padding:24px;
text-align:center;
font-size:32px;
font-weight:900;
}

.wrap{
max-width:1000px;
margin:auto;
padding:15px;
}

.card{
background:#fff;
border-radius:24px;
overflow:hidden;
margin-bottom:22px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.player{
width:100%;
aspect-ratio:16/9;
background:#000;
overflow:hidden;
}

.player iframe{
width:100%;
height:100%;
border:none;
display:block;
}

.body{
padding:18px;
}

.date{
font-size:18px;
color:#94a3b8;
margin-bottom:12px;
font-weight:900;
}

.genre{
display:inline-block;
background:#dcfce7;
color:#16a34a;
padding:8px 14px;
border-radius:999px;
font-size:18px;
font-weight:900;
margin-bottom:14px;
}

.title{
font-size:30px;
font-weight:900;
line-height:1.5;
margin-bottom:12px;
}

.desc{
font-size:24px;
line-height:1.8;
color:#475569;
margin-bottom:16px;
white-space:pre-wrap;
}

.memo{
font-size:18px;
line-height:1.7;
color:#64748b;
background:#f8fafc;
padding:14px;
border-radius:14px;
margin-bottom:16px;
}

.share{
display:flex;
flex-direction:column;
gap:14px;
margin-top:16px;
}

.shareBtn{
width:100%;
background:linear-gradient(
180deg,
#374151,
#111827
);
color:#fff;
border:none;
border-radius:24px;
padding:24px;
font-size:24px;
font-weight:900;
text-align:left;
cursor:pointer;
box-shadow:
0 8px 20px rgba(0,0,0,.25),
inset 0 1px 0 rgba(255,255,255,.15);
}

.shareBtn:after{
content:" ＞";
float:right;
opacity:.8;
}

.sectionTitle{
font-size:34px;
font-weight:900;
margin:36px 0 18px;
padding-top:28px;
border-top:4px solid #dbe3eb;
}

.home{
display:block;
background:#475569;
color:#fff;
text-decoration:none;
padding:22px;
text-align:center;
border-radius:22px;
font-size:24px;
font-weight:900;
margin-top:24px;
}

.loading{
background:#fff;
padding:30px;
border-radius:24px;
text-align:center;
font-size:24px;
font-weight:900;
}

</style>

<script>

const SHEET_ID =
'149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc';

const SHEET_NAME =
'お楽しみ動画';

function getVal(c){

if(!c){
return '';
}

return c.f || c.v || '';

}

function getYoutubeId(url){

if(!url){
return '';
}

url=String(url);

let m=url.match(/youtu\.be\/([^?&]+)/);
if(m)return m[1];

m=url.match(/[?&]v=([^&]+)/);
if(m)return m[1];

m=url.match(/embed\/([^?&]+)/);
if(m)return m[1];

m=url.match(/shorts\/([^?&]+)/);
if(m)return m[1];

return '';

}

function makeShareUrl(id){

return "https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/share-fun-v2.html?fun="
+ encodeURIComponent(id);

}

function shareFacebook(url){

window.open(
"https://www.facebook.com/sharer/sharer.php?u="
+
encodeURIComponent(url),
"_blank"
);

}

function shareLine(url){

window.open(
"https://social-plugins.line.me/lineit/share?url="
+
encodeURIComponent(url),
"_blank"
);

}

function shareX(url,text){

window.open(
"https://twitter.com/intent/tweet?url="
+
encodeURIComponent(url)
+
"&text="
+
encodeURIComponent(text),
"_blank"
);

}

function copyUrl(url){

navigator.clipboard.writeText(url);

alert("URLをコピーしました");

}

function loadSheet(){

const s=
document.createElement('script');

s.src=
'https://docs.google.com/spreadsheets/d/'
+
SHEET_ID
+
'/gviz/tq?sheet='
+
encodeURIComponent(SHEET_NAME)
+
'&tqx=out:json;responseHandler:handleSheet';

document.body.appendChild(s);

}

function handleSheet(json){

const rows=
json.table.rows || [];

rows.reverse();

let latest='';
let archive='';

rows.forEach(function(row,index){

if(!row.c){
return;
}

const date=getVal(row.c[0]);
const title=getVal(row.c[2]);
const desc=getVal(row.c[4]);
const video=getVal(row.c[5]);
const genre=getVal(row.c[7]);
const memo=getVal(row.c[8]);

const videoId=getYoutubeId(video);

const shareUrl=
makeShareUrl(index+1);

const shareText=
title || "お楽しみ動画";

const card=

'<div class="card">' +

'<div class="player">' +

(videoId ?

'<iframe src="https://www.youtube.com/embed/' +
videoId +
'" allowfullscreen></iframe>'

:

'<div class="loading">動画がありません</div>'

) +

'</div>' +

'<div class="body">' +

'<div class="date">' +
date +
'</div>' +

(genre ?

'<div class="genre">' +
genre +
'</div>'

: '') +

'<div class="title">' +
title +
'</div>' +

'<div class="desc">' +
desc +
'</div>' +

(memo ?

'<div class="memo">' +
memo +
'</div>'

: '') +

'<div class="share">' +

'<button class="shareBtn" onclick="shareLine(\'' +
shareUrl +
'\')">💬 LINEで送る</button>' +

'<button class="shareBtn" onclick="copyUrl(\'' +
shareUrl +
'\')">📋 URLコピー</button>' +

'<button class="shareBtn" onclick="shareFacebook(\'' +
shareUrl +
'\')">📘 Facebookへ投稿</button>' +

'<button class="shareBtn" onclick="shareX(\'' +
shareUrl +
'\',\'' +
shareText.replace(/'/g,"\\'") +
'\')">✖ Xへ投稿</button>' +

'</div>' +

'</div>' +

'</div>';

if(index < 5){

latest += card;

}else{

archive += card;

}

});

document.getElementById('latest-area').innerHTML =
latest || '<div class="loading">動画がありません</div>';

if(archive){

document.getElementById('archive-wrap').style.display =
'block';

document.getElementById('archive-area').innerHTML =
archive;

}

}

</script>

</head>

<body onload="loadSheet()">

<header>
🎬 お楽しみ動画
</header>

<div class="wrap">

<div id="latest-area">
<div class="loading">読込中...</div>
</div>

<div id="archive-wrap" style="display:none;">

<div class="sectionTitle">
📚 アーカイブ
</div>

<div id="archive-area"></div>

</div>

<a
href="index.html"
class="home">

🏠 トップへ戻る

</a>

</div>

</body>
</html>
