<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地域設定｜あんしん生活ボタン</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eef4fb;
color:#1f2d3d;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}

.app-box{
max-width:560px;
margin:0 auto;
padding:18px 14px 34px;
}

.header{
text-align:center;
margin-bottom:16px;
}

.badge{
display:inline-block;
background:#1976d2;
color:#fff;
border-radius:999px;
padding:10px 18px;
font-size:17px;
font-weight:900;
}

.card{
background:#fff;
border-radius:26px;
padding:24px 20px;
box-shadow:0 8px 22px rgba(0,0,0,.10);
margin-bottom:18px;
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
margin:0 0 8px;
color:#1976d2;
}

.lead{
font-size:18px;
font-weight:800;
text-align:center;
line-height:1.6;
color:#555;
margin:0 0 20px;
}

.section-title{
font-size:23px;
font-weight:900;
margin:22px 0 12px;
padding-left:10px;
border-left:7px solid #1976d2;
}

label{
display:block;
font-size:21px;
font-weight:900;
margin:14px 0 8px;
}

input,select{
width:100%;
padding:18px;
font-size:22px;
font-weight:800;
border:3px solid #d8e2ec;
border-radius:16px;
background:#fbfdff;
}

.btn{
width:100%;
border:none;
border-radius:20px;
padding:22px 16px;
margin-top:18px;
font-size:25px;
font-weight:900;
color:#fff;
}

.btn-green{background:#2eaf66}
.btn-orange{background:#f39c12}

.gps-box{
background:#f2f8ff;
border:3px solid #d8eafd;
border-radius:18px;
padding:16px;
margin-top:14px;
font-size:18px;
font-weight:800;
line-height:1.7;
}

.info{
background:#f7f9fb;
border:2px solid #e1e7ee;
border-radius:18px;
padding:16px;
margin-top:16px;
font-size:16px;
font-weight:800;
line-height:1.7;
word-break:break-all;
}

.qr{
display:block;
margin:16px auto 8px;
width:190px;
height:190px;
border-radius:12px;
background:#fff;
}

.back{
display:block;
margin-top:22px;
text-align:center;
font-size:20px;
font-weight:900;
text-decoration:none;
color:#1976d2;
}
</style>
</head>

<body>

<div class="app-box">

<div class="header">
<span class="badge">利用者設定</span>
</div>

<div class="card">

<h1 class="title">地域設定</h1>

<p class="lead">
名前・地域・電話・現在地を保存します
</p>

<div class="section-title">基本情報</div>

<label>個人ID</label>
<input id="personId" type="text">

<label>お名前</label>
<input id="name" type="text">

<label>緊急連絡先</label>
<input id="tel" type="tel">

<div class="section-title">地域</div>

<label>市</label>
<select id="city"></select>

<label>地区</label>
<select id="area"></select>

<div class="section-title">現在地</div>

<button class="btn btn-orange" onclick="getGps()">
📍 現在地を取得する
</button>

<div class="gps-box" id="gpsStatus">
現在地はまだ取得していません
</div>

<button class="btn btn-green" onclick="saveData()">
✅ 保存する
</button>

<div class="section-title">本人ページ</div>

<div class="info" id="userUrl"></div>

<img class="qr" id="userQr">

<div class="section-title">家族ページ</div>

<div class="info" id="familyUrl"></div>

<img class="qr" id="familyQr">

<a href="index.html" class="back">
トップへ戻る
</a>

</div>

</div>

<script>

const AREA_DATA={

"志木市":[
"本町","幸町","館","柏町",
"中宗岡","上宗岡","下宗岡","宗岡"
],

"新座市":[
"野火止","東北","栗原","石神",
"栄","池田","新堀","馬場",
"畑中","片山","大和田","北野"
],

"朝霞市":[
"本町","仲町","栄町","膝折",
"根岸","根岸台","幸町",
"三原","浜崎","西原"
],

"和光市":[
"本町","新倉","白子",
"中央","下新倉",
"丸山台","広沢"
]

};

const personId=document.getElementById("personId");
const nameInput=document.getElementById("name");
const tel=document.getElementById("tel");
const city=document.getElementById("city");
const area=document.getElementById("area");
const gpsStatus=document.getElementById("gpsStatus");

function buildCity(){

city.innerHTML="";

Object.keys(AREA_DATA).forEach(function(c){

const op=document.createElement("option");

op.value=c;
op.textContent=c;

city.appendChild(op);

});

city.value=
localStorage.getItem("city")
||"志木市";

buildArea();

}

function buildArea(){

area.innerHTML="";

AREA_DATA[city.value].forEach(function(a){

const op=document.createElement("option");

op.value=a;
op.textContent=a;

area.appendChild(op);

});

const savedArea=
localStorage.getItem("area");

if(savedArea){

area.value=savedArea;

}

}

city.addEventListener(
"change",
buildArea
);

personId.value=
localStorage.getItem("personId")
||"yamaguchi";

nameInput.value=
localStorage.getItem("name")
||"山口さん";

tel.value=
localStorage.getItem("tel")
||"";

buildCity();
