<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地域設定｜あんしん生活ボタン</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eef4fb;
color:#1f2d3d;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}

.app-box{
max-width:560px;
margin:0 auto;
padding:18px 14px 34px;
}

.header{
text-align:center;
margin-bottom:16px;
}

.badge{
display:inline-block;
background:#1976d2;
color:#fff;
border-radius:999px;
padding:10px 18px;
font-size:17px;
font-weight:900;
}

.card{
background:#fff;
border-radius:26px;
padding:24px 20px;
box-shadow:0 8px 22px rgba(0,0,0,.10);
margin-bottom:18px;
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
margin:0 0 8px;
color:#1976d2;
}

.lead{
font-size:18px;
font-weight:800;
text-align:center;
line-height:1.6;
color:#555;
margin:0 0 20px;
}

.section-title{
font-size:23px;
font-weight:900;
margin:22px 0 12px;
padding-left:10px;
border-left:7px solid #1976d2;
}

label{
display:block;
font-size:21px;
font-weight:900;
margin:14px 0 8px;
}

input,select{
width:100%;
padding:18px;
font-size:22px;
font-weight:800;
border:3px solid #d8e2ec;
border-radius:16px;
background:#fbfdff;
}

input:focus,select:focus{
outline:none;
border-color:#1976d2;
background:#fff;
}

.btn{
width:100%;
border:none;
border-radius:20px;
padding:22px 16px;
margin-top:18px;
font-size:25px;
font-weight:900;
color:#fff;
box-shadow:0 6px 12px rgba(0,0,0,.12);
}

.btn-blue{background:#1976d2}
.btn-green{background:#2eaf66}
.btn-orange{background:#f39c12}
.btn-gray{background:#607d8b}

.gps-box{
background:#f2f8ff;
border:3px solid #d8eafd;
border-radius:18px;
padding:16px;
margin-top:14px;
font-size:18px;
font-weight:800;
line-height:1.7;
word-break:break-all;
}

.info{
background:#f7f9fb;
border:2px solid #e1e7ee;
border-radius:18px;
padding:16px;
margin-top:16px;
font-size:16px;
font-weight:800;
line-height:1.7;
word-break:break-all;
}

.qr{
display:block;
margin:16px auto 8px;
width:190px;
height:190px;
border-radius:12px;
background:#fff;
}

.small-note{
font-size:15px;
font-weight:800;
color:#666;
line-height:1.6;
margin-top:8px;
}

.back{
display:block;
margin-top:22px;
text-align:center;
font-size:20px;
font-weight:900;
text-decoration:none;
color:#1976d2;
}

.footer-space{
height:20px;
}
</style>
</head>

<body>

<div class="app-box">

  <div class="header">
    <span class="badge">利用者設定</span>
  </div>

  <div class="card">
    <h1 class="title">地域設定</h1>
    <p class="lead">
      名前・地域・電話・現在地を保存します。<br>
      ゴミの日、予定、家族ページで使います。
    </p>

    <div class="section-title">基本情報</div>

    <label for="personId">個人ID</label>
    <input id="personId" type="text" placeholder="例：yamaguchi">

    <label for="name">お名前</label>
    <input id="name" type="text" placeholder="例：山口さん">

    <label for="tel">緊急連絡先</label>
    <input id="tel" type="tel" placeholder="例：090-0000-0000">

    <div class="section-title">地域</div>

    <label for="city">市</label>
    <select id="city">
      <option value="志木市">志木市</option>
      <option value="新座市">新座市</option>
      <option value="朝霞市">朝霞市</option>
      <option value="和光市">和光市</option>
    </select>

    <label for="area">地区</label>
    <input id="area" type="text" placeholder="例：柏町3丁目">

    <div class="section-title">現在地</div>

    <button class="btn btn-orange" onclick="getGps()">📍 現在地を取得する</button>

    <div class="gps-box" id="gpsStatus">
      現在地はまだ取得していません。
    </div>

    <button class="btn btn-green" onclick="saveData()">✅ 保存する</button>

    <div class="section-title">本人ページ</div>
    <div class="info" id="userUrl">本人URLを表示します</div>
    <img class="qr" id="userQr" alt="本人ページQR">

    <div class="section-title">家族ページ</div>
    <div class="info" id="familyUrl">家族URLを表示します</div>
    <img class="qr" id="familyQr" alt="家族ページQR">

    <a href="index.html" class="back">トップへ戻る</a>
  </div>

  <div class="footer-space"></div>

</div>

<script>
const personId = document.getElementById("personId");
const nameInput = document.getElementById("name");
const tel = document.getElementById("tel");
const city = document.getElementById("city");
const area = document.getElementById("area");
const gpsStatus = document.getElementById("gpsStatus");

personId.value = localStorage.getItem("personId") || "yamaguchi";
nameInput.value = localStorage.getItem("name") || "山口さん";
tel.value = localStorage.getItem("tel") || "";
city.value = localStorage.getItem("city") || "志木市";
area.value = localStorage.getItem("area") || "";

function getGps(){
  if(!navigator.geolocation){
    gpsStatus.innerHTML = "このスマホでは現在地取得が使えません。";
    return;
  }

  gpsStatus.innerHTML = "現在地を取得しています…";

  navigator.geolocation.getCurrentPosition(
    function(pos){
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      localStorage.setItem("lat", lat);
      localStorage.setItem("lng", lng);
      localStorage.setItem("gpsSavedAt", new Date().toLocaleString("ja-JP"));

      gpsStatus.innerHTML =
        "現在地を保存しました。<br>" +
        "緯度：" + lat + "<br>" +
        "経度：" + lng;

      makeLinks();
    },
    function(){
      gpsStatus.innerHTML =
        "現在地を取得できませんでした。<br>" +
        "スマホの位置情報許可を確認してください。";
    },
    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:0
    }
  );
}

function saveData(){
  localStorage.setItem("personId", personId.value.trim() || "yamaguchi");
  localStorage.setItem("name", nameInput.value.trim() || "山口さん");
  localStorage.setItem("tel", tel.value.trim());
  localStorage.setItem("city", city.value);
  localStorage.setItem("area", area.value.trim());

  makeLinks();

  alert("保存しました");
}

function makeQr(url){
  return "https://api.qrserver.com/v1/create-qr-code/?size=190x190&data=" + encodeURIComponent(url);
}

function makeLinks(){
  const id = (personId.value.trim() || "yamaguchi");

  const base =
    location.origin +
    location.pathname.replace("setting.html","");

  const user =
    base + "index.html?id=" + encodeURIComponent(id);

  const family =
    base + "family.html?id=" + encodeURIComponent(id);

  document.getElementById("userUrl").innerHTML =
    "本人URL<br>" + user;

  document.getElementById("familyUrl").innerHTML =
    "家族URL<br>" + family;

  document.getElementById("userQr").src = makeQr(user);
  document.getElementById("familyQr").src = makeQr(family);

  const lat = localStorage.getItem("lat");
  const lng = localStorage.getItem("lng");
  const savedAt = localStorage.getItem("gpsSavedAt");

  if(lat && lng){
    gpsStatus.innerHTML =
      "現在地は保存済みです。<br>" +
      "緯度：" + lat + "<br>" +
      "経度：" + lng + "<br>" +
      "保存日時：" + (savedAt || "");
  }
}

makeLinks();
</script>

</body>
</html>
