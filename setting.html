<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地域設定</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#fdfbf7;
color:#333;
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
}

.app-box{
max-width:520px;
margin:1.5rem auto;
padding:0 1rem;
}

.badge{
display:inline-block;
background:#777;
color:#fff;
border-radius:999px;
padding:8px 14px;
font-size:15px;
}

.card{
background:#fff;
border-radius:18px;
padding:24px;
box-shadow:0 6px 14px rgba(0,0,0,.06);
}

.title{
font-size:28px;
font-weight:900;
text-align:center;
margin:0 0 22px;
}

label{
display:block;
font-size:20px;
font-weight:900;
margin:14px 0 8px;
}

input,select{
width:100%;
padding:16px;
font-size:20px;
border:2px solid #ddd;
border-radius:12px;
}

.btn{
width:100%;
border:none;
border-radius:14px;
padding:20px 16px;
margin-top:18px;
font-size:22px;
font-weight:900;
background:#4ebfa5;
color:#fff;
}

.info{
background:#f7f9fa;
border-radius:12px;
padding:14px;
margin-top:16px;
font-size:15px;
line-height:1.7;
word-break:break-all;
}

.qr{
display:block;
margin:14px auto;
max-width:180px;
}

.back{
display:block;
margin-top:20px;
text-align:center;
font-weight:900;
text-decoration:none;
color:#666;
}
</style>
</head>

<body>

<div class="app-box">

<div style="text-align:center;margin-bottom:14px">
<span class="badge">利用者設定</span>
</div>

<div class="card">

<h1 class="title">地域設定</h1>

<label>個人ID</label>
<input id="personId" placeholder="yamaguchi">

<label>お名前</label>
<input id="name" placeholder="山口さん">

<label>市</label>
<select id="city">
<option>志木市</option>
<option>朝霞市</option>
<option>和光市</option>
<option>新座市</option>
</select>

<label>地区</label>
<input id="area" placeholder="本町">

<label>緊急連絡先</label>
<input id="tel" placeholder="090-0000-0000">

<button class="btn" onclick="saveData()">保存する</button>

<div class="info" id="userUrl">本人URL</div>
<img class="qr" id="userQr">

<div class="info" id="familyUrl">家族URL</div>
<img class="qr" id="familyQr">

<a href="index.html" class="back">トップへ戻る</a>

</div>

</div>

<script>

const personId=document.getElementById("personId");
const nameInput=document.getElementById("name");
const city=document.getElementById("city");
const area=document.getElementById("area");
const tel=document.getElementById("tel");

personId.value=localStorage.getItem("personId")||"yamaguchi";
nameInput.value=localStorage.getItem("name")||"山口さん";
city.value=localStorage.getItem("city")||"志木市";
area.value=localStorage.getItem("area")||"";
tel.value=localStorage.getItem("tel")||"";

function saveData(){

localStorage.setItem("personId",personId.value);
localStorage.setItem("name",nameInput.value);
localStorage.setItem("city",city.value);
localStorage.setItem("area",area.value);
localStorage.setItem("tel",tel.value);

makeLinks();

alert("保存しました");

}

function makeQr(url){

return "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data="+
encodeURIComponent(url);

}

function makeLinks(){

const id=personId.value||"yamaguchi";

const base=
location.origin+
location.pathname.replace("setting.html","");

const user=
base+"index.html?id="+id;

const family=
base+"family.html?id="+id;

document.getElementById("userUrl").innerHTML=
"本人URL<br>"+user;

document.getElementById("familyUrl").innerHTML=
"家族URL<br>"+family;

document.getElementById("userQr").src=
makeQr(user);

document.getElementById("familyQr").src=
makeQr(family);

}

makeLinks();

</script>

</body>
</html>
