<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地域変更</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#eef3f8;
font-family:
"Hiragino Sans",
"Yu Gothic",
sans-serif;
}

.wrap{
max-width:760px;
margin:auto;
padding:18px;
}

.card{

background:white;

border-radius:30px;

padding:24px;

margin-bottom:24px;

box-shadow:
0 8px 20px rgba(0,0,0,.08);

}

.title{

font-size:34px;

font-weight:900;

margin-bottom:20px;

color:#546e7a;

}

select{

width:100%;

padding:24px;

margin-bottom:20px;

font-size:34px;

font-weight:900;

border-radius:24px;

border:2px solid #ddd;

background:white;

}

.saveBtn{

width:100%;

background:#43a047;

border:none;

border-radius:30px;

padding:32px;

font-size:42px;

font-weight:900;

color:white;

margin-bottom:24px;

}

.backBtn{

width:100%;

background:#546e7a;

border:none;

border-radius:30px;

padding:32px;

font-size:42px;

font-weight:900;

color:white;

}

.message{

font-size:30px;

font-weight:900;

color:#43a047;

margin-top:20px;

text-align:center;

}

</style>
</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">

地域変更

</div>

<select id="city">

<option value="">
市を選択
</option>

<option value="志木市">
志木市
</option>

<option value="朝霞市">
朝霞市
</option>

<option value="新座市">
新座市
</option>

<option value="和光市">
和光市
</option>

</select>

<select id="area">

<option value="">
地区を選択
</option>

</select>

<button
class="saveBtn"
onclick="saveArea()">

保存する

</button>

<div
class="message"
id="message">

</div>

</div>

<button
class="backBtn"
onclick="location.href='garbage.html'">

戻る

</button>

</div>

<script>

const areas = {

'志木市':[
'本町',
'館',
'柏町',
'幸町',
'中宗岡',
'上宗岡',
'下宗岡'
],

'朝霞市':[
'朝志ケ丘',
'根岸台',
'溝沼',
'本町'
],

'新座市':[
'東',
'野火止',
'栗原'
],

'和光市':[
'白子',
'本町',
'新倉'
]

};

const citySelect =
document.getElementById(
'city'
);

const areaSelect =
document.getElementById(
'area'
);

citySelect.addEventListener(
'change',
function(){

const city =
citySelect.value;

areaSelect.innerHTML =
'<option value="">地区を選択</option>';

if(!areas[city]) return;

areas[city].forEach(area=>{

areaSelect.innerHTML += `

<option value="${area}">

${area}

</option>

`;

});

}
);

function saveArea(){

const city =
citySelect.value;

const area =
areaSelect.value;

if(!city || !area){

alert('市と地区を選んでください');

return;

}

localStorage.setItem(
'gomiCity',
city
);

localStorage.setItem(
'gomiArea',
area
);

document
.getElementById('message')
.innerHTML =
'保存しました';

setTimeout(function(){

location.href='garbage.html';

},800);

}

</script>

</body>
</html>
