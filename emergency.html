<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbxHknfXsWiwwIhuJ88JFDNRi51jEvD-vgzdeld3YTnfL_0CsrhKmTzxaWUFLVnisRCp/exec";

async function sendEmergency(type){

try{

const params =
new URLSearchParams();

params.append(
"name",
"山口貞一郎"
);

params.append(
"status",
"緊急"
);

params.append(
"memo",
type
);

await fetch(
GAS_URL,
{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:params.toString()
}
);

alert("家族へ通知しました");

}catch(error){

alert("送信失敗");

}

}

</script>
