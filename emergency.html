<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>緊急連絡</title>

<link rel="icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
background:linear-gradient(180deg,#3b0000 0%,#08111d 50%,#000000 100%);
color:#fff;
min-height:100vh;
}

.wrap{
max-width:760px;
margin:auto;
padding:16px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:20px;
margin-bottom:16px;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.title{
font-size:36px;
font-weight:900;
text-align:center;
margin-bottom:20px;
color:#ff5252;
}

.name{
font-size:26px;
font-weight:900;
text-align:center;
margin-bottom:15px;
}

button{
width:100%;
border:none;
cursor:pointer;
color:#fff;
font-weight:900;
padding:24px;
border-radius:20px;
font-size:24px;
margin-bottom:12px;
}

.ambulance-btn{
background:linear-gradient(135deg,#d50000,#ff5252);
}

.police-btn{
background:linear-gradient(135deg,#0d47a1,#42a5f5);
}

.fire-btn{
background:linear-gradient(135deg,#e65100,#ff9800);
}

.family-btn{
background:linear-gradient(135deg,#6a1b9a,#ab47bc);
}

.location-btn{
background:linear-gradient(135deg,#00695c,#26a69a);
}

.home-btn{
background:linear-gradient(135deg,#37474f,#607d8b);
}

.msg{
text-align:center;
font-size:20px;
font-weight:900;
min-height:30px;
margin-top:10px;
}

.footer{
text-align:center;
padding:20px;
opacity:.6;
font-size:12px;
}

</style>

</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
🚨 緊急連絡
</div>

<div
id="userName"
class="name">
読み込み中...
</div>

<button
class="ambulance-btn"
onclick="sendEmergency('救急')">
🚑 救急
</button>

<button
class="police-btn"
onclick="sendEmergency('警察')">
🚔 警察
</button>

<button
class="fire-btn"
onclick="sendEmergency('消防')">
🔥 消防
</button>

<button
class="family-btn"
onclick="sendEmergency('家族連絡')">
👪 家族へ連絡
</button>

<button
class="location-btn"
onclick="sendLocationEmergency()">
📍 現在地付き送信
</button>

<div
id="msg"
class="msg">
</div>

</div>

<div class="card">

<button
class="home-btn"
onclick="location.href='app.html?id='+USER_ID">
😊 本人ページ
</button>

<button
class="home-btn"
onclick="location.href='index.html'">
🏠 ホームへ戻る
</button>

</div>

<div class="footer">
NSAW 緊急連絡
</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

const params =
new URLSearchParams(location.search);

const USER_ID =
params.get("id") || "";

async function loadUser(){

try{

const response =
await fetch(
GAS_URL +
"?action=user&id=" +
encodeURIComponent(USER_ID)
);

const json =
await response.json();

document.getElementById("userName").innerHTML =
(json.data || {}).name || "利用者";

}catch(error){

document.getElementById("userName").innerHTML =
"利用者";

}

}

async function sendEmergency(type){

document.getElementById("msg").innerHTML =
"送信中...";

try{

const body =
new URLSearchParams();

body.append("action","watch");
body.append("id",USER_ID);
body.append("status","緊急連絡");
body.append("memo",type);

await fetch(
GAS_URL,
{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:body.toString()
}
);

document.getElementById("msg").innerHTML =
type + " を送信しました";

}catch(error){

document.getElementById("msg").innerHTML =
"通信エラー";

}

}

function sendLocationEmergency(){

document.getElementById("msg").innerHTML =
"位置取得中...";

navigator.geolocation.getCurrentPosition(

async function(pos){

const lat =
pos.coords.latitude;

const lng =
pos.coords.longitude;

try{

const body =
new URLSearchParams();

body.append("action","watch");
body.append("id",USER_ID);
body.append("status","緊急連絡");
body.append(
"memo",
"位置情報 " + lat + "," + lng
);

await fetch(
GAS_URL,
{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:body.toString()
}
);

document.getElementById("msg").innerHTML =
"現在地付きで送信しました";

}catch(error){

document.getElementById("msg").innerHTML =
"通信エラー";

}

},

function(){

document.getElementById("msg").innerHTML =
"位置取得失敗";

}

);

}

loadUser();

</script>

</body>
</html>
