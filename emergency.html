<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>緊急連絡先｜見守りDX</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:560px;
margin:auto;
padding:16px;
}

.header{
background:#d32f2f;
color:#fff;
border-radius:26px;
padding:22px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.back{
font-size:16px;
font-weight:900;
margin-bottom:12px;
cursor:pointer;
}

.title{
font-size:34px;
font-weight:900;
}

.sub{
font-size:16px;
margin-top:6px;
opacity:.95;
}

.card{
background:#fff;
border-radius:26px;
padding:20px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.item{
background:#fff5f5;
border-left:8px solid #d32f2f;
border-radius:18px;
padding:18px;
margin-bottom:16px;
}

.name{
font-size:28px;
font-weight:900;
margin-bottom:8px;
color:#c62828;
}

.tel{
font-size:22px;
font-weight:800;
margin-bottom:14px;
}

.btn{
width:100%;
border:none;
border-radius:22px;
padding:22px;
font-size:26px;
font-weight:900;
color:#fff;
background:#d32f2f;
cursor:pointer;
}

.btn:active{
transform:scale(.97);
}

.footer{
display:flex;
justify-content:space-around;
margin-top:20px;
padding:18px 0;
background:#fff;
border-radius:22px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
font-size:14px;
font-weight:900;
color:#666;
}

</style>
</head>

<body>

<div class="wrap">

<div class="header">

<div class="back" onclick="location.href='index.html'">
← トップへ戻る
</div>

<div class="title">
☎️ 緊急連絡先
</div>

<div class="sub">
ワンタップで電話できます
</div>

</div>

<div class="card">

<div class="item">

<div class="name">
👨‍👩‍👧 家族
</div>

<div class="tel">
090-1234-5678
</div>

<button class="btn" onclick="location.href='tel:09012345678'">
📞 電話する
</button>

</div>

<div class="item">

<div class="name">
🏥 病院
</div>

<div class="tel">
048-000-0000
</div>

<button class="btn" onclick="location.href='tel:0480000000'">
📞 電話する
</button>

</div>

<div class="item">

<div class="name">
🏢 市役所
</div>

<div class="tel">
048-473-1111
</div>

<button class="btn" onclick="location.href='tel:0484731111'">
📞 電話する
</button>

</div>

<div class="item">

<div class="name">
🚑 救急
</div>

<div class="tel">
119
</div>

<button class="btn" onclick="location.href='tel:119'">
📞 電話する
</button>

</div>

</div>

<div class="footer">

<div onclick="location.href='index.html'">
見守り
</div>

<div onclick="location.href='calendar.html'">
予定
</div>

<div onclick="location.href='gomi.html'">
ゴミ
</div>

<div onclick="location.href='news.html'">
地域情報
</div>

</div>

</div>

</body>
</html>
