<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>緊急連絡</title>

<link rel="icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
background:linear-gradient(180deg,#3b0000 0%,#120000 100%);
color:#fff;
min-height:100vh;
}

.wrap{
max-width:800px;
margin:auto;
padding:16px;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:20px;
margin-bottom:16px;
}

.title{
font-size:38px;
font-weight:900;
text-align:center;
margin-bottom:20px;
color:#ff8a80;
}

.warning{
font-size:22px;
font-weight:900;
text-align:center;
line-height:1.8;
margin-bottom:20px;
}

button{
width:100%;
border:none;
border-radius:24px;
padding:28px;
font-size:28px;
font-weight:900;
color:#fff;
cursor:pointer;
margin-bottom:14px;
}

.red-btn{
background:linear-gradient(135deg,#b71c1c,#f44336);
}

.orange-btn{
background:linear-gradient(135deg,#ef6c00,#ffa726);
}

.blue-btn{
background:linear-gradient(135deg,#1565c0,#42a5f5);
}

.home-btn{
background:linear-gradient(135deg,#455a64,#607d8b);
}

.log{
background:rgba(255,255,255,.08);
padding:15px;
border-radius:18px;
margin-bottom:10px;
}

</style>

</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
🚨 緊急連絡
</div>

<div class="warning">
緊急時のみ使用してください
</div>

<button
class="red-btn"
onclick="sendEmergency('🚑 救急要請')">
🚑 救急車を呼んでください
</button>

<button
class="orange-btn"
onclick="sendEmergency('⚠ 困っています')">
⚠ 困っています
</button>

<button
class="blue-btn"
onclick="sendEmergency('📞 折り返し希望')">
📞 電話してください
</button>

<button
class="home-btn"
onclick="location.href='index.html'">
🏠 トップへ戻る
</button>

</div>

<div class="card">

<div style="
font-size:24px;
font-weight:900;
margin-bottom:15px;
">
緊急履歴
</div>

<div id="historyArea">
読み込み中...
</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

const USER_ID =
new URLSearchParams(
location.search
).get("id") ||
localStorage.getItem("userId") ||
"";

async function sendEmergency(status){

if(
!confirm(
status + "\n送信しますか？"
)
){
return;
}

try{

const body =
new URLSearchParams();

body.append(
"action",
"watch"
);

body.append(
"id",
USER_ID
);

body.append(
"status",
status
);

body.append(
"memo",
"緊急連絡"
);

const response =
await fetch(
GAS_URL,
{
method:"POST",
headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},
body:body.toString()
}
);

const json =
await response.json();

if(
json.status==="OK" ||
json.status==="success" ||
json.ok===true
){

localStorage.setItem(
"lastSOS",
JSON.stringify({
mainType:"緊急連絡",
type:status,
time:new Date().toLocaleString("ja-JP")
})
);

alert(
"送信しました"
);

loadHistory();

}

}catch(error){

alert(
"送信失敗"
);

}

}

async function loadHistory(){

try{

const response =
await fetch(
GAS_URL +
"?action=records&id=" +
encodeURIComponent(USER_ID)
);

const json =
await response.json();

const data =
json.data || [];

let html = "";

data.forEach(item=>{

const txt =
String(
item.status || ""
);

if(
txt.indexOf("救急") === -1 &&
txt.indexOf("困っています") === -1 &&
txt.indexOf("電話してください") === -1
){
return;
}

html += `
<div class="log">

<div style="
font-size:18px;
font-weight:900;
margin-bottom:5px;
color:#ff8a80;
">
${item.status || ""}
</div>

<div style="opacity:.8;">
${item.date || ""}
</div>

<div>
${item.memo || ""}
</div>

</div>
`;

});

document.getElementById(
"historyArea"
).innerHTML =
html || "履歴なし";

}catch(error){

document.getElementById(
"historyArea"
).innerHTML =
"取得失敗";

}

}

loadHistory();

</script>

</body>
</html>
