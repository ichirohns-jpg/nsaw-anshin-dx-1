<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ページ一覧｜見守りDX</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:560px;
margin:auto;
padding:16px;
}

.header{
background:#1976d2;
color:#fff;
border-radius:26px;
padding:22px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.back{
font-size:16px;
font-weight:900;
margin-bottom:12px;
cursor:pointer;
}

.title{
font-size:34px;
font-weight:900;
}

.sub{
font-size:16px;
margin-top:6px;
opacity:.95;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

.btn{
background:#fff;
border-radius:22px;
padding:22px 10px;
text-align:center;
font-size:20px;
font-weight:900;
box-shadow:0 6px 18px rgba(0,0,0,.08);
cursor:pointer;
}

.btn:active{
transform:scale(.97);
}

.footer{
display:flex;
justify-content:space-around;
margin-top:20px;
padding:18px 0;
background:#fff;
border-radius:22px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
font-size:14px;
font-weight:900;
color:#666;
}
</style>
</head>

<body>

<div class="wrap">

</div>

<div class="btn" onclick="location.href='index.html'">🏠<br>トップ</div>
<div class="btn" onclick="location.href='profile.html'">👤<br>利用者情報</div>

<div class="btn" onclick="location.href='calendar.html'">📅<br>カレンダー</div>

<div class="btn" onclick="location.href='settings.html'">⚙️<br>設定</div>
