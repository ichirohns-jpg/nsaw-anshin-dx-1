<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>見守り履歴</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
background:#101827;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
color:#fff;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:linear-gradient(135deg,#1e293b,#0f172a);
padding:20px;
border-radius:24px;
margin-bottom:14px;
}

.title{
font-size:24px;
font-weight:900;
margin-bottom:10px;
}

.item{
background:rgba(255,255,255,.08);
padding:16px;
border-radius:16px;
margin-bottom:10px;
line-height:1.8;
font-size:20px;
font-weight:900;
}

.green{
border-left:6px solid #22c55e;
}

.blue{
border-left:6px solid #3b82f6;
}

.red{
border-left:6px solid #ef4444;
}

.orange{
border-left:6px solid #fb923c;
}

.btn{
display:block;
width:100%;
padding:22px;
border-radius:22px;
text-decoration:none;
text-align:center;
font-size:24px;
font-weight:900;
color:#fff;
background:linear-gradient(135deg,#475569,#334155);
margin-top:16px;
}

</style>
</head>

<body>

<div class="header">
<h1>📋 見守り履歴</h1>
</div>

<div class="card">

<div class="title">
😊 元気です
</div>

<div id="genkiHistory" class="item green">
履歴なし
</div>

</div>

<div class="card">

<div class="title">
💊 服薬
</div>

<div id="medicineHistory" class="item blue">
履歴なし
</div>

</div>

<div class="card">

<div class="title">
📍 位置情報
</div>

<div id="gpsHistory" class="item orange">
履歴なし
</div>

</div>

<div class="card">

<div class="title">
🚨 困りごと・SOS
</div>

<div id="sosHistory" class="item red">
履歴なし
</div>

</div>

<a href="index.html" class="btn">
🏠 トップへ戻る
</a>

<script>

const lastGenki =
JSON.parse(
localStorage.getItem(
'lastGenki'
) || 'null'
);

if(lastGenki){

document.getElementById(
'genkiHistory'
).innerHTML =

'😊 元気です<br>' +
lastGenki.time;

}

const medicineStatus =
JSON.parse(
localStorage.getItem(
'medicineStatus'
) || '{}'
);

let med = '';

if(medicineStatus.morning){
med += '☑ 朝<br>';
}

if(medicineStatus.noon){
med += '☑ 昼<br>';
}

if(medicineStatus.evening){
med += '☑ 夕方<br>';
}

if(medicineStatus.night){
med += '☑ 寝る前<br>';
}

if(med){
document.getElementById(
'medicineHistory'
).innerHTML = med;
}

const lastGPS =
JSON.parse(
localStorage.getItem(
'lastGPS'
) || 'null'
);

if(lastGPS){

document.getElementById(
'gpsHistory'
).innerHTML =

'📍 位置送信<br>' +
lastGPS.time;

}

const lastSOS =
JSON.parse(
localStorage.getItem(
'lastSOS'
) || 'null'
);

if(lastSOS){

document.getElementById(
'sosHistory'
).innerHTML =

(lastSOS.mainType || '') +
'<br>' +
(lastSOS.type || '') +
'<br>' +
(lastSOS.time || '');

}

</script>

</body>
</html>
