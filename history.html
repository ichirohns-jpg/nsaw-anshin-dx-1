<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>見守り履歴</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}

.header{
background:linear-gradient(135deg,#0f172a,#334155);
color:#fff;
padding:30px;
text-align:center;
}

.header h1{
font-size:38px;
font-weight:900;
}

.wrap{
max-width:1000px;
margin:auto;
padding:18px;
}

.card{
background:#fff;
border-radius:28px;
padding:20px;
margin-bottom:16px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.time{
font-size:16px;
color:#64748b;
font-weight:900;
margin-bottom:8px;
}

.title{
font-size:26px;
font-weight:900;
margin-bottom:10px;
}

.ok{
color:#16a34a;
font-size:22px;
font-weight:900;
}

.med{
color:#2563eb;
font-size:22px;
font-weight:900;
}

.help{
color:#dc2626;
font-size:22px;
font-weight:900;
}

.back{
display:block;
background:#334155;
color:#fff;
text-decoration:none;
text-align:center;
padding:18px;
border-radius:18px;
font-size:22px;
font-weight:900;
margin-top:20px;
}

</style>

</head>

<body>

<div class="header">
<h1>📋 見守り履歴</h1>
</div>

<div class="wrap">

<div class="card">
<div class="time">2026/06/13 08:15</div>
<div class="title">元気です</div>
<div class="ok">確認済み</div>
</div>

<div class="card">
<div class="time">2026/06/13 08:20</div>
<div class="title">薬を飲みました</div>
<div class="med">服薬済み</div>
</div>

<div class="card">
<div class="time">2026/06/13 09:05</div>
<div class="title">家族確認</div>
<div class="ok">確認済み</div>
</div>

<div class="card">
<div class="time">2026/06/13 10:30</div>
<div class="title">困っています</div>
<div class="help">未対応</div>
</div>

<a href="index.html" class="back">
トップへ戻る
</a>

</div>

</body>
</html>
