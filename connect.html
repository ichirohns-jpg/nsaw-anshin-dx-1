<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人につなぐ</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:12px;
  background:#eef4f8;
  font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  color:#123;
}

.wrap{
  max-width:720px;
  margin:0 auto;
}

.header{
  background:#555;
  color:white;
  border-radius:30px;
  padding:28px 18px;
  text-align:center;
  margin-bottom:18px;
  box-shadow:0 8px 22px rgba(0,0,0,.12);
}

.title{
  font-size:42px;
  font-weight:900;
  line-height:1.35;
  margin:0;
}

.sub{
  font-size:24px;
  font-weight:900;
  line-height:1.6;
  margin-top:12px;
}

.card{
  background:white;
  border-radius:28px;
  padding:18px;
  box-shadow:0 8px 22px rgba(0,0,0,.08);
}

.note{
  background:#fff8e1;
  border-radius:24px;
  padding:20px;
  font-size:26px;
  font-weight:900;
  line-height:1.6;
  color:#444;
  text-align:center;
  margin-bottom:18px;
}

.contact{
  background:#f8fbff;
  border:4px solid #d7e6ff;
  border-radius:26px;
  padding:20px;
  margin-bottom:18px;
}

.label{
  display:inline-block;
  background:#1565c0;
  color:white;
  border-radius:999px;
  padding:8px 16px;
  font-size:20px;
  font-weight:900;
  margin-bottom:14px;
}

.name{
  font-size:32px;
  font-weight:900;
  line-height:1.5;
  margin-bottom:8px;
}

.phone{
  font-size:28px;
  font-weight:900;
  color:#d84315;
  margin-bottom:16px;
}

.callBtn{
  display:block;
  width:100%;
  text-align:center;
  text-decoration:none;
  border:none;
  border-radius:30px;
  padding:30px 12px;
  font-size:30px;
  font-weight:900;
  color:white;
  background:#2e7d32;
  cursor:pointer;
}

.red{
  background:#c62828;
}

.backBtn{
  display:block;
  width:100%;
  text-align:center;
  text-decoration:none;
  border-radius:30px;
  padding:30px 12px;
  font-size:30px;
  font-weight:900;
  color:white;
  background:#555;
  margin-top:18px;
}

.small{
  font-size:20px;
  font-weight:900;
  line-height:1.6;
  color:#666;
  text-align:center;
  margin-top:12px;
}

@media(max-width:600px){
  .title{
    font-size:36px;
  }

  .sub{
    font-size:22px;
  }

  .note{
    font-size:23px;
  }

  .name{
    font-size:29px;
  }

  .phone{
    font-size:25px;
  }

  .callBtn,
  .backBtn{
    font-size:27px;
    padding:28px 10px;
  }

  .small{
    font-size:19px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="header">
    <h1 class="title">人につなぐ</h1>
    <div class="sub">
      困った時に<br>
      すぐ電話できます
    </div>
  </div>

  <div class="card">

    <div class="note">
      必要なところを押してください
    </div>

    <div id="contactList"></div>

    <a class="backBtn" href="index.html?v=final1">
      ⬅️ 最初の画面に戻る
    </a>

    <div class="small">
      電話番号は、このファイル上部の設定で変えられます。
    </div>

  </div>

</div>

<script>

/*
  電話番号はここだけ変えます。
  空欄 "" のものは画面に出ません。
*/

const CONTACTS = [
  {
    label: "家族",
    name: "家族に電話",
    phone: ""
  },
  {
    label: "支援者",
    name: "支援者に電話",
    phone: ""
  },
  {
    label: "地域包括",
    name: "地域包括支援センターに電話",
    phone: ""
  },
  {
    label: "市役所",
    name: "志木市役所に電話",
    phone: "048-473-1111"
  },
  {
    label: "緊急",
    name: "緊急 119",
    phone: "119",
    emergency: true
  }
];

function stopAllSpeech(){
  try{
    if(window.speechSynthesis){
      window.speechSynthesis.cancel();
    }
  }catch(e){}
}

function cleanPhone(phone){
  return String(phone || "").replace(/[^\d+]/g,"");
}

function escapeHtml(str){
  return String(str || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function renderContacts(){

  const box = document.getElementById("contactList");
  let html = "";

  CONTACTS.forEach(function(item){

    const tel = cleanPhone(item.phone);

    if(!tel){
      return;
    }

    html += `
      <div class="contact">
        <div class="label">${escapeHtml(item.label)}</div>
        <div class="name">${escapeHtml(item.name)}</div>
        <div class="phone">${escapeHtml(item.phone)}</div>
        <a class="callBtn ${item.emergency ? "red" : ""}" href="tel:${escapeHtml(tel)}">
          ☎️ 電話する
        </a>
      </div>
    `;

  });

  if(!html){
    html = `
      <div class="note">
        連絡先がありません
      </div>
    `;
  }

  box.innerHTML = html;

}

window.addEventListener("load",function(){
  stopAllSpeech();
  renderContacts();
});
</script>

</body>
</html>
