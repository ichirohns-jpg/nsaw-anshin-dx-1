.phone{
  font-size:28px;
  font-weight:900;

.note{

  font-weight:900;
  line-height:1.5;
  color:#555;
  margin-bottom:16px;
}

.callBtn{
  display:block;
  width:100%;
  text-align:center;
  text-decoration:none;
  border:none;
  border-radius:28px;
  padding:28px 12px;
  font-size:30px;
  font-weight:900;
  color:white;
  background:#2e7d32;
  cursor:pointer;

.reloadBtn{

  border:none;
  border-radius:28px;
  padding:26px 12px;
  font-size:28px;
  font-weight:900;
  color:white;
  background:#1976d2;

  cursor:pointer;
}

.backBtn{
  display:block;
  width:100%;
  text-align:center;
  text-decoration:none;
  border-radius:28px;
  padding:26px 12px;
  font-size:28px;
  font-weight:900;
  color:white;
  background:#555;
}

.empty{
  background:#f5f7fa;
  border-radius:24px;
  padding:24px;
  font-size:28px;
  font-weight:900;
  color:#666;
  line-height:1.5;
  text-align:center;
}

.error{
  background:#fff3f3;
  border-radius:24px;
  padding:22px;
  font-size:24px;
  font-weight:900;
  color:#b71c1c;
  line-height:1.6;
  white-space:pre-wrap;
}

@media(max-width:600px){
  .title{font-size:34px}
  .sub{font-size:21px}
  .status{font-size:22px}
  .category{font-size:18px}
  .name{font-size:29px}
  .phone{font-size:25px}
  .note{font-size:20px}

  .callBtn,
  .reloadBtn,

    padding:26px 10px;
  }

  .empty{font-size:25px}
}
