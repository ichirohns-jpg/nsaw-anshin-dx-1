<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>朝トップ</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#eef3f8;
font-family:
"Hiragino Sans",
"Yu Gothic",
sans-serif;
}

.wrap{
max-width:760px;
margin:auto;
padding:14px;
}

.banner{

width:100%;

height:220px;

object-fit:cover;

border-radius:28px;

display:block;

margin-bottom:24px;

box-shadow:
0 8px 20px rgba(0,0,0,.08);

}

.bigBtn{

width:100%;

background:white;

border:none;

border-radius:30px;

padding:34px 22px;

margin-bottom:22px;

font-size:40px;

font-weight:900;

line-height:1.3;

text-align:center;

color:#1565c0;

box-shadow:
0 8px 20px rgba(0,0,0,.08);

position:relative;

}

.bigBtn::before{

content:'';

position:absolute;

left:0;
top:0;
bottom:0;

width:18px;

border-top-left-radius:30px;
border-bottom-left-radius:30px;

}

.gomi::before{
background:#43a047;
}

.schedule::before{
background:#00897b;
}

.news::before{
background:#1976d2;
}

.med::before{
background:#e53935;
}

.support::before{
background:#fb8c00;
}

.setting::before{
background:#546e7a;
}

</style>
</head>

<body>

<div class="wrap">

<img
src="https://ichirohns-jpg.github.io/ShikiConcierge-18/top-banner.jpg"
class="banner">

<button
class="bigBtn gomi"
onclick="location.href='gomi.html'">

今日のごみ

</button>

<button
class="bigBtn schedule"
onclick="location.href='schedule.html'">

今日の予定

</button>

<button
class="bigBtn news"
onclick="location.href='news.html'">

瓦版

</button>

<button
class="bigBtn med"
onclick="location.href='med.html'">

薬・見守り

</button>

<button
class="bigBtn support"
onclick="location.href='support.html'">

支援者ページ

</button>

<button
class="bigBtn setting"
onclick="location.href='setting.html'">

地域変更

</button>

</div>

</body>
</html>
