<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ゴミの日</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
}

.header{
background:linear-gradient(135deg,#15803d,#22c55e);
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:36px;
font-weight:900;
}

.card{
background:#fff;
padding:24px;
border-radius:24px;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.title{
font-size:24px;
font-weight:900;
margin-bottom:12px;
}

.result{
font-size:24px;
font-weight:900;
line-height:1.8;
text-align:center;
}

.btn{
display:block;
width:100%;
padding:26px;
border:none;
border-radius:24px;
font-size:28px;
font-weight:900;
cursor:pointer;
margin-bottom:14px;
color:#fff;
}

.green{
background:#16a34a;
}

.blue{
background:#2563eb;
}

.gray{
background:#475569;
}

</style>

</head>

<body>

<div class="header">
<h1>🗑 ゴミの日</h1>
</div>

<div class="card">

<div class="title">
登録住所
</div>

<div
id="address"
class="result">

読込中

</div>

</div>

<div class="card">

<div class="title">
今日のゴミ
</div>

<div
id="todayGarbage"
class="result">

確認中

</div>

</div>

<div class="card">

<div class="title">
明日のゴミ
</div>

<div
id="tomorrowGarbage"
class="result">

確認中

</div>

</div>

<button
class="btn green"
onclick="speakGarbage()">

🔊 ゴミの日を聞く

</button>

<button
class="btn blue"
onclick="askGarbage()">

🎤 ゴミについて聞く

</button>

<a
href="index.html"
class="btn gray">

🏠 トップへ戻る

</a>

<script>

const address =
localStorage.getItem(
'userAddress'
) || '';

document.getElementById(
'address'
).innerHTML =
address || '未登録';

const garbageData = {

'月':'燃えるゴミ',
'火':'資源ゴミ',
'水':'燃えるゴミ',
'木':'プラスチック',
'金':'燃えないゴミ',
'土':'なし',
'日':'なし'

};

function getDayName(d){

return ['日','月','火','水','木','金','土']
[d.getDay()];

}

const today =
new Date();

const tomorrow =
new Date();

tomorrow.setDate(
tomorrow.getDate()+1
);

const todayName =
getDayName(today);

const tomorrowName =
getDayName(tomorrow);

document.getElementById(
'todayGarbage'
).innerHTML =

garbageData[todayName];

document.getElementById(
'tomorrowGarbage'
).innerHTML =

garbageData[tomorrowName];

function speak(text){

speechSynthesis.cancel();

speechSynthesis.speak(
new SpeechSynthesisUtterance(
text
)
);

}

function speakGarbage(){

const text =

'今日は ' +

garbageData[todayName] +

' です。' +

'明日は ' +

garbageData[tomorrowName] +

' です。';

speak(text);

}

function askGarbage(){

if(
!(
'webkitSpeechRecognition'
in window
)
){

alert(
'音声認識未対応'
);

return;

}

const rec =
new webkitSpeechRecognition();

rec.lang =
'ja-JP';

rec.start();

rec.onresult =
function(e){

const q =
e.results[0][0]
.transcript;

if(
q.includes('今日')
){

speak(

'今日は ' +

garbageData[todayName] +

' です'

);

return;

}

if(
q.includes('明日')
){

speak(

'明日は ' +

garbageData[tomorrowName] +

' です'

);

return;

}

if(
q.includes('今週')
){

speak(

'月曜日は燃えるゴミ。' +

'火曜日は資源ゴミ。' +

'水曜日は燃えるゴミ。' +

'木曜日はプラスチック。' +

'金曜日は燃えないゴミです。'

);

return;

}

speak(

'今日または明日のゴミの日を聞いてください'

);

};

}

</script>

</body>
</html>
