<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>今日と明日のゴミ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
}

.header{
background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
margin-bottom:16px

.then(r=>r.text())

.then(text=>{

const json =
JSON.parse(
text.substring(
47,
text.length - 2
)
);

handleGarbage(json);

})

.catch(()=>{

document.getElementById(
'todayGarbage'
).innerHTML =
'取得失敗';

document.getElementById(
'tomorrowGarbage'
).innerHTML =
'取得失敗';

});

}

function handleGarbage(json){

const rows =
json.table.rows || [];

const areaCode =
localStorage.getItem(
'areaCode'
) || '';

const days =
['日','月','火','水','木','金','土'];

const today =
days[
new Date().getDay()
];

const tomorrow =
days[
(new Date().getDay()+1)%7
];

let todayText =
'今日は収集ありません';

let tomorrowText =
'明日は収集ありません';

for(
let i=0;
i<rows.length;
i++
){

const row =
rows[i];

const city =
getVal(row.c[0]);

const area =
getVal(row.c[1]);

const week =
getVal(row.c[2]);

const garbage =
getVal(row.c[3]);

const memo =
getVal(row.c[4]);

if(
areaCode.indexOf(area) === -1
){
continue;
}

if(
week.indexOf(today) > -1
){

todayText =

garbage +

'<br><br>' +

memo;

}

if(
week.indexOf(tomorrow) > -1
){

tomorrowText =

garbage +

'<br><br>' +

memo;

}

}

document.getElementById(
'todayGarbage'
).innerHTML =
todayText;

document.getElementById(
'tomorrowGarbage'
).innerHTML =
tomorrowText;

}

window.onload =
loadGarbage;

</script>

</body>
</html>
