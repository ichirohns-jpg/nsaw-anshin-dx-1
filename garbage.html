<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>今日と明日のゴミ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
}

.header{
background:linear-gradient(
135deg,
#0f172a,
#1e293b,
#334155
);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
margin-bottom:16px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:#fff;
padding:24px;
border-radius:24px;
margin-bottom:16px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.title{
font-size:26px;
font-weight:900;
margin-bottom:12px;
}

.item{
font-size:24px;
font-weight:900;
line-height:1.8;
}

.home{
display:block;
background:#475569;
color:#fff;
text-decoration:none;
padding:20px;
border-radius:20px;
text-align:center;
font-size:22px;
font-weight:900;
}

.areaBox{
background:#dbeafe;
border-radius:24px;
padding:20px;
margin-bottom:16px;
text-align:center;
font-size:24px;
font-weight:900;
color:#1e3a8a;
}

.todayCard{
border-left:10px solid #22c55e;
}

.tomorrowCard{
border-left:10px solid #3b82f6;
}

</style>

</head>

<body>

<div class="header">
<h1>🗑 今日と明日のゴミ</h1>
</div>

<div
class="areaBox"
id="areaName">

地区確認中...

</div>

<div
class="card todayCard">

<div class="title">
🗑 今日
</div>

<div
id="todayGarbage"
class="item">

読込中...

</div>

</div>

<div
class="card tomorrowCard">

<div class="title">
🗑 明日
</div>

<div
id="tomorrowGarbage"
class="item">

読込中...

</div>

</div>

<a
href="index.html"
class="home">

🏠 トップへ戻る

</a>

<script>

const SHEET_ID =
'149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc';

function getVal(cell){

if(!cell)return'';

return cell.f || cell.v || '';

}

function loadGarbage(){

const url =

'https://docs.google.com/spreadsheets/d/' +

SHEET_ID +

'/gviz/tq?sheet=' +

encodeURIComponent(
'ゴミ'
) +

'&tqx=out:json';

fetch(url)

.then(r=>r.text())

.then(text=>{

const json =

JSON.parse(

text.substring(
47,
text.length-2
)

);

handleGarbage(
json
);

})

.catch(()=>{

document.getElementById(
'todayGarbage'
).innerHTML =
'取得失敗';

document.getElementById(
'tomorrowGarbage'
).innerHTML =
'取得失敗';

});

}

function handleGarbage(json){

const rows =
json.table.rows || [];

const areaCode =
localStorage.getItem(
'areaCode'
) || '';

document.getElementById(
'areaName'
).innerHTML =
areaCode || '地区未登録';

const days =
['日','月','火','水','木','金','土'];

const today =
days[
new Date().getDay()
];

const tomorrow =
days[
(new Date().getDay()+1)%7
];

let todayList = [];
let tomorrowList = [];

for(
let i=0;
i<rows.length;
i++
){

const row =
rows[i];

const city =
getVal(row.c[0]);

const area =
getVal(row.c[1]);

const week =
getVal(row.c[2]);

const garbage =
getVal(row.c[3]);

const memo =
getVal(row.c[4]);

if(
areaCode.indexOf(area)===-1
){
continue;
}

if(
week.indexOf(today)>-1
){

todayList.push(
'🗑 '+garbage+
'<br>'+memo
);

}

if(
week.indexOf(tomorrow)>-1
){

tomorrowList.push(
'🗑 '+garbage+
'<br>'+memo
);

}

}

document.getElementById(
'todayGarbage'
).innerHTML =

todayList.length
?
todayList.join(
'<hr style="margin:15px 0;">'
)
:
'今日は収集ありません';

document.getElementById(
'tomorrowGarbage'
).innerHTML =

tomorrowList.length
?
tomorrowList.join(
'<hr style="margin:15px 0;">'
)
:
'明日は収集ありません';

}

window.onload =
loadGarbage;

</script>

</body>
</html>
