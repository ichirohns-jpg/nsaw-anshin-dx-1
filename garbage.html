<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>今日のゴミ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.header{
background:linear-gradient(135deg,#0f172a,#334155);
color:#fff;
padding:30px;
text-align:center;
}

.header h1{
font-size:42px;
font-weight:900;
}

.wrap{
max-width:900px;
margin:auto;
padding:18px;
}

.card{
background:#fff;
border-radius:30px;
padding:24px;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.title{
font-size:22px;
font-weight:900;
margin-bottom:10px;
}

.gomi{
font-size:42px;
font-weight:900;
text-align:center;
padding:20px;
}

.today{
color:#2563eb;
}

.tomorrow{
color:#16a34a;
}

.back{
display:block;
text-align:center;
background:#334155;
color:#fff;
text-decoration:none;
padding:18px;
border-radius:20px;
font-size:22px;
font-weight:900;
}

</style>

</head>

<body>

<div class="header">
<h1>🗑 ゴミ情報</h1>
</div>

<div class="wrap">

<div class="card">

<div class="title">
今日のゴミ
</div>

<div
id="today"
class="gomi today">
読込中...
</div>

</div>

<div class="card">

<div class="title">
明日のゴミ
</div>

<div
id="tomorrow"
class="gomi tomorrow">
読込中...
</div>

</div>

<div class="card">

<div class="title">
地区
</div>

<div
id="area"
class="gomi">
志木市
</div>

</div>

<a
href="index.html"
class="back">
トップへ戻る
</a>

</div>

<script>

const userArea =
localStorage.getItem(
"userArea"
) || "志木市";

document.getElementById(
"area"
).textContent =
userArea;

const todayMap = {

"志木市":"燃えるゴミ",
"朝霞市":"燃えるゴミ",
"和光市":"資源ごみ",
"新座市":"燃えるゴミ"

};

const tomorrowMap = {

"志木市":"資源ごみ",
"朝霞市":"資源ごみ",
"和光市":"燃えるゴミ",
"新座市":"資源ごみ"

};

document.getElementById(
"today"
).textContent =

todayMap[userArea]
||

"確認中";

document.getElementById(
"tomorrow"
).textContent =

tomorrowMap[userArea]
||

"確認中";

</script>

</body>
</html>
