<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>服薬確認</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
}

.header{
background:linear-gradient(135deg,#2563eb,#60a5fa);
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:36px;
font-weight:900;
}

.card{
background:#fff;
border-radius:30px;
padding:24px;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.btn{
width:100%;
padding:28px;
border:none;
border-radius:24px;
margin-bottom:14px;
font-size:28px;
font-weight:900;
color:#fff;
cursor:pointer;
}

.morning{
background:#f59e0b;
}

.noon{
background:#16a34a;
}

.evening{
background:#2563eb;
}

.night{
background:#7c3aed;
}

.result{
background:#f1f5f9;
padding:20px;
border-radius:20px;
font-size:22px;
font-weight:900;
text-align:center;
}

</style>

</head>

<body>

<div class="header">
<h1>💊 服薬確認</h1>
</div>

<div class="card">

<button
class="btn morning"
onclick="sendMedicine('朝の薬')">
🌅 朝の薬
</button>

<button
class="btn noon"
onclick="sendMedicine('昼の薬')">
☀️ 昼の薬
</button>

<button
class="btn evening"
onclick="sendMedicine('夕方の薬')">
🌇 夕方の薬
</button>

<button
class="btn night"
onclick="sendMedicine('寝る前の薬')">
🌙 寝る前の薬
</button>

</div>

<div class="card">

<div
id="result"
class="result">

待機中

</div>

</div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec';

function sendMedicine(type){

document.getElementById('result').innerHTML =
'送信中...';

fetch(
GAS_URL,
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify({
name:'利用者001',
status:type,
time:new Date().toLocaleString('ja-JP')
})
}
)
.then(r=>r.text())
.then(data=>{

document.getElementById('result').innerHTML =
type + '<br>送信完了';

})
.catch(err=>{

document.getElementById('result').innerHTML =
'送信失敗';

});

}

</script>

<a
href="app.html"
class="btn evening">
😊 本人ページ
</a>

<a
href="medicine-history.html"
class="btn night">
💊 服薬履歴
</a>

<a
href="index.html"
class="btn noon">
🏠 トップへ戻る
</a>

</body>
</html>
