<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>あんしん生活ボタン</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
background:#101827;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
color:#fff;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
border-radius:32px;
padding:30px 20px;
text-align:center;
margin-bottom:18px;
box-shadow:0 12px 30px rgba(0,0,0,.35);
}

.header h1{
font-size:34px;
font-weight:900;
}

.header p{
margin-top:8px;
font-size:16px;
color:#cbd5e1;
font-weight:700;
}

.mainBtn{
display:flex;
align-items:center;
gap:18px;
padding:28px;
border-radius:28px;
text-decoration:none;
color:#fff;
margin-bottom:14px;
box-shadow:0 12px 24px rgba(0,0,0,.25);
}

.icon{
font-size:54px;
width:70px;
text-align:center;
}

.text{
flex:1;
}

.title{
font-size:30px;
font-weight:900;
}

.sub{
font-size:15px;
margin-top:4px;
opacity:.9;
}

.green{
background:linear-gradient(135deg,#16a34a,#22c55e);
}

.blue{
background:linear-gradient(135deg,#2563eb,#3b82f6);
}

.red{
background:linear-gradient(135deg,#dc2626,#ef4444);
}

.orange{
background:linear-gradient(135deg,#ea580c,#fb923c);
}

details{
margin-top:18px;
background:linear-gradient(135deg,#1e293b,#0f172a);
border-radius:24px;
padding:20px;
}

summary{
font-size:24px;
font-weight:900;
cursor:pointer;
}

.other{
display:block;
padding:18px 0;
border-bottom:1px solid rgba(255,255,255,.10);
text-decoration:none;
color:#fff;
font-size:22px;
font-weight:900;
}

.other:last-child{
border-bottom:none;
}

</style>
</head>

<body>

<div class="header">
<h1>あんしん生活ボタン</h1>
<p>押すだけ・迷わない・かんたん操作</p>
</div>

<a href="app.html" class="mainBtn green">
<div class="icon">😊</div>
<div class="text">
<div class="title">元気です</div>
<div class="sub">今日も元気を送信</div>
</div>
</a>

<a href="medicine.html" class="mainBtn blue">
<div class="icon">💊</div>
<div class="text">
<div class="title">服薬</div>
<div class="sub">朝・昼・夕方・寝る前</div>
</div>
</a>

<a href="gps.html" class="mainBtn red">
<div class="icon">📍</div>
<div class="text">
<div class="title">現在地</div>
<div class="sub">位置情報を送信</div>
</div>
</a>

<a href="sos.html" class="mainBtn orange">
<div class="icon">🚨</div>
<div class="text">
<div class="title">困りごと・SOS</div>
<div class="sub">支援者へ連絡</div>
</div>
</a>

<details>

<a href="family.html" class="other">👪 支援者ページ</a>

<a href="garbage.html" class="other">🗑 ゴミの日</a>
<a href="kawaraban.html" class="other">📰 4市瓦版</a>
<a href="radio.html" class="other">📻 地域ラジオ</a>
<a href="fun.html" class="other">🎬 お楽しみ動画</a>
