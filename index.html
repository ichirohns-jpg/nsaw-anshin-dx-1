<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地域ダッシュボード</title>

<style>
:root {
  /* 高齢者の方が最も識別しやすく、かつ洗練された配色（高コントラスト） */
  --bg-color: #f4f6f9;
  --panel-bg: #ffffff;
  --text-dark: #111827;
  --text-muted: #4b5563;
  
  /* くっきり見えて美しいユニバーサルカラー */
  --btn-green: #008542;  /* 視認性の高い深い緑 */
  --btn-blue: #005bac;   /* 認識しやすい鮮明な青 */
  --btn-orange: #d9531e; /* ぼやけない濃いオレンジ */
  --btn-red: #d9383a;    /* 警告色としてもハッキリ映える赤 */
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--bg-color);
  color: var(--text-dark);
  padding: 12px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.dashboard-card {
  width: 100%;
  max-width: 440px;
  background: var(--panel-bg);
  border-radius: 32px;
  padding: 24px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
}

/* ヘッダー：文字サイズを大きく、太く、読みやすく */
.header-area {
  text-align: center;
  margin-bottom: 24px;
  border-bottom: 3px solid #e5e7eb;
  padding-bottom: 16px;
}

.header-area h1 {
  font-size: 32px; /* 圧倒的に見やすい大文字 */
  font-weight: 900;
  color: var(--text-dark);
  letter-spacing: 1px;
}

.header-area p {
  margin-top: 8px;
  font-size: 16px;
  color: var(--text-muted);
  font-weight: 700;
  letter-spacing: 1px;
}

/* 状態表示：一目で状況がわかる巨大なバッジ構造 */
.status-container {
  margin-bottom: 24px;
}

.status-display {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: #f0fdf4;
  border: 3px solid #bbf7d0;
  padding: 18px;
  border-radius: 24px;
}

.status-icon {
  font-size: 38px; /* アイコンを巨大化 */
}

.status-text {
  font-size: 26px;
  font-weight: 900;
  color: #166534;
}

/* ボタンレイアウト：押し間違えない十分な隙間とサイズ */
.button-grid {
  display: grid;
  grid-template-columns: 1fr; /* 1コずつ大きく並べることで誤操作を完全に防止 */
  gap: 16px;
  margin-bottom: 16px;
}

/* ボタン：指が震えても確実に押せる巨大な設計 */
.huge-btn {
  border: none;
  border-radius: 24px;
  padding: 24px 28px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #ffffff;
  position: relative;
  transition: transform 0.1s ease, filter 0.1s ease;
  box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
}

/* 色弱・弱視の方でも完全に識別できるコントラスト */
.huge-btn.green  { background: var(--btn-green); }
.huge-btn.blue   { background: var(--btn-blue); }
.huge-btn.orange { background: var(--btn-orange); }
.huge-btn.red    { background: var(--btn-red); }

.btn-label {
  font-size: 26px; /* 圧倒的な視認性 */
  font-weight: 900;
  letter-spacing: 2px;
}

.btn-arrow {
  font-size: 28px;
  font-weight: 900;
  background: rgba(255, 255, 255, 0.25);
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 押した感触がはっきりわかるインターフェース */
.huge-btn:active {
  transform: scale(0.95);
  filter: brightness(0.85);
}

.footer-copy {
  text-align: center;
  font-size: 14px;
  color: var(--text-muted);
  font-weight: 700;
  margin-top: 16px;
}
</style>

</head>

<body>

<div class="dashboard-card">

  <div class="header-area">
    <h1>地域ダッシュボード</h1>
    <p>志木 ・ 新座 ・ 朝霞 ・ 和光</p>
  </div>

  <div class="status-container">
    <div class="status-display">
      <span class="status-icon">😊</span>
      <span class="status-text">元気です</span>
    </div>
  </div>

  <div class="button-grid">
    <button class="huge-btn green" onclick="go('care.html')">
      <span class="btn-label">見守り</span>
      <span class="btn-arrow">▶</span>
    </button>

    <button class="huge-btn blue" onclick="go('calendar.html')">
      <span class="btn-label">予 定</span>
      <span class="btn-arrow">▶</span>
    </button>

    <button class="huge-btn orange" onclick="go('trash.html')">
      <span class="btn-label">ゴ ミ</span>
      <span class="btn-arrow">▶</span>
    </button>

    <button class="huge-btn red" onclick="go('map.html')">
      <span class="btn-label">現在地</span>
      <span class="btn-arrow">▶</span>
    </button>
  </div>

  <div class="footer-copy">
    あんしん画面
  </div>

</div>

<script>
function go(page){
  window.location.href = page;
}
</script>

</body>
</html>
