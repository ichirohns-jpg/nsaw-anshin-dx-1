<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>あんしん生活DX</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:12px;
  background:#eef4f8;
  font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  color:#123;
}

.wrap{
  max-width:720px;
  margin:0 auto;
}

.header{
  background:#1565c0;
  color:white;
  border-radius:30px;
  padding:28px 18px;
  text-align:center;
  margin-bottom:18px;
  box-shadow:0 8px 22px rgba(0,0,0,.12);
}

.title{
  font-size:40px;
  font-weight:900;
  line-height:1.35;
  margin:0;
}

.sub{
  font-size:23px;
  font-weight:900;
  line-height:1.6;
  margin-top:12px;
}

.card{
  background:white;
  border-radius:28px;
  padding:18px;
  box-shadow:0 8px 22px rgba(0,0,0,.08);
}

.mainBtn{
  display:block;
  width:100%;
  text-align:center;
  text-decoration:none;
  border:none;
  border-radius:30px;
  padding:34px 12px;
  font-size:34px;
  font-weight:900;
  color:white;
  margin-bottom:18px;
  cursor:pointer;
}

.green{
  background:#2e7d32;
}

.blue{
  background:#1976d2;
}

.gray{
  background:#555;
}

.note{
  background:#fff8e1;
  border-radius:24px;
  padding:18px;
  font-size:23px;
  font-weight:900;
  line-height:1.6;
  color:#444;
  text-align:center;
  margin-top:4px;
}

@media(max-width:600px){
  .title{
    font-size:34px;
  }

  .sub{
    font-size:21px;
  }

  .mainBtn{
    font-size:30px;
    padding:32px 10px;
  }

  .note{
    font-size:21px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="header">
    <h1 class="title">
      あんしん生活DX
    </h1>
    <div class="sub">
      話して登録<br>
      大きな文字で確認
    </div>
  </div>

  <div class="card">

    <a class="mainBtn green" href="voice.html?v=newgas1">
      🎤 予定を入れる
    </a>

    <a class="mainBtn blue" href="today.html?v=newgas1">
      📅 今日の予定を見る
    </a>

    <a class="mainBtn gray" href="connect.html?v=fixed1">
      ☎️ 人につなぐ
    </a>

    <div class="note">
      迷ったら「人につなぐ」を押してください
    </div>

  </div>

</div>

<script>
try{
  if(window.speechSynthesis){
    window.speechSynthesis.cancel();
  }
}catch(e){}
</script>

</body>
</html>
