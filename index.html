<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>見守りDX</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:520px;
margin:auto;
padding:16px;
}

.banner{
width:100%;
display:block;
border-radius:26px;
margin-bottom:18px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.card{
background:#fff;
border-radius:28px;
padding:22px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.title{
font-size:38px;
font-weight:900;
text-align:center;
color:#1976d2;
margin-top:4px;
}

.sub{
text-align:center;
font-size:16px;
color:#6b7785;
margin-top:6px;
margin-bottom:24px;
}

.bigBtn{
width:100%;
border:none;
border-radius:24px;
padding:22px;
font-size:28px;
font-weight:900;
margin-bottom:14px;
color:#fff;
cursor:pointer;
transition:.2s;
}

.bigBtn:active{
transform:scale(.97);
}

.green{
background:#43a047;
}

.orange{
background:#fb8c00;
}

.red{
background:#e53935;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-top:18px;
}

.menu{
background:#fff;
border-radius:22px;
padding:24px 10px;
text-align:center;
font-size:22px;
font-weight:900;
box-shadow:0 6px 18px rgba(0,0,0,.08);
cursor:pointer;
transition:.2s;
}

.menu:active{
transform:scale(.97);
}

.footer{
display:flex;
justify-content:space-around;
margin-top:24px;
padding:18px 0;
background:#fff;
border-radius:22px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
font-size:14px;
font-weight:700;
color:#666;
}

.toast{
position:fixed;
left:50%;
bottom:30px;
transform:translateX(-50%);
background:#1976d2;
color:#fff;
padding:16px 24px;
border-radius:18px;
font-size:18px;
font-weight:700;
display:none;
z-index:9999;
box-shadow:0 6px 18px rgba(0,0,0,.2);
}

.statusBox{
background:#f7fbff;
border-radius:22px;
padding:18px;
margin-top:18px;
box-shadow:0 4px 12px rgba(0,0,0,.06);
}

.statusTitle{
font-size:18px;
font-weight:900;
margin-bottom:10px;
color:#1976d2;
}

.statusText{
font-size:22px;
font-weight:900;
}

.timeBox{
margin-top:14px;
font-size:16px;
font-weight:700;
color:#666;
}

</style>
</head>

<body>

<div class="wrap">

<img src="top.jpg" class="banner" alt="見守りDX">

<div class="card">

<div class="title">
見守りDX
</div>

<div class="sub">
地域の安心をひとつにつなぐ
</div>

<button class="bigBtn green" onclick="setStatus('😊 元気です')">
😊 元気です
</button>

<button class="bigBtn orange" onclick="setStatus('😐 少し困っています')">
😐 少し困っています
</button>

<button class="bigBtn red" onclick="setStatus('🚨 助けてください')">
🚨 助けてください
</button>

<div class="statusBox">

<div class="statusTitle">
現在の状態
</div>

<div class="statusText" id="statusText">
未確認
</div>

<div class="timeBox" id="timeText">
最終更新：未記録
</div>

</div>

<div class="grid">

<div class="menu" onclick="showToast('📅 今日の予定')">
📅<br>
今日の予定
</div>

<div class="menu" onclick="showToast('🗑 ゴミの日')">
🗑<br>
ゴミの日
</div>

<div class="menu" onclick="showToast('📍 現在地')">
📍<br>
現在地
</div>

<div class="menu" onclick="showToast('📰 地域情報')">
📰<br>
地域情報
</div>

<div class="menu" onclick="showToast('👨‍👩‍👧 支援者')">
👨‍👩‍👧<br>
支援者
</div>

<div class="menu" onclick="showToast('⚙️ 設定')">
⚙️<br>
設定
</div>

</div>

<div class="footer">

<div>
見守り
</div>

<div>
予定
</div>

<div>
地域情報
</div>

<div>
設定
</div>

</div>

</div>

</div>

<div id="toast" class="toast"></div>

<script>

function showToast(text){

const toast=document.getElementById("toast");

toast.innerText=text;

toast.style.display="block";

setTimeout(()=>{
toast.style.display="none";
},2000);

}

function setStatus(text){

document.getElementById("statusText").innerText=text;

const now=new Date();

const time=
now.getFullYear()+"-"+
String(now.getMonth()+1).padStart(2,'0')+"-"+
String(now.getDate()).padStart(2,'0')+" "+
String(now.getHours()).padStart(2,'0')+":"+
String(now.getMinutes()).padStart(2,'0');

document.getElementById("timeText").innerText=
"最終更新："+time;

showToast(text + " を記録しました");

}

</script>

</body>
</html>
