<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NSAW見守りDX</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:
linear-gradient(
180deg,
#020814,
#03152e,
#000814
);
color:#fff;
padding:20px;
}

.wrap{
max-width:700px;
margin:auto;
}

.card{
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.12);
border-radius:40px;
padding:25px;
margin-bottom:25px;
box-shadow:
0 0 30px rgba(0,0,0,.4);
}

h1{
font-size:52px;
font-weight:900;
text-align:center;
margin-bottom:25px;
}

.sectionTitle{
font-size:18px;
letter-spacing:8px;
opacity:.7;
margin-bottom:18px;
}

.bigBtn{
width:100%;
border:none;
border-radius:35px;
padding:34px;
font-size:26px;
font-weight:900;
margin-bottom:18px;
cursor:pointer;
color:#fff;
}

.blue{
background:#12bde7;
}

.green{
background:#17b857;
}

.orange{
background:#ff9800;
}

.red{
background:#ef4444;
}

.gray{
background:#5d7287;
}

.grid{
display:grid;
grid-template-columns:
repeat(3,1fr);
gap:15px;
}

.mini{
background:
rgba(255,255,255,.08);
border-radius:25px;
padding:25px 10px;
text-align:center;
font-size:20px;
font-weight:900;
}

.count{
font-size:55px;
font-weight:900;
display:block;
margin-bottom:10px;
}

.shareArea{
display:flex;
flex-direction:column;
gap:15px;
}

.shareBtn{
width:100%;
border:none;
border-radius:30px;
padding:25px;
font-size:22px;
font-weight:900;
cursor:pointer;
color:#fff;
}

.line{
background:#06c755;
}

.copy{
background:#2196f3;
}

.sms{
background:#7c4dff;
}

</style>
</head>

<body>

<div class="wrap">

<div class="card">

<h1>
NSAW<br>
見守りDX
</h1>

<div class="grid">

<div class="mini">
<span class="count" id="genkiCount">0</span>
😊元気
</div>

<div class="mini">
<span class="count" id="waitCount">0</span>
⏰未確認
</div>

<div class="mini">
<span class="count" id="emgCount">0</span>
🚨緊急
</div>

<div class="mini">
<span class="count" id="scheduleCount">0</span>
📅予定
</div>

<div class="mini">
<span class="count" id="medicineCount">0</span>
💊服薬
</div>

<div class="mini">
<span class="count" id="mapCount">0</span>
📍位置
</div>

</div>

</div>

<div class="card">

<div class="sectionTitle">
本人操作
</div>

<button
class="bigBtn green"
onclick="location.href='app.html'">
😊 元気です
</button>

<button
class="bigBtn orange"
onclick="location.href='medicine.html'">
💊 薬を飲みました
</button>

<button
class="bigBtn blue"
onclick="location.href='schedule.html'">
📅 今日の予定
</button>

<button
class="bigBtn gray"
onclick="location.href='map.html'">
📍 現在地送信
</button>

<button
class="bigBtn red"
onclick="location.href='emergency.html'">
🚨 困っています
</button>

</<div class="card">

<div class="sectionTitle">
家族へ共有
</div>

<div class="shareArea">

<button
class="shareBtn line"
onclick="shareLine()">
📤 LINEで送る
</button>

<button
class="shareBtn copy"
onclick="copyUrl()">
📋 URLコピー
</button>

<button
class="shareBtn sms"
onclick="shareSms()">
📱 SMSで送る
</button>

</div>

</div>

<div class="card">

<div class="sectionTitle">
地域情報
</div>

<button
class="bigBtn gray"
onclick="location.href='radio.html'">
📻 地域ラジオ
</button>

<button
class="bigBtn gray"
onclick="location.href='kawaraban.html'">
📰 4市瓦版
</button>

<button
class="bigBtn gray"
onclick="location.href='fun.html'">
🎬 お楽しみ動画
</button>

</div>

<div class="card">

<div class="sectionTitle">
管理メニュー
</div>

<button
class="bigBtn blue"
onclick="location.href='register.html'">
👤 利用者登録
</button>

<button
class="bigBtn gray"
onclick="location.href='users.html'">
👥 利用者一覧
</button>

<button
class="bigBtn gray"
onclick="location.href='support.html'">
👪 家族ページ
</button>

<button
class="bigBtn gray"
onclick="location.href='qr.html'">
📱 QRコード発行
</button>

</div>

</div>

<script>

const SHARE_URL =
location.origin +
location.pathname;

function shareLine(){

const url =
'https://line.me/R/msg/text/?' +
encodeURIComponent(
'NSAW見守りDX\n' +
SHARE_URL
);

location.href = url;

}

function copyUrl(){

navigator.clipboard
.writeText(
SHARE_URL
);

alert(
'URLをコピーしました'
);

}

function shareSms(){

location.href =
'sms:?body=' +
encodeURIComponent(
'NSAW見守りDX ' +
SHARE_URL
);

}

</script>

</body>
</html>
