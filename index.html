<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地域安心ホーム</title>

<style>
:root{
  --bg:#f6f8fc;
  --card:#ffffff;
  --text:#0f172a;

  --green:#0f8a4b;
  --blue:#1a73e8;
  --orange:#e67700;
  --red:#d93025;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
}

/* 全体 */
.wrap{
  max-width:680px;
  margin:0 auto;
  padding:18px;
}

/* ヘッダー */
.header{
  background:linear-gradient(135deg,#1a73e8,#60a5fa);
  color:#fff;
  padding:26px;
  border-radius:22px;
}

.header h1{
  font-size:22px;
  font-weight:900;
}

.header p{
  margin-top:6px;
  font-size:13px;
  opacity:.9;
}

/* ステータス */
.status{
  margin-top:14px;
  background:#fff;
  border-radius:20px;
  padding:18px;
  font-size:24px;
  font-weight:900;
  text-align:center;
  box-shadow:0 6px 16px rgba(0,0,0,0.05);
}

/* メニュー */
.menu{
  margin-top:16px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* ボタン */
.btn{
  border:none;
  border-radius:22px;
  padding:22px;
  font-size:20px;
  font-weight:900;
  color:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
  box-shadow:0 8px 18px rgba(0,0,0,0.08);
}

.btn:active{
  transform:scale(0.98);
}

/* 色 */
.green{background:var(--green);}
.blue{background:var(--blue);}
.orange{background:var(--orange);}
.red{background:var(--red);}

/* 小さな矢印 */
.arrow{
  background:rgba(255,255,255,0.25);
  width:44px;
  height:44px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

/* フッター */
.footer{
  margin-top:18px;
  text-align:center;
  font-size:12px;
  opacity:.6;
}
</style>

</head>

<body>

<div class="wrap">

  <div class="header">
    <h1>地域安心ホーム</h1>
    <p>志木・新座・朝霞・和光</p>
  </div>

  <div class="status">
    😊 元気です
  </div>

  <div class="menu">

    <button class="btn green" onclick="go('care.html')">
      見守り
      <div class="arrow">›</div>
    </button>

    <button class="btn blue" onclick="go('calendar.html')">
      今日の予定
      <div class="arrow">›</div>
    </button>

    <button class="btn orange" onclick="go('trash.html')">
      ゴミの日
      <div class="arrow">›</div>
    </button>

    <button class="btn red" onclick="go('map.html')">
      現在地
      <div class="arrow">›</div>
    </button>

  </div>

  <div class="footer">
    地域デジタル安心システム
  </div>

</div>

<script>
function go(page){
  location.href = page;
}
</script>

</body>
</html>
