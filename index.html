<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>家族ページ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
color:#1f2d3d;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.name{
font-size:36px;
font-weight:900;
}

.card{
background:#fff;
border-radius:30px;
padding:24px;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.title{
font-size:26px;
font-weight:900;
margin-bottom:14px;
}

.status{
font-size:22px;
font-weight:900;
line-height:2;
}

.btn{
display:block;
width:100%;
padding:24px;
border-radius:22px;
margin-bottom:14px;
text-align:center;
text-decoration:none;
font-size:24px;
font-weight:900;
color:#fff;
}

.green{
background:#16a34a;
}

.blue{
background:#2563eb;
}

.orange{
background:#ea580c;
}

.red{
background:#dc2626;
}

.gray{
background:#475569;
}

.teal{
background:#0f766e;
}

</style>

</head>

<body>

<div class="header">

<div class="name">
👪 家族ページ
</div>

</div>

<div class="card">

<div class="title">
利用者状況
</div>

<div
id="statusArea"
class="status">

読込中...

</div>

</div>

<div class="card">

<a href="schedule.html" class="btn teal">
📅 今日の予定
</a>

<a href="history.html" class="btn gray">
📋 見守り履歴
</a>

<a href="check-history.html" class="btn green">
😊 元気です履歴
</a>

<a href="medicine-history.html" class="btn blue">
💊 服薬履歴
</a>

</div>

<div class="card">

<a href="tel:0000000000" class="btn orange">
📞 電話する
</a>

<a href="map.html" class="btn red">
📍 現在地を見る
</a>

<a href="garbage.html" class="btn gray">
🗑 今日のゴミ
</a>

<a href="hospital.html" class="btn gray">
🏥 病院・薬局
</a>

</div>

<a href="index.html" class="btn gray">
🏠 トップへ戻る
</a>

<script>

const SHEET_ID =
'149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc';

const SHEET_NAME =
'見守り記録';

const url =
'https://docs.google.com/spreadsheets/d/' +
SHEET_ID +
'/gviz/tq?sheet=' +
encodeURIComponent(SHEET_NAME) +
'&tqx=out:json';

fetch(url)
.then(r=>r.text())
.then(text=>{

const json =
JSON.parse(
text.substring(47,text.length-2)
);

const rows =
json.table.rows;

const last =
rows[rows.length-1];

const time =
last.c[0] ? last.c[0].v : '';

const name =
last.c[1] ? last.c[1].v : '';

const status =
last.c[2] ? last.c[2].v : '';

document.getElementById(
'statusArea'
).innerHTML =

'👤 ' + name +
'<br><br>' +

status +
'<br><br>' +

'🕒 ' + time;

});

</script>

</body>
</html>
