<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地域ダッシュボード</title>

<style>
:root {
  --bg: #f4f7f6;
  --card-bg: #ffffff;
  --text-main: #2d3748;
  --text-sub: #718096;
  
  /* 洗練されたモダンな配色 */
  --color-green: #2ecc71;
  --color-blue: #3498db;
  --color-orange: #e67e22;
  --color-red: #e74c3c;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
}

body {
  background-color: var(--bg);
  color: var(--text-main);
  line-height: 1.6;
  padding: 24px 16px;
}

.container {
  max-width: 480px;
  margin: 0 auto;
}

/* ヘッダー：グラデーションとシャドウで上質感を演出 */
.header {
  background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
  color: #ffffff;
  padding: 32px 24px;
  border-radius: 24px;
  box-shadow: 0 10px 25px rgba(59, 130, 246, 0.25);
  text-align: center;
  margin-bottom: 20px;
}

.header h1 {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: 0.05em;
}

.header p {
  margin-top: 8px;
  font-size: 14px;
  opacity: 0.9;
  font-weight: 500;
}

/* カード：浮遊感のある柔らかな立体感 */
.card {
  background: var(--card-bg);
  border-radius: 24px;
  padding: 24px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
  margin-bottom: 20px;
  border: 1px solid rgba(0, 0, 0, 0.01);
}

/* ステータス：視認性と親しみやすさを両立 */
.status {
  font-size: 24px;
  font-weight: 700;
  text-align: center;
  color: #2d3748;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.status-icon {
  font-size: 28px;
}

/* グリッドレイアウト */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

/* ボタン：押しやすさを追求したフラットかつモダンな造形 */
.btn {
  border: none;
  border-radius: 20px;
  padding: 24px 16px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  color: #ffffff;
  transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.1s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

/* ボタン毎のグラデーション指定 */
.green  { background: linear-gradient(135deg, #2ecc71, #27ae60); box-shadow: 0 6px 15px rgba(46, 204, 113, 0.25); }
.blue   { background: linear-gradient(135deg, #3498db, #2980b9); box-shadow: 0 6px 15px rgba(52, 152, 219, 0.25); }
.orange { background: linear-gradient(135deg, #e67e22, #d35400); box-shadow: 0 6px 15px rgba(230, 126, 34, 0.25); }
.red    { background: linear-gradient(135deg, #e74c3c, #c0392b); box-shadow: 0 6px 15px rgba(231, 76, 60, 0.25); }

/* タップ・クリック時のインタラクション */
.btn:active {
  transform: scale(0.96);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
  filter: brightness(0.9);
}

.footer {
  text-align: center;
  font-size: 13px;
  color: var(--text-sub);
  margin-top: 24px;
  font-weight: 500;
}
</style>

</head>

<body>

<div class="container">

  <div class="header">
    <h1>地域ダッシュボード</h1>
    <p>志木 • 新座 • 朝霞 • 和光</p>
  </div>

  <div class="card">
    <div class="status">
      <span class="status-icon">😊</span>
      <span>元気です</span>
    </div>
  </div>

  <div class="card" style="padding: 16px;">
    <div class="grid">
      <button class="btn green" onclick="go('care.html')">見守り</button>
      <button class="btn blue" onclick="go('calendar.html')">予定</button>
      <button class="btn orange" onclick="go('trash.html')">ゴミ</button>
      <button class="btn red" onclick="go('map.html')">現在地</button>
    </div>
  </div>

  <div class="footer">
    Modern Dashboard UI
  </div>

</div>

<script>
function go(page){
  window.location.href = page;
}
</script>

</body>
</html>
