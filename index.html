<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>あんしん生活ボタン</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#e9edf3;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
color:#111827;
max-width:700px;
margin:auto;
}

.header{
background:linear-gradient(135deg,#111827,#1e293b,#334155);
color:#fff;
padding:28px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
box-shadow:0 10px 30px rgba(0,0,0,.18);
}

.header h1{
font-size:34px;
font-weight:900;
letter-spacing:2px;
}

.header p{
margin-top:8px;
font-size:15px;
opacity:.8;
}

.mainGrid{
display:grid;
grid-template-columns:1fr;
gap:14px;
margin-bottom:18px;
}

.bigBtn{
display:flex;
align-items:center;
gap:20px;
background:#fff;
text-decoration:none;
color:#111827;
padding:24px;
border-radius:28px;
min-height:110px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
border:2px solid #dbe3ee;
}

.icon{
font-size:54px;
width:70px;
text-align:center;
}

.text{
flex:1;
}

.title{
font-size:28px;
font-weight:900;
}

.sub{
font-size:14px;
color:#64748b;
margin-top:4px;
}

.green{
border-left:12px solid #16a34a;
}

.blue{
border-left:12px solid #2563eb;
}

.red{
border-left:12px solid #dc2626;
}

.orange{
border-left:12px solid #ea580c;
}

.family{
display:block;
background:#fff;
color:#111827;
text-decoration:none;
padding:24px;
border-radius:28px;
font-size:28px;
font-weight:900;
text-align:center;
box-shadow:0 8px 24px rgba(0,0,0,.08);
margin-bottom:14px;
border:2px solid #dbe3ee;
}

.history{
display:block;
background:#475569;
color:#fff;
text-decoration:none;
padding:22px;
border-radius:24px;
font-size:24px;
font-weight:900;
text-align:center;
margin-bottom:18px;
}

details{
background:#fff;
border-radius:28px;
padding:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

summary{
font-size:24px;
font-weight:900;
cursor:pointer;
list-style:none;
}

summary::-webkit-details-marker{
display:none;
}

.other{
display:block;
text-decoration:none;
color:#111827;
font-size:22px;
font-weight:700;
padding:18px 6px;
border-bottom:1px solid #e5e7eb;
}

.other:last-child{
border-bottom:none;
}

</style>

</head>

<body>

<div class="header">
<h1>あんしん生活ボ
