<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NSAW 見守りDX</title>

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#0f172a;

  --green:#16a34a;
  --blue:#2563eb;
  --orange:#f59e0b;
  --red:#dc2626;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:"Hiragino Sans","Yu Gothic",sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
}

/* 全体 */
.wrap{
  max-width:720px;
  margin:0 auto;
  padding:18px;
}

/* ヘッダー */
.header{
  background:linear-gradient(135deg,#1d4ed8,#60a5fa);
  color:#fff;
  padding:28px;
  border-radius:22px;
  text-align:center;
}

.header h1{
  font-size:22px;
  font-weight:900;
}

.header p{
  font-size:13px;
  margin-top:6px;
  opacity:.9;
}

/* 状態カード */
.status{
  background:#fff;
  margin-top:14px;
  padding:20px;
  border-radius:18px;
  text-align:center;
  font-size:28px;
  font-weight:900;
  box-shadow:0 6px 16px rgba(0,0,0,0.06);
}

/* メニュー */
.menu{
  margin-top:16px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* ボタン */
.btn{
  border:none;
  border-radius:22px;
  padding:22px;
  font-size:20px;
  font-weight:900;
  color:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
  box-shadow:0 8px 18px rgba(0,0,0,0.08);
}

/* 色 */
.green{background:var(--green);}
.blue{background:var(--blue);}
.orange{background:var(--orange);}
.red{background:var(--red);}

/* 矢印 */
.arrow{
  background:rgba(255,255,255,0.25);
  width:44px;
  height:44px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

/* フッター */
.footer{
  text-align:center;
  font-size:12px;
  color:#64748b;
  margin-top:18px;
}
</style>

</head>

<body>

<div class="wrap">

  <!-- ヘッダー -->
  <div class="header">
    <h1>NSAW 見守りDX</h1>
    <p>志木・新座・朝霞・和光</p>
  </div>

  <!-- 状態 -->
  <div class="status">
    😊 元気です
  </div>

  <!-- メニュー -->
  <div class="menu">

    <button class="btn green" onclick="go('care.html')">
      見守り
      <div class="arrow">›</div>
    </button>

    <button class="btn blue" onclick="go('calendar.html')">
      今日の予定
      <div class="arrow">›</div>
    </button>

    <button class="btn orange" onclick="go('trash.html')">
      ゴミの日
      <div class="arrow">›</div>
    </button>

    <button class="btn red" onclick="go('map.html')">
      現在地
      <div class="arrow">›</div>
    </button>

  </div>

  <!-- フッター -->
  <div class="footer">
    地域見守りシステム
  </div>

</div>

<script>
function go(page){
  window.location.href = page;
}
</script>

</body>
</html>
