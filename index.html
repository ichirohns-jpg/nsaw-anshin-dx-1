<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>今日の安心DX</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#edf2f7;
  font-family:
  "Hiragino Sans",
  "Yu Gothic",
  sans-serif;
  color:#222;
}

.top{
  background:
  linear-gradient(
  135deg,
  #1565c0,
  #0d47a1
  );

  color:white;

  padding:
  40px 24px 48px;

  border-bottom-left-radius:40px;
  border-bottom-right-radius:40px;

  box-shadow:
  0 8px 24px rgba(0,0,0,.18);
}

.title{
  font-size:52px;
  font-weight:900;
  line-height:1.3;
}

.sub{
  margin-top:14px;
  font-size:24px;
  line-height:1.8;
  opacity:.95;
}

.date{
  margin-top:22px;
  font-size:24px;
  font-weight:900;
}

.wrap{
  padding:20px;
}

.card{
  background:white;

  border-radius:34px;

  padding:30px;

  margin-bottom:24px;

  box-shadow:
  0 8px 22px rgba(0,0,0,.10);
}

.schedule-title{
  font-size:26px;
  color:#1565c0;
  font-weight:900;
  margin-bottom:16px;
}

.schedule-main{
  font-size:48px;
  font-weight:900;
  line-height:1.4;
}

.schedule-sub{
  margin-top:14px;
  font-size:24px;
  color:#666;
  line-height:1.8;
}

.big-button{
  width:100%;

  border:none;

  border-radius:34px;

  padding:38px 26px;

  margin-bottom:24px;

  color:white;

  font-size:42px;

  font-weight:900;

  letter-spacing:.02em;

  box-shadow:
  0 8px 20px rgba(0,0,0,.16);

  transition:.2s;
}

.big-button:active{
  transform:scale(.98);
}

.green{
  background:
  linear-gradient(
  135deg,
  #43a047,
  #2e7d32
  );
}

.blue{
  background:
  linear-gradient(
  135deg,
  #1e88e5,
  #1565c0
  );
}

.red{
  background:
  linear-gradient(
  135deg,
  #ef5350,
  #c62828
  );
}

.gray{
  background:
  linear-gradient(
  135deg,
  #78909c,
  #546e7a
  );
}

.orange{
  background:
  linear-gradient(
  135deg,
  #ffb300,
  #f57c00
  );
}

.result{
  text-align:center;
  font-size:28px;
  font-weight:900;
  color:#1565c0;
  margin:10px 0 24px;
}

.checked{
  opacity:.6;

  box-shadow:
  0 0 0 6px #fff,
  0 0 0 12px #00c853;
}

.menu-title{
  font-size:28px;
  font-weight:900;
  margin-bottom:18px;
  color:#1565c0;
}

</style>
</head>

<body>

<div class="top">

  <div class="title">
    今日の安心DX
  </div>

  <div class="sub">
    毎日の見守りと、<br>
    地域の安心をつなぐページ
  </div>

  <div class="date" id="todayDate"></div>

</div>

<div class="wrap">

  <div class="card">

    <div class="schedule-title">
      📅 今日の予定
    </div>

    <div class="schedule-main">
      今日は予定ありません
    </div>

    <div class="schedule-sub">
      今日も元気にお過ごしください
    </div>

  </div>

  <button
  id="btn-genki"
  class="big-button green"
  onclick="sendData('btn-genki','正常','😊 元気です')">

  😊 元気です

  </button>

  <button
  id="btn-go"
  class="big-button blue"
  onclick="sendData('btn-go','外出','🏥 出発しました')">

  🏥 出発しました

  </button>

  <button
  id="btn-emergency"
  class="big-button red"
  onclick="emergencyAction()">

  🚨 緊急

  </button>

  <div class="result" id="result"></div>

  <div class="card">

    <div class="menu-title">
      地域と暮らし
    </div>

    <button
    class="big-button blue"
    onclick="location.href='news.html'">

    📰 4市情報

    </button>

    <button
    class="big-button orange"
    onclick="location.href='map.html'">

    🗺️ 行き先案内

    </button>

    <button
    class="big-button gray"
    onclick="location.href='family.html'">

    👨‍👩‍👧 家族確認

    </button>

  </div>

</div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbz-cMT63Wl9f9-WFM8R6lNsGK_aXx-kavrl0_uOjzJARzahG1j_9hmh-kyAodMGUCvP/exec';

function showToday(){

  const now = new Date();

  const week = [
    '日曜日',
    '月曜日',
    '火曜日',
    '水曜日',
    '木曜日',
    '金曜日',
    '土曜日'
  ];

  document.getElementById('todayDate').innerHTML =
    now.getFullYear() + '年 ' +
    (now.getMonth()+1) + '月 ' +
    now.getDate() + '日 ' +
    week[now.getDay()];

}

function clearChecks(){

  document.querySelectorAll('.big-button').forEach(btn=>{

    btn.classList.remove('checked');

    btn.innerHTML =
      btn.innerHTML.replace(' ✅','');

  });

}

function restoreLastButton(){

  const lastButton =
  localStorage.getItem('lastButton');

  if(!lastButton)return;

  const btn =
  document.getElementById(lastButton);

  if(!btn)return;

  btn.classList.add('checked');

  if(!btn.innerHTML.includes('✅')){

    btn.innerHTML =
      btn.innerHTML + ' ✅';

  }

}

async function sendData(
  buttonId,
  status,
  content
){

  try{

    await fetch(GAS_URL,{

      method:'POST',

      headers:{
        'Content-Type':'text/plain'
      },

      body:JSON.stringify({

        name:'山口さん',

        status:status,

        content:content

      }),

      keepalive:true

    });

    clearChecks();

    const btn =
    document.getElementById(buttonId);

    btn.classList.add('checked');

    if(!btn.innerHTML.includes('✅')){

      btn.innerHTML =
        btn.innerHTML + ' ✅';

    }

    localStorage.setItem(
      'lastButton',
      buttonId
    );

    document.getElementById('result').innerHTML =
      '送信しました';

  }catch(error){

    alert('通信エラー');

  }

}

async function emergencyAction(){

  await sendData(
    'btn-emergency',
    '緊急',
    '🚨 緊急です'
  );

  if(confirm('家族へ電話しますか？')){

    location.href =
      'tel:09012345678';

  }

}

showToday();

restoreLastButton();

</script>

</body>
</html>
