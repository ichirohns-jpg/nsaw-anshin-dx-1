<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

async function loadHistory(){

try{

const res =
await fetch(
GAS_URL +
"?action=records"
);

const json =
await res.json();

const data =
json.data || [];

let html = "";

data.slice(0,5).forEach(item=>{

html +=

(item.date || "") +
" " +
(item.status || "") +
"<br>";

});

document.getElementById(
"historyArea"
).innerHTML =
html || "履歴なし";

}catch(err){

document.getElementById(
"historyArea"
).innerHTML =
"取得失敗";

}

}

async function loadStatus(){

try{

const res =
await fetch(
GAS_URL +
"?action=scheduleList"
);

const json =
await res.json();

const data =
json.data || [];

let html = "";

data.slice(0,5).forEach(item=>{

html +=

(item.date || "") +
" " +
(item.time || "") +
" " +
(item.title || "") +
"<br>";

});

document.getElementById(
"statusArea"
).innerHTML =
html || "予定なし";

}catch(err){

document.getElementById(
"statusArea"
).innerHTML =
"取得失敗";

}

}

loadHistory();
loadStatus();

setInterval(
loadHistory,
60000
);

setInterval(
loadStatus,
60000
);

</script>
