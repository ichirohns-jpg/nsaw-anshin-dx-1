<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>あんしん生活ボタン</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:620px;
margin:0 auto;
padding:18px 14px 36px;
}

.card{
background:#fff;
border-radius:28px;
padding:24px 20px;
box-shadow:0 8px 22px rgba(0,0,0,.10);
margin-bottom:18px;
}

.date{
font-size:42px;
font-weight:900;
text-align:center;
color:#1976d2;
}

.clock{
font-size:64px;
font-weight:900;
text-align:center;
color:#111;
margin-top:8px;
}

.name{
font-size:42px;
font-weight:900;
text-align:center;
margin-top:18px;
}

.area{
font-size:28px;
font-weight:900;
text-align:center;
margin-top:8px;
color:#555;
}

.status{
font-size:38px;
font-weight:900;
text-align:center;
margin-top:18px;
padding:20px;
border-radius:22px;
background:#e8f5e9;
color:#1b5e20;
border:4px solid #81c784;
}

.planCard{
background:#fff8e1;
border:3px solid #ffd54f;
border-radius:22px;
padding:18px;
margin-top:18px;
text-align:center;
}

.gomiCard{
background:#e8f5e9;
border:3px solid #81c784;
border-radius:22px;
padding:18px;
margin-top:18px;
text-align:center;
}

.cardTitle{
font-size:30px;
font-weight:900;
margin-bottom:10px;
}

.cardValue{
font-size:24px;
font-weight:900;
line-height:1.7;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-top:18px;
}

.big-btn{
display:flex;
align-items:center;
justify-content:center;
min-height:112px;
text-decoration:none;
border-radius:24px;
padding:16px 10px;
font-size:23px;
font-weight:900;
line-height:1.35;
text-align:center;
color:#fff;
box-shadow:0 7px 14px rgba(0,0,0,.14);
}

.full{
grid-column:1 / 3;
min-height:104px;
font-size:26px;
}

.orange{background:#f39c12}
.blue{background:#1976d2}
.green{background:#2eaf66}
.red{background:#e53935}
.gray{background:#607d8b}

.qrbox{
text-align:center;
margin-top:12px;
}

.qrbox img{
width:190px;
height:190px;
border-radius:12px;
background:#fff;
}

.small{
font-size:20px;
font-weight:900;
margin-bottom:10px;
}

.note{
font-size:16px;
font-weight:800;
line-height:1.6;
color:#666;
text-align:center;
margin-top:10px;
}

.setting{
display:block;
width:100%;
text-decoration:none;
border-radius:22px;
padding:22px;
font-size:24px;
font-weight:900;
text-align:center;
color:#fff;
background:#607d8b;
box-shadow:0 7px 14px rgba(0,0,0,.14);
}

.family-link{
display:block;
width:100%;
text-decoration:none;
border-radius:22px;
padding:20px;
font-size:22px;
font-weight:900;
text-align:center;
color:#fff;
background:#7e57c2;
margin-top:16px;
box-shadow:0 7px 14px rgba(0,0,0,.14);
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<div class="date" id="todayDate">日付</div>

<div class="clock" id="clock">00:00</div>

<div class="name" id="name">山口さん</div>

<div class="area" id="area">志木市</div>

<div class="status" id="status">
😊 元気です
</div>

<div class="planCard">

<div class="cardTitle">
📅 今日の予定
</div>

<div class="cardValue" id="todayPlan">
予定はありません
</div>

</div>

<div class="gomiCard">

<div class="cardTitle">
🗑 次のゴミの日
</div>

<div class="cardValue" id="nextGomi">
確認中...
</div>

</div>

</div>
