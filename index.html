<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>QRコード管理</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
color:#1f2d3d;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.title{
font-size:36px;
font-weight:900;
}

.card{
background:#fff;
border-radius:30px;
padding:24px;
margin-bottom:18px;
text-align:center;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.input{
width:100%;
padding:18px;
font-size:22px;
border:2px solid #cbd5e1;
border-radius:18px;
margin-bottom:14px;
}

.qr{
width:280px;
height:280px;
margin:auto;
display:block;
}

.name{
font-size:28px;
font-weight:900;
margin-top:18px;
}

.url{
font-size:16px;
word-break:break-all;
margin-top:12px;
line-height:1.6;
}

.btn{
display:block;
width:100%;
padding:22px;
border:none;
border-radius:20px;
margin-top:12px;
text-decoration:none;
text-align:center;
font-size:24px;
font-weight:900;
color:#fff;
cursor:pointer;
}

.blue{
background:#2563eb;
}

.green{
background:#16a34a;
}

.gray{
background:#475569;
}

.orange{
background:#ea580c;
}

</style>

</head>

<body>

<div class="header">

<div class="title">
📱 QRコード管理
</div>

</div>

<div class="card">

<input
id="userId"
class="input"
placeholder="001">

<button
class="btn orange"
onclick="createQR()">
QR作成
</button>

</div>

<div class="card">

<img
id="qr"
class="qr"
src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/app.html?id=001">

<div
id="userName"
class="name">
利用者001
</div>

<div
id="urlText"
class="url">
https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/app.html?id=001
</div>

<a href="app.html" class="btn blue">
😊 本人ページ
</a>

<a href="family.html" class="btn green">
👪 家族ページ
</a>

<a href="history.html" class="btn gray">
📋 見守り履歴
</a>

<a href="index.html" class="btn gray">
🏠 トップへ戻る
</a>

</div>

<script>

function createQR(){

const id =
document.getElementById('userId').value || '001';

const url =
'https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/app.html?id=' + id;

document.getElementById('qr').src =
'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' +
encodeURIComponent(url);

document.getElementById('userName').innerHTML =
'利用者' + id;

document.getElementById('urlText').innerHTML =
url;

}

</script>

</body>
</html>
