<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>あんしん生活ボタン</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:620px;
margin:0 auto;
padding:18px 14px 36px;
}

.card{
background:#fff;
border-radius:28px;
padding:24px 20px;
box-shadow:0 8px 22px rgba(0,0,0,.10);
margin-bottom:18px;
}

.date{
font-size:28px;
font-weight:900;
text-align:center;
color:#1976d2;
}

.clock{
font-size:44px;
font-weight:900;
text-align:center;
color:#111;
margin-top:8px;
}

.name{
font-size:34px;
font-weight:900;
text-align:center;
margin-top:18px;
}

.area{
font-size:23px;
font-weight:900;
text-align:center;
margin-top:8px;
color:#555;
}

.status{
font-size:28px;
font-weight:900;
text-align:center;
margin-top:18px;
padding:18px;
border-radius:22px;
background:#e8f5e9;
color:#1b5e20;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-top:18px;
}

.big-btn{
display:flex;
align-items:center;
justify-content:center;
min-height:112px;
text-decoration:none;
border-radius:24px;
padding:16px 10px;
font-size:23px;
font-weight:900;
line-height:1.35;
text-align:center;
color:#fff;
box-shadow:0 7px 14px rgba(0,0,0,.14);
}

.full{
grid-column:1 / 3;
min-height:104px;
font-size:26px;
}

.orange{background:#f39c12}
.blue{background:#1976d2}
.green{background:#2eaf66}
.red{background:#e53935}
.purple{background:#7e57c2}
.gray{background:#607d8b}

.qrbox{
text-align:center;
margin-top:12px;
}

.qrbox img{
width:190px;
height:190px;
border-radius:12px;
background:#fff;
}

.small{
font-size:20px;
font-weight:900;
margin-bottom:10px;
}

.note{
font-size:16px;
font-weight:800;
line-height:1.6;
color:#666;
text-align:center;
margin-top:10px;
}

.setting{
display:block;
width:100%;
text-decoration:none;
border-radius:22px;
padding:22px;
font-size:24px;
font-weight:900;
text-align:center;
color:#fff;
background:#607d8b;
box-shadow:0 7px 14px rgba(0,0,0,.14);
}

.family-link{
display:block;
width:100%;
text-decoration:none;
border-radius:22px;
padding:20px;
font-size:22px;
font-weight:900;
text-align:center;
color:#fff;
background:#7e57c2;
margin-top:16px;
box-shadow:0 7px 14px rgba(0,0,0,.14);
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <div class="date" id="todayDate">日付</div>
    <div class="clock" id="clock">00:00</div>

    <div class="name" id="name">山口さん</div>

    <div class="area" id="area">志木市</div>

    <div class="status" id="status">
      まだ確認されていません
    </div>

  </div>

  <div class="grid">

    <a class="big-btn orange full" href="kusuri.html">
      💊<br>お薬・元気だよ
    </a>

    <a class="big-btn blue" href="yotei.html">
      📅<br>今日の予定
    </a>

    <a class="big-btn green" href="news.html">
      📰<br>まちのニュース
    </a>

    <a class="big-btn red" href="map.html">
      🗺<br>病院・避難所
    </a>

    <a class="big-btn green" href="gomi.html">
      🗑<br>ゴミの日
    </a>

  </div>

  <div class="card" style="margin-top:18px;">

    <div class="qrbox">
      <div class="small">家族・支援者ページ</div>
      <img id="familyQr" alt="家族ページQR">
      <div class="note">
        家族にこのQRコードを見せます。<br>
        状態・薬・現在地を確認できます。
      </div>
    </div>

    <a class="family-link" id="familyBtn">
      👨‍👩‍👧 家族ページを開く
    </a>

  </div>

  <a class="setting" href="setting.html">
    ⚙ 設定を開く
  </a>

</div>

<script>
const userName = localStorage.getItem("name") || "山口さん";
const city = localStorage.getItem("city") || "志木市";
const area = localStorage.getItem("area") || "";
const id = localStorage.getItem("personId") || "yamaguchi";

document.getElementById("name").innerHTML = userName;

document.getElementById("area").innerHTML =
  city + (area ? " " + area : "");

document.getElementById("status").innerHTML =
  localStorage.getItem("status") || "まだ確認されていません";

const base =
  location.origin +
  location.pathname.replace("index.html","");

const family =
  base + "family.html?id=" + encodeURIComponent(id);

document.getElementById("familyQr").src =
  "https://api.qrserver.com/v1/create-qr-code/?size=190x190&data=" +
  encodeURIComponent(family);

document.getElementById("familyBtn").href = family;

function updateClock(){
  const now = new Date();

  const week = ["日","月","火","水","木","金","土"];

  document.getElementById("todayDate").innerHTML =
    now.getFullYear() + "年" +
    (now.getMonth()+1) + "月" +
    now.getDate() + "日" +
    "（" + week[now.getDay()] + "）";

  const h = String(now.getHours()).padStart(2,"0");
  const m = String(now.getMinutes()).padStart(2,"0");

  document.getElementById("clock").innerHTML =
    h + ":" + m;
}

updateClock();
setInterval(updateClock,1000);
</script>

</body>
</html>
