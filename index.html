<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>お薬・元気確認</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#fdfbf7;
color:#333;
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
}
.app-box{
max-width:520px;
margin:1.5rem auto;
padding:0 1rem;
}
.badge{
display:inline-block;
background:#777;
color:#fff;
border-radius:999px;
padding:8px 14px;
font-size:15px;
}
.card{
background:#fff;
border-radius:18px;
padding:24px;
box-shadow:0 6px 14px rgba(0,0,0,.06);
}
.title{
font-size:28px;
font-weight:900;
text-align:center;
margin:0 0 22px;
}
.menu-btn{
display:block;
width:100%;
border:none;
border-radius:14px;
padding:22px 18px;
margin-bottom:16px;
font-size:23px;
font-weight:900;
color:#fff;
text-align:left;
}
.btn-orange{background:#e96d42;}
.btn-blue{background:#4a90e2;}
.btn-green{background:#4ebfa5;}
.btn-red{background:#e05d5d;}
.status{
background:#f7f9fa;
border:1px dashed #ccc;
border-radius:14px;
padding:16px;
text-align:center;
margin-top:10px;
}
.status-title{
font-size:18px;
font-weight:900;
color:#666;
}
.status-value{
font-size:28px;
font-weight:900;
color:#e96d42;
margin-top:8px;
}
.back{
display:block;
text-align:center;
margin-top:20px;
font-weight:900;
color:#555;
text-decoration:none;
}
</style>
</head>
<body>
<div class="app-box">
<div style="text-align:center;margin-bottom:14px">
<span class="badge">志木市 太郎 さんのページ</span>
</div>
<div class="card">
<div class="title">
お薬・元気確認
</div>
<button class="menu-btn btn-green"
onclick="sendData('😊 元気です')">
😊 元気です
</button>
<button class="menu-btn btn-blue"
onclick="sendData('☀ 朝の薬を飲みました')">
☀ 朝の薬
</button>
<button class="menu-btn btn-blue"
onclick="sendData('🌤 昼の薬を飲みました')">
🌤 昼の薬
</button>
<button class="menu-btn btn-blue"
onclick="sendData('🌙 夜の薬を飲みました')">
🌙 夜の薬
</button>
<button class="menu-btn btn-orange"
onclick="sendData('😓 少し困っています')">
😓 少し困っています
</button>
<button class="menu-btn btn-red"
onclick="sendData('🚨 助けてください')">
🚨 助けてください
</button>
<div class="status">
<div class="status-title">
本日の状態
</div>
<div class="status-value" id="statusText">
未送信
</div>
</div>
<a href="index.html" class="back">
トップへ戻る
</a>
</div>
</div>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbyQKsVKLgbkInDJwG39B00erucU_0nROI4QjLo30kDlBwiNfb9frcan5LDkEz4Ta9SA/exec';
async function sendData(text){
document.getElementById('statusText').innerText=text;
try{
await fetch(GAS_URL,{
method:'POST',
headers:{
'Content-Type':'text/plain'
},
body:JSON.stringify({
name:'志木市 太郎',
content:text,
time:new Date().toLocaleString('ja-JP')
}),
keepalive:true
});
}catch(e){}
}
</script>
</body>
</html>
