<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>見守りDX｜HOME</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
background:
linear-gradient(
180deg,
#000000 0%,
#0a1220 45%,
#000000 100%
);
color:#fff;
min-height:100vh;
}

.banner{
height:320px;
position:relative;
overflow:hidden;
}

.banner img{
width:100%;
height:100%;
object-fit:cover;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.55);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.overlay h1{
font-size:48px;
font-weight:900;
letter-spacing:6px;
}

.overlay p{
margin-top:12px;
font-size:18px;
opacity:.9;
}

.wrap{
max-width:760px;
margin:auto;
padding:20px;
}

.section{
margin-bottom:28px;
}

.section-title{
font-size:14px;
letter-spacing:4px;
opacity:.6;
margin-bottom:12px;
padding-left:4px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:18px;
margin-bottom:16px;
box-shadow:
0 10px 30px rgba(0,0,0,.35);
}

.main-btn{
width:100%;
padding:34px;
border:none;
border-radius:24px;
font-size:34px;
font-weight:900;
cursor:pointer;
color:#fff;
}

.sub-btn{
width:100%;
padding:24px;
border:none;
border-radius:20px;
font-size:26px;
font-weight:900;
cursor:pointer;
color:#fff;
}

.info-btn{
width:100%;
padding:20px;
border:none;
border-radius:18px;
font-size:22px;
font-weight:900;
cursor:pointer;
color:#fff;
margin-bottom:12px;
}

.blue{
background:
linear-gradient(
135deg,
#1565c0,
#42a5f5
);
}

.green{
background:
linear-gradient(
135deg,
#00c853,
#00e676
);
}

.gray{
background:
linear-gradient(
135deg,
#37474f,
#607d8b
);
}

.dark{
background:
linear-gradient(
135deg,
#1c2331,
#334155
);
}

a{
text-decoration:none;
}

.status{
text-align:center;
padding:10px;
font-size:15px;
opacity:.8;
}

.news-card{
background:rgba(255,255,255,.06);
border-radius:20px;
padding:16px;
margin-bottom:12px;
}

.news-title{
font-size:18px;
font-weight:900;
margin-bottom:6px;
}

.news-text{
font-size:14px;
opacity:.85;
line-height:1.6;
}

.top-btn{
width:100%;
padding:20px;
border:none;
border-radius:20px;
font-size:22px;
font-weight:900;
cursor:pointer;
color:#fff;
background:
linear-gradient(
135deg,
#673ab7,
#9575cd
);
}

.footer{
text-align:center;
padding:30px 10px;
opacity:.6;
font-size:12px;
}

</style>
</head>

<body>

<div class="banner">

<img src="top.jpg">

<div class="overlay">

<h1>
見守りDX
</h1>

<p>
REGIONAL LIFE OS
</p>

</div>

</div>

<div class="wrap">

<div class="section">

<div class="status">
最優先機能
</div>

<div class="card">

<a href="app.html">

<button class="main-btn green">
元気です
</button>

</a>

</div>

</div>

<div class="section">

<div class="status">
家族・支援者
</div>

<div class="card">

<a href="family.html">

<button class="sub-btn blue">
家族確認
</button>

</a>

</div>

</div>

<div class="section">

<div class="section-title">
地域情報
</div>

<div class="card">

<a href="radio.html">
<button class="info-btn dark">
地域ラジオ
</button>
</a>

<a href="kawaraban.html">
<button class="info-btn dark">
４市瓦版
</button>
</a>

<a href="video.html">
<button class="info-btn dark">
お楽しみ動画
</button>
</a>

</div>

</div>

<div class="section">

<div class="section-title">
生活支援
</div>

<div class="card">

<a href="map.html">
<button class="info-btn gray">
地域マップ
</button>
</a>

<a href="schedule.html">
<button class="info-btn gray">
スケジュール
</button>
</a>

</div>

</div>

<div class="section">

<div class="section-title">
最新情報
</div>

<div class="news-card">

<div class="news-title">
地域ラジオ
</div>

<div class="news-text">
地域の最新情報を毎日配信
</div>

</div>

<div class="news-card">

<div class="news-title">
４市瓦版
</div>

<div class="news-text">
志木・新座・朝霞・和光の最新情報
</div>

</div>

<div class="news-card">

<div class="news-title">
見守りDX
</div>

<div class="news-text">
家族と地域をつなぐ見守りシステム
</div>

</div>

</div>

<div class="card">

<button
class="top-btn"
onclick="window.scrollTo({top:0,behavior:'smooth'})">
先頭へ戻る
</button>

</div>

<div class="footer">
NSAW 地域OS / 見守りDX
</div>

</div>

</body>
</html>
