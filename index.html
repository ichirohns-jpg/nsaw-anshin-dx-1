<script>

const weekNames =
['日','月','火','水','木','金','土'];

const now =
new Date();

document.getElementById(
'todayDate'
).innerHTML =

'📅 ' +
now.getFullYear() + '年' +
(now.getMonth()+1) + '月' +
now.getDate() + '日（' +
weekNames[now.getDay()] +
'）';

const GOMI_SHEET_ID =
'149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc';

function getVal(cell){

if(!cell)return'';

return cell.f || cell.v || '';

}

function loadTopGarbage(){

const city =
localStorage.getItem(
'city'
) || '';

const area =
localStorage.getItem(
'area'
) ||
localStorage.getItem(
'areaCode'
) ||
'';

if(
!city ||
!area
){
return;
}

fetch(

'https://docs.google.com/spreadsheets/d/' +

GOMI_SHEET_ID +

'/gviz/tq?sheet=' +

encodeURIComponent(
'ゴミ収集'
) +

'&tqx=out:json'

)

.then(r=>r.text())

.then(text=>{

const json =

JSON.parse(

text.substring(
47,
text.length-2
)

);

const rows =
json.table.rows || [];

const today =
weekNames[
new Date().getDay()
];

let result = '';

rows.forEach(row=>{

const rowCity =
getVal(
row.c[0]
);

const rowArea =
getVal(
row.c[1]
);

const week =
getVal(
row.c[2]
);

const garbage =
getVal(
row.c[3]
);

const memo =
getVal(
row.c[4]
);

if(
rowCity !== city
){
return;
}

if(
rowArea !== area
){
return;
}

if(
week.indexOf(
today
) > -1
){

result +=

'🗑 ' +

garbage +

'<br>' +

memo +

'<br><br>';

}

});

document.getElementById(
'todayGarbage'
).innerHTML =

result
?

result

:

'🗑 本日の収集はありません';

})

.catch(()=>{

document.getElementById(
'todayGarbage'
).innerHTML =

'🗑 ゴミ情報取得失敗';

});

}

loadTopGarbage();

</script>

</body>
</html>
