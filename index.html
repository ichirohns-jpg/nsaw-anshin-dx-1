<div class="snsBar">

<button
class="snsBtn lineBtn"
onclick="shareLine()">
LINE
</button>

<button
class="snsBtn fbBtn"
onclick="shareFacebook()">
Facebook
</button>

<button
class="snsBtn xBtn"
onclick="shareX()">
X
</button>

<button
class="snsBtn copyBtn"
onclick="copyLink()">
コピー
</button>

</div>

<script>

function shareLine(){

location.href =

"https://line.me/R/msg/text/?"

+

encodeURIComponent(
location.href
);

}

function shareFacebook(){

window.open(

"https://www.facebook.com/sharer/sharer.php?u="

+

encodeURIComponent(
location.href
)

);

}

function shareX(){

window.open(

"https://twitter.com/intent/tweet?url="

+

encodeURIComponent(
location.href
)

);

}

function copyLink(){

navigator.clipboard.writeText(
location.href
);

alert(
"リンクをコピーしました"
);

}

</script>
