<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NSAW あんしん見守りDX</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:14px;
}

.header{
background:linear-gradient(
135deg,
#0f172a,
#1e293b
);
padding:28px;
border-radius:36px;
margin-bottom:20px;
box-shadow:0 15px 40px rgba(0,0,0,.18);
text-align:center;
min-height:140px;
}

.nsaw{
font-size:18px;
letter-spacing:10px;
font-weight:700;
color:#94a3b8;
margin-bottom:12px;
}

.mainTitle{
font-size:30px;
font-weight:900;
color:#ffffff;
line-height:1.3;
}

.subTitle{
font-size:14px;
color:#cbd5e1;
margin-top:10px;
}

.statusCard{
background:#ffffff;
border-radius:30px;
padding:22px;
margin-bottom:18px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.statusTitle{
font-size:28px;
font-weight:900;
margin-bottom:16px;
color:#111827;
}

.statusBox{
background:#f8fafc;
border-left:8px solid #2563eb;
border-radius:20px;
padding:20px;
font-size:24px;
font-weight:900;
line-height:1.8;
margin-bottom:12px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-bottom:20px;
}

.btn{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
height:130px;
border-radius:30px;
text-decoration:none;
color:#fff;
font-size:42px;
font-weight:900;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.btn div{
font-size:22px;
margin-top:10px;
}

.green{
background:linear-gradient(
135deg,
#16a34a,
#15803d
);
}

.red{
background:linear-gradient(
135deg,
#ef4444,
#dc2626
);
}

.blue{
background:linear-gradient(
135deg,
#2563eb,
#1d4ed8
);
}

.orange{
background:linear-gradient(
135deg,
#f97316,
#ea580c
);
}

.purple{
background:linear-gradient(
135deg,
#8b5cf6,
#7c3aed
);
}

.card{
background:#fff;
border-radius:30px;
padding:20px;
margin-bottom:18px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.sectionTitle{
font-size:26px;
font-weight:900;
margin-bottom:12px;
}

.link{
display:block;
padding:18px;
font-size:22px;
font-weight:900;
text-decoration:none;
color:#111827;
border-bottom:1px solid #e5e7eb;
}

.link:last-child{
border-bottom:none;
}

</style>

</head>

<body>

<div class="header">

<div class="nsaw">
NSAW
</div>

<div class="mainTitle">
あんしん見守りDX
</div>

<div class="subTitle">
家族と地域をつなぐ生活支援システム
</div>

</div>

<div class="statusCard">

<div class="statusTitle">
📋 今日のご案内
</div>

<div
id="statusSchedule"
class="statusBox">

📅 予定なし

</div>

<div
id="statusMedicine"
class="statusBox">

💊 服薬記録なし

</div>

<div
id="statusGPS"
class="statusBox">

📍 位置情報なし

</div>

</div>

<div class="grid">

<a href="genki.html" class="btn green">
😊
<div>元気です</div>
</a>

<a href="sos.html" class="btn red">
🚨
<div>SOS</div>
</a>

<a href="home.html" class="btn blue">
🏠
<div>帰宅しました</div>
</a>

<a href="medicine.html" class="btn orange">
💊
<div>服薬確認</div>
</a>

<a href="gps.html" class="btn blue">
📍
<div>現在地</div>
</a>

<a href="schedule.html" class="btn orange">
📅
<div>予定</div>
</a>

<a href="garbage.html" class="btn green">
🗑
<div>ゴミ</div>
</a>

<a href="ai.html" class="btn purple">
🎤
<div>AIに聞く</div>
</a>

<a href="news.html" class="btn blue">
📰
<div>地域情報</div>
</a>

<a href="emergency.html" class="btn red">
🚑
<div>緊急連絡</div>
</a>

</div>

<script>

const medicineData =
JSON.parse(
localStorage.getItem(
'medicineStatus'
) || '{}'
);

const scheduleData =
JSON.parse(
localStorage.getItem(
'lastSchedule'
) || 'null'
);

const lastGPS =
JSON.parse(
localStorage.getItem(
'lastGPS'
) || 'null'
);

if(scheduleData){

document.getElementById(
'statusSchedule'
).innerHTML =

'📅 ' +
(scheduleData.title || '') +
'<br>' +
(scheduleData.date || '');

}

if(medicineData.time){

document.getElementById(
'statusMedicine'
).innerHTML =

'💊 最終服薬<br>' +
medicineData.time;

}

if(lastGPS){

document.getElementById(
'statusGPS'
).innerHTML =

'📍 最終位置取得<br>' +
(lastGPS.time || '');

}

</script>

</body>
</html>
