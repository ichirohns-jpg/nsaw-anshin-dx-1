<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>利用者登録</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
padding:15px;
color:#1f2d3d;
}

.wrap{
max-width:800px;
margin:auto;
}

.header{
background:linear-gradient(135deg,#1976d2,#42a5f5);
color:#fff;
padding:25px;
border-radius:24px;
text-align:center;
font-size:34px;
font-weight:900;
margin-bottom:16px;
}

.card{
background:#fff;
border-radius:24px;
padding:20px;
margin-bottom:16px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.title{
font-size:24px;
font-weight:900;
margin-bottom:15px;
}

label{
display:block;
font-size:18px;
font-weight:900;
margin-bottom:8px;
}

input,
select{
width:100%;
padding:18px;
border:1px solid #ccc;
border-radius:14px;
font-size:18px;
margin-bottom:15px;
}

button{
width:100%;
border:none;
border-radius:18px;
padding:22px;
font-size:24px;
font-weight:900;
cursor:pointer;
margin-bottom:12px;
}

.save{
background:#00c853;
color:#fff;
}

.back{
background:#607d8b;
color:#fff;
}

.result{
font-size:20px;
font-weight:900;
text-align:center;
padding:15px;
}

</style>

</head>

<body>

<div class="wrap">

<div class="header">
👤 利用者登録
</div>

<div class="card">

<div class="title">
基本情報
</div>

<label>
お名前
</label>

<input
type="text"
id="userName"
placeholder="例：山田太郎">

<label>
市
</label>

<select id="userCity">

<option value="">
選択してください
</option>

<option value="志木市">
志木市
</option>

<option value="朝霞市">
朝霞市
</option>

<option value="新座市">
新座市
</option>

<option value="和光市">
和光市
</option>

</select>

<label>
地区
</label>

<select id="userArea">

<option value="">
先に市を選択してください
</option>

</select>

<button
class="save"
onclick="saveUser()">
💾 保存
</button>

<div
id="result"
class="result">
未登録
</div>

</div>

<label>
電話番号
</label>

<input
type="tel"
id="userPhone"
placeholder="09012345678">

<label>
家族連絡先
</label>

<input
type="text"
id="familyName"
placeholder="家族名">

<label>
家族電話番号
</label>

<input
type="tel"
id="familyPhone"
placeholder="09012345678">

<button
class="back"
onclick="history.back()">
戻る
</button>

</div>

</div>

<script>

const areaData = {

"志木市":[
"本町",
"柏町",
"幸町",
"館",
"宗岡",
"上宗岡",
"中宗岡1丁目",
"中宗岡2丁目",
"中宗岡3丁目",
"中宗岡4丁目",
"中宗岡5丁目",
"下宗岡1丁目",
"下宗岡2丁目",
"下宗岡3丁目",
"下宗岡4丁目"
],

"朝霞市":[
"朝志ヶ丘",
"北原",
"岡",
"幸町",
"栄町",
"泉水",
"田島",
"仲町",
"西原",
"西弁財",
"根岸台",
"浜崎",
"東弁財",
"膝折町",
"本町",
"溝沼",
"三原",
"宮戸"
],

"新座市":[
"池田",
"石神",
"大和田",
"片山",
"北野",
"栗原",
"栄",
"新堀",
"菅沢",
"道場",
"東北",
"野火止",
"馬場",
"東",
"堀ノ内",
"本多",
"畑中",
"新塚",
"柳瀬",
"中野",
"西堀",
"新座",
"野寺"
],

"和光市":[
"白子",
"下新倉",
"中央",
"新倉",
"南",
"丸山台",
"本町",
"広沢",
"諏訪"
]

};

document.getElementById(
"userCity"
).addEventListener(
"change",
function(){

const city =
this.value;

const area =
document.getElementById(
"userArea"
);

area.innerHTML = "";

(areaData[city] || [])
.forEach(item=>{

const op =
document.createElement(
"option"
);

op.value = item;
op.textContent = item;

area.appendChild(op);

});

}
);

function saveUser(){

localStorage.setItem(
"userName",
document.getElementById(
"userName"
).value
);

localStorage.setItem(
"userCity",
document.getElementById(
"userCity"
).value
);

localStorage.setItem(
"userArea",
document.getElementById(
"userArea"
).value
);

localStorage.setItem(
"userPhone",
document.getElementById(
"userPhone"
).value
);

localStorage.setItem(
"familyName",
document.getElementById(
"familyName"
).value
);

localStorage.setItem(
"familyPhone",
document.getElementById(
"familyPhone"
).value
);

document.getElementById(
"result"
).innerHTML =
"✅ 保存しました";

}

window.onload=function(){

document.getElementById(
"userName"
).value =
localStorage.getItem(
"userName"
) || "";

document.getElementById(
"userPhone"
).value =
localStorage.getItem(
"userPhone"
) || "";

document.getElementById(
"familyName"
).value =
localStorage.getItem(
"familyName"
) || "";

document.getElementById(
"familyPhone"
).value =
localStorage.getItem(
"familyPhone"
) || "";

};

</script>

</body>
</html>
