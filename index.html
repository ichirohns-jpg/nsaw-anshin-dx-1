<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
background:linear-gradient(180deg,#000000 0%,#08111d 50%,#000000 100%);
color:#fff;
min-height:100vh;
}

.banner{
height:260px;
overflow:hidden;
position:relative;
}

.banner img{
width:100%;
height:100%;
object-fit:cover;
}

.banner:after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,.25);
}

.wrap{
max-width:800px;
margin:auto;
padding:16px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:20px;
margin-bottom:16px;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
margin-bottom:20px;
}

.dashboard{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
}

.box{
padding:18px;
border-radius:20px;
text-align:center;
}

.boxNum{
font-size:42px;
font-weight:900;
margin-bottom:6px;
}

.green{background:rgba(0,200,83,.15);}
.yellow{background:rgba(255,193,7,.15);}
.red{background:rgba(244,67,54,.15);}
.blue{background:rgba(33,150,243,.15);}
.purple{background:rgba(156,39,176,.15);}
.teal{background:rgba(0,150,136,.15);}

.section{
font-size:14px;
letter-spacing:4px;
opacity:.7;
margin-bottom:12px;
}

button{
width:100%;
border:none;
border-radius:20px;
padding:24px;
font-size:24px;
font-weight:900;
color:#fff;
cursor:pointer;
margin-bottom:12px;
}

.btn-green{
background:linear-gradient(135deg,#00c853,#00e676);
}

.btn-blue{
background:linear-gradient(135deg,#00a3c4,#00d4ff);
}

.btn-orange{
background:linear-gradient(135deg,#ff9800,#ffb74d);
}

.btn-red{
background:linear-gradient(135deg,#c62828,#ef5350);
}

.btn-gray{
background:linear-gradient(135deg,#455a64,#607d8b);
}

.linkBox{
display:block;
width:100%;
border-radius:20px;
padding:24px;
font-size:24px;
font-weight:900;
color:#fff;
text-decoration:none;
text-align:center;
margin-bottom:12px;
background:linear-gradient(135deg,#455a64,#607d8b);
}

.linkBlue{
background:linear-gradient(135deg,#00a3c4,#00d4ff);
}

.linkGreen{
background:linear-gradient(135deg,#00c853,#00e676);
}

.linkOrange{
background:linear-gradient(135deg,#ff9800,#ffb74d);
}

</style>
</head>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

async function loadDashboard(){

try{

const res =
await fetch(
GAS_URL +
"?action=dashboard"
);

const json =
await res.json();

const d =
json.data || {};

document.getElementById("genkiCount").innerHTML = d.genki || 0;
document.getElementById("waitCount").innerHTML = d.wait || 0;
document.getElementById("emgCount").innerHTML = d.emergency || 0;
document.getElementById("scheduleCount").innerHTML = d.schedule || 0;
document.getElementById("medicineCount").innerHTML = d.medicine || 0;
document.getElementById("mapCount").innerHTML = d.location || 0;

}catch(err){

console.log(err);

}

}

loadDashboard();

setInterval(
loadDashboard,
60000
);

</script>
