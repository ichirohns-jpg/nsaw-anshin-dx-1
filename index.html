<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>薬がない</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
}

.header{
background:linear-gradient(135deg,#dc2626,#b91c1c);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:#fff;
padding:24px;
border-radius:24px;
margin-bottom:16px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.label{
font-size:22px;
font-weight:900;
margin-bottom:8px;
}

.select,
.textarea{
width:100%;
padding:16px;
border:2px solid #e5e7eb;
border-radius:16px;
font-size:20px;
margin-bottom:16px;
}

.textarea{
height:120px;
resize:none;
}

.sendBtn{
width:100%;
border:none;
background:#dc2626;
color:#fff;
padding:28px;
border-radius:24px;
font-size:30px;
font-weight:900;
}

.status{
margin-top:20px;
font-size:22px;
font-weight:900;
line-height:1.8;
}

.home{
display:block;
background:#475569;
color:#fff;
text-decoration:none;
padding:20px;
border-radius:20px;
text-align:center;
font-size:22px;
font-weight:900;
}

</style>

</head>

<body>

<div class="header">
<h1>💊 薬がない</h1>
</div>

<div class="card">

<div class="label">
薬の種類
</div>

<select
id="medicineType"
class="select">

<option>朝の薬</option>
<option>昼の薬</option>
<option>夕方の薬</option>
<option>寝る前の薬</option>
<option>その他</option>

</select>

<div class="label">
内容
</div>

<textarea
id="memo"
class="textarea"
placeholder="薬がなくなった・残り何日分など">
</textarea>

<button
class="sendBtn"
onclick="sendRequest()">

💊 薬がない

</button>

<div
id="statusArea"
class="status">

未送信

</div>

</div>

<a
href="index.html"
class="home">

🏠 トップへ戻る

</a>

<script>

function sendRequest(){

const type =
document.getElementById(
'medicineType'
).value;

const memo =
document.getElementById(
'memo'
).value;

const data = {

type:type,

memo:memo,

time:
new Date()
.toLocaleString(
'ja-JP'
)

};

localStorage.setItem(
'medicineRequest',
JSON.stringify(data)
);

document.getElementById(
'statusArea'
).innerHTML =

'送信済み<br><br>' +

data.time;

alert(
'薬がないを記録しました'
);

}

const last =
JSON.parse(
localStorage.getItem(
'medicineRequest'
) || 'null'
);

if(last){

document.getElementById(
'statusArea'
).innerHTML =

'送信済み<br><br>' +

last.time +

'<br><br>' +

last.type;

}

</script>

</body>
</html>
