<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>あんしん生活ボタン</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
color:#333;
}

.wrap{
max-width:560px;
margin:auto;
padding:16px;
}

.card{
background:#fff;
border-radius:26px;
padding:24px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
margin-bottom:18px;
}

.name{
font-size:34px;
font-weight:900;
color:#1976d2;
text-align:center;
}

.area{
font-size:22px;
font-weight:900;
text-align:center;
margin-top:10px;
color:#666;
}

.msg{
font-size:22px;
font-weight:900;
text-align:center;
margin-top:16px;
}

.btn{
display:block;
width:100%;
text-decoration:none;
border-radius:22px;
padding:26px;
font-size:30px;
font-weight:900;
text-align:center;
color:#fff;
margin-top:18px;
}

.orange{background:#f39c12}
.blue{background:#1976d2}
.green{background:#2eaf66}
.red{background:#e53935}

.qrbox{
text-align:center;
margin-top:20px;
}

.qrbox img{
width:180px;
height:180px;
}

.small{
font-size:18px;
font-weight:900;
margin-bottom:10px;
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<div class="name" id="name">
山口さん
</div>

<div class="area" id="area">
志木市
</div>

<div class="msg">
今日も一日あんしん
</div>

</div>

<a class="btn orange" href="kusuri.html">
💊 お薬・元気だよ
</a>

<a class="btn blue" href="yotei.html">
📅 今日の予定
</a>

<a class="btn green" href="news.html">
📰 まちのニュース
</a>

<a class="btn red" href="map.html">
🗺 病院・避難所
</a>

<div class="card">

<div class="qrbox">

<div class="small">
家族ページ
</div>

<img id="familyQr">

</div>

</div>

<a class="btn blue" href="setting.html">
⚙ 設定
</a>

</div>

<script>

document.getElementById("name").innerHTML=
localStorage.getItem("name")||"山口さん";

document.getElementById("area").innerHTML=
(localStorage.getItem("city")||"志木市")
+" "
+(localStorage.getItem("area")||"");

const id=
localStorage.getItem("personId")||"yamaguchi";

const family=
location.origin+
location.pathname.replace(
"index.html",
"family.html?id="+id
);

document.getElementById("familyQr").src=
"https://api.qrserver.com/v1/create-qr-code/?size=180x180&data="
+encodeURIComponent(family);

</script>

</body>
</html>
