<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地域あんしんホーム</title>

<style>
body{
  margin:0;
  font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  background:#f5f8ff;
}

.wrap{
  max-width:720px;
  margin:0 auto;
  padding:20px;
}

.header{
  background:linear-gradient(135deg,#2563eb,#60a5fa);
  color:#fff;
  padding:30px 20px;
  border-radius:22px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:26px;
}

.header p{
  margin-top:6px;
  font-size:13px;
  opacity:0.9;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:18px;
  margin-top:16px;
  box-shadow:0 6px 18px rgba(0,0,0,0.06);
}

.title{
  font-size:13px;
  color:#6b7c93;
  font-weight:700;
  margin-bottom:10px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.btn{
  border:none;
  border-radius:18px;
  padding:18px;
  font-size:15px;
  font-weight:800;
  color:#fff;
  cursor:pointer;
}

.green{background:#22c55e;}
.blue{background:#3b82f6;}
.orange{background:#f59e0b;}
.red{background:#ef4444;}

.footer{
  text-align:center;
  font-size:12px;
  color:#9aa7b2;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="header">
    <h1>地域あんしんホーム</h1>
    <p>志木・新座・朝霞・和光</p>
  </div>

  <div class="card">
    <div class="title">メニュー</div>

    <div class="grid">
      <button class="btn green" onclick="go('care.html')">🛟 見守り</button>
      <button class="btn blue" onclick="go('calendar.html')">📅 予定</button>
      <button class="btn orange" onclick="go('trash.html')">🗑 ゴミ</button>
      <button class="btn red" onclick="go('map.html')">📍 現在地</button>
    </div>
  </div>

  <div class="footer">
    地域DXシステム
  </div>

</div>

<script>
function go(page){
  window.location.href = page;
}
</script>

</body>
</html>
