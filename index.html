<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:560px;
margin:auto;
padding:14px;
}

.banner{
width:100%;
display:block;
border-radius:26px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.card{
background:#fff;
border-radius:28px;
padding:20px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.title{
font-size:38px;
font-weight:900;
text-align:center;
color:#1976d2;
}

.sub{
text-align:center;
font-size:16px;
color:#6b7785;
margin-top:6px;
margin-bottom:22px;
}

.bigBtn{
width:100%;
border:none;
border-radius:24px;
padding:22px;
font-size:28px;
font-weight:900;
margin-bottom:14px;
color:#fff;
cursor:pointer;
}

.bigBtn:active{
transform:scale(.97);
}

.green{background:#43a047;}
.orange{background:#fb8c00;}
.red{background:#e53935;}

.statusBox{
background:#f7fbff;
border-radius:22px;
padding:18px;
margin-top:16px;
box-shadow:0 4px 12px rgba(0,0,0,.06);
}

.statusTitle{
font-size:18px;
font-weight:900;
color:#1976d2;
margin-bottom:8px;
}

.statusText{
font-size:24px;
font-weight:900;
}

.timeBox{
margin-top:10px;
font-size:16px;
font-weight:700;
color:#666;
}

.infoBox{
background:#fff8e1;
border-radius:22px;
padding:18px;
margin-top:16px;
}

.infoTitle{
font-size:20px;
font-weight:900;
color:#ef6c00;
margin-bottom:10px;
}

.infoText{
font-size:19px;
font-weight:800;
line-height:1.7;
}

.weatherBox{
margin-top:16px;
background:#e3f2fd;
border-radius:22px;
padding:18px;
}

.weatherTitle{
font-size:18px;
font-weight:900;
color:#1565c0;
margin-bottom:8px;
}

.weatherText{
font-size:20px;
font-weight:900;
line-height:1.7;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-top:18px;
}

.menu{
background:#fff;
border-radius:22px;
padding:24px 10px;
text-align:center;
font-size:22px;
font-weight:900;
box-shadow:0 6px 18px rgba(0,0,0,.08);
cursor:pointer;
}

.menu:active{
transform:scale(.97);
}

.emergency{
background:#ffebee;
color:#c62828;
}

.footer{
display:flex;
justify-content:space-around;
margin-top:20px;
padding:18px 0;
background:#fff;
border-radius:22px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
font-size:14px;
font-weight:900;
color:#666;
}

.toast{
position:fixed;
left:50%;
bottom:30px;
transform:translateX(-50%);
background:#1976d2;
color:#fff;
padding:16px 24px;
border-radius:18px;
font-size:18px;
font-weight:900;
display:none;
z-index:9999;
box-shadow:0 6px 18px rgba(0,0,0,.2);
}

</style>

<div class="menu" onclick="location.href='medicine.html'">

<div id="toast" class="toast"></div>

<script>

window.onload=function(){

const savedStatus=localStorage.getItem("statusText");
const savedTime=localStorage.getItem("timeText");

if(savedStatus){
document.getElementById("statusText").innerText=savedStatus;
}

if(savedTime){
document.getElementById("timeText").innerText=savedTime;
}

};

function showToast(text){

const toast=document.getElementById("toast");

toast.innerText=text;

toast.style.display="block";

setTimeout(function(){
toast.style.display="none";
},2000);

}

function setStatus(text){

document.getElementById("statusText").innerText=text;

const now=new Date();

const time=
now.getFullYear()+"-"+
String(now.getMonth()+1).padStart(2,"0")+"-"+
String(now.getDate()).padStart(2,"0")+" "+
String(now.getHours()).padStart(2,"0")+":"+
String(now.getMinutes()).padStart(2,"0");

const timeText="最終更新："+time;

document.getElementById("timeText").innerText=timeText;

localStorage.setItem("statusText",text);
localStorage.setItem("timeText",timeText);

showToast(text+" を記録しました");

}

function callEmergency(){

if(confirm("119へ電話しますか？")){
window.location.href="tel:119";
}

}

</script>
