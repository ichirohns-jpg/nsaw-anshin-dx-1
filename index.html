<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>見守りDX｜HOME</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
background:
linear-gradient(
180deg,
#050505 0%,
#101827 50%,
#000000 100%
);
color:#fff;
min-height:100vh;
}

.banner{
width:100%;
height:280px;
overflow:hidden;
position:relative;
}

.banner img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.overlay{
position:absolute;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,.45);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.overlay h1{
font-size:42px;
font-weight:900;
letter-spacing:4px;
text-shadow:0 3px 10px rgba(0,0,0,.7);
}

.overlay p{
margin-top:10px;
font-size:16px;
opacity:.9;
}

.wrap{
max-width:760px;
margin:auto;
padding:18px;
}

.section-title{
font-size:26px;
font-weight:900;
margin:20px 0 15px;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.15);
border-radius:24px;
padding:16px;
margin-bottom:16px;
box-shadow:
0 8px 24px rgba(0,0,0,.35);
}

.menu-btn{
width:100%;
padding:24px;
border:none;
border-radius:20px;
font-size:24px;
font-weight:900;
cursor:pointer;
color:#fff;
}

.green{
background:
linear-gradient(135deg,#00c853,#00e676);
}

.blue{
background:
linear-gradient(135deg,#1565c0,#42a5f5);
}

.orange{
background:
linear-gradient(135deg,#ef6c00,#ff9800);
}

.purple{
background:
linear-gradient(135deg,#6a1b9a,#ab47bc);
}

.red{
background:
linear-gradient(135deg,#c62828,#ef5350);
}

.gray{
background:
linear-gradient(135deg,#37474f,#607d8b);
}

.gold{
background:
linear-gradient(135deg,#b8860b,#ffd54f);
color:#000;
}

.news{
display:flex;
gap:12px;
align-items:center;
}

.news img{
width:130px;
height:80px;
object-fit:cover;
border-radius:12px;
}

.news-title{
font-weight:900;
font-size:18px;
margin-bottom:4px;
}

.news-text{
font-size:14px;
opacity:.9;
}

a{
text-decoration:none;
}

.top-btn{
width:100%;
padding:20px;
border:none;
border-radius:20px;
font-size:22px;
font-weight:900;
cursor:pointer;
color:#fff;
background:
linear-gradient(
135deg,
#673ab7,
#9575cd
);
}

.footer{
text-align:center;
padding:30px 10px;
opacity:.7;
font-size:13px;
}

</style>
</head>

<body>

<div class="banner">

<img src="top.jpg">

<div class="overlay">

<h1>
見守りDX
</h1>

<p>
地域と家族をつなぐ安心システム
</p>

</div>

</div>

<div class="wrap">

<div class="section-title">

</div>

<div class="card">
<a href="app.html">
<button class="menu-btn green">
元気です・見守り送信
</button>
</a>
</div>

<div class="card">
<a href="family.html">
<button class="menu-btn gold">

</button>
</a>
</div>

<div class="card">
<a href="radio.html">
<button class="menu-btn blue">
地域ラジオ
</button>
</a>
</div>

<div class="card">
<a href="kawaraban.html">
<button class="menu-btn orange">
４市瓦版
</button>
</a>
</div>

<div class="card">
<a href="video.html">
<button class="menu-btn purple">
お楽しみ動画
</button>
</a>
</div>

<div class="card">
<a href="map.html">
<button class="menu-btn red">
地域マップ
</button>
</a>
</div>

<div class="card">
<a href="schedule.html">
<button class="menu-btn gray">
スケジュール
</button>
</a>
</div>

<div class="section-title">
最新情報
</div>

<div class="card">

<div class="news">

<img src="top.jpg">

<div>

<div class="news-title">
４市瓦版
</div>

<div class="news-text">
ここに最新の行政・地域情報を表示
</div>

</div>

</div>

</div>

<div class="card">

<div class="news">

<img src="top.jpg">

<div>

<div class="news-title">
地域ラジオ
</div>

<div class="news-text">
ここに最新ラジオ情報を表示
</div>

</div>

</div>

</div>

<div class="card">

<div class="news">

<img src="top.jpg">

<div>

<div class="news-title">
お楽しみ動画
</div>

<div class="news-text">
ここに最新動画情報を表示
</div>

</div>

</div>

</div>

<div class="card">

<button
class="top-btn"
onclick="window.scrollTo({top:0,behavior:'smooth'})">
先頭へ戻る
</button>

</div>

<div class="footer">
NSAW 地域DXシステム
</div>

</div>

</body>
</html>
