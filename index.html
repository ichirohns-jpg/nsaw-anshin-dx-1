<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>あんしん生活ボタン</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fdfbf7;color:#333;font-family:"Hiragino Sans","Yu Gothic",sans-serif;font-size:18px}
.app-box{max-width:520px;margin:1.5rem auto;padding:0 1rem}
.badge{display:inline-block;background:#777;color:#fff;border-radius:999px;padding:.45rem .8rem;font-size:15px}
.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 6px 14px rgba(0,0,0,.06)}
h1{font-size:26px;text-align:center;margin:0 0 22px;font-weight:900;color:#333}
.menu-btn{display:block;width:100%;border:0;border-radius:14px;color:#fff;padding:22px 18px;margin-bottom:16px;font-size:23px;font-weight:900;text-align:left;box-shadow:0 4px 8px rgba(0,0,0,.08)}
.btn-orange{background:#e96d42}
.btn-blue{background:#4a90e2}
.btn-green{background:#4ebfa5}
.btn-red{background:#e05d5d}
.support{margin-top:22px;padding:16px;border-radius:14px;text-align:center;background:#f7f9fa;border:1px dashed #ccc}
.support p{margin:0 0 10px;color:#777;font-size:14px}
.qr{width:100px;height:100px;background:#eee;margin:0 auto;line-height:100px;color:#aaa}
</style>
</head>
<body>

<div class="app-box">

<div style="text-align:center;margin-bottom:14px">
<span class="badge">志木市 太郎 さんのページ</span>
</div>

<div class="card">

<h1>今日も一日あんしん</h1>

<button class="menu-btn btn-orange" onclick="location.href='person.html'">
💊 お薬をのんだ・元気だよ
</button>

<button class="menu-btn btn-blue" onclick="location.href='board.html'">
📅 今日の予定 と 回覧板
</button>

<button class="menu-btn btn-green" onclick="location.href='news.html'">
📰 まちのニュース・天気
</button>

<button class="menu-btn btn-red" onclick="location.href='map.html'">
🗺️ 近くの病院・避難ばしょ
</button>

<div class="support">
<p>家族・支援者の方はこちら（QRコード）</p>
<div class="qr">QRコード</div>
</div>

</div>
</div>

</body>
</html>
