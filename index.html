<script>

const SHEET_ID =
"149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc";

function getVal(cell){

if(!cell){
return "";
}

return cell.f || cell.v || "";

}

function makeUrl(sheetName){

return "https://docs.google.com/spreadsheets/d/" +
SHEET_ID +
"/gviz/tq?sheet=" +
encodeURIComponent(sheetName) +
"&tqx=out:json";

}

function parseGviz(text){

return JSON.parse(
text.substring(
text.indexOf("{"),
text.lastIndexOf("}") + 1
)
);

}

async function loadSheet(sheetName){

const res =
await fetch(
makeUrl(sheetName)
);

const text =
await res.text();

const json =
parseGviz(text);

const rows =
json.table.rows || [];

rows.reverse();

return rows;

}

async function loadNews(){

try{

let html = "";

const radioRows =
await loadSheet("地域ラジオ");

if(radioRows.length){

const row =
radioRows[0];

html += `
<div class="news">
<div class="news-title">
📻 ${getVal(row.c[1])}
</div>
<div class="news-text">
${getVal(row.c[2])}
</div>
</div>
`;

}

const videoRows =
await loadSheet("お楽しみ動画");

if(videoRows.length){

const row =
videoRows[0];

html += `
<div class="news">
<div class="news-title">
🎬 ${getVal(row.c[1])}
</div>
<div class="news-text">
${getVal(row.c[2])}
</div>
</div>
`;

}

const kawarabanRows =
await loadSheet("４市瓦版");

if(kawarabanRows.length){

const row =
kawarabanRows[0];

html += `
<div class="news">
<div class="news-title">
📰 ${getVal(row.c[2])}
</div>
<div class="news-text">
${getVal(row.c[3])}
</div>
</div>
`;

}

document.getElementById("newsArea").innerHTML =
html || `
<div class="news">
<div class="news-title">
データなし
</div>
<div class="news-text">
スプレッドシートを確認してください
</div>
</div>
`;

}catch(error){

document.getElementById("newsArea").innerHTML =
`
<div class="news">
<div class="news-title">
取得エラー
</div>
<div class="news-text">
通信状態を確認してください
</div>
</div>
`;

}

}

async function loadDashboard(){

try{

document.getElementById("okCount").innerHTML =
"0";

document.getElementById("waitCount").innerHTML =
"0";

document.getElementById("emgCount").innerHTML =
"0";

document.getElementById("scheduleCount").innerHTML =
"0";

document.getElementById("medicineCount").innerHTML =
"0";

document.getElementById("locationCount").innerHTML =
"0";

}catch(error){

console.log(error);

}

}

loadNews();
loadDashboard();

setInterval(
loadNews,
60000
);

</script>
