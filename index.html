<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日の安心</title>

<style>

body{
  margin:0;
  background:#eef3f8;
  font-family:sans-serif;
  color:#222;
}

.top{
  background:linear-gradient(135deg,#1976d2,#0d47a1);
  color:white;
  padding:34px 20px 40px;
  border-bottom-left-radius:34px;
  border-bottom-right-radius:34px;
  text-align:center;
}

.title{
  font-size:44px;
  font-weight:900;
}

.date{
  font-size:26px;
  margin-top:14px;
  font-weight:900;
}

.wrap{
  padding:18px;
}

.card{
  background:white;
  border-radius:30px;
  padding:28px;
  margin-bottom:24px;
  box-shadow:0 6px 18px rgba(0,0,0,.12);
  text-align:center;
}

.card-title{
  font-size:26px;
  color:#1565c0;
  font-weight:900;
  margin-bottom:14px;
}

.big-text{
  font-size:44px;
  font-weight:900;
  line-height:1.4;
}

.sub{
  font-size:24px;
  color:#666;
  line-height:1.7;
  margin-top:12px;
}

button{
  width:100%;
  border:none;
  border-radius:28px;
  padding:34px;
  margin-bottom:22px;
  color:white;
  font-size:38px;
  font-weight:900;
}

.green{
  background:#43a047;
}

.blue{
  background:#1565c0;
}

.red{
  background:#d32f2f;
}

.gray{
  background:#546e7a;
}

.result{
  text-align:center;
  font-size:28px;
  font-weight:900;
  margin:16px 0;
}

.checked{
  opacity:.55;
  box-shadow:
  0 0 0 6px #fff,
  0 0 0 12px #00c853;
}

</style>
</head>

<body>

<div class="top">

  <div class="title">
    今日の安心
  </div>

  <div class="date" id="todayDate"></div>

</div>

<div class="wrap">

  <div class="card">

    <div class="card-title">
      📅 今日の予定
    </div>

    <div class="big-text">
      今日は予定ありません
    </div>

    <div class="sub">
      今日も元気にお過ごしください
    </div>

  </div>

  <button
  id="btn-genki"
  class="green"
  onclick="sendData('btn-genki','正常','😊 元気です')">

  😊 元気です

  </button>

  <button
  id="btn-go"
  class="blue"
  onclick="sendData('btn-go','外出','🏥 出発しました')">

  🏥 出発しました

  </button>

  <button
  id="btn-emergency"
  class="red"
  onclick="emergencyAction()">

  🚨 緊急

  </button>

  <div class="result" id="result"></div>

  <button
  class="gray"
  onclick="location.href='map.html'">

  🗺️ 行き先案内

  </button>

  <button
  class="gray"
  onclick="location.href='family.html'">

  👨‍👩‍👧 家族確認

  </button>

</div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbz-cMT63Wl9f9-WFM8R6lNsGK_aXx-kavrl0_uOjzJARzahG1j_9hmh-kyAodMGUCvP/exec';

function showToday(){

  const now = new Date();

  const week = [
    '日曜日',
    '月曜日',
    '火曜日',
    '水曜日',
    '木曜日',
    '金曜日',
    '土曜日'
  ];

  document.getElementById('todayDate').innerHTML =
    now.getFullYear() + '年 ' +
    (now.getMonth()+1) + '月 ' +
    now.getDate() + '日 ' +
    week[now.getDay()];

}

function clearChecks(){

  document.querySelectorAll('button').forEach(btn=>{

    btn.classList.remove('checked');

    btn.innerHTML =
      btn.innerHTML.replace(' ✅','');

  });

}

function restoreLastButton(){

  const lastButton =
  localStorage.getItem('lastButton');

  if(!lastButton)return;

  const btn =
  document.getElementById(lastButton);

  if(!btn)return;

  btn.classList.add('checked');

  if(!btn.innerHTML.includes('✅')){

    btn.innerHTML =
      btn.innerHTML + ' ✅';

  }

}

async function sendData(
  buttonId,
  status,
  content
){

  try{

    await fetch(GAS_URL,{

      method:'POST',

      headers:{
        'Content-Type':'text/plain'
      },

      body:JSON.stringify({

        name:'山口さん',

        status:status,

        content:content

      }),

      keepalive:true

    });

    clearChecks();

    const btn =
    document.getElementById(buttonId);

    btn.classList.add('checked');

    if(!btn.innerHTML.includes('✅')){

      btn.innerHTML =
        btn.innerHTML + ' ✅';

    }

    localStorage.setItem(
      'lastButton',
      buttonId
    );

    document.getElementById('result').innerHTML =
      '送信しました';

  }catch(error){

    alert('通信エラー');

  }

}

async function emergencyAction(){

  await sendData(
    'btn-emergency',
    '緊急',
    '🚨 緊急です'
  );

  if(confirm('家族へ電話しますか？')){

    location.href =
      'tel:09012345678';

  }

}

showToday();

restoreLastButton();

</script>

</body>
</html>
