<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>写真アルバム｜見守りDX</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:560px;
margin:auto;
padding:16px;
}

.header{
background:#ad1457;
color:#fff;
border-radius:26px;
padding:22px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.back{
font-size:16px;
font-weight:900;
margin-bottom:12px;
cursor:pointer;
}

.title{
font-size:34px;
font-weight:900;
}

.sub{
font-size:16px;
margin-top:6px;
opacity:.95;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

.card{
background:#fff;
border-radius:22px;
overflow:hidden;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.photo{
width:100%;
height:180px;
object-fit:cover;
display:block;
background:#ddd;
}

.text{
padding:14px;
font-size:18px;
font-weight:800;
line-height:1.6;
}

.footer{
display:flex;
justify-content:space-around;
margin-top:20px;
padding:18px 0;
background:#fff;
border-radius:22px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
font-size:14px;
font-weight:900;
color:#666;
}

</style>
</head>

<body>

<div class="wrap">

<div class="header">

<div class="back" onclick="location.href='index.html'">
← トップへ戻る
</div>

<div class="title">
📸 写真アルバム
</div>

<div class="sub">
思い出の写真を見る
</div>

</div>

<div class="grid">

<div class="card">
<img src="https://picsum.photos/400/300?1" class="photo">
<div class="text">
家族旅行の思い出
</div>
</div>

<div class="card">
<img src="https://picsum.photos/400/300?2" class="photo">
<div class="text">
昔の写真
</div>
</div>

<div class="card">
<img src="https://picsum.photos/400/300?3" class="photo">
<div class="text">
お気に入りの景色
</div>
</div>

<div class="card">
<img src="https://picsum.photos/400/300?4" class="photo">
<div class="text">
大切な記録
</div>
</div>

</div>

<div class="footer">

<div onclick="location.href='index.html'">
見守り
</div>

<div onclick="location.href='schedule.html'">
予定
</div>

<div onclick="location.href='gomi.html'">
ゴミ
</div>

<div onclick="location.href='news.html'">
地域情報
</div>

</div>

</div>

</body>
</html>
