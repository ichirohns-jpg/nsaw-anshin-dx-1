<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>支援者トップ</title>

<style>

body{
margin:0;
background:#eef3f8;
font-family:
"Hiragino Sans",
"Yu Gothic",
sans-serif;
}

.wrap{
max-width:760px;
margin:auto;
padding:16px;
}

.title{
font-size:32px;
font-weight:900;
color:#fb8c00;
margin-bottom:20px;
}

.card{
background:white;
border-radius:24px;
padding:20px;
margin-bottom:18px;
box-shadow:0 6px 16px rgba(0,0,0,.08);
}

.name{
font-size:30px;
font-weight:900;
color:#1976d2;
margin-bottom:10px;
}

.area{
font-size:20px;
font-weight:900;
color:#666;
margin-bottom:14px;
}

.openBtn{
width:100%;
background:#fb8c00;
border:none;
border-radius:20px;
padding:20px;
font-size:28px;
font-weight:900;
color:white;
}

</style>
</head>

<body>

<div class="wrap">

<div class="title">

支援者トップ

</div>

<div class="card">

<div class="name">

山田太郎

</div>

<div class="area">

志木市 本町

</div>

<button
class="openBtn"
onclick="location.href='person.html?name=山田太郎'">

開く

</button>

</div>

<div class="card">

<div class="name">

鈴木花子

</div>

<div class="area">

志木市 館

</div>

<button
class="openBtn"
onclick="location.href='person.html?name=鈴木花子'">

開く

</button>

</div>

<div class="card">

<div class="name">

佐藤一郎

</div>

<div class="area">

志木市 柏町

</div>

<button
class="openBtn"
onclick="location.href='person.html?name=佐藤一郎'">

開く

</button>

</div>

</div>

</body>
</html>
