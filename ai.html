<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AIに聞く</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
margin-bottom:16px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.micBtn{
width:100%;
border:none;
border-radius:28px;
padding:28px;
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
font-size:32px;
font-weight:900;
margin-bottom:16px;
}

.card{
background:#fff;
border-radius:24px;
padding:20px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
margin-bottom:16px;
}

.result{
font-size:22px;
line-height:1.8;
font-weight:700;
min-height:120px;
}

.home{
display:block;
text-decoration:none;
background:#475569;
color:#fff;
padding:20px;
border-radius:20px;
text-align:center;
font-size:22px;
font-weight:900;
}

.navBtn{
display:inline-block;
margin-top:15px;
padding:12px 20px;
border-radius:14px;
background:#2563eb;
color:#fff;
text-decoration:none;
font-weight:900;
}

</style>

</head>

<body>

<div class="header">
<h1>🎤 AIに聞く</h1>
</div>

<button
class="micBtn"
onclick="startVoice()">
🎤 話す
</button>

<div class="card">
<div id="result" class="result">
話してください
</div>
</div>

<a href="index.html" class="home">
🏠 トップへ戻る
</a>

<script>

const SHEET_ID =
'149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc';

function getVal(cell){

if(!cell) return '';

return cell.f || cell.v || '';

}

function speak(text){

document.getElementById(
'result'
).innerHTML =
text;

speechSynthesis.cancel();

speechSynthesis.speak(
new SpeechSynthesisUtterance(
text
)
);

}

function startVoice(){

if(
!(
'webkitSpeechRecognition'
in window
)
){

alert(
'音声認識未対応'
);

return;

}

const rec =
new webkitSpeechRecognition();

rec.lang='ja-JP';

rec.start();

rec.onresult=function(e){

const q =
e.results[0][0].transcript;

processQuestion(q);

};

}

function processQuestion(q){

if(q.includes('ゴミ')){
searchGarbage();
return;
}

if(q.includes('予定')){
searchSchedule();
return;
}

if(
q.includes('包括') ||
q.includes('相談')
){
searchFacility('包括');
return;
}

if(
q.includes('避難')
){
searchFacility('避難所');
return;
}

if(
q.includes('市役所')
){
searchFacility('市役所');
return;
}

if(
q.includes('休日') ||
q.includes('救急')
){
searchFacility('休日診療');
return;
}
if(q.includes('病院')){

window.open(
'https://www.google.com/maps/search/病院'
);

return;

}

if(q.includes('薬局')){

window.open(
'https://www.google.com/maps/search/薬局'
);

return;

}

if(q.includes('コンビニ')){

window.open(
'https://www.google.com/maps/search/コンビニ'
);

return;

}

if(q.includes('トイレ')){

window.open(
'https://www.google.com/maps/search/公衆トイレ'
);

return;

}

speak(
'もう一度話してください'
);

}

function searchFacility(type){

const url =

'https://docs.google.com/spreadsheets/d/' +

SHEET_ID +

'/gviz/tq?sheet=' +

encodeURIComponent(
'施設マスター'
) +

'&tqx=out:json';

window.handleFacility =
function(json){

const rows =
json.table.rows;

for(let i=0;i<rows.length;i++){

const row =
rows[i];

const facilityType =
getVal(row.c[2]);

if(
facilityType === type
){

const name =
getVal(row.c[3]);

const address =
getVal(row.c[4]);

const tel =
getVal(row.c[5]);

const map =
getVal(row.c[6]);

document.getElementById(
'result'
).innerHTML =

'【' +
type +
'】<br><br>' +

name +

'<br><br>' +

address +

'<br><br>' +

(tel || '') +

'<br><br>' +

'<a class="navBtn" target="_blank" href="' +

map +

'">📍 ナビ開始</a>';

speechSynthesis.speak(
new SpeechSynthesisUtterance(
name
)
);

return;

}

}

speak(
'データが見つかりません'
);

};

const script =
document.createElement(
'script'
);

script.src =
url +
'&callback=handleFacility';

document.body.appendChild(
script);

}

function searchGarbage(){

location.href =
'garbage.html';

}

function searchSchedule(){

location.href =
'schedule.html';

}

</script>

</body>
</html>
