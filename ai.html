<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AIに聞く</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:36px;
font-weight:900;
}

.card{
background:#fff;
padding:24px;
border-radius:24px;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.result{
font-size:24px;
font-weight:900;
line-height:1.8;
text-align:center;
}

.btn{
display:block;
width:100%;
padding:28px;
border:none;
border-radius:24px;
font-size:30px;
font-weight:900;
cursor:pointer;
color:#fff;
margin-bottom:14px;
}

.purple{
background:#7c3aed;
}

.gray{
background:#475569;
}

</style>

</head>

<body>

<div class="header">
<h1>🎤 AIに聞く</h1>
</div>

<div class="card">

<div
id="result"
class="result">

ボタンを押して話してください

</div>

</div>

<button
class="btn purple"
onclick="startVoice()">

🎤 話す

</button>

<button
class="btn gray"
onclick="location.href='index.html'">

🏠 トップへ戻る

</button>

<script>

function speak(text){

document.getElementById(
'result'
).innerHTML =
text;

speechSynthesis.cancel();

speechSynthesis.speak(
new SpeechSynthesisUtterance(
text
)
);

}

function startVoice(){

if(
!(
'webkitSpeechRecognition'
in window
)
){

alert(
'音声認識未対応'
);

return;

}

const rec =
new webkitSpeechRecognition();

rec.lang='ja-JP';

rec.start();

rec.onresult=function(e){

const q =
e.results[0][0]
.transcript;

document.getElementById(
'result'
).innerHTML =

'質問<br><br>' +
q;

answer(q);

};

}

function answer(q){

const schedules =
JSON.parse(
localStorage.getItem(
'schedules'
) || '[]'
);

const gps =
JSON.parse(
localStorage.getItem(
'lastGPS'
) || 'null'
);

const genki =
JSON.parse(
localStorage.getItem(
'lastGenki'
) || 'null'
);

const med =
JSON.parse(
localStorage.getItem(
'medicineStatus'
) || '{}'
);

const familyPhone =
localStorage.getItem(
'familyPhone'
) || '';

const familyLine =
localStorage.getItem(
'familyLine'
) || '';

if(
q.includes('今日')
&&
q.includes('予定')
){

const today =
new Date()
.toISOString()
.slice(0,10);

const list =
schedules.filter(
x=>x.date===today
);

if(!list.length){

speak(
'今日は予定ありません'
);

return;

}

let text =
'今日の予定です。';

list.forEach(item=>{

text +=
(item.time || '') +
' ' +
item.title +
'。';

});

speak(text);

return;

}

if(
q.includes('明日')
&&
q.includes('予定')
){

const d =
new Date();

d.setDate(
d.getDate()+1
);

const tomorrow =
d.toISOString()
.slice(0,10);

const list =
schedules.filter(
x=>x.date===tomorrow
);

if(!list.length){

speak(
'明日の予定はありません'
);

return;

}

let text =
'明日の予定です。';

list.forEach(item=>{

text +=
(item.time || '') +
' ' +
item.title +
'。';

});

speak(text);

return;

}

if(
q.includes('薬')
){

let text='';

if(med.morning)
text+='朝の薬は飲みました。';

if(med.noon)
text+='昼の薬は飲みました。';

if(med.evening)
text+='夕方の薬は飲みました。';

if(med.night)
text+='寝る前の薬は飲みました。';

if(text===''){
text='服薬記録はありません';
}

speak(text);

return;

}

if(
q.includes('元気')
){

if(genki){

speak(
'最後の元気ですは ' +
genki.time +
' です'
);

}else{

speak(
'元気ですの記録がありません'
);

}

return;

}

if(
q.includes('電話')
){

if(familyPhone){

speak(
'家族へ電話します'
);

setTimeout(()=>{

location.href =
'tel:' +
familyPhone;

},1000);

}else{

speak(
'電話番号が登録されていません'
);

}

return;

}

if(
q.includes('ライン')
||
q.includes('LINE')
){

if(familyLine){

speak(
'家族のラインを開きます'
);

window.open(
familyLine
);

}else{

speak(
'ラインが登録されていません'
);

}

return;

}

if(
q.includes('どこ')
||
q.includes('現在地')
){

if(gps){

speak(
'最後の位置情報を表示します'
);

window.open(
gps.mapUrl
);

}else{

speak(
'位置情報がありません'
);

}

return;

}

if(
q.includes('病院')
){

speak(
'病院ページを開きます'
);

setTimeout(()=>{

location.href =
'hospital.html';

},1000);

return;

}

if(
q.includes('ゴミ')
){

speak(
'ゴミの日機能は作成中です'
);

return;

}

speak(
'すみません。まだ勉強中です。'
);

}

</script>

</body>
</html>
