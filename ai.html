<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AIに聞く</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
margin-bottom:16px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.micBtn{
width:100%;
border:none;
border-radius:28px;
padding:28px;
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
font-size:32px;
font-weight:900;
margin-bottom:16px;
cursor:pointer;
}

.card{
background:#fff;
border-radius:24px;
padding:20px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
margin-bottom:16px;
}

.title{
font-size:24px;
font-weight:900;
margin-bottom:12px;
}

.result{
font-size:22px;
line-height:1.8;
font-weight:700;
min-height:120px;
}

.callBtn{
display:block;
width:100%;
padding:18px;
margin-top:12px;
border-radius:18px;
background:#16a34a;
color:#fff;
text-decoration:none;
text-align:center;
font-size:22px;
font-weight:900;
}

.mapBtn{
display:block;
width:100%;
padding:18px;
margin-top:12px;
border-radius:18px;
background:#2563eb;
color:#fff;
text-decoration:none;
text-align:center;
font-size:22px;
font-weight:900;
}

.home{
display:block;
text-decoration:none;
background:#475569;
color:#fff;
padding:20px;
border-radius:20px;
text-align:center;
font-size:22px;
font-weight:900;
}

</style>

</head>

<body>

<div class="header">
<h1>🎤 AIに聞く</h1>
</div>

<button
class="micBtn"
onclick="startVoice()">
🎤 話す
</button>

<div class="card">

<div class="title">
🎤 聞き取った内容
</div>

<div
id="speechText"
class="result">

まだ話していません

</div>

</div>

<div class="card">

<div class="title">
🤖 AIの回答
</div>

<div
id="result"
class="result">

話してください

</div>

</div>

<div
id="actionArea"
class="card"
style="display:none">

<div class="title">
📞 候補
</div>

<div id="actionList">

</div>

</div>

<a href="index.html" class="home">
🏠 トップへ戻る
</a>

<script>

const SHEET_ID =
'149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc';

function getVal(cell){

if(!cell)return'';

return cell.f || cell.v || '';

}

function speak(text){

document.getElementById(
'result'
).innerHTML =
text;

speechSynthesis.cancel();

speechSynthesis.speak(
new SpeechSynthesisUtterance(text)
);

}

function startVoice(){

if(
!(
'webkitSpeechRecognition'
in window
)
){

alert('音声認識未対応');

return;

}

document.getElementById(
'speechText'
).innerHTML =
'🎤 聞いています...';

const rec =
new webkitSpeechRecognition();

rec.lang='ja-JP';

rec.interimResults=false;

rec.continuous=false;

rec.start();

rec.onresult=function(e){

const q =
e.results[0][0].transcript;

document.getElementById(
'speechText'
).innerHTML =

'✅ 聞き取れました<br><br>' +
q;

processQuestion(q);

};

}

function processQuestion(q){

document.getElementById(
'actionArea'
).style.display =
'none';

if(
q.includes('今日の予定') ||
q.includes('予定は') ||
q.includes('予定教えて')
){

const data =
JSON.parse(
localStorage.getItem(
'lastSchedule'
) || 'null'
);

if(data){

speak(

'次の予定は' +

(data.title || '') +

'です。' +

(data.date || '')

);

}else{

speak(
'予定はありません'
);

}

return;

}

if(
q.includes('薬飲んだ') ||
q.includes('服薬') ||
q.includes('薬は')
){

const data =
JSON.parse(
localStorage.getItem(
'medicineStatus'
) || '{}'
);

let msg='';

msg += data.morning ?

'朝の薬は飲みました。' :

'朝の薬はまだです。';

msg += data.noon ?

'昼の薬は飲みました。' :

'昼の薬はまだです。';

msg += data.evening ?

'夕方の薬は飲みました。' :

'夕方の薬はまだです。';

msg += data.night ?

'寝る前の薬は飲みました。' :

'寝る前の薬はまだです。';

speak(msg);

return;

}

if(
q.includes('今どこ') ||
q.includes('現在地')
){

const gps =
JSON.parse(
localStorage.getItem(
'lastGPS'
) || 'null'
);

if(gps){

speak(
'最終位置取得は' +
gps.time +
'です'
);

}else{

speak(
'位置情報はありません'
);

}

return;

}

if(
q.includes('家族に電話') ||
q.includes('家族へ電話')
){

speak(
'家族へ電話ページを開きます'
);

setTimeout(()=>{

location.href =
'tel-family.html';

},1000);

return;

}

if(
q.includes('ライン') ||
q.includes('LINE')
){

speak(
'家族へラインページを開きます'
);

setTimeout(()=>{

location.href =
'line-family.html';

},1000);

return;

}

if(
q.includes('ゴミ')
){

speak(
'ゴミページを開きます'
);

setTimeout(()=>{

location.href =
'garbage.html';

},1000);

return;

}

if(
q.includes('ニュース') ||
q.includes('地域情報')
){

speak(
'地域情報ページを開きます'
);

setTimeout(()=>{

location.href =
'news.html';

},1000);

return;

}

if(q.includes('病院')){

window.open(
'https://www.google.com/maps/search/病院'
);

speak(
'近くの病院を表示します'
);

return;

}

if(q.includes('薬局')){

window.open(
'https://www.google.com/maps/search/薬局'
);

speak(
'近くの薬局を表示します'
);

return;

}

if(q.includes('相談')){

searchFacility('包括');

return;

}

if(
q.includes('タクシー') ||
q.includes('迎え') ||
q.includes('車')
){

showTaxi();

return;

}

speak(
'もう一度話してください'
);

}

function showTaxi(){

document.getElementById(
'actionArea'
).style.display =
'block';

document.getElementById(
'actionList'
).innerHTML =

'<a class="callBtn" href="tel:0484710033">🚕 志木合同タクシー</a>' +

'<a class="callBtn" href="tel:0492511111">🚕 富士見交通</a>' +

'<a class="callBtn" href="tel:0570038100">🚕 三和交通</a>';

speak(
'タクシー会社を表示しました'
);

}

function searchFacility(type){

/* 今までの searchFacility をそのまま残す */

}

</script>

</body>
</html>
