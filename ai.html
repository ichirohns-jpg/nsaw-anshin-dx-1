<script>

const SHEET_ID =
'149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc';

function getVal(cell){

if(!cell) return '';

return cell.f || cell.v || '';

}

function speak(text){

document.getElementById(
'result'
).innerHTML =
text;

speechSynthesis.cancel();

speechSynthesis.speak(
new SpeechSynthesisUtterance(
text
)
);

}

function startVoice(){

if(
!(
'webkitSpeechRecognition'
in window
)
){

alert(
'音声認識未対応'
);

return;

}

const rec =
new webkitSpeechRecognition();

rec.lang =
'ja-JP';

rec.interimResults =
false;

rec.continuous =
false;

rec.start();

rec.onresult =
function(e){

const q =
e.results[0][0]
.transcript;

document.getElementById(
'result'
).innerHTML =

'質問<br><br>' +

q;

processQuestion(q);

};

}

function processQuestion(q){

if(
q.includes('ゴミ')
){

searchSheet(
'ゴミ',
q
);

return;

}

if(
q.includes('病院')
||
q.includes('薬局')
||
q.includes('避難所')
||
q.includes('包括')
||
q.includes('コンビニ')
||
q.includes('トイレ')
){

searchSheet(
'施設マスター',
q
);

return;

}

if(
q.includes('予定')
){

searchSheet(
'予定',
q
);

return;

}

if(
q.includes('元気')
){

searchSheet(
'見守り記録',
q
);

return;

}

speak(
'質問内容を確認しています'
);

}

function searchSheet(sheetName,q){

const url =

'https://docs.google.com/spreadsheets/d/' +

SHEET_ID +

'/gviz/tq?sheet=' +

encodeURIComponent(sheetName) +

'&tqx=out:json';

const script =
document.createElement(
'script'
);

const callbackName =

'cb_' +

Date.now();

window[callbackName] =
function(json){

try{

const rows =
json.table.rows;

const areaCode =
localStorage.getItem(
'areaCode'
) || '';

const today =
['日','月','火','水','木','金','土']
[new Date().getDay()];

let answer = '';

for(
let i=0;
i<rows.length;
i++
){

const row =
rows[i];

const c0 =
getVal(row.c[0]);

const c1 =
getVal(row.c[1]);

const c2 =
getVal(row.c[2]);

const c3 =
getVal(row.c[3]);

const c4 =
getVal(row.c[4]);

if(
sheetName === 'ゴミ'
){

if(
c1 === areaCode &&
c2.indexOf(today) > -1
){

answer =

'今日のゴミは ' +

c3 +

' です。 ' +

c4;

break;

}

}

else{

const text =

JSON.stringify(
row
);

if(
text.includes(
areaCode
)
){

answer =
text;

break;

}

}

}

if(!answer){

answer =
'該当データが見つかりません';

}

speak(answer);

}
catch(e){

speak(
'検索エラーです'
);

}

delete window[
callbackName
];

};

script.src =

url +

'&callback=' +

callbackName;

document.body.appendChild(
script
);

}

</script>

</body>
</html>
