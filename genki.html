<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>今日の体調</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
}

.header{
background:linear-gradient(135deg,#16a34a,#15803d);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:#fff;
padding:24px;
border-radius:24px;
margin-bottom:16px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.bigBtn{
width:100%;
border:none;
padding:30px;
border-radius:24px;
font-size:30px;
font-weight:900;
color:#fff;
margin-bottom:14px;
cursor:pointer;
}

.green{
background:#16a34a;
}

.orange{
background:#f59e0b;
}

.red{
background:#ef4444;
}

.status{
font-size:24px;
font-weight:900;
line-height:1.8;
text-align:center;
}

.home{
display:block;
background:#475569;
color:#fff;
text-decoration:none;
padding:20px;
border-radius:20px;
text-align:center;
font-size:22px;
font-weight:900;
}

</style>

</head>

<body>

<div class="header">
<h1>😊 今日の体調</h1>
</div>

<div class="card">

<button
class="bigBtn green"
onclick="saveGenki('元気です')">

😊 元気です

</button>

<button
class="bigBtn orange"
onclick="saveGenki('少し不安')">

😐 少し不安

</button>

<button
class="bigBtn red"
onclick="saveGenki('SOS')">

🚨 SOS

</button>

<div
id="statusArea"
class="status">

まだ送信していません

</div>

</div>

<a
href="index.html"
class="home">

🏠 トップへ戻る

</a>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec';

function saveGenki(type){

const now =
new Date()
.toLocaleString(
'ja-JP'
);

const userId =
localStorage.getItem(
'userId'
) || '';

const form =
new FormData();

form.append(
'action',
'watch'
);

form.append(
'id',
userId
);

form.append(
'status',
'体調'
);

form.append(
'memo',
type
);

fetch(
GAS_URL,
{
method:'POST',
body:form
}
)

.then(r=>r.text())

.then(()=>{

localStorage.setItem(
'lastGenki',
JSON.stringify({
type:type,
time:now
})
);

document.getElementById(
'statusArea'
).innerHTML =

'😊 送信済み<br><br>' +

type +

'<br><br>' +

now;

alert(
'送信しました'
);

});

}

const last =
JSON.parse(
localStorage.getItem(
'lastGenki'
) || 'null'
);

if(last){

document.getElementById(
'statusArea'
).innerHTML =

'😊 送信済み<br><br>' +

last.type +

'<br><br>' +

last.time;

}

</script>

</body>
</html>
