<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>今日の体調</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#f3f6fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
color:#111827;
}

.header{

background:
linear-gradient(
135deg,
#16a34a,
#15803d
);

color:#fff;

padding:28px;

border-radius:30px;

text-align:center;

margin-bottom:20px;

}

.title{

font-size:34px;

font-weight:900;

}

.sub{

font-size:18px;

margin-top:10px;

opacity:.95;

}

.card{

background:#fff;

border-radius:30px;

padding:20px;

box-shadow:
0 8px 20px
rgba(0,0,0,.08);

margin-bottom:20px;

}

.statusBtn{

width:100%;

border:none;

border-radius:24px;

padding:24px;

margin-bottom:16px;

font-size:30px;

font-weight:900;

text-align:left;

background:#f8fafc;

cursor:pointer;

border:4px solid #e5e7eb;

transition:.2s;

}

.statusBtn.active{

background:#dcfce7;

border-color:#16a34a;

color:#166534;

}

.saveBtn{

width:100%;

border:none;

border-radius:24px;

padding:28px;

font-size:32px;

font-weight:900;

background:#16a34a;

color:#fff;

cursor:pointer;

}

.result{

margin-top:20px;

font-size:24px;

font-weight:900;

text-align:center;

color:#15803d;

display:none;

}

.home{

display:block;

text-align:center;

background:#1e293b;

color:#fff;

text-decoration:none;

padding:20px;

border-radius:24px;

font-size:24px;

font-weight:900;

}

</style>

</head>

<body>

<div class="header">

<div class="title">
😊 今日の体調
</div>

<div class="sub">
あてはまるものを1つ選んでください
</div>

</div>

<div class="card">

<button
class="statusBtn"
onclick="selectStatus(this,'元気です')">
☐ 😊 元気です
</button>

<button
class="statusBtn"
onclick="selectStatus(this,'少し不安')">
☐ 😟 少し不安
</button>

<button
class="statusBtn"
onclick="selectStatus(this,'体調が悪い')">
☐ 🤒 体調が悪い
</button>

<button
class="saveBtn"
onclick="saveStatus()">
送信する
</button>

<div
id="result"
class="result">
✅ 送信しました
</div>

</div>

<a
href="index.html"
class="home">
🏠 トップへ戻る
</a>

<script>

let selectedStatus='';

function selectStatus(btn,status){

document
.querySelectorAll('.statusBtn')
.forEach(function(b){

b.classList.remove('active');

b.innerHTML=
b.innerHTML
.replace('☑','☐');

});

btn.classList.add('active');

btn.innerHTML=
btn.innerHTML
.replace('☐','☑');

selectedStatus=status;

}

function saveStatus(){

if(!selectedStatus){

alert('体調を選んでください');

return;

}

localStorage.setItem(
'todayCondition',
selectedStatus
);

localStorage.setItem(
'todayConditionTime',
new Date().toLocaleString('ja-JP')
);

document.getElementById(
'result'
).style.display='block';

setTimeout(function(){

location.href='index.html';

},1500);

}

</script>

</body>
</html>
