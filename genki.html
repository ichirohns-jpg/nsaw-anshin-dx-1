<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>元気です</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
text-align:center;
}

.header{
background:linear-gradient(135deg,#16a34a,#15803d);
color:#fff;
padding:28px;
border-radius:28px;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:#fff;
padding:24px;
border-radius:24px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
margin-bottom:16px;
}

.bigBtn{
width:100%;
border:none;
background:#16a34a;
color:#fff;
padding:40px;
border-radius:28px;
font-size:36px;
font-weight:900;
}

.time{
margin-top:20px;
font-size:24px;
font-weight:900;
line-height:1.8;
}

.actionBtn{
display:block;
width:100%;
padding:20px;
border-radius:20px;
text-decoration:none;
text-align:center;
font-size:22px;
font-weight:900;
color:#fff;
margin-top:12px;
}

.telBtn{
background:#16a34a;
}

.lineBtn{
background:#06c755;
}

.home{
display:block;
width:100%;
border:none;
background:#475569;
color:#fff;
padding:20px;
border-radius:20px;
font-size:22px;
font-weight:900;
margin-top:16px;
}

</style>

</head>

<body>

<div class="header">
<h1>😊 元気です</h1>
</div>

<div class="card">

<button
class="bigBtn"
onclick="saveGenki()">

😊 元気です

</button>

<div
id="timeArea"
class="time">

まだ記録がありません

</div>

<a
id="telBtn"
class="actionBtn telBtn"
style="display:none"
href="#">

📞 家族へ電話

</a>

<a
id="lineBtn"
class="actionBtn lineBtn"
style="display:none"
href="#">

💬 家族へLINE

</a>

<button
class="home"
onclick="goHome()">

🏠 トップへ戻る

</button>

</div>

<script>

function goHome(){

location.href =
'https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/';

}

function showButtons(){

const tel =
localStorage.getItem(
'familyTel'
) || '';

const line =
localStorage.getItem(
'familyLine'
) || '';

if(tel){

const telBtn =
document.getElementById(
'telBtn'
);

telBtn.href =
'tel:' + tel;

telBtn.style.display =
'block';

}

if(line){

const lineBtn =
document.getElementById(
'lineBtn'
);

lineBtn.href =
line;

lineBtn.style.display =
'block';

}

}

function saveGenki(){

const now =
new Date();

const data = {

time:
now.toLocaleString(
'ja-JP'
)

};

localStorage.setItem(
'lastGenki',
JSON.stringify(data)
);

document.getElementById(
'timeArea'
).innerHTML =

'最終送信<br><br>' +

data.time;

showButtons();

alert(
'元気ですを送信しました'
);

}

const last =
JSON.parse(
localStorage.getItem(
'lastGenki'
) || 'null'
);

if(last){

document.getElementById(
'timeArea'
).innerHTML =

'最終送信<br><br>' +

last.time;

showButtons();

}

</script>

</body>
</html>
