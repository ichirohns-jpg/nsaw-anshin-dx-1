<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>元気です</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
text-align:center;
}

.header{
background:linear-gradient(135deg,#16a34a,#15803d);
color:#fff;
padding:28px;
border-radius:28px;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:#fff;
padding:24px;
border-radius:24px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
margin-bottom:16px;
}

.bigBtn{
width:100%;
border:none;
background:#16a34a;
color:#fff;
padding:40px;
border-radius:28px;
font-size:36px;
font-weight:900;
}

.time{
margin-top:20px;
font-size:24px;
font-weight:900;
}

.home{
display:block;
margin-top:16px;
padding:20px;
background:#475569;
color:#fff;
text-decoration:none;
border-radius:20px;
font-size:22px;
font-weight:900;
}

</style>

</head>

<body>

<div class="header">
<h1>😊 元気です</h1>
</div>

<div class="card">

<button
class="bigBtn"
onclick="saveGenki()">

😊 元気です

</button>

<div
id="timeArea"
class="time">

まだ記録がありません

</div>

</div>

<a
href="index.html"
class="home">

🏠 トップへ戻る

</a>

<script>

function saveGenki(){

const now =
new Date();

const data = {

time:
now.toLocaleString(
'ja-JP'
)

};

localStorage.setItem(
'lastGenki',
JSON.stringify(data)
);

document.getElementById(
'timeArea'
).innerHTML =

'最終送信<br><br>' +

data.time;

alert(
'元気ですを送信しました'
);

}

const last =
JSON.parse(
localStorage.getItem(
'lastGenki'
) || 'null'
);

if(last){

document.getElementById(
'timeArea'
).innerHTML =

'最終送信<br><br>' +

last.time;

}

</script>

</body>
</html>
