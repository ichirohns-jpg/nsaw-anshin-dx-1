<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>自由メモ｜見守りDX</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:560px;
margin:auto;
padding:16px;
}

.header{
background:#546e7a;
color:#fff;
border-radius:26px;
padding:22px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.back{
font-size:16px;
font-weight:900;
margin-bottom:12px;
cursor:pointer;
}

.title{
font-size:34px;
font-weight:900;
}

.sub{
font-size:16px;
margin-top:6px;
opacity:.95;
}

.card{
background:#fff;
border-radius:26px;
padding:20px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.memo{
width:100%;
height:320px;
border:none;
outline:none;
resize:none;
font-size:28px;
font-weight:800;
line-height:1.8;
background:#f8fbfd;
border-radius:20px;
padding:20px;
}

.btn{
width:100%;
border:none;
border-radius:24px;
padding:24px;
font-size:28px;
font-weight:900;
color:#fff;
background:#546e7a;
margin-top:18px;
cursor:pointer;
}

.btn:active{
transform:scale(.97);
}

.footer{
display:flex;
justify-content:space-around;
margin-top:20px;
padding:18px 0;
background:#fff;
border-radius:22px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
font-size:14px;
font-weight:900;
color:#666;
}

.toast{
position:fixed;
left:50%;
bottom:30px;
transform:translateX(-50%);
background:#546e7a;
color:#fff;
padding:16px 24px;
border-radius:18px;
font-size:18px;
font-weight:900;
display:none;
z-index:9999;
}

</style>
</head>

<body>

<div class="wrap">

<div class="header">

<div class="back" onclick="location.href='index.html'">
← トップへ戻る
</div>

<div class="title">
📝 自由メモ
</div>

<div class="sub">
思いついたことを書き残します
</div>

</div>

<div class="card">

<textarea
id="memo"
class="memo"
placeholder="ここに自由にメモを書いてください"></textarea>

<button class="btn" onclick="saveMemo()">
💾 保存
</button>

</div>

<div class="footer">

<div onclick="location.href='index.html'">
見守り
</div>

<div onclick="location.href='calendar.html'">
予定
</div>

<div onclick="location.href='gomi.html'">
ゴミ
</div>

<div onclick="location.href='news.html'">
地域情報
</div>

</div>

</div>

<div id="toast" class="toast"></div>

<script>

window.onload=function(){

const saved=localStorage.getItem("freeMemo");

if(saved){
document.getElementById("memo").value=saved;
}

};

function saveMemo(){

const text=document.getElementById("memo").value;

localStorage.setItem("freeMemo",text);

showToast("保存しました");

}

function showToast(text){

const toast=document.getElementById("toast");

toast.innerText=text;

toast.style.display="block";

setTimeout(function(){
toast.style.display="none";
},2000);

}

</script>

</body>
</html>
