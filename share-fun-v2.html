<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>お楽しみ動画</title>

<meta property="og:type" content="website">
<meta property="og:title" content="お楽しみ動画">
<meta property="og:description" content="地域の暮らしに役立つ動画">
<meta property="og:image" content="https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/top.jpg">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="お楽しみ動画">
<meta name="twitter:description" content="地域の暮らしに役立つ動画">
<meta name="twitter:image" content="https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/top.jpg">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef3f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#111827;
}

.wrap{
max-width:900px;
margin:auto;
padding:16px;
}

.header{
background:linear-gradient(135deg,#16a34a,#22c55e);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
font-size:38px;
font-weight:900;
margin-bottom:20px;
}

.homeBtn{
display:block;
width:100%;
background:linear-gradient(
135deg,
#0f172a,
#1f2937,
#374151
);
color:#fff;
text-decoration:none;
padding:24px;
border-radius:24px;
font-size:26px;
font-weight:900;
text-align:center;
margin-bottom:20px;
}

.card{
background:#fff;
border-radius:30px;
overflow:hidden;
margin-bottom:24px;
box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.player{
width:100%;
aspect-ratio:16/9;
background:#000;
overflow:hidden;
}

.player iframe{
width:100%;
height:100%;
border:none;
display:block;
}

.date{
padding:20px 22px 0;
font-size:20px;
font-weight:900;
color:#64748b;
}

.genre{
display:inline-block;
margin:16px 22px;
padding:10px 16px;
border-radius:999px;
background:#dcfce7;
color:#16a34a;
font-size:18px;
font-weight:900;
}

.title{
padding:0 22px;
font-size:38px;
font-weight:900;
line-height:1.45;
}

.desc{
padding:20px 22px;
font-size:26px;
line-height:1.8;
color:#475569;
}

.memo{
margin:0 22px 20px;
padding:14px;
background:#f8fafc;
border-radius:14px;
font-size:18px;
line-height:1.7;
}

.loading{
background:#fff;
padding:30px;
border-radius:24px;
text-align:center;
font-size:24px;
font-weight:900;
}

</style>

<script>

const SHEET_ID =
"149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc";

const SHEET_NAME =
"お楽しみ動画";

function getVal(c){

if(!c){
return "";
}

return c.f || c.v || "";

}

function getYoutubeId(url){

if(!url){
return "";
}

url=String(url);

let m=url.match(/youtu\.be\/([^?&]+)/);
if(m)return m[1];

m=url.match(/[?&]v=([^&]+)/);
if(m)return m[1];

m=url.match(/embed\/([^?&]+)/);
if(m)return m[1];

m=url.match(/shorts\/([^?&]+)/);
if(m)return m[1];

return "";

}

function loadSheet(){

const s=
document.createElement("script");

s.src=
"https://docs.google.com/spreadsheets/d/"
+
SHEET_ID
+
"/gviz/tq?sheet="
+
encodeURIComponent(SHEET_NAME)
+
"&tqx=out:json;responseHandler:handleSheet";

document.body.appendChild(s);

}

function handleSheet(json){

const rows=
json.table.rows || [];

rows.reverse();

const params=
new URLSearchParams(location.search);

const targetId=
params.get("fun");

let html="";

if(targetId){

const row=
rows[Number(targetId)-1];

if(row && row.c){

const date=
getVal(row.c[0]);

const title=
getVal(row.c[2]);

const desc=
getVal(row.c[4]);

const video=
getVal(row.c[5]);

const genre=
getVal(row.c[7]);

const memo=
getVal(row.c[8]);

const videoId=
getYoutubeId(video);

html+=`

<div class="header">
🎬 お楽しみ動画
</div>

<a
href="https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/"
class="homeBtn">

🏠 DXトップへ戻る

</a>

<div class="card">

<div class="player">

<iframe
src="https://www.youtube.com/embed/${videoId}"
allowfullscreen>
</iframe>

</div>

<div class="date">
${date}
</div>

<div class="genre">
${genre}
</div>

<div class="title">
${title}
</div>

<div class="desc">
${desc}
</div>

<div class="memo">
${memo}
</div>

</div>

`;

}

}

document.body.innerHTML=
'<div class="wrap">'+
html+
'</div>';

}

loadSheet();

</script>

</head>

<body>

</body>

</html>
