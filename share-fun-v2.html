<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>お楽しみ動画</title>

<meta property="og:type" content="website">

<meta property="og:title"
id="ogTitle"
content="お楽しみ動画">

<meta property="og:description"
id="ogDesc"
content="地域の暮らしに役立つ動画・楽しい動画をお届け">

<meta property="og:image"
content="https://img.youtube.com/vi/dQw4w9WgXcQ/maxresdefault.jpg">

<meta name="twitter:card"
content="summary_large_image">

<meta name="twitter:title"
id="twTitle"
content="お楽しみ動画">

<meta name="twitter:description"
id="twDesc"
content="地域の暮らしに役立つ動画・楽しい動画をお届け">

<meta name="twitter:image"
content="https://img.youtube.com/vi/dQw4w9WgXcQ/maxresdefault.jpg">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef3f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}

.wrap{
max-width:900px;
margin:auto;
padding:16px;
}

.header{
background:linear-gradient(
135deg,
#0b1220,
#1e293b,
#334155
);
color:#fff;
padding:28px;
border-radius:28px;
font-size:36px;
font-weight:900;
text-align:center;
margin-bottom:20px;
}

.card{
background:#fff;
border-radius:28px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.thumb{
width:100%;
display:block;
}

.loading{
padding:40px;
font-size:24px;
font-weight:900;
text-align:center;
}

</style>

</head>

<body>

<div class="wrap">

<div class="header">
🎬 お楽しみ動画
</div>

<div id="app">

<div class="loading">
読込中...
</div>

</div>

</div>

<script>

const SHEET_ID =
'149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc';

const SHEET_NAME =
'お楽しみ動画';

function getVal(c){

if(!c){
return '';
}

return c.f || c.v || '';

}

function getYoutubeId(url){

if(!url){
return '';
}

url=String(url);

let m=url.match(/youtu\.be\/([^?&]+)/);
if(m)return m[1];

m=url.match(/[?&]v=([^&]+)/);
if(m)return m[1];

m=url.match(/embed\/([^?&]+)/);
if(m)return m[1];

m=url.match(/shorts\/([^?&]+)/);
if(m)return m[1];

return '';

}

function loadSheet(){

const s =
document.createElement('script');

s.src =
'https://docs.google.com/spreadsheets/d/'
+
SHEET_ID
+
'/gviz/tq?sheet='
+
encodeURIComponent(SHEET_NAME)
+
'&tqx=out:json;responseHandler:handleSheet';

document.body.appendChild(s);

}

function handleSheet(json){

const rows =
json.table.rows || [];

rows.reverse();

const params =
new URLSearchParams(location.search);

const targetId =
params.get('fun');

let html = '';

if(targetId){

const row =
rows[Number(targetId)-1];

if(row && row.c){

const date =
getVal(row.c[0]);

const title =
getVal(row.c[2]);

const desc =
getVal(row.c[4]);

const video =
getVal(row.c[5]);

const genre =
getVal(row.c[7]);

const memo =
getVal(row.c[8]);

const videoId =
getYoutubeId(video);

document.title =
title;

document
.getElementById("ogTitle")
.setAttribute(
"content",
title
);

document
.getElementById("twTitle")
.setAttribute(
"content",
title
);

document
.getElementById("ogDesc")
.setAttribute(
"content",
desc
);

document
.getElementById("twDesc")
.setAttribute(
"content",
desc
);

html = `

<div class="card">

<img
class="thumb"
src="https://img.youtube.com/vi/${videoId}/maxresdefault.jpg">

<div style="padding:22px;">

<div style="
font-size:18px;
font-weight:900;
color:#64748b;
margin-bottom:12px;
">
${date}
</div>

<div style="
display:inline-block;
background:#dcfce7;
color:#16a34a;
padding:8px 14px;
border-radius:999px;
font-size:18px;
font-weight:900;
margin-bottom:14px;
">
${genre}
</div>

<div style="
font-size:34px;
font-weight:900;
margin-bottom:14px;
line-height:1.5;
">
${title}
</div>

<div style="
font-size:22px;
line-height:1.8;
color:#475569;
margin-bottom:16px;
">
${desc}
</div>

<div style="
font-size:18px;
line-height:1.7;
color:#64748b;
background:#f8fafc;
padding:14px;
border-radius:14px;
">
${memo}
</div>

</div>

</div>

`;

}

}

document.getElementById("app").innerHTML =
html ||
'<div class="loading">記事がありません</div>';

}

loadSheet();

</script>

</body>
</html>
