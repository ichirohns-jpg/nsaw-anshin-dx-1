<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>買い物メモ｜見守りDX</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>

*{margin:0;padding:0;box-sizing:border-box}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:560px;
margin:auto;
padding:16px;
}

.header{
background:#8e24aa;
color:#fff;
border-radius:26px;
padding:22px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.back{
font-size:16px;
font-weight:900;
margin-bottom:12px;
cursor:pointer;
}

.title{
font-size:34px;
font-weight:900;
}

.sub{
font-size:16px;
margin-top:6px;
opacity:.95;
}

.card{
background:#fff;
border-radius:26px;
padding:20px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.item{
background:#f8f0fb;
border-left:8px solid #8e24aa;
border-radius:18px;
padding:18px;
margin-bottom:16px;
display:flex;
align-items:center;
gap:14px;
}

.check{
width:34px;
height:34px;
}

.name{
font-size:26px;
font-weight:900;
}

.memo{
font-size:17px;
font-weight:700;
line-height:1.7;
color:#666;
margin-top:8px;
}

.btn{
width:100%;
border:none;
border-radius:22px;
padding:20px;
font-size:24px;
font-weight:900;
color:#fff;
background:#8e24aa;
margin-top:12px;
cursor:pointer;
}

.footer{
display:flex;
justify-content:space-around;
margin-top:20px;
padding:18px 0;
background:#fff;
border-radius:22px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
font-size:14px;
font-weight:900;
color:#666;
}

</style>
</head>

<body>

<div class="wrap">

<div class="header">

<div class="back" onclick="location.href='index.html'">
← トップへ戻る
</div>

<div class="title">
🛒 買い物メモ
</div>

<div class="sub">
買い忘れを確認します
</div>

</div>

<div class="card">

<div class="item">
<input type="checkbox" class="check">
<div>
<div class="name">牛乳</div>
<div class="memo">1本</div>
</div>
</div>

<div class="item">
<input type="checkbox" class="check">
<div>
<div class="name">パン</div>
<div class="memo">食パン</div>
</div>
</div>

<div class="item">
<input type="checkbox" class="check">
<div>
<div class="name">薬</div>
<div class="memo">処方薬受け取り</div>
</div>
</div>

<button class="btn">
💾 保存
</button>

</div>

<div class="footer">

<div onclick="location.href='index.html'">
見守り
</div>

<div onclick="location.href='schedule.html'">
予定
</div>

<div onclick="location.href='gomi.html'">
ゴミ
</div>

<div onclick="location.href='news.html'">
地域情報
</div>

</div>

</div>

</body>
</html>
