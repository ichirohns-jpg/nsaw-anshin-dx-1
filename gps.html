<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>現在地送信</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
}

.header{
background:linear-gradient(135deg,#ea580c,#fb923c);
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:36px;
font-weight:900;
}

.card{
background:#fff;
border-radius:30px;
padding:24px;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.btn{
width:100%;
padding:28px;
border:none;
border-radius:24px;
font-size:28px;
font-weight:900;
background:#ea580c;
color:#fff;
cursor:pointer;
}

.result{
background:#f1f5f9;
padding:20px;
border-radius:20px;
font-size:22px;
font-weight:900;
text-align:center;
line-height:1.8;
}

.map{
width:100%;
height:400px;
border:none;
border-radius:20px;
margin-top:12px;
}

</style>

</head>

<body>

<div class="header">
<h1>📍 現在地送信</h1>
</div>

<div class="card">

<button
class="btn"
onclick="sendLocation()">
📍 現在地を送信
</button>

</div>

<div class="card">

<div
id="result"
class="result">

位置情報未取得

</div>

<iframe
id="map"
class="map">
</iframe>

</div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec';

function sendLocation(){

navigator.geolocation.getCurrentPosition(

function(position){

const lat =
position.coords.latitude;

const lng =
position.coords.longitude;

document.getElementById('result').innerHTML =

'緯度：' + lat +
'<br><br>' +
'経度：' + lng;

document.getElementById('map').src =

'https://maps.google.com/maps?q=' +
lat +
',' +
lng +
'&z=16&output=embed';

fetch(
GAS_URL,
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify({
name:'利用者001',
status:'現在地送信',
latitude:lat,
longitude:lng,
time:new Date().toLocaleString('ja-JP')
})
}
);

},

function(){

alert('位置情報取得失敗');

}

);

}

</script>

<a
href="family.html"
class="btn">
👪 家族ページ
</a>

<a
href="index.html"
class="btn">
🏠 トップへ戻る
</a>

</body>
</html>
