<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>現在地送信</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
background:#101827;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
color:#fff;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
padding:30px 20px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
box-shadow:0 12px 30px rgba(0,0,0,.35);
}

.header h1{
font-size:34px;
font-weight:900;
}

.header p{
margin-top:8px;
font-size:16px;
color:#cbd5e1;
font-weight:700;
}

.card{
background:linear-gradient(135deg,#1e293b,#0f172a);
border-radius:28px;
padding:24px;
margin-bottom:18px;
box-shadow:0 12px 30px rgba(0,0,0,.35);
border:1px solid rgba(255,255,255,.12);
}

.result{
font-size:22px;
font-weight:900;
line-height:1.8;
text-align:center;
color:#e5e7eb;
}

.bigIcon{
font-size:70px;
margin-bottom:12px;
}

.btn{
display:block;
width:100%;
padding:28px;
border:none;
border-radius:24px;
font-size:28px;
font-weight:900;
cursor:pointer;
margin-bottom:14px;
color:#fff;
text-decoration:none;
text-align:center;
}

.red{
background:linear-gradient(135deg,#dc2626,#ef4444);
box-shadow:0 10px 24px rgba(220,38,38,.35);
}

.blue{
background:linear-gradient(135deg,#2563eb,#38bdf8);
box-shadow:0 10px 24px rgba(37,99,235,.35);
}

.gray{
background:linear-gradient(135deg,#475569,#334155);
}

.info{
margin-top:16px;
padding:18px;
background:rgba(255,255,255,.05);
border-radius:20px;
font-size:18px;
line-height:1.8;
}

.mapLink{
display:inline-block;
margin-top:14px;
padding:14px 18px;
border-radius:18px;
background:#2563eb;
color:#fff;
text-decoration:none;
font-size:20px;
font-weight:900;
}

</style>
</head>

<body>

<div class="header">
<h1>📍 現在地送信</h1>
<p>家族へ現在地を送ります</p>
</div>

<div class="card">

<div
id="result"
class="result">

<div class="bigIcon">📍</div>

位置情報未送信

</div>

</div>

<button
class="btn red"
onclick="sendGPS()">
📍 現在地を送信
</button>

<a
href="family.html"
class="btn blue">
👪 支援者ページ確認
</a>

<a
href="app.html"
class="btn gray">
🏠 本人ページへ戻る
</a>

<script>

window.onload = function(){

const lastGPS =
localStorage.getItem('lastGPS');

if(lastGPS){

const gps =
JSON.parse(lastGPS);

document.getElementById(
'result'
).innerHTML =

'<div class="bigIcon">✅</div>' +

'位置送信済み<br><br>' +

'送信日時<br>' +

gps.time +

'<br><br>' +

'<a class="mapLink" href="' +
gps.mapUrl +
'" target="_blank">' +
'Googleマップを開く' +
'</a>';

}

};

function sendGPS(){

document.getElementById(
'result'
).innerHTML =

'<div class="bigIcon">⌛</div>' +

'現在地取得中...';

if(!navigator.geolocation){

document.getElementById(
'result'
).innerHTML =

'GPS非対応端末';

return;

}

navigator.geolocation.getCurrentPosition(

function(pos){

const lat =
pos.coords.latitude;

const lng =
pos.coords.longitude;

const mapUrl =
'https://maps.google.com/?q=' +
lat +
',' +
lng;

const now =
new Date().toLocaleString(
'ja-JP'
);

const gpsData = {

lat:lat,
lng:lng,
mapUrl:mapUrl,
time:now

};

localStorage.setItem(
'lastGPS',
JSON.stringify(gpsData)
);

document.getElementById(
'result'
).innerHTML =

'<div class="bigIcon">✅</div>' +

'位置送信完了<br><br>' +

'送信日時<br>' +

now +

'<br><br>' +

'<a class="mapLink" href="' +
mapUrl +
'" target="_blank">' +
'Googleマップを開く' +
'</a>';

},

function(error){

document.getElementById(
'result'
).innerHTML =

'<div class="bigIcon">❌</div>' +

'位置取得失敗';

},

{

enableHighAccuracy:true,
timeout:15000,
maximumAge:0

}

);

}

</script>

</body>
</html>
