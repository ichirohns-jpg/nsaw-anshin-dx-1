<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>GPS・ナビ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
}

.header{
background:linear-gradient(135deg,#dc2626,#ef4444);
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:36px;
font-weight:900;
}

.result{
background:#fff;
padding:24px;
border-radius:24px;
font-size:22px;
font-weight:900;
line-height:1.8;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.btn{
display:block;
width:100%;
padding:26px;
border:none;
border-radius:24px;
font-size:28px;
font-weight:900;
cursor:pointer;
color:#fff;
margin-bottom:14px;
}

.red{
background:#dc2626;
}

.blue{
background:#2563eb;
}

.green{
background:#16a34a;
}

.orange{
background:#ea580c;
}

.purple{
background:#7c3aed;
}

.gray{
background:#475569;
}

</style>

</head>

<body>

<div class="header">
<h1>📍 GPS・ナビ</h1>
</div>

<div
id="result"
class="result">

現在地を取得してください

</div>

<button
class="btn red"
onclick="sendGPS()">

📍 現在地送信

</button>

<button
class="btn blue"
onclick="navigate('病院')">

🏥 病院へ案内

</button>

<button
class="btn green"
onclick="navigate('薬局')">

💊 薬局へ案内

</button>

<button
class="btn orange"
onclick="navigate('避難所')">

🏫 避難所へ案内

</button>

<button
class="btn purple"
onclick="navigate('コンビニ')">

🏪 コンビニへ案内

</button>

<button
class="btn gray"
onclick="location.href='index.html'">

🏠 トップへ戻る

</button>

<script>

function sendGPS(){

if(!navigator.geolocation){

alert(
'GPS未対応'
);

return;

}

navigator.geolocation.getCurrentPosition(

function(pos){

const lat =
pos.coords.latitude;

const lng =
pos.coords.longitude;

const mapUrl =

'https://www.google.com/maps?q=' +

lat +

',' +

lng;

const data = {

lat:lat,

lng:lng,

mapUrl:mapUrl,

time:new Date()
.toLocaleString(
'ja-JP'
)

};

localStorage.setItem(

'lastGPS',

JSON.stringify(data)

);

document.getElementById(
'result'
).innerHTML =

'📍 現在地送信完了<br><br>' +

data.time +

'<br><br>' +

'<a href="' +

mapUrl +

'" target="_blank">地図を見る</a>';

},

function(){

alert(
'GPS取得失敗'
);

}

);

}

function navigate(type){

if(!navigator.geolocation){

window.open(

'https://www.google.com/maps/search/' +

encodeURIComponent(type)

);

return;

}

navigator.geolocation.getCurrentPosition(

function(pos){

const lat =
pos.coords.latitude;

const lng =
pos.coords.longitude;

const url =

'https://www.google.com/maps/search/' +

encodeURIComponent(type) +

'/@' +

lat +

',' +

lng +

',15z';

window.open(
url,
'_blank'
);

}

);

}

</script>

</body>
</html>
