<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>現在地送信</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
}

.header{
background:linear-gradient(135deg,#ea580c,#fb923c);
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:38px;
font-weight:900;
}

.card{
background:#fff;
border-radius:30px;
padding:24px;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.btn{
display:block;
width:100%;
padding:28px;
border:none;
border-radius:24px;
font-size:28px;
font-weight:900;
color:#fff;
cursor:pointer;
text-align:center;
text-decoration:none;
margin-bottom:14px;
}

.orange{
background:#ea580c;
}

.gray{
background:#475569;
}

.result{
background:#f1f5f9;
padding:20px;
border-radius:20px;
font-size:22px;
font-weight:900;
text-align:center;
line-height:1.8;
}

.map{
width:100%;
height:400px;
border:none;
border-radius:20px;
margin-top:12px;
}

</style>

</head>

<body>

<div class="header">
<h1>📍 現在地送信</h1>
</div>

<div class="card">

<button
class="btn orange"
onclick="sendLocation()">
📍 現在地を送信
</button>

</div>

<div class="card">

<div
id="result"
class="result">
位置情報未取得
</div>

<iframe
id="map"
class="map">
</iframe>

</div>

<a
href="family.html"
class="btn gray">
👪 家族ページ
</a>

<a
href="index.html"
class="btn gray">
🏠 トップへ戻る
</a>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec';

function sendLocation(){

navigator.geolocation.getCurrentPosition(

function(position){

const lat =
position.coords.latitude;

const lng =
position.coords.longitude;

document.getElementById('map').src =
'https://maps.google.com/maps?q=' +
lat +
',' +
lng +
'&z=16&output=embed';

document.getElementById('result').innerHTML =
'送信中...';

fetch(
GAS_URL,
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify({

type:'gps',

name:'利用者001',

status:'現在地送信',

latitude:lat,

longitude:lng,

map:
'https://maps.google.com/?q=' +
lat +
',' +
lng,

time:
new Date().toLocaleString('ja-JP')

})
}
)
.then(r=>r.text())
.then(data=>{

document.getElementById('result').innerHTML =

'📍送信完了' +
'<br><br>' +
'緯度：' +
lat +
'<br><br>' +
'経度：' +
lng;

})
.catch(err=>{

document.getElementById('result').innerHTML =
'送信失敗';

});

},

function(){

document.getElementById('result').innerHTML =
'位置情報取得失敗';

}

);

}

</script>

</body>
</html>
