<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>GPS送信</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
}

.header{
background:linear-gradient(135deg,#dc2626,#ef4444);
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:36px;
font-weight:900;
}

.card{
background:#fff;
padding:24px;
border-radius:24px;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.result{
font-size:22px;
font-weight:900;
line-height:1.8;
text-align:center;
}

.btn{
display:block;
width:100%;
padding:28px;
border:none;
border-radius:24px;
font-size:28px;
font-weight:900;
cursor:pointer;
margin-bottom:14px;
color:#fff;
}

.red{
background:#dc2626;
}

.gray{
background:#475569;
}

</style>

</head>

<body>

<div class="header">
<h1>📍 GPS送信</h1>
</div>

<div class="card">

<div
id="result"
class="result">

位置情報未送信

</div>

</div>

<button
class="btn red"
onclick="sendGPS()">
📍 現在地を送信
</button>

<a
href="app.html"
class="btn gray">
🏠 本人ページへ戻る
</a>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec';

function sendGPS(){

document.getElementById(
'result'
).innerHTML =
'位置取得中...';

navigator.geolocation.getCurrentPosition(

function(pos){

const lat =
pos.coords.latitude;

const lng =
pos.coords.longitude;

const mapUrl =
'https://maps.google.com/?q=' +
lat +
',' +
lng;

fetch(
GAS_URL,
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify({
type:'gps',
name:
localStorage.getItem('userName') || '利用者',
lat:lat,
lng:lng,
mapUrl:mapUrl,
time:new Date().toLocaleString('ja-JP')
})
}
);

document.getElementById(
'result'
).innerHTML =

'📍送信完了<br><br>' +

lat +
'<br>' +

lng +
'<br><br>' +

'<a href="' +
mapUrl +
'" target="_blank">Googleマップを開く</a>';

},

function(){

document.getElementById(
'result'
).innerHTML =
'位置取得失敗';

}

);

}

</script>

</body>
</html>
