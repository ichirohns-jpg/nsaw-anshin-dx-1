<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>見守りページ</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#eef3f8;
font-family:
"Hiragino Sans",
"Yu Gothic",
sans-serif;
}

.wrap{
max-width:760px;
margin:auto;
padding:16px;
}

.card{

background:white;

border-radius:24px;

padding:20px;

margin-bottom:18px;

box-shadow:
0 6px 16px rgba(0,0,0,.08);

text-align:center;

}

.name{

font-size:32px;

font-weight:900;

color:#1976d2;

margin-bottom:14px;

}

.sub{

font-size:20px;

font-weight:900;

color:#666;

margin-bottom:18px;

}

.bigBtn{

width:100%;

border:none;

border-radius:24px;

padding:26px;

font-size:30px;

font-weight:900;

color:white;

margin-bottom:18px;

}

.green{
background:#43a047;
}

.orange{
background:#fb8c00;
}

.red{
background:#e53935;
}

.blue{
background:#1976d2;
}

.message{

font-size:24px;

font-weight:900;

color:#43a047;

margin-top:18px;

}

</style>
</head>

<body>

<div class="wrap">

<div class="card">

<div
class="name"
id="personName">

読み込み中...

</div>

<div class="sub">

今日の状態を押してください

</div>

<button
class="bigBtn green"
onclick="sendLog('😊 元気です','😊')">

😊 元気です

</button>

<button
class="bigBtn orange"
onclick="sendLog('💊 朝の薬を飲みました','💊')">

💊 朝の薬を飲みました

</button>

<button
class="bigBtn blue"
onclick="sendLog('😓 少し困っています','😓')">

😓 少し困っています

</button>

<button
class="bigBtn red"
onclick="sendLog('🚨 助けてください','🚨')">

🚨 助けてください

</button>

<div
class="message"
id="message">

</div>

</div>

</div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbzMamJOdxwJ4_WMcpfhMuhg5idmjczXE_XE6QezbsgOUtWSJ3iBDKPTRr2JxCNhRUjh/exec';

const params =
new URLSearchParams(
location.search
);

const targetName =
params.get('name') || '利用者';

document
.getElementById('personName')
.innerHTML =
targetName;

function sendLog(text,emoji){

const url =
GAS_URL
+
'?mode=save'
+
'&name='
+ encodeURIComponent(targetName)
+
'&status='
+ encodeURIComponent(text)
+
'&emoji='
+ encodeURIComponent(emoji)
+
'&area='
+ encodeURIComponent('志木市');

fetch(url)
.then(r=>r.text())
.then(()=>{

document
.getElementById('message')
.innerHTML =
'送信しました';

});

}

</script>

</body>
</html>
