<script>

window.onload=function(){

const userId=
localStorage.getItem('userId') || '001';

const userName=
localStorage.getItem('userName') || '利用者';

const url=
'https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/app.html?id=' +
userId;

document.getElementById(
'userName'
).innerHTML=userName;

document.getElementById(
'urlText'
).innerHTML=url;

document.getElementById(
'qr'
).src=
'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' +
encodeURIComponent(url);

}
</script>
