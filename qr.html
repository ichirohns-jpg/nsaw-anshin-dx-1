<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>QRコード発行</title>

<link rel="icon" href="icon.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
background:linear-gradient(180deg,#000000 0%,#08111d 50%,#000000 100%);
color:#ffffff;
min-height:100vh;
}

.wrap{
max-width:900px;
margin:auto;
padding:16px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:20px;
margin-bottom:16px;
box-shadow:0 10px 30px rgba(0,0,0,.35);
text-align:center;
}

.title{
font-size:34px;
font-weight:900;
margin-bottom:20px;
}

.name{
font-size:26px;
font-weight:900;
margin-bottom:10px;
}

.info{
font-size:14px;
opacity:.8;
margin-bottom:20px;
word-break:break-all;
}

#qrcode{
display:flex;
justify-content:center;
margin:20px 0;
}

button{
width:100%;
border:none;
cursor:pointer;
color:#fff;
font-weight:900;
padding:18px;
border-radius:18px;
font-size:18px;
margin-bottom:10px;
}

.app-btn{
background:linear-gradient(135deg,#00a3c4,#00d4ff);
}

.print-btn{
background:linear-gradient(135deg,#00c853,#00e676);
}

.save-btn{
background:linear-gradient(135deg,#7b1fa2,#ab47bc);
}

.home-btn{
background:linear-gradient(135deg,#455a64,#607d8b);
}

.footer{
text-align:center;
padding:20px;
opacity:.6;
font-size:12px;
}

</style>

</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
📱 QRコード発行
</div>

<div
id="userName"
class="name">
読み込み中...
</div>

<div id="qrcode"></div>

<div
id="urlText"
class="info">
</div>

<button
class="app-btn"
id="openBtn">
😊 本人ページを開く
</button>

<button
class="print-btn"
onclick="window.print()">
🖨 QR印刷
</button>

<button
class="save-btn"
onclick="saveQR()">
📥 QR保存
</button>

<button
class="home-btn"
onclick="location.href='users.html'">
👥 利用者一覧へ戻る
</button>

<button
class="home-btn"
onclick="location.href='index.html'">
🏠 ホームへ戻る
</button>

</div>

<div class="footer">
NSAW QRコード管理
</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

const params =
new URLSearchParams(
location.search
);

const USER_ID =
params.get("id") || "";

async function loadUser(){

try{

const response =
await fetch(
GAS_URL +
"?action=user&id=" +
encodeURIComponent(USER_ID)
);

const json =
await response.json();

const user =
json.data || {};

document.getElementById("userName").innerHTML =
user.name || "利用者";

const appUrl =
"https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/app.html?id=" +
USER_ID;

document.getElementById("urlText").innerHTML =
appUrl;

new QRCode(
document.getElementById("qrcode"),
{
text:appUrl,
width:260,
height:260
}
);

document.getElementById("openBtn").onclick =
function(){

location.href =
"app.html?id=" + USER_ID;

};

}catch(error){

document.getElementById("userName").innerHTML =
"取得エラー";

}

}

function saveQR(){

const canvas =
document.querySelector("#qrcode canvas");

if(!canvas){
return;
}

const link =
document.createElement("a");

link.download =
"qr-" + USER_ID + ".png";

link.href =
canvas.toDataURL("image/png");

link.click();

}

loadUser();

</script>

</body>
</html>
