<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>QRコード発行</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
text-align:center;
}

.header{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
padding:30px;
border-radius:30px;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:#fff;
border-radius:24px;
padding:24px;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

#qrcode{
display:flex;
justify-content:center;
margin:20px 0;
}

.info{
font-size:20px;
font-weight:900;
line-height:1.8;
}

.btn{
display:block;
width:100%;
padding:24px;
border:none;
border-radius:24px;
font-size:26px;
font-weight:900;
cursor:pointer;
text-decoration:none;
text-align:center;
color:#fff;
margin-top:14px;
}

.blue{
background:#2563eb;
}

.gray{
background:#475569;
}

</style>

</head>

<body>

<div class="header">
<h1>📱 QRコード</h1>
</div>

<div class="card">

<div id="qrcode"></div>

<div
id="info"
class="info">
読込中...
</div>

</div>

<a
href="register.html"
class="btn blue">

👤 登録画面へ

</a>

<a
href="index.html"
class="btn gray">

🏠 トップへ戻る

</a>

<script>

const userId =
localStorage.getItem(
'userId'
) || '';

const userName =
localStorage.getItem(
'userName'
) || '';

const address =
localStorage.getItem(
'userAddress'
) || '';

const familyPhone =
localStorage.getItem(
'familyPhone'
) || '';

const familyLine =
localStorage.getItem(
'familyLine'
) || '';

const qrData =

JSON.stringify({

userId:userId,

name:userName,

address:address,

familyPhone:familyPhone,

familyLine:familyLine

});

new QRCode(

document.getElementById(
'qrcode'
),

{
text:qrData,
width:260,
height:260
}

);

document.getElementById(
'info'
).innerHTML =

'氏名：' +
userName +

'<br><br>' +

'住所：' +
address +

'<br><br>' +

'利用者ID：' +
userId;

</script>

</body>
</html>
