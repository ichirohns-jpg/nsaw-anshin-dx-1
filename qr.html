<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>QRコード</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
text-align:center;
}

.header{
background:linear-gradient(135deg,#7c3aed,#6d28d9);
color:#fff;
padding:28px;
border-radius:28px;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:#fff;
padding:24px;
border-radius:24px;
margin-bottom:16px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

#qrcode{
margin:20px auto;
}

.info{
font-size:20px;
font-weight:700;
line-height:1.8;
}

.home{
display:block;
background:#475569;
color:#fff;
text-decoration:none;
padding:20px;
border-radius:20px;
font-size:22px;
font-weight:900;
}

.copyBtn{
width:100%;
border:none;
background:#2563eb;
color:#fff;
padding:20px;
border-radius:20px;
font-size:22px;
font-weight:900;
margin-top:16px;
}

</style>

</head>

<body>

<div class="header">
<h1>📱 QRコード</h1>
</div>

<div class="card">

<div id="qrcode"></div>

<div id="info" class="info">
読込中...
</div>

<button
class="copyBtn"
onclick="copyUrl()">

📋 URLコピー

</button>

</div>

<a
href="index.html"
class="home">

🏠 トップへ戻る

</a>

<script>

const userName =
localStorage.getItem(
'userName'
) || '';

const city =
localStorage.getItem(
'city'
) || '';

const areaCode =
localStorage.getItem(
'areaCode'
) || '';

const qrUrl =
location.origin +
location.pathname
.replace(
'qr.html',
'index.html'
) +
'?user=' +
encodeURIComponent(
userName
);

document.getElementById(
'info'
).innerHTML =

'氏名<br><br>' +

userName +

'<br><br>' +

city +

' ' +

areaCode;

QRCode.toCanvas(

document.getElementById(
'qrcode'
),

qrUrl,

{
width:260,
margin:2
},

function(error){

if(error){

console.error(
error
);

}

}

);

function copyUrl(){

navigator.clipboard.writeText(
qrUrl
);

alert(
'URLをコピーしました'
);

}

</script>

</body>
</html>
