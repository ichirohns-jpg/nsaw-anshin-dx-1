<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>QRコード発行</title>

<link rel="icon" href="icon.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
background:linear-gradient(180deg,#000000 0%,#08111d 50%,#000000 100%);
color:#fff;
min-height:100vh;
}

.wrap{
max-width:800px;
margin:auto;
padding:16px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border-radius:28px;
padding:20px;
margin-bottom:16px;
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
margin-bottom:20px;
}

.name{
font-size:28px;
font-weight:900;
text-align:center;
margin-bottom:10px;
}

.key{
font-size:40px;
font-weight:900;
text-align:center;
color:#00e676;
margin-bottom:20px;
}

#qrcode{
background:#fff;
padding:20px;
border-radius:20px;
display:flex;
justify-content:center;
margin-bottom:20px;
}

button{
width:100%;
padding:20px;
border:none;
border-radius:20px;
font-size:22px;
font-weight:900;
color:#fff;
margin-bottom:10px;
cursor:pointer;
}

.print-btn{
background:linear-gradient(135deg,#00a3c4,#00d4ff);
}

.home-btn{
background:linear-gradient(135deg,#455a64,#607d8b);
}

</style>
</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
📱 支援者用QRコード
</div>

<div
id="userName"
class="name">
読み込み中
</div>

<div
id="supportKey"
class="key">
----
</div>

<div id="qrcode"></div>

<div style="
text-align:center;
font-size:20px;
font-weight:900;
margin-bottom:20px;
">
支援者はQRコードと4桁キーで閲覧
</div>

<button
class="print-btn"
onclick="window.print()">
🖨 印刷
</button>

<button
class="home-btn"
onclick="location.href='users.html'">
👥 利用者一覧
</button>

<button
class="home-btn"
onclick="location.href='index.html'">
🏠 ホーム
</button>

</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

const USER_ID =
new URLSearchParams(
location.search
).get("id") || "";

async function loadUser(){

try{

const response =
await fetch(
GAS_URL +
"?action=user&id=" +
encodeURIComponent(USER_ID)
);

const json =
await response.json();

const user =
json.data || {};

document.getElementById(
"userName"
).innerHTML =
user.name || "利用者";

document.getElementById(
"supportKey"
).innerHTML =
user.supportKey || "----";

const url =
location.origin +
location.pathname.replace(
"qr.html",
"support.html"
) +
"?id=" +
USER_ID;

document.getElementById(
"qrcode"
).innerHTML =
"";

new QRCode(
document.getElementById(
"qrcode"
),
{
text:url,
width:260,
height:260
}
);

}catch(error){

document.getElementById(
"userName"
).innerHTML =
"取得エラー";

}

}

loadUser();

</script>

</body>
</html>
