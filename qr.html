<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>QRコード発行</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:15px;
color:#1f2d3d;
}

.wrap{
max-width:900px;
margin:auto;
}

.header{
background:linear-gradient(135deg,#673ab7,#9575cd);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
font-size:40px;
font-weight:900;
margin-bottom:20px;
}

.card{
background:#fff;
border-radius:28px;
padding:24px;
text-align:center;
box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.name{
font-size:34px;
font-weight:900;
margin-bottom:10px;
}

.address{
font-size:22px;
margin-bottom:20px;
}

.note{
font-size:20px;
font-weight:900;
color:#666;
margin-bottom:20px;
}

#qrcode{
display:flex;
justify-content:center;
margin:20px 0;
}

.btn{
width:100%;
height:90px;
border:none;
border-radius:20px;
font-size:30px;
font-weight:900;
color:#fff;
cursor:pointer;
margin-top:12px;
}

.printBtn{
background:#00c853;
}

.lineBtn{
background:#06c755;
}

.homeBtn{
background:#607d8b;
}

</style>

</head>

<body>

<div class="wrap">

<div class="header">
📱 QRコード発行
</div>

<div class="card">

<div
id="userName"
class="name">
読込中...
</div>

<div
id="userAddress"
class="address">
読込中...
</div>

<div class="note">
家族・支援者用QRコード
</div>

<div id="qrcode"></div>

<button
class="btn printBtn"
onclick="window.print()">
🖨 印刷する
</button>

<button
class="btn lineBtn"
onclick="shareLine()">
📤 LINEで送る
</button>

<button
class="btn homeBtn"
onclick="location.href='index.html'">
🏠 ホームへ戻る
</button>

</div>

</div>

<script>

const name =
localStorage.getItem(
"userName"
) || "";

const city =
localStorage.getItem(
"userCity"
) || "";

const town =
localStorage.getItem(
"userTown"
) || "";

const chome =
localStorage.getItem(
"userChome"
) || "";

document.getElementById(
"userName"
).innerHTML =
name || "利用者";

document.getElementById(
"userAddress"
).innerHTML =

city + " " +
town + " " +
chome;

const qrUrl =

location.origin +

location.pathname.replace(
"qr.html",
"family.html"
) +

"?name=" +

encodeURIComponent(name);

new QRCode(

document.getElementById(
"qrcode"
),

{
text:qrUrl,
width:280,
height:280
}

);

function shareLine(){

location.href =
"https://line.me/R/msg/text/?" +
encodeURIComponent(
"見守りDX QRコード\n" +
qrUrl
);

}

</script>

</body>
</html>
