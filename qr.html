<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>QRコード管理</title>

<link rel="icon" href="icon.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
background:linear-gradient(180deg,#000000 0%,#08111d 50%,#000000 100%);
color:#fff;
min-height:100vh;
}

.wrap{
max-width:760px;
margin:auto;
padding:16px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:20px;
margin-bottom:16px;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
margin-bottom:20px;
}

.name{
font-size:28px;
font-weight:900;
text-align:center;
margin-bottom:15px;
}

#qrcode{
display:flex;
justify-content:center;
padding:20px;
background:#fff;
border-radius:20px;
margin-bottom:15px;
}

.url{
background:rgba(255,255,255,.08);
padding:12px;
border-radius:16px;
font-size:13px;
word-break:break-all;
line-height:1.6;
margin-bottom:12px;
}

button{
width:100%;
border:none;
cursor:pointer;
color:#fff;
font-weight:900;
padding:22px;
border-radius:20px;
font-size:22px;
margin-bottom:12px;
}

.print-btn{
background:linear-gradient(135deg,#00a3c4,#00d4ff);
}

.save-btn{
background:linear-gradient(135deg,#00c853,#00e676);
}

.app-btn{
background:linear-gradient(135deg,#7b1fa2,#ab47bc);
}

.support-btn{
background:linear-gradient(135deg,#2e7d32,#43a047);
}

.home-btn{
background:linear-gradient(135deg,#37474f,#607d8b);
}

.footer{
text-align:center;
padding:20px;
opacity:.6;
font-size:12px;
}

</style>

</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
📱 QRコード
</div>

<div
id="userName"
class="name">
読み込み中...
</div>

<div id="qrcode"></div>

<div
id="urlText"
class="url">
読み込み中...
</div>

<button
class="print-btn"
onclick="window.print()">
🖨 印刷
</button>

<button
class="save-btn"
onclick="saveQR()">
💾 PNG保存
</button>

<button
class="app-btn"
onclick="location.href='app.html?id='+USER_ID">
😊 本人ページ
</button>

<button
class="support-btn"
onclick="location.href='support.html?id='+USER_ID">
👪 支援者ページ
</button>

<button
class="home-btn"
onclick="location.href='users.html'">
👥 利用者一覧
</button>

<button
class="home-btn"
onclick="location.href='index.html'">
🏠 ホームへ戻る
</button>

</div>

<div class="footer">
NSAW QRコード管理
</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

const params =
new URLSearchParams(location.search);

const USER_ID =
params.get("id") || "";

async function loadQR(){

try{

const response =
await fetch(
GAS_URL +
"?action=user&id=" +
encodeURIComponent(USER_ID)
);

const json =
await response.json();

const user =
json.data || {};

document.getElementById("userName").innerHTML =
user.name || "利用者";

const supportUrl =
location.origin +
location.pathname.replace(
"qr.html",
"support.html"
) +
"?id=" +
USER_ID;

document.getElementById("urlText").innerHTML =
supportUrl;

document.getElementById("qrcode").innerHTML =
"";

new QRCode(
document.getElementById("qrcode"),
{
text:supportUrl,
width:260,
height:260
}
);

}catch(error){

document.getElementById("userName").innerHTML =
"取得エラー";

}

}

function saveQR(){

const img =
document.querySelector("#qrcode img");

if(img){

const a =
document.createElement("a");

a.href =
img.src;

a.download =
"qr-" + USER_ID + ".png";

a.click();

return;

}

const canvas =
document.querySelector("#qrcode canvas");

if(canvas){

const a =
document.createElement("a");

a.href =
canvas.toDataURL("image/png");

a.download =
"qr-" + USER_ID + ".png";

a.click();

}

}

loadQR();

</script>

</body>
</html>
