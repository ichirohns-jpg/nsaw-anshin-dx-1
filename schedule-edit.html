<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>予定登録｜見守りDX</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:linear-gradient(
180deg,
#000000 0%,
#0a1220 50%,
#000000 100%
);
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
color:#fff;
min-height:100vh;
}

.wrap{
max-width:760px;
margin:auto;
padding:18px;
}

.header{
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.15);
border-radius:28px;
padding:24px;
margin-bottom:18px;
}

.title{
font-size:38px;
font-weight:900;
}

.sub{
margin-top:8px;
font-size:15px;
opacity:.8;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.15);
border-radius:24px;
padding:20px;
margin-bottom:16px;
}

input,
textarea{
width:100%;
padding:18px;
border:none;
border-radius:18px;
margin-bottom:14px;
font-size:18px;
background:rgba(255,255,255,.12);
color:#fff;
}

textarea{
height:120px;
resize:none;
}

.btn{
width:100%;
border:none;
border-radius:20px;
padding:20px;
font-size:24px;
font-weight:900;
cursor:pointer;
color:#fff;
}

.save{
background:linear-gradient(
135deg,
#00c853,
#00e676
);
}

.home{
background:linear-gradient(
135deg,
#1565c0,
#42a5f5
);
margin-top:12px;
}

#msg{
text-align:center;
font-size:22px;
font-weight:900;
margin-top:20px;
}

.footer{
text-align:center;
padding:20px;
font-size:12px;
opacity:.6;
}

</style>
</head>

<body>

<div class="wrap">

<div class="header">

<div class="title">
📅 予定登録
</div>

<div class="sub">
予定を登録します
</div>

</div>

<div class="card">

<input
id="name"
placeholder="利用者名">

<input
type="date"
id="date">

<input
type="time"
id="time">

<input
id="title"
placeholder="予定内容">

<input
id="place"
placeholder="場所">

<textarea
id="memo"
placeholder="メモ"></textarea>

<button
class="btn save"
onclick="saveSchedule()">
保存する
</button>

<button
class="btn home"
onclick="location.href='index.html'">
ホームへ戻る
</button>

<div id="msg"></div>

</div>

<div class="footer">
NSAW 予定管理
</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbxHknfXsWiwwIhuJ88JFDNRi51jEvD-vgzdeld3YTnfL_0CsrhKmTzxaWUFLVnisRCp/exec";

async function saveSchedule(){

document.getElementById("msg").innerHTML =
"保存中...";

const params =
new URLSearchParams();

params.append(
"action",
"scheduleAdd"
);

params.append(
"name",
document.getElementById("name").value
);

params.append(
"date",
document.getElementById("date").value
);

params.append(
"time",
document.getElementById("time").value
);

params.append(
"title",
document.getElementById("title").value
);

params.append(
"place",
document.getElementById("place").value
);

params.append(
"memo",
document.getElementById("memo").value
);

try{

await fetch(
GAS_URL,
{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:params.toString()
}
);

document.getElementById("msg").innerHTML =
"保存しました";

}catch(error){

document.getElementById("msg").innerHTML =
"保存失敗";

}

}

</script>

</body>
</html>
