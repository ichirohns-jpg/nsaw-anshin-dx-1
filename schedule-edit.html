<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbxHknfXsWiwwIhuJ88JFDNRi51jEvD-vgzdeld3YTnfL_0CsrhKmTzxaWUFLVnisRCp/exec";

async function saveSchedule(){

const name =
document.getElementById("name").value.trim();

const date =
document.getElementById("date").value;

const time =
document.getElementById("time").value;

const title =
document.getElementById("title").value.trim();

const place =
document.getElementById("place").value.trim();

const memo =
document.getElementById("memo").value.trim();

if(name === ""){

document.getElementById("msg").innerHTML =
"利用者名を入力してください";

return;

}

if(date === ""){

document.getElementById("msg").innerHTML =
"予定日を入力してください";

return;

}

if(title === ""){

document.getElementById("msg").innerHTML =
"予定内容を入力してください";

return;

}

document.getElementById("msg").innerHTML =
"保存中...";

const params =
new URLSearchParams();

params.append(
"action",
"scheduleAdd"
);

params.append(
"name",
name
);

params.append(
"date",
date
);

params.append(
"time",
time
);

params.append(
"title",
title
);

params.append(
"place",
place
);

params.append(
"memo",
memo
);

try{

const response =
await fetch(
GAS_URL,
{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:params.toString()
}
);

const result =
await response.text();

if(
response.ok &&
result.indexOf("ERROR") === -1
){

document.getElementById("msg").innerHTML =
"保存しました";

document.getElementById("title").value =
"";

document.getElementById("place").value =
"";

document.getElementById("memo").value =
"";

}else{

document.getElementById("msg").innerHTML =
"保存失敗";

}

}catch(error){

document.getElementById("msg").innerHTML =
"通信エラー";

}

}

</script>
