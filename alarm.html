<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>お薬アラーム｜見守りDX</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:560px;
margin:auto;
padding:16px;
}

.header{
background:#7b1fa2;
color:#fff;
border-radius:26px;
padding:22px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.back{
font-size:16px;
font-weight:900;
margin-bottom:12px;
cursor:pointer;
}

.title{
font-size:34px;
font-weight:900;
}

.sub{
font-size:16px;
margin-top:6px;
opacity:.95;
}

.card{
background:#fff;
border-radius:26px;
padding:20px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.label{
font-size:22px;
font-weight:900;
color:#7b1fa2;
margin-bottom:10px;
}

.time{
width:100%;
border:none;
outline:none;
background:#f7f1fb;
border-radius:18px;
padding:20px;
font-size:32px;
font-weight:900;
margin-bottom:18px;
}

.btn{
width:100%;
border:none;
border-radius:24px;
padding:22px;
font-size:28px;
font-weight:900;
color:#fff;
background:#7b1fa2;
cursor:pointer;
}

.btn:active{
transform:scale(.97);
}

.result{
margin-top:18px;
font-size:24px;
font-weight:900;
text-align:center;
color:#444;
line-height:1.7;
}

.footer{
display:flex;
justify-content:space-around;
margin-top:20px;
padding:18px 0;
background:#fff;
border-radius:22px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
font-size:14px;
font-weight:900;
color:#666;
}

</style>
</head>

<body>

<div class="wrap">

<div class="header">

<div class="back" onclick="location.href='index.html'">
← トップへ戻る
</div>

<div class="title">
⏰ お薬アラーム
</div>

<div class="sub">
薬の時間を設定します
</div>

</div>

<div class="card">

<div class="label">
朝の薬
</div>

<input type="time" id="morning" class="time">

<div class="label">
昼の薬
</div>

<input type="time" id="noon" class="time">

<div class="label">
夜の薬
</div>

<input type="time" id="night" class="time">

<button class="btn" onclick="saveAlarm()">
💾 保存
</button>

<div class="result" id="result">
未設定
</div>

</div>

<div class="footer">

<div onclick="location.href='index.html'">
見守り
</div>

<div onclick="location.href='calendar.html'">
予定
</div>

<div onclick="location.href='gomi.html'">
ゴミ
</div>

<div onclick="location.href='news.html'">
地域情報
</div>

</div>

</div>

<script>

window.onload=function(){

const morning=localStorage.getItem("alarmMorning");
const noon=localStorage.getItem("alarmNoon");
const night=localStorage.getItem("alarmNight");

if(morning){
document.getElementById("morning").value=morning;
}

if(noon){
document.getElementById("noon").value=noon;
}

if(night){
document.getElementById("night").value=night;
}

showResult();

};

function saveAlarm(){

localStorage.setItem(
"alarmMorning",
document.getElementById("morning").value
);

localStorage.setItem(
"alarmNoon",
document.getElementById("noon").value
);

localStorage.setItem(
"alarmNight",
document.getElementById("night").value
);

showResult();

alert("保存しました");

}

function showResult(){

const morning=localStorage.getItem("alarmMorning")||"--:--";
const noon=localStorage.getItem("alarmNoon")||"--:--";
const night=localStorage.getItem("alarmNight")||"--:--";

document.getElementById("result").innerHTML=
"朝："+morning+"<br>"+
"昼："+noon+"<br>"+
"夜："+night;

}

</script>

</body>
</html>
