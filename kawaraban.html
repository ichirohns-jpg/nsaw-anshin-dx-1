<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>4市瓦版</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#f4f6f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2937;
}

header{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
padding:24px;
text-align:center;
font-size:32px;
font-weight:900;
position:sticky;
top:0;
z-index:999;
}

.wrap{
max-width:1000px;
margin:auto;
padding:15px;
}

.card{
background:#fff;
border-radius:24px;
overflow:hidden;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.thumb{
width:100%;
aspect-ratio:16/9;
object-fit:cover;
background:#ddd;
}

.body{
padding:18px;
}

.title{
font-size:24px;
font-weight:900;
line-height:1.5;
margin-bottom:10px;
}

.desc{
font-size:18px;
line-height:1.7;
color:#475569;
margin-bottom:12px;
}

.date{
font-size:14px;
color:#94a3b8;
margin-bottom:12px;
}

.readBtn{
display:block;
background:#2563eb;
color:#fff;
text-decoration:none;
padding:16px;
text-align:center;
border-radius:14px;
font-size:20px;
font-weight:900;
}

.sectionTitle{
font-size:28px;
font-weight:900;
margin:24px 0 14px;
}

.home{
display:block;
background:#475569;
color:#fff;
text-decoration:none;
padding:18px;
text-align:center;
border-radius:18px;
font-size:22px;
font-weight:900;
margin-top:20px;
}

</style>

<script>

const SHEET_ID =
'149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc';

const SHEET_NAME =
'4市瓦版';

const url =
'https://docs.google.com/spreadsheets/d/' +
SHEET_ID +
'/gviz/tq?sheet=' +
encodeURIComponent(SHEET_NAME) +
'&tqx=out:json';

function getVal(c){

if(!c) return '';

return c.f || c.v || '';

}

function loadSheet(){

const s =
document.createElement('script');

s.src =
url +
'&callback=handleSheet';

document.body.appendChild(s);

}

function handleSheet(json){

const rows =
json.table.rows;

rows.reverse();

let latest='';
let archive='';

rows.forEach((row,index)=>{

const id =
getVal(row.c[0]);

const title =
getVal(row.c[1]);

const desc =
getVal(row.c[2]);

const image =
getVal(row.c[3]);

const date =
getVal(row.c[4]);

const html =

'<div class="card">' +

(image ?
'<img class="thumb" src="' +
image +
'">' : '') +

'<div class="body">' +

'<div class="title">' +
title +
'</div>' +

'<div class="desc">' +
desc +
'</div>' +

'<div class="date">' +
date +
'</div>' +

'<a class="readBtn" href="app.html?id=' +
id +
'">続きを読む</a>' +

'</div>' +

'</div>';

if(index < 5){

latest += html;

}else{

archive += html;

}

});

document.getElementById(
'latest'
).innerHTML = latest;

document.getElementById(
'archive'
).innerHTML = archive;

}

window.onload =
loadSheet;

</script>

</head>

<body>

<header>
📰 4市瓦版
</header>

<div class="wrap">

<div id="latest">
読込中...
</div>

<div class="sectionTitle">
📚 アーカイブ
</div>

<div id="archive"></div>

<a href="index.html" class="home">
🏠 トップへ戻る
</a>

</div>

</body>
</html>
