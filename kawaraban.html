<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>４市瓦版</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
background:linear-gradient(180deg,#050505 0%,#101827 50%,#000000 100%);
color:#fff;
min-height:100vh;
}

header{
text-align:center;
padding:25px 10px;
}

.logo{
font-size:34px;
font-weight:900;
letter-spacing:3px;
}

.sub{
margin-top:8px;
font-size:14px;
opacity:.8;
}

.wrap{
max-width:760px;
margin:auto;
padding:18px;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.15);
border-radius:24px;
padding:18px;
margin-bottom:16px;
box-shadow:0 8px 24px rgba(0,0,0,.35);
}

.item{
background:rgba(255,255,255,.08);
border-radius:18px;
padding:14px;
margin-bottom:12px;
}

.thumb{
width:100%;
height:180px;
object-fit:cover;
border-radius:14px;
margin-bottom:10px;
}

.city{
font-size:14px;
color:#ffd54f;
font-weight:900;
margin-bottom:6px;
}

.date{
font-size:13px;
opacity:.7;
margin-bottom:5px;
}

.title{
font-size:22px;
font-weight:900;
margin-bottom:8px;
}

.desc{
font-size:15px;
line-height:1.6;
margin-bottom:10px;
}

.link{
display:inline-block;
padding:10px 16px;
border-radius:12px;
background:#1976d2;
color:#fff;
text-decoration:none;
font-weight:900;
}

button{
width:100%;
border:none;
border-radius:20px;
padding:18px;
font-size:22px;
font-weight:900;
cursor:pointer;
color:#fff;
margin-bottom:12px;
}

.home-btn{
background:linear-gradient(135deg,#455a64,#78909c);
}

.top-btn{
background:linear-gradient(135deg,#263238,#546e7a);
}

.footer{
text-align:center;
padding:25px;
font-size:12px;
opacity:.6;
}

</style>
</head>

<body>

<header>

<div class="logo">
４市瓦版
</div>

<div class="sub">
SHIKI / NIIZA / ASAKA / WAKO
</div>

</header>

<div class="wrap">

<div class="card">

<div id="list">
読み込み中...
</div>

</div>

<div class="card">

<button
class="home-btn"
onclick="location.href='index.html'">
ホームへ戻る
</button>

<button
class="top-btn"
onclick="window.scrollTo({top:0,behavior:'smooth'})">
先頭へ戻る
</button>

</div>

<div class="footer">
NSAW ４市瓦版
</div>

</div>

<script>

const ITEMS = [

{
city:"志木市",
date:"今日",
title:"４市瓦版",
description:"志木市の最新情報を掲載します。",
image:"family-top.jpg",
url:"#"
},

{
city:"新座市",
date:"今日",
title:"地域ニュース",
description:"新座市の暮らし情報。",
image:"map-top.jpg",
url:"#"
},

{
city:"朝霞市",
date:"今日",
title:"生活情報",
description:"朝霞市の地域情報。",
image:"schedule-top.jpg",
url:"#"
},

{
city:"和光市",
date:"今日",
title:"お知らせ",
description:"和光市の最新情報。",
image:"medicine-top.jpg",
url:"#"
}

];

let html="";

ITEMS.forEach(d=>{

html += `
<div class="item">

<img
class="thumb"
src="${d.image}">

<div class="city">
${d.city}
</div>

<div class="date">
${d.date}
</div>

<div class="title">
${d.title}
</div>

<div class="desc">
${d.description}
</div>

<a
class="link"
href="${d.url}"
target="_blank">
記事を見る
</a>

</div>
`;

});

document.getElementById("list").innerHTML =
html;

</script>

</body>
</html>
