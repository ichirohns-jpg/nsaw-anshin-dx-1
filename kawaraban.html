<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>4市瓦版</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}

.header{
background:linear-gradient(135deg,#0f172a,#334155);
color:#fff;
padding:30px;
text-align:center;
}

.header h1{
font-size:40px;
font-weight:900;
}

.wrap{
max-width:1000px;
margin:auto;
padding:18px;
}

.card{
background:#fff;
border-radius:28px;
overflow:hidden;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.photo{
width:100%;
height:240px;
object-fit:cover;
}

.body{
padding:20px;
}

.city{
font-size:18px;
font-weight:900;
color:#2563eb;
margin-bottom:8px;
}

.title{
font-size:28px;
font-weight:900;
margin-bottom:12px;
}

.desc{
font-size:20px;
line-height:1.8;
}

.btn{
display:block;
margin-top:16px;
padding:18px;
text-align:center;
background:#2563eb;
color:#fff;
text-decoration:none;
border-radius:18px;
font-size:22px;
font-weight:900;
}

</style>

</head>

<body>

<div class="header">
<h1>📰 4市瓦版</h1>
</div>

<div class="wrap">

<div id="newsList">
読込中...
</div>

<script>

const SHEET_ID =
"149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc";

const SHEET_NAME =
"4市瓦版";

const url =
"https://docs.google.com/spreadsheets/d/" +
SHEET_ID +
"/gviz/tq?sheet=" +
encodeURIComponent(SHEET_NAME) +
"&tqx=out:json";

function getVal(cell){
return cell ? (cell.v || cell.f || "") : "";
}

window.handleSheet =
function(json){

const rows =
json.table.rows || [];

rows.reverse();

let html = "";

rows.forEach(row=>{

const c =
row.c || [];

const city =
getVal(c[1]);

const title =
getVal(c[2]);

const desc =
getVal(c[3]);

const link =
getVal(c[4]);

const image =
getVal(c[5]);

html += `

<div class="card">

<img
class="photo"
src="${image}">

<div class="body">

<div class="city">
${city}
</div>

<div class="title">
${title}
</div>

<div class="desc">
${desc}
</div>

<a
href="${link}"
target="_blank"
class="btn">
記事を見る
</a>

</div>

</div>

`;

});

document.getElementById(
"newsList"
).innerHTML = html;

};

const script =
document.createElement("script");

script.src =
url +
"&callback=handleSheet";

document.body.appendChild(script);

</script>

</div>

</body>
</html>
