<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>4市瓦版｜あんしん生活DX</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:#eef4f8;
color:#123;
padding:16px;
}

.wrap{
max-width:760px;
margin:auto;
}

.header{
background:#4a148c;
color:white;
padding:20px;
border-radius:24px;
text-align:center;
font-size:28px;
font-weight:900;
margin-bottom:16px;
}

.card{
background:white;
border-radius:24px;
padding:20px;
margin-bottom:16px;
box-shadow:0 8px 22px rgba(0,0,0,.08);
}

.title{
font-size:26px;
font-weight:900;
margin-bottom:10px;
}

.text{
font-size:18px;
line-height:1.6;
font-weight:700;
white-space:pre-wrap;
}
</style>

</head>

<body>

<div class="wrap">

<div class="header">
📰 4市瓦版
</div>

<div id="content">
読み込み中...
</div>

</div>

<script>

async function loadKawa(){

const url = "https://script.google.com/macros/s/AKfycbxsgeub9qA9q5EnfZgOEVah2H5YC9dEy_n2UqMkviD8Wy5IcVsL-CsMmNE0ZvDMbGFd/exec";

try{

const res = await fetch(url);
const data = await res.json();

// ★ 4市だけ表示（kawa）
const items = data.filter(d => d.type === "kawa");

let html = "";

items.forEach(d => {

html += `
<div class="card">
<div class="title">${d.title || ""}</div>
<div class="text">${d.text || ""}</div>
</div>
`;

});

document.getElementById("content").innerHTML = html;

}catch(e){

document.getElementById("content").innerHTML =
"<div class='card'>読み込みエラー</div>";

}

}

loadKawa();

</script>

</body>
</html>
