<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>4市瓦版 デジタルお助け掲示板</title>

<style>
:root{
--primary:#005bac;
--navy:#0f172a;
--blue:#2563eb;
--bg:#eef2f7;
--card:#ffffff;
--text:#111827;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:"Helvetica Neue",Arial,"Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
background:var(--bg);
color:var(--text);
line-height:1.6;
padding:10px;
}

.container{
max-width:520px;
margin:0 auto;
}

header{
background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
color:#fff;
text-align:center;
padding:20px 12px;
border-radius:18px;
margin-bottom:18px;
font-size:26px;
font-weight:900;
box-shadow:0 10px 28px rgba(0,0,0,.22);
}

header .sub{
font-size:14px;
font-weight:700;
margin-top:4px;
opacity:.95;
}

.section-title{
font-size:24px;
font-weight:900;
margin:20px 0 14px;
border-left:8px solid var(--blue);
padding-left:12px;
color:#0f172a;
}

#news-container{
display:flex;
flex-direction:column;
gap:24px;
}

.card{
background:var(--card);
border-radius:28px;
box-shadow:0 14px 35px rgba(0,0,0,.14);
overflow:hidden;
border:1px solid #e5e7eb;
}

.image-container{
position:relative;
width:100%;
padding-top:177.77%;
background:#e5e7eb;
overflow:hidden;
}

.image-container img{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
object-position:center;
}

.card-content{
padding:20px;
}

.card-tag{
display:inline-block;
background:#e3f2fd;
color:var(--primary);
font-size:16px;
padding:7px 12px;
border-radius:999px;
margin-bottom:12px;
font-weight:900;
}

.card-title{
font-size:28px;
font-weight:900;
line-height:1.4;
margin-bottom:12px;
color:#111827;
}

.card-text{
font-size:21px;
line-height:1.85;
color:#475569;
margin-bottom:16px;
white-space:pre-wrap;
}

.btn-link{
display:block;
text-align:center;
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
text-decoration:none;
padding:18px;
border-radius:18px;
font-size:22px;
font-weight:900;
margin-top:8px;
box-shadow:0 8px 18px rgba(37,99,235,.28);
}

.home{
display:block;
width:100%;
border:none;
background:#475569;
color:#fff;
padding:18px;
border-radius:18px;
font-size:22px;
font-weight:900;
margin:24px 0 10px;
}

.loading{
text-align:center;
background:#fff;
padding:24px;
border-radius:22px;
font-size:22px;
font-weight:900;
color:#475569;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}
</style>
</head>

<body>

<div class="container">

<header>
4市瓦版
<div class="sub">志木市・朝霞市・新座市・和光市</div>
</header>

<div class="section-title">最新の回覧板データー</div>

<div id="news-container">
<div class="loading">データを読み込み中...</div>
</div>

<button class="home" onclick="location.href='https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/'">
🏠 トップへ戻る
</button>

</div>

<script>
const SPREADSHEET_ID='149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc';
const SHEET_NAME='回覧板データー';

function getCell(row,index){
if(index<0) return '';
if(!row.c[index]) return '';
return row.c[index].f || row.c[index].v || '';
}

function esc(text){
return String(text || '')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#39;');
}

function makeImageUrl(url){
url=String(url || '').trim();

if(url.includes('drive.google.com')){
let match=url.match(/\/file\/d\/([^\/]+)/);
if(match && match[1]){
return 'https://docs.google.com/uc?export=view&id=' + match[1];
}

match=url.match(/\/d\/([^\/]+)/);
if(match && match[1]){
return 'https://docs.google.com/uc?export=view&id=' + match[1];
}

match=url.match(/[?&]id=([^&]+)/);
if(match && match[1]){
return 'https://docs.google.com/uc?export=view&id=' + match[1];
}
}

return url;
}

function findHeader(headers,names){
for(let i=0;i<headers.length;i++){
for(let j=0;j<names.length;j++){
if(headers[i].includes(names[j])){
return i;
}
}
}
return -1;
}

window.handleSheet=function(json){

const container=document.getElementById('news-container');
container.innerHTML='';

if(!json || !json.table || !json.table.rows){
container.innerHTML='<div class="loading">データがありません。</div>';
return;
}

const headers=json.table.cols.map(function(col){
return col.label ? col.label.trim().replace(/\s+/g,'') : '';
});

const idxTitle=findHeader(headers,['タイトル','件名','見出し']);
const idxImg=findHeader(headers,['画像URL','画像','写真URL','写真']);
const idxContent=findHeader(headers,['詳細内容','内容','本文','説明']);
const idxLink=findHeader(headers,['市ホームページURL','市ホームURL','公式URL','リンク','URL']);

const rows=json.table.rows.slice().reverse();

rows.forEach(function(row){

if(!row.c) return;

const title=getCell(row,idxTitle);
let imgUrl=makeImageUrl(getCell(row,idxImg));
const content=getCell(row,idxContent);
const linkUrl=getCell(row,idxLink);

if(!title && !content) return;

const card=document.createElement('div');
card.className='card';

card.innerHTML=
(imgUrl
? '<div class="image-container"><img src="'+esc(imgUrl)+'" alt="'+esc(title)+'"></div>'
: ''
) +
'<div class="card-content">' +
'<span class="card-tag">朝霞地区4市広域連携</span>' +
'<div class="card-title">'+esc(title || 'お知らせ')+'</div>' +
'<div class="card-text">'+esc(content)+'</div>' +
(linkUrl
? '<a href="'+esc(linkUrl)+'" class="btn-link" target="_blank">詳細リンク（公式HP）へ</a>'
: ''
) +
'</div>';

container.appendChild(card);

});

if(container.children.length===0){
container.innerHTML='<div class="loading">現在、表示できる回覧板データーはありません。</div>';
}

};

function loadSheet(){
const script=document.createElement('script');
script.src=
'https://docs.google.com/spreadsheets/d/' +
SPREADSHEET_ID +
'/gviz/tq?sheet=' +
encodeURIComponent(SHEET_NAME) +
'&tqx=out:json;responseHandler:handleSheet';
document.body.appendChild(script);
}

window.onload=loadSheet;
</script>

</body>
</html>
