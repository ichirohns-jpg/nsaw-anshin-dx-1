<script>

const SHEET_ID =
"149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc";

const SHEET_NAME =
"4市瓦版";

const GVIZ_URL =
"https://docs.google.com/spreadsheets/d/"
+ SHEET_ID +
"/gviz/tq?sheet="
+ encodeURIComponent(SHEET_NAME)
+ "&tqx=out:json";

function getCell(row,index){

if(!row || !row.c || !row.c[index]){
return "";
}

const c=row.c[index];

if(c.v!==undefined && c.v!==null){
return c.v;
}

if(c.f!==undefined && c.f!==null){
return c.f;
}

return "";

}

function formatDate(value){

if(!value)return "";

const text=
String(value).trim();

let m=
text.match(/Date\((\d+),(\d+),(\d+)\)/);

if(m){

return m[1]
+"年"
+(Number(m[2])+1)
+"月"
+m[3]
+"日";

}

return text;

}

function parseGViz(text){

const match=
text.match(/\{[\s\S]*\}/);

if(!match){

throw new Error(
"GViz取得失敗"
);

}

return JSON.parse(match[0]);

}

function makeShareUrl(id){

return
"https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/share-kawaraban-v2.html?kawaraban="
+ encodeURIComponent(id);

}

function shareFacebook(url){

window.open(
"https://www.facebook.com/sharer/sharer.php?u="
+ encodeURIComponent(url),
"_blank"
);

}

function shareLine(url){

window.open(
"https://social-plugins.line.me/lineit/share?url="
+ encodeURIComponent(url),
"_blank"
);

}

function shareX(url,text){

window.open(
"https://twitter.com/intent/tweet?url="
+ encodeURIComponent(url)
+ "&text="
+ encodeURIComponent(text),
"_blank"
);

}

function copyUrl(url){

navigator.clipboard.writeText(url);

alert("URLをコピーしました");

}

fetch(GVIZ_URL)

.then(function(response){

return response.text();

})

.then(function(text){

const json =
parseGViz(text);

const rows =
json.table.rows || [];

let items=[];

for(
let i=0;
i<rows.length;
i++
){

const row=
rows[i];

const date=
formatDate(
getCell(row,0)
);

const image=
getCell(row,1);

const title=
getCell(row,2);

const desc=
getCell(row,3);

if(
!date &&
!image &&
!title &&
!desc
){
continue;
}

items.push({

id:i+1,

date:date,

image:image,

title:title,

desc:desc

});

}

items.reverse();

let html="";

items.forEach(function(item){

const shareUrl=
makeShareUrl(item.id);

const shareText=
item.title || "4市瓦版";

html+=`

<div class="card">

${
item.image
?
`
<img
src="${item.image}"
class="thumb"
loading="lazy">
`
:
''
}

<div class="date">
${item.date}
</div>

<div class="tag">
4市瓦版
</div>

<div class="title">
${item.title}
</div>

<div class="desc">
${item.desc}
</div>

<div class="share">

<button onclick="shareLine('${shareUrl}')">

💬 LINEで送る

</button>

<button onclick="copyUrl('${shareUrl}')">

📋 URLをコピー

</button>

<button onclick="shareFacebook('${shareUrl}')">

📘 Facebookへ投稿

</button>

<button onclick="shareX('${shareUrl}','${String(shareText).replace(/'/g,"\\'")}')">

✖ Xへ投稿

</button>

</div>

</div>

`;

});

document.getElementById("app").innerHTML=

html ||

"<div class='loading'>記事がありません</div>";

})

.catch(function(err){

document.getElementById("app").innerHTML=

"<div class='loading'>読込失敗</div>";

console.error(err);

});

</script>

</body>
</html>
