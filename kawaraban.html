<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>4市瓦版</title>

<style>
:root{
--primary:#005bac;
--navy:#0f172a;
--blue:#2563eb;
--bg:#eef2f7;
--card:#ffffff;
--text:#111827;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
background:var(--bg);
color:var(--text);
padding:10px;
}

.container{
max-width:520px;
margin:auto;
}

header{
background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
color:#fff;
text-align:center;
padding:24px;
border-radius:24px;
margin-bottom:20px;
font-size:34px;
font-weight:900;
box-shadow:0 12px 30px rgba(0,0,0,.25);
}

.sub{
font-size:16px;
margin-top:8px;
font-weight:700;
}

.section-title{
font-size:38px;
font-weight:900;
margin:20px 0;
border-left:10px solid #2563eb;
padding-left:14px;
}

#news-container{
display:flex;
flex-direction:column;
gap:24px;
}

.card{
background:#fff;
border-radius:30px;
overflow:hidden;
box-shadow:0 15px 40px rgba(0,0,0,.15);
border:1px solid #e5e7eb;
}

.image-container{
position:relative;
width:100%;
padding-top:177.77%;
background:#e5e7eb;
overflow:hidden;
}

.image-container img{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
object-position:center;
}

.card-content{
padding:20px;
}

.city-tag{
display:inline-block;
background:#dbeafe;
color:#1d4ed8;
padding:8px 14px;
border-radius:999px;
font-size:16px;
font-weight:900;
margin-bottom:12px;
}

.card-title{
font-size:34px;
font-weight:900;
line-height:1.4;
margin-bottom:14px;
}

.card-text{
font-size:24px;
line-height:1.8;
color:#475569;
margin-bottom:18px;
white-space:pre-wrap;
}

.btn-link{
display:block;
text-align:center;
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
text-decoration:none;
padding:20px;
border-radius:18px;
font-size:24px;
font-weight:900;
margin-bottom:12px;
}

.share-row{
display:flex;
gap:10px;
margin-top:16px;
}

.share-row a{
flex:1;
text-align:center;
padding:14px;
border-radius:14px;
font-size:18px;
font-weight:900;
text-decoration:none;
color:#fff;
}

.share-line{
background:#06c755;
}

.share-x{
background:#000;
}

.share-fb{
background:#1877f2;
}

.home{
display:block;
width:100%;
border:none;
background:#475569;
color:#fff;
padding:20px;
border-radius:20px;
font-size:24px;
font-weight:900;
margin-top:24px;
}

.loading{
background:#fff;
padding:30px;
border-radius:24px;
text-align:center;
font-size:24px;
font-weight:900;
}

.error{
background:#fee2e2;
color:#991b1b;
padding:20px;
border-radius:20px;
font-weight:900;
}
</style>

</head>

<body>

<div class="container">

<header>
📰 4市瓦版
<div class="sub">
志木市・朝霞市・新座市・和光市
</div>
</header>

<div class="section-title">
最新の回覧板データー
</div>

<div id="news-container">
<div class="loading">
読込中...
</div>
</div>

<button
class="home"
onclick="location.href='https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/'">
🏠 トップへ戻る
</button>

</div>

<script>
const SHEET_ID='149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc';
const SHEET_NAME='4市瓦版';

function getVal(cell){
if(!cell) return '';
return cell.f || cell.v || '';
}

function esc(text){
return String(text || '')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#39;');
}

function makeImageUrl(url){

url=String(url || '').trim();

if(url.includes('/file/d/')){
const id=url.split('/file/d/')[1].split('/')[0];
return 'https://docs.google.com/uc?export=view&id='+id;
}

return url;
}

window.handleSheet=function(json){

const container=document.getElementById('news-container');

if(!json || !json.table || !json.table.rows){

container.innerHTML=
'<div class="error">データ取得失敗</div>';

return;
}

const rows=json.table.rows.slice().reverse();

container.innerHTML='';

rows.forEach(function(row){

if(!row.c) return;

const date=getVal(row.c[0]);
const image=makeImageUrl(getVal(row.c[1]));
const title=getVal(row.c[2]);
const content=getVal(row.c[3]);

const shikiTitle=getVal(row.c[4]);
const shikiUrl=getVal(row.c[5]);

const niizaTitle=getVal(row.c[6]);
const niizaUrl=getVal(row.c[7]);

const asakaTitle=getVal(row.c[8]);
const asakaUrl=getVal(row.c[9]);

const wakoTitle=getVal(row.c[10]);
const wakoUrl=getVal(row.c[11]);

if(
!title &&
!content &&
!image
){
return;
}

const shareUrl=
'https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/kawaraban.html';

const card=document.createElement('div');

card.className='card';

card.innerHTML=

(image
?'<div class="image-container"><img src="'+esc(image)+'"></div>'
:''
)+

'<div class="card-content">'+

'<div class="city-tag">4市瓦版</div>'+

'<div class="card-title">'+
esc(title)+
'</div>'+

'<div style="font-size:18px;color:#64748b;font-weight:700;margin-bottom:12px;">'+
esc(date)+
'</div>'+

'<div class="card-text">'+
esc(content)+
'</div>'+

(shikiTitle
?'<a class="btn-link" target="_blank" href="'+esc(shikiUrl)+'">志木市：'+esc(shikiTitle)+'</a>'
:''
)+

(niizaTitle
?'<a class="btn-link" target="_blank" href="'+esc(niizaUrl)+'">新座市：'+esc(niizaTitle)+'</a>'
:''
)+

(asakaTitle
?'<a class="btn-link" target="_blank" href="'+esc(asakaUrl)+'">朝霞市：'+esc(asakaTitle)+'</a>'
:''
)+

(wakoTitle
?'<a class="btn-link" target="_blank" href="'+esc(wakoUrl)+'">和光市：'+esc(wakoTitle)+'</a>'
:''
)+

'<div class="share-row">'+

'<a class="share-line" target="_blank" href="https://social-plugins.line.me/lineit/share?url='+
encodeURIComponent(shareUrl)+
'">LINE</a>'+

'<a class="share-x" target="_blank" href="https://twitter.com/intent/tweet?url='+
encodeURIComponent(shareUrl)+
'&text='+
encodeURIComponent(title)+
'">X</a>'+

'<a class="share-fb" target="_blank" href="https://www.facebook.com/sharer/sharer.php?u='+
encodeURIComponent(shareUrl)+
'">FB</a>'+

'</div>'+

'</div>';

container.appendChild(card);

});

if(container.children.length===0){

container.innerHTML=
'<div class="error">記事が見つかりません</div>';

}

};

function loadSheet(){

const script=document.createElement('script');

script.src=
'https://docs.google.com/spreadsheets/d/'+
SHEET_ID+
'/gviz/tq?sheet='+
encodeURIComponent(SHEET_NAME)+
'&tqx=out:json;responseHandler:handleSheet';

document.body.appendChild(script);

}

window.onload=loadSheet;

</script>

</body>
</html>
