<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>4市瓦版</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
color:#1f2d3d;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
color:#fff;
padding:30px;
border-radius:30px;

margin-bottom:18px;
}

.header h1{

font-weight:900;
}

.card{
background:#fff;
border-radius:30px;
overflow:hidden;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.photo{
width:100%;
height:220px;
object-fit:cover;
}

.body{
padding:20px;
}

.city{
font-size:18px;
font-weight:900;
color:#2563eb;
margin-bottom:8px;
}

.title{
font-size:28px;
font-weight:900;
margin-bottom:10px;
}

.desc{
font-size:20px;
line-height:1.7;
}

.btn{
display:block;
margin-top:16px;
padding:18px;
text-align:center;
background:#2563eb;
color:#fff;
text-decoration:none;
border-radius:18px;
font-size:22px;
font-weight:900;
}

.back{
background:#475569;
}

</style>

</head>

<body>

<div class="header">
<h1>📰 4市瓦版</h1>
</div>

<div class="card">

<img

<div class="city">
志木市
</div>

</div>

</a>

</div>

</div>

<a href="index.html" class="btn back">
