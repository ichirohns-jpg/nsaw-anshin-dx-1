<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>4市瓦版</title>

<style>
:root{
--primary:#005bac;
--navy:#0f172a;
--blue:#2563eb;
--bg:#eef2f7;
--card:#ffffff;
--text:#111827;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:"Helvetica Neue",Arial,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
background:var(--bg);
color:var(--text);
line-height:1.6;
padding:10px;
}

.container{
max-width:520px;
margin:0 auto;
}

header{
background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
color:#fff;
text-align:center;
padding:22px;
border-radius:24px;
margin-bottom:20px;
font-size:34px;
font-weight:900;
box-shadow:0 12px 30px rgba(0,0,0,.25);
}

.sub{
font-size:16px;
margin-top:8px;
font-weight:700;
}

.section-title{
font-size:38px;
font-weight:900;
margin:20px 0;
border-left:10px solid #2563eb;
padding-left:14px;
}

#news-container{
display:flex;
flex-direction:column;
gap:24px;
}

.card{
background:#fff;
border-radius:30px;
overflow:hidden;
box-shadow:0 15px 40px rgba(0,0,0,.15);
border:1px solid #e5e7eb;
}

.image-container{
position:relative;
width:100%;
padding-top:177.77%;
background:#e5e7eb;
overflow:hidden;
}

.image-container img{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
object-position:center;
}

.card-content{
padding:20px;
}

.city-tag{
display:inline-block;
background:#dbeafe;
color:#1d4ed8;
padding:8px 14px;
border-radius:999px;
font-size:16px;
font-weight:900;
margin-bottom:12px;
}

.card-title{
font-size:34px;
font-weight:900;
line-height:1.4;
margin-bottom:14px;
color:#111827;
}

.card-text{
font-size:24px;
line-height:1.9;
color:#475569;
margin-bottom:18px;
white-space:pre-wrap;
}

.btn-link{
display:block;
text-align:center;
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
text-decoration:none;
padding:20px;
border-radius:18px;
font-size:24px;
font-weight:900;
}

.home{
display:block;
width:100%;
border:none;
background:#475569;
color:#fff;
padding:20px;
border-radius:20px;
font-size:24px;
font-weight:900;
margin-top:24px;
}

.loading{
background:#fff;
padding:30px;
border-radius:24px;
text-align:center;
font-size:24px;
font-weight:900;
}
</style>
</head>

<body>

<div class="container">

<header>
📰 4市瓦版
<div class="sub">
志木市・朝霞市・新座市・和光市
</div>
</header>

<div class="section-title">
最新の回覧板データー
</div>

<div id="news-container">
<div class="loading">
読込中...
</div>
</div>

<button
class="home"
onclick="location.href='https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/'">
🏠 トップへ戻る
</button>

</div>

<script>
const SHEET_ID='149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc';
const SHEET_NAME='4市瓦版';

function getVal(cell){
if(!cell) return '';
return cell.f || cell.v || '';
}

function makeImageUrl(url){

url=String(url || '').trim();

if(url.includes('drive.google.com/file/d/')){
const id=url.split('/file/d/')[1].split('/')[0];
return 'https://docs.google.com/uc?export=view&id='+id;
}

if(url.includes('open?id=')){
const id=url.split('open?id=')[1].split('&')[0];
return 'https://docs.google.com/uc?export=view&id='+id;
}

return url;
}

function esc(text){
return String(text || '')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#39;');
}

window.handleSheet=function(json){

const container=document.getElementById('news-container');

if(!json || !json.table || !json.table.rows){
container.innerHTML=
'<div class="loading">データがありません</div>';
return;
}

const rows=json.table.rows.slice().reverse();

container.innerHTML='';

rows.forEach(function(row){

if(!row.c) return;

const id=getVal(row.c[0]);
const image=makeImageUrl(getVal(row.c[1]));
const title=getVal(row.c[2]);
const content=getVal(row.c[3]);
const date=getVal(row.c[4]);

if(!title) return;

let city='4市瓦版';

const check=(title+' '+content);

if(check.includes('志木')){
city='志木市';
}
else if(check.includes('新座')){
city='新座市';
}
else if(check.includes('朝霞')){
city='朝霞市';
}
else if(check.includes('和光')){
city='和光市';
}

const card=document.createElement('div');
card.className='card';

card.innerHTML=
(image
?'<div class="image-container"><img src="'+esc(image)+'"></div>'
:''
)+

'<div class="card-content">'+

'<div class="city-tag">'+city+'</div>'+

'<div class="card-title">'+
esc(title)+
'</div>'+

'<div class="card-text">'+
esc(content)+
'</div>'+

'<div style="font-size:16px;color:#64748b;margin-bottom:16px;">'+
esc(date)+
'</div>'+

'<a class="btn-link" href="app.html?id='+
encodeURIComponent(id)+
'">続きを読む</a>'+

'</div>';

container.appendChild(card);

});

if(container.innerHTML===''){
container.innerHTML=
'<div class="loading">記事がありません</div>';
}

};

function loadSheet(){

const script=document.createElement('script');

script.src=
'https://docs.google.com/spreadsheets/d/'+
SHEET_ID+
'/gviz/tq?sheet='+
encodeURIComponent(SHEET_NAME)+
'&tqx=out:json;responseHandler:handleSheet';

document.body.appendChild(script);

}

window.onload=loadSheet;
</script>

</body>
</html>
