<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>4市瓦版</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef3f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#111827;
padding:12px;
}

.container{
max-width:720px;
margin:auto;
}

header{
background:linear-gradient(
135deg,
#0b1220,
#1e293b,
#334155
);
color:#fff;
text-align:center;
padding:28px 20px;
border-radius:28px;
margin-bottom:22px;
font-size:38px;
font-weight:900;
box-shadow:0 12px 30px rgba(0,0,0,.25);
}

.sub{
font-size:17px;
margin-top:8px;
font-weight:700;
}

.home{
width:100%;
border:none;
border-radius:24px;
padding:24px;
margin-bottom:18px;
background:linear-gradient(
135deg,
#111827,
#1f2937
);
color:#fff;
font-size:24px;
font-weight:900;
cursor:pointer;
}

.section-title{
font-size:34px;
font-weight:900;
margin:18px 0;
border-left:10px solid #2563eb;
padding-left:14px;
}

#news-container{
display:flex;
flex-direction:column;
gap:24px;
}

.card{
background:#fff;
border-radius:28px;
overflow:hidden;
box-shadow:0 12px 30px rgba(0,0,0,.15);
}

.image-container img{
width:100%;
display:block;
}

.card-content{
padding:20px;
}

.city-tag{
display:inline-block;
background:#dbeafe;
color:#1d4ed8;
padding:10px 16px;
border-radius:999px;
font-size:18px;
font-weight:900;
margin-bottom:14px;
}

.card-title{
font-size:30px;
font-weight:900;
line-height:1.5;
margin-bottom:12px;
}

.date{
font-size:18px;
font-weight:800;
color:#64748b;
margin-bottom:12px;
}

.card-text{
font-size:24px;
line-height:1.8;
white-space:pre-wrap;
margin-bottom:16px;
}

.article-links{
display:flex;
flex-direction:column;
gap:12px;
}

.article-btn{
display:block;
background:#2563eb;
color:#fff;
text-decoration:none;
padding:18px;
border-radius:18px;
font-size:20px;
font-weight:900;
}

.loading,
.error{
background:#fff;
padding:30px;
border-radius:24px;
text-align:center;
font-size:24px;
font-weight:900;
}

</style>

</head>

<body>

<div class="container">

<header>

📰 4市瓦版

<div class="sub">
志木市・新座市・朝霞市・和光市
</div>

</header>

<button
class="home"
onclick="location.href='index.html'">
🏠 トップへ戻る
</button>

<div class="section-title">
最新の回覧板
</div>

<div id="news-container">

<div class="loading">
読込中...
</div>

</div>

</div>

<script>

const SHEET_ID =
'149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc';

const SHEET_NAME =
'4市瓦版';

function getVal(cell){

if(!cell)return '';

return cell.f || cell.v || '';

}

function esc(str){

return String(str || '')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;');

}

function makeImageUrl(url){

url = String(url || '').trim();

if(url.includes('/file/d/')){

const id =
url.split('/file/d/')[1].split('/')[0];

return 'https://docs.google.com/uc?export=view&id=' + id;

}

return url;

}

function loadSheet(){

const script =
document.createElement('script');

script.src =
'https://docs.google.com/spreadsheets/d/' +
SHEET_ID +
'/gviz/tq?sheet=' +
encodeURIComponent(SHEET_NAME) +
'&tqx=out:json;responseHandler:handleSheet';

document.body.appendChild(script);

}

window.handleSheet = function(json){

const container =
document.getElementById('news-container');

if(
!json ||
!json.table ||
!json.table.rows
){

container.innerHTML =
'<div class="error">データ取得失敗</div>';

return;

}

const rows =
json.table.rows.slice().reverse();

container.innerHTML = '';

rows.forEach(function(row){

if(!row.c)return;

const date =
getVal(row.c[0]);

const image =
makeImageUrl(
getVal(row.c[1])
);

const title =
getVal(row.c[2]);

const content =
getVal(row.c[3]);

const card =
document.createElement('div');

card.className='card';

card.innerHTML =

(image ?

'<div class="image-container">' +
'<img src="' +
image +
'">' +
'</div>'

: '')

+

'<div class="card-content">' +

'<div class="city-tag">' +
'4市瓦版' +
'</div>' +

'<div class="date">' +
date +
'</div>' +

'<div class="card-title">' +
title +
'</div>' +

'<div class="card-text">' +
content +
'</div>' +

'</div>';

container.appendChild(card);

});

if(container.children.length===0){

container.innerHTML =
'<div class="error">記事がありません</div>';

}
