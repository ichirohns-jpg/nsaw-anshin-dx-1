<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>4市瓦版｜NSAW</title>

<meta property="og:type" content="website">
<meta property="og:title" content="4市瓦版｜NSAW">
<meta property="og:description" content="志木・新座・朝霞・和光の最新情報">
<meta property="og:image" content="https://drive.google.com/thumbnail?id=17myT3nZaqJhnGKDAoVwu-oiujuv8NVSH&sz=w2000">

<style>
body{margin:0;background:#eef4fb;font-family:sans-serif}
.wrap{max-width:560px;margin:auto;padding:16px}
.card{background:#fff;border-radius:20px;padding:16px;margin:10px 0;box-shadow:0 6px 18px rgba(0,0,0,.08)}
img{width:100%;border-radius:16px}
.title{font-weight:900;font-size:20px;margin-bottom:8px}
.sub{color:#555}
.header{padding:16px;font-size:24px;font-weight:900}
</style>

</head>

<body>

<div class="wrap">

<div class="header">📰 4市瓦版（自動更新）</div>

<div class="card">
<img src="https://drive.google.com/thumbnail?id=17myT3nZaqJhnGKDAoVwu-oiujuv8NVSH&sz=w2000">
</div>

<!-- ここがデータ表示場所 -->
<div id="content"></div>

</div>

<script>

async function loadSheet(){

const url =
"https://docs.google.com/spreadsheets/d/13qavSy8Thod2S_UWtHf0C7s-IDVcpYYEMvRNPHpabjY/gviz/tq?tqx=out:json";

const res = await fetch(url);
const text = await res.text();

const json = JSON.parse(text.substr(47).slice(0,-2));

const rows = json.table.rows;

let html = "";

rows.forEach(r=>{

const title = r.c[1]?.v || "タイトルなし";
const desc = r.c[2]?.v || "内容なし";

html += `
<div class="card">
<div class="title">${title}</div>
<div class="sub">${desc}</div>
</div>
`;

});

document.getElementById("content").innerHTML = html;

}

loadSheet();

</script>

</body>
</html>
