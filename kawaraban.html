<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>4市瓦版</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#f4f6f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.header{
background:linear-gradient(135deg,#2196f3,#64b5f6);
color:#fff;
padding:24px;
text-align:center;
font-size:32px;
font-weight:900;
}

.wrap{
max-width:900px;
margin:auto;
padding:15px;
}

.card{
background:#fff;
border-radius:20px;
padding:18px;
margin-bottom:16px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.city{
font-size:14px;
font-weight:900;
color:#1976d2;
margin-bottom:8px;
}

.title{
font-size:22px;
font-weight:900;
margin-bottom:10px;
}

.desc{
line-height:1.7;
margin-bottom:15px;
}

.btn{
display:block;
width:100%;
padding:18px;
border-radius:16px;
background:#2196f3;
color:#fff;
text-decoration:none;
text-align:center;
font-size:20px;
font-weight:900;
}

</style>

</head>

<body>

<div class="header">
📰 4市瓦版
</div>

<div class="wrap">

<div id="newsList">

<div class="card">
読込中...
</div>

</div>

</div>

<script>

const SHEET_ID =
"149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc";

const SHEET_NAME =
"4市瓦版";

const url =
"https://docs.google.com/spreadsheets/d/" +
SHEET_ID +
"/gviz/tq?sheet=" +
encodeURIComponent(SHEET_NAME) +
"&tqx=out:json";

function getVal(cell){

if(!cell) return "";

return cell.v || cell.f || "";

}

function handleSheet(json){

const rows =
json.table.rows || [];

rows.reverse();

let html = "";

rows.forEach(row=>{

const cells =
row.c || [];

const city =
getVal(cells[1]);

const title =
getVal(cells[2]);

const desc =
getVal(cells[3]);

const link =
getVal(cells[4]);

html += `

<div class="card">

<div class="city">
${city}
</div>

<div class="title">
${title}
</div>

<div class="desc">
${desc}
</div>

<a
class="btn"
href="${link}"
target="_blank">
記事を見る
</a>

</div>

`;

});

document.getElementById(
"newsList"
).innerHTML =
html || "記事がありません";

}

const script =
document.createElement(
"script"
);

script.src =
url +
"&callback=handleSheet";

document.body.appendChild(
script
);

</script>

</body>
</html>
