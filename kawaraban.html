<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>4市瓦版</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
background:#101827;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#fff;
padding:16px;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.header p{
margin-top:8px;
color:#cbd5e1;
}

.city{
background:linear-gradient(135deg,#1e293b,#0f172a);
padding:20px;
border-radius:24px;
margin-bottom:16px;
}

.cityTitle{
font-size:26px;
font-weight:900;
margin-bottom:12px;
}

.article{
background:rgba(255,255,255,.08);
padding:16px;
border-radius:18px;
margin-bottom:10px;
}

.articleTitle{
font-size:20px;
font-weight:900;
line-height:1.6;
}

.articleDate{
font-size:14px;
margin-top:8px;
color:#cbd5e1;
}

.more{
display:block;
text-align:center;
padding:18px;
border-radius:18px;
background:#2563eb;
color:#fff;
text-decoration:none;
font-size:20px;
font-weight:900;
margin-top:10px;
}

.btn{
display:block;
width:100%;
padding:22px;
border-radius:22px;
text-decoration:none;
text-align:center;
font-size:24px;
font-weight:900;
color:#fff;
background:linear-gradient(135deg,#475569,#334155);
margin-top:16px;
}

</style>
</head>

<body>

<div class="header">
<h1>📰 4市瓦版</h1>
<p>最新5件＋アーカイブ方式</p>
</div>

<div id="newsArea"></div>

<a href="index.html" class="btn">
🏠 トップへ戻る
</a>

<script>

const cities = [

{
name:'志木市',
sheet:'志木市記事'
},

{
name:'新座市',
sheet:'新座市記事'
},

{
name:'朝霞市',
sheet:'朝霞市記事'
},

{
name:'和光市',
sheet:'和光市記事'
}

];

let html='';

cities.forEach(city=>{

html +=

'<div class="city">' +

'<div class="cityTitle">' +
city.name +
'</div>' +

'<div class="article">' +

'<div class="articleTitle">' +
'最新記事を表示' +
'</div>' +

'<div class="articleDate">' +
'Googleスプレッドシート連携予定' +
'</div>' +

'</div>' +

'<a class="more" href="#">アーカイブを見る</a>' +

'</div>';

});

document.getElementById(
'newsArea'
).innerHTML = html;

</script>

</body>
</html>
