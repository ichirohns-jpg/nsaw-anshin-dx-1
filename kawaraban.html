<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>4市瓦版</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#f4f6f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2937;
}

header{
background:linear-gradient(135deg,#111827,#1e3a8a,#2563eb);
color:#fff;
padding:24px 16px;
text-align:center;
font-size:32px;
font-weight:900;
position:sticky;
top:0;
z-index:999;
box-shadow:0 6px 20px rgba(0,0,0,.22);
}

.wrap{
max-width:1000px;
margin:auto;
padding:16px;
}

.card{
background:#fff;
border-radius:26px;
overflow:hidden;
margin-bottom:20px;
box-shadow:0 10px 26px rgba(0,0,0,.10);
border:1px solid #e5e7eb;
}

.thumb{
width:100%;
aspect-ratio:16/9;
object-fit:cover;
background:#e5e7eb;
display:block;
}

.body{
padding:18px;
}

.title{
font-size:25px;
font-weight:900;
line-height:1.45;
margin-bottom:10px;
color:#0f172a;
}

.desc{
font-size:18px;
line-height:1.75;
color:#475569;
margin-bottom:12px;
}

.date{
font-size:15px;
color:#64748b;
font-weight:700;
margin-bottom:14px;
}

.readBtn{
display:block;
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
text-decoration:none;
padding:17px;
text-align:center;
border-radius:16px;
font-size:21px;
font-weight:900;
box-shadow:0 6px 16px rgba(37,99,235,.28);
}

.sns{
display:flex;
gap:8px;
margin-top:12px;
}

.sns a{
flex:1;
text-align:center;
padding:13px 8px;
border-radius:13px;
text-decoration:none;
color:#fff;
font-weight:900;
font-size:16px;
}

.line{background:#06c755;}
.x{background:#000;}
.facebook{background:#1877f2;}

.sectionTitle{
font-size:28px;
font-weight:900;
margin:26px 0 14px;
color:#0f172a;
}

.home{
display:block;
width:100%;
border:none;
background:#475569;
color:#fff;
padding:18px;
text-align:center;
border-radius:18px;
font-size:22px;
font-weight:900;
margin-top:22px;
}

.loading{
background:#fff;
border-radius:22px;
padding:24px;
font-size:22px;
font-weight:900;
text-align:center;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}
</style>

<script>
const SHEET_ID = '149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc';
const SHEET_NAME = '4市瓦版';

function getVal(cell){
  if(!cell) return '';
  return cell.f || cell.v || '';
}

function esc(text){
  return String(text || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function makeImageUrl(url){
  url = String(url || '').trim();

  if(url.indexOf('drive.google.com/file/d/') !== -1){
    const id = url.split('/file/d/')[1].split('/')[0];
    return 'https://drive.google.com/uc?export=view&id=' + id;
  }

  if(url.indexOf('drive.google.com/open?id=') !== -1){
    const id = url.split('open?id=')[1].split('&')[0];
    return 'https://drive.google.com/uc?export=view&id=' + id;
  }

  return url;
}

window.handleSheet = function(json){
  const latestBox = document.getElementById('latest');
  const archiveBox = document.getElementById('archive');

  if(!json || !json.table || !json.table.rows){
    latestBox.innerHTML = '<div class="loading">データがありません</div>';
    return;
  }

  const rows = json.table.rows.slice().reverse();

  let latest = '';
  let archive = '';

  rows.forEach(function(row,index){
    if(!row.c) return;

    const id = getVal(row.c[0]);
    const image = makeImageUrl(getVal(row.c[1]));
    const title = getVal(row.c[2]);
    const desc = getVal(row.c[3]);
    const date = getVal(row.c[4]);

    if(!title) return;

    const articleUrl = 'https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/app.html?id=' + encodeURIComponent(id);

    const html =
      '<div class="card">' +
        (image ? '<img class="thumb" src="' + esc(image) + '" alt="">' : '') +
        '<div class="body">' +
          '<div class="title">' + esc(title) + '</div>' +
          '<div class="desc">' + esc(desc) + '</div>' +
          '<div class="date">' + esc(date) + '</div>' +
          '<a class="readBtn" href="app.html?id=' + encodeURIComponent(id) + '">続きを読む</a>' +
          '<div class="sns">' +
            '<a class="line" target="_blank" href="https://social-plugins.line.me/lineit/share?url=' + encodeURIComponent(articleUrl) + '">LINE</a>' +
            '<a class="x" target="_blank" href="https://twitter.com/intent/tweet?url=' + encodeURIComponent(articleUrl) + '&text=' + encodeURIComponent(title) + '">X</a>' +
            '<a class="facebook" target="_blank" href="https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(articleUrl) + '">FB</a>' +
          '</div>' +
        '</div>' +
      '</div>';

    if(index < 5){
      latest += html;
    }else{
      archive += html;
    }
  });

  latestBox.innerHTML = latest || '<div class="loading">記事なし</div>';
  archiveBox.innerHTML = archive;
};

function loadSheet(){
  const script = document.createElement('script');
  script.src =
    'https://docs.google.com/spreadsheets/d/' +
    SHEET_ID +
    '/gviz/tq?sheet=' +
    encodeURIComponent(SHEET_NAME) +
    '&tqx=out:json;responseHandler:handleSheet';

  document.body.appendChild(script);
}

window.onload = loadSheet;
</script>
</head>

<body>

<header>
📰 4市瓦版
</header>

<div class="wrap">

<div id="latest">
<div class="loading">読込中...</div>
</div>

<div class="sectionTitle">
📚 アーカイブ
</div>

<div id="archive"></div>

<button class="home" onclick="location.href='https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/'">
🏠 トップへ戻る
</button>

</div>

</body>
</html>
