<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>4市瓦版</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#f4f6f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.header{
background:linear-gradient(135deg,#2196f3,#64b5f6);
color:#fff;
padding:28px;
text-align:center;
font-size:42px;
font-weight:900;
}

.wrap{
max-width:1000px;
margin:auto;
padding:18px;
}

.card{
background:#fff;
border-radius:24px;
overflow:hidden;
margin-bottom:20px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.photo{
width:100%;
height:280px;
object-fit:cover;
display:block;
}

.body{
padding:20px;
}

.city{
font-size:20px;
font-weight:900;
color:#1976d2;
margin-bottom:10px;
}

.title{
font-size:30px;
font-weight:900;
line-height:1.5;
margin-bottom:12px;
}

.desc{
font-size:22px;
line-height:1.9;
margin-bottom:15px;
}

.btn{
display:block;
width:100%;
padding:20px;
border-radius:18px;
background:#2196f3;
color:#fff;
text-decoration:none;
text-align:center;
font-size:24px;
font-weight:900;
margin-top:10px;
}

.error{
background:#fff3cd;
border:2px solid #ffe082;
padding:20px;
border-radius:18px;
font-size:22px;
font-weight:900;
}

</style>

</head>

<body>

<div class="header">
📰 4市瓦版
</div>

<div class="wrap">

<div id="newsList">

<div class="error">
記事を読込中...
</div>

</div>

</div>

<script>

const SHEET_ID =
"149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc";

const SHEET_NAME =
"4市瓦版";

const url =
"https://docs.google.com/spreadsheets/d/" +
SHEET_ID +
"/gviz/tq?sheet=" +
encodeURIComponent(SHEET_NAME) +
"&tqx=out:json";

function getVal(cell){

if(!cell) return "";

return cell.v || cell.f || "";

}

function handleSheet(json){

const rows =
json.table.rows || [];

rows.reverse();

let html = "";

rows.forEach(row=>{

const cells =
row.c || [];

/*
列例

0 日付
1 市名
2 タイトル
3 説明
4 記事URL
5 画像URL

*/

const city =
getVal(cells[1]);

const title =
getVal(cells[2]);

const desc =
getVal(cells[3]);

const link =
getVal(cells[4]);

const image =
getVal(cells[5]);

if(
!title
) return;

html += `

<div class="card">

${
image
?

`
<img
class="photo"
src="${image}">
`

:

""

}

<div class="body">

<div class="city">
${city}
</div>

<div class="title">
${title}
</div>

<div class="desc">
${desc}
</div>

<a
class="btn"
href="${link}"
target="_blank">
📰 記事を見る
</a>

</div>

</div>

`;

});

document.getElementById(
"newsList"
).innerHTML =

html ||

`

<div class="error">

記事がありません

</div>

`;

}

const script =
document.createElement(
"script"
);

script.src =
url +
"&callback=handleSheet";

script.onerror =
function(){

document.getElementById(
"newsList"
).innerHTML =

`

<div class="error">

スプレッドシート接続失敗

</div>

`;

};

document.body.appendChild(
script
);

</script>

</body>
</html>
