<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>病院・薬局ナビ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
}

.header{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:36px;
font-weight:900;
}

.btn{
display:block;
width:100%;
padding:28px;
border:none;
border-radius:24px;
font-size:28px;
font-weight:900;
cursor:pointer;
color:#fff;
margin-bottom:14px;
}

.blue{
background:#2563eb;
}

.green{
background:#16a34a;
}

.orange{
background:#ea580c;
}

.purple{
background:#7c3aed;
}

.red{
background:#dc2626;
}

.gray{
background:#475569;
}

.result{
background:#fff;
padding:24px;
border-radius:24px;
font-size:22px;
font-weight:900;
line-height:1.8;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

</style>

</head>

<body>

<div class="header">
<h1>🏥 地域ナビ</h1>
</div>

<div
id="result"
class="result">

案内したい施設を選んでください

</div>

<button
class="btn blue"
onclick="searchPlace('内科')">

🏥 病院

</button>

<button
class="btn green"
onclick="searchPlace('薬局')">

💊 薬局

</button>

<button
class="btn orange"
onclick="searchPlace('避難所')">

🏫 避難所

</button>

<button
class="btn purple"
onclick="searchPlace('公衆トイレ')">

🚻 公衆トイレ

</button>

<button
class="btn red"
onclick="searchPlace('コンビニ')">

🏪 コンビニ

</button>

<button
class="btn gray"
onclick="location.href='index.html'">

🏠 トップへ戻る

</button>

<script>

function searchPlace(type){

document.getElementById(
'result'
).innerHTML =

type +

' を検索しています';

if(
navigator.geolocation
){

navigator.geolocation.getCurrentPosition(

function(pos){

const lat =
pos.coords.latitude;

const lng =
pos.coords.longitude;

const url =

'https://www.google.com/maps/search/' +

encodeURIComponent(type) +

'/@' +

lat +

',' +

lng +

',15z';

window.open(
url,
'_blank'
);

},

function(){

const url =

'https://www.google.com/maps/search/' +

encodeURIComponent(type);

window.open(
url,
'_blank'
);

}

);

}else{

const url =

'https://www.google.com/maps/search/' +

encodeURIComponent(type);

window.open(
url,
'_blank'
);

}

}

</script>

</body>
</html>
