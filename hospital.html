<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>地域サポート</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
}

.header{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:16px;
}

.bigBtn{
display:flex;
justify-content:center;
align-items:center;
text-align:center;
text-decoration:none;
height:120px;
border-radius:24px;
color:#fff;
font-size:24px;
font-weight:900;
}

.blue{
background:#2563eb;
}

.green{
background:#16a34a;
}

.orange{
background:#ea580c;
}

.red{
background:#dc2626;
}

.purple{
background:#7c3aed;
}

.gray{
background:#475569;
}

.card{
background:#fff;
padding:20px;
border-radius:24px;
margin-bottom:16px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.title{
font-size:24px;
font-weight:900;
margin-bottom:10px;
}

.item{
padding:16px;
border-bottom:1px solid #e5e7eb;
}

.name{
font-size:22px;
font-weight:900;
margin-bottom:8px;
}

.addr{
font-size:16px;
margin-bottom:8px;
}

.tel{
font-size:18px;
font-weight:900;
margin-bottom:8px;
}

.navBtn{
display:inline-block;
padding:10px 16px;
background:#2563eb;
color:#fff;
text-decoration:none;
border-radius:12px;
font-weight:900;
margin-right:6px;
}

.callBtn{
display:inline-block;
padding:10px 16px;
background:#16a34a;
color:#fff;
text-decoration:none;
border-radius:12px;
font-weight:900;
}

.home{
display:block;
background:#475569;
color:#fff;
text-decoration:none;
padding:20px;
border-radius:20px;
text-align:center;
font-size:22px;
font-weight:900;
}

</style>

</head>

<body>

<div class="header">
<h1>🏥 地域サポート</h1>
</div>

<div class="grid">

<a href="https://www.google.com/maps/search/病院" target="_blank" class="bigBtn blue">
🏥<br>病院
</a>

<a href="https://www.google.com/maps/search/薬局" target="_blank" class="bigBtn green">
💊<br>薬局
</a>

<a href="https://www.google.com/maps/search/コンビニ" target="_blank" class="bigBtn orange">
🏪<br>コンビニ
</a>

<a href="https://www.google.com/maps/search/公衆トイレ" target="_blank" class="bigBtn purple">
🚻<br>トイレ
</a>

</div>

<div class="card">

<div class="title">
地域施設
</div>

<div id="facilityArea">

読込中...

</div>

</div>

<a href="index.html" class="home">
🏠 トップへ戻る
</a>

<script>

const SHEET_ID =
'149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc';

function getVal(cell){

if(!cell) return '';

return cell.f || cell.v || '';

}

function loadFacility(){

const url =

'https://docs.google.com/spreadsheets/d/' +

SHEET_ID +

'/gviz/tq?sheet=' +

encodeURIComponent(
'施設マスター'
) +

'&tqx=out:json';

const script =
document.createElement(
'script'
);

script.src =
url +
'&callback=handleSheet';

document.body.appendChild(
script);

}

function handleSheet(json){

const rows =
json.table.rows;

let html='';

for(let i=0;i<rows.length;i++){

const row =
rows[i];

const type =
getVal(row.c[2]);

const name =
getVal(row.c[3]);

const address =
getVal(row.c[4]);

const tel =
getVal(row.c[5]);

const map =
getVal(row.c[6]);

if(
type !== '包括' &&
type !== '避難所' &&
type !== '市役所' &&
type !== '休日診療' &&
type !== '警察' &&
type !== '消防'
){
continue;
}

html +=

'<div class="item">' +

'<div class="name">' +
type + '｜' + name +
'</div>' +

'<div class="addr">' +
address +
'</div>' +

'<div class="tel">' +
(tel || '') +
'</div>' +

(map ?

'<a class="navBtn" target="_blank" href="' +
map +
'">📍 ナビ</a>'

: '') +

(tel ?

'<a class="callBtn" href="tel:' +
tel +
'">📞 電話</a>'

: '') +

'</div>';

}

document.getElementById(
'facilityArea'
).innerHTML =
html || '施設データなし';

}

window.onload =
loadFacility;

</script>

</body>
</html>
