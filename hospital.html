<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>病院・薬局</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.header{
background:linear-gradient(135deg,#0f172a,#334155);
color:#fff;
padding:30px;
text-align:center;
}

.header h1{
font-size:40px;
font-weight:900;
}

.wrap{
max-width:900px;
margin:auto;
padding:18px;
}

.card{
background:#fff;
border-radius:30px;
padding:24px;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.title{
font-size:24px;
font-weight:900;
margin-bottom:18px;
}

.name{
font-size:30px;
font-weight:900;
margin-bottom:12px;
}

.btn{
display:block;
width:100%;
padding:18px;
margin-top:12px;
border-radius:18px;
text-align:center;
text-decoration:none;
font-size:22px;
font-weight:900;
color:#fff;
}

.tel{
background:#16a34a;
}

.map{
background:#2563eb;
}

.back{
background:#334155;
}

</style>

</head>

<body>

<div class="header">
<h1>🏥 病院・薬局</h1>
</div>

<div class="wrap">

<div class="card">

<div class="title">
近くの病院
</div>

<div class="name">
志木駅前クリニック
</div>

<a
href="tel:0000000000"
class="btn tel">
電話する
</a>

<a
href="https://maps.google.com"
target="_blank"
class="btn map">
地図を見る
</a>

</div>

<div class="card">

<div class="title">
近くの薬局
</div>

<div class="name">
駅前薬局
</div>

<a
href="tel:0000000000"
class="btn tel">
電話する
</a>

<a
href="https://maps.google.com"
target="_blank"
class="btn map">
地図を見る
</a>

</div>

<a
href="index.html"
class="btn back">
トップへ戻る
</a>

</div>

</body>
</html>
