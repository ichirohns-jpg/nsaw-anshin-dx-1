<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>病院・薬局</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
color:#1f2d3d;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:36px;
font-weight:900;
}

.card{
background:#fff;
border-radius:30px;
padding:24px;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.title{
font-size:26px;
font-weight:900;
margin-bottom:12px;
}

.name{
font-size:30px;
font-weight:900;
margin-bottom:14px;
}

.btn{
display:block;
width:100%;
padding:22px;
margin-top:12px;
border-radius:20px;
text-align:center;
text-decoration:none;
font-size:24px;
font-weight:900;
color:#fff;
}

.green{
background:#16a34a;
}

.blue{
background:#2563eb;
}

.gray{
background:#475569;
}

</style>

</head>

<body>

<div class="header">
<h1>🏥 病院・薬局</h1>
</div>

<div class="card">

<div class="title">
近くの病院
</div>

<div class="name">
志木駅前クリニック
</div>

<a href="tel:0000000000" class="btn green">
📞 電話する
</a>

<a href="https://maps.google.com" target="_blank" class="btn blue">
🗺 地図を見る
</a>

</div>

<div class="card">

<div class="title">
近くの薬局
</div>

<div class="name">
志木駅前薬局
</div>

<a href="tel:0000000000" class="btn green">
📞 電話する
</a>

<a href="https://maps.google.com" target="_blank" class="btn blue">
🗺 地図を見る
</a>

</div>

<a href="index.html" class="btn gray">
🏠 トップへ戻る
</a>

</body>
</html>
