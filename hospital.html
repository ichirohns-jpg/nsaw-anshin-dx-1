<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>病院・薬局</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
background:#101827;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
color:#fff;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
box-shadow:0 12px 30px rgba(0,0,0,.35);
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:linear-gradient(135deg,#1e293b,#0f172a);
padding:22px;
border-radius:24px;
margin-bottom:14px;
box-shadow:0 10px 24px rgba(0,0,0,.30);
}

.name{
font-size:24px;
font-weight:900;
margin-bottom:8px;
}

.info{
font-size:18px;
line-height:1.8;
color:#e2e8f0;
}

.btn{
display:block;
width:100%;
padding:20px;
border-radius:20px;
text-decoration:none;
text-align:center;
font-size:22px;
font-weight:900;
margin-top:12px;
color:#fff;
background:linear-gradient(135deg,#2563eb,#3b82f6);
}

.gray{
background:linear-gradient(135deg,#475569,#334155);
margin-top:18px;
}

</style>
</head>

<body>

<div class="header">
<h1>🏥 病院・薬局</h1>
</div>

<div id="hospitalArea"></div>

<a href="index.html" class="btn gray">
🏠 トップへ戻る
</a>

<script>

const hospitals = [

{
name:'かかりつけ病院',
type:'病院',
address:'登録後に表示',
map:'https://maps.google.com'
},

{
name:'近隣薬局',
type:'薬局',
address:'登録後に表示',
map:'https://maps.google.com'
}

];

let html='';

hospitals.forEach(item=>{

html +=

'<div class="card">' +

'<div class="name">' +
item.name +
'</div>' +

'<div class="info">' +
item.type +
'<br>' +
item.address +
'</div>' +

'<a class="btn" href="' +
item.map +
'" target="_blank">📍 地図を開く</a>' +

'</div>';

});

document.getElementById(
'hospitalArea'
).innerHTML = html;

</script>

</body>
</html>
