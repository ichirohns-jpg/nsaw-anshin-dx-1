<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>病院・薬局</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
}

.header{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:36px;
font-weight:900;
}

.card{
background:#fff;
padding:24px;
border-radius:24px;
margin-bottom:16px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.name{
font-size:26px;
font-weight:900;
margin-bottom:10px;
}

.info{
font-size:20px;
line-height:1.8;
}

.btn{
display:block;
width:100%;
padding:22px;
border-radius:20px;
text-decoration:none;
text-align:center;
font-size:24px;
font-weight:900;
color:#fff;
margin-top:12px;
}

.blue{
background:#2563eb;
}

.green{
background:#16a34a;
}

.gray{
background:#475569;
}

</style>

</head>

<body>

<div class="header">
<h1>🏥 病院・薬局</h1>
</div>

<div class="card">

<div class="name">
🏥 かかりつけ病院
</div>

<div class="info">
病院名を登録予定
</div>

</div>

<div class="card">

<div class="name">
💊 かかりつけ薬局
</div>

<div class="info">
薬局名を登録予定
</div>

</div>

<div class="card">

<div class="name">
📞 緊急連絡先
</div>

<div class="info">
119<br>
#7119
</div>

</div>

<a href="tel:119" class="btn blue">
🚑 119へ電話
</a>

<a href="tel:#7119" class="btn green">
🏥 救急相談
</a>

<a href="index.html" class="btn gray">
🏠 トップへ戻る
</a>

</body>
</html>
