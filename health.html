<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>健康管理｜見守りDX</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:560px;
margin:auto;
padding:16px;
}

.header{
background:#2e7d32;
color:#fff;
border-radius:26px;
padding:22px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.back{
font-size:16px;
font-weight:900;
margin-bottom:12px;
cursor:pointer;
}

.title{
font-size:34px;
font-weight:900;
}

.sub{
font-size:16px;
margin-top:6px;
opacity:.95;
}

.card{
background:#fff;
border-radius:26px;
padding:20px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.item{
background:#f1f8e9;
border-left:8px solid #43a047;
border-radius:18px;
padding:18px;
margin-bottom:16px;
}

.label{
font-size:20px;
font-weight:900;
color:#2e7d32;
margin-bottom:8px;
}

.value{
font-size:38px;
font-weight:900;
}

.text{
font-size:20px;
font-weight:800;
line-height:1.7;
color:#555;
}

.btn{
width:100%;
border:none;
border-radius:24px;
padding:22px;
font-size:26px;
font-weight:900;
color:#fff;
background:#43a047;
margin-top:18px;
cursor:pointer;
}

.btn:active{
transform:scale(.97);
}

.footer{
display:flex;
justify-content:space-around;
margin-top:20px;
padding:18px 0;
background:#fff;
border-radius:22px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
font-size:14px;
font-weight:900;
color:#666;
}

</style>
</head>

<body>

<div class="wrap">

<div class="header">

<div class="back" onclick="location.href='index.html'">
← トップへ戻る
</div>

<div class="title">
🚶 健康管理
</div>

<div class="sub">
歩数や体調を確認します
</div>

</div>

<div class="card">

<div class="item">

<div class="label">
今日の歩数
</div>

<div class="value">
3,215歩
</div>

</div>

<div class="item">

<div class="label">
水分補給
</div>

<div class="text">
今日はあと2回水分補給しましょう。
</div>

</div>

<div class="item">

<div class="label">
体調メモ
</div>

<div class="text">
少し疲れ気味です。<br>
無理をしないようにしましょう。
</div>

</div>

<button class="btn">
💾 今日の健康を記録
</button>

</div>

<div class="footer">

<div onclick="location.href='index.html'">
見守り
</div>

<div onclick="location.href='calendar.html'">
予定
</div>

<div onclick="location.href='gomi.html'">
ゴミ
</div>

<div onclick="location.href='news.html'">
地域情報
</div>

</div>

</div>

</body>
</html>
