<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>地域ラジオ</title>

<meta property="og:type" content="article">
<meta property="og:title" content="地域ラジオ">
<meta property="og:description" content="志木市・新座市・朝霞市・和光市の地域ラジオ">
<meta property="og:image" content="https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/top.jpg">
<meta property="og:url" content="https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/share-radio-v2.html">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="地域ラジオ">
<meta name="twitter:description" content="志木市・新座市・朝霞市・和光市の地域ラジオ">
<meta name="twitter:image" content="https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/top.jpg">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
background:#eef3f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#111827;
}

.wrap{
max-width:700px;
margin:auto;
padding:16px;
}

.header{
background:linear-gradient(
135deg,
#111827,
#1f2937,
#374151
);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
font-size:38px;
font-weight:900;
margin-bottom:20px;
}

.card{
background:#fff;
border-radius:30px;
overflow:hidden;
margin-bottom:24px;
box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.thumb{
width:100%;
display:block;
}

.date{
padding:20px 22px 0;
font-size:20px;
font-weight:900;
color:#64748b;
}

.tag{
display:inline-block;
margin:16px 22px;
padding:10px 16px;
border-radius:999px;
background:#fee2e2;
color:#dc2626;
font-size:18px;
font-weight:900;
}

.title{
padding:0 22px;
font-size:38px;
font-weight:900;
line-height:1.45;
}

.desc{
padding:20px 22px;
font-size:26px;
line-height:1.8;
color:#475569;
}

.share{
display:flex;
flex-direction:column;
gap:14px;
padding:0 22px 24px;
}

.share button{
width:100%;
background:linear-gradient(
180deg,
#374151,
#111827
);
color:#fff;
border:none;
border-radius:24px;
padding:24px;
font-size:24px;
font-weight:900;
text-align:left;
cursor:pointer;
}

.loading{
background:#fff;
padding:30px;
border-radius:24px;
text-align:center;
font-size:24px;
font-weight:900;
}

.homeBtn{
width:100%;
margin-top:20px;
border:none;
border-radius:24px;
padding:24px;
background:linear-gradient(
135deg,
#111827,
#1f2937,
#374151
);
color:#fff;
font-size:24px;
font-weight:900;
cursor:pointer;
}

</style>

</head>

<body>

<div class="wrap">

<div class="header">
📻 地域ラジオ
</div>

<div id="app">
<div class="loading">読込中...</div>
</div>

<button
class="homeBtn"
onclick="location.href='radio.html'">

📻 地域ラジオへ戻る

</button>

</div>

<script>

function makeShareUrl(id){

return "https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/share-radio-v2.html?radio="
+
encodeURIComponent(id);

}

function shareFacebook(url){

window.open(
"https://www.facebook.com/sharer/sharer.php?u="
+
encodeURIComponent(url),
"_blank"
);

}

function shareLine(url){

window.open(
"https://social-plugins.line.me/lineit/share?url="
+
encodeURIComponent(url),
"_blank"
);

}

function shareX(url,text){

window.open(
"https://twitter.com/intent/tweet?url="
+
encodeURIComponent(url)
+
"&text="
+
encodeURIComponent(text),
"_blank"
);

}

function copyUrl(url){

navigator.clipboard.writeText(url);

alert("URLをコピーしました");

}

const SHEET_ID=
"149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc";

const SHEET_NAME=
"地域ラジオ";

const GVIZ_URL=
"https://docs.google.com/spreadsheets/d/"
+
SHEET_ID
+
"/gviz/tq?sheet="
+
encodeURIComponent(SHEET_NAME)
+
"&tqx=out:json";

function getCell(row,index){

if(!row || !row.c || !row.c[index]){
return "";
}

const c=row.c[index];

return c.f || c.v || "";

}

function getYoutubeId(url){

if(!url)return "";

url=String(url);

let m=url.match(/youtu\.be\/([^?&]+)/);
if(m)return m[1];

m=url.match(/[?&]v=([^&]+)/);
if(m)return m[1];

m=url.match(/embed\/([^?&]+)/);
if(m)return m[1];

m=url.match(/shorts\/([^?&]+)/);
if(m)return m[1];

return "";

}

fetch(GVIZ_URL)

.then(r=>r.text())

.then(text=>{

const json=
JSON.parse(
text.substring(
text.indexOf("{"),
text.lastIndexOf("}")+1
)
);

const rows=
json.table.rows || [];

const targetId=
new URLSearchParams(location.search)
.get("radio");

let html="";

if(targetId){

const row=
rows.slice().reverse()[Number(targetId)-1];

if(row){

const date=getCell(row,0);
const video=getCell(row,1);
const title=getCell(row,2);
const desc=getCell(row,3);
const tags=getCell(row,4);

const videoId=
getYoutubeId(video);

html=`

<div class="card">

<img
class="thumb"
src="https://img.youtube.com/vi/${videoId}/hqdefault.jpg">

<div class="date">${date}</div>

<div class="tag">${tags}</div>

<div class="title">${title}</div>

<div class="desc">${desc}</div>

</div>

`;

document.title=title || "地域ラジオ";

}

}

document.getElementById("app").innerHTML=
html ||
"<div class='loading'>記事がありません</div>";

})

.catch(err=>{

console.error(err);

document.getElementById("app").innerHTML=
"<div class='loading'>読込失敗</div>";

});

</script>

</body>
</html>
