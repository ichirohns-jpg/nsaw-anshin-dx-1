<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>利用者情報｜見守りDX</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:560px;
margin:auto;
padding:16px;
}

.header{
background:#1976d2;
color:#fff;
border-radius:26px;
padding:22px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.back{
font-size:16px;
font-weight:900;
margin-bottom:12px;
cursor:pointer;
}

.title{
font-size:34px;
font-weight:900;
}

.sub{
font-size:16px;
margin-top:6px;
opacity:.95;
}

.card{
background:#fff;
border-radius:26px;
padding:20px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.label{
font-size:17px;
font-weight:900;
color:#1976d2;
margin-top:16px;
margin-bottom:6px;
}

input,textarea{
width:100%;
border:none;
outline:none;
background:#f7fbff;
border-radius:18px;
padding:18px;
font-size:22px;
font-weight:800;
}

textarea{
height:120px;
resize:none;
line-height:1.7;
}

.btn{
width:100%;
border:none;
border-radius:24px;
padding:22px;
font-size:26px;
font-weight:900;
color:#fff;
background:#1976d2;
margin-top:18px;
cursor:pointer;
}

.btn:active{
transform:scale(.97);
}

.footer{
display:flex;
justify-content:space-around;
margin-top:20px;
padding:18px 0;
background:#fff;
border-radius:22px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
font-size:14px;
font-weight:900;
color:#666;
}

.toast{
position:fixed;
left:50%;
bottom:30px;
transform:translateX(-50%);
background:#1976d2;
color:#fff;
padding:16px 24px;
border-radius:18px;
font-size:18px;
font-weight:900;
display:none;
z-index:9999;
}
</style>
</head>

<body>

<div class="wrap">

<div class="header">
<div class="back" onclick="location.href='index.html'">← トップへ戻る</div>
<div class="title">👤 利用者情報</div>
<div class="sub">名前・住所・連絡先を確認します</div>
</div>

<div class="card">

<div class="label">名前</div>
<input id="name" placeholder="例：山田 太郎">

<div class="label">住所</div>
<input id="address" placeholder="例：志木市本町">

<div class="label">電話番号</div>
<input id="tel" placeholder="例：090-0000-0000">

<div class="label">支援者</div>
<input id="supporter" placeholder="例：山田 花子">

<div class="label">備考</div>
<textarea id="memo" placeholder="注意してほしいことを書いてください"></textarea>

<button class="btn" onclick="saveProfile()">💾 保存</button>

</div>

<div class="footer">
<div onclick="location.href='index.html'">見守り</div>
<div onclick="location.href='calendar.html'">予定</div>
<div onclick="location.href='gomi.html'">ゴミ</div>
<div onclick="location.href='news.html'">地域情報</div>
</div>

</div>

<div id="toast" class="toast"></div>

<script>
window.onload=function(){
document.getElementById("name").value=localStorage.getItem("profileName")||"";
document.getElementById("address").value=localStorage.getItem("profileAddress")||"";
document.getElementById("tel").value=localStorage.getItem("profileTel")||"";
document.getElementById("supporter").value=localStorage.getItem("profileSupporter")||"";
document.getElementById("memo").value=localStorage.getItem("profileMemo")||"";
};

function saveProfile(){
localStorage.setItem("profileName",document.getElementById("name").value);
localStorage.setItem("profileAddress",document.getElementById("address").value);
localStorage.setItem("profileTel",document.getElementById("tel").value);
localStorage.setItem("profileSupporter",document.getElementById("supporter").value);
localStorage.setItem("profileMemo",document.getElementById("memo").value);
showToast("保存しました");
}

function showToast(text){
const toast=document.getElementById("toast");
toast.innerText=text;
toast.style.display="block";
setTimeout(function(){
toast.style.display="none";
},2000);
}
</script>

</body>
</html>
