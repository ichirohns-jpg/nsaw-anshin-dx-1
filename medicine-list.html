<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>お薬一覧</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
}

.header{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:36px;
font-weight:900;
}

.card{
background:#fff;
border-radius:28px;
padding:22px;
margin-bottom:16px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.item{
background:#f8fafc;
border-left:8px solid #2563eb;
padding:18px;
border-radius:18px;
margin-bottom:14px;
}

.name{
font-size:24px;
font-weight:900;
margin-bottom:8px;
}

.memo{
font-size:18px;
line-height:1.8;
}

.btn{
display:block;
width:100%;
padding:22px;
background:#475569;
color:#fff;
text-decoration:none;
text-align:center;
border-radius:20px;
font-size:24px;
font-weight:900;
}

</style>

</head>

<body>

<div class="header">
<h1>💊 お薬一覧</h1>
</div>

<div class="card">

<div class="item">
<div class="name">
朝の薬
</div>
<div class="memo">
毎朝飲む薬
</div>
</div>

<div class="item">
<div class="name">
昼の薬
</div>
<div class="memo">
昼食後
</div>
</div>

<div class="item">
<div class="name">
夕方の薬
</div>
<div class="memo">
夕食後
</div>
</div>

<div class="item">
<div class="name">
寝る前の薬
</div>
<div class="memo">
就寝前
</div>
</div>

</div>

<a
href="medicine.html"
class="btn">

💊 服薬確認へ戻る

</a>

<br>

<a
href="index.html"
class="btn">

🏠 トップへ戻る

</a>

</body>
</html>
