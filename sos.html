<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SOS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
}

.header{
background:linear-gradient(135deg,#dc2626,#ef4444);
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:36px;
font-weight:900;
}

.card{
background:#fff;
padding:24px;
border-radius:24px;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.select{
width:100%;
padding:20px;
font-size:24px;
border:2px solid #cbd5e1;
border-radius:18px;
margin-bottom:16px;
}

.textarea{
width:100%;
height:120px;
padding:18px;
font-size:22px;
border:2px solid #cbd5e1;
border-radius:18px;
margin-bottom:16px;
}

.btn{
display:block;
width:100%;
padding:28px;
border:none;
border-radius:24px;
font-size:30px;
font-weight:900;
cursor:pointer;
color:#fff;
}

.red{
background:#dc2626;
}

.gray{
background:#475569;
margin-top:14px;
text-decoration:none;
text-align:center;
}

.result{
background:#f8fafc;
padding:20px;
border-radius:20px;
font-size:22px;
font-weight:900;
line-height:1.8;
text-align:center;
margin-top:18px;
}

</style>

</head>

<body>

<div class="header">
<h1>🚨 SOS</h1>
</div>

<div class="card">

<select
id="sosType"
class="select">

<option value="">選択してください</option>
<option>トイレ</option>
<option>食事</option>
<option>薬</option>
<option>買い物</option>
<option>病院</option>
<option>電話</option>
<option>来てほしい</option>
<option>その他</option>

</select>

<textarea
id="memo"
class="textarea"
placeholder="詳しい内容"></textarea>

<button
class="btn red"
onclick="sendSOS()">
🚨 SOS送信
</button>

<div
id="result"
class="result">

待機中

</div>

</div>

<a
href="app.html"
class="btn gray">
🏠 本人ページへ戻る
</a>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec';

function sendSOS(){

const type =
document.getElementById(
'sosType'
).value;

const memo =
document.getElementById(
'memo'
).value;

if(!type){
alert('内容を選択してください');
return;
}

document.getElementById(
'result'
).innerHTML =
'送信中...';

fetch(
GAS_URL,
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify({

type:'sos',

name:
localStorage.getItem(
'userName'
) || '利用者',

userId:
localStorage.getItem(
'userId'
) || '',

sosType:type,

memo:memo,

time:
new Date().toLocaleString('ja-JP')

})
}
)
.then(r=>r.text())
.then(data=>{

document.getElementById(
'result'
).innerHTML =

'🚨 SOS送信完了<br><br>' +

type +

'<br><br>' +

memo;

})
.catch(err=>{

document.getElementById(
'result'
).innerHTML =
'送信失敗';

});

}

</script>

</body>
</html>
