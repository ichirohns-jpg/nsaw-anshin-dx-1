<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SOS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#fff5f5;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
}

.header{
background:linear-gradient(
135deg,
#dc2626,
#b91c1c
);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:40px;
font-weight:900;
}

.card{
background:#fff;
padding:24px;
border-radius:24px;
margin-bottom:16px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.label{
font-size:22px;
font-weight:900;
margin-bottom:8px;
}

.select,
.textarea{
width:100%;
padding:16px;
border:2px solid #e5e7eb;
border-radius:16px;
font-size:20px;
margin-bottom:16px;
}

.textarea{
height:120px;
resize:none;
}

.sosBtn{
width:100%;
border:none;
background:#dc2626;
color:#fff;
padding:32px;
border-radius:24px;
font-size:36px;
font-weight:900;
}

.home{
display:block;
background:#475569;
color:#fff;
text-decoration:none;
padding:20px;
border-radius:20px;
text-align:center;
font-size:22px;
font-weight:900;
}

</style>

</head>

<body>

<div class="header">
<h1>🚨 SOS</h1>
</div>

<div class="card">

<div class="label">
SOS内容
</div>

<select
id="mainType"
class="select">

<option>体調が悪い</option>
<option>転倒した</option>
<option>薬がない</option>
<option>家に帰れない</option>
<option>助けてほしい</option>

</select>

<div class="label">
詳細
</div>

<textarea
id="memo"
class="textarea"
placeholder="状況を入力">
</textarea>

<button
class="sosBtn"
onclick="sendSOS()">

🚨 SOS送信

</button>

</div>

<a
href="index.html"
class="home">

🏠 トップへ戻る

</a>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbxH23_zris78LFP_5d0lXJe7gFwbVESIX5uNT0eGEKIPWgf71m-bM1CFX64fBu-wBmk/exec';

function sendSOS(){

const mainType =
document.getElementById(
'mainType'
).value;

const memo =
document.getElementById(
'memo'
).value;

const now =
new Date();

const userId =
localStorage.getItem('userId') ||
new URLSearchParams(location.search).get('id') ||
'';

const form =
new FormData();

form.append(
'action',
'watch'
);

form.append(
'id',
userId
);

form.append(
'status',
'SOS'
);

form.append(
'memo',
mainType + ' ' + memo
);

form.append(
'time',
now.toLocaleString('ja-JP')
);

fetch(
GAS_URL,
{
method:'POST',
body:form
}
)

.then(r=>r.text())

.then(()=>{

const data = {

mainType:mainType,

memo:memo,

time:
now.toLocaleString(
'ja-JP'
)

};

localStorage.setItem(
'lastSOS',
JSON.stringify(data)
);

alert(
'SOSを送信しました'
);

const familyTel =
localStorage.getItem(
'familyTel'
) || '';

if(familyTel){

if(
confirm(
'家族へ電話しますか？'
)
){

location.href =
'tel:' +
familyTel;

return;

}

}

location.href =
'family.html';

})

.catch(()=>{

alert(
'SOS送信失敗'
);

});

}

const last =
JSON.parse(
localStorage.getItem(
'lastSOS'
) || 'null'
);

if(last){

document.getElementById(
'memo'
).value =
last.memo || '';

document.getElementById(
'mainType'
).value =
last.mainType || '体調が悪い';

}

</script>

</body>
</html>
