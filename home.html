<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>帰宅しました</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
text-align:center;
}

.header{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
padding:28px;
border-radius:28px;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:#fff;
padding:24px;
border-radius:24px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
margin-bottom:16px;
}

.bigBtn{
width:100%;
border:none;
background:#2563eb;
color:#fff;
padding:40px;
border-radius:28px;
font-size:36px;
font-weight:900;
cursor:pointer;
}

.time{
margin-top:20px;
font-size:24px;
font-weight:900;
line-height:1.8;
}

.actionBtn{
display:block;
width:100%;
padding:20px;
border-radius:20px;
text-decoration:none;
text-align:center;
font-size:22px;
font-weight:900;
color:#fff;
margin-top:12px;
}

.telBtn{
background:#16a34a;
}

.lineBtn{
background:#06c755;
}

.home{
display:block;
width:100%;
border:none;
background:#475569;
color:#fff;
padding:20px;
border-radius:20px;
font-size:22px;
font-weight:900;
margin-top:16px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="header">
<h1>🏠 帰宅しました</h1>
</div>

<div class="card">

<button
class="bigBtn"
onclick="saveHome()">

🏠 帰宅しました

</button>

<div
id="timeArea"
class="time">

まだ記録がありません

</div>

<a
id="telBtn"
class="actionBtn telBtn"
style="display:none"
href="#">

📞 家族へ電話

</a>

<a
id="lineBtn"
class="actionBtn lineBtn"
style="display:none"
href="#">

💬 家族へLINE

</a>

<button
class="home"
onclick="goHome()">

🏠 トップへ戻る

</button>

</div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec';

const USER_ID =
localStorage.getItem('userId') || '';

const USER_NAME =
localStorage.getItem('userName') || '';

function goHome(){

location.href =
'https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/';

}

function showButtons(){

const tel =
localStorage.getItem(
'familyTel'
) || '';

const line =
localStorage.getItem(
'familyLine'
) || '';

if(tel){

const telBtn =
document.getElementById(
'telBtn'
);

telBtn.href =
'tel:' + tel;

telBtn.style.display =
'block';

}

if(line){

const lineBtn =
document.getElementById(
'lineBtn'
);

lineBtn.href =
line;

lineBtn.style.display =
'block';

}

}

function saveHome(){

const now =
new Date();

const data = {

time:
now.toLocaleString(
'ja-JP'
)

};

const formData =
new URLSearchParams();

formData.append(
'action',
'watch'
);

formData.append(
'id',
USER_ID
);

formData.append(
'name',
USER_NAME
);

formData.append(
'status',
'帰宅'
);

formData.append(
'memo',
'帰宅しました'
);

fetch(
GAS_URL,
{
method:'POST',
headers:{
'Content-Type':
'application/x-www-form-urlencoded'
},
body:formData.toString()
}
)
.then(r=>r.json())
.then(()=>{

localStorage.setItem(
'lastHome',
JSON.stringify(data)
);

document.getElementById(
'timeArea'
).innerHTML =

'最終帰宅<br><br>' +

data.time;

showButtons();

alert(
'帰宅を記録しました'
);

})
.catch(()=>{

alert(
'通信エラー'
);

});

}

const last =
JSON.parse(
localStorage.getItem(
'lastHome'
) || 'null'
);

if(last){

document.getElementById(
'timeArea'
).innerHTML =

'最終帰宅<br><br>' +

last.time;

showButtons();

}

</script>

</body>
</html>
