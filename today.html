<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>今日の予定</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
padding:12px;
background:#eef4f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#123;
}

.wrap{
max-width:720px;
margin:0 auto;
}

.header{
background:#1565c0;
color:white;
border-radius:28px;
padding:24px 16px;
text-align:center;
margin-bottom:16px;
}

.title{
font-size:40px;
font-weight:900;
margin:0;
line-height:1.3;
}

.card{
background:white;
border-radius:28px;
padding:18px;
margin-bottom:16px;
box-shadow:0 8px 22px rgba(0,0,0,.08);
}

.status{
font-size:26px;
font-weight:900;
text-align:center;
color:#666;
line-height:1.5;
margin-bottom:16px;
white-space:pre-wrap;
}

.bigBtn{
display:block;
width:100%;
border:none;
border-radius:28px;
padding:26px 12px;
font-size:28px;
font-weight:900;
color:white;
cursor:pointer;
margin-bottom:14px;
text-align:center;
text-decoration:none;
}

.reloadBtn{
background:#1976d2;
}

.backBtn{
background:#555;
}

.addBtn{
background:#2e7d32;
}

.sectionTitle{
font-size:34px;
font-weight:900;
color:#1565c0;
margin:0 0 16px;
}

.scheduleCard{
background:#f8fbff;
border:4px solid #d7e6ff;
border-radius:26px;
padding:20px;
margin-bottom:18px;
}

.time{
font-size:34px;
font-weight:900;
color:#d84315;
margin-bottom:14px;
line-height:1.4;
}

.todoText{
font-size:32px;
font-weight:900;
line-height:1.6;
color:#1f2d3d;
white-space:pre-wrap;
word-break:break-word;
}

.deleteBtn{
width:100%;
border:none;
border-radius:24px;
padding:22px 12px;
font-size:26px;
font-weight:900;
color:white;
background:#c62828;
margin-top:18px;
cursor:pointer;
}

.empty{
background:#f5f7fa;
border-radius:24px;
padding:24px;
font-size:30px;
font-weight:900;
color:#666;
line-height:1.5;
text-align:center;
}

.error{
background:#fff3f3;
border-radius:24px;
padding:22px;
font-size:24px;
font-weight:900;
color:#b71c1c;
line-height:1.6;
white-space:pre-wrap;
}

.bottomSpace{
height:20px;
}

@media(max-width:600px){

.title{
font-size:34px;
}

.status{
font-size:23px;
}

.sectionTitle{
font-size:30px;
}

.time{
font-size:30px;
}

.todoText{
font-size:29px;
}

.bigBtn,
.deleteBtn{
font-size:24px;
}

.empty{
font-size:26px;
}

}

</style>
</head>

<body>

<div class="wrap">

<div class="header">
<h1 class="title">
今日の予定
</h1>
</div>

<div class="card">

<a class="bigBtn backBtn" href="index.html?v=final1">
⬅️ 最初の画面に戻る
</a>

<a class="bigBtn addBtn" href="voice.html?v=newgas1">
➕ 予定を入れる
</a>

<button class="bigBtn reloadBtn" id="reloadBtn">
🔄 更新する
</button>

<div class="status" id="statusBox">
読み込み中...
</div>

</div>
