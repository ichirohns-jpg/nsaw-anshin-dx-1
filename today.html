<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>今日の予定</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:12px;
  background:#eef4f8;
  font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  color:#123;
}

.wrap{
  max-width:720px;
  margin:auto;
}

.card{
  background:#fff;
  border-radius:26px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.header{
  background:#1565c0;
  color:white;
  border-radius:26px;
  padding:24px 18px;
  margin-bottom:16px;
  text-align:center;
}

.title{
  font-size:40px;
  font-weight:900;
  line-height:1.3;
  margin:0;
}

.sub{
  font-size:24px;
  font-weight:900;
  line-height:1.5;
  margin-top:12px;
}

.status{
  font-size:24px;
  font-weight:900;
  text-align:center;
  line-height:1.5;
  color:#666;
  margin:8px 0 16px;
  white-space:pre-wrap;
}

.sectionTitle{
  font-size:32px;
  font-weight:900;
  color:#1565c0;
  margin:0 0 14px;
}

.event{
  background:#f5f8ff;
  border:4px solid #d7e6ff;
  border-radius:26px;
  padding:22px;
  margin-bottom:18px;
}

.time{
  font-size:36px;
  font-weight:900;
  color:#d84315;
  line-height:1.35;
  margin-bottom:20px;
}

.eventTitle{
  font-size:34px;
  font-weight:900;
  line-height:1.6;
  color:#1f2d3d;
  white-space:pre-wrap;
}

.empty{
  background:#f5f7fa;
  border-radius:22px;
  padding:22px;
  font-size:28px;
  font-weight:900;
  color:#666;
  line-height:1.6;
}

.reloadBtn{
  width:100%;
  border:none;
  border-radius:24px;
  padding:24px 12px;
  font-size:28px;
  font-weight:900;
  color:white;
  background:#1976d2;
  cursor:pointer;
  margin-bottom:12px;
}

.backBtn{
  display:block;
  text-align:center;
  text-decoration:none;
  background:#555;
  color:white;
  border-radius:24px;
  padding:24px 12px;
  font-size:26px;
  font-weight:900;
  margin-bottom:12px;
}

.deleteBtn{
  width:100%;
  border:none;
  border-radius:24px;
  padding:22px 12px;
  font-size:26px;
  font-weight:900;
  color:white;
  background:#c62828;
  cursor:pointer;
  margin-top:18px;
}

.error{
  background:#fff3f3;
  border-radius:22px;
  padding:20px;
  font-size:24px;
  font-weight:900;
  color:#b71c1c;
  line-height:1.6;
  white-space:pre-wrap;
}

.small{
  font-size:18px;
  font-weight:800;
  line-height:1.6;
  color:#666;
  text-align:center;
  margin-top:12px;
}

@media(max-width:600px){
  .title{font-size:34px}
  .sub{font-size:22px}
  .sectionTitle{font-size:29px}
  .time{font-size:32px}
  .eventTitle{font-size:30px}
  .empty{font-size:25px}
  .reloadBtn,.backBtn,.deleteBtn{font-size:24px}
  .status{font-size:22px}
}
</style>
</head>

<body>

<div class="wrap">

<div class="header">
  <div class="title">今日の予定</div>
  <div class="sub">音声入力で登録した予定だけ<br>大きな文字で表示します</div>
</div>

<div class="card">
  <div class="status" id="status">予定を読み込み中...</div>

  <button class="reloadBtn" id="reloadBtn">
    予定を更新する
  </button>

  <a class="backBtn" href="voice.html?v=sheet-delete1">
    音声入力へ戻る
  </a>

  <div class="small">
    このページはGoogleカレンダーを直接読みません。<br>
    音声入力で登録済みの予定だけ表示します。<br>
    削除すると、Googleカレンダーの予定も削除します。
  </div>
</div>

<div class="card">
  <div class="sectionTitle">今日</div>
  <div id="todayBox">
    <div class="empty">読み込み中...</div>
  </div>
</div>

<div class="card">
  <div class="sectionTitle">明日</div>
  <div id="tomorrowBox">
    <div class="empty">読み込み中...</div>
  </div>
</div>

</div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbxNbbzhYNpR38882QZPGxIRGlNkk-oF28MWbvk7ODIDI0YbVGO7UMB0XbeYO6TzYAOq/exec';

const statusBox =
document.getElementById("status");

const todayBox =
document.getElementById("todayBox");

const tomorrowBox =
document.getElementById("tomorrowBox");

const reloadBtn =
document.getElementById("reloadBtn");

let isDeleting =
false;

function stopAllSpeech(){
  try{
    if(window.speechSynthesis){
      window.speechSynthesis.cancel();
    }
  }catch(e){}
}

window.addEventListener("load",function(){
  stopAllSpeech();
});

window.addEventListener("pageshow",function(){
  stopAllSpeech();
});

window.addEventListener("pagehide",function(){
  stopAllSpeech();
});

function escapeHtml(str){
  return String(str || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function buildEvents(events,emptyText){

  if(!events || events.length === 0){

    return `
      <div class="empty">
        ${emptyText}
      </div>
    `;

  }

  let html =
  "";

  events.forEach(function(ev){

    html += `
      <div class="event">
        <div class="time">
          ${escapeHtml(ev.start)} 〜<br>
          ${escapeHtml(ev.end)}
        </div>

        <div class="eventTitle">
          ${escapeHtml(ev.title)}
        </div>

        <button
          class="deleteBtn"
          data-row="${escapeHtml(ev.row)}"
          data-eventid="${escapeHtml(ev.eventId)}"
        >
          この予定を消す
        </button>
      </div>
    `;

  });

  return html;

}

async function loadSchedule(){

  stopAllSpeech();

  statusBox.innerText =
  "予定を読み込み中...";

  todayBox.innerHTML =
  '<div class="empty">読み込み中...</div>';

  tomorrowBox.innerHTML =
  '<div class="empty">読み込み中...</div>';

  try{

    const url =
    GAS_URL +
    '?mode=today&t=' +
    Date.now();

    const response =
    await fetch(url);

    const data =
    await response.json();

    console.log(data);

    if(!data.ok){

      throw new Error(
        data.error ||
        data.message ||
        "予定を取得できませんでした"
      );

    }

    todayBox.innerHTML =
    buildEvents(
      data.today,
      "今日の予定はありません"
    );

    tomorrowBox.innerHTML =
    buildEvents(
      data.tomorrow,
      "明日の予定はありません"
    );

    statusBox.innerText =
    "予定を読み込みました";

    bindDeleteButtons();

  }catch(error){

    console.error(error);

    statusBox.innerText =
    "読み込み失敗";

    todayBox.innerHTML =
    `
      <div class="error">
        ${escapeHtml(error.message || String(error))}
      </div>
    `;

    tomorrowBox.innerHTML =
    `
      <div class="empty">
        予定を表示できません
      </div>
    `;

  }

}

function bindDeleteButtons(){

  const buttons =
  document.querySelectorAll(".deleteBtn");

  buttons.forEach(function(btn){

    btn.onclick =
    async function(){

      if(isDeleting){
        return;
      }

      const row =
      btn.getAttribute("data-row");

      const eventId =
      btn.getAttribute("data-eventid");

      const ok =
      confirm(
        "この予定を消しますか？\nGoogleカレンダーからも削除します。"
      );

      if(!ok){
        return;
      }

      isDeleting =
      true;

      btn.disabled =
      true;

      statusBox.innerText =
      "削除中...";

      try{

        const url =
        GAS_URL +
        '?mode=delete&row=' +
        encodeURIComponent(row) +
        '&eventId=' +
        encodeURIComponent(eventId || '') +
        '&t=' +
        Date.now();

        const response =
        await fetch(url);

        const data =
        await response.json();

        console.log(data);

        if(!data.ok){

          throw new Error(
            data.error ||
            data.message ||
            "削除できませんでした"
          );

        }

        statusBox.innerText =
        "削除しました";

        await loadSchedule();

      }catch(error){

        console.error(error);

        statusBox.innerText =
        "削除失敗";

        alert(
          error.message ||
          "削除できませんでした"
        );

      }finally{

        isDeleting =
        false;

      }

    };

  });

}

reloadBtn.onclick =
function(){
  loadSchedule();
};

loadSchedule();

</script>

</body>
</html>
