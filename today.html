<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>今日の予定</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:12px;
  background:#eef4f8;
  font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  color:#123;
}

.wrap{
  max-width:720px;
  margin:auto;
}

.card{
  background:#fff;
  border-radius:26px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.header{
  background:#1565c0;
  color:white;
  border-radius:26px;
  padding:24px 18px;
  margin-bottom:16px;
  text-align:center;
}

.title{
  font-size:40px;
  font-weight:900;
  line-height:1.3;
  margin:0;
}

.sub{
  font-size:24px;
  font-weight:900;
  line-height:1.5;
  margin-top:12px;
}

.status{
  font-size:24px;
  font-weight:900;
  text-align:center;
  line-height:1.5;
  color:#666;
  margin:8px 0 16px;
}

.sectionTitle{
  font-size:32px;
  font-weight:900;
  color:#1565c0;
  margin:0 0 14px;
}

.event{
  background:#f5f8ff;
  border:4px solid #d7e6ff;
  border-radius:26px;
  padding:22px;
  margin-bottom:18px;
}

.time{
  font-size:36px;
  font-weight:900;
  color:#d84315;
  line-height:1.35;
  margin-bottom:20px;
}

.eventTitle{
  font-size:34px;
  font-weight:900;
  line-height:1.6;
  color:#1f2d3d;
  white-space:pre-wrap;
}

.empty{
  background:#f5f7fa;
  border-radius:22px;
  padding:22px;
  font-size:28px;
  font-weight:900;
  color:#666;
  line-height:1.6;
}

.reloadBtn{
  width:100%;
  border:none;
  border-radius:24px;
  padding:24px 12px;
  font-size:28px;
  font-weight:900;
  color:white;
  background:#1976d2;
  cursor:pointer;
  margin-bottom:12px;
}

.backBtn{
  display:block;
  text-align:center;
  text-decoration:none;
  background:#555;
  color:white;
  border-radius:24px;
  padding:24px 12px;
  font-size:26px;
  font-weight:900;
}

.error{
  background:#fff3f3;
  border-radius:22px;
  padding:20px;
  font-size:24px;
  font-weight:900;
  color:#b71c1c;
  line-height:1.6;
  white-space:pre-wrap;
}

.small{
  font-size:18px;
  font-weight:800;
  line-height:1.6;
  color:#666;
  text-align:center;
  margin-top:12px;
}

@media(max-width:600px){
  .title{font-size:34px}
  .sub{font-size:22px}
  .sectionTitle{font-size:29px}
  .time{font-size:32px}
  .eventTitle{font-size:30px}
  .empty{font-size:25px}
  .reloadBtn,.backBtn{font-size:24px}
  .status{font-size:22px}
}
</style>
</head>

<body>

<div class="wrap">

<div class="header">
  <div class="title">今日の予定</div>
  <div class="sub">Googleカレンダーの予定を<br>大きな文字で確認します</div>
</div>

<div class="card">
  <div class="status" id="status">予定を読み込み中...</div>

  <button class="reloadBtn" id="reloadBtn">
    予定を更新する
  </button>

  <a class="backBtn" href="voice.html?v=reset1">
    音声入力へ戻る
  </a>

  <div class="small">
    このページは読み上げません。<br>
    同じ予定が複数あっても、画面では1回だけ表示します。
  </div>
</div>

<div class="card">
  <div class="sectionTitle">今日</div>
  <div id="todayBox">
    <div class="empty">読み込み中...</div>
  </div>
</div>

<div class="card">
  <div class="sectionTitle">明日</div>
  <div id="tomorrowBox">
    <div class="empty">読み込み中...</div>
  </div>
</div>

</div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbyuvE3vVhq63yNMasPZhaJR3zMat9ShOAY7sDBZtIkRWUJ231LamYQDaJ7ro-qX05Fk/exec';

const statusBox =
document.getElementById("status");

const todayBox =
document.getElementById("todayBox");

const tomorrowBox =
document.getElementById("tomorrowBox");

const reloadBtn =
document.getElementById("reloadBtn");

function stopAllSpeech(){
  try{
    if(window.speechSynthesis){
      window.speechSynthesis.cancel();
    }
  }catch(e){}
}

window.addEventListener("load",function(){
  stopAllSpeech();
});

window.addEventListener("pageshow",function(){
  stopAllSpeech();
});

window.addEventListener("pagehide",function(){
  stopAllSpeech();
});

function escapeHtml(str){
  return String(str || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function uniqueEvents(events){

  const seen =
  {};

  const list =
  [];

  (events || []).forEach(function(ev){

    const key =
    String(ev.start || "") +
    "|" +
    String(ev.end || "") +
    "|" +
    String(ev.title || "");

    if(!seen[key]){
      seen[key] = true;
      list.push(ev);
    }

  });

  return list;

}

function buildEvents(events,emptyText){

  const unique =
  uniqueEvents(events);

  if(!unique || unique.length === 0){

    return `
      <div class="empty">
        ${emptyText}
      </div>
    `;

  }

  let html =
  "";

  unique.forEach(function(ev){

    html += `
      <div class="event">
        <div class="time">
          ${escapeHtml(ev.start)} 〜<br>
          ${escapeHtml(ev.end)}
        </div>
        <div class="eventTitle">
          ${escapeHtml(ev.title)}
        </div>
      </div>
    `;

  });

  return html;

}

async function loadSchedule(){

  stopAllSpeech();

  statusBox.innerText =
  "予定を読み込み中...";

  todayBox.innerHTML =
  '<div class="empty">読み込み中...</div>';

  tomorrowBox.innerHTML =
  '<div class="empty">読み込み中...</div>';

  try{

    const url =
    GAS_URL +
    '?mode=today&t=' +
    Date.now();

    const response =
    await fetch(url);

    const data =
    await response.json();

    console.log(data);

    if(!data.ok){

      throw new Error(
        data.error ||
        data.message ||
        "予定を取得できませんでした"
      );

    }

    todayBox.innerHTML =
    buildEvents(
      data.today,
      "今日の予定はありません"
    );

    tomorrowBox.innerHTML =
    buildEvents(
      data.tomorrow,
      "明日の予定はありません"
    );

    statusBox.innerText =
    "予定を読み込みました";

  }catch(error){

    console.error(error);

    statusBox.innerText =
    "読み込み失敗";

    todayBox.innerHTML =
    `
      <div class="error">
        ${escapeHtml(error.message || String(error))}
      </div>
    `;

    tomorrowBox.innerHTML =
    `
      <div class="empty">
        予定を表示できません
      </div>
    `;

  }

}

reloadBtn.onclick =
function(){
  loadSchedule();
};

loadSchedule();

</script>

</body>
</html>
