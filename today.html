<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日の予定</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:14px;
  background:#eef4f8;
  font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  color:#123;
}

.wrap{
  max-width:720px;
  margin:0 auto;
}

.header{
  background:#1565c0;
  color:white;
  border-radius:26px;
  padding:24px 18px;
  text-align:center;
  margin-bottom:16px;
}

.headerTitle{
  font-size:38px;
  font-weight:900;
  line-height:1.35;
}

.headerSub{
  font-size:22px;
  font-weight:900;
  line-height:1.6;
  margin-top:10px;
}

.card{
  background:white;
  border-radius:26px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.status{
  font-size:24px;
  font-weight:900;
  text-align:center;
  color:#666;
  line-height:1.6;
  margin-bottom:16px;
  white-space:pre-wrap;
}

.sectionTitle{
  font-size:32px;
  font-weight:900;
  color:#1565c0;
  margin-bottom:16px;
}

.scheduleCard{
  background:#f5f8ff;
  border:4px solid #d7e6ff;
  border-radius:26px;
  padding:22px;
  margin-bottom:18px;
}

.time{
  font-size:36px;
  font-weight:900;
  color:#d84315;
  line-height:1.35;
  margin-bottom:18px;
}

.todoText{
  font-size:32px;
  font-weight:900;
  line-height:1.6;
  color:#1f2d3d;
  white-space:pre-wrap;
  word-break:break-word;
}

.btnDelete{
  width:100%;
  border:none;
  border-radius:24px;
  padding:22px 12px;
  font-size:26px;
  font-weight:900;
  color:white;
  background:#c62828;
  margin-top:18px;
  cursor:pointer;
}

.btnReload{
  width:100%;
  border:none;
  border-radius:24px;
  padding:24px 12px;
  font-size:28px;
  font-weight:900;
  color:white;
  background:#1976d2;
  margin-bottom:12px;
  cursor:pointer;
}

.btnBack{
  display:block;
  width:100%;
  text-align:center;
  text-decoration:none;
  border-radius:24px;
  padding:24px 12px;
  font-size:26px;
  font-weight:900;
  color:white;
  background:#555;
}

.empty{
  background:#f5f7fa;
  border-radius:22px;
  padding:22px;
  font-size:28px;
  font-weight:900;
  color:#666;
  line-height:1.6;
}

.error{
  background:#fff3f3;
  border-radius:22px;
  padding:22px;
  font-size:24px;
  font-weight:900;
  color:#b71c1c;
  line-height:1.6;
  white-space:pre-wrap;
}

.small{
  font-size:18px;
  font-weight:800;
  color:#666;
  line-height:1.6;
  text-align:center;
  margin-top:12px;
}

@media(max-width:600px){
  .headerTitle{
    font-size:34px;
  }

  .headerSub{
    font-size:21px;
  }

  .sectionTitle{
    font-size:29px;
  }

  .time{
    font-size:32px;
  }

  .todoText{
    font-size:30px;
  }

  .btnReload,
  .btnBack,
  .btnDelete{
    font-size:24px;
  }

  .status{
    font-size:22px;
  }

  .empty{
    font-size:25px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="header">
    <div class="headerTitle">今日の予定</div>
    <div class="headerSub">
      音声入力で登録した予定だけ<br>
      大きな文字で表示します
    </div>
  </div>

  <div class="card">
    <div id="statusBox" class="status">
      読み込み中...
    </div>

    <button class="btnReload" id="btnReload">
      予定を更新する
    </button>

    <a class="btnBack" href="voice.html?v=sheet-delete1">
      予定を入れる画面に戻る
    </a>

    <div class="small">
      このページは読み上げません。<br>
      Googleカレンダーを直接読まず、スプレッドシートの予定だけ表示します。
    </div>
  </div>

  <div class="card">
    <div class="sectionTitle">今日</div>
    <div id="todayList">
      <div class="empty">読み込み中...</div>
    </div>
  </div>

  <div class="card">
    <div class="sectionTitle">明日</div>
    <div id="tomorrowList">
      <div class="empty">読み込み中...</div>
    </div>
  </div>

</div>

<script>
const GAS_URL =
'https://script.google.com/macros/s/AKfycbxNbbzhYNpR38882QZPGxIRGlNkk-oF28MWbvk7ODIDI0YbVGO7UMB0XbeYO6TzYAOq/exec';

const statusBox =
document.getElementById("statusBox");

const todayList =
document.getElementById("todayList");

const tomorrowList =
document.getElementById("tomorrowList");

const btnReload =
document.getElementById("btnReload");

let isDeleting =
false;

function stopAllSpeech(){
  try{
    if(window.speechSynthesis){
      window.speechSynthesis.cancel();
    }
  }catch(e){}
}

window.addEventListener("load",function(){
  stopAllSpeech();
  loadSchedule();
});

window.addEventListener("pageshow",function(){
  stopAllSpeech();
});

window.addEventListener("pagehide",function(){
  stopAllSpeech();
});

function escapeHtml(str){
  return String(str || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function normalizeList(data){

  if(data && data.status === "success" && Array.isArray(data.data)){
    return {
      today:data.data,
      tomorrow:[]
    };
  }

  if(data && data.ok === true){
    return {
      today:Array.isArray(data.today) ? data.today : [],
      tomorrow:Array.isArray(data.tomorrow) ? data.tomorrow : []
    };
  }

  return {
    today:[],
    tomorrow:[]
  };

}

function buildList(list,emptyText){

  if(!list || list.length === 0){
    return `
      <div class="empty">
        ${emptyText}
      </div>
    `;
  }

  let html = "";

  list.forEach(function(item){

    const title =
    item.text ||
    item.title ||
    "";

    const start =
    item.start ||
    "";

    const end =
    item.end ||
    "";

    const row =
    item.row ||
    "";

    const eventId =
    item.eventId ||
    item.event_id ||
    "";

    html += `
      <div class="scheduleCard">
        ${
          start || end
          ? `<div class="time">${escapeHtml(start)} 〜 ${escapeHtml(end)}</div>`
          : ""
        }

        <div class="todoText">
          ${escapeHtml(title)}
        </div>

        <button
          class="btnDelete"
          data-row="${escapeHtml(row)}"
          data-eventid="${escapeHtml(eventId)}"
        >
          この予定を消す
        </button>
      </div>
    `;
  });

  return html;
}

async function loadSchedule(){

  stopAllSpeech();

  statusBox.innerText =
  "予定を読み込み中...";

  todayList.innerHTML =
  '<div class="empty">読み込み中...</div>';

  tomorrowList.innerHTML =
  '<div class="empty">読み込み中...</div>';

  try{

    const url =
    GAS_URL +
    '?mode=today&t=' +
    Date.now();

    const response =
    await fetch(url);

    const data =
    await response.json();

    console.log(data);

    if(
      !(data.ok === true) &&
      !(data.status === "success")
    ){
      throw new Error(
        data.error ||
        data.message ||
        "予定を取得できませんでした"
      );
    }

    const lists =
    normalizeList(data);

    todayList.innerHTML =
    buildList(
      lists.today,
      "今日の予定はありません"
    );

    tomorrowList.innerHTML =
    buildList(
      lists.tomorrow,
      "明日の予定はありません"
    );

    statusBox.innerText =
    "予定を読み込みました";

    bindDeleteButtons();

  }catch(error){

    console.error(error);

    statusBox.innerText =
    "読み込み失敗";

    todayList.innerHTML =
    `
      <div class="error">
        ${escapeHtml(error.message || String(error))}
      </div>
    `;

    tomorrowList.innerHTML =
    `
      <div class="empty">
        予定を表示できません
      </div>
    `;

  }
}

function bindDeleteButtons(){

  const buttons =
  document.querySelectorAll(".btnDelete");

  buttons.forEach(function(btn){

    btn.onclick =
    async function(){

      if(isDeleting){
        return;
      }

      const row =
      btn.getAttribute("data-row") || "";

      const eventId =
      btn.getAttribute("data-eventid") || "";

      if(!row){
        alert("削除用の行番号がありません");
        return;
      }

      const ok =
      confirm("この予定を消しますか？");

      if(!ok){
        return;
      }

      isDeleting =
      true;

      btn.disabled =
      true;

      statusBox.innerText =
      "削除中...";

      try{

        const url =
        GAS_URL +
        '?mode=delete&row=' +
        encodeURIComponent(row) +
        '&eventId=' +
        encodeURIComponent(eventId) +
        '&t=' +
        Date.now();

        const response =
        await fetch(url);

        const data =
        await response.json();

        console.log(data);

        if(
          !(data.ok === true) &&
          !(data.status === "success")
        ){
          throw new Error(
            data.error ||
            data.message ||
            "削除できませんでした"
          );
        }

        statusBox.innerText =
        "削除しました";

        await loadSchedule();

      }catch(error){

        console.error(error);

        statusBox.innerText =
        "削除失敗";

        alert(
          error.message ||
          "削除できませんでした"
        );

      }finally{

        isDeleting =
        false;

        btn.disabled =
        false;

      }
    };
  });
}

btnReload.onclick =
function(){
  loadSchedule();
};
</script>

</body>
</html>
