<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>支援者ページ</title>

<link rel="icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
background:linear-gradient(180deg,#000000 0%,#08111d 50%,#000000 100%);
color:#fff;
min-height:100vh;
}

.wrap{
max-width:900px;
margin:auto;
padding:16px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:20px;
margin-bottom:16px;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:18px;
border:none;
border-radius:18px;
margin-bottom:12px;
font-size:22px;
background:rgba(255,255,255,.1);
color:#fff;
text-align:center;
}

button{
width:100%;
padding:20px;
border:none;
border-radius:20px;
font-size:24px;
font-weight:900;
color:#fff;
cursor:pointer;
margin-bottom:10px;
}

.login-btn{
background:linear-gradient(135deg,#00a3c4,#00d4ff);
}

.ok-btn{
background:linear-gradient(135deg,#00c853,#00e676);
}

.map-btn{
background:linear-gradient(135deg,#1565c0,#42a5f5);
}

.home-btn{
background:linear-gradient(135deg,#455a64,#607d8b);
}

.name{
font-size:30px;
font-weight:900;
text-align:center;
margin-bottom:10px;
}

.status{
font-size:26px;
font-weight:900;
text-align:center;
color:#00e676;
margin-bottom:20px;
}

.item{
background:rgba(255,255,255,.08);
padding:16px;
border-radius:18px;
margin-bottom:12px;
}

.label{
font-size:14px;
opacity:.7;
margin-bottom:5px;
}

.value{
font-size:22px;
font-weight:900;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
👪 支援者ページ
</div>

<input
id="supportKey"
maxlength="4"
placeholder="4桁キー">

<button
class="login-btn"
onclick="loginSupport()">
閲覧する
</button>

</div>

<div
id="mainArea"
class="hidden">

<div class="card">

<div
id="userName"
class="name">
利用者
</div>

<div
id="userStatus"
class="status">
😊 元気です
</div>

</div>

<div class="card">

<div class="item">
<div class="label">最終確認</div>
<div id="lastTime" class="value">---</div>
</div>

<div class="item">
<div class="label">住所</div>
<div id="address" class="value">---</div>
</div>

<div class="item">
<div class="label">電話番号</div>
<div id="tel" class="value">---</div>
</div>

<div class="item">
<div class="label">本日の予定</div>
<div id="schedule" class="value">---</div>
</div>

<div class="item">
<div class="label">見守り履歴</div>
<div id="history" class="value">---</div>
</div>

</div>

<div class="card">

<button
class="ok-btn"
onclick="location.href='app.html?id='+USER_ID">
😊 本人ページ
</button>

<button
class="map-btn"
onclick="location.href='map.html?id='+USER_ID">
📍 地図を見る
</button>

<button
class="home-btn"
onclick="location.href='index.html'">
🏠 ホーム
</button>

</div>

</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

const USER_ID =
new URLSearchParams(
location.search
).get("id") || "";

let USER_DATA = null;

async function loginSupport(){

const key =
document.getElementById(
"supportKey"
).value.trim();

if(key===""){

alert(
"4桁キーを入力してください"
);

return;

}

try{

const response =
await fetch(
GAS_URL +
"?action=user&id=" +
encodeURIComponent(USER_ID)
);

const json =
await response.json();

const user =
json.data || {};

if(
String(user.supportKey || "")
!== String(key)
){

alert(
"キーが違います"
);

return;

}

USER_DATA = user;

document
.getElementById(
"mainArea"
)
.classList
.remove(
"hidden"
);

document
.getElementById(
"userName"
).innerHTML =
user.name || "";

document
.getElementById(
"address"
).innerHTML =
user.address || "-";

document
.getElementById(
"tel"
).innerHTML =
user.tel || "-";

loadRecords();

loadSchedules();

}catch(error){

alert(
"通信エラー"
);

}

}

async function loadRecords(){

try{

const response =
await fetch(
GAS_URL +
"?action=records&id=" +
encodeURIComponent(USER_ID)
);

const json =
await response.json();

const data =
json.data || [];

if(data.length){

document
.getElementById(
"lastTime"
)
.innerHTML =
data[0].date || "-";

document
.getElementById(
"userStatus"
)
.innerHTML =
data[0].status || "-";

document
.getElementById(
"history"
)
.innerHTML =
data[0].memo || "-";

}

}catch(error){}

}

async function loadSchedules(){

try{

const response =
await fetch(
GAS_URL +
"?action=scheduleList&id=" +
encodeURIComponent(USER_ID)
);

const json =
await response.json();

const data =
json.data || [];

if(data.length){

document
.getElementById(
"schedule"
)
.innerHTML =
data[0].date +
" " +
data[0].time +
"<br>" +
data[0].title;

}

}catch(error){}

}

</script>

</body>
</html>
