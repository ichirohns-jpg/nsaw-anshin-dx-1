<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>支援者ページ</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#eef3f8;
font-family:
"Hiragino Sans",
"Yu Gothic",
sans-serif;
}

.wrap{
max-width:760px;
margin:auto;
padding:18px;
}

.card{
background:white;
border-radius:30px;
padding:24px;
margin-bottom:24px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.title{
font-size:34px;
font-weight:900;
margin-bottom:24px;
color:#fb8c00;
}

.subTitle{
font-size:30px;
font-weight:900;
margin-bottom:18px;
color:#546e7a;
}

label{
display:block;
font-size:24px;
font-weight:900;
margin-bottom:10px;
color:#666;
}

input{
width:100%;
padding:24px;
margin-bottom:22px;
font-size:34px;
font-weight:900;
border-radius:24px;
border:2px solid #ddd;
background:white;
}

textarea{
width:100%;
height:180px;
padding:24px;
margin-bottom:22px;
font-size:34px;
font-weight:900;
border-radius:24px;
border:2px solid #ddd;
background:white;
resize:none;
font-family:
"Hiragino Sans",
"Yu Gothic",
sans-serif;
}

.saveBtn{
width:100%;
background:#fb8c00;
border:none;
border-radius:30px;
padding:34px;
font-size:42px;
font-weight:900;
color:white;
margin-bottom:24px;
}

.orangeBtn{
width:100%;
background:#fb8c00;
border:none;
border-radius:30px;
padding:34px;
font-size:38px;
font-weight:900;
color:white;
margin-bottom:24px;
}

.grayBtn{
width:100%;
background:#546e7a;
border:none;
border-radius:30px;
padding:34px;
font-size:38px;
font-weight:900;
color:white;
margin-bottom:24px;
}

.scheduleCard{
background:white;
border-radius:30px;
padding:24px;
margin-bottom:24px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.date{
font-size:24px;
font-weight:900;
color:#666;
margin-bottom:8px;
}

.time{
font-size:44px;
font-weight:900;
color:#fb8c00;
margin-bottom:8px;
}

.text{
font-size:34px;
font-weight:900;
line-height:1.4;
}

.deleteBtn{
width:100%;
background:#e53935;
border:none;
border-radius:24px;
padding:20px;
margin-top:20px;
font-size:30px;
font-weight:900;
color:white;
}

.empty{
background:white;
border-radius:30px;
padding:40px;
font-size:34px;
font-weight:900;
text-align:center;
color:#7d8b99;
box-shadow:0 8px 20px rgba(0,0,0,.08);
margin-bottom:24px;
}

.logCard{
background:white;
border-radius:30px;
padding:24px;
margin-bottom:24px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.logEmoji{
font-size:54px;
margin-bottom:12px;
}

.logText{
font-size:34px;
font-weight:900;
line-height:1.5;
margin-bottom:10px;
}

.logDate{
font-size:24px;
font-weight:900;
color:#666;
}

.message{
font-size:30px;
font-weight:900;
color:#43a047;
text-align:center;
margin-top:20px;
}

.name{
font-size:30px;
font-weight:900;
color:#1976d2;
margin-bottom:12px;
}

.alertName{
font-size:34px;
font-weight:900;
color:#e53935;
margin-bottom:10px;
}

.alertText{
font-size:28px;
font-weight:900;
color:#555;
}

</style>
</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">

支援者ページ

</div>

<label>

日付

</label>

<input
type="date"
id="date">

<label>

時間

</label>

<input
type="time"
id="time">

<label>

予定内容

</label>

<textarea
id="title"></textarea>

<button
class="saveBtn"
onclick="saveSchedule()">

予定を追加

</button>

<div
class="message"
id="message">

</div>

</div>

<div class="card">

<div class="subTitle">

今日未確認の人

</div>

<div id="notCheckedList">

<div class="empty">

確認中...

</div>

</div>

</div>

<div class="card">

<div class="subTitle">

予定一覧

</div>

<div
id="scheduleList">

</div>

</div>

<div class="card">

<div class="subTitle">

見守り履歴

</div>

<div id="logList">

<div class="empty">

読み込み中...

</div>

</div>

</div>

<button
class="orangeBtn"
onclick="location.href='med.html'">

薬・見守りを見る

</button>

<button
class="grayBtn"
onclick="location.href='garbage.html'">

戻る

</button>

</div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbzMamJOdxwJ4_WMcpfhMuhg5idmjczXE_XE6QezbsgOUtWSJ3iBDKPTRr2JxCNhRUjh/exec';

const SHEET_ID =
'13qavSy8Thod2S_UWtHf0C7s-IDVcpYYEMvRNPHpabjY';

function cell(c){

return c
? String(c.v ?? c.f ?? '').trim()
: '';

}

function renderSchedule(){

let list =
JSON.parse(
localStorage.getItem(
'todayScheduleList'
) || '[]'
);

const box =
document.getElementById(
'scheduleList'
);

if(list.length===0){

box.innerHTML=`

<div class="empty">

予定はありません

</div>

`;

return;

}

box.innerHTML='';

list.forEach((item,index)=>{

box.innerHTML += `

<div class="scheduleCard">

<div class="date">

${item.date}

</div>

<div class="time">

${item.time}

</div>

<div class="text">

${item.title}

</div>

<button
class="deleteBtn"
onclick="deleteSchedule(${index})">

削除

</button>

</div>

`;

});

}

function saveSchedule(){

const date =
document.getElementById(
'date'
).value;

const time =
document.getElementById(
'time'
).value;

const title =
document.getElementById(
'title'
).value;

if(!date || !time || !title){

alert('全部入力してください');

return;

}

let list =
JSON.parse(
localStorage.getItem(
'todayScheduleList'
) || '[]'
);

list.push({

date:date,
time:time,
title:title

});

localStorage.setItem(
'todayScheduleList',
JSON.stringify(list)
);

const params =
new URLSearchParams(
location.search
);

const name =
params.get('name')
|| '利用者';

const url =
GAS_URL
+
'?mode=calendar'
+
'&name='
+ encodeURIComponent(name)
+
'&date='
+ encodeURIComponent(date)
+
'&time='
+ encodeURIComponent(time)
+
'&title='
+ encodeURIComponent(title);

fetch(url);

document
.getElementById('message')
.innerHTML =
'登録しました';

document
.getElementById('date')
.value='';

document
.getElementById('time')
.value='';

document
.getElementById('title')
.value='';

renderSchedule();

}

function deleteSchedule(index){

let list =
JSON.parse(
localStorage.getItem(
'todayScheduleList'
) || '[]'
);

list.splice(index,1);

localStorage.setItem(
'todayScheduleList',
JSON.stringify(list)
);

renderSchedule();

}

window.watchLogs=[];

function receiveLogs(json){

const rows =
json.table.rows || [];

const logs =
rows.map(r=>{

const c =
r.c || [];

return{

date:cell(c[0]),
name:cell(c[1]),
text:cell(c[2]),
emoji:cell(c[3]),
area:cell(c[4])

};

});

window.watchLogs = logs;

const box =
document.getElementById(
'logList'
);

if(logs.length===0){

box.innerHTML=`

<div class="empty">

まだ履歴はありません

</div>

`;

return;

}

box.innerHTML='';

logs.reverse().forEach(log=>{

box.innerHTML += `

<div class="logCard">

<div class="logEmoji">

${log.emoji}

</div>

<div class="name">

${log.name}

</div>

<div class="logText">

${log.text}

</div>

<div class="logDate">

${log.date}

</div>

</div>

`;

});

loadTargets();

}

function loadTargets(){

window.google.visualization.Query.setResponse =
receiveTargets;

const s2 =
document.createElement('script');

s2.src =
'https://docs.google.com/spreadsheets/d/'
+ SHEET_ID
+ '/gviz/tq?sheet='
+ encodeURIComponent('見守り対象')
+ '&tqx=out:json';

document.body.appendChild(s2);

}

function receiveTargets(json){

const rows =
json.table.rows || [];

const targets =
rows.map(r=>{

const c =
r.c || [];

return{

name:cell(c[0]),
area:cell(c[1])

};

});

const logNames =
window.watchLogs.map(
l=>l.name
);

const box =
document.getElementById(
'notCheckedList'
);

box.innerHTML='';

targets.forEach(t=>{

if(!logNames.includes(t.name)){

box.innerHTML += `

<div class="logCard">

<div class="alertName">

${t.name}

</div>

<div class="alertText">

今日はまだ確認がありません

</div>

</div>

`;

}

});

if(box.innerHTML===''){

box.innerHTML=`

<div class="empty">

全員確認済みです

</div>

`;

}

}

window.google={
visualization:{
Query:{
setResponse:receiveLogs
}
}
};

const s =
document.createElement('script');

s.src =
'https://docs.google.com/spreadsheets/d/'
+ SHEET_ID
+ '/gviz/tq?sheet='
+ encodeURIComponent('見守り記録')
+ '&tqx=out:json';

document.body.appendChild(s);

window.onload=function(){

renderSchedule();

};

</script>

</body>
</html>
