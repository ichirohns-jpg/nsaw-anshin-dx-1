<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>支援者ページ</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#eef3f8;
font-family:
"Hiragino Sans",
"Yu Gothic",
sans-serif;
}

.wrap{
max-width:760px;
margin:auto;
padding:18px;
}

.card{

background:white;

border-radius:30px;

padding:24px;

margin-bottom:24px;

box-shadow:
0 8px 20px rgba(0,0,0,.08);

}

.title{

font-size:34px;

font-weight:900;

margin-bottom:24px;

color:#fb8c00;

}

label{

display:block;

font-size:24px;

font-weight:900;

margin-bottom:10px;

color:#666;

}

input{

width:100%;

padding:24px;

margin-bottom:22px;

font-size:34px;

font-weight:900;

border-radius:24px;

border:2px solid #ddd;

background:white;

}

textarea{

width:100%;

height:180px;

padding:24px;

margin-bottom:22px;

font-size:34px;

font-weight:900;

border-radius:24px;

border:2px solid #ddd;

background:white;

resize:none;

font-family:
"Hiragino Sans",
"Yu Gothic",
sans-serif;

}

.saveBtn{

width:100%;

background:#fb8c00;

border:none;

border-radius:30px;

padding:34px;

font-size:42px;

font-weight:900;

color:white;

margin-bottom:24px;

}

.backBtn{

width:100%;

background:#546e7a;

border:none;

border-radius:30px;

padding:34px;

font-size:42px;

font-weight:900;

color:white;

}

.scheduleCard{

background:white;

border-radius:30px;

padding:24px;

margin-bottom:24px;

box-shadow:
0 8px 20px rgba(0,0,0,.08);

}

.date{

font-size:24px;

font-weight:900;

color:#666;

margin-bottom:8px;

}

.time{

font-size:44px;

font-weight:900;

color:#fb8c00;

margin-bottom:8px;

}

.text{

font-size:34px;

font-weight:900;

line-height:1.4;

}

.deleteBtn{

width:100%;

background:#e53935;

border:none;

border-radius:24px;

padding:20px;

margin-top:20px;

font-size:30px;

font-weight:900;

color:white;

}

.empty{

background:white;

border-radius:30px;

padding:40px;

font-size:34px;

font-weight:900;

text-align:center;

color:#7d8b99;

box-shadow:
0 8px 20px rgba(0,0,0,.08);

margin-bottom:24px;

}

.message{

font-size:30px;

font-weight:900;

color:#43a047;

text-align:center;

margin-top:20px;

}

</style>
</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">

支援者ページ

</div>

<label>

日付

</label>

<input
type="date"
id="date">

<label>

時間

</label>

<input
type="time"
id="time">

<label>

予定内容

</label>

<textarea
id="title"></textarea>

<button
class="saveBtn"
onclick="saveSchedule()">

予定を追加

</button>

<div
class="message"
id="message">

</div>

</div>

<div
id="scheduleList">

</div>

<button
class="backBtn"
onclick="location.href='garbage.html'">

戻る

</button>

</div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbxWrgnXRBN7os2J9KKr9yo357_hoK1ki1W0p0OP7-LneMeRk273nATGrz34xfDxtNsb/exec';

function renderSchedule(){

let list =
JSON.parse(
localStorage.getItem(
'todayScheduleList'
) || '[]'
);

const box =
document.getElementById(
'scheduleList'
);

if(list.length===0){

box.innerHTML=`

<div class="empty">

予定はありません

</div>

`;

return;

}

box.innerHTML='';

list.forEach((item,index)=>{

box.innerHTML += `

<div class="scheduleCard">

<div class="date">

${item.date}

</div>

<div class="time">

${item.time}

</div>

<div class="text">

${item.title}

</div>

<button
class="deleteBtn"
onclick="deleteSchedule(${index})">

削除

</button>

</div>

`;

});

}

function saveSchedule(){

const date =
document.getElementById(
'date'
).value;

const time =
document.getElementById(
'time'
).value;

const title =
document.getElementById(
'title'
).value;

if(!date || !time || !title){

alert('全部入力してください');

return;

}

let list =
JSON.parse(
localStorage.getItem(
'todayScheduleList'
) || '[]'
);

list.push({

date:date,
time:time,
title:title

});

localStorage.setItem(
'todayScheduleList',
JSON.stringify(list)
);

const params =
new URLSearchParams(
location.search
);

const name =
params.get('name')
|| '利用者';

const url =
GAS_URL
+
'?mode=calendar'
+
'&name='
+ encodeURIComponent(name)
+
'&date='
+ encodeURIComponent(date)
+
'&time='
+ encodeURIComponent(time)
+
'&title='
+ encodeURIComponent(title);

fetch(url);

document
.getElementById('message')
.innerHTML =
'登録しました';

document
.getElementById('date')
.value='';

document
.getElementById('time')
.value='';

document
.getElementById('title')
.value='';

renderSchedule();

}

function deleteSchedule(index){

let list =
JSON.parse(
localStorage.getItem(
'todayScheduleList'
) || '[]'
);

list.splice(index,1);

localStorage.setItem(
'todayScheduleList',
JSON.stringify(list)
);

renderSchedule();

}

window.onload=function(){

renderSchedule();

};

</script>

</body>
</html>
