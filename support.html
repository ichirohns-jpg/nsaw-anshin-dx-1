<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>支援者ページ｜見守りDX</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:560px;
margin:auto;
padding:16px;
}

.header{
background:#7b1fa2;
color:#fff;
border-radius:26px;
padding:22px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.back{
font-size:16px;
font-weight:900;
margin-bottom:12px;
cursor:pointer;
}

.title{
font-size:34px;
font-weight:900;
}

.sub{
font-size:16px;
margin-top:6px;
opacity:.95;
}

.card{
background:#fff;
border-radius:26px;
padding:20px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.name{
font-size:28px;
font-weight:900;
color:#7b1fa2;
margin-bottom:10px;
}

.status{
font-size:26px;
font-weight:900;
margin-bottom:10px;
}

.time{
font-size:16px;
font-weight:700;
color:#666;
margin-bottom:16px;
}

.memo{
background:#f3e5f5;
border-radius:18px;
padding:16px;
font-size:18px;
font-weight:700;
line-height:1.7;
}

.sectionTitle{
font-size:22px;
font-weight:900;
color:#7b1fa2;
margin-bottom:12px;
}

.item{
background:#f8f5fb;
border-left:8px solid #7b1fa2;
border-radius:18px;
padding:16px;
margin-bottom:12px;
}

.itemTitle{
font-size:20px;
font-weight:900;
}

.itemText{
font-size:16px;
font-weight:700;
color:#666;
margin-top:6px;
line-height:1.6;
}

.btn{
width:100%;
border:none;
border-radius:22px;
padding:20px;
font-size:24px;
font-weight:900;
color:#fff;
background:#7b1fa2;
margin-top:14px;
cursor:pointer;
}

.callBtn{
background:#e53935;
}

.footer{
display:flex;
justify-content:space-around;
margin-top:20px;
padding:18px 0;
background:#fff;
border-radius:22px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
font-size:14px;
font-weight:900;
color:#666;
}

</style>
</head>

<body>

<div class="wrap">

<div class="header">

<div class="back" onclick="location.href='index.html'">
← トップへ戻る
</div>

<div class="title">
👨‍👩‍👧 支援者ページ
</div>

<div class="sub">
見守り状況を確認します
</div>

</div>

<div class="card">

<div class="name">
山田 太郎 さん
</div>

<div class="status">
😊 元気です
</div>

<div class="time">
最終確認：2026-05-31 09:20
</div>

<div class="memo">
本日は朝の薬確認済み。<br>
午後2時に訪問予定があります。<br>
緊急対応は不要です。
</div>

<button class="btn" onclick="alert('支援確認しました')">
✅ 支援確認しました
</button>

<button class="btn callBtn" onclick="location.href='tel:119'">
🚨 緊急時 119へ電話
</button>

</div>

<div class="card">

<div class="sectionTitle">
📅 今日の予定
</div>

<div class="item">
<div class="itemTitle">
09:00 朝の薬
</div>
<div class="itemText">
確認済み
</div>
</div>

<div class="item">
<div class="itemTitle">
14:00 訪問予定
</div>
<div class="itemText">
支援者が訪問予定
</div>
</div>

<div class="item">
<div class="itemTitle">
18:00 夜の薬
</div>
<div class="itemText">
未確認
</div>
</div>

</div>

<div class="card">

<div class="sectionTitle">
📍 位置情報
</div>

<div class="item">
<div class="itemTitle">
現在地確認
</div>
<div class="itemText">
必要な場合は本人の現在地ボタンから確認します。
</div>
</div>

<button class="btn" onclick="window.open('https://www.google.com/maps','_blank')">
📍 Googleマップを開く
</button>

</div>

<div class="footer">

<div onclick="location.href='index.html'">
見守り
</div>

<div onclick="location.href='schedule.html'">
予定
</div>

<div onclick="location.href='gomi.html'">
ゴミ
</div>

<div onclick="location.href='news.html'">
地域情報
</div>

</div>

</div>

</body>
</html>
