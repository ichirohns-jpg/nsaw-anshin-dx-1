<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>支援者ページ</title>

<link rel="icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
background:linear-gradient(180deg,#000000 0%,#08111d 50%,#000000 100%);
color:#fff;
min-height:100vh;
}

.wrap{
max-width:900px;
margin:auto;
padding:16px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:20px;
margin-bottom:16px;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:18px;
border:none;
border-radius:18px;
margin-bottom:12px;
font-size:20px;
background:rgba(255,255,255,.1);
color:#fff;
}

button{
width:100%;
padding:20px;
border:none;
border-radius:20px;
font-size:24px;
font-weight:900;
color:#fff;
cursor:pointer;
margin-bottom:10px;
}

.login-btn{
background:linear-gradient(135deg,#00a3c4,#00d4ff);
}

.home-btn{
background:linear-gradient(135deg,#37474f,#607d8b);
}

.name{
font-size:30px;
font-weight:900;
text-align:center;
margin-bottom:10px;
}

.status{
font-size:22px;
font-weight:900;
text-align:center;
color:#00e676;
margin-bottom:20px;
}

.item{
background:rgba(255,255,255,.08);
padding:16px;
border-radius:18px;
margin-bottom:12px;
}

.label{
font-size:14px;
opacity:.7;
margin-bottom:5px;
}

.value{
font-size:22px;
font-weight:900;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
👪 支援者ページ
</div>

<input
id="supportKey"
maxlength="4"
placeholder="支援者閲覧キー">

<button
class="login-btn"
onclick="loginSupport()">
閲覧する
</button>

<button
class="home-btn"
onclick="location.href='index.html'">
ホームへ戻る
</button>

</div>

<div
id="supportArea"
class="hidden">

<div class="card">

<div
id="userName"
class="name">
利用者名
</div>

<div
id="userStatus"
class="status">
😊 元気です
</div>

</div>

<div class="card">

<div class="item">
<div class="label">最終確認</div>
<div id="lastCheck" class="value">---</div>
</div>

<div class="item">
<div class="label">服薬状況</div>
<div id="medicine" class="value">---</div>
</div>

<div class="item">
<div class="label">本日の予定</div>
<div id="schedule" class="value">---</div>
</div>

<div class="item">
<div class="label">最終位置</div>
<div id="location" class="value">---</div>
</div>

<div class="item">
<div class="label">緊急履歴</div>
<div id="emergency" class="value">異常なし</div>
</div>

</div>

</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

const USER_ID =
new URLSearchParams(
location.search
).get("id") || "";

async function loginSupport(){

const key =
document
.getElementById("supportKey")
.value
.trim();

if(key===""){

alert("支援者閲覧キーを入力してください");
return;

}

try{

const response =
await fetch(
GAS_URL +
"?action=user&id=" +
encodeURIComponent(USER_ID)
);

const json =
await response.json();

const user =
json.data || {};

if(
String(user.supportKey || "")
!== String(key)
){

alert("閲覧キーが違います");
return;

}

document
.getElementById("supportArea")
.classList
.remove("hidden");

document
.getElementById("userName")
.innerHTML =
user.name || "利用者";

document
.getElementById("userStatus")
.innerHTML =
"😊 元気です";

document
.getElementById("lastCheck")
.innerHTML =
user.lastCheck || "---";

document
.getElementById("medicine")
.innerHTML =
user.medicine || "---";

document
.getElementById("schedule")
.innerHTML =
user.schedule || "---";

document
.getElementById("location")
.innerHTML =
user.location || "---";

document
.getElementById("emergency")
.innerHTML =
user.emergency || "異常なし";

window.scrollTo({
top:500,
behavior:"smooth"
});

}catch(error){

alert("通信エラー");

}

}

</script>

</body>
</html>
