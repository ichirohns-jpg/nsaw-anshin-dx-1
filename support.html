<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>地域相談</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
}

.header{
background:linear-gradient(
135deg,
#0f172a,
#1e293b,
#334155
);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:#fff;
padding:24px;
border-radius:24px;
margin-bottom:16px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.btn{
display:block;
width:100%;
padding:24px;
margin-bottom:12px;
border-radius:22px;
background:#7c3aed;
color:#fff;
text-decoration:none;
text-align:center;
font-size:26px;
font-weight:900;
}

.info{
font-size:20px;
line-height:1.8;
font-weight:700;
}

.home{
display:block;
background:#475569;
color:#fff;
text-decoration:none;
padding:20px;
border-radius:20px;
text-align:center;
font-size:22px;
font-weight:900;
}

</style>

</head>

<body>

<div class="header">
<h1>🤝 地域相談</h1>
</div>

<div class="card">

<a
class="btn"
onclick="showSupport()">

🤝 包括支援センター

</a>

<div
id="result"
class="info">

ボタンを押してください

</div>

</div>

<a
href="index.html"
class="home">

🏠 トップへ戻る

</a>

<script>

function showSupport(){

const city =
localStorage.getItem(
'city'
) || '';

let name='';
let tel='';
let map='';

if(city==='志木市'){

name='志木市高齢者あんしん相談センター';
tel='0484858587';
map='https://www.google.com/maps/search/志木市高齢者あんしん相談センター';

}

else if(city==='新座市'){

name='新座市地域包括支援センター';
tel='0484805853';
map='https://www.google.com/maps/search/新座市地域包括支援センター';

}

else if(city==='朝霞市'){

name='朝霞市地域包括支援センター';
tel='0484631928';
map='https://www.google.com/maps/search/朝霞市地域包括支援センター';

}

else{

name='和光市地域包括支援センター';
tel='0484659933';
map='https://www.google.com/maps/search/和光市地域包括支援センター';

}

document.getElementById(
'result'
).innerHTML =

name +

'<br><br>' +

'☎ ' +

tel +

'<br><br>' +

'<a class="btn" href="tel:' +

tel +

'">電話する</a>' +

'<a class="btn" target="_blank" href="' +

map +

'">地図を見る</a>';

}

</script>

</body>
</html>
