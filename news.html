<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>地域情報｜見守りDX</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:560px;
margin:auto;
padding:16px;
}

.header{
background:#1976d2;
color:#fff;
border-radius:26px;
padding:22px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.back{
font-size:16px;
font-weight:900;
margin-bottom:12px;
cursor:pointer;
}

.title{
font-size:34px;
font-weight:900;
}

.sub{
font-size:16px;
margin-top:6px;
opacity:.95;
}

.card{
background:#fff;
border-radius:26px;
padding:20px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.category{
display:inline-block;
background:#1976d2;
color:#fff;
padding:8px 14px;
border-radius:999px;
font-size:14px;
font-weight:900;
margin-bottom:12px;
}

.newsTitle{
font-size:26px;
font-weight:900;
line-height:1.5;
margin-bottom:10px;
}

.newsText{
font-size:18px;
font-weight:700;
line-height:1.8;
color:#555;
}

.date{
margin-top:12px;
font-size:15px;
font-weight:700;
color:#888;
}

.footer{
display:flex;
justify-content:space-around;
margin-top:20px;
padding:18px 0;
background:#fff;
border-radius:22px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
font-size:14px;
font-weight:900;
color:#666;
}

.loading{
font-size:22px;
font-weight:900;
text-align:center;
padding:30px;
}

</style>
</head>

<body>

<div class="wrap">

<div class="header">

<div class="back" onclick="location.href='index.html'">
← トップへ戻る
</div>

<div class="title">
📰 地域情報
</div>

<div class="sub">
地域のお知らせを確認します
</div>

</div>

<div id="newsList">

<div class="card">

<div class="loading">
読み込み中...
</div>

</div>

</div>

<div class="footer">

<div onclick="location.href='index.html'">
見守り
</div>

<div onclick="location.href='schedule.html'">
予定
</div>

<div onclick="location.href='gomi.html'">
ゴミ
</div>

<div>
地域情報
</div>

</div>

</div>

<script>

const SHEET_ID="149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc";

const url=
"https://docs.google.com/spreadsheets/d/"+SHEET_ID+
"/gviz/tq?sheet=%E5%9C%B0%E5%9F%9F%E6%83%85%E5%A0%B1&tqx=out:json";

fetch(url)
.then(res=>res.text())
.then(text=>{

const json=JSON.parse(text.substr(47).slice(0,-2));

const rows=json.table.rows;

let html="";

rows.forEach(r=>{

const category=r.c[0]?.v || "";
const title=r.c[1]?.v || "";
const body=r.c[2]?.v || "";
const date=r.c[3]?.v || "";

if(!title)return;

html+=`

<div class="card">

<div class="category">
${category}
</div>

<div class="newsTitle">
${title}
</div>

<div class="newsText">
${body}
</div>

<div class="date">
${date}
</div>

</div>

`;

});

document.getElementById("newsList").innerHTML=html;

});

</script>

</body>
</html>
