<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NSAW 今日の安心DX</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#eef3f8;
font-family:
"Hiragino Sans",
"Yu Gothic",
sans-serif;
color:#222;
}

header{
background:
linear-gradient(135deg,#175d96,#3c82bf);
padding:22px 12px;
text-align:center;
color:white;
}

header h1{
margin:0;
font-size:32px;
line-height:1.4;
}

header p{
margin:8px 0 0;
font-size:16px;
opacity:.95;
}

.wrap{
max-width:860px;
margin:auto;
padding:12px;
}

.card{
background:white;
border-radius:24px;
overflow:hidden;
margin-bottom:24px;
box-shadow:
0 6px 18px rgba(0,0,0,.12);
}

.media{
display:flex;
overflow-x:auto;
gap:8px;
padding:8px;
background:#dfe8ef;
scroll-snap-type:x mandatory;
}

.media img{
width:100%;
max-width:100%;
aspect-ratio:16/9;
object-fit:cover;
border-radius:18px;
scroll-snap-align:start;
}

.media iframe{
width:100%;
aspect-ratio:16/9;
border:none;
border-radius:18px;
background:black;
scroll-snap-align:start;
}

.media video{
width:100%;
aspect-ratio:16/9;
border-radius:18px;
background:black;
scroll-snap-align:start;
}

.body{
padding:18px;
}

.date{
font-size:15px;
color:#666;
margin-bottom:10px;
}

.title{
font-size:28px;
font-weight:800;
line-height:1.5;
margin-bottom:14px;
}

.text{
font-size:19px;
line-height:1.9;
white-space:pre-wrap;
}

.btns{
display:grid;
gap:10px;
margin-top:18px;
}

.btn{
display:block;
text-decoration:none;
padding:16px;
border-radius:16px;
font-size:18px;
font-weight:700;
text-align:center;
}

.blue{
background:#1976d2;
color:white;
}

.green{
background:#16a34a;
color:white;
}

.loading{
padding:40px;
text-align:center;
font-size:24px;
}

.error{
padding:40px;
text-align:center;
font-size:22px;
color:red;
}

</style>
</head>

<body>

<header>
<h1>
NSAW 今日の安心DX
</h1>

<p>
志木・新座・朝霞・和光の地域情報
</p>
</header>

<div class="wrap">

<div id="loading" class="loading">
読み込み中...
</div>

<div id="news"></div>

</div>

<script>

const SHEET_ID =
'13qavSy8Thod2S_UWtHf0C7s-IDVcpYYEMvRNPHpabjY';

function getVal(c){
if(!c)return'';
return c.v || c.f || '';
}

function youtubeEmbed(url){

if(!url)return'';

if(url.includes('watch?v=')){
const id =
url.split('watch?v=')[1].split('&')[0];
return 'https://www.youtube.com/embed/'+id;
}

if(url.includes('youtu.be/')){
const id =
url.split('youtu.be/')[1].split('?')[0];
return 'https://www.youtube.com/embed/'+id;
}

if(url.includes('/shorts/')){
const id =
url.split('/shorts/')[1].split('?')[0];
return 'https://www.youtube.com/embed/'+id;
}

return '';
}

window.google = {
visualization:{
Query:{
setResponse:function(res){

document.getElementById('loading').style.display='none';

try{

const rows =
res.table.rows || [];

const area =
document.getElementById('news');

area.innerHTML='';

rows.reverse();

rows.slice(0,5).forEach(r=>{

const c = r.c || [];

const date =
getVal(c[0]);

const title =
getVal(c[1]);

const text =
getVal(c[2]);

let media='';

for(let i=3;i<c.length;i++){

const val =
getVal(c[i]);

if(!val)continue;

if(
val.includes('youtube.com')
||
val.includes('youtu.be')
){

const embed =
youtubeEmbed(val);

media += `
<iframe
src="${embed}"
allowfullscreen
loading="lazy">
</iframe>
`;

}

else if(
val.match(/\.(mp4|mov|webm)$/i)
){

media += `
<video controls playsinline>
<source src="${val}">
</video>
`;

}

else{

media += `
<img src="${val}">
`;

}

}

area.innerHTML += `

<div class="card">

${media ? `
<div class="media">
${media}
</div>
`:''}

<div class="body">

<div class="date">
${date}
</div>

<div class="title">
${title}
</div>

<div class="text">
${text}
</div>

<div class="btns">

<a class="btn blue"
href="map.html">
地域マップを見る
</a>

<a class="btn green"
href="family.html">
家族・安心ページ
</a>

</div>

</div>

</div>

`;

});

}catch(e){

document.getElementById('news').innerHTML =
'<div class="error">表示エラー</div>';

console.log(e);

}

}
}
}
};

const script =
document.createElement('script');

script.src =
'https://docs.google.com/spreadsheets/d/'
+SHEET_ID+
'/gviz/tq?tqx=out:json';

document.body.appendChild(script);

</script>

</body>
</html>
