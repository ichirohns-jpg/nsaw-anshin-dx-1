<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NSAW暮らし情報局</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#eef3f8;
  font-family:"Hiragino Sans","Yu Gothic",sans-serif;
  color:#222;
}

.top{
  background:linear-gradient(135deg,#1565c0,#0d47a1);
  color:white;
  padding:40px 24px 48px;
  border-bottom-left-radius:40px;
  border-bottom-right-radius:40px;
  text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,.18);
}

.title{
  font-size:50px;
  font-weight:900;
  line-height:1.3;
}

.sub{
  margin-top:14px;
  font-size:24px;
  line-height:1.8;
}

.wrap{
  padding:20px;
}

.city-box{
  background:white;
  border-radius:30px;
  padding:24px;
  margin-bottom:24px;
  box-shadow:0 8px 22px rgba(0,0,0,.10);
}

.city-label{
  font-size:24px;
  font-weight:900;
  color:#1565c0;
  margin-bottom:14px;
}

select{
  width:100%;
  padding:22px;
  border-radius:20px;
  border:3px solid #ccc;
  font-size:28px;
}

.card{
  background:white;
  border-radius:34px;
  padding:28px;
  margin-bottom:26px;
  box-shadow:0 8px 22px rgba(0,0,0,.10);
}

.date{
  font-size:22px;
  color:#666;
  margin-bottom:10px;
}

.city{
  display:inline-block;
  background:#1565c0;
  color:white;
  padding:10px 18px;
  border-radius:18px;
  font-size:22px;
  font-weight:900;
  margin-bottom:16px;
}

.headline{
  font-size:36px;
  font-weight:900;
  line-height:1.5;
  margin-bottom:18px;
}

.detail{
  font-size:25px;
  line-height:1.9;
  color:#444;
}

.media{
  width:100%;
  border-radius:24px;
  margin-top:22px;
}

iframe{
  width:100%;
  height:240px;
  border:none;
  border-radius:24px;
  margin-top:22px;
}

.button{
  width:100%;
  border:none;
  border-radius:26px;
  padding:28px;
  margin-top:22px;
  background:linear-gradient(135deg,#1e88e5,#1565c0);
  color:white;
  font-size:30px;
  font-weight:900;
}

.top-button{
  width:100%;
  border:none;
  border-radius:30px;
  padding:32px;
  margin-top:20px;
  background:linear-gradient(135deg,#78909c,#546e7a);
  color:white;
  font-size:34px;
  font-weight:900;
}

.archive{
  margin-top:40px;
}

.archive-title{
  font-size:30px;
  font-weight:900;
  margin-bottom:18px;
  color:#1565c0;
}

.loading{
  font-size:28px;
  font-weight:900;
  text-align:center;
  color:#666;
  padding:40px 0;
}
</style>
</head>

<body>

<div class="top">
  <div class="title">NSAW暮らし情報局</div>
  <div class="sub">
    志木・新座・朝霞・和光の<br>
    地域情報・動画・暮らし情報
  </div>
</div>

<div class="wrap">

  <div class="city-box">
    <div class="city-label">表示する地域</div>

    <select id="citySelect">
      <option>志木市</option>
      <option>朝霞市</option>
      <option>和光市</option>
      <option>新座市</option>
      <option>すべて</option>
    </select>
  </div>

  <div id="latestArea">
    <div class="loading">読み込み中...</div>
  </div>

  <div class="archive">
    <div class="archive-title">📚 アーカイブ</div>
    <div id="archiveArea"></div>
  </div>

  <button class="top-button" onclick="location.href='index.html'">
    ← 今日の安心へ戻る
  </button>

</div>

<script>

const SHEET_ID =
'13qavSy8Thod2S_UWtHf0C7s-IDVcpYYEMvRNPHpabjY';

const SHEET_NAME =
'data';

let allRows = [];

const citySelect =
document.getElementById('citySelect');

const savedCity =
localStorage.getItem('savedCity');

if(savedCity){
  citySelect.value = savedCity;
}

citySelect.addEventListener('change',function(){
  localStorage.setItem('savedCity',citySelect.value);
  renderRows();
});

function loadSheet(){

  window.google = {
    visualization:{
      Query:{
        setResponse:function(json){
          allRows = json.table.rows || [];
          renderRows();
        }
      }
    }
  };

  const script =
  document.createElement('script');

  script.src =
  'https://docs.google.com/spreadsheets/d/' +
  SHEET_ID +
  '/gviz/tq?sheet=' +
  encodeURIComponent(SHEET_NAME) +
  '&tqx=out:json';

  document.body.appendChild(script);

}

function getCell(row,index){
  return row.c[index]?.v || row.c[index]?.f || '';
}

function findUrlInRow(row,words){

  let found = '';

  row.c.forEach(cell=>{

    if(!cell)return;

    const text =
    JSON.stringify(cell);

    if(!text)return;

    words.forEach(w=>{

      if(text.includes(w) && !found){

        const match =
        text.match(/https?:\/\/[^"\\\s]+/);

        if(match){
          found = match[0];
        }

      }

    });

  });

  return found;

}

function youtubeEmbed(url){

  if(!url)return '';

  if(url.includes('watch?v=')){
    return url.replace('watch?v=','embed/');
  }

  if(url.includes('youtu.be/')){
    return url.replace('youtu.be/','www.youtube.com/embed/');
  }

  if(url.includes('/shorts/')){
    return url.replace('/shorts/','/embed/');
  }

  return url;

}

function createCard(row){

  const date =
  getCell(row,0);

  const city =
  getCell(row,1);

  const title =
  getCell(row,2);

  const detail =
  getCell(row,4);

  let image =
  getCell(row,17);

  let video =
  getCell(row,18);

  let link =
  getCell(row,19);

  if(!image){
    image = findUrlInRow(row,['drive.google','thumbnail','jpg','png','jpeg','webp']);
  }

  if(!video){
    video = findUrlInRow(row,['youtube.com','youtu.be','shorts']);
  }

  if(!link){
    link = findUrlInRow(row,['http']);
  }

  let mediaHtml = '';

  if(image && !image.includes('youtube') && !image.includes('youtu.be')){

    mediaHtml +=
    '<img class="media" src="' +
    image +
    '">';

  }

  if(video){

    if(
      video.includes('youtube') ||
      video.includes('youtu.be')
    ){

      mediaHtml +=
      '<iframe src="' +
      youtubeEmbed(video) +
      '" allowfullscreen></iframe>';

    }else{

      mediaHtml +=
      '<video class="media" controls playsinline src="' +
      video +
      '"></video>';

    }

  }

  let buttonHtml = '';

  if(link){

    buttonHtml =
    '<button class="button" onclick="window.open(`' +
    link +
    '`)">詳しく見る</button>';

  }

  return `
  <div class="card">
    <div class="date">${date}</div>
    <div class="city">${city}</div>
    <div class="headline">${title}</div>
    <div class="detail">${detail}</div>
    ${mediaHtml}
    ${buttonHtml}
  </div>
  `;

}

function renderRows(){

  const selectedCity =
  citySelect.value;

  const latest =
  document.getElementById('latestArea');

  const archive =
  document.getElementById('archiveArea');

  latest.innerHTML = '';
  archive.innerHTML = '';

  let rows =
  [...allRows];

  rows.reverse();

  if(selectedCity !== 'すべて'){

    rows =
    rows.filter(row=>{

      const city =
      getCell(row,1);

      return city === selectedCity;

    });

  }

  if(rows.length === 0){

    latest.innerHTML =
    '<div class="card"><div class="headline">表示できる情報がありません</div></div>';

    return;

  }

  rows.forEach((row,index)=>{

    const html =
    createCard(row);

    if(index < 5){

      latest.innerHTML += html;

    }else{

      archive.innerHTML += html;

    }

  });

}

loadSheet();

</script>

</body>
</html>
