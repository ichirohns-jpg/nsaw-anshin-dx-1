<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>スーパー情報｜見守りDX</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:700px;
margin:auto;
padding:16px;
}

.header{
background:linear-gradient(
135deg,
#16a34a,
#22c55e
);
color:#fff;
border-radius:28px;
padding:24px;
margin-bottom:18px;
box-shadow:0 10px 24px rgba(0,0,0,.10);
}

.back{
font-size:18px;
font-weight:900;
margin-bottom:12px;
cursor:pointer;
}

.title{
font-size:36px;
font-weight:900;
}

.sub{
font-size:17px;
margin-top:8px;
}

.card{
background:#fff;
border-radius:28px;
padding:22px;
margin-bottom:18px;
box-shadow:0 10px 24px rgba(0,0,0,.08);
}

.category{
display:inline-block;
background:#16a34a;
color:#fff;
padding:8px 14px;
border-radius:999px;
font-size:15px;
font-weight:900;
margin-bottom:12px;
}

.newsTitle{
font-size:30px;
font-weight:900;
line-height:1.5;
margin-bottom:12px;
}

.newsText{
font-size:20px;
font-weight:700;
line-height:1.8;
color:#475569;
}

.flyerBtn{
display:block;
width:100%;
margin-top:14px;
padding:18px;
border-radius:18px;
background:#2563eb;
color:#fff;
text-decoration:none;
text-align:center;
font-size:20px;
font-weight:900;
}

.shareBtn{
display:block;
width:100%;
margin-top:10px;
padding:18px;
border:none;
border-radius:18px;
background:#111827;
color:#fff;
font-size:20px;
font-weight:900;
}

.loading{
font-size:24px;
font-weight:900;
text-align:center;
padding:30px;
}

</style>

</head>

<body>

<div class="wrap">

<div class="header">

<div
class="back"
onclick="location.href='index.html'">

← トップへ戻る

</div>

<div class="title">
🛒 スーパー情報
</div>

<div class="sub">
近くのスーパー・特売情報を確認します
</div>

</div>

<div id="newsList">

<div class="card">

<div class="loading">
読み込み中...
</div>

</div>

</div>

</div>

<script>

const SHEET_ID =
"149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc";

const url =
"https://docs.google.com/spreadsheets/d/" +
SHEET_ID +
"/gviz/tq?sheet=%E3%82%B9%E3%83%BC%E3%83%91%E3%83%BC%E6%83%85%E5%A0%B1&tqx=out:json";

function shareLine(url){

window.open(
'https://social-plugins.line.me/lineit/share?url='+
encodeURIComponent(url)
);

}

function shareFacebook(url){

window.open(
'https://www.facebook.com/sharer/sharer.php?u='+
encodeURIComponent(url)
);

}

function shareX(url,text){

window.open(
'https://twitter.com/intent/tweet?url='+
encodeURIComponent(url)+
'&text='+
encodeURIComponent(text)
);

}

function copyUrl(url){

navigator.clipboard.writeText(url);

alert('URLをコピーしました');

}

fetch(url)

.then(res=>res.text())

.then(text=>{

const json =
JSON.parse(
text.substr(47).slice(0,-2)
);

const rows =
json.table.rows || [];

let html = "";

rows.reverse();

rows.forEach(r=>{

const city =
r.c[1]?.v || "";

const store =
r.c[2]?.v || "";

const item =
r.c[3]?.v || "";

const price =
r.c[4]?.v || "";

const body =
r.c[5]?.v || "";

const flyer =
r.c[6]?.v || "";

if(!store)return;

const shareText =
store + " " +
item + " " +
price;

html += `

<div class="card">

<div class="category">
📍 ${city}
</div>

<div class="newsTitle">
${store}
</div>

<div class="newsText">

🛒 ${item}<br><br>

💴 ${price}<br><br>

${body}

</div>

${
flyer
?
`<a
href="${flyer}"
target="_blank"
class="flyerBtn">

📄 チラシを見る

</a>`
:
''
}

<button
class="shareBtn"
onclick="shareLine(location.href)">

💬 LINEで送る

</button>

<button
class="shareBtn"
onclick="shareFacebook(location.href)">

📘 Facebookへ投稿

</button>

<button
class="shareBtn"
onclick="shareX(location.href,'${shareText}')">

✖ Xへ投稿

</button>

<button
class="shareBtn"
onclick="copyUrl(location.href)">

📋 URLをコピー

</button>

</div>

`;

});

document.getElementById(
"newsList"
).innerHTML =
html ||
'<div class="card"><div class="loading">情報がありません</div></div>';

})

.catch(()=>{

document.getElementById(
"newsList"
).innerHTML =
'<div class="card"><div class="loading">読込失敗</div></div>';

});

</script>

</body>
</html>
