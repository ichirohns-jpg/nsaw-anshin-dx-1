<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>まちのニュース・天気</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#fdfbf7;color:#333;font-family:"Hiragino Sans","Yu Gothic",sans-serif}
.app-box{max-width:520px;margin:1.5rem auto;padding:0 1rem}
.badge{display:inline-block;background:#777;color:#fff;border-radius:999px;padding:8px 14px;font-size:15px}
.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 6px 14px rgba(0,0,0,.06)}
.title{font-size:28px;font-weight:900;text-align:center;margin:0 0 22px}
.weather{background:#f7f9fa;border-radius:12px;padding:16px;margin-bottom:14px;font-size:22px;font-weight:900;text-align:center;color:#4ebfa5}
.news{background:#f7f9fa;border-left:6px solid #4ebfa5;border-radius:12px;padding:16px;margin-bottom:14px;font-size:18px;line-height:1.7}
.back{display:block;margin-top:20px;text-align:center;font-weight:900;text-decoration:none;color:#666}
.city{font-size:20px;font-weight:900;color:#4ebfa5}
</style>
</head>

<body>

<div class="app-box">

<div style="text-align:center;margin-bottom:14px">
<span class="badge">利用者ページ</span>
</div>

<div class="card">

<h1 class="title">
まちのニュース・天気
</h1>

<div class="weather">
📰 4市最新情報
</div>

<div id="newsArea">

<div class="news">
情報を読み込み中...
</div>

</div>

<a href="index.html" class="back">
トップへ戻る
</a>

</div>

</div>

<script>

const GAS_URL='https://script.google.com/macros/s/AKfycbwC3CPMJlMl5o37qcxIcedcikLuxe6y_ANRjAeFnO9KtPEk9rw-LTu72Dyoq2XJKPET/dev';

async function loadNews(){

try{

const res=await fetch(GAS_URL+'?mode=news');
const data=await res.json();

let html='';

data.forEach(item=>{

html+=`
<div class="news">
<div class="city">${item.city||''}</div>
${item.title||''}
</div>
`;

});

document.getElementById('newsArea').innerHTML=
html||'<div class="news">情報がありません</div>';

}catch(e){

document.getElementById('newsArea').innerHTML=
'<div class="news">情報取得失敗</div>';

}

}

loadNews();

</script>

</body>
</html>
