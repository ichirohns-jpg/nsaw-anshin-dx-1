<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NSAW 今日の安心DX</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#eef3f8;
  font-family:
  "Hiragino Sans",
  "Yu Gothic",
  sans-serif;
  color:#222;
}

header{
  background:#2d5f9a;
  color:white;
  padding:18px;
  text-align:center;
  font-size:26px;
  font-weight:700;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:14px;
}

.card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  margin-bottom:20px;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.thumb{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  background:#ddd;
}

.content{
  padding:16px;
}

.date{
  font-size:14px;
  color:#666;
  margin-bottom:8px;
}

.title{
  font-size:24px;
  font-weight:700;
  line-height:1.5;
  margin-bottom:10px;
}

.text{
  font-size:18px;
  line-height:1.8;
  white-space:pre-wrap;
}

.loading{
  text-align:center;
  padding:40px;
  font-size:22px;
}

.error{
  color:red;
  text-align:center;
  padding:30px;
  font-size:20px;
}
</style>
</head>

<body>

<header>
NSAW 今日の安心DX
</header>

<div class="wrap">

<div id="loading" class="loading">
読み込み中...
</div>

<div id="news"></div>

</div>

<script>
const SHEET_ID = '13qavSy8Thod2S_UWtHf0C7s-IDVcpYYEMvRNPHpabjY';

window.google = {
  visualization:{
    Query:{
      setResponse:function(res){

        document.getElementById('loading').style.display='none';

        try{

          const rows = res.table.rows || [];
          const area = document.getElementById('news');

          area.innerHTML='';

          rows.reverse();

          rows.slice(0,5).forEach(r=>{

            const c = r.c || [];

            const date =
              c[0]?.v || '';

            const title =
              c[1]?.v || '';

            const text =
              c[2]?.v || '';

            const image =
              c[3]?.v || '';

            area.innerHTML += `
              <div class="card">

                ${
                  image
                  ? `<img class="thumb" src="${image}">`
                  : ''
                }

                <div class="content">

                  <div class="date">
                    ${date}
                  </div>

                  <div class="title">
                    ${title}
                  </div>

                  <div class="text">
                    ${text}
                  </div>

                </div>

              </div>
            `;

          });

        }catch(e){

          document.getElementById('news').innerHTML =
          '<div class="error">表示エラー</div>';

          console.log(e);

        }

      }
    }
  }
};

const script = document.createElement('script');

script.src =
'https://docs.google.com/spreadsheets/d/'
+ SHEET_ID +
'/gviz/tq?tqx=out:json';

document.body.appendChild(script);
</script>

</body>
</html>
