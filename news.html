<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>まちのニュース</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#333;
}

.app-box{
max-width:600px;
margin:0 auto;
padding:18px 14px 34px;
}

.card{
background:#fff;
border-radius:26px;
padding:24px;
box-shadow:0 8px 22px rgba(0,0,0,.10);
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
color:#2eaf66;
margin:0 0 10px;
}

.lead{
font-size:18px;
font-weight:800;
text-align:center;
color:#666;
margin-bottom:20px;
}

.news{
background:#f7f9fb;
border-left:8px solid #2eaf66;
border-radius:14px;
padding:18px;
margin-bottom:16px;
}

.city{
font-size:18px;
font-weight:900;
color:#2eaf66;
margin-bottom:8px;
}

.headline{
font-size:22px;
font-weight:900;
line-height:1.6;
}

.detail{
font-size:18px;
line-height:1.7;
margin-top:8px;
}

.link{
display:block;
margin-top:12px;
font-size:18px;
font-weight:900;
text-decoration:none;
color:#1976d2;
}

.back{
display:block;
margin-top:20px;
text-align:center;
font-size:20px;
font-weight:900;
text-decoration:none;
color:#666;
}
</style>
</head>

<body>

<div class="app-box">

<div class="card">

<h1 class="title">まちのニュース</h1>

<div class="lead">
志木・新座・朝霞・和光の地域情報
</div>

<div id="newsArea">
<div class="news">
読み込み中...
</div>
</div>

<a href="index.html" class="back">
トップへ戻る
</a>

</div>

</div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbwC3CPMJlMl5o37qcxIcedcikLuxe6y_ANRjAeFnO9KtPEk9rw-LTu72Dyoq2XJKPET/exec';

async function loadNews(){

try{

const res =
await fetch(
GAS_URL + '?mode=news'
);

const data =
await res.json();

let html='';

data.forEach(item=>{

html += `
<div class="news">

<div class="city">
${item.city || ''}
</div>

<div class="headline">
${item.title || ''}
</div>

<div class="detail">
${item.detail || ''}
</div>

<a
class="link"
href="${item.url || '#'}"
target="_blank">
詳しく見る
</a>

</div>
`;

});

document.getElementById("newsArea").innerHTML =
html || '<div class="news">記事がありません</div>';

}
catch(e){

document.getElementById("newsArea").innerHTML =
'<div class="news">取得失敗</div>';

}

}

loadNews();

</script>

</body>
</html>
