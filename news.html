<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NSAW 今日の安心DX</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#eef3f8;
font-family:
"Hiragino Sans",
"Yu Gothic",
sans-serif;
color:#222;
}

.top{
background:
linear-gradient(135deg,#17639b,#4b91c7);
padding:24px 16px;
color:white;
text-align:center;
}

.top h1{
margin:0;
font-size:34px;
line-height:1.4;
}

.top p{
margin:10px 0 0;
font-size:17px;
opacity:.95;
}

.wrap{
max-width:900px;
margin:auto;
padding:12px;
}

.card{
background:white;
border-radius:22px;
overflow:hidden;
margin-bottom:22px;
box-shadow:
0 4px 14px rgba(0,0,0,.12);
}

.media{
display:flex;
overflow-x:auto;
gap:8px;
padding:8px;
background:#dde7ef;
}

.media img{
height:240px;
border-radius:16px;
object-fit:cover;
}

.media iframe{
width:420px;
height:236px;
border:none;
border-radius:16px;
background:black;
}

.body{
padding:18px;
}

.date{
font-size:15px;
color:#666;
margin-bottom:10px;
}

.title{
font-size:28px;
font-weight:800;
line-height:1.5;
margin-bottom:14px;
}

.text{
font-size:19px;
line-height:1.9;
white-space:pre-wrap;
}

.buttons{
display:grid;
gap:10px;
margin-top:18px;
}

.btn{
display:block;
text-decoration:none;
padding:16px;
border-radius:16px;
text-align:center;
font-size:18px;
font-weight:700;
color:white;
}

.blue{
background:#1976d2;
}

.green{
background:#16a34a;
}

.loading{
padding:40px;
text-align:center;
font-size:24px;
}

</style>
</head>

<body>

<div class="top">

<h1>
NSAW 今日の安心DX
</h1>

<p>
志木・新座・朝霞・和光 四市情報
</p>

</div>

<div class="wrap">

<div id="loading" class="loading">
読み込み中...
</div>

<div id="news"></div>

</div>

<script>

const SHEET_ID =
'13qavSy8Thod2S_UWtHf0C7s-IDVcpYYEMvRNPHpabjY';

function getVal(c){
if(!c)return'';
return c.v || c.f || '';
}

function youtube(url){

if(url.includes('watch?v=')){
return 'https://www.youtube.com/embed/' +
url.split('watch?v=')[1].split('&')[0];
}

if(url.includes('youtu.be/')){
return 'https://www.youtube.com/embed/' +
url.split('youtu.be/')[1].split('?')[0];
}

if(url.includes('/shorts/')){
return 'https://www.youtube.com/embed/' +
url.split('/shorts/')[1].split('?')[0];
}

return '';
}

window.google = {
visualization:{
Query:{
setResponse:function(res){

document.getElementById('loading').style.display='none';

const rows =
res.table.rows || [];

const area =
document.getElementById('news');

area.innerHTML='';

rows.reverse();

rows.slice(0,5).forEach(r=>{

const c = r.c || [];

const date =
getVal(c[0]);

const title =
getVal(c[1]);

const text =
getVal(c[2]);

let media='';

for(let i=3;i<c.length;i++){

const val =
getVal(c[i]);

if(!val)continue;

if(
val.includes('youtube.com')
||
val.includes('youtu.be')
){

media += `
<iframe
src="${youtube(val)}"
allowfullscreen>
</iframe>
`;

}else{

media += `
<img src="${val}">
`;

}

}

area.innerHTML += `

<div class="card">

${media ? `
<div class="media">
${media}
</div>
`:''}

<div class="body">

<div class="date">
${date}
</div>

<div class="title">
${title}
</div>

<div class="text">
${text}
</div>

<div class="buttons">

<a class="btn blue"
href="map.html">
地域マップを見る
</a>

<a class="btn green"
href="family.html">
家族・安心ページ
</a>

</div>

</div>

</div>

`;

});

}
}
}
};

const script =
document.createElement('script');

script.src =
'https://docs.google.com/spreadsheets/d/'
+SHEET_ID+
'/gviz/tq?tqx=out:json';

document.body.appendChild(script);

</script>

</body>
</html>
