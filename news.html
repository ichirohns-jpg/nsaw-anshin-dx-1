<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NSAW 今日の安心DX</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#eef3f8;
font-family:
"Hiragino Sans",
"Yu Gothic",
sans-serif;
color:#222;
}

.top{
background:
linear-gradient(135deg,#175d96,#3c82bf);
padding:24px 16px;
color:white;
text-align:center;
}

.top h1{
margin:0;
font-size:34px;
line-height:1.4;
}

.top p{
margin:10px 0 0;
font-size:17px;
opacity:.95;
}

.wrap{
max-width:920px;
margin:auto;
padding:12px;
}

.section-title{
font-size:30px;
font-weight:800;
margin:
20px 0 18px;
}

.archive-buttons{
display:flex;
gap:10px;
overflow-x:auto;
margin-bottom:18px;
}

.archive-buttons button{
border:none;
background:#1976d2;
color:white;
padding:12px 18px;
border-radius:14px;
font-size:18px;
font-weight:700;
white-space:nowrap;
}

.card{
background:white;
border-radius:24px;
overflow:hidden;
margin-bottom:24px;
box-shadow:
0 4px 14px rgba(0,0,0,.12);
}

.mainimg{
width:100%;
display:block;
background:#ddd;
}

.body{
padding:18px;
}

.date{
font-size:15px;
color:#666;
margin-bottom:10px;
}

.title{
font-size:28px;
font-weight:800;
line-height:1.5;
margin-bottom:14px;
}

.text{
font-size:19px;
line-height:1.9;
white-space:pre-wrap;
}

.citybox{
margin-top:18px;
padding:14px;
background:#f5f9fc;
border-radius:18px;
}

.city{
margin-top:10px;
}

.city a{
display:block;
background:#1976d2;
color:white;
text-decoration:none;
font-weight:700;
font-size:18px;
padding:14px;
border-radius:14px;
}

.videoTitle{
font-size:24px;
font-weight:800;
margin-top:20px;
margin-bottom:12px;
}

.videoText{
font-size:18px;
line-height:1.8;
margin-bottom:14px;
white-space:pre-wrap;
}

.video iframe{
width:100%;
aspect-ratio:16/9;
border:none;
border-radius:18px;
background:black;
}

.loading{
padding:40px;
text-align:center;
font-size:24px;
}

.error{
padding:40px;
text-align:center;
font-size:22px;
color:red;
}

.hidden{
display:none;
}

</style>
</head>

<body>

<div class="top">

<h1>
NSAW 今日の安心DX
</h1>

<p>
志木・新座・朝霞・和光 四市情報
</p>

</div>

<div class="wrap">

<h2 class="section-title">
最新情報
</h2>

<div id="loading" class="loading">
読み込み中...
</div>

<div id="news"></div>

<h2 class="section-title">
月別アーカイブ
</h2>

<div class="archive-buttons" id="monthButtons"></div>

<div id="archive"></div>

</div>

<script>

const SHEET_ID =
'13qavSy8Thod2S_UWtHf0C7s-IDVcpYYEMvRNPHpabjY';

function val(c){

if(!c)return '';

return String(
c.v ?? c.f ?? ''
);

}

function url(c){

if(!c)return '';

const raw =
JSON.stringify(c);

const m =
raw.match(/https?:\/\/[^"\\\s<>]+/);

return m ? m[0] : val(c);

}

function yt(u){

if(!u)return '';

if(u.includes('watch?v=')){
return 'https://www.youtube.com/embed/' +
u.split('watch?v=')[1].split('&')[0];
}

if(u.includes('youtu.be/')){
return 'https://www.youtube.com/embed/' +
u.split('youtu.be/')[1].split('?')[0];
}

if(u.includes('/shorts/')){
return 'https://www.youtube.com/embed/' +
u.split('/shorts/')[1].split('?')[0];
}

return '';

}

function monthLabel(dateStr){

const d = new Date(dateStr);

if(isNaN(d)) return 'その他';

return d.getFullYear() +
'年' +
(d.getMonth()+1) +
'月';

}

function cityBtn(name,title,link){

if(!title || !link)return '';

return `
<div class="city">
<a href="${link}"
target="_blank"
rel="noopener">
${name}：${title}
</a>
</div>
`;

}

function renderCard(r,target){

const c = r.c || [];

const date =
val(c[0]);

const title =
val(c[2]);

const image =
url(c[3]);

const text =
val(c[4]);

const shikiTitle =
val(c[5]);

const shikiUrl =
url(c[6]);

const niizaTitle =
val(c[7]);

const niizaUrl =
url(c[8]);

const asakaTitle =
val(c[9]);

const asakaUrl =
url(c[10]);

const wakoTitle =
val(c[11]);

const wakoUrl =
url(c[12]);

const videoTitle =
val(c[15]);

const videoText =
val(c[16]);

const videoUrl =
url(c[17]);

const embed =
yt(videoUrl);

document.getElementById(target)
.innerHTML += `

<div class="card archive-card"
data-month="${monthLabel(date)}">

${image ? `
<img class="mainimg"
src="${image}">
` : ''}

<div class="body">

<div class="date">
${date}
</div>

<div class="title">
${title}
</div>

<div class="text">
${text}
</div>

<div class="citybox">

${cityBtn(
'志木市',
shikiTitle,
shikiUrl
)}

${cityBtn(
'新座市',
niizaTitle,
niizaUrl
)}

${cityBtn(
'朝霞市',
asakaTitle,
asakaUrl
)}

${cityBtn(
'和光市',
wakoTitle,
wakoUrl
)}

</div>

${videoTitle ? `
<div class="videoTitle">
🎬 ${videoTitle}
</div>
` : ''}

${videoText ? `
<div class="videoText">
${videoText}
</div>
` : ''}

${embed ? `
<div class="video">
<iframe
src="${embed}"
allowfullscreen>
</iframe>
</div>
` : ''}

</div>

</div>

`;

}

window.google = {
visualization:{
Query:{
setResponse:function(res){

document.getElementById('loading')
.style.display='none';

try{

const rows =
res.table.rows || [];

const rev =
rows.reverse();

rev.slice(0,5)
.forEach(r=>{

renderCard(
r,
'news'
);

});

rev.slice(5)
.forEach(r=>{

renderCard(
r,
'archive'
);

});

const cards =
document.querySelectorAll('.archive-card');

const months =
[...new Set(
[...cards].map(
c=>c.dataset.month
)
)];

const btns =
document.getElementById('monthButtons');

months.forEach(m=>{

btns.innerHTML += `
<button onclick="filterMonth('${m}')">
${m}
</button>
`;

});

window.filterMonth =
function(month){

cards.forEach(c=>{

if(c.dataset.month===month){

c.classList.remove('hidden');

}else{

c.classList.add('hidden');

}

});

};

}catch(e){

document.getElementById('news')
.innerHTML =
'<div class="error">表示エラー</div>';

console.log(e);

}

}
}
}
};

const s =
document.createElement('script');

s.src =
'https://docs.google.com/spreadsheets/d/'
+SHEET_ID+
'/gviz/tq?tqx=out:json';

document.body.appendChild(s);

</script>

</body>
</html>
