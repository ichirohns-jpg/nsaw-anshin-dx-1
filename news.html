<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NSAW暮らし情報局</title>

<style>

body{
  margin:0;
  background:#eef3f8;
  font-family:sans-serif;
  color:#222;
}

.top{
  background:linear-gradient(135deg,#1565c0,#0d47a1);
  color:white;
  padding:34px 20px 40px;
  border-bottom-left-radius:34px;
  border-bottom-right-radius:34px;
  text-align:center;
}

.title{
  font-size:44px;
  font-weight:900;
}

.sub{
  font-size:24px;
  margin-top:12px;
  line-height:1.7;
}

.wrap{
  padding:18px;
}

.card{
  background:white;
  border-radius:30px;
  padding:28px;
  margin-bottom:24px;
  box-shadow:0 6px 18px rgba(0,0,0,.12);
}

.city{
  font-size:24px;
  font-weight:900;
  color:#1565c0;
  margin-bottom:12px;
}

.headline{
  font-size:34px;
  font-weight:900;
  line-height:1.5;
  margin-bottom:16px;
}

.detail{
  font-size:24px;
  line-height:1.8;
  color:#444;
}

.button{
  width:100%;
  border:none;
  border-radius:24px;
  padding:28px;
  margin-top:20px;
  background:#1565c0;
  color:white;
  font-size:30px;
  font-weight:900;
}

.red{
  background:#d32f2f;
}

.green{
  background:#43a047;
}

.gray{
  background:#546e7a;
}

</style>
</head>

<body>

<div class="top">

  <div class="title">
    NSAW暮らし情報局
  </div>

  <div class="sub">
    志木・新座・朝霞・和光の<br>
    地域情報をお届けします
  </div>

</div>

<div class="wrap">

  <div class="card">

    <div class="city">
      志木市
    </div>

    <div class="headline">
      4市情報テスト
    </div>

    <div class="detail">
      今後ここへスプレッドシート連動で、
      地域情報・動画・イベント情報を表示します。
    </div>

    <button
    class="button">

    詳しく見る

    </button>

  </div>

  <button
  class="button red"
  onclick="location.href='map.html'">

  🗺️ 行き先案内

  </button>

  <button
  class="button green"
  onclick="location.href='family.html'">

  👨‍👩‍👧 家族確認

  </button>

  <button
  class="button gray"
  onclick="location.href='index.html'">

  ← 今日の安心へ戻る

  </button>

</div>

</body>
</html>
