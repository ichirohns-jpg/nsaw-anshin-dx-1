<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>本人登録</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
}

.header{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:#fff;
padding:20px;
border-radius:24px;
margin-bottom:16px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.label{
font-size:22px;
font-weight:900;
margin-bottom:8px;
}

.input{
width:100%;
padding:16px;
border:2px solid #cbd5e1;
border-radius:16px;
font-size:20px;
margin-bottom:16px;
}

.saveBtn{
width:100%;
border:none;
background:#16a34a;
color:#fff;
padding:22px;
border-radius:22px;
font-size:24px;
font-weight:900;
}

.home{
display:block;
text-decoration:none;
background:#475569;
color:#fff;
padding:20px;
border-radius:20px;
text-align:center;
font-size:22px;
font-weight:900;
margin-top:16px;
}

</style>

</head>

<body>

<div class="header">
<h1>⚙️ 本人登録</h1>
</div>

<div class="card">

<div class="label">
お名前
</div>

<input
id="userName"
class="input">

<div class="label">
市
</div>

<select
id="city"
class="input">

<option>志木市</option>
<option>新座市</option>
<option>朝霞市</option>
<option>和光市</option>

</select>

<div class="label">
地区
</div>

<input
id="areaCode"
class="input"
placeholder="本町・柏町・館・幸町など">

<div class="label">
家族電話
</div>

<input
id="familyTel"
class="input">

<div class="label">
家族LINE
</div>

<input
id="familyLine"
class="input">

<button
class="saveBtn"
onclick="saveData()">

💾 保存

</button>

</div>

<a
href="index.html"
class="home">

🏠 トップへ戻る

</a>

<script>

function saveData(){

const userName =
document.getElementById(
'userName'
).value;

const city =
document.getElementById(
'city'
).value;

const areaCode =
document.getElementById(
'areaCode'
).value;

const familyTel =
document.getElementById(
'familyTel'
).value;

const familyLine =
document.getElementById(
'familyLine'
).value;

localStorage.setItem(
'userName',
userName
);

localStorage.setItem(
'city',
city
);

localStorage.setItem(
'areaCode',
areaCode
);

localStorage.setItem(
'familyTel',
familyTel
);

localStorage.setItem(
'familyLine',
familyLine
);

localStorage.setItem(
'userAddress',
city + areaCode
);

alert(
'登録しました'
);

location.href =
'index.html';

}

window.onload =
function(){

document.getElementById(
'userName'
).value =
localStorage.getItem(
'userName'
) || '';

document.getElementById(
'city'
).value =
localStorage.getItem(
'city'
) || '志木市';

document.getElementById(
'areaCode'
).value =
localStorage.getItem(
'areaCode'
) || '';

document.getElementById(
'familyTel'
).value =
localStorage.getItem(
'familyTel'
) || '';

document.getElementById(
'familyLine'
).value =
localStorage.getItem(
'familyLine'
) || '';

};

</script>

</body>
</html>
