<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>服薬確認</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:15px;
color:#1f2d3d;
}

.wrap{
max-width:800px;
margin:auto;
}

.header{
background:linear-gradient(135deg,#4caf50,#2e7d32);
color:#fff;
padding:24px;
border-radius:24px;
text-align:center;
font-size:34px;
font-weight:900;
margin-bottom:16px;
}

.card{
background:#fff;
border-radius:24px;
padding:20px;
margin-bottom:16px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.med{
font-size:28px;
font-weight:900;
margin-bottom:15px;
text-align:center;
}

.time{
font-size:20px;
margin-bottom:15px;
text-align:center;
}

.btn{
width:100%;
border:none;
border-radius:18px;
padding:22px;
font-size:28px;
font-weight:900;
cursor:pointer;
margin-bottom:12px;
}

.ok{
background:#4caf50;
color:#fff;
}

.ng{
background:#f44336;
color:#fff;
}

.back{
background:#666;
color:#fff;
}

#result{
font-size:24px;
font-weight:900;
text-align:center;
padding:20px;
}

</style>

</head>

<body>

<div class="wrap">

<div class="header">
💊 服薬確認
</div>

<div class="card">

<div class="med">
本日の薬
</div>

<div class="time" id="todayDate">
読込中...
</div>

<button
class="btn ok"
onclick="takeMedicine()">
💊 飲みました
</button>

<button
class="btn ng"
onclick="notTakeMedicine()">
⚠️ まだです
</button>

<div id="result">
未確認
</div>

<button
class="btn back"
onclick="history.back()">
戻る
</button>

</div>

</div>

<script>

const today =
new Date();

document.getElementById(
"todayDate"
).innerHTML =
today.toLocaleDateString(
"ja-JP"
);

function takeMedicine(){

const now =
new Date();

localStorage.setItem(
"medicineStatus",
"服薬済"
);

localStorage.setItem(
"medicineTime",
now.toLocaleString("ja-JP")
);

document.getElementById(
"result"
).innerHTML =
"✅ 服薬済";

}

function notTakeMedicine(){

localStorage.setItem(
"medicineStatus",
"未服薬"
);

document.getElementById(
"result"
).innerHTML =
"⚠️ 未服薬";

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>予定管理</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:15px;
color:#1f2d3d;
}

.wrap{
max-width:800px;
margin:auto;
}

.header{
background:linear-gradient(135deg,#ff9800,#ff6f00);
color:#fff;
padding:24px;
border-radius:24px;
text-align:center;
font-size:34px;
font-weight:900;
margin-bottom:16px;
}

.card{
background:#fff;
border-radius:24px;
padding:20px;
margin-bottom:16px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
}

label{
display:block;
font-size:20px;
font-weight:900;
margin-bottom:8px;
margin-top:10px;
}

input,textarea{
width:100%;
padding:15px;
border:2px solid #ddd;
border-radius:15px;
font-size:18px;
}

textarea{
height:120px;
resize:none;
}

.btn{
width:100%;
border:none;
border-radius:18px;
padding:20px;
font-size:24px;
font-weight:900;
cursor:pointer;
margin-top:12px;
}

.save{
background:#ff9800;
color:#fff;
}

.back{
background:#666;
color:#fff;
}

.item{
background:#f7f9fc;
padding:15px;
border-radius:15px;
margin-top:10px;
}

.date{
font-size:18px;
font-weight:900;
margin-bottom:5px;
}

.memo{
font-size:18px;
}

</style>

</head>

<body>

<div class="wrap">

<div class="header">
📅 予定管理
</div>

<div class="card">

<label>
日付
</label>

<input
type="date"
id="date">

<label>
予定内容
</label>

<textarea
id="memo"
placeholder="予定を入力">
</textarea>

<button
class="btn save"
onclick="saveSchedule()">
💾 保存
</button>

<button
class="btn back"
onclick="history.back()">
戻る
</button>

</div>

<div
class="card"
id="list">
</div>

</div>

<script>

loadSchedule();

function saveSchedule(){

const date =
document.getElementById(
"date"
).value;

const memo =
document.getElementById(
"memo"
).value;

if(!date || !memo){
return;
}

let data =
JSON.parse(
localStorage.getItem(
"scheduleList"
) || "[]"
);

data.push({
date:date,
memo:memo
});

localStorage.setItem(
"scheduleList",
JSON.stringify(data)
);

document.getElementById(
"memo"
).value = "";

loadSchedule();

}

function loadSchedule(){

let data =
JSON.parse(
localStorage.getItem(
"scheduleList"
) || "[]"
);

data.sort((a,b)=>
a.date.localeCompare(b.date)
);

let html = "";

data.forEach(item=>{

html +=

'<div class="item">' +

'<div class="date">' +
item.date +
'</div>' +

'<div class="memo">' +
item.memo +
'</div>' +

'</div>';

});

document.getElementById(
"list"
).innerHTML =
html;

}

</script>

</body>
</html>
