<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>利用者登録</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:15px;
color:#1f2d3d;
}

.wrap{
max-width:700px;
margin:auto;
}

.header{
background:linear-gradient(135deg,#1976d2,#42a5f5);
color:#fff;
padding:25px;
border-radius:24px;
text-align:center;
font-size:32px;
font-weight:900;
margin-bottom:16px;
}

.card{
background:#fff;
border-radius:24px;
padding:20px;
margin-bottom:16px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
}

label{
display:block;
font-size:20px;
font-weight:900;
margin-bottom:8px;
}

input{
width:100%;
padding:18px;
font-size:20px;
border:1px solid #ccc;
border-radius:14px;
margin-bottom:15px;
}

button{
width:100%;
border:none;
border-radius:18px;
padding:22px;
font-size:26px;
font-weight:900;
cursor:pointer;
}

.save{
background:#00c853;
color:#fff;
}

.result{
margin-top:20px;
padding:20px;
background:#f7f9fc;
border-radius:18px;
text-align:center;
}

#qrcode{
margin-top:15px;
display:flex;
justify-content:center;
}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>

<body>

<div class="wrap">

<div class="header">
👤 利用者登録
</div>

<div class="card">

<label>
お名前
</label>

<input
type="text"
id="userName"
placeholder="山田太郎">

<label>
住所（町名・丁目まで）
</label>

<input
type="text"
id="userAddress"
placeholder="志木市本町2丁目">

<label>
支援者暗証番号
</label>

<input
type="password"
id="pin"
placeholder="好きな暗証番号">

<label>
支援者暗証番号確認
</label>

<input
type="password"
id="pin2"
placeholder="もう一度入力">

<button
class="save"
onclick="createUser()">
登録してQR発行
</button>

<div
id="result"
class="result"
style="display:none;">

<div style="
font-size:24px;
font-weight:900;
margin-bottom:15px;
">
登録完了
</div>

<div id="qrcode"></div>

</div>

</div>

</div>

<script>

function createUser(){

const name =
document.getElementById(
"userName"
).value.trim();

const address =
document.getElementById(
"userAddress"
).value.trim();

const pin =
document.getElementById(
"pin"
).value.trim();

const pin2 =
document.getElementById(
"pin2"
).value.trim();

if(
!name ||
!address ||
!pin ||
!pin2
){

alert(
"全て入力してください"
);

return;

}

if(
pin !== pin2
){

alert(
"暗証番号が一致しません"
);

return;

}

localStorage.setItem(
"userName",
name
);

localStorage.setItem(
"userAddress",
address
);

localStorage.setItem(
"supportPin",
pin
);

document.getElementById(
"result"
).style.display =
"block";

const qrArea =
document.getElementById(
"qrcode"
);

qrArea.innerHTML = "";

const url =

"https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/family.html" +

"?name=" +

encodeURIComponent(
name
);

new QRCode(
qrArea,
{
text:url,
width:240,
height:240
}
);

}

</script>

</body>
</html>
