<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>本人登録</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:36px;
font-weight:900;
}

.card{
background:#fff;
border-radius:30px;
padding:24px;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.label{
font-size:22px;
font-weight:900;
margin-bottom:8px;
}

.input{
width:100%;
padding:18px;
font-size:22px;
border:2px solid #cbd5e1;
border-radius:18px;
margin-bottom:16px;
}

.btn{
width:100%;
padding:24px;
border:none;
border-radius:24px;
font-size:28px;
font-weight:900;
background:#16a34a;
color:#fff;
}

</style>

</head>

<body>

<div class="header">
<h1>👤 本人登録</h1>
</div>

<div class="card">

<div class="label">
お名前
</div>

<input
id="name"
class="input"
placeholder="山田太郎">

<div class="label">
住所
</div>

<input
id="address"
class="input"
placeholder="志木市○○">

<div class="label">
電話番号
</div>

<input
id="phone"
class="input"
placeholder="09000000000">

<div class="label">
緊急連絡先
</div>

<input
id="family"
class="input"
placeholder="09000000000">

<button
class="btn"
onclick="saveUser()">
登録する
</button>

</div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec';

function saveUser(){

const data = {

type:'register',

name:
document.getElementById('name').value,

address:
document.getElementById('address').value,

phone:
document.getElementById('phone').value,

family:
document.getElementById('family').value

};

fetch(
GAS_URL,
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify(data)
}
)
.then(r=>r.text())
.then(data=>{

alert('登録しました');

location.href='qr.html';

})
.catch(err=>{

alert('登録失敗');

});

}

</script>

</body>
</html>
