<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>本人登録</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
}

.header{
background:linear-gradient(
135deg,
#0f172a,
#1e293b,
#334155
);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:#fff;
padding:20px;
border-radius:24px;
margin-bottom:16px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.label{
font-size:22px;
font-weight:900;
margin-bottom:8px;
}

.input{
width:100%;
padding:16px;
border:2px solid #cbd5e1;
border-radius:16px;
font-size:20px;
margin-bottom:16px;
}

.saveBtn{
width:100%;
border:none;
background:#16a34a;
color:#fff;
padding:22px;
border-radius:22px;
font-size:24px;
font-weight:900;
}

.home{
display:block;
text-decoration:none;
background:#475569;
color:#fff;
padding:20px;
border-radius:20px;
text-align:center;
font-size:22px;
font-weight:900;
margin-top:16px;
}

</style>

</head>

<body>

<div class="header">
<h1>⚙️ 本人登録</h1>
</div>

<div class="card">

<div class="label">
お名前
</div>

<input
id="userName"
class="input">

<div class="label">
市
</div>

<select
id="city"
class="input"
onchange="changeArea()">

<option>志木市</option>
<option>新座市</option>
<option>朝霞市</option>
<option>和光市</option>

</select>

<div class="label">
地区
</div>

<select
id="areaCode"
class="input">
</select>

<div class="label">
家族電話
</div>

<input
id="familyTel"
class="input">

<div class="label">
家族LINE
</div>

<input
id="familyLine"
class="input">

<button
class="saveBtn"
onclick="saveData()">

💾 保存

</button>

</div>

<a
href="index.html"
class="home">

🏠 トップへ戻る

</a>

<script>

const AREA_DATA = {

'志木市':[

'本町1丁目','本町2丁目','本町3丁目',
'本町4丁目','本町5丁目','本町6丁目',
'柏町1丁目','柏町2丁目','柏町3丁目',
'柏町4丁目','柏町5丁目','柏町6丁目',

'幸町1丁目','幸町2丁目','幸町3丁目',

'館1丁目','館2丁目',

'上宗岡1丁目','上宗岡2丁目',
'上宗岡3丁目','上宗岡4丁目',
'上宗岡5丁目',

'中宗岡1丁目','中宗岡2丁目',
'中宗岡3丁目','中宗岡4丁目',
'中宗岡5丁目',

'下宗岡1丁目','下宗岡2丁目',
'下宗岡3丁目','下宗岡4丁目',
'下宗岡5丁目'

],

'新座市':[

'野火止1丁目','野火止2丁目',
'野火止3丁目','野火止4丁目',
'野火止5丁目','野火止6丁目',
'野火止7丁目','野火止8丁目',

'東北1丁目','東北2丁目',

'栗原1丁目','栗原2丁目',
'栗原3丁目','栗原4丁目',
'栗原5丁目','栗原6丁目'

],

'朝霞市':[

'青葉台1丁目',
'青葉台2丁目',

'朝志ケ丘1丁目',
'朝志ケ丘2丁目',
'朝志ケ丘3丁目',
'朝志ケ丘4丁目',

'泉水1丁目',
'泉水2丁目',
'泉水3丁目'

],

'和光市':[

'新倉1丁目',
'新倉2丁目',
'新倉3丁目',

'白子1丁目',
'白子2丁目',
'白子3丁目',
'白子4丁目',

'本町',
'丸山台1丁目',
'丸山台2丁目'

]

};

function changeArea(){

const city =
document.getElementById(
'city'
).value;

const area =
document.getElementById(
'areaCode'
);

area.innerHTML='';

AREA_DATA[city].forEach(item=>{

const option =
document.createElement(
'option'
);

option.value =
item;

option.textContent =
item;

area.appendChild(
option);

});

}

function saveData(){

const userName =
document.getElementById(
'userName'
).value;

const city =
document.getElementById(
'city'
).value;

const areaCode =
document.getElementById(
'areaCode'
).value;

const familyTel =
document.getElementById(
'familyTel'
).value;

const familyLine =
document.getElementById(
'familyLine'
).value;

localStorage.setItem(
'userName',
userName
);

localStorage.setItem(
'city',
city
);

localStorage.setItem(
'areaCode',
areaCode
);

localStorage.setItem(
'familyTel',
familyTel
);

localStorage.setItem(
'familyLine',
familyLine
);

localStorage.setItem(
'userAddress',
city + areaCode
);

localStorage.setItem(
'userId',
city + '_' + areaCode + '_' + userName
);

alert(
'登録しました'
);

location.href =
'index.html';

}

window.onload =
function(){

changeArea();

document.getElementById(
'userName'
).value =
localStorage.getItem(
'userName'
) || '';

document.getElementById(
'familyTel'
).value =
localStorage.getItem(
'familyTel'
) || '';

document.getElementById(
'familyLine'
).value =
localStorage.getItem(
'familyLine'
) || '';

};

</script>

</body>
</html>
