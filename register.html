<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>本人登録</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
background:#101827;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
color:#fff;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:linear-gradient(135deg,#1e293b,#0f172a);
padding:24px;
border-radius:24px;
margin-bottom:16px;
}

.label{
font-size:22px;
font-weight:900;
margin-bottom:8px;
}

.input,
.select{
width:100%;
padding:18px;
font-size:22px;
border:none;
border-radius:18px;
margin-bottom:16px;
}

.btn{
width:100%;
padding:24px;
border:none;
border-radius:24px;
font-size:28px;
font-weight:900;
cursor:pointer;
color:#fff;
margin-bottom:12px;
}

.green{
background:linear-gradient(135deg,#16a34a,#22c55e);
}

.gray{
background:linear-gradient(135deg,#475569,#334155);
}

.result{
background:rgba(255,255,255,.08);
padding:20px;
border-radius:20px;
font-size:22px;
font-weight:900;
line-height:1.8;
}

</style>
</head>

<body>

<div class="header">
<h1>👤 本人登録</h1>
</div>

<div class="card">

<div class="label">
お名前
</div>

<input
id="name"
class="input"
placeholder="山田太郎">

<div class="label">
市
</div>

<select
id="city"
class="select">

<option value="">選択してください</option>

<option>志木市</option>
<option>新座市</option>
<option>朝霞市</option>
<option>和光市</option>

</select>

<div class="label">
町名
</div>

<select
id="area"
class="select">

<option value="">選択してください</option>

<option>本町</option>
<option>幸町</option>
<option>館</option>
<option>柏町</option>
<option>中宗岡</option>
<option>上宗岡</option>
<option>下宗岡</option>

</select>

<div class="label">
丁目
</div>

<select
id="chome"
class="select">

<option value="">選択してください</option>

<option>1丁目</option>
<option>2丁目</option>
<option>3丁目</option>
<option>4丁目</option>
<option>5丁目</option>
<option>6丁目</option>
<option>7丁目</option>
<option>8丁目</option>

</select>

<button
class="btn green"
onclick="saveUser()">

登録する

</button>

</div>

<div class="card">

<div
id="result"
class="result">

未登録

</div>

</div>

<button
class="btn gray"
onclick="location.href='qr.html'">

📱 QR発行

</button>

<script>

function saveUser(){

const name =
document.getElementById(
'name'
).value;

const city =
document.getElementById(
'city'
).value;

const area =
document.getElementById(
'area'
).value;

const chome =
document.getElementById(
'chome'
).value;

if(
!name ||
!city ||
!area ||
!chome
){
alert(
'入力してください'
);
return;
}

const userId =
'DX' +
Date.now();

localStorage.setItem(
'userId',
userId
);

localStorage.setItem(
'userName',
name
);

localStorage.setItem(
'userCity',
city
);

localStorage.setItem(
'userArea',
area
);

localStorage.setItem(
'userChome',
chome
);

document.getElementById(
'result'
).innerHTML =

'登録完了<br><br>' +

name +

'<br><br>' +

city +
' ' +
area +
' ' +
chome +

'<br><br>' +

'利用者ID<br>' +

userId;

}

</script>

</body>
</html>
