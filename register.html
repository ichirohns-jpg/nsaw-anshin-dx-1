<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>利用者登録</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
padding:15px;
}

.wrap{
max-width:900px;
margin:auto;
}

.header{
background:linear-gradient(135deg,#1976d2,#64b5f6);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
font-size:42px;
font-weight:900;
margin-bottom:20px;
}

.card{
background:#fff;
border-radius:28px;
padding:24px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.step{
font-size:18px;
font-weight:900;
color:#1976d2;
margin-bottom:8px;
}

.label{
font-size:34px;
font-weight:900;
margin-bottom:10px;
}

.input{
width:100%;
height:80px;
border:2px solid #d9e2ec;
border-radius:20px;
padding:0 20px;
font-size:32px;
margin-bottom:20px;
}

.select{
width:100%;
height:90px;
border:2px solid #d9e2ec;
border-radius:20px;
padding:0 20px;
font-size:32px;
font-weight:900;
margin-bottom:20px;
background:#fff;
}

.nextBtn{
width:100%;
height:90px;
border:none;
border-radius:20px;
background:#00c853;
color:#fff;
font-size:34px;
font-weight:900;
cursor:pointer;
}

</style>

</head>

<body>

<div class="wrap">

<div class="header">
👤 利用者登録
</div>

<div class="card">

<div class="step">
STEP 1
</div>

<div class="label">
お名前
</div>

<input
id="name"
class="input"
placeholder="山口貞一郎">

<div class="step">
STEP 2
</div>

<div class="label">
市を選択
</div>

<select
id="city"
class="select">

<option value="">
選択してください
</option>

<option>
志木市
</option>

<option>
新座市
</option>

<option>
朝霞市
</option>

<option>
和光市
</option>

</select>

<div class="step">
STEP 3
</div>

<div class="label">
町名を選択
</div>

<select
id="town"
class="select">

<option value="">
まず市を選択
</option>

</select>

<div class="step">
STEP 4
</div>

<div class="label">
丁目を選択
</div>

<select
id="chome"
class="select">

<option value="">
まず町名を選択
</option>

</select>

<button
class="nextBtn"
onclick="registerUser()">
登録してQR発行
</button>

</div>

</div>

<script>

const townData = {

"志木市":[
"本町",
"館",
"柏町",
"幸町",
"中宗岡",
"上宗岡",
"下宗岡"
],

"新座市":[
"東",
"野火止",
"栗原",
"片山",
"新堀",
"石神"
],

"朝霞市":[
"本町",
"仲町",
"栄町",
"根岸台",
"膝折町"
],

"和光市":[
"本町",
"新倉",
"白子",
"中央",
"下新倉"
]

};

document
.getElementById("city")
.addEventListener(
"change",
function(){

const city =
this.value;

const town =
document.getElementById(
"town"
);

town.innerHTML =
'<option value="">選択してください</option>';

(townData[city]||[])
.forEach(item=>{

town.innerHTML +=
`<option>${item}</option>`;

});

}
);

document
.getElementById("town")
.addEventListener(
"change",
function(){

const chome =
document.getElementById(
"chome"
);

chome.innerHTML =

`
<option value="">
選択してください
</option>

<option>1丁目</option>
<option>2丁目</option>
<option>3丁目</option>
<option>4丁目</option>
<option>5丁目</option>
<option>6丁目</option>
<option>7丁目</option>
<option>8丁目</option>
`;

}
);

function registerUser(){

const name =
document.getElementById(
"name"
).value;

const city =
document.getElementById(
"city"
).value;

const town =
document.getElementById(
"town"
).value;

const chome =
document.getElementById(
"chome"
).value;

if(
!name ||
!city ||
!town ||
!chome
){

alert(
"未入力があります"
);

return;

}

localStorage.setItem(
"userName",
name
);

localStorage.setItem(
"userCity",
city
);

localStorage.setItem(
"userTown",
town
);

localStorage.setItem(
"userChome",
chome
);

location.href =
"qr.html";

}

</script>

</body>
</html>
