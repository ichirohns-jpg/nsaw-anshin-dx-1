<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>利用者登録</title>

<link rel="icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
background:linear-gradient(180deg,#000000 0%,#08111d 50%,#000000 100%);
color:#fff;
min-height:100vh;
}

.wrap{
max-width:800px;
margin:auto;
padding:16px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:20px;
margin-bottom:16px;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
margin-bottom:20px;
}

input,
textarea{
width:100%;
padding:18px;
border:none;
border-radius:18px;
margin-bottom:12px;
font-size:18px;
background:rgba(255,255,255,.1);
color:#fff;
}

textarea{
height:120px;
resize:none;
}

button{
width:100%;
padding:20px;
border:none;
border-radius:20px;
font-size:24px;
font-weight:900;
color:#fff;
cursor:pointer;
margin-bottom:10px;
}

.save-btn{
background:linear-gradient(135deg,#00a3c4,#00d4ff);
}

.list-btn{
background:linear-gradient(135deg,#455a64,#607d8b);
}

.home-btn{
background:linear-gradient(135deg,#7b1fa2,#ab47bc);
}

.msg{
text-align:center;
font-size:18px;
font-weight:900;
margin-top:10px;
min-height:30px;
}

.footer{
text-align:center;
padding:20px;
font-size:12px;
opacity:.6;
}

</style>

</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
👤 利用者登録
</div>

<input
id="name"
placeholder="氏名">

<input
id="kana"
placeholder="ふりがな">

<input
id="tel"
placeholder="電話番号">

<input
id="address"
placeholder="住所">

<input
id="birthday"
placeholder="生年月日">

<input
id="medicine"
placeholder="服薬情報">

<input
id="careLevel"
placeholder="介護認定">

<input
id="hospital"
placeholder="かかりつけ病院">

<input
id="doctor"
placeholder="担当医">

<input
id="familyName"
placeholder="家族氏名">

<input
id="familyTel"
placeholder="家族電話番号">

<input
id="emergencyContact"
placeholder="緊急連絡先">

<textarea
id="memo"
placeholder="メモ"></textarea>

<button
class="save-btn"
onclick="saveUser()">
登録する
</button>

<button
class="list-btn"
onclick="location.href='users.html'">
利用者一覧
</button>

<button
class="home-btn"
onclick="location.href='index.html'">
ホームへ戻る
</button>

<div
id="msg"
class="msg">
</div>

</div>

<div class="footer">
NSAW 利用者登録
</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

async function saveUser(){

const name =
document.getElementById("name").value.trim();

if(name===""){

document.getElementById("msg").innerHTML =
"氏名を入力してください";

return;

}

document.getElementById("msg").innerHTML =
"登録中...";

const body =
new URLSearchParams();

body.append("action","registerUser");
body.append("name",document.getElementById("name").value);
body.append("kana",document.getElementById("kana").value);
body.append("tel",document.getElementById("tel").value);
body.append("address",document.getElementById("address").value);
body.append("birthday",document.getElementById("birthday").value);
body.append("medicine",document.getElementById("medicine").value);
body.append("careLevel",document.getElementById("careLevel").value);
body.append("hospital",document.getElementById("hospital").value);
body.append("doctor",document.getElementById("doctor").value);
body.append("familyName",document.getElementById("familyName").value);
body.append("familyTel",document.getElementById("familyTel").value);
body.append("emergencyContact",document.getElementById("emergencyContact").value);
body.append("memo",document.getElementById("memo").value);
try{

const response =
await fetch(
GAS_URL,
{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:body.toString()
}
);

const json =
await response.json();

if(json.status==="OK"){

document.getElementById("msg").innerHTML =
"登録完了";

setTimeout(function(){

location.href =
"qr.html?id=" + json.id;

},1000);

}else{

document.getElementById("msg").innerHTML =
json.message || "登録失敗";

}

}catch(error){

document.getElementById("msg").innerHTML =
"通信エラー";

}

}

</script>

</body>
</html>
