<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>見守り履歴｜見守りDX</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:560px;
margin:auto;
padding:16px;
}

.header{
background:#00897b;
color:#fff;
border-radius:26px;
padding:22px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.back{
font-size:16px;
font-weight:900;
margin-bottom:12px;
cursor:pointer;
}

.title{
font-size:34px;
font-weight:900;
}

.sub{
font-size:16px;
margin-top:6px;
opacity:.95;
}

.card{
background:#fff;
border-radius:26px;
padding:20px;
margin-bottom:14px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.time{
font-size:18px;
font-weight:900;
color:#00897b;
margin-bottom:8px;
}

.status{
font-size:28px;
font-weight:900;
}

.ok{
color:#2e7d32;
}

.warn{
color:#ef6c00;
}

.help{
color:#d32f2f;
}

.footer{
display:flex;
justify-content:space-around;
margin-top:20px;
padding:18px 0;
background:#fff;
border-radius:22px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
font-size:14px;
font-weight:900;
color:#666;
}

</style>
</head>

<body>

<div class="wrap">

<div class="header">

<div class="back" onclick="location.href='index.html'">
← トップへ戻る

<div class="title">

</div>

<div class="sub">

</div>

</div>

<div class="card">
<div class="time">
2026-05-31 08:15
</div>
<div class="status ok">
😊 元気です
</div>
</div>

<div class="card">
<div class="time">
2026-05-30 19:42
</div>
<div class="status warn">
😐 少し困っています

</div>

<div class="card">

2026-05-29 09:05
</div>

</div>

<div class="card">

2026-05-28 21:10
</div>
<div class="status help">
🚨 助けてください
</div>
</div>

<div class="footer">

<div onclick="location.href='index.html'">
見守り
</div>

<div onclick="location.href='calendar.html'">

</div>

</div>
