<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>元気です履歴</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}

.header{
background:linear-gradient(135deg,#16a34a,#22c55e);
color:#fff;
padding:30px;
text-align:center;
}

.header h1{
font-size:38px;
font-weight:900;
}

.wrap{
max-width:1000px;
margin:auto;
padding:18px;
}

.card{
background:#fff;
border-radius:28px;
padding:20px;
margin-bottom:16px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.time{
font-size:16px;
color:#64748b;
font-weight:900;
margin-bottom:8px;
}

.name{
font-size:26px;
font-weight:900;
margin-bottom:8px;
}

.status{
font-size:22px;
font-weight:900;
color:#16a34a;
}

.back{
display:block;
background:#334155;
color:#fff;
text-decoration:none;
text-align:center;
padding:18px;
border-radius:18px;
font-size:22px;
font-weight:900;
margin-top:20px;
}
</style>

</head>
<body>

<div class="header">
<h1>😊 元気です履歴</h1>
</div>

<div class="wrap">

<div id="list"></div>

<a href="index.html" class="back">
🏠 トップへ戻る
</a>

</div>

<script>

const SHEET_ID='149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc';
const SHEET_NAME='見守り記録';

const url=
'https://docs.google.com/spreadsheets/d/'+
SHEET_ID+
'/gviz/tq?sheet='+
encodeURIComponent(SHEET_NAME)+
'&tqx=out:json';

fetch(url)
.then(r=>r.text())
.then(text=>{

const json=JSON.parse(text.substring(47,text.length-2));

let html='';

json.table.rows.reverse().forEach(row=>{

const time=row.c[0]?.v||'';
const name=row.c[1]?.v||'';
const status=row.c[2]?.v||'';

if(status!=='元気です') return;

html+=`
<div class="card">
<div class="time">${time}</div>
<div class="name">${name}</div>
<div class="status">${status}</div>
</div>
`;

});

document.getElementById('list').innerHTML=html;

});

</script>

</body>
</html>
