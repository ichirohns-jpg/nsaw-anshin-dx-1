<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>本人ページ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:15px;
color:#1f2d3d;
}

.wrap{
max-width:900px;
margin:auto;
}

.header{
background:linear-gradient(135deg,#1565c0,#42a5f5);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
font-size:42px;
font-weight:900;
margin-bottom:20px;
}

.card{
background:#fff;
border-radius:28px;
padding:24px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
margin-bottom:16px;
}

.name{
font-size:36px;
font-weight:900;
text-align:center;
margin-bottom:10px;
}

.address{
font-size:22px;
text-align:center;
margin-bottom:20px;
}

.bigBtn{
width:100%;
height:110px;
border:none;
border-radius:24px;
font-size:38px;
font-weight:900;
color:#fff;
cursor:pointer;
margin-bottom:14px;
}

.genki{
background:#00c853;
}

.medicine{
background:#ff9800;
}

.gps{
background:#2196f3;
}

.schedule{
background:#7b1fa2;
}

.sos{
background:#e53935;
}

</style>

</head>

<body>

<div class="wrap">

<div class="header">
😊 本人ページ
</div>

<div class="card">

<div
id="userName"
class="name">
利用者
</div>

<div
id="userAddress"
class="address">
住所
</div>

<button
class="bigBtn genki"
onclick="sendGenki()">
😊 元気です
</button>

<button
class="bigBtn medicine"
onclick="sendMedicine()">
💊 薬を飲みました
</button>

<button
class="bigBtn gps"
onclick="sendGps()">
📍 現在地送信
</button>

<button
class="bigBtn schedule"
onclick="showSchedule()">
📅 今日の予定
</button>

<button
class="bigBtn sos"
onclick="sendSOS()">
🚨 困っています
</button>

</div>

<div
id="resultCard"
class="card"
style="display:none;">

<div style="
font-size:30px;
font-weight:900;
text-align:center;
margin-bottom:15px;
">
送信結果
</div>

<div
id="resultArea"
style="
font-size:24px;
text-align:center;
line-height:1.8;
">
待機中
</div>

</div>

</div>

</div>

<script>

const name =
localStorage.getItem(
"userName"
) || "利用者";

const city =
localStorage.getItem(
"userCity"
) || "";

const town =
localStorage.getItem(
"userTown"
) || "";

const chome =
localStorage.getItem(
"userChome"
) || "";

document.getElementById(
"userName"
).innerHTML =
name;

document.getElementById(
"userAddress"
).innerHTML =

city +
" " +
town +
" " +
chome;

function showResult(msg){

document.getElementById(
"resultCard"
).style.display =
"block";

document.getElementById(
"resultArea"
).innerHTML =
msg;

}

function sendGenki(){

showResult(

"😊 元気です<br><br>" +

new Date()
.toLocaleString(
"ja-JP"
)

);

}

function sendMedicine(){

showResult(

"💊 薬を飲みました<br><br>" +

new Date()
.toLocaleString(
"ja-JP"
)

);

}

function sendSOS(){

showResult(

"🚨 支援者へ通知しました<br><br>" +

new Date()
.toLocaleString(
"ja-JP"
)

);

}

function showSchedule(){

showResult(

"📅 本日の予定<br><br>" +

"09:00 朝食<br>" +

"12:00 昼食<br>" +

"18:00 夕食"

);

}

function sendGps(){

if(
navigator.geolocation
){

navigator.geolocation.getCurrentPosition(

function(pos){

showResult(

"📍 現在地送信<br><br>" +

"緯度：" +

pos.coords.latitude +

"<br><br>" +

"経度：" +

pos.coords.longitude

);

},

function(){

showResult(
"GPS取得失敗"
);

}

);

}else{

showResult(
"GPS未対応端末"
);

}

}

</script>

</body>
</html>
