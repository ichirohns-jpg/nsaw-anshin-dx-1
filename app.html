<div class="card">

<div class="title">
🗑 ゴミ収集案内
</div>

<div id="garbageTodayCard" class="status-card">

<div class="status-title">
🟢 今日のゴミ
</div>

<div id="garbageTodayType" class="status-main">
確認中...
</div>

<div id="garbageTodayMsg" class="status-sub">
読込中...
</div>

</div>

<div id="garbageTomorrowCard" class="status-card">

<div class="status-title">
🔵 明日のゴミ
</div>

<div id="garbageTomorrowType" class="status-main">
確認中...
</div>

<div id="garbageTomorrowMsg" class="status-sub">
読込中...
</div>

</div>

<button
class="action-btn"
onclick="speakGarbage()">
🔊 読み上げ
</button>

</div>

<style>

.status-card{
background:#f7f9fc;
border-radius:20px;
padding:18px;
margin-bottom:15px;
text-align:center;
}

.status-title{
font-size:20px;
font-weight:900;
margin-bottom:10px;
}

.status-main{
font-size:28px;
font-weight:900;
color:#00a86b;
margin-bottom:8px;
}

.status-sub{
font-size:16px;
line-height:1.6;
}

.action-btn{
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:#1f8cff;
color:#fff;
font-size:22px;
font-weight:900;
cursor:pointer;
}

</style>

<script>

const SHEET_ID =
"149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc";

const GOMI_SHEET =
"ゴミ";

function getWeekName(offset=0){

const d =
new Date();

d.setDate(
d.getDate()+offset
);

return [
"日",
"月",
"火",
"水",
"木",
"金",
"土"
][d.getDay()];

}

function cell(row,index){

return row.c[index]
? (row.c[index].v || row.c[index].f || "")
: "";

}

async function loadGarbage(){

const url =
"https://docs.google.com/spreadsheets/d/" +
SHEET_ID +
"/gviz/tq?sheet=" +
encodeURIComponent(GOMI_SHEET) +
"&tqx=out:json";

try{

const txt =
await fetch(url)
.then(r=>r.text());

const json =
JSON.parse(
txt.substring(47).slice(0,-2)
);

const rows =
json.table.rows;

const city =
window.userCity || "";

const area =
window.userArea || "";

const today =
getWeekName(0);

const tomorrow =
getWeekName(1);

let todayData = null;
let tomorrowData = null;

rows.forEach(row=>{

const cityName =
cell(row,0);

const areaName =
cell(row,1);

const week =
String(cell(row,2));

if(
cityName === city &&
areaName === area
){

if(
week.indexOf(today) > -1
){
todayData = {
type:cell(row,3),
msg:cell(row,6) || cell(row,4)
};
}

if(
week.indexOf(tomorrow) > -1
){
tomorrowData = {
type:cell(row,3),
msg:cell(row,6) || cell(row,4)
};
}

}

});

if(todayData){

document.getElementById(
"garbageTodayType"
).innerHTML =
todayData.type;

document.getElementById(
"garbageTodayMsg"
).innerHTML =
todayData.msg;

}else{

document.getElementById(
"garbageTodayType"
).innerHTML =
"収集なし";

document.getElementById(
"garbageTodayMsg"
).innerHTML =
"本日の収集はありません";

}

if(tomorrowData){

document.getElementById(
"garbageTomorrowType"
).innerHTML =
tomorrowData.type;

document.getElementById(
"garbageTomorrowMsg"
).innerHTML =
tomorrowData.msg;

}else{

document.getElementById(
"garbageTomorrowType"
).innerHTML =
"収集なし";

document.getElementById(
"garbageTomorrowMsg"
).innerHTML =
"明日の収集はありません";

}

}catch(error){

document.getElementById(
"garbageTodayType"
).innerHTML =
"取得失敗";

document.getElementById(
"garbageTomorrowType"
).innerHTML =
"取得失敗";

}

}

function speakGarbage(){

const text =

"今日のゴミは" +

document.getElementById(
"garbageTodayType"
).innerText +

"です。" +

document.getElementById(
"garbageTodayMsg"
).innerText +

"。明日のゴミは" +

document.getElementById(
"garbageTomorrowType"
).innerText +

"です。" +

document.getElementById(
"garbageTomorrowMsg"
).innerText;

const speech =
new SpeechSynthesisUtterance(
text
);

speech.lang =
"ja-JP";

speech.rate = 1;

speech.pitch = 1;

speechSynthesis.speak(
speech
);

}

/*
利用者読込後に

window.userCity
window.userArea

をセットしてから実行
*/

loadGarbage();

</script>
