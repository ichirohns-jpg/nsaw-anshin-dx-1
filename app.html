<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>見守り送信</title>
</head>

<body>

<h2>見守り送信</h2>

<input id="name" placeholder="名前"><br><br>

<select id="status">
<option value="元気">元気</option>
<option value="注意">注意</option>
<option value="緊急">緊急</option>
</select>

<br><br>

<textarea id="memo" placeholder="メモ"></textarea>

<br><br>

<button onclick="send()">送信</button>

<p id="msg"></p>

<script>

const GAS_URL = "https://script.google.com/macros/s/AKfycbw_sD-jZkCHBI21dbhX3koHAw1Vye6goMcZg2xYBdKKMU_k6FqCQFYGC8b8B8s7oFmn/exec";

function send(){

fetch(GAS_URL,{
method:"POST",
body:new URLSearchParams({
name:document.getElementById("name").value,
status:document.getElementById("status").value,
memo:document.getElementById("memo").value
})
})
.then(r=>r.text())
.then(()=>{
document.getElementById("msg").innerText="送信OK";
})
.catch(()=>{
document.getElementById("msg").innerText="エラー";
});

}

</script>

</body>
</html>
