<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbxHknfXsWiwwIhuJ88JFDNRi51jEvD-vgzdeld3YTnfL_0CsrhKmTzxaWUFLVnisRCp/exec";

function setStatus(status){

document.getElementById("status").value =
status;

document.getElementById("currentStatus").innerText =
status;

}

function goHome(){

location.href =
"index.html";

}

async function sendData(){

const name =
document.getElementById("name").value.trim();

const status =
document.getElementById("status").value;

const memo =
document.getElementById("memo").value.trim();

if(name === ""){

document.getElementById("msg").innerText =
"名前を入力してください";

return;

}

document.getElementById("msg").innerText =
"送信中...";

const params =
new URLSearchParams();

params.append(
"name",
name
);

params.append(
"status",
status
);

params.append(
"memo",
memo
);

try{

const response =
await fetch(
GAS_URL,
{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:params.toString()
}
);

const text =
await response.text();

if(
response.ok &&
text.indexOf("ERROR") === -1
){

document.getElementById("msg").innerText =
"送信成功";

document.getElementById("currentTime").innerText =
"最終送信：" +
new Date().toLocaleString("ja-JP");

document.getElementById("memo").value =
"";

}else{

document.getElementById("msg").innerText =
"送信失敗";

}

}catch(error){

document.getElementById("msg").innerText =
"通信エラー";

}

}

window.onload = function(){

document.getElementById("currentTime").innerText =
"現在時刻：" +
new Date().toLocaleString("ja-JP");

};

</script>
