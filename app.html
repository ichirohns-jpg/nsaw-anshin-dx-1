<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>元気です</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
background:#101827;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
color:#fff;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
border-radius:30px;
padding:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:36px;
font-weight:900;
}

.card{
background:linear-gradient(135deg,#1e293b,#0f172a);
padding:24px;
border-radius:24px;
margin-bottom:16px;
}

.status{
font-size:24px;
font-weight:900;
text-align:center;
line-height:1.8;
}

.bigBtn{
display:block;
width:100%;
padding:40px;
border:none;
border-radius:30px;
font-size:42px;
font-weight:900;
cursor:pointer;
color:#fff;
background:linear-gradient(135deg,#16a34a,#22c55e);
margin-bottom:16px;
}

.info{
background:rgba(255,255,255,.08);
padding:18px;
border-radius:18px;
margin-bottom:12px;
font-size:20px;
font-weight:900;
line-height:1.8;
}

.menu{
display:block;
width:100%;
padding:22px;
border-radius:20px;
text-decoration:none;
text-align:center;
font-size:24px;
font-weight:900;
color:#fff;
margin-bottom:12px;
}

.blue{
background:linear-gradient(135deg,#2563eb,#3b82f6);
}

.red{
background:linear-gradient(135deg,#dc2626,#ef4444);
}

.orange{
background:linear-gradient(135deg,#ea580c,#fb923c);
}

.gray{
background:linear-gradient(135deg,#475569,#334155);
}

</style>
</head>

<body>

<div class="header">
<h1>😊 元気です</h1>
</div>

<div class="card">

<div id="statusArea" class="status">
本日の安否確認をしてください
</div>

</div>

<button
class="bigBtn"
onclick="sendGenki()">
😊 元気です
</button>

<div class="card">

<div id="lastArea" class="info">
未送信
</div>

</div>

<a href="medicine.html" class="menu blue">
💊 服薬
</a>

<a href="gps.html" class="menu red">
📍 現在地
</a>

<a href="sos.html" class="menu orange">
🚨 困りごと・SOS
</a>

<a href="index.html" class="menu gray">
🏠 トップへ戻る
</a>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec';

loadLast();

function loadLast(){

const last =
JSON.parse(
localStorage.getItem(
'lastGenki'
) || 'null'
);

if(last){

document.getElementById(
'lastArea'
).innerHTML =

'最終送信<br><br>' +

last.time;

}

}

function sendGenki(){

const now =
new Date().toLocaleString(
'ja-JP'
);

const data = {

type:'genki',

time:now,

name:
localStorage.getItem(
'userName'
) || '利用者',

userId:
localStorage.getItem(
'userId'
) || ''

};

localStorage.setItem(
'lastGenki',
JSON.stringify(data)
);

document.getElementById(
'statusArea'
).innerHTML =

'😊 元気です送信完了<br><br>' +

now;

document.getElementById(
'lastArea'
).innerHTML =

'最終送信<br><br>' +

now;

fetch(
GAS_URL,
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify(data)
}
).catch(()=>{});

}

</script>

</body>
</html>
