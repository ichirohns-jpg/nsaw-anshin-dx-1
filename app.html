<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家族・支援者ページ</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f4f6f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

header{
background:linear-gradient(135deg,#6a1b9a,#8e24aa);
color:#fff;
padding:26px 18px;
text-align:center;
font-size:30px;
font-weight:900;
}

.wrap{
max-width:800px;
margin:auto;
padding:18px;
}

.card{
background:#fff;
border-radius:20px;
padding:18px;
margin-bottom:16px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.title{
font-size:20px;
font-weight:900;
margin-bottom:6px;
}

.status{
background:#ffffff;
border-radius:20px;
padding:22px;
font-size:22px;
font-weight:900;
box-shadow:0 6px 18px rgba(0,0,0,.08);
line-height:1.8;
}

.item{
padding:14px;
border-bottom:1px solid #eee;
font-size:18px;
font-weight:800;
}

.time{
font-size:14px;
color:#607d8b;
margin-top:4px;
}

.btn{
display:block;
width:100%;
padding:16px;
margin-top:14px;
border-radius:14px;
text-align:center;
font-size:18px;
font-weight:900;
text-decoration:none;
color:#fff;
background:#607d8b;
}

@media(max-width:700px){
.status{font-size:20px}
.item{font-size:16px}
}
</style>
</head>

<body>

<header>
👪 家族・支援者ページ
</header>

<div class="wrap">

<div class="card">
<div class="title">利用者状況（履歴）</div>
<div id="list" class="status">読み込み中...</div>
</div>

<a class="btn" href="index.html">🏠 トップへ戻る</a>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbxsgeub9qA9q5EnfZgOEVah2H5YC9dEy_n2UqMkviD8Wy5IcVsL-CsMmNE0ZvDMbGFd/exec";

const params =
new URLSearchParams(location.search);

const userId =
params.get("id") || "A001";

fetch(GAS_URL + "?id=" + encodeURIComponent(userId))
.then(r => r.json())
.then(data => {

  const box =
    document.getElementById("list");

  if(!data){
    box.innerHTML = "データなし";
    return;
  }

  // 単体 or 配列両対応
  const list = Array.isArray(data) ? data : [data];

  let html = "";

  list.reverse().forEach(item => {

    html += `
      <div class="item">
        ${item.status}
        <div class="time">
          ${new Date(item.datetime).toLocaleString("ja-JP")}
        </div>
      </div>
    `;

  });

  box.innerHTML = html;

})
.catch(() => {
  document.getElementById("list").innerHTML = "取得エラー";
});

</script>

</body>
</html>
