<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>見守り確認</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

header{
background:#009688;
color:#fff;
padding:30px 18px;
text-align:center;
font-size:34px;
font-weight:900;
}

.wrap{
max-width:760px;
margin:auto;
padding:18px;
}

.card{
background:#fff;
border-radius:22px;
padding:18px;
margin-bottom:16px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.text{
font-size:18px;
font-weight:800;
line-height:1.6;
color:#455a64;
}

.result{
display:none;
margin-top:16px;
padding:18px;
border-radius:16px;
font-size:20px;
font-weight:900;
}

.btn{
display:block;
width:100%;
padding:22px;
margin-top:16px;
border-radius:16px;
font-size:22px;
font-weight:900;
color:#fff;
text-align:center;
text-decoration:none;
}

.home{background:#607d8b;}
</style>
</head>

<body>

<header>
見守り確認
</header>

<div class="wrap">

<div class="card">
<div class="text">
本人の状態を送信します
</div>

<div id="result" class="result"></div>

<a class="btn home" href="person.html?id=A001">🏠 本人へ戻る</a>
</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbxsgeub9qA9q5EnfZgOEVah2H5YC9dEy_n2UqMkviD8Wy5IcVsL-CsMmNE0ZvDMbGFd/exec";

const params =
new URLSearchParams(location.search);

const status =
params.get("status");

const userId =
params.get("id") || "A001";

const box =
document.getElementById("result");

function show(msg,color){
  box.style.display="block";
  box.style.background=color;
  box.innerHTML=msg;
}

if(!status){

show("送信内容なし","#ffebee");

}else{

show("送信中...","#e3f2fd");

fetch(GAS_URL,{
  method:"POST",
  mode:"no-cors",
  body:JSON.stringify({
    id:userId,
    status:status,
    datetime:new Date().toISOString()
  })
});

show("送信しました","#e8f5e9");

}

</script>

</body>
</html>
