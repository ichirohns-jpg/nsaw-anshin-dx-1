<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>あんしん生活DX</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
background:#eef4f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#123;
padding:12px;
}

.wrap{
max-width:760px;
margin:auto;
}

.header{
background:#00897b;
color:white;
border-radius:30px;
padding:28px 20px;
text-align:center;
margin-bottom:18px;
box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.title{
font-size:40px;
font-weight:900;
line-height:1.4;
margin:0;
}

.sub{
font-size:22px;
font-weight:900;
line-height:1.6;
margin-top:10px;
}

.topBtn{
display:block;
width:100%;
background:#555;
color:white;
text-decoration:none;
text-align:center;
border-radius:26px;
padding:24px 10px;
font-size:28px;
font-weight:900;
margin-bottom:18px;
}

.reloadBtn{
width:100%;
border:none;
background:#1976d2;
color:white;
border-radius:26px;
padding:24px 10px;
font-size:28px;
font-weight:900;
margin-bottom:18px;
cursor:pointer;
}

.status{
background:#fff8e1;
border-radius:24px;
padding:18px;
font-size:24px;
font-weight:900;
line-height:1.6;
text-align:center;
margin-bottom:20px;
color:#444;
}

.card{
background:white;
border-radius:30px;
padding:20px;
margin-bottom:22px;
box-shadow:0 8px 22px rgba(0,0,0,.08);
}

.date{
display:inline-block;
background:#00897b;
color:white;
border-radius:999px;
padding:8px 16px;
font-size:20px;
font-weight:900;
margin-bottom:14px;
}

.cardTitle{
font-size:36px;
font-weight:900;
line-height:1.45;
margin-bottom:14px;
color:#123;
}

.cardImg{
width:100%;
border-radius:24px;
display:block;
margin-bottom:18px;
}

.detail{
font-size:25px;
font-weight:800;
line-height:1.7;
white-space:pre-wrap;
color:#333;
margin-bottom:18px;
}

.cityBox{
background:#f8fbff;
border:4px solid #d7e6ff;
border-radius:24px;
padding:18px;
margin-bottom:16px;
}

.cityBadge{
display:inline-block;
color:white;
border-radius:999px;
padding:8px 16px;
font-size:20px;
font-weight:900;
margin-bottom:12px;
}

.shiki{
background:#1976d2;
}

.niiza{
background:#2e7d32;
}

.asaka{
background:#ef6c00;
}

.wako{
background:#6a1b9a;
}

.cityTitle{
font-size:28px;
font-weight:900;
line-height:1.5;
margin-bottom:14px;
color:#123;
}

.linkBtn{
display:block;
width:100%;
background:#1976d2;
color:white;
text-decoration:none;
text-align:center;
border-radius:22px;
padding:22px 10px;
font-size:24px;
font-weight:900;
}

.shareBox{
background:#f8fbff;
border:3px solid #d7e6ff;
border-radius:24px;
padding:14px;
margin-top:18px;
}

.shareTitle{
font-size:22px;
font-weight:900;
text-align:center;
margin-bottom:12px;
color:#1565c0;
}

.shareGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.shareBtn{
display:block;
width:100%;
border:none;
border-radius:20px;
padding:18px 8px;
font-size:21px;
font-weight:900;
color:white;
cursor:pointer;
text-align:center;
text-decoration:none;
}

.lineBtn{
background:#06c755;
}

.xBtn{
background:#111;
}

.facebookBtn{
background:#1877f2;
}

.copyBtn{
background:#555;
}

.archiveTitle{
font-size:32px;
font-weight:900;
text-align:center;
margin:0 0 18px;
color:#1565c0;
}

.archiveBtn{
width:100%;
border:none;
background:#777;
color:white;
border-radius:26px;
padding:24px 10px;
font-size:28px;
font-weight:900;
cursor:pointer;
}

.archiveArea{
display:none;
}

.empty{
background:#f5f7fa;
border-radius:24px;
padding:24px;
font-size:28px;
font-weight:900;
line-height:1.6;
text-align:center;
color:#666;
}

.bottomSpace{
height:20px;
}

@media(max-width:600px){

.title{
font-size:34px;
}

.sub{
font-size:20px;
}

.topBtn,
.reloadBtn,
.archiveBtn{
font-size:24px;
padding:22px 10px;
}

.status{
font-size:22px;
}

.cardTitle{
font-size:30px;
}

.detail{
font-size:23px;
}

.cityTitle{
font-size:24px;
}

.linkBtn{
font-size:22px;
}

.shareBtn{
font-size:19px;
}

.empty{
font-size:24px;
}

}
</style>
</head>

<body>

<div class="wrap">

<div class="header">
<h1 class="title">
4市の瓦版
</h1>

<div class="sub">
志木・新座・朝霞・和光の情報を1枚で見ます
</div>
</div>

<a class="topBtn" href="index.html?v=regionaltop1">
⬅️ 最初の画面に戻る
</a>

<button class="reloadBtn" onclick="loadData()">
🔄 更新する
</button>

<div class="status" id="statusBox">
読み込み中...
</div>

<div id="latestArea">
<div class="empty">
読み込み中...
</div>
</div>

<button class="archiveBtn" id="archiveBtn">
📚 アーカイブを見る
</button>

<div class="archiveArea" id="archiveArea">

<div class="archiveTitle">
アーカイブ
</div>

<div id="archiveList">
</div>

</div>

<div class="bottomSpace"></div>

</div>

<script>
const SHEET_ID =
"149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc";

const SHEET_NAME =
"NSAW暮らし情報局_データ";

const latestArea =
document.getElementById("latestArea");

const archiveArea =
document.getElementById("archiveArea");

const archiveList =
document.getElementById("archiveList");

const archiveBtn =
document.getElementById("archiveBtn");

const statusBox =
document.getElementById("statusBox");

let archiveOpen = false;

function escapeHtml(str){

return String(str || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#39;");

}

function getCell(row,index){

if(!row || !row.c || !row.c[index]){
return "";
}

const cell = row.c[index];

if(cell.f !== undefined && cell.f !== null){
return String(cell.f);
}

if(cell.v !== undefined && cell.v !== null){
return String(cell.v);
}

return "";

}

function looksLikeImage(url){

return String(url || "")
.match(/\.(jpg|jpeg|png|webp|gif)(\?|$)/i);

}

function buildCard(item){

return `
<div class="card">

${item.date ? `
<div class="date">
${escapeHtml(item.date)}
</div>
` : ""}

<div class="cardTitle">
${escapeHtml(item.title)}
</div>

${item.image && looksLikeImage(item.image) ? `
<img class="cardImg" src="${escapeHtml(item.image)}">
` : ""}

${item.detail ? `
<div class="detail">
${escapeHtml(item.detail)}
</div>
` : ""}

<div class="cityBox">
<div class="cityBadge shiki">
志木市
</div>

<div class="cityTitle">
${escapeHtml(item.info1title)}
</div>

<a class="linkBtn"
href="${escapeHtml(item.info1url)}"
target="_blank">
記事を見る
</a>
</div>

<div class="cityBox">
<div class="cityBadge niiza">
新座市
</div>

<div class="cityTitle">
${escapeHtml(item.info2title)}
</div>

<a class="linkBtn"
href="${escapeHtml(item.info2url)}"
target="_blank">
記事を見る
</a>
</div>

<div class="cityBox">
<div class="cityBadge asaka">
朝霞市
</div>

<div class="cityTitle">
${escapeHtml(item.info3title)}
</div>

<a class="linkBtn"
href="${escapeHtml(item.info3url)}"
target="_blank">
記事を見る
</a>
</div>

<div class="cityBox">
<div class="cityBadge wako">
和光市
</div>

<div class="cityTitle">
${escapeHtml(item.info4title)}
</div>

<a class="linkBtn"
href="${escapeHtml(item.info4url)}"
target="_blank">
記事を見る
</a>
</div>

<div class="shareBox">

<div class="shareTitle">
共有する
</div>

<div class="shareGrid">

<a class="shareBtn lineBtn"
href="https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(location.href)}"
target="_blank">
LINE
</a>

<a class="shareBtn xBtn"
href="https://twitter.com/intent/tweet?url=${encodeURIComponent(location.href)}"
target="_blank">
X
</a>

<a class="shareBtn facebookBtn"
href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(location.href)}"
target="_blank">
Facebook
</a>

<button class="shareBtn copyBtn"
onclick="copyUrl()">
URLコピー
</button>

</div>

</div>

</div>
`;

}

function copyUrl(){

navigator.clipboard.writeText(location.href)
.then(function(){
alert("URLをコピーしました");
});

}

function loadData(){

statusBox.innerText =
"読み込み中...";

latestArea.innerHTML =
'<div class="empty">読み込み中...</div>';

archiveList.innerHTML = "";

const old =
document.getElementById("jsonp");

if(old){
old.remove();
}

const script =
document.createElement("script");

script.id = "jsonp";

script.src =
"https://docs.google.com/spreadsheets/d/" +
SHEET_ID +
"/gviz/tq?sheet=" +
encodeURIComponent(SHEET_NAME) +
"&tqx=out:json;responseHandler=handleSheet&t=" +
Date.now();

document.body.appendChild(script);

}

window.handleSheet = function(json){

try{

const rows =
json.table.rows || [];

const items = [];

rows.forEach(function(row,index){

const item = {

date:getCell(row,0),
title:getCell(row,1),
image:getCell(row,2),
detail:getCell(row,3),

info1title:getCell(row,4),
info1url:getCell(row,5),

info2title:getCell(row,6),
info2url:getCell(row,7),

info3title:getCell(row,8),
info3url:getCell(row,9),

info4title:getCell(row,10),
info4url:getCell(row,11),

display:getCell(row,12),
sort:getCell(row,13),
order:getCell(row,14)

};

if(
item.display &&
item.display !== "はい" &&
item.display !== "表示" &&
item.display !== "公開"
){
return;
}

if(
!item.title &&
!item.detail
){
return;
}

items.push(item);

});

items.sort(function(a,b){

return String(b.sort || "")
.localeCompare(String(a.sort || ""));

});

if(items.length === 0){

latestArea.innerHTML =
'<div class="empty">まだ情報がありません</div>';

statusBox.innerText =
"情報がありません";

return;

}

const latest =
items.slice(0,5);

const archive =
items.slice(5);

latestArea.innerHTML =
latest.map(buildCard).join("");

if(archive.length > 0){

archiveList.innerHTML =
archive.map(buildCard).join("");

archiveBtn.style.display =
"block";

}else{

archiveBtn.style.display =
"none";

}

statusBox.innerText =
"読み込みました";

}catch(error){

statusBox.innerText =
"表示エラー";

latestArea.innerHTML =
'<div class="empty">表示エラー</div>';

console.error(error);

}

};

archiveBtn.onclick = function(){

archiveOpen = !archiveOpen;

archiveArea.style.display =
archiveOpen ? "block" : "none";

archiveBtn.innerText =
archiveOpen ?
"📕 アーカイブを閉じる" :
"📚 アーカイブを見る";

};

loadData();
</script>

</body>
</html>
