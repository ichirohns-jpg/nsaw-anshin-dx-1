<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>見守り送信</title>
</head>

<body>

<h2>見守り送信</h2>

<input id="name" placeholder="名前"><br><br>

<select id="status">
<option>元気</option>
<option>注意</option>
<option>緊急</option>
</select><br><br>

<textarea id="memo" placeholder="メモ"></textarea><br><br>

<button onclick="send()">送信</button>

<p id="msg"></p>

<script>

// ■ ここにあなたのGAS URL（さっきのやつ）
const GAS_URL = "https://script.google.com/macros/s/AKfycbyPUHKGmhwJ2EWssZyKoM-6eqgFu4n6GbqFtN5WPRjvgaTNO-XhJ4Ua5JbW6LrkFWI1/exec";

function send(){

fetch(GAS_URL,{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:new URLSearchParams({
name:name.value,
status:status.value,
memo:memo.value
})
})
.then(res=>res.text())
.then(data=>{
msg.innerText="送信完了";
})
.catch(()=>{
msg.innerText="エラー";
});

}

</script>

</body>
</html>
