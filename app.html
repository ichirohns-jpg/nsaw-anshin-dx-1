<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>あんしん生活DX</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:#eef4f8;
color:#123;
padding:16px;
}

.wrap{
max-width:760px;
margin:auto;
}

.card{
background:white;
border-radius:30px;
padding:20px;
margin-bottom:22px;
box-shadow:0 8px 22px rgba(0,0,0,.08);
}

.title{
font-size:28px;
font-weight:900;
margin-bottom:12px;
}

.text{
font-size:18px;
font-weight:700;
line-height:1.7;
white-space:pre-wrap;
}

img{
width:100%;
border-radius:24px;
margin-top:12px;
}

.status{
background:#fff8e1;
border-radius:24px;
padding:18px;
font-size:20px;
font-weight:900;
margin-bottom:20px;
text-align:center;
}
</style>

</head>

<body>

<div class="wrap">

<div id="status" class="status">読み込み中...</div>
<div id="app"></div>

</div>

<script>

const SHEET_ID = "149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc";
const SHEET_NAME = "NSAW暮らし情報局_データ";

function getCell(row,i){
return row?.c?.[i]?.v || "";
}

async function load(){

const id = new URLSearchParams(location.search).get("id");

const url =
"https://docs.google.com/spreadsheets/d/"+SHEET_ID+
"/gviz/tq?sheet="+encodeURIComponent(SHEET_NAME)+
"&tqx=out:json";

try{

const res = await fetch(url);
const text = await res.text();
const json = JSON.parse(text.substring(47).slice(0,-2));

const rows = json.table.rows;

// ■ 1件だけ取得
let item = null;

for(let i=0;i<rows.length;i++){

const rowId = getCell(rows[i],0);

if(String(rowId) === String(id)){
item = {
title:getCell(rows[i],1),
image:getCell(rows[i],2),
text:getCell(rows[i],3)
};
break;
}

}

// ■ 表示
if(!item){
document.getElementById("app").innerHTML =
"<div class='card'>記事が見つかりません</div>";
return;
}

document.getElementById("app").innerHTML = `
<div class="card">
<div class="title">${item.title}</div>
<div class="text">${item.text}</div>
${item.image ? `<img src="${item.image}">` : ""}
</div>
`;

document.getElementById("status").innerText = "完了";

}catch(e){

document.getElementById("status").innerText = "エラー";

}

}

load();

</script>

</body>
</html>
