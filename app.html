<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>見守り確認</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

header{
background:#009688;
color:#fff;
padding:30px 18px;
text-align:center;
font-size:38px;
font-weight:900;
line-height:1.35;
}

.wrap{
max-width:760px;
margin:0 auto;
padding:18px 14px 44px;
}

.card{
background:#fff;
border-radius:28px;
padding:24px 20px;
margin-bottom:22px;
box-shadow:0 8px 22px rgba(0,0,0,.14);
}

.title{
font-size:34px;
font-weight:900;
line-height:1.45;
margin-bottom:10px;
}

.text{
font-size:24px;
line-height:1.8;
font-weight:800;
color:#334e68;
white-space:pre-wrap;
}

.btn{
display:block;
width:100%;
border:0;
padding:30px 18px;
margin:18px 0;
border-radius:24px;
font-size:31px;
font-weight:900;
text-align:center;
color:#fff;
box-shadow:0 6px 16px rgba(0,0,0,.18);
}

.genki{background:#43a047}
.komari{background:#fb8c00}
.help{background:#d32f2f}
.kusuri{background:#1976d2}
.home{background:#607d8b}

.result{
display:none;
background:#fff;
border-radius:28px;
padding:24px 20px;
margin-top:22px;
box-shadow:0 8px 22px rgba(0,0,0,.14);
font-size:26px;
font-weight:900;
line-height:1.7;
}

@media(max-width:700px){
header{font-size:34px;padding:26px 14px}
.title{font-size:31px}
.text{font-size:22px}
.btn{font-size:28px}
.result{font-size:23px}
}
</style>
</head>

<body>

<header>
見守り確認
</header>

<div class="wrap">

<div class="card">
<div class="title">
本人確認ボタン
</div>
<div class="text">
今の状態に近いボタンを押してください。
押した内容と時刻を画面に表示します。
</div>
</div>

<button class="btn genki" onclick="sendStatus('😊 元気です')">
😊 元気です
</button>

<button class="btn komari" onclick="sendStatus('⚠️ 少し困っています')">
⚠️ 少し困っています
</button>

<button class="btn help" onclick="sendStatus('🚨 助けてください')">
🚨 助けてください
</button>

<button class="btn kusuri" onclick="sendStatus('💊 薬を飲みました')">
💊 薬を飲みました
</button>

<a class="btn home" href="index.html">
🏠 トップへ戻る
</a>

<div id="result" class="result"></div>

</div>

<script>

function sendStatus(status){

const now =
new Date();

const text =
status + "<br>" +
"確認時刻：" +
now.getFullYear() + "年" +
(now.getMonth()+1) + "月" +
now.getDate() + "日 " +
String(now.getHours()).padStart(2,"0") + ":" +
String(now.getMinutes()).padStart(2,"0");

const result =
document.getElementById("result");

result.innerHTML =
text + "<br><br>記録しました。";

result.style.display =
"block";

localStorage.setItem(
"lastStatus",
status + " / " + now.toLocaleString("ja-JP")
);

}

</script>

</body>
</html>
