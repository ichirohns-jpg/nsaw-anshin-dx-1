<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>見守り確認</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

header{
background:#009688;
color:#fff;
padding:30px 18px;
text-align:center;
font-size:34px;
font-weight:900;
}

.wrap{
max-width:760px;
margin:auto;
padding:18px;
}

.card{
background:#fff;
border-radius:22px;
padding:18px;
margin-bottom:16px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.text{
font-size:18px;
font-weight:800;
line-height:1.6;
color:#455a64;
}

.result{
display:none;
margin-top:16px;
padding:18px;
border-radius:16px;
background:#e3f2fd;
font-size:20px;
font-weight:900;
}

.btn{
display:block;
width:100%;
padding:22px;
margin-top:16px;
border-radius:16px;
font-size:22px;
font-weight:900;
color:#fff;
text-align:center;
text-decoration:none;
}

.home{background:#607d8b;}
