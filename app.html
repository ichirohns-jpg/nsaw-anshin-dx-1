<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>あんしん生活DX</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:#eef4f8;
color:#123;
padding:16px;
}

.wrap{
max-width:760px;
margin:auto;
}

.header{
background:#00897b;
color:white;
border-radius:30px;
padding:28px 20px;
text-align:center;
margin-bottom:18px;
box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.title{
font-size:40px;
font-weight:900;
line-height:1.4;
margin:0;
}

.sub{
font-size:22px;
font-weight:900;
margin-top:10px;
}

.topBtn{
display:block;
width:100%;
background:#555;
color:white;
text-align:center;
border-radius:26px;
padding:24px;
font-size:28px;
font-weight:900;
margin-bottom:18px;
text-decoration:none;
}

.reloadBtn{
width:100%;
border:none;
background:#1976d2;
color:white;
border-radius:26px;
padding:24px;
font-size:28px;
font-weight:900;
margin-bottom:18px;
}

.status{
background:#fff8e1;
border-radius:24px;
padding:18px;
font-size:24px;
font-weight:900;
margin-bottom:20px;
text-align:center;
}

.card{
background:white;
border-radius:30px;
padding:20px;
margin-bottom:22px;
box-shadow:0 8px 22px rgba(0,0,0,.08);
}

.date{
display:inline-block;
background:#00897b;
color:white;
border-radius:999px;
padding:8px 16px;
font-size:20px;
font-weight:900;
margin-bottom:12px;
}

.cardTitle{
font-size:34px;
font-weight:900;
margin-bottom:12px;
}

.cardImg{
width:100%;
border-radius:24px;
margin-bottom:18px;
}

.detail{
font-size:24px;
font-weight:700;
line-height:1.7;
white-space:pre-wrap;
}

.cityBox{
background:#f8fbff;
border:4px solid #d7e6ff;
border-radius:24px;
padding:18px;
margin-top:16px;
}

.cityBadge{
display:inline-block;
color:white;
border-radius:999px;
padding:8px 16px;
font-size:20px;
font-weight:900;
margin-bottom:10px;
}

.shiki{background:#1976d2;}
.niiza{background:#2e7d32;}
.asaka{background:#ef6c00;}
.wako{background:#6a1b9a;}

.cityTitle{
font-size:26px;
font-weight:900;
margin-bottom:10px;
}

.linkBtn{
display:block;
background:#1976d2;
color:white;
text-align:center;
padding:18px;
border-radius:20px;
text-decoration:none;
font-weight:900;
}

.shareBox{
background:#f8fbff;
border:3px solid #d7e6ff;
border-radius:24px;
padding:16px;
margin-top:18px;
}

.shareGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.shareBtn{
display:block;
padding:16px;
border-radius:18px;
text-align:center;
color:white;
text-decoration:none;
font-weight:900;
}

.line{background:#06c755;}
.x{background:#111;}
.fb{background:#1877f2;}
.copy{background:#555;}

.archiveBtn{
width:100%;
background:#777;
color:white;
border:none;
border-radius:26px;
padding:24px;
font-size:28px;
font-weight:900;
margin-top:18px;
}

.archiveArea{display:none;}

.empty{
background:#f5f7fa;
border-radius:24px;
padding:24px;
text-align:center;
font-size:26px;
font-weight:900;
}

</style>

</head>

<body>

<div class="wrap">

<div class="header">
<h1 class="title">4市の瓦版</h1>
<div class="sub">志木・新座・朝霞・和光の情報</div>
</div>

<a class="topBtn" href="index.html">戻る</a>

<button class="reloadBtn" onclick="loadData()">更新</button>

<div class="status" id="status">読み込み中...</div>

<div id="latest"></div>

<button class="archiveBtn" onclick="toggleArchive()">アーカイブ</button>

<div class="archiveArea" id="archive"></div>

</div>

<script>

const SHEET_ID = "149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc";
const SHEET_NAME = "NSAW暮らし情報局_データ";

function getCell(row,i){
return row?.c?.[i]?.v || "";
}

function buildCard(item){

return `
<div class="card">

${item.date ? `<div class="date">${item.date}</div>` : ""}

<div class="cardTitle">${item.title}</div>

${item.image ? `<img class="cardImg" src="${item.image}">` : ""}

<div class="detail">${item.detail}</div>

<div class="cityBox">
<div class="cityBadge shiki">志木</div>
<div class="cityTitle">${item.s_title}</div>
<a class="linkBtn" href="${item.s_url}">見る</a>
</div>

<div class="cityBox">
<div class="cityBadge niiza">新座</div>
<div class="cityTitle">${item.n_title}</div>
<a class="linkBtn" href="${item.n_url}">見る</a>
</div>

<div class="cityBox">
<div class="cityBadge asaka">朝霞</div>
<div class="cityTitle">${item.a_title}</div>
<a class="linkBtn" href="${item.a_url}">見る</a>
</div>

<div class="cityBox">
<div class="cityBadge wako">和光</div>
<div class="cityTitle">${item.w_title}</div>
<a class="linkBtn" href="${item.w_url}">見る</a>
</div>

<div class="shareBox">
<div class="shareGrid">
<a class="shareBtn line" href="#">LINE</a>
<a class="shareBtn x" href="#">X</a>
<a class="shareBtn fb" href="#">FB</a>
<button class="shareBtn copy">COPY</button>
</div>
</div>

</div>
`;
}

async function loadData(){

const url =
"https://docs.google.com/spreadsheets/d/"+SHEET_ID+
"/gviz/tq?sheet="+encodeURIComponent(SHEET_NAME)+
"&tqx=out:json";

const res = await fetch(url);
const text = await res.text();

const json = JSON.parse(text.substring(47).slice(0,-2));

const rows = json.table.rows;

let html = "";

rows.forEach(r=>{
html += buildCard({
date:getCell(r,0),
title:getCell(r,1),
image:getCell(r,2),
detail:getCell(r,3),
s_title:getCell(r,4),
s_url:getCell(r,5),
n_title:getCell(r,6),
n_url:getCell(r,7),
a_title:getCell(r,8),
a_url:getCell(r,9),
w_title:getCell(r,10),
w_url:getCell(r,11)
});
});

document.getElementById("latest").innerHTML = html;
document.getElementById("status").innerText = "完了";

}

function toggleArchive(){
const a = document.getElementById("archive");
a.style.display = a.style.display==="block"?"none":"block";
}

loadData();

</script>

</body>
</html>
