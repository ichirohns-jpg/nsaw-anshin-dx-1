<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>本人ページ｜見守りDX</title>

<link rel="icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
background:linear-gradient(180deg,#000000 0%,#08111d 50%,#000000 100%);
color:#ffffff;
min-height:100vh;
}

.wrap{
max-width:760px;
margin:auto;
padding:16px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:20px;
margin-bottom:16px;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
margin-bottom:10px;
}

.name{
font-size:28px;
font-weight:900;
text-align:center;
margin-bottom:10px;
}

.status{
font-size:48px;
font-weight:900;
text-align:center;
color:#00d4ff;
margin:10px 0;
}

.time{
text-align:center;
opacity:.8;
margin-bottom:10px;
}

button{
width:100%;
border:none;
cursor:pointer;
color:#fff;
font-weight:900;
padding:22px;
border-radius:20px;
font-size:24px;
margin-bottom:12px;
}

.genki-btn{
background:linear-gradient(135deg,#00c853,#00e676);
}

.medicine-btn{
background:linear-gradient(135deg,#1565c0,#42a5f5);
}

.schedule-btn{
background:linear-gradient(135deg,#7b1fa2,#ab47bc);
}

.map-btn{
background:linear-gradient(135deg,#455a64,#607d8b);
}

.emg-btn{
background:linear-gradient(135deg,#c62828,#ef5350);
}

.home-btn{
background:linear-gradient(135deg,#37474f,#607d8b);
}

.msg{
text-align:center;
font-size:20px;
font-weight:900;
margin-top:10px;
min-height:30px;
}

.footer{
text-align:center;
padding:20px;
opacity:.6;
font-size:12px;
}

</style>

</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
😊 本人ページ
</div>

<div
id="userName"
class="name">
読み込み中...
</div>

<div
id="currentStatus"
class="status">
元気です
</div>

<div
id="currentTime"
class="time">
-
</div>

</div>

<div class="card">

<button
class="genki-btn"
onclick="sendStatus('元気です')">
😊 元気です
</button>

<button
class="medicine-btn"
onclick="location.href='medicine.html?id='+USER_ID">
💊 服薬確認
</button>

<button
class="schedule-btn"
onclick="location.href='schedule-edit.html?id='+USER_ID">
📝 予定登録
</button>

<button
class="schedule-btn"
onclick="location.href='schedule.html?id='+USER_ID">
📅 予定一覧
</button>

<button
class="map-btn"
onclick="location.href='map.html?id='+USER_ID">
📍 現在地送信
</button>

<button
class="schedule-btn"
onclick="location.href='family.html?id='+USER_ID">
👪 家族確認
</button>

<button
class="schedule-btn"
onclick="location.href='qr.html?id='+USER_ID">
📱 QRコード
</button>

<button
class="emg-btn"
onclick="location.href='emergency.html?id='+USER_ID">
🚨 緊急連絡
</button>

<button
class="home-btn"
onclick="location.href='index.html'">
🏠 ホームへ戻る
</button>

<div
id="msg"
class="msg">
</div>

</div>

<div class="footer">
NSAW 見守りDX
</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

const params =
new URLSearchParams(location.search);

const USER_ID =
params.get("id") || "";

async function loadUser(){

try{

const response =
await fetch(
GAS_URL +
"?action=user&id=" +
encodeURIComponent(USER_ID)
);

const json =
await response.json();

const user =
json.data || {};

document.getElementById("userName").innerHTML =
user.name || "利用者";

}catch(error){

document.getElementById("userName").innerHTML =
"利用者";

}

}

async function sendStatus(status){

document.getElementById("msg").innerHTML =
"送信中...";

const body =
new URLSearchParams();

body.append("action","watch");
body.append("id",USER_ID);
body.append("status",status);
body.append("memo","");

try{

await fetch(
GAS_URL,
{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:body.toString()
}
);

document.getElementById("currentStatus").innerHTML =
status;

document.getElementById("currentTime").innerHTML =
new Date().toLocaleString("ja-JP");

document.getElementById("msg").innerHTML =
"送信完了";

}catch(error){

document.getElementById("msg").innerHTML =
"通信エラー";

}

}

loadUser();

</script>

</body>
</html>
