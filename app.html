<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>本人ページ</title>

<link rel="icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
background:linear-gradient(180deg,#000000 0%,#08111d 50%,#000000 100%);
color:#fff;
min-height:100vh;
}

.wrap{
max-width:800px;
margin:auto;
padding:16px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:20px;
margin-bottom:16px;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.name{
font-size:34px;
font-weight:900;
text-align:center;
margin-bottom:10px;
}

.time{
font-size:18px;
text-align:center;
opacity:.8;
margin-bottom:20px;
}

button{
width:100%;
border:none;
cursor:pointer;
color:#fff;
font-weight:900;
padding:28px;
border-radius:24px;
font-size:28px;
margin-bottom:14px;
}

.ok-btn{
background:linear-gradient(135deg,#00c853,#00e676);
}

.medicine-btn{
background:linear-gradient(135deg,#1565c0,#42a5f5);
}

.schedule-btn{
background:linear-gradient(135deg,#8e24aa,#ba68c8);
}

.gomi-btn{
background:linear-gradient(135deg,#455a64,#78909c);
}

.map-btn{
background:linear-gradient(135deg,#00897b,#26a69a);
}

.emg-btn{
background:linear-gradient(135deg,#c62828,#ef5350);
}

.info{
font-size:22px;
font-weight:900;
text-align:center;
line-height:1.8;
}

</style>

</head>

<body>

<div class="wrap">

<div class="card">

<div
id="userName"
class="name">
読み込み中...
</div>

<div
id="nowTime"
class="time">
--
</div>

</div>

<div class="card">

<button
class="ok-btn"
onclick="sendStatus('😊 元気です')">
😊 元気です
</button>

<button
class="medicine-btn"
onclick="location.href='medicine.html?id='+USER_ID">
💊 薬を飲みました
</button>

<button
class="schedule-btn"
onclick="location.href='schedule.html?id='+USER_ID">
📅 今日の予定
</button>

<button
class="gomi-btn"
onclick="location.href='gomi.html?id='+USER_ID">
🚮 今日のゴミ
</button>

<button
class="map-btn"
onclick="sendLocation()">
📍 現在地送信
</button>

<button
class="emg-btn"
onclick="location.href='emergency.html?id='+USER_ID">
🆘 緊急
</button>

</div>

<div class="card">

<div
id="todayInfo"
class="info">
読み込み中...
</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

const USER_ID =
new URLSearchParams(
location.search
).get("id") || "";

async function loadUser(){

try{

const response =
await fetch(
GAS_URL +
"?action=user&id=" +
encodeURIComponent(USER_ID)
);

const json =
await response.json();

const user =
json.data || {};

document.getElementById(
"userName"
).innerHTML =
user.name || "利用者";

}catch(error){

document.getElementById(
"userName"
).innerHTML =
"取得エラー";

}

}

async function sendStatus(status){

try{

const body =
new URLSearchParams();

body.append(
"action",
"watch"
);

body.append(
"id",
USER_ID
);

body.append(
"status",
status
);

const response =
await fetch(
GAS_URL,
{
method:"POST",
headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},
body:body.toString()
}
);

const json =
await response.json();

if(json.status==="OK"){

alert(
status + " を送信しました"
);

}

}catch(error){

alert(
"送信エラー"
);

}

}

function sendLocation(){

if(!navigator.geolocation){

alert(
"位置情報が使えません"
);

return;

}

navigator.geolocation.getCurrentPosition(

async function(position){

try{

const body =
new URLSearchParams();

body.append(
"action",
"watch"
);

body.append(
"id",
USER_ID
);

body.append(
"status",
"📍位置情報送信"
);

body.append(
"lat",
position.coords.latitude
);

body.append(
"lng",
position.coords.longitude
);

await fetch(
GAS_URL,
{
method:"POST",
headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},
body:body.toString()
}
);

alert(
"位置情報を送信しました"
);

}catch(error){

alert(
"送信失敗"
);

}

}

);

}

function updateClock(){

const now =
new Date();

document.getElementById(
"nowTime"
).innerHTML =
now.toLocaleString(
"ja-JP"
);

}

function loadTodayInfo(){

document.getElementById(
"todayInfo"
).innerHTML =
`
📅 今日も元気に過ごしましょう
<br><br>
💊 お薬の飲み忘れに注意
`;
}

loadUser();
loadTodayInfo();
updateClock();

setInterval(
updateClock,
1000
);

</script>

</body>
</html>
