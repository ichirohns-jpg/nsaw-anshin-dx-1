<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:auto;
}

body{
  margin:0;
  padding:12px;
  background:#eef4f8;
  font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  color:#123;
}

.wrap{
  max-width:720px;
  margin:0 auto;
}

.topImageBox{
  width:100%;
  background:white;
  border-radius:30px;
  padding:10px;
  margin-bottom:18px;
  box-shadow:0 8px 22px rgba(0,0,0,.10);
}

.topImage{
  display:block;
  width:100%;
  height:auto;
  border-radius:22px;
}

.header{
  background:#1565c0;
  color:white;
  border-radius:30px;
  padding:24px 18px;
  text-align:center;
  margin-bottom:18px;
  box-shadow:0 8px 22px rgba(0,0,0,.12);
}

.title{
  font-size:38px;
  font-weight:900;
  line-height:1.35;
  margin:0;
}

.sub{
  font-size:22px;
  font-weight:900;
  line-height:1.6;
  margin-top:10px;
}

.card{
  background:white;
  border-radius:28px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 8px 22px rgba(0,0,0,.08);
}

.sectionTitle{
  font-size:30px;
  font-weight:900;
  color:#1565c0;
  margin:0 0 14px;
  text-align:center;
}

.mainBtn{
  display:block;
  width:100%;
  text-align:center;
  text-decoration:none;
  border:none;
  border-radius:30px;
  padding:30px 12px;
  font-size:30px;
  font-weight:900;
  color:white;
  margin-bottom:16px;
  cursor:pointer;
}

.green{background:#2e7d32}
.blue{background:#1976d2}
.orange{background:#ef6c00}
.red{background:#c62828}
.purple{background:#6a1b9a}
.gray{background:#555}
.brown{background:#795548}
.teal{background:#00897b}
.indigo{background:#3949ab}

.note{
  background:#fff8e1;
  border-radius:24px;
  padding:18px;
  font-size:23px;
  font-weight:900;
  line-height:1.6;
  color:#444;
  text-align:center;
  white-space:pre-wrap;
}

@media(max-width:600px){
  .title{
    font-size:32px;
  }

  .sub{
    font-size:20px;
  }

  .sectionTitle{
    font-size:27px;
  }

  .mainBtn{
    font-size:27px;
    padding:28px 10px;
  }

  .note{
    font-size:21px;
  }
}

</head>

<body>

<div class="wrap">

  <div class="topImageBox">
    <img
      class="topImage"
      src="https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/top-banner.jpg?v=allmenu1"
      alt="あんしん生活DX">
  </div>

  <div class="header">
    <h1 class="title">
      あんしん生活DX
    </h1>
    <div class="sub">
      話して登録<br>
      大きな文字で確認
    </div>
  </div>

  <div class="card">
    <div class="sectionTitle">
      登録
    </div>

    <button class="mainBtn indigo" onclick="notReady('本人登録')">
      📝 本人登録
    </button>
  </div>

  <div class="card">
    <div class="sectionTitle">
      予定
    </div>

    <a class="mainBtn green" href="voice.html?v=backvoice1">
      🎤 予定を入れる
    </a>

    <a class="mainBtn blue" href="today.html?v=backtoday1">
      📅 今日の予定を見る
    </a>
  </div>

  <div class="card">
    <div class="sectionTitle">
      見守り
    </div>

    <button class="mainBtn green" onclick="sendQuick('元気です')">
      😊 元気です
    </button>

    <button class="mainBtn orange" onclick="sendQuick('少し困っています')">
      ⚠️ 少し困っています
    </button>

    <button class="mainBtn red" onclick="sendQuick('助けてください')">
      🚨 助けてください
    </button>
  </div>

  <div class="card">
    <div class="sectionTitle">
      薬の確認
    </div>

    <button class="mainBtn purple" onclick="sendQuick('朝の薬を飲みました')">
      💊 朝の薬を飲んだ
    </button>

    <button class="mainBtn purple" onclick="sendQuick('昼の薬を飲みました')">
      💊 昼の薬を飲んだ
    </button>

    <button class="mainBtn purple" onclick="sendQuick('夜の薬を飲みました')">
      💊 夜の薬を飲んだ
    </button>
  </div>

  <div class="card">
    <div class="sectionTitle">
      生活情報
    </div>

    <button class="mainBtn brown" onclick="notReady('ゴミ情報')">
      🗑 ゴミ情報
    </button>

    <button class="mainBtn teal" onclick="notReady('4市の情報')">
      📰 4市の情報
    </button>

    <button class="mainBtn indigo" onclick="notReady('お楽しみ動画')">
      🎥 お楽しみ動画
    </button>
  </div>

  <div class="card">
    <div class="sectionTitle">
      つながる
    </div>

    <a class="mainBtn gray" href="connect.html?v=safephone2">
      ☎️ 人につなぐ
    </a>

    <button class="mainBtn blue" onclick="notReady('見守り者画面')">
      👀 見守り者画面
    </button>
  </div>

  <div class="card">
    <div class="note" id="noteBox">
      迷ったら「人につなぐ」を押してください
    </div>
  </div>

</div>

<script>
const GAS_URL =
'https://script.google.com/macros/s/AKfycbw4YiYDnGsBAliOBrOp8m7hAWuLI-reu4J2vXKcVnERsU95uvgRS9a8avVhwvpALp3I/exec';

let sending = false;

function stopAllSpeech(){
  try{
    if(window.speechSynthesis){
      window.speechSynthesis.cancel();
    }
  }catch(e){}
}

window.addEventListener("load",function(){
  stopAllSpeech();
  window.scrollTo(0,0);
});

window.addEventListener("pageshow",function(){
  stopAllSpeech();
  window.scrollTo(0,0);
});

function notReady(name){
  const noteBox = document.getElementById("noteBox");
  noteBox.innerText = name + " は次に作ります";
}

async function sendQuick(text){

  stopAllSpeech();

  if(sending){
    return;
  }

  sending = true;

  const noteBox = document.getElementById("noteBox");
  noteBox.innerText = "記録中...\n" + text;

  try{

    const url =
      GAS_URL +
      '?mode=voice&text=' +
      encodeURIComponent(text) +
      '&t=' +
      Date.now();

    const response = await fetch(url);
    const data = await response.json();

    console.log(data);

    if(data.ok === true || data.status === "success"){
      noteBox.innerText = "記録しました\n" + text;
    }else{
      noteBox.innerText = "記録できませんでした\n" + text;
      alert(data.error || data.message || "記録に失敗しました");
    }

  }catch(error){

    console.error(error);
    noteBox.innerText = "通信エラー\n" + text;
    alert("通信エラーです");

  }finally{

    sending = false;

  }

}
</script>

</body>
