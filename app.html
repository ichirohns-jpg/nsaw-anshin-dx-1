<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>見守り確認</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

header{
background:#009688;
color:#fff;
padding:30px 18px;
text-align:center;
font-size:38px;
font-weight:900;
line-height:1.35;
}

.wrap{
max-width:760px;
margin:0 auto;
padding:18px 14px 44px;
}

.card{
background:#fff;
border-radius:28px;
padding:24px 20px;
margin-bottom:22px;
box-shadow:0 8px 22px rgba(0,0,0,.14);
}

.title{
font-size:34px;
font-weight:900;
line-height:1.45;
margin-bottom:10px;
}

.text{
font-size:24px;
line-height:1.8;
font-weight:800;
color:#334e68;
white-space:pre-wrap;
}

.btn{
display:block;
width:100%;
border:0;
padding:30px 18px;
margin:18px 0;
border-radius:24px;
font-size:31px;
font-weight:900;
text-align:center;
color:#fff;
box-shadow:0 6px 16px rgba(0,0,0,.18);
text-decoration:none;
}

.home{background:#607d8b}

.result{
display:none;
background:#fff;
border-radius:28px;
padding:24px 20px;
margin-top:22px;
box-shadow:0 8px 22px rgba(0,0,0,.14);
font-size:26px;
font-weight:900;
line-height:1.7;
}

@media(max-width:700px){
header{font-size:34px;padding:26px 14px}
.title{font-size:31px}
.text{font-size:22px}
.btn{font-size:28px}
.result{font-size:23px}
}
</style>
</head>

<body>

<header>
見守り確認
</header>

<div class="wrap">

<div class="card">
<div class="title">
確認内容
</div>

<div class="text">
本人が押した内容を記録します。
</div>
</div>

<div id="result" class="result"></div>

<a class="btn home" href="person.html?id=A001">
🏠 本人ページへ戻る
</a>

<a class="btn home" href="index.html">
🏠 トップへ戻る
</a>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbxsgeub9qA9q5EnfZgOEVah2H5YC9dEy_n2UqMkviD8Wy5IcVsL-CsMmNE0ZvDMbGFd/exec";

const params =
new URLSearchParams(location.search);

const status =
params.get("status");

const userId =
params.get("id") || "A001";

let text = "";

if(status==="genki"){
text="😊 元気です";
}

if(status==="komari"){
text="⚠️ 少し困っています";
}

if(status==="help"){
text="🚨 助けてください";
}

if(status==="kusuri"){
text="💊 薬を飲みました";
}

const result =
document.getElementById("result");

if(!text){

result.style.display =
"block";

result.innerHTML =
"記録する内容がありません。<br><br>本人ページからボタンを押してください。";

} else {

const now =
new Date();

result.style.display =
"block";

result.innerHTML =
text +
"<br><br>" +
now.toLocaleString("ja-JP") +
"<br><br>送信中...";

fetch(
GAS_URL,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
id:userId,
status:text,
datetime:now.toISOString()
})
}
)
.then(response=>response.text())
.then(data=>{

result.innerHTML =
text +
"<br><br>" +
now.toLocaleString("ja-JP") +
"<br><br>記録しました。";

})
.catch(error=>{

result.innerHTML =
text +
"<br><br>" +
now.toLocaleString("ja-JP") +
"<br><br>送信エラー";

console.error(error);

});

}

</script>

</body>
</html>
