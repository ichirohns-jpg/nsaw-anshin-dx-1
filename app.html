<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>あんしん生活DX</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:#eef4f8;
color:#123;
padding:16px;
}

.wrap{
max-width:760px;
margin:auto;
}

.card{
background:white;
border-radius:24px;
padding:20px;
margin-bottom:16px;
box-shadow:0 8px 22px rgba(0,0,0,.1);
}

.title{
font-size:28px;
font-weight:900;
margin-bottom:10px;
}

.text{
font-size:18px;
font-weight:700;
line-height:1.6;
white-space:pre-wrap;
}

img{
width:100%;
border-radius:18px;
margin-top:12px;
}
</style>

</head>

<body>

<div class="wrap">

<div id="app">読み込み中...</div>

</div>

<script>

async function loadApp(){

const id = new URLSearchParams(location.search).get("id");

const url = "https://script.google.com/macros/s/AKfycbxsgeub9qA9q5EnfZgOEVah2H5YC9dEy_n2UqMkviD8Wy5IcVsL-CsMmNE0ZvDMbGFd/exec";

try{

const res = await fetch(url);
const data = await res.json();

// ★ ここが修正ポイント（1件だけ）
const item = data.find(d => d.id == id) || data[0];

document.getElementById("app").innerHTML = `
<div class="card">
<div class="title">${item.title || ""}</div>

<div class="text">${item.text || ""}</div>

${item.image ? `<img src="${item.image}">` : ""}

</div>
`;

}catch(e){

document.getElementById("app").innerHTML =
"<div class='card'>読み込みエラー</div>";

}

}

loadApp();

</script>

</body>
</html>
