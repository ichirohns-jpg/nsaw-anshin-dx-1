<script>

const params =

const singleId =

const config =
MODE_CONFIG[mode] || MODE_CONFIG.today;

const pageTitle =
document.getElementById("pageTitle");

const pageSub =
document.getElementById("pageSub");

const header =
document.getElementById("header");

const statusBox =
document.getElementById("statusBox");

const latestList =
document.getElementById("latestList");

const archiveList =

const reloadBtn =
document.getElementById("reloadBtn");

const archiveBtn =
document.getElementById("archiveBtn");

const archiveCard =

const archiveButtonCard =
document.getElementById("archiveButtonCard");

document.getElementById("latestTitle");

let allItems = [];
let archiveOpen = false;

function stopAllSpeech(){
  try{
    if(window.speechSynthesis){
      window.speechSynthesis.cancel();
    }
  }catch(e){}
}

window.addEventListener("load",function(){
  stopAllSpeech();
  window.scrollTo(0,0);
  setupPage();
  loadSheet();
});

window.addEventListener("pageshow",function(){
  stopAllSpeech();
  window.scrollTo(0,0);
});

function setupPage(){
  pageTitle.innerText = config.title;
  pageSub.innerText = config.sub;
  latestTitle.innerText = config.latestTitle || "最新";
  header.classList.add(config.headerClass);
  document.title = config.title + "｜あんしん生活DX";
}

function escapeHtml(str){
  return String(str || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function getCell(row,index){
  if(!row || !row.c || !row.c[index]){
    return "";
  }

  const cell = row.c[index];

  if(cell.f !== undefined && cell.f !== null){
    return String(cell.f);
  }

  if(cell.v !== undefined && cell.v !== null){
    return String(cell.v);
  }

  return "";
}

function normalizeHeader(str){
  return String(str || "")
    .replace(/\s/g,"")
    .trim();
}

function findValue(obj,names){
  for(let i=0;i<names.length;i++){
    const key = names[i];
    if(obj[key]){
      return obj[key];
    }
  }
  return "";
}

function parseRows(table){

  const labels =
  (table.cols || []).map(function(col,index){
    return normalizeHeader(col.label || col.id || ("列" + (index + 1)));
  });

  const rows =
  table.rows || [];

  const parsed = [];

  rows.forEach(function(row,rowIndex){

    const obj = {};

    labels.forEach(function(label,index){
      obj[label] = getCell(row,index);
      obj["列" + (index + 1)] = getCell(row,index);
    });

    parsed.push({
      rowIndex:rowIndex,
      obj:obj
    });

  });

  return parsed;

}

function getDisplayFlag(obj){

  const display =
  findValue(obj,[
    "表示","表示する","公開","表示可否","S列","列19"
  ]);

  return String(display || "").trim();

}

function isVisible(obj){

  const display =
  getDisplayFlag(obj);

  if(!display){
    return true;
  }

  return (
    display === "はい" ||
    display === "表示" ||
    display === "公開" ||
    display === "TRUE" ||
    display === "true"
  );

}

function parseNormalItems(parsed){

  const items = [];

  parsed.forEach(function(entry){

    const obj =
    entry.obj;

    if(!isVisible(obj)){
      return;
    }

    const date =
      findValue(obj,[
        "日付","日時","登録日時","投稿日","表示日","開催日","配信日","並び替え日付","T列","列20","列1"
      ]);

    const title =
      findValue(obj,[
        "タイトル","件名","見出し","名称","情報タイトル","動画タイトル","B列","P列","列2","列16"
      ]);

    const detail =
      findValue(obj,[
        "説明文","詳細","説明","本文","詳細内容","わかりやすい詳細","内容詳細","動画詳細","E列","Q列","列5","列17"
      ]);

    const image =
      findValue(obj,[
        "画像URL","画像","サムネイル","画像リンク","メディアURL","D列","R列","列4","列18"
      ]);

    const url =
      findValue(obj,[
        "詳しく見るURL","URL","リンク","市ホームページURL","申込みURL","情報1URL","G列","列7","列5","列6"
      ]);

    const youtube =
      findValue(obj,[
        "YouTubeURL","YouTube","動画URL","埋め込みメディアURL","メディアURL","動画","D列","R列","列4","列18","G列","列7"
      ]);

    const sortValue =
      findValue(obj,[
        "並び替え","並び替え数値","並び替え日付","表示順","ソート","T列","U列","列20","列21"
      ]);

    const rawText =
      Object.keys(obj).map(function(k){
        return obj[k];
      }).join(" ");

    if(!title && !detail && !url && !youtube && !image){
      return;
    }

    items.push({
      id:entry.rowIndex + 1,
      date:date,
      title:title || detail || "お知らせ",
      detail:detail,
      image:image,
      url:url,
      youtube:youtube || extractYoutubeUrl(rawText),
      sortValue:sortValue,
      rawText:rawText
    });

  });

  return items;

}

function parseVideoItems(parsed){

  const items = [];

  parsed.forEach(function(entry){

    const obj =
    entry.obj;

    if(!isVisible(obj)){
      return;
    }

    const date =
      findValue(obj,[
        "日付","配信日","投稿日","A列","列1"
      ]);

    const title =
      findValue(obj,[
        "動画タイトル","タイトル","B列","列2"
      ]);

    const detail =
      findValue(obj,[
        "動画説明","動画詳細","説明","C列","列3"
      ]);

    const youtube =
      findValue(obj,[
        "YouTubeURL","YouTubeURL","YouTube","動画URL","メディアURL","D列","列4"
      ]);

    const image =
      findValue(obj,[
        "画像URL","サムネイル","E列","列5"
      ]);

    const sortValue =
      findValue(obj,[
        "並び替え日付","表示順","G列","H列","列7","列8"
      ]);

    const rawText =
      Object.keys(obj).map(function(k){
        return obj[k];
      }).join(" ");

    if(!title && !detail && !youtube){
      return;
    }

    items.push({
      id:entry.rowIndex + 1,
      date:date,
      title:title || "お楽しみ動画",
      detail:detail,
      image:image,
      url:"",
      youtube:youtube || extractYoutubeUrl(rawText),
      sortValue:sortValue,
      rawText:rawText
    });

  });

  return items;

}

function parseCityItems(parsed){

  const items = [];

  parsed.forEach(function(entry){

    const obj =
    entry.obj;

    if(!isVisible(obj)){
      return;
    }

    const date =
      findValue(obj,[
        "日付","日時","表示日","投稿日","並び替え日付","T列","列20","列1"
      ]);

    const title =
      findValue(obj,[
        "タイトル","件名","見出し","地域情報タイトル","情報タイトル","B列","列2"
      ]) || "今日の4市情報";

    const image =
      findValue(obj,[
        "画像URL","画像","サムネイル","メディアURL","D列","R列","列4","列18"
      ]);

    const detail =
      findValue(obj,[
        "説明文","詳細","本文","E列","列5"
      ]);

    const sortValue =
      findValue(obj,[
        "並び替え日付","表示順","T列","U列","列20","列21"
      ]);

    const cityLinks = [];

    for(let i=1;i<=4;i++){

      const cityTitle =
        findValue(obj,[
          "情報" + i + "タイトル",
          "情報" + i + "タイトル",
          "列" + (5 + (i * 2 - 1))
        ]);

      const cityUrl =
        findValue(obj,[
          "情報" + i + "URL",
          "情報" + i + "ＵＲＬ",
          "列" + (5 + (i * 2))
        ]);

      if(cityTitle || cityUrl){
        cityLinks.push({
          number:i,
          title:cityTitle || ("情報" + i),
          url:cityUrl
        });
      }

    }

    if(!title && !detail && !image && cityLinks.length === 0){
      return;
    }

    items.push({
      id:entry.rowIndex + 1,
      date:date,
      title:title,
      detail:detail,
      image:image,
      cityLinks:cityLinks,
      sortValue:sortValue,
      rawText:Object.keys(obj).map(function(k){return obj[k];}).join(" ")
    });

  });

  return items;

}

function extractYoutubeUrl(text){
  const m = String(text || "").match(/https?:\/\/[^\s　"]*(youtube\.com|youtu\.be)[^\s　"]*/i);
  return m ? m[0] : "";
}

function extractYoutubeId(url){

  url = String(url || "");

  let m = url.match(/[?&]v=([^&]+)/);
  if(m) return m[1];

  m = url.match(/youtu\.be\/([^?&]+)/);
  if(m) return m[1];

  m = url.match(/\/shorts\/([^?&/]+)/);
  if(m) return m[1];

  m = url.match(/\/embed\/([^?&/]+)/);
  if(m) return m[1];

  return "";
}

function looksLikeImage(url){
  return String(url || "").match(/\.(jpg|jpeg|png|webp|gif)(\?|$)/i);
}

function filterByMode(items){

  if(!config.keywords || config.keywords.length === 0){
    return items;
  }

  const filtered =
  items.filter(function(item){

    const text =
    String(item.rawText || "").toLowerCase();

    return config.keywords.some(function(keyword){
      return text.indexOf(String(keyword).toLowerCase()) >= 0;
    });

  });

  if(filtered.length === 0){
    return items;
  }

  return filtered;

}

function sortItems(items){

  return items.sort(function(a,b){

    const aa =
    String(a.sortValue || a.date || "").trim();

    const bb =
    String(b.sortValue || b.date || "").trim();

    return bb.localeCompare(aa,"ja");

  });

}

function getItemUrl(item){

  return location.origin +
    location.pathname +
    "?mode=" +
    encodeURIComponent(mode) +
    "&id=" +
    encodeURIComponent(item.id);

}

function getShareUrl(item){

  if(mode === "today" && String(item.id) === "1"){
    return location.origin +
      location.pathname.replace(/app\.html$/,"share-001.html");
  }

  return getItemUrl(item);

}

function getShareText(item){

  return config.title + "｜" + (item.title || "お知らせ");

}

function buildShareBox(item){

  const shareUrl =
  item.shareUrl || getShareUrl(item);

  const text =
  item.shareText || getShareText(item);

  const encodedUrl =
  encodeURIComponent(shareUrl);

  const encodedText =
  encodeURIComponent(text);

  const lineUrl =
  "https://social-plugins.line.me/lineit/share?url=" + encodedUrl;

  const xUrl =
  "https://twitter.com/intent/tweet?text=" + encodedText + "&url=" + encodedUrl;

  const facebookUrl =
  "https://www.facebook.com/sharer/sharer.php?u=" + encodedUrl;

  return `
    <div class="shareBox">
      <div class="shareTitle">
        共有する
      </div>

      <div class="shareGrid">
        <a class="shareBtn lineBtn" href="${escapeHtml(lineUrl)}" target="_blank" rel="noopener">
          LINE
        </a>

        <a class="shareBtn xBtn" href="${escapeHtml(xUrl)}" target="_blank" rel="noopener">
          X
        </a>

        <a class="shareBtn facebookBtn" href="${escapeHtml(facebookUrl)}" target="_blank" rel="noopener">
          Facebook
        </a>

        <button class="shareBtn copyBtn" data-url="${escapeHtml(shareUrl)}" onclick="copyFromButton(this)">
          URLコピー
        </button>
      </div>
    </div>
  `;

}

function cityClass(number){
  if(number === 1) return "shiki";
  if(number === 2) return "niiza";
  if(number === 3) return "asaka";
  if(number === 4) return "wako";
  return "otherCity";
}

function cityName(number){
  if(number === 1) return "志木市";
  if(number === 2) return "新座市";
  if(number === 3) return "朝霞市";
  if(number === 4) return "和光市";
  return "情報";
}

function buildNormalItem(item){

  const youtubeId =
  extractYoutubeId(item.youtube);

  let html = `
    <div class="item">
      ${
        item.date
        ? `<div class="itemDate">${escapeHtml(item.date)}</div>`
        : ""
      }

      <div class="itemTitle">
        ${escapeHtml(item.title)}
      </div>
  `;

  if(item.image && looksLikeImage(item.image)){
    html += `
      <img class="itemImg" src="${escapeHtml(item.image)}" alt="">
    `;
  }

  if(youtubeId){
    html += `
      <div class="videoBox">
        <iframe
          src="https://www.youtube.com/embed/${escapeHtml(youtubeId)}"
          title="YouTube video"
          allowfullscreen>
        </iframe>
      </div>
    `;
  }

  if(item.detail && item.detail !== item.title){
    html += `
      <div class="itemDetail">
        ${escapeHtml(item.detail)}
      </div>
    `;
  }

  if(item.url){
    html += `
      <a class="linkBtn" href="${escapeHtml(item.url)}" target="_blank" rel="noopener">
        詳しく見る
      </a>
    `;
  }

  if(item.youtube && !youtubeId){
    html += `
      <a class="linkBtn" href="${escapeHtml(item.youtube)}" target="_blank" rel="noopener">
        動画を見る
      </a>
    `;
  }

  html += buildShareBox(item);

  html += `
    </div>
  `;

  return html;

}

function buildCityItem(item){

  let html = `
    <div class="item">
      ${
        item.date
        ? `<div class="itemDate">${escapeHtml(item.date)}</div>`
        : ""
      }

      <div class="itemTitle">
        ${escapeHtml(item.title || "今日の4市情報")}
      </div>
  `;

  if(item.image && looksLikeImage(item.image)){
    html += `
      <img class="itemImg" src="${escapeHtml(item.image)}" alt="">
    `;
  }

  if(item.detail){
    html += `
      <div class="itemDetail">
        ${escapeHtml(item.detail)}
      </div>
    `;
  }

  html += `<div class="cityLinks">`;

  if(item.cityLinks && item.cityLinks.length > 0){

    item.cityLinks.forEach(function(info){

      html += `
        <div class="cityBox">
          <div class="cityBadge ${cityClass(info.number)}">
            ${escapeHtml(cityName(info.number))}
          </div>

          <div class="cityTitle">
            ${escapeHtml(info.title)}
          </div>

          ${
            info.url
            ? `<a class="linkBtn" href="${escapeHtml(info.url)}" target="_blank" rel="noopener">記事を見る</a>`
            : ""
          }
        </div>
      `;

    });

  }else{

    html += `
      <div class="empty">
        4市の記事リンクがありません
      </div>
    `;

  }

  html += `</div>`;

  html += buildShareBox(item);

  html += `
    </div>
  `;

  return html;

}

function buildItem(item){

  if(config.type === "city"){
    return buildCityItem(item);
  }

  return buildNormalItem(item);

}

function render(items){

  if(singleId){
    const one =
    items.find(function(item){
      return String(item.id) === String(singleId);
    });

    if(one){
      latestList.innerHTML = buildItem(one);
      archiveList.innerHTML = "";
      archiveCard.style.display = "none";
      archiveBtn.style.display = "none";
      archiveButtonCard.style.display = "none";
      statusBox.innerText = "表示しました";
      return;
    }
  }

  if(!items || items.length === 0){
    latestList.innerHTML =
    '<div class="empty">まだ登録がありません</div>';
    archiveList.innerHTML =
    '<div class="empty">アーカイブはありません</div>';
    statusBox.innerText = "登録がありません";
    return;
  }

  const latest =
  items.slice(0,5);

  const archive =
  items.slice(5);

  latestList.innerHTML =
  latest.map(buildItem).join("");

  if(archive.length > 0){
    archiveList.innerHTML =
    archive.map(buildItem).join("");
    archiveBtn.style.display = "block";
    archiveButtonCard.style.display = "block";
  }else{
    archiveList.innerHTML =
    '<div class="empty">アーカイブはありません</div>';
    archiveBtn.style.display = "none";
    archiveButtonCard.style.display = "none";
  }

  statusBox.innerText =
  "読み込みました";

}

function loadSheet(){

  statusBox.innerText =
  "読み込み中...";

  latestList.innerHTML =
  '<div class="empty">読み込み中...</div>';

  archiveList.innerHTML =
  '<div class="empty">読み込み中...</div>';

  const old =
  document.getElementById("jsonpLoader");

  if(old){
    old.remove();
  }

  const script =
  document.createElement("script");

  script.id =
  "jsonpLoader";

  const sheetName =
  encodeURIComponent(config.sheet);

  script.src =
  "https://docs.google.com/spreadsheets/d/" +
  SHEET_ID +
  "/gviz/tq?sheet=" +
  sheetName +
  "&tqx=out:json;responseHandler:handleSheet" +
  "&t=" +
  Date.now();

  script.onerror =
  function(){
    statusBox.innerText =
    "読み込み失敗";
    latestList.innerHTML =
    '<div class="error">Googleシートを読み込めませんでした</div>';
  };

  document.body.appendChild(script);

}

window.handleSheet = function(json){

  try{

    const table =
    json.table || {};

    const parsed =
    parseRows(table);

    let items;

    if(config.type === "city"){
      items = parseCityItems(parsed);
    }else if(config.type === "video"){
      items = parseVideoItems(parsed);
    }else{
      items = parseNormalItems(parsed);
    }

    items =
    filterByMode(items);

    items =
    sortItems(items);

    allItems =
    items;

    render(items);

  }catch(error){

    console.error(error);

    statusBox.innerText =
    "表示エラー";

    latestList.innerHTML =
    `<div class="error">${escapeHtml(error.message || String(error))}</div>`;

  }

};

function copyFromButton(btn){
  const url = btn.getAttribute("data-url") || "";
  copyShareUrl(url);
}

function copyShareUrl(url){

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url)
      .then(function(){
        alert("URLをコピーしました");
      })
      .catch(function(){
        prompt("このURLをコピーしてください",url);
      });
  }else{
    prompt("このURLをコピーしてください",url);
  }

}

archiveBtn.onclick =
function(){

  archiveOpen =
  !archiveOpen;

  archiveCard.style.display =
  archiveOpen ? "block" : "none";

  archiveBtn.innerText =
  archiveOpen ? "📕 アーカイブを閉じる" : "📚 アーカイブを見る";

};

reloadBtn.onclick =
function(){
  loadSheet();
};
</script>

</body>
</html>
