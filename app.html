<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>見守り確認</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

header{
background:#009688;
color:#fff;
padding:30px 18px;
text-align:center;
font-size:38px;
font-weight:900;
line-height:1.35;
}

.wrap{
max-width:760px;
margin:0 auto;
padding:18px 14px 44px;
}

.card{
background:#fff;
border-radius:28px;
padding:24px 20px;
margin-bottom:22px;
box-shadow:0 8px 22px rgba(0,0,0,.14);
}

.title{
font-size:34px;
font-weight:900;
line-height:1.45;
margin-bottom:10px;
}

.text{
font-size:24px;
line-height:1.8;
font-weight:800;
color:#334e68;
white-space:pre-wrap;
}

.btn{
display:block;
width:100%;
border:0;
padding:30px 18px;
margin:18px 0;
border-radius:24px;
font-size:31px;
font-weight:900;
text-align:center;
color:#fff;
box-shadow:0 6px 16px rgba(0,0,0,.18);
text-decoration:none;
}

.genki{background:#43a047}
.komari{background:#fb8c00}
.help{background:#d32f2f}
.kusuri{background:#1976d2}
.home{background:#607d8b}

.result{
display:none;
background:#fff;
border-radius:28px;
padding:24px 20px;
margin-top:22px;
box-shadow:0 8px 22px rgba(0,0,0,.14);
font-size:26px;
font-weight:900;
line-height:1.7;
}

@media(max-width:700px){
header{font-size:34px;padding:26px 14px}
.title{font-size:31px}
.text{font-size:22px}
.btn{font-size:28px}
.result{font-size:23px}
}
</style>
</head>

<body>

<header>
見守り確認
</header>

<div class="wrap">

<div class="card">

<div class="title">
確認内容
</div>

<div class="text">
本人が押した内容を記録します。
</div>

</div>

<div id="result" class="result"></div>

<a class="btn home" href="person.html">
🏠 本人ページへ戻る
</a>

</div>

<script>

const params =
new URLSearchParams(location.search);

const status =
params.get("status");

let text = "";

if(status==="genki"){
text="😊 元気です";
}

if(status==="komari"){
text="⚠️ 少し困っています";
}

if(status==="help"){
text="🚨 助けてください";
}

if(status==="kusuri"){
text="💊 薬を飲みました";
}

if(text){

const now =
new Date();

const record =
text + " / " +
now.toLocaleString("ja-JP");

localStorage.setItem(
"lastStatus",
record
);

const result =
document.getElementById("result");

result.style.display =
"block";

result.innerHTML =
text +
"<br><br>" +
now.toLocaleString("ja-JP") +
"<br><br>記録しました。";

}

</script>

</body>
</html>
