<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>見守りDX</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
background:
linear-gradient(
180deg,
#050505 0%,
#101827 50%,
#000000 100%
);
font-family:
"Hiragino Sans",
"Yu Gothic",
sans-serif;
color:#fff;
min-height:100vh;
}

.wrap{
max-width:700px;
margin:auto;
padding:20px;
}

.header{
text-align:center;
padding:25px 10px;
}

.logo{
font-size:34px;
font-weight:900;
letter-spacing:3px;
}

.sub{
margin-top:8px;
opacity:.8;
font-size:14px;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.15);
border-radius:28px;
padding:24px;
margin-bottom:20px;
box-shadow:
0 10px 30px rgba(0,0,0,.4);
}

.status-box{
text-align:center;
}

.status-title{
font-size:18px;
opacity:.8;
margin-bottom:12px;
}

.status-value{
font-size:42px;
font-weight:900;
color:#00e0ff;
}

.time{
margin-top:10px;
font-size:15px;
opacity:.8;
}

input,
select,
textarea{
width:100%;
padding:18px;
margin-bottom:14px;
border:none;
border-radius:18px;
background:rgba(255,255,255,.12);
color:#fff;
font-size:18px;
}

textarea{
height:120px;
resize:none;
}

button{
width:100%;
border:none;
border-radius:22px;
padding:20px;
font-size:24px;
font-weight:900;
color:#fff;
cursor:pointer;
margin-bottom:14px;
}

.btn-genki{
background:
linear-gradient(
135deg,
#00c853,
#00e676
);
box-shadow:
0 0 25px rgba(0,230,118,.45);
}

.btn-attention{
background:
linear-gradient(
135deg,
#ff9800,
#ffc107
);
box-shadow:
0 0 25px rgba(255,193,7,.45);
}

.btn-emergency{
background:
linear-gradient(
135deg,
#d50000,
#ff1744
);
box-shadow:
0 0 25px rgba(255,23,68,.45);
}

.send-btn{
background:
linear-gradient(
135deg,
#0091ff,
#00d4ff
);
box-shadow:
0 0 25px rgba(0,212,255,.45);
}

.message{
text-align:center;
font-size:20px;
font-weight:900;
margin-top:10px;
}

.footer{
text-align:center;
opacity:.6;
font-size:13px;
padding:20px;
}

</style>
</head>

<body>

<div class="wrap">

<div class="header">
<div class="logo">見守りDX</div>
<div class="sub">LEXUS STYLE MONITORING SYSTEM</div>
</div>

<div class="card status-box">

<div class="status-title">
現在の状態
</div>

<div class="status-value" id="currentStatus">
元気
</div>

<div class="time" id="currentTime">
最終送信：未送信
</div>

</div>

<div class="card">

<input
id="name"
placeholder="お名前">

<select id="status">

<option value="元気">
元気
</option>

<option value="注意">
注意
</option>

<option value="緊急">
緊急
</option>

</select>

<textarea
id="memo"
placeholder="メモを入力してください"></textarea>

<button
class="btn-genki"
onclick="setStatus('元気')">
元気です
</button>

<button
class="btn-attention"
onclick="setStatus('注意')">
注意
</button>

<button
class="btn-emergency"
onclick="setStatus('緊急')">
緊急
</button>

<button
class="send-btn"
onclick="sendData()">
送信する
</button>

<div
id="msg"
class="message">
</div>

</div>

<div class="footer">
NSAW 見守りDX
</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbw_sD-jZkCHBI21dbhX3koHAw1Vye6goMcZg2xYBdKKMU_k6FqCQFYGC8b8B8s7oFmn/exec";

function setStatus(status){

document.getElementById("status").value =
status;

document.getElementById("currentStatus").innerText =
status;

}

async function sendData(){

const params =
new URLSearchParams();

params.append(
"name",
document.getElementById("name").value
);

params.append(
"status",
document.getElementById("status").value
);

params.append(
"memo",
document.getElementById("memo").value
);

try{

const response =
await fetch(
GAS_URL,
{
method:"POST",
body:params
}
);

const text =
await response.text();

if(text.indexOf("OK") !== -1){

document.getElementById("msg").innerText =
"送信成功";

document.getElementById("currentTime").innerText =
"最終送信：" +
new Date().toLocaleString("ja-JP");

}else{

document.getElementById("msg").innerText =
text;

}

}catch(err){

document.getElementById("msg").innerText =
"通信エラー";

}

}

</script>

</body>
</html>
