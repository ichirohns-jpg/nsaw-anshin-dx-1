<script>

const SHEET_ID = "149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc";
const SHEET_NAME = "NSAW暮らし情報局_データ";

function getCell(row,i){
return row?.c?.[i]?.v || "";
}

async function load(){

const id = new URLSearchParams(location.search).get("id");

if(!id){

document.getElementById("status").innerText =
"記事未指定";

document.getElementById("app").innerHTML =
'<div class="card"><div class="title">記事IDが指定されていません</div></div>';

return;

}

const url =
"https://docs.google.com/spreadsheets/d/"+SHEET_ID+
"/gviz/tq?sheet="+encodeURIComponent(SHEET_NAME)+
"&tqx=out:json";

try{

const res = await fetch(url);
const text = await res.text();
const json = JSON.parse(text.substring(47).slice(0,-2));

const rows = json.table.rows;

// ■ 1件だけ取得
let item = null;

for(let i=0;i<rows.length;i++){

const rowId = getCell(rows[i],0);

if(String(rowId) === String(id)){
item = {
title:getCell(rows[i],1),
image:getCell(rows[i],2),
text:getCell(rows[i],3)
};
break;
}

}

// ■ 表示
if(!item){
document.getElementById("app").innerHTML =
'<div class="card"><div class="title">記事が見つかりません</div></div>';
return;
}

document.getElementById("app").innerHTML = `
<div class="card">
<div class="title">${item.title}</div>
<div class="text">${item.text}</div>
${item.image ? `<img src="${item.image}">` : ""}
</div>
`;

document.getElementById("status").innerText = "完了";

}catch(e){

document.getElementById("status").innerText =
"読み込み失敗";

document.getElementById("app").innerHTML =
'<div class="card"><div class="title">データの読み込みに失敗しました</div></div>';

}

}

load();

</script>
