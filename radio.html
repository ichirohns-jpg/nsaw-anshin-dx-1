<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>地域ラジオ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#101827;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#fff;
}

header{
background:linear-gradient(135deg,#111827,#334155);
padding:24px;
text-align:center;
position:sticky;
top:0;
z-index:999;
}

header h1{
font-size:32px;
font-weight:900;
}

.topInfo{
padding:10px;
font-size:14px;
color:#cbd5e1;
}

.wrap{
max-width:900px;
margin:auto;
padding:14px;
}

.article{
background:#1e293b;
border-radius:24px;
overflow:hidden;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.25);
}

.thumb{
width:100%;
aspect-ratio:16/9;
object-fit:cover;
background:#000;
}

.body{
padding:18px;
}

.title{
font-size:24px;
font-weight:900;
line-height:1.5;
margin-bottom:10px;
}

.desc{
font-size:18px;
line-height:1.7;
color:#e2e8f0;
margin-bottom:12px;
}

.date{
font-size:14px;
color:#94a3b8;
margin-bottom:14px;
}

.readBtn{
display:block;
background:#dc2626;
color:#fff;
text-decoration:none;
padding:16px;
text-align:center;
border-radius:16px;
font-size:20px;
font-weight:900;
}

.archiveTitle{
font-size:28px;
font-weight:900;
margin:24px 0 12px;
}

.loading{
text-align:center;
padding:40px;
font-size:24px;
font-weight:900;
}

.home{
display:block;
margin:20px 0;
background:#475569;
color:#fff;
text-decoration:none;
padding:18px;
text-align:center;
border-radius:20px;
font-size:22px;
font-weight:900;
}

</style>

<script>

const SHEET_ID =
'ここをラジオシートIDに変更';

const SHEET_NAME =
'ラジオ';

const url =
'https://docs.google.com/spreadsheets/d/' +
SHEET_ID +
'/gviz/tq?sheet=' +
encodeURIComponent(SHEET_NAME) +
'&tqx=out:json';

function loadNews(){

const script =
document.createElement('script');

script.src =
url +
'&callback=handleSheet';

document.body.appendChild(script);

}

function getVal(c){

if(!c) return '';

return c.f || c.v || '';

}

function handleSheet(json){

const rows =
json.table.rows;

let latest='';
let archive='';

rows.reverse();

rows.forEach((row,index)=>{

const id =
getVal(row.c[0]);

const title =
getVal(row.c[1]);

const desc =
getVal(row.c[2]);

const image =
getVal(row.c[3]);

const date =
getVal(row.c[4]);

const html =

'<div class="article">' +

(image ?
'<img class="thumb" src="' +
image +
'">' : '') +

'<div class="body">' +

'<div class="title">' +
title +
'</div>' +

'<div class="desc">' +
desc +
'</div>' +

'<div class="date">' +
date +
'</div>' +

'<a class="readBtn" href="article.html?id=' +
id +
'">📻 聴く</a>' +

'</div>' +

'</div>';

if(index < 5){

latest += html;

}else{

archive += html;

}

});

document.getElementById(
'latest'
).innerHTML =
latest || '記事なし';

document.getElementById(
'archive'
).innerHTML =
archive;

}

window.onload = loadNews;

</script>

</head>

<body>

<header>
<h1>📻 地域ラジオ</h1>
<div class="topInfo">
最新5件表示＋アーカイブ
</div>
</header>

<div class="wrap">

<div id="latest" class="loading">
読込中...
</div>

<div class="archiveTitle">
📚 アーカイブ
</div>

<div id="archive"></div>

<a href="index.html" class="home">
🏠 トップへ戻る
</a>

</div>

</body>
</html>
