<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>地域ラジオ</title>

<meta property="og:title" content="地域ラジオ">
<meta property="og:description" content="地域の最新情報を音声でお届け">
<meta property="og:image" content="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#f4f6f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2937;
}

header{
background:linear-gradient(135deg,#dc2626,#ef4444);
color:#fff;
padding:24px;
text-align:center;
font-size:32px;
font-weight:900;
}

.wrap{
max-width:1000px;
margin:auto;
padding:15px;
}

.card{
background:#fff;
border-radius:24px;
overflow:hidden;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.thumb{
width:100%;
aspect-ratio:16/9;
border:none;
display:block;
background:#000;
}

.body{
padding:18px;
}

.title{
font-size:24px;
font-weight:900;
line-height:1.5;
margin-bottom:10px;
}

.desc{
font-size:18px;
line-height:1.8;
color:#475569;
margin-bottom:14px;
white-space:pre-wrap;
}

.date{
font-size:14px;
color:#94a3b8;
margin-bottom:12px;
font-weight:700;
}

.tag{
display:inline-block;
background:#fee2e2;
color:#dc2626;
padding:6px 12px;
border-radius:999px;
font-size:14px;
font-weight:900;
margin-bottom:12px;
}

.btn{
display:block;
background:#dc2626;
color:#fff;
text-decoration:none;
padding:16px;
text-align:center;
border-radius:14px;
font-size:20px;
font-weight:900;
margin-top:10px;
}

.sectionTitle{
font-size:28px;
font-weight:900;
margin:24px 0 14px;
}

.home{
display:block;
background:#475569;
color:#fff;
text-decoration:none;
padding:18px;
text-align:center;
border-radius:18px;
font-size:22px;
font-weight:900;
margin-top:20px;
}

</style>

<script>

const SHEET_ID =
'149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc';

const SHEET_NAME =
'地域ラジオ';

function getVal(c){

if(!c) return '';

return c.f || c.v || '';

}

function loadSheet(){

const s =
document.createElement('script');

s.src =
'https://docs.google.com/spreadsheets/d/' +
SHEET_ID +
'/gviz/tq?sheet=' +
encodeURIComponent(SHEET_NAME) +
'&tqx=out:json;responseHandler:handleSheet';

document.body.appendChild(s);

}

function handleSheet(json){

const rows =
json.table.rows;

rows.reverse();

let latest='';
let archive='';

rows.forEach((row,index)=>{

if(!row.c) return;

const date =
getVal(row.c[0]);

const youtube =
getVal(row.c[1]);

const title =
getVal(row.c[2]);

const desc =
getVal(row.c[3]);

const hashtag =
getVal(row.c[4]);

let embed='';

if(youtube){

const shorts =
youtube.match(/shorts\/([^?&]+)/);

const watch =
youtube.match(/[?&]v=([^&]+)/);

const shortUrl =
youtube.match(/youtu\.be\/([^?&]+)/);

let videoId='';

if(shorts){

videoId = shorts[1];

}else if(watch){

videoId = watch[1];

}else if(shortUrl){

videoId = shortUrl[1];

}

if(videoId){

embed =
'https://www.youtube.com/embed/' +
videoId;

}

}

const html =

'<div class="card">' +

(embed ?

'<iframe ' +
'class="thumb" ' +
'src="' + embed + '" ' +
'allowfullscreen ' +
'loading="lazy">' +
'</iframe>'

: '') +

'<div class="body">' +

'<div class="date">' +
date +
'</div>' +

(hashtag ?

'<div class="tag">' +
hashtag +
'</div>'

: '') +

'<div class="title">' +
title +
'</div>' +

'<div class="desc">' +
desc +
'</div>' +

(youtube ?

'<a class="btn" target="_blank" href="' +
youtube +
'">' +
'📻 ラジオを聴く' +
'</a>'

: '') +

'</div>' +

'</div>';

if(index === 0){

latest += html;

}else{

archive += html;

}

});

document.getElementById(
'latest-area'
).innerHTML =
latest || '記事がありません';

document.getElementById(
'archive-area'
).innerHTML =
archive;

}

</script>

</head>

<body onload="loadSheet()">

<header>
📻 地域ラジオ
</header>

<div class="wrap">

<div id="latest-area">
読込中...
</div>

<div class="sectionTitle">
📚 アーカイブ
</div>

<div id="archive-area"></div>

<a
href="index.html"
class="home">

🏠 トップへ戻る

</a>

</div>

</body>
</html>
