<script>

const SHEET_ID = "149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc";
const SHEET_NAME = "地域ラジオ";

const url =
"https://docs.google.com/spreadsheets/d/" +
SHEET_ID +
"/gviz/tq?sheet=" +
encodeURIComponent(SHEET_NAME) +
"&tqx=out:json";

function getVal(cell){
return cell ? (cell.f || cell.v || "") : "";
}

fetch(url)
.then(r=>r.text())
.then(text=>{

const json =
JSON.parse(
text.substring(
47,
text.length - 2
)
);

const rows =
json.table.rows || [];

rows.reverse();

let html = "";

rows.slice(0,5).forEach(row=>{

const date =
getVal(row.c[0]);

const title =
getVal(row.c[1]);

const description =
getVal(row.c[2]);

const image =
getVal(row.c[3]) ||
"home-top.jpg";

html += `
<div class="item">

<img
class="thumb"
src="${image}">

<div class="date">
${date}
</div>

<div class="title">
${title}
</div>

<div class="desc">
${description}
</div>

</div>
`;

});

document.getElementById("list").innerHTML =
html || "データなし";

})
.catch(()=>{

document.getElementById("list").innerHTML =
"読み込みエラー";

});

</script>
