<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地域ラジオ</title>

<script>
const params = new URLSearchParams(location.search);
const radio = params.get("radio");
</script>

<style>
body{margin:0;font-family:sans-serif;background:#eef4fb}
.wrap{max-width:560px;margin:auto;padding:16px}
.card{background:#fff;border-radius:20px;padding:16px;margin:10px 0}
img{width:100%;border-radius:16px}
</style>

</head>

<body>

<div class="wrap">

<div class="card">
<img src="https://drive.google.com/thumbnail?id=1bFDgz9RcbhBChn9BPT6Boz_Hpncg9EXg&sz=w2000">
</div>

<div class="card">
<div id="content">地域ラジオ通常表示</div>
</div>

</div>

<script>
if(radio){
  document.getElementById("content").innerText =
  "ラジオ記事番号：" + radio;
}
</script>

</body>
</html>
