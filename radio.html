<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地域ラジオ</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#eef3f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2937;
}

header{
background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
color:#fff;
padding:28px 18px;
text-align:center;
font-size:38px;
font-weight:900;
letter-spacing:2px;
box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.wrap{
max-width:1000px;
margin:auto;
padding:18px;
}

.card{
background:#fff;
border-radius:34px;
overflow:hidden;
margin-bottom:26px;
box-shadow:0 15px 40px rgba(0,0,0,.12);
border:1px solid rgba(255,255,255,.5);
}

.thumb{
width:100%;
display:block;
}

.date{
padding:22px 22px 0;
font-size:22px;
font-weight:900;
color:#94a3b8;
}

.tags{
margin:18px 22px;
display:inline-block;
background:#fef2f2;
color:#dc2626;
padding:12px 18px;
border-radius:999px;
font-size:20px;
font-weight:900;
}

.title{
padding:0 22px;
font-size:42px;
font-weight:900;
line-height:1.45;
color:#0f172a;
}

.desc{
padding:20px 22px;
font-size:28px;
line-height:1.8;
color:#475569;
}

.radioBtn{
display:block;
margin:0 22px 22px;
text-decoration:none;
text-align:center;
padding:24px;
border-radius:24px;
background:linear-gradient(135deg,#991b1b,#ef4444);
color:#fff;
font-size:34px;
font-weight:900;
box-shadow:
0 10px 25px rgba(0,0,0,.25),
inset 0 1px 0 rgba(255,255,255,.25);
}

.share{
display:flex;
flex-direction:column;
gap:14px;
padding:0 22px 24px;
}

.share button{

width:100%;

background:linear-gradient(
180deg,
#374151,
#111827
);

color:#fff;

border:none;

border-radius:24px;

padding:24px;

font-size:24px;

font-weight:900;

text-align:left;

box-shadow:
0 8px 20px rgba(0,0,0,.25),
inset 0 1px 0 rgba(255,255,255,.15);

cursor:pointer;

}

.share button:after{

content:" ＞";

float:right;

opacity:.8;

}

.share button:active{
transform:scale(.98);
}

@media(max-width:700px){

header{
font-size:32px;
}

.title{
font-size:34px;
}

.desc{
font-size:24px;
}

.radioBtn{
font-size:30px;
}

.share button{
font-size:20px;
}

}

</style>
</head>

<body>

<header>
📻 地域ラジオ
</header>

<div class="wrap">

<div id="app">
読み込み中...
</div>

</div>

<script>

function makeShareUrl(id){

return "https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/share-radio-v2.html?radio="
+ encodeURIComponent(id);

}

function shareFacebook(url){

window.open(
"https://www.facebook.com/sharer/sharer.php?u="
+ encodeURIComponent(url),
"_blank"
);

}

function shareLine(url){

window.open(
"https://social-plugins.line.me/lineit/share?url="
+ encodeURIComponent(url),
"_blank"
);

}

function shareX(url,text){

window.open(
"https://twitter.com/intent/tweet?url="
+ encodeURIComponent(url)
+ "&text="
+ encodeURIComponent(text),
"_blank"
);

}

function copyUrl(url){

navigator.clipboard.writeText(url);

alert("URLをコピーしました");

}

const SHEET_ID="149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc";
const SHEET_NAME="地域ラジオ";

const GVIZ_URL=
"https://docs.google.com/spreadsheets/d/"
+ SHEET_ID +
"/gviz/tq?sheet="
+ encodeURIComponent(SHEET_NAME)
+ "&tqx=out:json";

function getCell(row,index){

if(!row || !row.c || !row.c[index]){
return "";
}

const c=row.c[index];

if(c.v!==undefined && c.v!==null){
return c.v;
}

if(c.f!==undefined && c.f!==null){
return c.f;
}

return "";

}

function getYoutubeId(url){

if(!url)return "";

url=String(url);

let m=url.match(/youtu\.be\/([^?&]+)/);
if(m)return m[1];

m=url.match(/[?&]v=([^&]+)/);
if(m)return m[1];

m=url.match(/embed\/([^?&]+)/);
if(m)return m[1];

m=url.match(/shorts\/([^?&]+)/);
if(m)return m[1];

return "";

}

fetch(GVIZ_URL)

.then(function(r){

return r.text();

})

.then(function(text){

const json=
JSON.parse(
text.substring(
text.indexOf("{"),
text.lastIndexOf("}")+1
)
);

const rows=json.table.rows||[];

let html="";

rows.reverse();

rows.forEach(function(row,index){

const date=getCell(row,0);
const video=getCell(row,1);
const title=getCell(row,2);
const desc=getCell(row,3);
const tags=getCell(row,4);

const videoId=
getYoutubeId(video);

const shareUrl=
makeShareUrl(index+1);

const shareText=
title || "地域ラジオ";

html+=`

<div class="card">

<img
class="thumb"
src="https://img.youtube.com/vi/${videoId}/hqdefault.jpg">

<div class="date">
${date}
</div>

<div class="tags">
${tags}
</div>

<div class="title">
${title}
</div>

<div class="desc">
${desc}
</div>

<a
class="radioBtn"
href="https://www.youtube.com/watch?v=${videoId}"
target="_blank">

📻 ラジオを聴く

</a>

<div class="share">

<button
onclick="shareFacebook('${shareUrl}')">

Facebook

</button>

<button
onclick="shareLine('${shareUrl}')">

LINE

</button>

<button
onclick="shareX(
'${shareUrl}',
'${String(shareText).replace(/'/g,"\\'")}'
)">

X

</button>

<button
onclick="copyUrl('${shareUrl}')">

URLコピー

</button>

</div>

</div>

`;

});

document.getElementById("app").innerHTML=
html;

})

.catch(function(err){

document.getElementById("app").innerHTML=
err;

console.error(err);

});

</script>

</body>
</html>
