<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>地域ラジオ｜NSAW</title>

<meta property="og:type" content="website">
<meta property="og:title" content="地域ラジオ">
<meta property="og:description" content="志木・新座・朝霞・和光の地域情報">
<meta property="og:image" content="https://drive.google.com/thumbnail?id=1bFDgz9RcbhBChn9BPT6Boz_Hpncg9EXg&sz=w2000">

<style>
body{margin:0;background:#eef4fb;font-family:sans-serif}
.wrap{max-width:560px;margin:auto;padding:16px}
.card{background:#fff;border-radius:20px;padding:16px;margin:10px 0}
img{width:100%;border-radius:16px}
a{display:block;margin:6px 0;font-weight:bold}
</style>

</head>

<body>

<div class="wrap">

<div class="card">
<img src="https://drive.google.com/thumbnail?id=1bFDgz9RcbhBChn9BPT6Boz_Hpncg9EXg&sz=w2000">
</div>

<div class="card" id="content">地域ラジオ</div>

<div class="card">
<a id="fb">Facebook</a>
<a id="tw">X</a>
<a id="li">LINE</a>
</div>

</div>

<script>
const p = new URLSearchParams(location.search);
const radio = p.get("radio");

if(radio){
document.getElementById("content").innerText = "ラジオ記事：" + radio;
}

const url = location.href;

document.getElementById("fb").href =
"https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(url);

document.getElementById("tw").href =
"https://twitter.com/intent/tweet?url=" + encodeURIComponent(url);

document.getElementById("li").href =
"https://social-plugins.line.me/lineit/share?url=" + encodeURIComponent(url);
</script>

</body>
</html>
