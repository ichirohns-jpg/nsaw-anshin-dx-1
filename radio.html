<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>地域ラジオ｜NSAW</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:#eef4fb;
color:#1f2d3d;
}

.wrap{
max-width:560px;
margin:auto;
padding:16px;
}

.header{
background:#5d4037;
color:#fff;
padding:20px;
border-radius:20px;
font-weight:900;
font-size:22px;
margin-bottom:16px;
}

.card{
background:#fff;
padding:16px;
border-radius:20px;
margin:10px 0;
box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.title{
font-size:20px;
font-weight:900;
margin-bottom:8px;
}

.text{
font-size:16px;
line-height:1.6;
color:#444;
}
</style>

</head>

<body>

<div class="wrap">

<div class="header">📻 地域ラジオ</div>

<!-- ここにスプレッドシート表示 -->
<div id="content"></div>

</div>

<script>

async function loadRadio(){

// ★ GASのURL（あとで差し替え）
const url = "https://script.google.com/macros/s/AKfycbXXXX/exec";

const res = await fetch(url);
const data = await res.json();

let html = "";

// radioだけ表示
data.forEach(item => {

if(item.type !== "radio") return;

html += `
<div class="card">
<div class="title">${item.title || ""}</div>
<div class="text">${item.text || ""}</div>
</div>
`;

});

document.getElementById("content").innerHTML = html;

}

loadRadio();

</script>

</body>
</html>
