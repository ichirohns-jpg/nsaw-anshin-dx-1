<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>地域ラジオ</title>

<meta property="og:title" content="地域ラジオ">
<meta property="og:description" content="地域の最新情報を音声でお届け">
<meta property="og:image" content="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#f4f6f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2937;
}

header{
background:linear-gradient(135deg,#dc2626,#ef4444);
color:#fff;
padding:24px;
text-align:center;
font-size:32px;
font-weight:900;
}

.wrap{
max-width:1000px;
margin:auto;
padding:15px;
}

.card{
background:#fff;
border-radius:24px;
overflow:hidden;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.thumb{
width:100%;
aspect-ratio:9/16;
object-fit:cover;
background:#ddd;
}

.body{
padding:18px;
}

.title{
font-size:24px;
font-weight:900;
line-height:1.5;
margin-bottom:10px;
}

.desc{
font-size:18px;
line-height:1.7;
color:#475569;
margin-bottom:12px;
}

.date{
font-size:14px;
color:#94a3b8;
margin-bottom:12px;
}

.btn{
display:block;
background:#dc2626;
color:#fff;
text-decoration:none;
padding:16px;
text-align:center;
border-radius:14px;
font-size:20px;
font-weight:900;
margin-top:10px;
}

.share{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:12px;
}

.share a,
.share button{
border:none;
text-decoration:none;
color:#fff;
padding:12px;
border-radius:12px;
text-align:center;
font-size:16px;
font-weight:900;
cursor:pointer;
}

.line{
background:#06c755;
}

.x{
background:#111;
}

.fb{
background:#1877f2;
}

.copy{
background:#475569;
}

.sectionTitle{
font-size:28px;
font-weight:900;
margin:24px 0 14px;
}

.home{
display:block;
background:#475569;
color:#fff;
text-decoration:none;
padding:18px;
text-align:center;
border-radius:18px;
font-size:22px;
font-weight:900;
margin-top:20px;
}

</style>

<script>

const SHEET_ID =
'149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc';

const SHEET_NAME =
'地域ラジオ';

function getVal(c){

if(!c) return '';

return c.f || c.v || '';

}

function copyLink(url){

navigator.clipboard.writeText(url);

alert('コピーしました');

}

function loadSheet(){

const s =
document.createElement('script');

s.src =
'https://docs.google.com/spreadsheets/d/' +
SHEET_ID +
'/gviz/tq?sheet=' +
encodeURIComponent(SHEET_NAME) +
'&tqx=out:json;responseHandler:handleSheet';

document.body.appendChild(s);

}

function handleSheet(json){

const rows =
json.table.rows;

rows.reverse();

let latest='';
let archive='';

rows.forEach((row,index)=>{

if(!row.c) return;

const id =
getVal(row.c[0]);

const title =
getVal(row.c[1]);

const desc =
getVal(row.c[2]);

const image =
getVal(row.c[3]);

const date =
getVal(row.c[4]);

const shareUrl =
'https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/share.html';

const html =

'<div class="card">' +

(image ?
'<img class="thumb" src="' +
image +
'">' : '') +

'<div class="body">' +

'<div class="title">' +
title +
'</div>' +

'<div class="desc">' +
desc +
'</div>' +

'<div class="date">' +
date +
'</div>' +

'<a class="btn" href="article.html?id=' +
encodeURIComponent(id) +
'">📻 ラジオを開く</a>' +

'<div class="share">' +

'<a class="line" target="_blank" href="https://social-plugins.line.me/lineit/share?url=' +
encodeURIComponent(shareUrl) +
'">LINE</a>' +

'<a class="x" target="_blank" href="https://twitter.com/intent/tweet?url=' +
encodeURIComponent(shareUrl) +
'&text=' +
encodeURIComponent(title) +
'">X</a>' +

'<a class="fb" target="_blank" href="https://www.facebook.com/sharer/sharer.php?u=' +
encodeURIComponent(shareUrl) +
'">Facebook</a>' +

'<button class="copy" onclick="copyLink(\'' +
shareUrl +
'\')">コピー</button>' +

'</div>' +

'</div>' +

'</div>';

if(index < 5){

latest += html;

}else{

archive += html;

}

});

document.getElementById(
'latest'
).innerHTML =
latest || '記事なし';

document.getElementById(
'archive'
).innerHTML =
archive;

}

window.onload =
loadSheet;

</script>

</head>

<body>

<header>
📻 地域ラジオ
</header>

<div class="wrap">

<div id="latest">
読込中...
</div>

<div class="sectionTitle">
📚 アーカイブ
</div>

<div id="archive"></div>

<a href="index.html" class="home">
🏠 トップへ戻る
</a>

</div>

</body>
</html>
