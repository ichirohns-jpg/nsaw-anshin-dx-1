<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>地域ラジオ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#f4f6f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.header{
background:linear-gradient(135deg,#e53935,#ff7043);
color:#fff;
padding:24px;
text-align:center;
font-size:32px;
font-weight:900;
}

.wrap{
max-width:900px;
margin:auto;
padding:15px;
}

.card{
background:#fff;
border-radius:20px;
padding:18px;
margin-bottom:16px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.date{
font-size:14px;
font-weight:900;
color:#e53935;
margin-bottom:8px;
}

.title{
font-size:24px;
font-weight:900;
margin-bottom:12px;
}

.desc{
font-size:16px;
line-height:1.8;
margin-bottom:15px;
white-space:pre-wrap;
}

.audio{
width:100%;
margin-top:10px;
}

.btn{
display:block;
width:100%;
padding:18px;
border-radius:16px;
background:#e53935;
color:#fff;
text-decoration:none;
text-align:center;
font-size:20px;
font-weight:900;
margin-top:12px;
}

</style>

</head>

<body>

<div class="header">
📻 地域ラジオ
</div>

<div class="wrap">

<div id="radioList">

<div class="card">
読込中...
</div>

</div>

</div>

<script>

const SHEET_ID =
"149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc";

const SHEET_NAME =
"地域ラジオ";

const url =
"https://docs.google.com/spreadsheets/d/" +
SHEET_ID +
"/gviz/tq?sheet=" +
encodeURIComponent(SHEET_NAME) +
"&tqx=out:json";

function getVal(cell){

if(!cell) return "";

return cell.v || cell.f || "";

}

function handleSheet(json){

const rows =
json.table.rows || [];

rows.reverse();

let html = "";

rows.forEach(row=>{

const cells =
row.c || [];

const date =
getVal(cells[1]);

const title =
getVal(cells[2]);

const desc =
getVal(cells[3]);

const audioUrl =
getVal(cells[4]);

html += `

<div class="card">

<div class="date">
${date}
</div>

<div class="title">
${title}
</div>

<div class="desc">
${desc}
</div>

${
audioUrl
?
`
<audio
class="audio"
controls
src="${audioUrl}">
</audio>
`
:
""
}

${
audioUrl
?
`
<a
class="btn"
href="${audioUrl}"
target="_blank">
🎧 ラジオを再生
</a>
`
:
""
}

</div>

`;

});

document.getElementById(
"radioList"
).innerHTML =
html || "ラジオがありません";

}

const script =
document.createElement(
"script"
);

script.src =
url +
"&callback=handleSheet";

document.body.appendChild(
script
);

</script>

</body>
</html>
