<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>地域ラジオ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:36px;
font-weight:900;
}

.card{
background:#fff;
border-radius:30px;
overflow:hidden;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.video{
width:100%;
aspect-ratio:16/9;
border:none;
}

.body{
padding:20px;
}

.title{
font-size:28px;
font-weight:900;
margin-bottom:10px;
}

.desc{
font-size:20px;
line-height:1.7;
margin-bottom:10px;
}

.btn{
display:block;
padding:18px;
text-align:center;
background:#dc2626;
color:#fff;
text-decoration:none;
border-radius:18px;
font-size:22px;
font-weight:900;
}

.back{
background:#475569;
margin-top:18px;
}

</style>

</head>

<body>

<div class="header">
<h1>📻 地域ラジオ</h1>
</div>

<div class="card">

<iframe
class="video"
src="https://www.youtube.com/embed/dQw4w9WgXcQ"
allowfullscreen>
</iframe>

<div class="body">

<div class="title">
今日の地域ラジオ
</div>

<div class="desc">
志木市・新座市・朝霞市・和光市の最新情報を毎朝3分でお届けします。
</div>

<a href="#" class="btn">
YouTubeで見る
</a>

</div>

</div>

<a href="index.html" class="btn back">
🏠 トップへ戻る
</a>

</body>
</html>
