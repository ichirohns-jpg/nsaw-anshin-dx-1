<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>地域ラジオ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#f4f6f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.header{
background:linear-gradient(135deg,#1976d2,#64b5f6);
color:#fff;
padding:28px;
text-align:center;
font-size:42px;
font-weight:900;
}

.wrap{
max-width:1000px;
margin:auto;
padding:18px;
}

.card{
background:#fff;
border-radius:24px;
overflow:hidden;
margin-bottom:20px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.thumb{
width:100%;
aspect-ratio:16/9;
border:none;
}

.body{
padding:20px;
}

.title{
font-size:30px;
font-weight:900;
line-height:1.5;
margin-bottom:12px;
}

.desc{
font-size:22px;
line-height:1.9;
margin-bottom:15px;
}

.hash{
font-size:18px;
line-height:1.8;
color:#1976d2;
font-weight:900;
margin-bottom:15px;
}

.btn{
display:block;
width:100%;
background:#1976d2;
color:#fff;
text-decoration:none;
text-align:center;
padding:20px;
font-size:24px;
font-weight:900;
border-radius:18px;
margin-top:12px;
}

.error{
background:#fff3cd;
border:2px solid #ffe082;
padding:20px;
border-radius:18px;
font-size:22px;
font-weight:900;
}

</style>

</head>

<body>

<div class="header">
📻 地域ラジオ
</div>

<div class="wrap">

<div id="radioList">

<div class="error">
ラジオを読込中...
</div>

</div>

</div>

<script>

const SHEET_ID =
"149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc";

const SHEET_NAME =
"地域ラジオ";

const url =
"https://docs.google.com/spreadsheets/d/" +
SHEET_ID +
"/gviz/tq?sheet=" +
encodeURIComponent(SHEET_NAME) +
"&tqx=out:json";

function getVal(cell){

if(!cell) return "";

return cell.v || cell.f || "";

}

function youtubeEmbed(url){

if(!url) return "";

if(url.includes("watch?v=")){

return url.replace(
"watch?v=",
"embed/"
);

}

if(url.includes("youtu.be/")){

const id =
url.split("youtu.be/")[1]
.split("?")[0];

return
"https://www.youtube.com/embed/" +
id;

}

if(url.includes("/shorts/")){

const id =
url.split("/shorts/")[1]
.split("?")[0];

return
"https://www.youtube.com/embed/" +
id;

}

return "";

}

function handleSheet(json){

const rows =
json.table.rows || [];

rows.reverse();

let html = "";

rows.forEach(row=>{

const cells =
row.c || [];

const videoUrl =
getVal(cells[1]);

const title =
getVal(cells[2]);

const desc =
getVal(cells[3]);

const hashtags =
getVal(cells[4]);

if(
!videoUrl
) return;

const embedUrl =
youtubeEmbed(
videoUrl
);

html += `

<div class="card">

<iframe
class="thumb"
src="${embedUrl}"
allowfullscreen>
</iframe>

<div class="body">

<div class="title">
${title}
</div>

<div class="desc">
${desc}
</div>

<div class="hash">
${hashtags}
</div>

<a
class="btn"
href="${videoUrl}"
target="_blank">
▶ YouTubeで見る
</a>

</div>

</div>

`;

});

document.getElementById(
"radioList"
).innerHTML =

html ||

`

<div class="error">

ラジオがありません

</div>

`;

}

const script =
document.createElement(
"script"
);

script.src =
url +
"&callback=handleSheet";

script.onerror =
function(){

document.getElementById(
"radioList"
).innerHTML =

`

<div class="error">

スプレッドシート接続失敗

</div>

`;

};

document.body.appendChild(
script
);

</script>

</body>
</html>
