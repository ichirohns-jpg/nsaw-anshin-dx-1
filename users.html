<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>利用者一覧</title>

<link rel="icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
background:linear-gradient(180deg,#000000 0%,#08111d 50%,#000000 100%);
color:#ffffff;
min-height:100vh;
}

.wrap{
max-width:900px;
margin:auto;
padding:16px;
}

.header{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:20px;
margin-bottom:16px;
text-align:center;
}

.title{
font-size:34px;
font-weight:900;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:20px;
margin-bottom:16px;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.name{
font-size:26px;
font-weight:900;
margin-bottom:10px;
}

.info{
font-size:15px;
line-height:1.8;
margin-bottom:14px;
opacity:.9;
}

button{
width:100%;
border:none;
cursor:pointer;
color:#fff;
font-weight:900;
padding:16px;
border-radius:16px;
font-size:16px;
}

.app-btn{
background:linear-gradient(135deg,#00a3c4,#00d4ff);
}

.support-btn{
background:linear-gradient(135deg,#2e7d32,#43a047);
}

.qr-btn{
background:linear-gradient(135deg,#7b1fa2,#ab47bc);
}

.medicine-btn{
background:linear-gradient(135deg,#1565c0,#42a5f5);
}

.schedule-btn{
background:linear-gradient(135deg,#8e24aa,#ba68c8);
}

.map-btn{
background:linear-gradient(135deg,#455a64,#607d8b);
}

.emg-btn{
background:linear-gradient(135deg,#c62828,#ef5350);
}

.home-btn{
background:linear-gradient(135deg,#37474f,#607d8b);
margin-top:10px;
}

.footer{
text-align:center;
padding:20px;
opacity:.6;
font-size:12px;
}

</style>

</head>

<body>

<div class="wrap">

<div class="header">

<div class="title">
👥 利用者一覧
</div>

</div>

<div id="users">

<div class="card">
読み込み中...
</div>

</div>

<div class="card">

<button
class="home-btn"
onclick="location.href='register.html'">
👤 利用者登録
</button>

<button
class="home-btn"
onclick="location.href='index.html'">
🏠 ホームへ戻る
</button>

</div>

<div class="footer">
NSAW 利用者管理
</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

async function loadUsers(){

try{

const response =
await fetch(
GAS_URL +
"?action=users"
);

const json =
await response.json();

const data =
json.data || [];

let html = "";

data.forEach(user=>{

html += `
<div class="card">

<div class="name">
👤 ${user.name || ""}
</div>

<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
">

<div style="
font-size:14px;
opacity:.8;
">
ID : ${user.id || ""}
</div>

<div style="
font-size:14px;
font-weight:900;
color:#00e676;
">
${user.lastStatus || "未送信"}
</div>

</div>

<div class="info">

☎ ${user.tel || "-"}

<br>

🕒 ${user.lastTime || "-"}

</div>

<div style="
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:12px;
">

<button
class="app-btn"
onclick="location.href='app.html?id=${user.id}'">
😊 本人
</button>

<button
class="support-btn"
onclick="location.href='support.html?id=${user.id}'">
👪 支援者
</button>

<button
class="qr-btn"
onclick="location.href='qr.html?id=${user.id}'">
📱 QR
</button>

<button
class="medicine-btn"
onclick="location.href='medicine.html?id=${user.id}'">
💊 服薬
</button>

<button
class="schedule-btn"
onclick="location.href='schedule.html?id=${user.id}'">
📅 予定
</button>

<button
class="map-btn"
onclick="location.href='map.html?id=${user.id}'">
📍 地図
</button>

<button
class="emg-btn"
onclick="location.href='emergency.html?id=${user.id}'">
🚨 緊急
</button>

</div>

<button
class="home-btn"
onclick="copyUrl('${user.id}')">
🔗 URLコピー
</button>

</div>
`;

});

document.getElementById("users").innerHTML =
html || `
<div class="card">
利用者が登録されていません
</div>
`;

}catch(error){

document.getElementById("users").innerHTML =
`
<div class="card">
取得エラー
</div>
`;

}

}

function copyUrl(id){

const url =
location.origin +
location.pathname.replace(
"users.html",
"support.html"
) +
"?id=" +
id;

navigator.clipboard.writeText(url);

alert("URLをコピーしました");

}

loadUsers();

</script>

</body>
</html>
