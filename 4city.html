<script>
const SHEET_ID="149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc";
const SHEET_NAME="瓦版";
const url =
"https://docs.google.com/spreadsheets/d/" +
SHEET_ID +
"/gviz/tq?sheet=" +
encodeURIComponent(SHEET_NAME) +
"&tqx=out:json";
function v(row,index){
if(!row.c[index]) return "";
if(row.c[index].v !== null && row.c[index].v !== undefined){
return String(row.c[index].v);
}
if(row.c[index].f){
return String(row.c[index].f);
}
return "";
}
function safeUrl(url){
if(!url) return "";
url = String(url).trim();
const match = url.match(/https?:\/\/[^\s"]+/);
return match ? match[0] : "";
}
function extractYouTubeId(url){
const s = String(url || '').trim();
if(!s) return '';
let m = s.match(/[?&]v=([a-zA-Z0-9_-]{6,})/);
if(m && m[1]) return m[1];
m = s.match(/youtu\.be\/([a-zA-Z0-9_-]{6,})/);
if(m && m[1]) return m[1];
m = s.match(/youtube\.com\/embed\/([a-zA-Z0-9_-]{6,})/);
if(m && m[1]) return m[1];
m = s.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]{6,})/);
if(m && m[1]) return m[1];
return '';
}
fetch(url)
.then(res => res.text())
.then(text => {
const json = JSON.parse(text.substring(47).slice(0,-2));
const rows = json.table.rows;
let html = "";
/*
P = 動画タイトル
Q = 動画説明
R = 動画URL
*/
rows.reverse().forEach(row => {
const title = v(row,2);
const image = safeUrl(v(row,3));
const body = v(row,4);
const mediaTitle = v(row,15);
const mediaDetail = v(row,16);
const mediaUrl = safeUrl(v(row,17));
/*
動画専用行は表示しない
*/
if(mediaTitle && mediaUrl && !image && !body){
return;
}
if(!title && !image && !body && !mediaUrl){
return;
}
html += `
<div class="card">
`;
if(image){
html += `
<img class="kawaraban" src="${image}">
`;
}
html += `
<div class="cardTitle">
${title || "四市瓦版"}
</div>
<div class="cardText">
${body || ""}
</div>
`;
html += `
<div class="sectionTitle">
🔗 情報リンク
</div>
`;
for(let i=5;i<=14;i+=2){
const linkTitle = v(row,i);
const linkUrl = safeUrl(v(row,i+1));
if(linkTitle && linkUrl){
html += `
<a class="linkBtn" href="${linkUrl}" target="_blank">
${linkTitle}
</a>
`;
}
}
if(mediaTitle && mediaUrl){
const ytId = extractYouTubeId(mediaUrl);
if(ytId){
html += `
<div class="videoBox">
<div class="videoTitle">
🎬 ${mediaTitle}
<div style="
font-size:16px;
font-weight:normal;
color:#666;
margin-top:10px;
line-height:1.7;
">
${mediaDetail || ""}
</div>
</div>
<iframe
class="videoFrame"
src="https://www.youtube.com/embed/${ytId}?playsinline=1&rel=0"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
allowfullscreen>
</iframe>
</div>
`;
}
}
html += `
</div>
`;
});
if(!html){
html = `
<div class="card">
<div class="loading">
表示できる情報がありません
</div>
</div>
`;
}
document.getElementById("content").innerHTML = html;
})
.catch(err => {
document.getElementById("content").innerHTML =
`
<div class="card">
<div class="loading">
読み込みできませんでした
</div>
</div>
`;
console.log(err);
});
</script>
<style>
.videoFrame{
width:100%;
aspect-ratio:16 / 9;
height:auto;
border:none;
border-radius:18px;
background:#000;
display:block;
}
</style>
