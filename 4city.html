<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>四市瓦版｜見守りDX</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}
body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}
.wrap{
max-width:640px;
margin:auto;
padding:16px;
}
.header{
background:#1565c0;
color:#fff;
border-radius:28px;
padding:24px;
margin-bottom:18px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}
.title{
font-size:38px;
font-weight:900;
}
.sub{
font-size:17px;
margin-top:8px;
line-height:1.7;
}
.card{
background:#fff;
border-radius:28px;
padding:20px;
margin-bottom:18px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}
.latest{
outline:6px solid #ffd84d;
}
.badge{
display:inline-block;
background:#e8f1ff;
color:#1c4c94;
font-size:16px;
font-weight:900;
padding:6px 12px;
border-radius:999px;
margin-bottom:12px;
}
.meta{
margin-bottom:8px;
}
.date{
display:inline-block;
background:#eef4ff;
color:#1f4d95;
font-size:16px;
font-weight:900;
padding:4px 10px;
border-radius:999px;
}
.cardTitle{
font-size:28px;
font-weight:900;
line-height:1.5;
margin-bottom:14px;
color:#1565c0;
white-space:pre-wrap;
}
.cardText{
font-size:20px;
font-weight:700;
line-height:1.8;
color:#444;
margin-bottom:18px;
white-space:pre-wrap;
}
.media-wrap{
margin-bottom:16px;
display:flex;
justify-content:center;
width:100%;
}
.kawaraban{
width:100%;
border-radius:22px;
display:block;
height:auto;
}
.videoBox{
width:100%;
background:#fff8e1;
border-radius:22px;
padding:14px;
margin-top:14px;
}
.ratio169{
position:relative;
width:100%;
padding-top:56.25%;
background:#000;
border-radius:18px;
overflow:hidden;
border:2px solid #d9e2ec;
}
.ratio169 iframe,
.ratio169 video{
position:absolute;
inset:0;
width:100%;
height:100%;
border:0;
display:block;
}
.videoTitle{
font-size:24px;
font-weight:900;
line-height:1.8;
margin-bottom:10px;
color:#ef6c00;
white-space:pre-wrap;
}
.videoDetail{
font-size:16px;
font-weight:normal;
line-height:1.7;
margin-top:6px;
color:#666;
}
.sectionTitle{
font-size:24px;
font-weight:900;
margin:18px 0 12px;
color:#1565c0;
}
.linkBtn{
display:block;
width:100%;
background:#1976d2;
color:#fff;
text-decoration:none;
text-align:center;
padding:18px;
border-radius:20px;
font-size:22px;
font-weight:900;
margin-bottom:12px;
}
.loading{
font-size:24px;
font-weight:900;
text-align:center;
padding:40px;
}
.error-box{
background:#fff3f3;
color:#9b1c1c;
border:2px solid #f3c2c2;
border-radius:18px;
padding:20px;
font-size:22px;
font-weight:900;
text-align:center;
white-space:pre-wrap;
}
.footer{
display:flex;
justify-content:space-around;
margin-top:20px;
padding:18px 0;
background:#fff;
border-radius:22px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
font-size:14px;
font-weight:900;
color:#666;
}
</style>
</head>
<body>
<div class="wrap">
<div class="header">
<div class="title">
📰 四市瓦版
</div>
<div class="sub">
志木・新座・朝霞・和光の情報と<br>
お楽しみ動画をまとめて確認します
</div>
</div>
<div id="content">
<div class="card">
<div class="loading">
読み込み中...
</div>
</div>
</div>
<div class="footer">
<div>見守り</div>
<div>四市情報</div>
<div>予定</div>
<div>ゴミ</div>
</div>
</div>
<script>
const GAS_URL =
'https://script.google.com/macros/s/AKfycbwcI22by_MWHxYExwuQf4b4GQmQjkYdUSPWeicmG7b2j99SutkILo3Bxow5WjlExcw/exec';
function escapeHtml(str){
return String(str || '')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#39;');
}
function nl2br(str){
return escapeHtml(str).replace(/\n/g,'<br>');
}
function extractYouTubeId(url){
const s = String(url || '').trim();
if(!s) return '';
let m = s.match(/[?&]v=([a-zA-Z0-9_-]{6,})/);
if(m && m[1]) return m[1];
m = s.match(/youtu\.be\/([a-zA-Z0-9_-]{6,})/);
if(m && m[1]) return m[1];
m = s.match(/youtube\.com\/embed\/([a-zA-Z0-9_-]{6,})/);
if(m && m[1]) return m[1];
m = s.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]{6,})/);
if(m && m[1]) return m[1];
return '';
}
function extractDriveId(url){
const s = String(url || '').trim();
if(!s) return '';
let m = s.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
if(m && m[1]) return m[1];
m = s.match(/[?&]id=([a-zA-Z0-9_-]+)/);
if(m && m[1]) return m[1];
return '';
}
function isDirectVideoUrl(url){
const s = String(url || '').trim().toLowerCase();
return s.includes('.mp4')
|| s.includes('.mov')
|| s.includes('.m4v')
|| s.includes('.webm')
|| s.includes('.ogg');
}
function buildMediaHtml(item){
const mediaUrl = item.mediaUrl || '';
if(!mediaUrl) return '';
let playerHtml = '';
const yt = extractYouTubeId(mediaUrl);
const driveId = extractDriveId(mediaUrl);
if(yt){
playerHtml = `
<iframe
src="https://www.youtube.com/embed/${escapeHtml(yt)}?playsinline=1&rel=0"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
allowfullscreen>
</iframe>
`;
}
else if(driveId){
const previewUrl =
`https://drive.google.com/file/d/${driveId}/preview`;
playerHtml = `
<iframe
src="${escapeHtml(previewUrl)}"
allow="autoplay"
allowfullscreen>
</iframe>
`;
}
else if(isDirectVideoUrl(mediaUrl)){
playerHtml = `
<video
controls
playsinline
preload="metadata"
src="${escapeHtml(mediaUrl)}">
</video>
`;
}
if(playerHtml){
return `
<div class="videoBox">
<div class="videoTitle">
🎬 ${escapeHtml(item.mediaTitle || 'おすすめ動画')}
<div class="videoDetail">
${nl2br(item.mediaDetail || '')}
</div>
</div>
<div class="ratio169">
${playerHtml}
</div>
</div>
`;
}
return '';
}
function buildLinks(item){
if(!item.links || !Array.isArray(item.links)){
return '';
}
let html = '';
item.links.forEach(link => {
if(link.title && link.url){
html += `
<a
href="${escapeHtml(link.url)}"
class="linkBtn"
target="_blank"
rel="noopener noreferrer">
${escapeHtml(link.title)}
</a>
`;
}
});
if(!html){
return '';
}
return `
<div class="sectionTitle">
🔗 情報リンク
</div>
${html}
`;
}
function buildCard(item,isLatest){
let html =
`<div class="card ${isLatest ? 'latest' : ''}">`;
if(isLatest){
html += `
<div class="badge">
最新のお知らせ
</div>
`;
}
if(item.date){
html += `
<div class="meta">
<span class="date">
${escapeHtml(item.date)}
</span>
</div>
`;
}
if(item.title){
html += `
<div class="cardTitle">
${nl2br(item.title)}
</div>
`;
}
if(item.imageUrl){
html += `
<div class="media-wrap">
<img
class="kawaraban"
src="${escapeHtml(item.imageUrl)}"
alt="掲示板画像">
</div>
`;
}
if(item.detail){
html += `
<div class="cardText">
${nl2br(item.detail)}
</div>
`;
}
html += buildLinks(item);
html += buildMediaHtml(item);
html += `</div>`;
return html;
}
async function loadBoard(){
const contentDiv =
document.getElementById('content');
try{
const res =
await fetch(
`${GAS_URL}?mode=board`,
{ cache:'no-store' }
);
const data =
await res.json();
if(!data.ok){
throw new Error(
data.error || 'データ取得失敗'
);
}
const items =
Array.isArray(data.items)
? data.items
: [];
if(items.length === 0){
contentDiv.innerHTML = `
<div class="card">
<div class="loading">
表示できる情報がありません
</div>
</div>
`;
return;
}
contentDiv.innerHTML =
items.map((item,idx)=>
buildCard(item,idx===0)
).join('');
}
catch(err){
contentDiv.innerHTML = `
<div class="error-box">
${escapeHtml(err.message || String(err))}
</div>
`;
console.log(err);
}
}
loadBoard();
</script>
</body>
</html>
