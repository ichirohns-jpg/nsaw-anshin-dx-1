<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>四市瓦版｜見守りDX</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:640px;
margin:auto;
padding:16px;
}

.header{
background:#1565c0;
color:#fff;
border-radius:28px;
padding:24px;
margin-bottom:18px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.back{
font-size:16px;
font-weight:900;
margin-bottom:12px;
cursor:pointer;
}

.title{
font-size:38px;
font-weight:900;
}

.sub{
font-size:17px;
margin-top:8px;
opacity:.95;
line-height:1.6;
}

.card{
background:#fff;
border-radius:28px;
padding:20px;
margin-bottom:18px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.kawaraban{
width:100%;
border-radius:22px;
margin-bottom:16px;
background:#ddd;
}

.cardTitle{
font-size:28px;
font-weight:900;
margin-bottom:14px;
line-height:1.5;
color:#1565c0;
white-space:pre-wrap;
}

.cardText{
font-size:20px;
font-weight:700;
line-height:1.8;
color:#444;
margin-bottom:18px;
white-space:pre-wrap;
}

.sectionTitle{
font-size:24px;
font-weight:900;
margin:18px 0 12px;
color:#1565c0;
}

.linkBtn{
display:block;
width:100%;
background:#1976d2;
color:#fff;
text-decoration:none;
text-align:center;
padding:18px;
border-radius:20px;
font-size:22px;
font-weight:900;
margin-bottom:12px;
}

.videoBox{
background:#fff8e1;
border-radius:22px;
padding:18px;
margin-top:18px;
}

.videoTitle{
font-size:24px;
font-weight:900;
margin-bottom:14px;
color:#ef6c00;
line-height:1.8;
white-space:pre-wrap;
}

.videoFrame{
width:100%;
height:220px;
border:none;
border-radius:18px;
background:#000;
}

.loading{
font-size:24px;
font-weight:900;
text-align:center;
padding:40px;
}

.footer{
display:flex;
justify-content:space-around;
margin-top:20px;
padding:18px 0;
background:#fff;
border-radius:22px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
font-size:14px;
font-weight:900;
color:#666;
}

</style>
</head>

<body>

<div class="wrap">

<div class="header">

<div class="back" onclick="location.href='index.html'">
← トップへ戻る
</div>

<div class="title">
📰 四市瓦版
</div>

<div class="sub">
志木・新座・朝霞・和光の情報と<br>
お楽しみ動画をまとめて確認します
</div>

</div>

<div id="content">

<div class="card">
<div class="loading">
読み込み中...
</div>
</div>

</div>

<div class="footer">

<div onclick="location.href='index.html'">
見守り
</div>

<div onclick="location.href='4city.html'">
四市情報
</div>

<div onclick="location.href='calendar.html'">
予定
</div>

<div onclick="location.href='gomi.html'">
ゴミ
</div>

</div>

</div>

<script>

const SHEET_ID="149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc";
const SHEET_NAME="瓦版";

const url=
"https://docs.google.com/spreadsheets/d/"+
SHEET_ID+
"/gviz/tq?sheet="+
encodeURIComponent(SHEET_NAME)+
"&tqx=out:json";

function v(row,index){

if(!row.c[index]) return "";

if(row.c[index].v!==null && row.c[index].v!==undefined){
return String(row.c[index].v);
}

if(row.c[index].f){
return String(row.c[index].f);
}

return "";

}

function safeUrl(url){

if(!url) return "";

url=String(url).trim();

const match=url.match(/https?:\/\/[^\s"]+/);

return match ? match[0] : "";

}

function extractYouTubeId(url){

const s=String(url || '').trim();

if(!s) return '';

let m=s.match(/[?&]v=([a-zA-Z0-9_-]{6,})/);

if(m && m[1]) return m[1];

m=s.match(/youtu\.be\/([a-zA-Z0-9_-]{6,})/);

if(m && m[1]) return m[1];

m=s.match(/youtube\.com\/embed\/([a-zA-Z0-9_-]{6,})/);

if(m && m[1]) return m[1];

m=s.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]{6,})/);

if(m && m[1]) return m[1];

return '';

}

fetch(url)

.then(res=>res.text())

.then(text=>{

const json=JSON.parse(text.substring(47).slice(0,-2));

const rows=json.table.rows;

let html="";

let mediaMap={};

rows.forEach(row=>{

const date=v(row,0);

/*
P = 動画タイトル
Q = 動画詳細
R = メディアURL
*/

const mediaTitle=v(row,15);
const mediaDetail=v(row,16);
const mediaUrl=safeUrl(v(row,17));

if(mediaTitle && mediaUrl){

mediaMap[date]={
title:mediaTitle,
detail:mediaDetail,
url:mediaUrl
};

}

});

rows.reverse().forEach(row=>{

const date=v(row,0);

const title=v(row,2);
const image=safeUrl(v(row,3));
const body=v(row,4);

if(!title && !image && !body) return;

html+=`
<div class="card">
`;

if(image){

html+=`
<img class="kawaraban" src="${image}">
`;

}

html+=`

<div class="cardTitle">
${title || "四市瓦版"}
</div>

<div class="cardText">
${body || ""}
</div>

`;

html+=`
<div class="sectionTitle">
🔗 情報リンク
</div>
`;

for(let i=5;i<=14;i+=2){

const linkTitle=v(row,i);
const linkUrl=safeUrl(v(row,i+1));

if(linkTitle && linkUrl){

html+=`
<a class="linkBtn" href="${linkUrl}" target="_blank">
${linkTitle}
</a>
`;

}

}

if(mediaMap[date]){

const ytId=extractYouTubeId(mediaMap[date].url);

if(ytId){

html+=`

<div class="videoBox">

<div class="videoTitle">
🎬 ${mediaMap[date].title}

${mediaMap[date].detail || ""}
</div>

<iframe
class="videoFrame"
src="https://www.youtube.com/embed/${ytId}?playsinline=1&rel=0"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
allowfullscreen>
</iframe>

</div>

`;

}

}

html+=`
</div>
`;

});

if(!html){

html=`
<div class="card">
<div class="loading">
表示できる情報がありません
</div>
</div>
`;

}

document.getElementById("content").innerHTML=html;

})

.catch(err=>{

document.getElementById("content").innerHTML=
`
<div class="card">
<div class="loading">
読み込みできませんでした
</div>
</div>
`;

console.log(err);

});

</script>

</body>
</html>
