<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4市瓦版</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
background:#eef3f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#111827;
}

.wrap{
max-width:700px;
margin:auto;
padding:16px;
}

.header{
background:linear-gradient(135deg,#0f172a,#1d4ed8,#2563eb);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
font-size:38px;
font-weight:900;
box-shadow:0 10px 30px rgba(0,0,0,.25);
margin-bottom:20px;
}

.homeBtn{

width:100%;

border:none;

border-radius:24px;

padding:24px;

margin-top:20px;

background:linear-gradient(
135deg,
#475569,
#64748b
);

color:#fff;

font-size:26px;

font-weight:900;

cursor:pointer;

}

.loading{
background:#fff;
padding:30px;
border-radius:24px;
text-align:center;
font-size:24px;
font-weight:900;
}

.card{
background:#fff;
border-radius:30px;
overflow:hidden;
margin-bottom:24px;
box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.thumb{
width:100%;
display:block;
}

.date{
padding:20px 22px 0;
font-size:20px;
font-weight:900;
color:#64748b;
}

.tag{
display:inline-block;
margin:16px 22px;
padding:10px 16px;
border-radius:999px;
background:#dbeafe;
color:#1d4ed8;
font-size:18px;
font-weight:900;
}

.title{
padding:0 22px;
font-size:38px;
font-weight:900;
line-height:1.45;
}

.desc{
padding:20px 22px;
font-size:26px;
line-height:1.8;
color:#475569;
}

.share{
display:flex;
flex-direction:column;
gap:14px;
padding:0 22px 24px;
}

.share button{
width:100%;
background:linear-gradient(
180deg,
#374151,
#111827
);
color:#fff;
border:none;
border-radius:24px;
padding:24px;
font-size:24px;
font-weight:900;
text-align:left;
cursor:pointer;
}

.share button:after{

content:" ＞";

float:right;

opacity:.8;

}

</style>

</head>

<body>

<div class="wrap">

<div class="header">
📰 4市瓦版
</div>

<div id="app">
<div class="loading">読込中...</div>
</div>

<button
class="homeBtn"
onclick="location.href='https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/'">

🏠 トップへ戻る

</button>

</div>

<script>

function makeShareUrl(id){

return "https://ichirohns-jpg.github.io/nsaw-anshin-dx-1/share-kawaraban-v2.html?kawaraban="
+ encodeURIComponent(id);

}

function shareFacebook(url){

window.open(
"https://www.facebook.com/sharer/sharer.php?u="
+ encodeURIComponent(url),
"_blank"
);

}

function shareLine(url){

window.open(
"https://social-plugins.line.me/lineit/share?url="
+ encodeURIComponent(url),
"_blank"
);

}

function shareX(url,text){

window.open(
"https://twitter.com/intent/tweet?url="
+ encodeURIComponent(url)
+ "&text="
+ encodeURIComponent(text),
"_blank"
);

}

function copyUrl(url){

navigator.clipboard.writeText(url);

alert("URLをコピーしました");

}

const SHEET_NAME="4市瓦版";

const GVIZ_URL=
"https://docs.google.com/spreadsheets/d/"
+ SHEET_ID +
"/gviz/tq?sheet="
