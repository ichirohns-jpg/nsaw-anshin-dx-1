<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>近くの避難所</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
}

.header{
background:linear-gradient(135deg,#7c3aed,#6d28d9);
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:36px;
font-weight:900;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-bottom:18px;
}

.card{
background:#fff;
border-radius:28px;
padding:24px;
text-decoration:none;
text-align:center;
color:#1f2d3d;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.icon{
font-size:52px;
margin-bottom:10px;
}

.title{
font-size:22px;
font-weight:900;
}

.map{
width:100%;
height:65vh;
border:none;
border-radius:30px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
margin-bottom:18px;
}

.btn{
display:block;
width:100%;
padding:22px;
background:#475569;
color:#fff;
text-decoration:none;
text-align:center;
border-radius:20px;
font-size:24px;
font-weight:900;
}

</style>

</head>

<body>

<div class="header">
<h1>🚨 近くの避難所</h1>
</div>

<div class="grid">

<a href="https://www.google.com/maps/search/避難所" target="_blank" class="card">
<div class="icon">🚨</div>
<div class="title">避難所</div>
</a>

<a href="https://www.google.com/maps/search/防災公園" target="_blank" class="card">
<div class="icon">🏕️</div>
<div class="title">防災公園</div>
</a>

</div>

<iframe
class="map"
src="https://maps.google.com/maps?q=避難所&z=15&output=embed">
</iframe>

<a
href="https://www.google.com/maps/search/避難所"
target="_blank"
class="btn">

📍 Googleマップで探す

</a>

<br>

<a
href="index.html"
class="btn">

🏠 トップへ戻る

</a>

</body>
</html>
