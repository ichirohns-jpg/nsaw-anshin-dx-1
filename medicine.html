<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>服薬確認</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:15px;
color:#1f2d3d;
}

.wrap{
max-width:800px;
margin:auto;
}

.header{
background:linear-gradient(135deg,#4caf50,#2e7d32);
color:#fff;
padding:24px;
border-radius:24px;
text-align:center;
font-size:34px;
font-weight:900;
margin-bottom:16px;
}

.card{
background:#fff;
border-radius:24px;
padding:20px;
margin-bottom:16px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.med{
font-size:28px;
font-weight:900;
margin-bottom:15px;
text-align:center;
}

.time{
font-size:20px;
margin-bottom:15px;
text-align:center;
}

.result{
font-size:24px;
font-weight:900;
text-align:center;
padding:20px;
}

.btn{
width:100%;
border:none;
border-radius:18px;
padding:22px;
font-size:28px;
font-weight:900;
cursor:pointer;
margin-bottom:12px;
}

.ok{
background:#4caf50;
color:#fff;
}

.ng{
background:#f44336;
color:#fff;
}

.back{
background:#666;
color:#fff;
}

</style>

</head>

<body>

<div class="wrap">

<div class="header">
💊 服薬確認
</div>

<div class="card">

<div class="med">
本日の服薬
</div>

<div
id="todayDate"
class="time">
読込中...
</div>

<button
class="btn ok"
onclick="takeMedicine()">
💊 飲みました
</button>

<button
class="btn ng"
onclick="notTakeMedicine()">
⚠️ まだです
</button>

<div
id="result"
class="result">
未確認
</div>

<button
class="btn back"
onclick="history.back()">
戻る
</button>

</div>

<script>

const today =
new Date();

document.getElementById(
"todayDate"
).innerHTML =
today.toLocaleDateString(
"ja-JP"
);

function saveMedicine(status){

const now =
new Date();

if(status==="ok"){

localStorage.setItem(
"medicineStatus",
"服薬済"
);

localStorage.setItem(
"medicineTime",
now.toLocaleString("ja-JP")
);

document.getElementById(
"result"
).innerHTML =

"✅ 服薬済<br><br>" +

now.toLocaleString(
"ja-JP"
);

}else{

localStorage.setItem(
"medicineStatus",
"未服薬"
);

localStorage.setItem(
"medicineTime",
now.toLocaleString("ja-JP")
);

document.getElementById(
"result"
).innerHTML =

"⚠️ 未服薬<br><br>" +

now.toLocaleString(
"ja-JP"
);

}

}

function takeMedicine(){

saveMedicine(
"ok"
);

}

function notTakeMedicine(){

saveMedicine(
"ng"
);

}

window.onload=function(){

const status =
localStorage.getItem(
"medicineStatus"
);

const time =
localStorage.getItem(
"medicineTime"
);

if(status){

document.getElementById(
"result"
).innerHTML =

status +
"<br><br>" +
(time || "");

}

};

</script>

</body>
</html>
