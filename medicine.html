<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>服薬確認</title>

<link rel="icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
background:linear-gradient(180deg,#000000 0%,#08111d 50%,#000000 100%);
color:#fff;
min-height:100vh;
}

.wrap{
max-width:760px;
margin:auto;
padding:16px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:20px;
margin-bottom:16px;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
margin-bottom:20px;
}

.name{
font-size:26px;
font-weight:900;
text-align:center;
margin-bottom:10px;
}

button{
width:100%;
border:none;
cursor:pointer;
color:#fff;
font-weight:900;
padding:22px;
border-radius:20px;
font-size:24px;
margin-bottom:12px;
}

.morning-btn{
background:linear-gradient(135deg,#ff9800,#ffb74d);
}

.noon-btn{
background:linear-gradient(135deg,#2196f3,#64b5f6);
}

.evening-btn{
background:linear-gradient(135deg,#8e24aa,#ba68c8);
}

.night-btn{
background:linear-gradient(135deg,#455a64,#78909c);
}

.extra-btn{
background:linear-gradient(135deg,#26a69a,#4db6ac);
}

.home-btn{
background:linear-gradient(135deg,#37474f,#607d8b);
}

.msg{
text-align:center;
font-size:20px;
font-weight:900;
margin-top:10px;
min-height:30px;
}

.history{
background:rgba(255,255,255,.08);
border-radius:18px;
padding:12px;
margin-bottom:10px;
}

.footer{
text-align:center;
padding:20px;
font-size:12px;
opacity:.6;
}

</style>
</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
💊 服薬確認
</div>

<div
id="userName"
class="name">
読み込み中...
</div>

<button
class="morning-btn"
onclick="saveMedicine('朝')">
🌅 朝の薬
</button>

<button
class="noon-btn"
onclick="saveMedicine('昼')">
☀ 昼の薬
</button>

<button
class="evening-btn"
onclick="saveMedicine('夕')">
🌇 夕の薬
</button>

<button
class="night-btn"
onclick="saveMedicine('就寝前')">
🌙 就寝前の薬
</button>

<button
class="extra-btn"
onclick="saveMedicine('頓服')">
🩺 頓服
</button>

<div
id="msg"
class="msg">
</div>

</div>

<div class="card">

<div id="historyArea">
読み込み中...
</div>

</div>

<div class="card">

<button
class="home-btn"
onclick="location.href='app.html?id='+USER_ID">
😊 本人ページ
</button>

<button
class="home-btn"
onclick="location.href='index.html'">
🏠 ホームへ戻る
</button>

</div>

<div class="footer">
NSAW 服薬確認
</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

const params =
new URLSearchParams(location.search);

const USER_ID =
params.get("id") || "";

async function loadUser(){

try{

const response =
await fetch(
GAS_URL +
"?action=user&id=" +
encodeURIComponent(USER_ID)
);

const json =
await response.json();

const user =
json.data || {};

document.getElementById("userName").innerHTML =
user.name || "利用者";

}catch(error){

document.getElementById("userName").innerHTML =
"利用者";

}

}

async function saveMedicine(type){

document.getElementById("msg").innerHTML =
"記録中...";

try{

const body =
new URLSearchParams();

body.append("action","watch");
body.append("id",USER_ID);
body.append("status","服薬");
body.append("memo",type);

await fetch(
GAS_URL,
{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:body.toString()
}
);

document.getElementById("msg").innerHTML =
type + " を記録しました";

loadHistory();

}catch(error){

document.getElementById("msg").innerHTML =
"通信エラー";

}

}

async function loadHistory(){

try{

const response =
await fetch(
GAS_URL +
"?action=dashboard&id=" +
encodeURIComponent(USER_ID)
);

const json =
await response.json();

const history =
json.history || [];

let html = "";

history.forEach(item=>{

if(item.status !== "服薬"){
return;
}

html += `
<div class="history">

<div>
${item.time || ""}
</div>

<div>
💊 ${item.memo || ""}
</div>

</div>
`;

});

document.getElementById("historyArea").innerHTML =
html || "服薬履歴なし";

}catch(error){

document.getElementById("historyArea").innerHTML =
"取得エラー";

}

}

loadUser();
loadHistory();

</script>

</body>
</html>
