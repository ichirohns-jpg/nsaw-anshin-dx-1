<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>薬確認｜見守りDX</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:560px;
margin:auto;
padding:16px;
}

.header{
background:#1565c0;
color:#fff;
border-radius:26px;
padding:22px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.back{
font-size:16px;
font-weight:900;
margin-bottom:12px;
cursor:pointer;
}

.title{
font-size:34px;
font-weight:900;
}

.sub{
font-size:16px;
margin-top:6px;
opacity:.95;
}

.card{
background:#fff;
border-radius:26px;
padding:20px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.item{
background:#f5f9ff;
border-left:8px solid #1565c0;
border-radius:18px;
padding:18px;
margin-bottom:16px;
}

.time{
font-size:22px;
font-weight:900;
color:#1565c0;
margin-bottom:8px;
}

.name{
font-size:26px;
font-weight:900;
margin-bottom:8px;
}

.memo{
font-size:17px;
font-weight:700;
line-height:1.7;
color:#666;
}

.btn{
width:100%;
border:none;
border-radius:22px;
padding:20px;
font-size:24px;
font-weight:900;
color:#fff;
background:#1565c0;
margin-top:14px;
cursor:pointer;
}

.btn:active{
transform:scale(.97);
}

.footer{
display:flex;
justify-content:space-around;
margin-top:20px;
padding:18px 0;
background:#fff;
border-radius:22px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
font-size:14px;
font-weight:900;
color:#666;
}

.toast{
position:fixed;
left:50%;
bottom:30px;
transform:translateX(-50%);
background:#1565c0;
color:#fff;
padding:16px 24px;
border-radius:18px;
font-size:18px;
font-weight:900;
display:none;
z-index:9999;
}

</style>
</head>

<body>

<div class="wrap">

<div class="header">

<div class="back" onclick="location.href='index.html'">
← トップへ戻る
</div>

<div class="title">
💊 薬確認
</div>

<div class="sub">
薬の確認を行います
</div>

</div>

<div class="card">

<div class="item">

<div class="time">
朝 09:00
</div>

<div class="name">
朝の薬
</div>

<div class="memo">
朝食後に服用してください。
</div>

<button class="btn" onclick="done('朝の薬を確認しました')">
✅ 確認しました
</button>

</div>

<div class="item">

<div class="time">
昼 13:00
</div>

<div class="name">
昼の薬
</div>

<div class="memo">
飲み忘れに注意してください。
</div>

<button class="btn" onclick="done('昼の薬を確認しました')">
✅ 確認しました
</button>

</div>

<div class="item">

<div class="time">
夜 19:00
</div>

<div class="name">
夜の薬
</div>

<div class="memo">
寝る前に確認してください。
</div>

<button class="btn" onclick="done('夜の薬を確認しました')">
✅ 確認しました
</button>

</div>

</div>

<div class="footer">

<div onclick="location.href='index.html'">
見守り
</div>

<div onclick="location.href='schedule.html'">
予定
</div>

<div onclick="location.href='gomi.html'">
ゴミ
</div>

<div onclick="location.href='news.html'">
地域情報
</div>

</div>

</div>

<div id="toast" class="toast"></div>

<script>

function done(text){

const toast=document.getElementById("toast");

toast.innerText=text;

toast.style.display="block";

setTimeout(function(){
toast.style.display="none";
},2000);

}

</script>

</body>
</html>
