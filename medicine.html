<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>服薬確認</title>

<link rel="icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
background:linear-gradient(180deg,#000000 0%,#08111d 50%,#000000 100%);
color:#fff;
min-height:100vh;
}

.wrap{
max-width:800px;
margin:auto;
padding:16px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:20px;
margin-bottom:16px;
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
margin-bottom:20px;
}

button{
width:100%;
border:none;
border-radius:24px;
padding:28px;
font-size:28px;
font-weight:900;
color:#fff;
margin-bottom:14px;
cursor:pointer;
}

.morning{
background:linear-gradient(135deg,#ff9800,#ffb74d);
}

.noon{
background:linear-gradient(135deg,#42a5f5,#64b5f6);
}

.night{
background:linear-gradient(135deg,#8e24aa,#ba68c8);
}

.sleep{
background:linear-gradient(135deg,#37474f,#607d8b);
}

.home{
background:linear-gradient(135deg,#00a3c4,#00d4ff);
}

.log{
background:rgba(255,255,255,.08);
padding:15px;
border-radius:18px;
margin-bottom:10px;
}

</style>

</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
💊 服薬確認
</div>

<button
class="morning"
onclick="saveMedicine('朝')">
🌅 朝の薬
</button>

<button
class="noon"
onclick="saveMedicine('昼')">
☀ 昼の薬
</button>

<button
class="night"
onclick="saveMedicine('夜')">
🌙 夜の薬
</button>

<button
class="sleep"
onclick="saveMedicine('寝る前')">
😴 寝る前の薬
</button>

<button
class="home"
onclick="history.back()">
🏠 戻る
</button>

</div>

<div class="card">

<div id="historyArea">
読み込み中...
</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

const USER_ID =
new URLSearchParams(
location.search
).get("id") || "";

async function saveMedicine(type){

try{

const body =
new URLSearchParams();

body.append(
"action",
"watch"
);

body.append(
"id",
USER_ID
);

body.append(
"status",
"💊" + type + "服薬"
);

body.append(
"memo",
type + "の薬を飲みました"
);

const response =
await fetch(
GAS_URL,
{
method:"POST",
headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},
body:body.toString()
}
);

const json =
await response.json();

if(json.status==="OK"){

alert(
type + "の服薬を記録しました"
);

loadHistory();

}

}catch(error){

alert(
"保存失敗"
);

}

}

async function loadHistory(){

try{

const response =
await fetch(
GAS_URL +
"?action=records&id=" +
encodeURIComponent(USER_ID)
);

const json =
await response.json();

const data =
json.data || [];

let html = "";

data.forEach(item=>{

if(
String(item.status || "")
.indexOf("服薬") === -1
){
return;
}

html += `
<div class="log">

<div style="
font-size:18px;
font-weight:900;
margin-bottom:5px;
">
${item.status || ""}
</div>

<div style="
opacity:.8;
font-size:14px;
">
${item.date || ""}
</div>

</div>
`;

});

document.getElementById(
"historyArea"
).innerHTML =
html ||
"服薬履歴なし";

}catch(error){

document.getElementById(
"historyArea"
).innerHTML =
"取得失敗";

}

}

loadHistory();

</script>

</body>
</html>
