<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>服薬確認</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
}

.header{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:#fff;
padding:24px;
border-radius:24px;
margin-bottom:16px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.btn{
width:100%;
border:none;
padding:24px;
border-radius:20px;
font-size:28px;
font-weight:900;
color:#fff;
margin-bottom:12px;
}

.morning{
background:#f59e0b;
}

.noon{
background:#22c55e;
}

.evening{
background:#3b82f6;
}

.night{
background:#7c3aed;
}

.status{
font-size:22px;
line-height:1.8;
font-weight:900;
}

.home{
display:block;
background:#475569;
color:#fff;
text-decoration:none;
padding:20px;
border-radius:20px;
text-align:center;
font-size:22px;
font-weight:900;
}

</style>

</head>

<body>

<div class="header">
<h1>💊 服薬確認</h1>
</div>

<div class="card">

<button
class="btn morning"
onclick="saveMedicine('朝の薬')">
🌅 朝の薬
</button>

<button
class="btn noon"
onclick="saveMedicine('昼の薬')">
☀️ 昼の薬
</button>

<button
class="btn evening"
onclick="saveMedicine('夕方の薬')">
🌇 夕方の薬
</button>

<button
class="btn night"
onclick="saveMedicine('寝る前の薬')">
🌙 寝る前の薬
</button>

</div>

<div class="card">

<div
id="statusArea"
class="status">

記録なし

</div>

</div>

<a
href="index.html"
class="home">

🏠 トップへ戻る

</a>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec';

function saveMedicine(type){

const now =
new Date()
.toLocaleString(
'ja-JP'
);

const userId =
localStorage.getItem(
'userId'
) || '';

const form =
new FormData();

form.append(
'action',
'watch'
);

form.append(
'id',
userId
);

form.append(
'status',
'服薬'
);

form.append(
'memo',
type
);

fetch(
GAS_URL,
{
method:'POST',
body:form
}
)

.then(r=>r.text())

.then(()=>{

localStorage.setItem(
'lastMedicine',
JSON.stringify({
type:type,
time:now
})
);

document.getElementById(
'statusArea'
).innerHTML =

'☑ ' +

type +

'<br><br>' +

now;

alert(
'服薬を記録しました'
);

});

}

const last =
JSON.parse(
localStorage.getItem(
'lastMedicine'
) || 'null'
);

if(last){

document.getElementById(
'statusArea'
).innerHTML =

'☑ ' +

last.type +

'<br><br>' +

last.time;

}

</script>

</body>
</html>
