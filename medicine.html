<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>服薬確認</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
}

.header{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:#fff;
padding:24px;
border-radius:24px;
margin-bottom:16px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.btn{
width:100%;
border:none;
padding:24px;
border-radius:20px;
font-size:28px;
font-weight:900;
color:#fff;
margin-bottom:12px;
cursor:pointer;
}

.morning{
background:#f59e0b;
}

.noon{
background:#22c55e;
}

.evening{
background:#3b82f6;
}

.night{
background:#7c3aed;
}

.status{
font-size:22px;
line-height:1.8;
font-weight:900;
}

.home{
display:block;
background:#475569;
color:#fff;
text-decoration:none;
padding:20px;
border-radius:20px;
text-align:center;
font-size:22px;
font-weight:900;
}

</style>

</head>

<body>

<div class="header">
<h1>💊 服薬確認</h1>
</div>

<div class="card">

<button
class="btn morning"
onclick="saveMedicine('朝')">
🌅 朝の薬
</button>

<button
class="btn noon"
onclick="saveMedicine('昼')">
☀️ 昼の薬
</button>

<button
class="btn evening"
onclick="saveMedicine('夕方')">
🌇 夕方の薬
</button>

<button
class="btn night"
onclick="saveMedicine('寝る前')">
🌙 寝る前の薬
</button>

</div>

<div class="card">

<div
id="statusArea"
class="status">

記録なし

</div>

</div>

<a
href="index.html"
class="home">

🏠 トップへ戻る

</a>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec';

const USER_ID =
localStorage.getItem('userId') || '';

const USER_NAME =
localStorage.getItem('userName') || '';

function saveMedicine(type){

const formData =
new URLSearchParams();

formData.append(
'action',
'watch'
);

formData.append(
'id',
USER_ID
);

formData.append(
'name',
USER_NAME
);

formData.append(
'status',
'服薬'
);

formData.append(
'memo',
type
);

fetch(
GAS_URL,
{
method:'POST',
headers:{
'Content-Type':
'application/x-www-form-urlencoded'
},
body:formData.toString()
}
)
.then(r=>r.json())
.then(res=>{

const data =
JSON.parse(
localStorage.getItem(
'medicineStatus'
) || '{}'
);

if(type==='朝'){
data.morning=true;
}

if(type==='昼'){
data.noon=true;
}

if(type==='夕方'){
data.evening=true;
}

if(type==='寝る前'){
data.night=true;
}

data.time =
new Date()
.toLocaleString(
'ja-JP'
);

localStorage.setItem(
'medicineStatus',
JSON.stringify(data)
);

showStatus();

alert(
type +
'の薬を記録しました'
);

})
.catch(()=>{

alert(
'通信エラー'
);

});

}

function showStatus(){

const data =
JSON.parse(
localStorage.getItem(
'medicineStatus'
) || '{}'
);

let html='';

html += data.morning ?
'☑ 朝の薬<br>' :
'☐ 朝の薬<br>';

html += data.noon ?
'☑ 昼の薬<br>' :
'☐ 昼の薬<br>';

html += data.evening ?
'☑ 夕方の薬<br>' :
'☐ 夕方の薬<br>';

html += data.night ?
'☑ 寝る前の薬<br>' :
'☐ 寝る前の薬<br>';

if(data.time){

html +=
'<br>最終記録<br>' +
data.time;

}

document.getElementById(
'statusArea'
).innerHTML =
html;

}

showStatus();

</script>

</body>
</html>
