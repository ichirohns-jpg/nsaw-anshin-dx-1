<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>服薬確認</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
}

.header{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:#fff;
padding:24px;
border-radius:24px;
margin-bottom:16px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.btn{
width:100%;
border:none;
padding:24px;
border-radius:20px;
font-size:28px;
font-weight:900;
color:#fff;
margin-bottom:12px;
}

.morning{
background:#f59e0b;
}

.noon{
background:#22c55e;
}

.evening{
background:#3b82f6;
}

.night{
background:#7c3aed;
}

.status{
font-size:22px;
line-height:1.8;
font-weight:900;
}

.home{
display:block;
background:#475569;
color:#fff;
text-decoration:none;
padding:20px;
border-radius:20px;
text-align:center;
font-size:22px;
font-weight:900;
}

</style>

</head>

<body>

<div class="header">
<h1>💊 服薬確認</h1>
</div>

<div class="card">

<button
class="btn morning"
onclick="saveMedicine('morning')">
🌅 朝の薬
</button>

<button
class="btn noon"
onclick="saveMedicine('noon')">
☀️ 昼の薬
</button>

<button
class="btn evening"
onclick="saveMedicine('evening')">
🌇 夕方の薬
</button>

<button
class="btn night"
onclick="saveMedicine('night')">
🌙 寝る前の薬
</button>

</div>

<div class="card">

<div
id="statusArea"
class="status">

記録なし

</div>

</div>

<a
href="index.html"
class="home">

🏠 トップへ戻る

</a>

<script>

function saveMedicine(type){

const data =
JSON.parse(
localStorage.getItem(
'medicineStatus'
) || '{}'
);

data[type] = true;

data.time =
new Date()
.toLocaleString(
'ja-JP'
);

localStorage.setItem(
'medicineStatus',
JSON.stringify(data)
);

showStatus();

alert(
'記録しました'
);

}

function showStatus(){

const data =
JSON.parse(
localStorage.getItem(
'medicineStatus'
) || '{}'
);

let html = '';

html += data.morning ?
'☑ 朝の薬<br>' :
'☐ 朝の薬<br>';

html += data.noon ?
'☑ 昼の薬<br>' :
'☐ 昼の薬<br>';

html += data.evening ?
'☑ 夕方の薬<br>' :
'☐ 夕方の薬<br>';

html += data.night ?
'☑ 寝る前の薬<br>' :
'☐ 寝る前の薬<br>';

if(data.time){

html +=
'<br>最終記録<br>' +
data.time;

}

document.getElementById(
'statusArea'
).innerHTML =
html;

}

showStatus();

</script>

</body>
</html>
