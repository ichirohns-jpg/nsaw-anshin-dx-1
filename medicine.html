<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>服薬確認</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
}

.header{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:36px;
font-weight:900;
}

.btn{
display:block;
width:100%;
padding:30px;
border:none;
border-radius:24px;
font-size:30px;
font-weight:900;
margin-bottom:14px;
color:#fff;
cursor:pointer;
}

.morning{
background:#f59e0b;
}

.noon{
background:#16a34a;
}

.evening{
background:#2563eb;
}

.night{
background:#7c3aed;
}

.gray{
background:#475569;
}

.result{
background:#fff;
padding:24px;
border-radius:24px;
font-size:24px;
font-weight:900;
text-align:center;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.done{
opacity:.45;
}

</style>

</head>

<body>

<div class="header">
<h1>💊 服薬確認</h1>
</div>

<div
id="result"
class="result">

服薬してください

</div>

<button
id="morningBtn"
class="btn morning"
onclick="takeMedicine('朝')">
🌅 朝の薬
</button>

<button
id="noonBtn"
class="btn noon"
onclick="takeMedicine('昼')">
☀️ 昼の薬
</button>

<button
id="eveningBtn"
class="btn evening"
onclick="takeMedicine('夕方')">
🌆 夕方の薬
</button>

<button
id="nightBtn"
class="btn night"
onclick="takeMedicine('寝る前')">
🌙 寝る前の薬
</button>

<a
href="app.html"
class="btn gray">
🏠 本人ページへ戻る
</a>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec';

function takeMedicine(type){

fetch(
GAS_URL,
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify({

type:'medicine',

name:
localStorage.getItem(
'userName'
) || '利用者',

userId:
localStorage.getItem(
'userId'
) || '',

medicine:type,

time:
new Date().toLocaleString('ja-JP')

})
}
);

document.getElementById(
'result'
).innerHTML =
'💊 ' + type + 'の薬を記録しました';

if(type==='朝'){
document.getElementById(
'morningBtn'
).classList.add('done');
}

if(type==='昼'){
document.getElementById(
'noonBtn'
).classList.add('done');
}

if(type==='夕方'){
document.getElementById(
'eveningBtn'
).classList.add('done');
}

if(type==='寝る前'){
document.getElementById(
'nightBtn'
).classList.add('done');
}

}

</script>

</body>
</html>
