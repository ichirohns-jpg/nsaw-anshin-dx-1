<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbxHknfXsWiwwIhuJ88JFDNRi51jEvD-vgzdeld3YTnfL_0CsrhKmTzxaWUFLVnisRCp/exec";

async function done(type){

const msg =
document.getElementById("msg");

msg.innerHTML =
"送信中...";

try{

const params =
new URLSearchParams();

params.append(
"name",
"山口貞一郎"
);

params.append(
"status",
"服薬確認"
);

params.append(
"memo",
type
);

params.append(
"time",
new Date().toLocaleString("ja-JP")
);

const response =
await fetch(
GAS_URL,
{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:params.toString()
}
);

const result =
await response.text();

if(
response.ok &&
result.indexOf("ERROR") === -1
){

msg.innerHTML =
"✓ " + type;

const buttons =
document.querySelectorAll(".btn");

buttons.forEach(btn=>{

if(
btn.getAttribute("onclick") &&
btn.getAttribute("onclick").includes(type)
){

btn.disabled = true;

btn.style.opacity = ".5";

btn.innerHTML =
"確認済み";

}

});

}else{

msg.innerHTML =
"送信失敗";

}

}catch(error){

msg.innerHTML =
"通信エラー";

}

}

</script>
