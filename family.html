<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>見守りDX｜家族・支援者</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

body{
background:
linear-gradient(
180deg,
#050505 0%,
#101827 50%,
#000000 100%
);
font-family:
"Hiragino Sans",
"Yu Gothic",
sans-serif;
color:#fff;
min-height:100vh;
}

.wrap{
max-width:900px;
margin:auto;
padding:18px;
}

header{
text-align:center;
padding:25px 10px;
}

.logo{
font-size:34px;
font-weight:900;
letter-spacing:3px;
}

.sub{
font-size:14px;
opacity:.8;
margin-top:8px;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.15);
border-radius:28px;
padding:20px;
margin-bottom:18px;
box-shadow:
0 10px 30px rgba(0,0,0,.4);
}

.title{
font-size:22px;
font-weight:900;
margin-bottom:15px;
}

button{
width:100%;
border:none;
border-radius:20px;
padding:18px;
font-size:20px;
font-weight:900;
color:#fff;
cursor:pointer;
margin-bottom:12px;
}

.btn-blue{
background:
linear-gradient(
135deg,
#1565c0,
#42a5f5
);
}

.btn-green{
background:
linear-gradient(
135deg,
#00c853,
#00e676
);
}

.btn-orange{
background:
linear-gradient(
135deg,
#ff9800,
#ffc107
);
}

.btn-red{
background:
linear-gradient(
135deg,
#d50000,
#ff1744
);
}

.btn-home{
background:
linear-gradient(
135deg,
#455a64,
#78909c
);
}

.btn-top{
background:
linear-gradient(
135deg,
#673ab7,
#9575cd
);
}

.list{
max-height:400px;
overflow:auto;
}

.item{
background:rgba(255,255,255,.08);
padding:12px;
border-radius:14px;
margin-bottom:10px;
}

.name{
font-size:20px;
font-weight:900;
}

.status{
font-size:18px;
margin-top:4px;
}

.time{
font-size:13px;
opacity:.8;
margin-top:4px;
}

.memo{
margin-top:8px;
line-height:1.5;
}

.small{
font-size:14px;
line-height:1.6;
}

.footer{
text-align:center;
padding:25px;
font-size:12px;
opacity:.6;
}

</style>
</head>

<body>

<div class="wrap">

<header>

<div class="logo">
見守りDX
</div>

<div class="sub">
LEXUS STYLE FAMILY MONITOR
</div>

</header>

<div class="card">

<div class="title">
見守り状況
</div>

<button
class="btn-green"
onclick="loadRecords()">
最新状況を更新
</button>

<div id="records" class="list">
読み込み中...
</div>

</div>

<div class="card">

<div class="title">
利用者一覧
</div>

<button
class="btn-orange"
onclick="loadUsers()">
利用者を取得
</button>

<div id="users" class="list">
未取得
</div>

</div>

<div class="card">

<div class="title">
サーバー確認
</div>

<button
class="btn-red"
onclick="ping()">
PING
</button>

<div
id="ping"
class="small">
未確認
</div>

</div>

<div class="card">

<button
class="btn-home"
onclick="location.href='index.html'">
ホームへ戻る
</button>

<button
class="btn-top"
onclick="window.scrollTo({top:0,behavior:'smooth'})">
先頭へ戻る
</button>

</div>

<div class="footer">
NSAW 見守りDX
</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbxHknfXsWiwwIhuJ88JFDNRi51jEvD-vgzdeld3YTnfL_0CsrhKmTzxaWUFLVnisRCp/exec";

function loadRecords(){

document.getElementById("records").innerHTML =
"読み込み中...";

fetch(
GAS_URL + "?action=records"
)
.then(r => r.json())
.then(d => {

let html = "";

(d.data || []).forEach(v => {

html += `
<div class="item">

<div class="name">
${v.name || ""}
</div>

<div class="status">
状態：${v.status || ""}
</div>

<div class="time">
${v.time || ""}
</div>

<div class="memo">
${v.memo || ""}
</div>

</div>
`;

});

document.getElementById("records").innerHTML =
html || "データなし";

})
.catch(err => {

document.getElementById("records").innerHTML =
"取得失敗";

console.error(err);

});

}

function loadUsers(){

document.getElementById("users").innerHTML =
"読み込み中...";

fetch(
GAS_URL + "?action=users"
)
.then(r => r.json())
.then(d => {

let html = "";

(d.data || []).forEach(v => {

html += `
<div class="item">

<div class="name">
${v.name || ""}
</div>

<div class="memo">
ID : ${v.id || ""}
<br>
住所 : ${v.address || ""}
</div>

</div>
`;

});

document.getElementById("users").innerHTML =
html || "利用者なし";

})
.catch(err => {

document.getElementById("users").innerHTML =
"取得失敗";

console.error(err);

});

}

function ping(){

document.getElementById("ping").innerHTML =
"確認中...";

fetch(
GAS_URL + "?action=ping"
)
.then(r => r.json())
.then(d => {

document.getElementById("ping").innerHTML =
`
稼働状態 : ${d.status || ""}
<br>
時刻 : ${d.time || ""}
`;

})
.catch(err => {

document.getElementById("ping").innerHTML =
"接続失敗";

console.error(err);

});

}

loadRecords();
ping();

</script>

</body>
</html>
