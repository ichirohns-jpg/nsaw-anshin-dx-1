<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家族ページ</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:600px;
margin:auto;
padding:18px 14px 34px;
}

.card{
background:#fff;
border-radius:26px;
padding:24px 20px;
margin-bottom:18px;
box-shadow:0 8px 22px rgba(0,0,0,.10);
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
color:#7e57c2;
}

.name{
font-size:30px;
font-weight:900;
text-align:center;
margin-top:12px;
}

.status{
font-size:30px;
font-weight:900;
text-align:center;
padding:22px;
border-radius:20px;
margin-top:16px;
background:#e8f5e9;
}

.label{
font-size:22px;
font-weight:900;
margin-bottom:10px;
}

.value{
font-size:20px;
line-height:1.8;
word-break:break-all;
}

.mapBtn{
display:block;
width:100%;
background:#1976d2;
color:#fff;
text-decoration:none;
text-align:center;
padding:22px;
border-radius:20px;
font-size:24px;
font-weight:900;
margin-top:16px;
}

.reload{
display:block;
width:100%;
background:#2eaf66;
color:#fff;
text-decoration:none;
text-align:center;
padding:22px;
border-radius:20px;
font-size:24px;
font-weight:900;
margin-top:16px;
border:none;
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
家族ページ
</div>

<div class="name" id="name">
読み込み中...
</div>

<div class="status" id="status">
確認中...
</div>

<button class="reload" onclick="loadData()">
更新する
</button>

</div>

<div class="card">

<div class="label">
最終確認時刻
</div>

<div class="value" id="time">
--
</div>

</div>

<div class="card">

<div class="label">
種別
</div>

<div class="value" id="type">
--
</div>

</div>

<div class="card">

<div class="label">
GPS
</div>

<div class="value" id="gps">
--
</div>

<a
id="mapLink"
class="mapBtn"
target="_blank">
Googleマップで見る
</a>

</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbwC3CPMJlMl5o37qcxIcedcikLuxe6y_ANRjAeFnO9KtPEk9rw-LTu72Dyoq2XJKPET/exec";

const params =
new URLSearchParams(location.search);

const personId =
params.get("id") ||
localStorage.getItem("personId") ||
"yamaguchi";

function loadData(){

fetch(
GAS_URL + "?id=" + personId
)

.then(r=>r.json())

.then(data=>{

document.getElementById("name").innerHTML =
data.name || "未登録";

document.getElementById("status").innerHTML =
data.content || "データなし";

document.getElementById("time").innerHTML =
data.time || "--";

document.getElementById("type").innerHTML =
data.type || "--";

document.getElementById("gps").innerHTML =
data.gps || "GPSなし";

if(data.gps){

const gps =
data.gps.split(",");

if(gps.length===2){

document.getElementById("mapLink").href =
"https://maps.google.com/?q=" +
gps[0] + "," + gps[1];

}

}

})

.catch(()=>{

document.getElementById("status").innerHTML =
"取得失敗";

});

}

loadData();

</script>

</body>
</html>
