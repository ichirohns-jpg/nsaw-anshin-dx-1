<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>支援者ページ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#101827;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
color:#fff;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:linear-gradient(135deg,#1e293b,#0f172a);
padding:22px;
border-radius:24px;
margin-bottom:14px;
}

.title{
font-size:24px;
font-weight:900;
margin-bottom:12px;
}

.item{
padding:18px;
border-radius:18px;
background:rgba(255,255,255,.08);
font-size:20px;
font-weight:900;
line-height:1.8;
}

.sos{
border-left:8px solid #ef4444;
}

.genki{
border-left:8px solid #22c55e;
}

.medicine{
border-left:8px solid #3b82f6;
}

.gps{
border-left:8px solid #06b6d4;
}

.homeStatus{
border-left:8px solid #2563eb;
}

.schedule{
border-left:8px solid #8b5cf6;
}

.btn{
display:block;
width:100%;
padding:22px;
border-radius:22px;
text-decoration:none;
text-align:center;
font-size:24px;
font-weight:900;
color:#fff;
background:linear-gradient(135deg,#475569,#334155);
margin-top:16px;
}

.mapBtn{
display:block;
margin-top:12px;
padding:16px;
border-radius:16px;
background:#2563eb;
color:#fff;
text-decoration:none;
text-align:center;
font-weight:900;
}

</style>

</head>

<body>

<div class="header">
<h1>👪 支援者ページ</h1>
</div>

<div class="card">
<div class="title">🚨 SOS</div>
<div id="sosArea" class="item sos">読込中...</div>
</div>

<div class="card">
<div class="title">😊 今日の体調</div>
<div id="genkiArea" class="item genki">読込中...</div>
</div>

<div class="card">
<div class="title">🏠 帰宅しました</div>
<div id="homeArea" class="item homeStatus">読込中...</div>
</div>

<div class="card">
<div class="title">💊 服薬状況</div>
<div id="medicineArea" class="item medicine">読込中...</div>
</div>

<div class="card">
<div class="title">📅 今後の予定</div>
<div id="scheduleArea" class="item schedule">読込中...</div>
</div>

<div class="card">
<div class="title">📍 現在地</div>
<div id="gpsArea" class="item gps">読込中...</div>
</div>

<div class="card">
<div class="title">🚨 緊急連絡</div>
<div id="emergencyArea" class="item sos">読込中...</div>
</div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec';

const USER_ID =
localStorage.getItem('userId') || '';

function loadFamily(){

fetch(
GAS_URL +
'?action=records&id=' +
encodeURIComponent(USER_ID)
)

.then(r=>r.json())

.then(json=>{

const rows =
json.data || json || [];

let sos='記録なし';
let genki='記録なし';
let home='記録なし';
let medicine='';
let gps='記録なし';
let emergency='記録なし';

rows.forEach(row=>{

const status =
row.status || '';

const memo =
row.memo || '';

const time =
row.time || row.date || '';

if(status==='SOS'){

sos =
'🚨 ' +
memo +
'<br><br>' +
time;

}

if(status==='体調'){

genki =
'😊 ' +
memo +
'<br><br>' +
time;

}

if(status==='帰宅'){

home =
'🏠 ' +
memo +
'<br><br>' +
time;

}

if(status==='服薬'){

medicine +=
'💊 ' +
memo +
'<br>' +
time +
'<br><br>';

}

if(status==='GPS'){

gps =
'📍 最終位置取得<br><br>' +
time +
'<br><br>' +
'<a class="mapBtn" target="_blank" href="' +
memo +
'">📍 地図を見る</a>';

}

if(
status.indexOf('救急')>-1 ||
status.indexOf('困っています')>-1 ||
status.indexOf('電話してください')>-1
){

emergency =
status +
'<br><br>' +
time;

}

});

document.getElementById(
'sosArea'
).innerHTML =
sos;

document.getElementById(
'genkiArea'
).innerHTML =
genki;

document.getElementById(
'homeArea'
).innerHTML =
home;

document.getElementById(
'medicineArea'
).innerHTML =
medicine || '記録なし';

document.getElementById(
'gpsArea'
).innerHTML =
gps;

document.getElementById(
'emergencyArea'
).innerHTML =
emergency;

loadSchedule();

})

.catch(()=>{

document.getElementById(
'sosArea'
).innerHTML =
'取得失敗';

document.getElementById(
'genkiArea'
).innerHTML =
'取得失敗';

document.getElementById(
'homeArea'
).innerHTML =
'取得失敗';

document.getElementById(
'medicineArea'
).innerHTML =
'取得失敗';

document.getElementById(
'gpsArea'
).innerHTML =
'取得失敗';

document.getElementById(
'emergencyArea'
).innerHTML =
'取得失敗';

});

}

function loadSchedule(){

const userId =
localStorage.getItem(
'userId'
) || '';

fetch(
GAS_URL +
'?action=scheduleList&id=' +
encodeURIComponent(
userId
)
)

.then(r=>r.json())

.then(data=>{

let html='';

if(
!data.data ||
!data.data.length
){

html='予定なし';

}else{

data.data.forEach(item=>{

html +=

'📅 ' +
(item.date || '') +

'<br>' +

'📝 ' +
(item.title || '') +

'<br>' +

(item.memo || '') +

'<br><br>';

});

}

document.getElementById(
'scheduleArea'
).innerHTML =
html;

})

.catch(()=>{

document.getElementById(
'scheduleArea'
).innerHTML =
'取得失敗';

});

}

loadFamily();

setInterval(
loadFamily,
60000
);

</script>

<a
href="index.html"
class="btn">

🏠 トップへ戻る

</a>

</body>
</html>
