<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>家族ページ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
}

.header{
background:linear-gradient(135deg,#0f172a,#334155);
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.name{
font-size:34px;
font-weight:900;
}

.card{
background:#fff;
border-radius:30px;
padding:24px;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.title{
font-size:26px;
font-weight:900;
margin-bottom:12px;
}

.item{
font-size:24px;
line-height:2;
font-weight:900;
}

.btn{
display:block;
width:100%;
padding:22px;
margin-top:12px;
border-radius:20px;
text-align:center;
text-decoration:none;
font-size:24px;
font-weight:900;
color:#fff;
}

.map{
background:#2563eb;
}

.tel{
background:#16a34a;
}

</style>

</head>

<body>

<div class="header">
<div class="name">
👪 家族ページ
</div>
</div>

<div class="card">

<div class="title">
利用者状況
</div>

<div class="item">
😊 元気です
</div>

<div class="item">
💊 服薬済み
</div>

<div class="item">
🕒 最終確認
<br>
2026/06/13
</div>

</div>

<div class="card">

<div class="title">
現在地
</div>

<a
href="https://maps.google.com"
target="_blank"
class="btn map">
現在地を見る
</a>

<a
href="tel:00000000000"
class="btn tel">
電話する
</a>

</div>

</body>
</html>
