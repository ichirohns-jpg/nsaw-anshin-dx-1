<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ご家族確認</title>

<style>

body{
  margin:0;
  background:#eef3f8;
  font-family:sans-serif;
  color:#222;
}

.top{
  background:linear-gradient(135deg,#1565c0,#0d47a1);
  color:white;
  padding:34px 20px 40px;
  border-bottom-left-radius:34px;
  border-bottom-right-radius:34px;
  text-align:center;
}

.title{
  font-size:44px;
  font-weight:900;
}

.wrap{
  padding:18px;
}

.card{
  background:white;
  border-radius:30px;
  padding:28px;
  margin-bottom:24px;
  box-shadow:0 6px 18px rgba(0,0,0,.12);
}

.status{
  font-size:36px;
  font-weight:900;
  margin-bottom:16px;
}

.time{
  font-size:24px;
  color:#666;
  margin-bottom:12px;
}

.log{
  font-size:28px;
  line-height:1.7;
}

.green{
  color:#43a047;
}

.blue{
  color:#1565c0;
}

.red{
  color:#d32f2f;
}

.top-button{
  width:100%;
  border:none;
  border-radius:28px;
  padding:32px;
  background:#546e7a;
  color:white;
  font-size:34px;
  font-weight:900;
}

</style>
</head>

<body>

<div class="top">

  <div class="title">
    ご家族確認
  </div>

</div>

<div class="wrap">

  <div class="card">

    <div class="status green">
      😊 元気です
    </div>

    <div class="time">
      今日 08:12
    </div>

    <div class="log">
      朝の確認がありました
    </div>

  </div>

  <div class="card">

    <div class="status blue">
      🏥 出発しました
    </div>

    <div class="time">
      今日 14:20
    </div>

    <div class="log">
      病院へ向かいました
    </div>

  </div>

  <div class="card">

    <div class="status red">
      🚨 緊急
    </div>

    <div class="time">
      未送信
    </div>

    <div class="log">
      現在緊急通知はありません
    </div>

  </div>

  <button
  class="top-button"
  onclick="location.href='index.html'">

  ← 今日の安心へ戻る

  </button>

</div>

</body>
</html>
