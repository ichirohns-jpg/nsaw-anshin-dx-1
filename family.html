<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家族ページ</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
color:#333;
}

.wrap{
max-width:600px;
margin:auto;
padding:16px;
}

.card{
background:#fff;
border-radius:24px;
padding:22px;
margin-bottom:18px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
color:#1976d2;
}

.name{
font-size:30px;
font-weight:900;
text-align:center;
margin-top:12px;
}

.status{
font-size:32px;
font-weight:900;
text-align:center;
padding:20px;
border-radius:18px;
margin-top:16px;
background:#e8f5e9;
}

.label{
font-size:22px;
font-weight:900;
margin-bottom:10px;
}

.value{
font-size:20px;
line-height:1.8;
word-break:break-all;
}

.mapBtn{
display:block;
width:100%;
background:#1976d2;
color:#fff;
text-decoration:none;
text-align:center;
padding:20px;
border-radius:18px;
font-size:24px;
font-weight:900;
margin-top:16px;
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
家族ページ
</div>

<div class="name" id="name">
山口さん
</div>

<div class="status" id="status">
😊 元気です
</div>

</div>

<div class="card">

<div class="label">
最終確認時刻
</div>

<div class="value" id="time">
未確認
</div>

</div>

<div class="card">

<div class="label">
現在地
</div>

<div class="value" id="gps">
取得されていません
</div>

<a
id="mapLink"
class="mapBtn"
target="_blank">
Googleマップで見る
</a>

</div>

<div class="card">

<div class="label">
薬の記録
</div>

<div class="value" id="kusuri">
記録なし
</div>

</div>

</div>

<script>

document.getElementById("name").innerHTML=
localStorage.getItem("name")||"山口さん";

const lat=
localStorage.getItem("lat");

const lng=
localStorage.getItem("lng");

if(lat&&lng){

document.getElementById("gps").innerHTML=
"緯度："+lat+
"<br>経度："+lng;

document.getElementById("mapLink").href=
"https://maps.google.com/?q="+
lat+","+lng;

}else{

document.getElementById("gps").innerHTML=
"GPS未取得";

}

document.getElementById("status").innerHTML=
localStorage.getItem("status")||
"😊 元気です";

document.getElementById("time").innerHTML=
localStorage.getItem("statusTime")||
"未確認";

document.getElementById("kusuri").innerHTML=
localStorage.getItem("kusuriLog")||
"記録なし";

</script>

</body>
</html>
