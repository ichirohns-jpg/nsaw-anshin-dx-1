<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家族・支援者確認</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:linear-gradient(180deg,#f7f9fc,#eef4fb);
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

header{
background:linear-gradient(135deg,#6a1b9a,#8e24aa);
color:#fff;
padding:26px 18px;
text-align:center;
font-size:30px;
font-weight:900;
}

.wrap{
max-width:800px;
margin:auto;
padding:18px;
}

.card{
background:#fff;
border-radius:20px;
padding:18px;
margin-bottom:16px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.title{
font-size:20px;
font-weight:900;
margin-bottom:6px;
}

.status{
background:#ffffff;
border-radius:20px;
padding:22px;
font-size:22px;
font-weight:900;
box-shadow:0 6px 18px rgba(0,0,0,.08);
line-height:1.8;
}

.small{
margin-top:10px;
font-size:14px;
color:#607d8b;
}

.btn{
display:block;
width:100%;
padding:16px;
margin-top:14px;
border-radius:14px;
text-align:center;
font-size:18px;
font-weight:900;
text-decoration:none;
color:#fff;
background:#607d8b;
}

@media(max-width:700px){
.status{font-size:20px}
}
</style>
</head>

<body>

<header>
👪 家族・支援者ページ
</header>

<div class="wrap">

<div class="card">
<div class="title">最新状況</div>
<div id="status" class="status">読み込み中...</div>
<div id="time" class="small"></div>
</div>

<a class="btn" href="index.html">🏠 トップへ戻る</a>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbxsgeub9qA9q5EnfZgOEVah2H5YC9dEy_n2UqMkviD8Wy5IcVsL-CsMmNE0ZvDMbGFd/exec";

const params =
new URLSearchParams(location.search);

const userId =
params.get("id") || "A001";

fetch(GAS_URL + "?id=" + encodeURIComponent(userId))
.then(r => r.json())
.then(data => {

  const statusBox =
    document.getElementById("status");

  const timeBox =
    document.getElementById("time");

  if(!data || data.result === "NOT_FOUND"){
    statusBox.innerHTML = "データなし";
    return;
  }

  statusBox.innerHTML = data.status;

  timeBox.innerHTML =
    "更新：" +
    new Date(data.datetime).toLocaleString("ja-JP");

})
.catch(() => {
  document.getElementById("status").innerHTML = "取得エラー";
});

</script>

</body>
</html>
