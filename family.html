<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>家族確認｜見守りDX</title>

<link rel="icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
background:linear-gradient(180deg,#000000 0%,#08111d 50%,#000000 100%);
color:#fff;
min-height:100vh;
}

.wrap{
max-width:900px;
margin:auto;
padding:16px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:20px;
margin-bottom:16px;
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
margin-bottom:20px;
}

.name{
font-size:28px;
font-weight:900;
text-align:center;
margin-bottom:20px;
}

.section{
font-size:20px;
font-weight:900;
margin-bottom:10px;
color:#00d4ff;
}

.history{
background:rgba(255,255,255,.08);
border-radius:18px;
padding:14px;
margin-bottom:10px;
}

.time{
font-size:14px;
opacity:.7;
margin-bottom:5px;
}

.status{
font-size:20px;
font-weight:900;
margin-bottom:5px;
}

.memo{
font-size:15px;
line-height:1.6;
}

button{
width:100%;
border:none;
padding:18px;
border-radius:18px;
font-size:20px;
font-weight:900;
color:#fff;
cursor:pointer;
margin-bottom:10px;
}

input{
width:100%;
border:none;
padding:20px;
border-radius:18px;
font-size:24px;
margin-bottom:15px;
}

.app-btn{
background:linear-gradient(135deg,#00a3c4,#00d4ff);
}

.qr-btn{
background:linear-gradient(135deg,#7b1fa2,#ab47bc);
}

.home-btn{
background:linear-gradient(135deg,#455a64,#607d8b);
}

.footer{
text-align:center;
padding:20px;
font-size:12px;
opacity:.6;
}

</style>

</head>

<body>

<div
id="loginArea"
class="wrap">

<div class="card">

<div class="title">
🔐 支援者認証
</div>

<input
type="password"
id="pinInput"
placeholder="暗証番号">

<button
class="app-btn"
onclick="checkPin()">
認証する
</button>

</div>

</div>

<div
id="mainArea"
style="display:none;">

<div class="wrap">

<div class="card">

<div class="title">
👪 家族確認
</div>

<div
id="userName"
class="name">
読み込み中...
</div>

</div>

<div class="card">

<div class="section">
📋 最新履歴
</div>

<div id="historyArea">
読み込み中...
</div>

</div>

<div class="card">

<button
class="app-btn"
onclick="location.href='app.html?id='+USER_ID">
😊 本人ページ
</button>

<button
class="qr-btn"
onclick="location.href='qr.html?id='+USER_ID">
📱 QRコード
</button>

<button
class="home-btn"
onclick="location.href='index.html'">
🏠 ホームへ戻る
</button>

</div>

<div class="footer">
NSAW 家族ダッシュボード
</div>

</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

const params =
new URLSearchParams(
location.search
);

const USER_ID =
params.get("id") || "";

function checkPin(){

const savedPin =
localStorage.getItem(
"supportPin"
) || "";

const inputPin =
document.getElementById(
"pinInput"
).value;

if(
inputPin !== savedPin
){

alert(
"暗証番号が違います"
);

return;

}

document.getElementById(
"loginArea"
).style.display =
"none";

document.getElementById(
"mainArea"
).style.display =
"block";

loadData();

}

async function loadData(){

try{

const response =
await fetch(
GAS_URL +
"?action=dashboard&id=" +
encodeURIComponent(USER_ID)
);

const json =
await response.json();

const user =
json.user || {};

const history =
json.history || [];

document.getElementById(
"userName"
).innerHTML =

user.name ||

localStorage.getItem(
"userName"
) ||

"利用者";

let html = "";

history.forEach(item=>{

html += `
<div class="history">

<div class="time">
${item.time || ""}
</div>

<div class="status">
${item.status || ""}
</div>

<div class="memo">
${item.memo || ""}
</div>

</div>
`;

});

document.getElementById(
"historyArea"
).innerHTML =

html || "履歴なし";

}catch(error){

document.getElementById(
"historyArea"
).innerHTML =
"取得エラー";

}

}

setInterval(
loadData,
30000
);

</script>

</body>
</html>
