<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

async function loadDashboard(){

const params =
new URLSearchParams(
location.search
);

const id =
params.get("id") || "";

document.getElementById("dashboard").innerHTML =
"読み込み中...";

try{

const response =
await fetch(
GAS_URL +
"?action=dashboard&id=" +
encodeURIComponent(id)
);

const json =
await response.json();

const user =
json.user || {};

const latest =
json.latest || {};

const schedules =
json.schedules || [];

const medicine =
json.medicine || [];

const location =
json.location || {};

const emergency =
json.emergency || {};

let html = "";

html += `
<div class="card">

<div class="title">
👤 ${user.name || "利用者"}
</div>

<div class="row">
最終確認：
${latest.time || "-"}
</div>

<div class="row">
状態：
${latest.status || "-"}
</div>

<div class="row">
内容：
${latest.memo || "-"}
</div>

</div>
`;

html += `
<div class="card">

<div class="title">
💊 最終服薬確認
</div>

<div class="row">
${medicine.length ? medicine[0].memo : "記録なし"}
</div>

</div>
`;

html += `
<div class="card">

<div class="title">
📅 今日の予定
</div>
`;

if(schedules.length){

schedules.slice(0,5).forEach(v=>{

html += `
<div class="row">
${v.date}
&nbsp;
${v.time}
<br>
${v.title}
</div>
`;

});

}else{

html += `
<div class="row">
予定なし
</div>
`;

}

html += `
</div>
`;

html += `
<div class="card">

<div class="title">
📍 現在地
</div>

<div class="row">
緯度：
${location.lat || "-"}
</div>

<div class="row">
経度：
${location.lng || "-"}
</div>

</div>
`;

html += `
<div class="card">

<div class="title">
☎ 緊急通知
</div>

<div class="row">
${emergency ? emergency.memo || "なし" : "なし"}
</div>

</div>
`;

document.getElementById("dashboard").innerHTML =
html;

}catch(error){

document.getElementById("dashboard").innerHTML =
"取得エラー";

}

}

loadDashboard();

</script>
