<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家族・支援者ページ</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:760px;
margin:0 auto;
padding:18px 14px 40px;
}

h1{
margin:0 0 18px;
background:#6a1b9a;
color:#fff;
padding:28px 18px;
border-radius:0 0 28px 28px;
text-align:center;
font-size:38px;
font-weight:900;
}

.card{
background:#fff;
border-radius:26px;
padding:22px 18px;
margin-bottom:20px;
box-shadow:0 8px 22px rgba(0,0,0,.14);
}

.lead{
font-size:26px;
line-height:1.8;
font-weight:800;
}

.btn{
display:block;
width:100%;
padding:28px 18px;
margin:18px 0;
border-radius:22px;
text-decoration:none;
font-size:30px;
font-weight:900;
text-align:center;
color:#fff;
}

.status{background:#43a047;}
.history{background:#1976d2;}
.map{background:#00897b;}
.contact{background:#d32f2f;}
.home{background:#607d8b;}

@media(max-width:700px){
h1{font-size:34px}
.lead{font-size:24px}
.btn{font-size:28px}
}
</style>
</head>

<body>

<h1>👪 家族・支援者ページ</h1>

<div class="wrap">

<div class="card">
<div class="lead">
家族や支援者が確認する入口です。
安否確認、連絡、支援情報の確認に使います。
</div>
</div>

<a class="btn status" href="#">
😊 元気確認状況
</a>

<a class="btn history" href="#">
📋 確認履歴
</a>

<a class="btn map" href="https://ichirohns-jpg.github.io/nsaw-kurashi-01/support-map.html">
🗺 支援マップ
</a>

<a class="btn contact" href="#">
☎ 連絡・相談
</a>

<a class="btn home" href="index.html">
🏠 トップへ戻る
</a>

</div>

</body>
</html>
