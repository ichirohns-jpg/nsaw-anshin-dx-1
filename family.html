<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>支援者ページ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#101827;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
color:#fff;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:linear-gradient(135deg,#1e293b,#0f172a);
padding:22px;
border-radius:24px;
margin-bottom:14px;
}

.title{
font-size:24px;
font-weight:900;
margin-bottom:12px;
}

.item{
padding:18px;
border-radius:18px;
background:rgba(255,255,255,.08);
font-size:20px;
font-weight:900;
line-height:1.8;
}

.sos{
border-left:8px solid #ef4444;
}

.genki{
border-left:8px solid #22c55e;
}

.medicine{
border-left:8px solid #3b82f6;
}

.gps{
border-left:8px solid #06b6d4;
}

.homeStatus{
border-left:8px solid #2563eb;
}

.request{
border-left:8px solid #f59e0b;
}

.schedule{
border-left:8px solid #a855f7;
}

.btn{
display:block;
width:100%;
padding:22px;
border-radius:22px;
text-decoration:none;
text-align:center;
font-size:24px;
font-weight:900;
color:#fff;
background:linear-gradient(135deg,#475569,#334155);
margin-top:16px;
}

</style>

</head>

<body>

<div class="header">
<h1>👪 支援者ページ</h1>
</div>

<div class="card">
<div class="title">🚨 SOS</div>
<div id="sosArea" class="item sos">
記録なし
</div>
</div>

<div class="card">
<div class="title">😊 今日の体調</div>
<div id="genkiArea" class="item genki">
記録なし
</div>
</div>

<div class="card">
<div class="title">🏠 帰宅しました</div>
<div id="homeArea" class="item homeStatus">
記録なし
</div>
</div>

<div class="card">
<div class="title">💊 服薬状況</div>
<div id="medicineArea" class="item medicine">
記録なし
</div>
</div>

<div class="card">
<div class="title">💊 薬が残り少ない</div>
<div id="requestArea" class="item request">
記録なし
</div>
</div>

<div class="card">
<div class="title">📅 今後の予定</div>
<div id="scheduleArea" class="item schedule">
読込中...
</div>
</div>

<div class="card">
<div class="title">📍 現在地</div>
<div id="gpsArea" class="item gps">
位置情報なし
</div>
</div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec';

const lastSOS =
JSON.parse(
localStorage.getItem(
'lastSOS'
) || 'null'
);

if(lastSOS){

document.getElementById(
'sosArea'
).innerHTML =

(lastSOS.mainType || '') +
'<br>' +

(lastSOS.memo || '') +
'<br>' +

(lastSOS.time || '');

}

const lastGenki =
JSON.parse(
localStorage.getItem(
'lastGenki'
) || 'null'
);

if(lastGenki){

document.getElementById(
'genkiArea'
).innerHTML =

'最終送信<br><br>' +

(lastGenki.time || '');

}

const lastHome =
JSON.parse(
localStorage.getItem(
'lastHome'
) || 'null'
);

if(lastHome){

document.getElementById(
'homeArea'
).innerHTML =

'最終帰宅<br><br>' +

(lastHome.time || '');

}

const medicine =
JSON.parse(
localStorage.getItem(
'medicineStatus'
) || '{}'
);

let med='';

med += medicine.morning ? '☑ 朝<br>' : '☐ 朝<br>';
med += medicine.noon ? '☑ 昼<br>' : '☐ 昼<br>';
med += medicine.evening ? '☑ 夕方<br>' : '☐ 夕方<br>';
med += medicine.night ? '☑ 寝る前<br>' : '☐ 寝る前<br>';

if(medicine.time){

med +=
'<br>最終記録<br>' +
medicine.time;

}

document.getElementById(
'medicineArea'
).innerHTML =
med;

const request =
JSON.parse(
localStorage.getItem(
'medicineRequest'
) || 'null'
);

if(request){

document.getElementById(
'requestArea'
).innerHTML =

(request.type || '') +

'<br><br>' +

(request.time || '');

}

function loadSchedules(){

const userId =
localStorage.getItem(
'userId'
) || '';

fetch(
GAS_URL +
'?action=scheduleList&id=' +
encodeURIComponent(userId)
)

.then(r=>r.json())

.then(res=>{

const area =
document.getElementById(
'scheduleArea'
);

if(
!res.data ||
!res.data.length
){

area.innerHTML =
'予定なし';

return;

}

let html='';

res.data.forEach(item=>{

html +=

'<div style="margin-bottom:18px">' +

'<b>' +
(item.date || '') +
' ' +
(item.time || '') +
'</b><br>' +

(item.title || '') +
'<br>' +

(item.place || '') +
'<br>' +

(item.memo || '') +

'</div>';

});

area.innerHTML =
html;

})

.catch(()=>{

document.getElementById(
'scheduleArea'
).innerHTML =
'取得失敗';

});

}

loadSchedules();

const gps =
JSON.parse(
localStorage.getItem(
'lastGPS'
) || 'null'
);

if(gps){

document.getElementById(
'gpsArea'
).innerHTML =

gps.time +

'<br><br>' +

'<a class="btn" target="_blank" href="' +

gps.mapUrl +

'">📍 地図を見る</a>';

}

</script>

<a href="index.html" class="btn">
🏠 トップへ戻る
</a>

</body>
</html>
