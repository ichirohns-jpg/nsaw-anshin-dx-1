<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>本人登録</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:36px;
font-weight:900;
}

.card{
background:#fff;
border-radius:30px;
padding:24px;
margin-bottom:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.label{
font-size:22px;
font-weight:900;
margin-bottom:8px;
}

.input{
width:100%;
padding:18px;
font-size:22px;
border:2px solid #cbd5e1;
border-radius:18px;
margin-bottom:16px;
}

.btn{
width:100%;
padding:24px;
border:none;
border-radius:24px;
font-size:28px;
font-weight:900;
cursor:pointer;
margin-bottom:14px;
color:#fff;
}

.green{
background:#16a34a;
}

.blue{
background:#2563eb;
}

.gray{
background:#475569;
}

.result{
background:#f1f5f9;
padding:20px;
border-radius:20px;
font-size:22px;
font-weight:900;
text-align:center;
line-height:1.8;
}

</style>

</head>

<body>

<div class="header">
<h1>👤 本人登録</h1>
</div>

<div class="card">

<div class="label">
お名前
</div>

<input
id="name"
class="input"
placeholder="山田太郎">

<div class="label">
住所
</div>

<input
id="address"
class="input"
placeholder="志木市○○">

<div class="label">
電話番号
</div>

<input
id="phone"
class="input"
placeholder="09000000000">

<div class="label">
緊急連絡先
</div>

<input
id="family"
class="input"
placeholder="09000000000">

<button
class="btn green"
onclick="saveUser()">
登録する
</button>

</div>

<div class="card">

<div
id="result"
class="result">

未登録

</div>

</div>

<button
class="btn blue"
onclick="goQR()">
📱 QR発行
</button>

<button
class="btn gray"
onclick="location.href='index.html'">
🏠 トップへ戻る
</button>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec';

function saveUser(){

const user = {

type:'register',

name:
document.getElementById('name').value,

address:
document.getElementById('address').value,

phone:
document.getElementById('phone').value,

family:
document.getElementById('family').value,

time:
new Date().toLocaleString('ja-JP')

};

document.getElementById('result').innerHTML =
'登録中...';

fetch(
GAS_URL,
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify(user)
}
)
.then(r=>r.text())
.then(data=>{

localStorage.setItem(
'userName',
user.name
);

localStorage.setItem(
'userAddress',
user.address
);

localStorage.setItem(
'userPhone',
user.phone
);

localStorage.setItem(
'userFamily',
user.family
);

document.getElementById('result').innerHTML =

'登録完了<br><br>' +

user.name +
'<br><br>' +

user.address;

})
.catch(err=>{

document.getElementById('result').innerHTML =
'登録失敗';

});

}

function goQR(){

location.href='qr.html';

}

</script>

</body>
</html>
