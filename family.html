<script>

const scheduleData =
localStorage.getItem(
'scheduleData'
);

if(scheduleData){

const data =
JSON.parse(scheduleData);

document.getElementById(
'scheduleArea'
).innerHTML =

'🏥 ' +
(data.hospital || '-') +

'<br>' +

'🛒 ' +
(data.shopping || '-') +

'<br>' +

'🚌 ' +
(data.dayservice || '-') +

'<br>' +

'💊 ' +
(data.medicineTime || '-');

}

const lastSOS =
localStorage.getItem(
'lastSOS'
);

if(lastSOS){

const sos =
JSON.parse(lastSOS);

document.getElementById(
'sosArea'
).innerHTML =

sos.type +

'<br><br>' +

sos.memo +

'<br><br>' +

sos.time;

}

const lastGPS =
localStorage.getItem(
'lastGPS'
);

if(lastGPS){

const gps =
JSON.parse(lastGPS);

document.getElementById(
'gpsArea'
).innerHTML =

'📍位置送信済み' +

'<br><br>' +

gps.time +

'<br><br>' +

'<a href="' +
gps.mapUrl +
'" target="_blank">地図を開く</a>';

}

</script>
