<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家族・支援者ページ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fdfbf7;color:#333;font-family:"Hiragino Sans","Yu Gothic",sans-serif}
.app-box{max-width:520px;margin:1.5rem auto;padding:0 1rem}
.badge{display:inline-block;background:#777;color:#fff;border-radius:999px;padding:8px 14px;font-size:15px}
.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 6px 14px rgba(0,0,0,.06)}
.title{font-size:28px;font-weight:900;text-align:center;margin:0 0 22px}
.info{border-radius:12px;padding:16px;margin-bottom:14px;font-size:20px;font-weight:900;line-height:1.8;background:#f7f9fa}
.normal{border-left:8px solid #4ebfa5}
.caution{border-left:8px solid #e96d42}
.emergency{border-left:8px solid #e05d5d;background:#fff1f1}
.back{display:block;margin-top:20px;text-align:center;font-weight:900;text-decoration:none;color:#666}
</style>
</head>
<body>
<div class="app-box">
<div style="text-align:center;margin-bottom:14px">
<span class="badge" id="userBadge">家族・支援者ページ</span>
</div>
<div class="card">
<h1 class="title">見守り状況</h1>
<div class="info normal" id="userName">👤 利用者：読込中...</div>
<div class="info normal" id="latestStatus">😊 最新状態：読込中...</div>
<div class="info normal" id="latestTime">🕒 最終確認：読込中...</div>
<div class="info normal" id="latestMedicine">💊 薬の状況：読込中...</div>
<div class="info normal" id="gpsInfo">📍 位置情報：読込中...</div>
<a href="index.html" class="back">トップへ戻る</a>
</div>
</div>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycby1NsOe0hOQALNR5Tx2DwwIMS8E-a7nCGa-wZG9vSi8I_DvrnQlKisxhA2ppR8RDehX/exec';
const USER_NAME=localStorage.getItem("name")||"山口さん";
document.getElementById("userBadge").innerHTML=USER_NAME+" 家族ページ";
function setLevel(level){
const boxes=document.querySelectorAll(".info");
boxes.forEach(b=>{b.classList.remove("normal","caution","emergency")});
let cls="normal";
if(level==="注意")cls="caution";
if(level==="緊急")cls="emergency";
boxes.forEach(b=>b.classList.add(cls));
}
async function loadData(){
try{
const res=await fetch(GAS_URL+'?mode=latest');
const data=await res.json();
setLevel(data.level||"通常");
document.getElementById('userName').innerHTML='👤 利用者：'+(data.name||USER_NAME);
document.getElementById('latestStatus').innerHTML='😊 最新状態：'+(data.content||'未確認');
document.getElementById('latestTime').innerHTML='🕒 最終確認：'+(data.time||'未確認');
document.getElementById('latestMedicine').innerHTML='💊 薬の状況：'+(data.medicine||'未確認');
document.getElementById('gpsInfo').innerHTML='📍 位置情報：'+(data.gps||'未確認');
}catch(e){
document.getElementById('latestStatus').innerHTML='😊 最新状態：取得失敗';
}
}
loadData();
setInterval(loadData,30000);
</script>
</body>
</html>
