<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>家族ページ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
margin:0;
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
padding:18px;
}

header{
background:linear-gradient(135deg,#111827,#334155);
color:#fff;
padding:26px;
border-radius:28px;
text-align:center;
font-size:34px;
font-weight:900;
margin-bottom:18px;
}

.card{
background:#fff;
border-radius:24px;
padding:20px;
margin-bottom:16px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.title{
font-size:24px;
font-weight:900;
margin-bottom:12px;
}

.status{
background:#f8fafc;
border-radius:18px;
padding:16px;
font-size:22px;
line-height:1.8;
font-weight:700;
}

.btn{
display:block;
width:100%;
padding:22px;
border-radius:20px;
text-decoration:none;
text-align:center;
font-size:24px;
font-weight:900;
color:#fff;
margin-top:12px;
}

.green{
background:#16a34a;
}

.blue{
background:#2563eb;
}

.orange{
background:#ea580c;
}

.red{
background:#dc2626;
}

.gray{
background:#475569;
}

</style>

</head>

<body>

<header>
👪 家族ページ
</header>

<div class="card">

<div class="title">
利用者状況
</div>

<div
id="statusArea"
class="status">

読込中...

</div>

</div>

<div class="card">

<div class="title">
今日の状況
</div>

<div
id="scheduleArea"
class="status">

📅 予定未登録

</div>

<br>

<div
id="gpsArea"
class="status">

📍 位置情報未取得

</div>

<br>

<div
id="sosArea"
class="status">

🚨 SOSなし

</div>

</div>

<div class="card">

<a
href="history.html"
class="btn gray">
📋 見守り履歴
</a>

<a
href="check-history.html"
class="btn green">
😊 元気です履歴
</a>

<a
href="medicine-history.html"
class="btn blue">
💊 服薬履歴
</a>

<a
href="gps.html"
class="btn red">
📍 最終位置確認
</a>

<a
href="schedule.html"
class="btn orange">
📅 今日の予定
</a>

</div>

<a
href="index.html"
class="btn gray">
🏠 トップへ戻る
</a>

<script>

const SHEET_ID =
'149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc';

const SHEET_NAME =
'見守り記録';

const url =
'https://docs.google.com/spreadsheets/d/' +
SHEET_ID +
'/gviz/tq?sheet=' +
encodeURIComponent(SHEET_NAME) +
'&tqx=out:json';

fetch(url)
.then(r=>r.text())
.then(text=>{

const json =
JSON.parse(
text.substring(47,text.length-2)
);

const rows =
json.table.rows;

if(rows.length===0)return;

const last =
rows[rows.length-1];

const time =
last.c[0] ? last.c[0].v : '';

const name =
last.c[1] ? last.c[1].v : '';

const status =
last.c[2] ? last.c[2].v : '';

document.getElementById(
'statusArea'
).innerHTML =

'👤 ' + name +
'<br><br>' +
status +
'<br><br>' +
'🕒 ' + time;

if(
status.includes('SOS') ||
status.includes('緊急') ||
status.includes('困')
){

document.getElementById(
'sosArea'
).innerHTML =
'🚨 ' + status;

}

if(
status.includes('薬')
){

document.getElementById(
'scheduleArea'
).innerHTML =
'💊 ' + status;

}

if(
status.includes('現在地')
){

document.getElementById(
'gpsArea'
).innerHTML =
'📍 最終位置送信済み';

}

});

</script>

</body>
</html>
