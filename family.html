<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家族・支援者ページ</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f4f6f8;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

header{
background:linear-gradient(135deg,#6a1b9a,#8e24aa);
color:#fff;
padding:26px 18px;
text-align:center;
font-size:30px;
font-weight:900;
}

.wrap{
max-width:800px;
margin:auto;
padding:18px;
}

.card{
background:#fff;
border-radius:20px;
padding:18px;
margin-bottom:16px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.title{
font-size:20px;
font-weight:900;
margin-bottom:6px;
}

.status{
background:#ffffff;
border-radius:20px;
padding:22px;
font-size:22px;
font-weight:900;
box-shadow:0 6px 18px rgba(0,0,0,.08);
line-height:1.8;
}

.small{
margin-top:10px;
font-size:14px;
color:#607d8b;
}

.btn{
display:block;
width:100%;
padding:16px;
margin-top:14px;
border-radius:14px;
text-align:center;
font-size:18px;
font-weight:900;
text-decoration:none;
color:#fff;
background:#607d8b;
}

@media(max-width:700px){
.status{
font-size:20px;
}
}
</style>
</head>

<body>

<header>
👪 家族・支援者ページ
</header>

<div class="wrap">

<div class="card">
<div class="title">最新状況</div>

<div id="status" class="status">
読み込み中...
</div>

<div id="time" class="small"></div>

</div>

<a class="btn" href="index.html">
🏠 トップへ戻る
</a>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbxKT-6glAdXnR6ylyUB1YZbSRYKZ3dGtVl4w7lO8YW9jCWGa1vCHwpG7167pX2KIYZ2/exec";

const params =
new URLSearchParams(location.search);

const userId =
params.get("id") || "A001";

const statusBox =
document.getElementById("status");

const timeBox =
document.getElementById("time");

async function loadData(){

try{

const res =
await fetch(
GAS_URL +
"?mode=records&id=" +
encodeURIComponent(userId)
);

const data =
await res.json();

if(
!data ||
!data.records ||
data.records.length === 0
){

statusBox.innerHTML = "記録なし";
timeBox.innerHTML = "";
return;

}

const latest =
data.records[0];

let text = latest.status;

if(text === "genki"){
text = "😊 元気です";
}

if(text === "komari"){
text = "⚠️ 少し困っています";
}

if(text === "help"){
text = "🚨 助けてください";
}

if(text === "kusuri"){
text = "💊 薬を飲みました";
}

statusBox.innerHTML = text;

timeBox.innerHTML =
"更新：" +
new Date(latest.date)
.toLocaleString("ja-JP");

}catch(err){

statusBox.innerHTML =
"取得エラー";

}

}

loadData();

</script>

</body>
</html>
