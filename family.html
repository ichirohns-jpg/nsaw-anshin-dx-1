<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>支援者ページ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
background:#101827;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
color:#fff;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:linear-gradient(135deg,#1e293b,#0f172a);
padding:22px;
border-radius:24px;
margin-bottom:14px;
}

.title{
font-size:24px;
font-weight:900;
margin-bottom:12px;
}

.item{
padding:18px;
border-radius:18px;
background:rgba(255,255,255,.08);
font-size:20px;
font-weight:900;
line-height:1.8;
}

.sos{
border-left:8px solid #ef4444;
}

.trouble{
border-left:8px solid #f59e0b;
}

.genki{
border-left:8px solid #22c55e;
}

.medicine{
border-left:8px solid #3b82f6;
}

.gps{
border-left:8px solid #06b6d4;
}

.schedule{
border-left:8px solid #a855f7;
}

.home{
border-left:8px solid #16a34a;
}

.consult{
border-left:8px solid #0891b2;
}

.phoneBtn{
display:block;
background:#16a34a;
color:#fff;
text-decoration:none;
padding:18px;
border-radius:18px;
text-align:center;
font-size:22px;
font-weight:900;
margin-bottom:12px;
}

.lineBtn{
display:block;
background:#06c755;
color:#fff;
text-decoration:none;
padding:18px;
border-radius:18px;
text-align:center;
font-size:22px;
font-weight:900;
margin-bottom:12px;
}

.btn{
display:block;
width:100%;
padding:22px;
border-radius:22px;
text-decoration:none;
text-align:center;
font-size:24px;
font-weight:900;
color:#fff;
background:linear-gradient(135deg,#475569,#334155);
margin-top:16px;
}

.mapBtn{
display:inline-block;
padding:12px 18px;
border-radius:14px;
background:#2563eb;
color:#fff;
text-decoration:none;
margin-top:10px;
}

</style>
</head>

<body>

<div class="header">
<h1>👪 支援者ページ</h1>
</div>

<a
id="phoneBtn"
class="phoneBtn"
href="#">
📞 本人へ電話
</a>

<a
id="lineBtn"
class="lineBtn"
href="#"
target="_blank">
💬 本人へLINE
</a>

<div class="card">

<div class="title">
🚨 SOS
</div>

<div id="sosArea" class="item sos">
記録なし
</div>

</div>

<div class="card">

<div class="title">
😟 困っています
</div>

<div id="troubleArea" class="item trouble">
記録なし
</div>

</div>

<div class="card">

<div class="title">
😊 元気です
</div>

<div id="genkiArea" class="item genki">
記録なし
</div>

</div>

<div class="card">

<div class="title">
💊 服薬状況
</div>

<div id="medicineArea" class="item medicine">
記録なし
</div>

</div>

<div class="card">

<div class="title">
💊 薬がなくなる
</div>

<div id="medicineRequestArea" class="item medicine">
記録なし
</div>

</div>

<div class="card">

<div class="title">
🏠 帰宅状況
</div>

<div id="homeArea" class="item home">
記録なし
</div>

</div>

<div class="card">

<div class="title">
📅 予定
</div>

<div id="scheduleArea" class="item schedule">
予定なし
</div>

</div>

<div class="card">

<div class="title">
☎ 相談内容
</div>

<div id="consultArea" class="item consult">
記録なし
</div>

</div>

<div class="card">

<div class="title">
📍 現在地
</div>

<div id="gpsArea" class="item gps">
位置情報なし
</div>

</div>

<a href="index.html" class="btn">
🏠 トップへ戻る
</a>

<script>

const phone =
localStorage.getItem(
'userPhone'
);

if(phone){

document.getElementById(
'phoneBtn'
).href =
'tel:' + phone;

}

const line =
localStorage.getItem(
'userLine'
);

if(line){

document.getElementById(
'lineBtn'
).href =
line;

}

const lastSOS =
JSON.parse(
localStorage.getItem(
'lastSOS'
) || 'null'
);

if(lastSOS){

document.getElementById(
'sosArea'
).innerHTML =

(lastSOS.type || '') +

'<br><br>' +

(lastSOS.memo || '') +

'<br><br>' +

(lastSOS.time || '');

}

const trouble =
JSON.parse(
localStorage.getItem(
'lastTrouble'
) || 'null'
);

if(trouble){

document.getElementById(
'troubleArea'
).innerHTML =

trouble.type +

'<br><br>' +

(trouble.memo || '') +

'<br><br>' +

trouble.time;

}

const genki =
JSON.parse(
localStorage.getItem(
'lastGenki'
) || 'null'
);

if(genki){

document.getElementById(
'genkiArea'
).innerHTML =

'😊 元気です' +

'<br><br>' +

genki.time;

}

const medicine =
JSON.parse(
localStorage.getItem(
'medicineStatus'
) || '{}'
);

let med='';

if(medicine.morning) med+='☑ 朝<br>';
if(medicine.noon) med+='☑ 昼<br>';
if(medicine.evening) med+='☑ 夕方<br>';
if(medicine.night) med+='☑ 寝る前<br>';

if(med){

document.getElementById(
'medicineArea'
).innerHTML =
med;

}

const request =
JSON.parse(
localStorage.getItem(
'medicineRequest'
) || 'null'
);

if(request){

document.getElementById(
'medicineRequestArea'
).innerHTML =

request.medicine +

'<br><br>' +

'残り ' +

request.remain +

'<br><br>' +

request.time;

}

const home =
JSON.parse(
localStorage.getItem(
'homeStatus'
) || 'null'
);

if(home){

document.getElementById(
'homeArea'
).innerHTML =

home.status +

'<br><br>' +

home.time;

}

const consult =
JSON.parse(
localStorage.getItem(
'consultData'
) || 'null'
);

if(consult){

document.getElementById(
'consultArea'
).innerHTML =

consult.type +

'<br><br>' +

consult.memo +

'<br><br>' +

consult.time;

}

const gps =
JSON.parse(
localStorage.getItem(
'lastGPS'
) || 'null'
);

if(gps){

document.getElementById(
'gpsArea'
).innerHTML =

gps.time +

'<br><br>' +

'<a class="mapBtn" href="' +
gps.mapUrl +
'" target="_blank">地図を見る</a>';

}

</script>

</body>
</html>
