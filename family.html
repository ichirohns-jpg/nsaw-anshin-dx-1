<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家族ページ</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:620px;
margin:0 auto;
padding:18px 14px 34px;
}

.card{
background:#fff;
border-radius:28px;
padding:24px 20px;
margin-bottom:18px;
box-shadow:0 8px 22px rgba(0,0,0,.10);
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
color:#7e57c2;
margin-bottom:10px;
}

.name{
font-size:32px;
font-weight:900;
text-align:center;
margin-top:12px;
}

.area{
font-size:23px;
font-weight:900;
text-align:center;
margin-top:8px;
color:#666;
}

.status{
font-size:32px;
font-weight:900;
text-align:center;
padding:24px 16px;
border-radius:22px;
margin-top:18px;
background:#e8f5e9;
color:#2e7d32;
line-height:1.5;
}

.label{
font-size:23px;
font-weight:900;
margin-bottom:10px;
color:#333;
}

.value{
font-size:21px;
font-weight:800;
line-height:1.8;
word-break:break-all;
}

.mapBtn{
display:none;
width:100%;
background:#1976d2;
color:#fff;
text-decoration:none;
text-align:center;
padding:22px;
border-radius:20px;
font-size:24px;
font-weight:900;
margin-top:16px;
}

.reload{
display:block;
width:100%;
background:#2eaf66;
color:#fff;
text-align:center;
padding:22px;
border-radius:20px;
font-size:24px;
font-weight:900;
margin-top:16px;
border:none;
}

.back{
display:block;
width:100%;
background:#607d8b;
color:#fff;
text-decoration:none;
text-align:center;
padding:20px;
border-radius:20px;
font-size:22px;
font-weight:900;
margin-top:16px;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <div class="title">家族ページ</div>

    <div class="name" id="name">読み込み中...</div>

    <div class="area" id="area">--</div>

    <div class="status" id="status">確認中...</div>

    <button class="reload" onclick="loadData()">更新する</button>

  </div>

  <div class="card">
    <div class="label">最終確認時刻</div>
    <div class="value" id="time">--</div>
  </div>

  <div class="card">
    <div class="label">種別</div>
    <div class="value" id="type">--</div>
  </div>

  <div class="card">
    <div class="label">GPS</div>
    <div class="value" id="gps">--</div>

    <a id="mapLink" class="mapBtn" target="_blank">
      Googleマップで見る
    </a>
  </div>

  <a href="index.html" class="back">トップへ戻る</a>

</div>

<script>
const GAS_URL =
"https://script.google.com/macros/s/AKfycbwC3CPMJlMl5o37qcxIcedcikLuxe6y_ANRjAeFnO9KtPEk9rw-LTu72Dyoq2XJKPET/exec";

const params = new URLSearchParams(location.search);

const personId =
params.get("id") ||
localStorage.getItem("personId") ||
"yamaguchi";

function setStatusColor(content){

  const statusBox = document.getElementById("status");

  if(!content){
    statusBox.style.background = "#f7f9fb";
    statusBox.style.color = "#333";
    return;
  }

  if(content.indexOf("助けて") >= 0){
    statusBox.style.background = "#ffebee";
    statusBox.style.color = "#c62828";
    return;
  }

  if(content.indexOf("困って") >= 0){
    statusBox.style.background = "#fff3e0";
    statusBox.style.color = "#ef6c00";
    return;
  }

  statusBox.style.background = "#e8f5e9";
  statusBox.style.color = "#2e7d32";
}

function loadData(){

  document.getElementById("status").innerHTML = "確認中...";

  fetch(GAS_URL + "?id=" + encodeURIComponent(personId))
  .then(function(r){
    return r.json();
  })
  .then(function(data){

    document.getElementById("name").innerHTML =
      data.name || "未登録";

    document.getElementById("area").innerHTML =
      (data.city || "") + " " + (data.area || "");

    document.getElementById("status").innerHTML =
      data.content || "データなし";

    setStatusColor(data.content || "");

    document.getElementById("time").innerHTML =
      data.time || "--";

    document.getElementById("type").innerHTML =
      data.type || "--";

    document.getElementById("gps").innerHTML =
      data.gps || "GPSなし";

    const mapLink = document.getElementById("mapLink");

    if(data.gps){
      const gps = String(data.gps).split(",");

      if(gps.length === 2){
        mapLink.href =
          "https://maps.google.com/?q=" +
          gps[0] + "," + gps[1];

        mapLink.style.display = "block";
      }else{
        mapLink.style.display = "none";
      }
    }else{
      mapLink.style.display = "none";
    }

  })
  .catch(function(){

    document.getElementById("status").innerHTML =
      "取得失敗";

    setStatusColor("");

  });

}

loadData();
</script>

</body>
</html>
