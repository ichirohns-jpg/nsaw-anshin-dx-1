<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>支援者ページ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#101827;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
color:#fff;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:linear-gradient(135deg,#1e293b,#0f172a);
padding:22px;
border-radius:24px;
margin-bottom:14px;
}

.title{
font-size:24px;
font-weight:900;
margin-bottom:12px;
}

.item{
padding:18px;
border-radius:18px;
background:rgba(255,255,255,.08);
font-size:20px;
font-weight:900;
line-height:1.8;
}

.sos{
border-left:8px solid #ef4444;
}

.genki{
border-left:8px solid #22c55e;
}

.medicine{
border-left:8px solid #3b82f6;
}

.gps{
border-left:8px solid #06b6d4;
}

.garbage{
border-left:8px solid #16a34a;
}

.schedule{
border-left:8px solid #f59e0b;
}

.btn{
display:block;
width:100%;
padding:22px;
border-radius:22px;
text-decoration:none;
text-align:center;
font-size:24px;
font-weight:900;
color:#fff;
background:linear-gradient(135deg,#475569,#334155);
margin-top:16px;
}

</style>

</head>

<body>

<div class="header">
<h1>👪 支援者ページ</h1>
</div>

<div class="card">
<div class="title">🚨 SOS</div>
<div id="sosArea" class="item sos">
記録なし
</div>
</div>

<div class="card">
<div class="title">😊 元気です</div>
<div id="genkiArea" class="item genki">
記録なし
</div>
</div>

<div class="card">
<div class="title">💊 服薬状況</div>
<div id="medicineArea" class="item medicine">
記録なし
</div>
</div>

<div class="card">
<div class="title">📍 現在地</div>
<div id="gpsArea" class="item gps">
位置情報なし
</div>
</div>

<div class="card">
<div class="title">🗑 今日のゴミ</div>
<div id="garbageArea" class="item garbage">
読込中...
</div>
</div>

<div class="card">
<div class="title">📅 今日の予定</div>
<div id="scheduleArea" class="item schedule">
予定なし
</div>
</div>

<script>

const lastSOS =
JSON.parse(
localStorage.getItem(
'lastSOS'
) || 'null'
);

if(lastSOS){

document.getElementById(
'sosArea'
).innerHTML =

(lastSOS.mainType||'') +
'<br>' +

(lastSOS.type||'') +
'<br>' +

(lastSOS.memo||'') +
'<br>' +

(lastSOS.time||'');

}

const lastGenki =
JSON.parse(
localStorage.getItem(
'lastGenki'
) || 'null'
);

if(lastGenki){

document.getElementById(
'genkiArea'
).innerHTML =

'元気です<br>' +

(lastGenki.time||'');

}

const medicine =
JSON.parse(
localStorage.getItem(
'medicineStatus'
) || '{}'
);

let med='';

if(medicine.morning){
med+='☑ 朝<br>';
}

if(medicine.noon){
med+='☑ 昼<br>';
}

if(medicine.evening){
med+='☑ 夕方<br>';
}

if(medicine.night){
med+='☑ 寝る前<br>';
}

if(med){

document.getElementById(
'medicineArea'
).innerHTML =
med;

}

const gps =
JSON.parse(
localStorage.getItem(
'lastGPS'
) || 'null'
);

if(gps){

document.getElementById(
'gpsArea'
).innerHTML =

gps.time +

'<br><br>' +

'<a class="btn" target="_blank" href="' +

gps.mapUrl +

'">📍 地図を見る</a>';

}

const schedules =
JSON.parse(
localStorage.getItem(
'schedules'
) || '[]'
);

const today =
new Date()
.toISOString()
.split('T')[0];

let scheduleText='';

schedules.forEach(item=>{

if(item.date===today){

scheduleText +=

(item.time||'') +

' ' +

(item.title||'') +

'<br>';

}

});

if(scheduleText){

document.getElementById(
'scheduleArea'
).innerHTML =
scheduleText;

}

document.getElementById(
'garbageArea'
).innerHTML =

'<a class="btn" href="garbage.html">🗑 ゴミ確認</a>';

</script>

<a href="index.html" class="btn">
🏠 トップへ戻る
</a>

</body>
</html>
