<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>家族確認｜見守りDX</title>

<link rel="icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
background:linear-gradient(180deg,#000000 0%,#08111d 50%,#000000 100%);
color:#ffffff;
min-height:100vh;
}

.wrap{
max-width:900px;
margin:auto;
padding:16px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:20px;
margin-bottom:16px;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
margin-bottom:20px;
}

.name{
font-size:28px;
font-weight:900;
margin-bottom:10px;
}

.item{
padding:12px 0;
border-bottom:1px solid rgba(255,255,255,.08);
}

.item:last-child{
border-bottom:none;
}

.label{
font-size:14px;
opacity:.7;
margin-bottom:4px;
}

.value{
font-size:20px;
font-weight:900;
}

button{
width:100%;
border:none;
cursor:pointer;
color:#fff;
font-weight:900;
padding:18px;
border-radius:18px;
font-size:18px;
margin-bottom:10px;
}

.home-btn{
background:linear-gradient(135deg,#455a64,#607d8b);
}

.app-btn{
background:linear-gradient(135deg,#00a3c4,#00d4ff);
}

.footer{
text-align:center;
padding:20px;
opacity:.6;
font-size:12px;
}

</style>

</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
👪 家族確認
</div>

<div
id="userName"
class="name">
読み込み中...
</div>

<div class="item">
<div class="label">
最終確認
</div>
<div
id="lastTime"
class="value">
-
</div>
</div>

<div class="item">
<div class="label">
状態
</div>
<div
id="lastStatus"
class="value">
-
</div>
</div>

<div class="item">
<div class="label">
メモ
</div>
<div
id="lastMemo"
class="value">
-
</div>
</div>

</div>

<div class="card">

<button
class="app-btn"
id="openUser">
😊 本人ページ
</button>

<button
class="home-btn"
onclick="location.href='users.html'">
👥 利用者一覧
</button>

<button
class="home-btn"
onclick="location.href='index.html'">
🏠 ホームへ戻る
</button>

</div>

<div class="footer">
NSAW 家族ダッシュボード
</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

const params =
new URLSearchParams(location.search);

const USER_ID =
params.get("id") || "";

async function loadData(){

try{

const response =
await fetch(
GAS_URL +
"?action=dashboard&id=" +
encodeURIComponent(USER_ID)
);

const json =
await response.json();

const user =
json.user || {};

const latest =
json.latest || {};

document.getElementById("userName").innerHTML =
user.name || "利用者";

document.getElementById("lastTime").innerHTML =
latest.time || "-";

document.getElementById("lastStatus").innerHTML =
latest.status || "-";

document.getElementById("lastMemo").innerHTML =
latest.memo || "-";

document.getElementById("openUser").onclick =
function(){

location.href =
"app.html?id=" + USER_ID;

};

}catch(error){

document.getElementById("userName").innerHTML =
"取得エラー";

}

}

loadData();

</script>

</body>
</html>
