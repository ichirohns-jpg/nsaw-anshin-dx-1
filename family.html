<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家族・支援者確認</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

header{
background:#6a1b9a;
color:#fff;
padding:30px 18px;
text-align:center;
font-size:38px;
font-weight:900;
}

.wrap{
max-width:760px;
margin:0 auto;
padding:18px 14px 44px;
}

.card{
background:#fff;
border-radius:28px;
padding:24px 20px;
margin-bottom:22px;
box-shadow:0 8px 22px rgba(0,0,0,.14);
}

.title{
font-size:34px;
font-weight:900;
margin-bottom:10px;
}

.text{
font-size:24px;
line-height:1.8;
font-weight:800;
}

.status{
background:#fff;
border-radius:28px;
padding:24px;
box-shadow:0 8px 22px rgba(0,0,0,.14);
font-size:26px;
line-height:1.8;
font-weight:900;
margin-bottom:22px;
}

.btn{
display:block;
width:100%;
padding:28px;
border-radius:22px;
text-decoration:none;
text-align:center;
font-size:30px;
font-weight:900;
color:#fff;
margin-bottom:18px;
}

.home{
background:#607d8b;
}

@media(max-width:700px){
header{font-size:34px}
.title{font-size:31px}
.text{font-size:22px}
.status{font-size:23px}
.btn{font-size:27px}
}
</style>
</head>

<body>

<header>
👪 家族・支援者ページ
</header>

<div class="wrap">

<div class="card">

<div class="title">
確認状況
</div>

<div class="text">
本人が最後に押した内容を表示します。
</div>

</div>

<div id="status" class="status">
読込中...
</div>

<a class="btn home" href="index.html">
🏠 トップへ戻る
</a>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbxsgeub9qA9q5EnfZgOEVah2H5YC9dEy_n2UqMkviD8Wy5IcVsL-CsMmNE0ZvDMbGFd/exec";

const params =
new URLSearchParams(location.search);

const userId =
params.get("id") || "A001";

fetch(
GAS_URL + "?id=" + encodeURIComponent(userId)
)
.then(response => response.json())
.then(data => {

  const box =
  document.getElementById("status");

  if(
    !data ||
    data.result === "NOT_FOUND"
  ){

    box.innerHTML =
    "確認データなし";

    return;
  }

  box.innerHTML =
    "利用者ID<br><br>" +
    data.id +
    "<br><br>" +
    "最新状態<br><br>" +
    data.status +
    "<br><br>" +
    "日時<br><br>" +
    new Date(data.datetime)
      .toLocaleString("ja-JP");

})
.catch(error => {

  document.getElementById("status")
  .innerHTML =
  "データ取得エラー";

  console.error(error);

});

</script>

</body>
</html>
