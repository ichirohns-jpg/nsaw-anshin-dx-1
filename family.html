<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>家族ページ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
color:#1f2d3d;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:36px;
font-weight:900;
}

.card{
background:#fff;
border-radius:24px;
padding:20px;
margin-bottom:16px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.title{
font-size:24px;
font-weight:900;
margin-bottom:12px;
}

.status{
background:#f8fafc;
border-radius:18px;
padding:16px;
font-size:22px;
line-height:1.8;
font-weight:700;
}

.btn{
display:block;
width:100%;
padding:22px;
border-radius:20px;
text-decoration:none;
text-align:center;
font-size:24px;
font-weight:900;
color:#fff;
margin-top:12px;
}

.green{
background:#16a34a;
}

.blue{
background:#2563eb;
}

.orange{
background:#ea580c;
}

.red{
background:#dc2626;
}

.gray{
background:#475569;
}

</style>

</head>

<body>

<div class="header">
<h1>👪 家族ページ</h1>
</div>

<div class="card">

<div class="title">
利用者状況
</div>

<div
id="statusArea"
class="status">

読込中...

</div>

</div>

<div class="card">

<div class="title">
😊 最終元気です
</div>

<div
id="genkiArea"
class="status">

履歴なし

</div>

</div>

<div class="card">

<div class="title">
💊 最終服薬
</div>

<div
id="medicineArea"
class="status">

履歴なし

</div>

</div>

<div class="card">

<div class="title">
📍 最終位置
</div>

<div
id="gpsArea"
class="status">

位置情報なし

</div>

</div>

<div class="card">

<div class="title">
🚨 最終SOS
</div>

<div
id="sosArea"
class="status">

SOSなし

</div>

</div>

<div class="card">

<a href="history.html" class="btn gray">
📋 見守り履歴
</a>

<a href="check-history.html" class="btn green">
😊 元気です履歴
</a>

<a href="medicine-history.html" class="btn blue">
💊 服薬履歴
</a>

<a href="gps.html" class="btn red">
📍 GPS確認
</a>

<a href="schedule.html" class="btn orange">
📅 今日の予定
</a>

</div>

<a href="index.html" class="btn gray">
🏠 トップへ戻る
</a>

<script>

const SHEET_ID =
'149lAFx3oPGjB0UqDpPWZJqt_bBeDWMPd-Rfc6LXQgoc';

const SHEET_NAME =
'見守り記録';

const url =
'https://docs.google.com/spreadsheets/d/' +
SHEET_ID +
'/gviz/tq?sheet=' +
encodeURIComponent(SHEET_NAME) +
'&tqx=out:json';

fetch(url)
.then(r=>r.text())
.then(text=>{

const json =
JSON.parse(
text.substring(47,text.length-2)
);

const rows =
json.table.rows.reverse();

if(rows.length===0) return;

const last =
rows[0];

const time =
last.c[0] ? last.c[0].v : '';

const name =
last.c[1] ? last.c[1].v : '';

const status =
last.c[2] ? last.c[2].v : '';

document.getElementById(
'statusArea'
).innerHTML =

'👤 ' + name +
'<br><br>' +
status +
'<br><br>' +
'🕒 ' + time;

rows.forEach(row=>{

const t =
row.c[0] ? row.c[0].v : '';

const s =
row.c[2] ? row.c[2].v : '';

if(
document.getElementById(
'genkiArea'
).innerHTML === '履歴なし'
&&
String(s).includes('元気')
){

document.getElementById(
'genkiArea'
).innerHTML =
s +
'<br><br>' +
t;

}

if(
document.getElementById(
'medicineArea'
).innerHTML === '履歴なし'
&&
String(s).includes('薬')
){

document.getElementById(
'medicineArea'
).innerHTML =
s +
'<br><br>' +
t;

}

if(
document.getElementById(
'gpsArea'
).innerHTML === '位置情報なし'
&&
String(s).includes('現在地')
){

document.getElementById(
'gpsArea'
).innerHTML =
s +
'<br><br>' +
t;

}

if(
document.getElementById(
'sosArea'
).innerHTML === 'SOSなし'
&&
(
String(s).includes('SOS')
||
String(s).includes('緊急')
||
String(s).includes('困')
)
){

document.getElementById(
'sosArea'
).innerHTML =
s +
'<br><br>' +
t;

}

});

});

</script>

</body>
</html>
