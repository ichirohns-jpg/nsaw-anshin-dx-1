<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>家族確認</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
padding:15px;
}

.wrap{
max-width:900px;
margin:auto;
}

.header{
background:linear-gradient(135deg,#1976d2,#64b5f6);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
font-size:40px;
font-weight:900;
margin-bottom:20px;
}

.card{
background:#fff;
border-radius:28px;
padding:24px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
margin-bottom:16px;
}

.name{
font-size:34px;
font-weight:900;
text-align:center;
margin-bottom:10px;
}

.address{
font-size:22px;
text-align:center;
margin-bottom:20px;
}

.label{
font-size:28px;
font-weight:900;
margin-bottom:10px;
}

.input{
width:100%;
height:90px;
border:2px solid #d9e2ec;
border-radius:20px;
padding:0 20px;
font-size:32px;
margin-bottom:20px;
}

.btn{
width:100%;
height:90px;
border:none;
border-radius:20px;
font-size:32px;
font-weight:900;
color:#fff;
cursor:pointer;
}

.loginBtn{
background:#00c853;
}

</style>

</head>

<body>

<div class="wrap">

<div class="header">
👪 家族確認
</div>

<div class="card">

<div
id="userName"
class="name">
利用者
</div>

<div
id="userAddress"
class="address">
住所
</div>

<div class="label">
🔐 暗証番号
</div>

<input
type="password"
id="pin"
class="input"
placeholder="暗証番号を入力">

<button
class="btn loginBtn"
onclick="checkPin()">
認証する
</button>

</div>

<div
id="historyCard"
class="card"
style="display:none;">

<div class="label">
📋 見守り履歴
</div>

<div
id="historyArea">

読込中...

</div>

</div>

</div>

<script>

const name =
new URLSearchParams(
location.search
).get("name") || "";

document.getElementById(
"userName"
).innerHTML =
name || "利用者";

document.getElementById(
"userAddress"
).innerHTML =
"志木市";

function checkPin(){

const pin =
document.getElementById(
"pin"
).value;

const savedPin =
localStorage.getItem(
"supportPin"
) || "1234";

if(
pin !== savedPin
){

alert(
"暗証番号が違います"
);

return;

}

document.getElementById(
"historyCard"
).style.display =
"block";

loadHistory();

}

function loadHistory(){

document.getElementById(
"historyArea"
).innerHTML =

`

<div style="
padding:12px;
border-bottom:1px solid #ddd;
">
2026/06/13 08:10
<br>
😊 元気です
</div>

<div style="
padding:12px;
border-bottom:1px solid #ddd;
">
2026/06/13 12:00
<br>
💊 薬を飲みました
</div>

<div style="
padding:12px;
">
2026/06/13 18:20
<br>
📍 現在地送信
</div>

`;

}

</script>

</body>
</html>
