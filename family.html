<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>家族ページ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:18px;
color:#1f2d3d;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
color:#fff;
padding:28px;
border-radius:28px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:36px;
font-weight:900;
}

.card{
background:#fff;
border-radius:26px;
padding:20px;
margin-bottom:14px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.cardTitle{
font-size:20px;
font-weight:900;
margin-bottom:10px;
color:#64748b;
}

.cardValue{
font-size:26px;
font-weight:900;
line-height:1.6;
word-break:break-word;
}

.green{
border-left:10px solid #16a34a;
}

.blue{
border-left:10px solid #2563eb;
}

.orange{
border-left:10px solid #ea580c;
}

.red{
border-left:10px solid #dc2626;
}

.gray{
border-left:10px solid #475569;
}

.btn{
display:block;
width:100%;
padding:22px;
border-radius:20px;
text-decoration:none;
text-align:center;
font-size:24px;
font-weight:900;
color:#fff;
margin-top:12px;
}

.call{
background:#16a34a;
}

.map{
background:#2563eb;
}

.history{
background:#475569;
}

.home{
background:#334155;
}

</style>

</head>

<body>

<div class="header">
<h1>👪 家族ページ</h1>
</div>

<div class="card green">

<div class="cardTitle">
😊 最終元気です
</div>

<div
id="genkiArea"
class="cardValue">

履歴なし

</div>

</div>

<div class="card blue">

<div class="cardTitle">
💊 最終服薬
</div>

<div
id="medicineArea"
class="cardValue">

履歴なし

</div>

</div>

<div class="card orange">

<div class="cardTitle">
📅 今日の予定
</div>

<div
id="scheduleArea"
class="cardValue">

予定なし

</div>

</div>

<div class="card gray">

<div class="cardTitle">
📍 最終位置
</div>

<div
id="gpsArea"
class="cardValue">

位置情報なし

</div>

</div>

<div class="card red">

<div class="cardTitle">
🚨 SOS
</div>

<div
id="sosArea"
class="cardValue">

SOSなし

</div>

</div>

<a
href="tel:09000000000"
class="btn call">

📞 電話する

</a>

<a
href="https://maps.google.com"
target="_blank"
class="btn map">

📍 地図を開く

</a>

<a
href="history.html"
class="btn history">

📋 見守り履歴

</a>

<a
href="index.html"
class="btn home">

🏠 トップへ戻る

</a>

<script>

const scheduleData =
localStorage.getItem(
'scheduleData'
);

if(scheduleData){

const data =
JSON.parse(scheduleData);

document.getElementById(
'scheduleArea'
).innerHTML =

'🏥 ' +
(data.hospital || '-') +

'<br>' +

'🛒 ' +
(data.shopping || '-') +

'<br>' +

'🚌 ' +
(data.dayservice || '-') +

'<br>' +

'💊 ' +
(data.medicineTime || '-');

}

const lastSOS =
localStorage.getItem(
'lastSOS'
);

if(lastSOS){

const sos =
JSON.parse(lastSOS);

document.getElementById(
'sosArea'
).innerHTML =

sos.type +

'<br><br>' +

sos.memo +

'<br><br>' +

sos.time;

}

</script>

</body>
</html>
