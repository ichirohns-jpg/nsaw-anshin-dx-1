<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>家族確認｜見守りDX</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:linear-gradient(
180deg,
#000000 0%,
#0a1220 50%,
#000000 100%
);
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
color:#fff;
min-height:100vh;
}

.banner{
height:260px;
overflow:hidden;
}

.banner img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.wrap{
max-width:900px;
margin:auto;
padding:18px;
}

.header{
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.15);
border-radius:28px;
padding:24px;
margin-bottom:18px;
}

.back{
font-size:18px;
font-weight:900;
cursor:pointer;
margin-bottom:14px;
}

.title{
font-size:36px;
font-weight:900;
}

.sub{
margin-top:8px;
font-size:14px;
opacity:.8;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.15);
border-radius:24px;
padding:20px;
margin-bottom:16px;
}

.cardTitle{
font-size:24px;
font-weight:900;
margin-bottom:12px;
}

.row{
padding:10px 0;
border-bottom:1px solid rgba(255,255,255,.08);
line-height:1.7;
}

.row:last-child{
border-bottom:none;
}

.footer{
text-align:center;
padding:20px;
font-size:12px;
opacity:.6;
}

</style>
</head>

<body>

<div class="banner">
<img src="family-top.jpg">
</div>

<div class="wrap">

<div class="header">

<div
class="back"
onclick="location.href='index.html'">
← ホームへ戻る
</div>

<div class="title">
👪 家族確認
</div>

<div class="sub">
本人の状況を確認
</div>

</div>

<div id="dashboard">

<div class="card">
<div class="cardTitle">
読み込み中...
</div>
</div>

</div>

<div class="footer">
NSAW 家族ダッシュボード
</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

async function loadDashboard(){

const params =
new URLSearchParams(
location.search
);

const id =
params.get("id") || "";

try{

const response =
await fetch(
GAS_URL +
"?action=dashboard&id=" +
encodeURIComponent(id)
);

const json =
await response.json();

const user =
json.user || {};

const latest =
json.latest || {};

const medicine =
json.medicine || [];

const schedules =
json.schedules || [];

const location =
json.location || {};

const emergency =
json.emergency || {};

let html = "";

html += `
<div class="card">
<div class="cardTitle">
👤 ${user.name || "利用者"}
</div>

<div class="row">
最終確認：${latest.time || "-"}
</div>

<div class="row">
状態：${latest.status || "-"}
</div>

<div class="row">
内容：${latest.memo || "-"}
</div>
</div>
`;

html += `
<div class="card">
<div class="cardTitle">
💊 服薬状況
</div>

<div class="row">
${medicine.length ? medicine[0].memo : "記録なし"}
</div>
</div>
`;

html += `
<div class="card">
<div class="cardTitle">
📅 予定
</div>
`;

if(schedules.length){

schedules.slice(0,5).forEach(v=>{

html += `
<div class="row">
${v.date} ${v.time}<br>
${v.title}
</div>
`;

});

}else{

html += `
<div class="row">
予定なし
</div>
`;

}

html += `
</div>
`;

html += `
<div class="card">
<div class="cardTitle">
📍 現在地
</div>

<div class="row">
緯度：${location.lat || "-"}
</div>

<div class="row">
経度：${location.lng || "-"}
</div>
</div>
`;

html += `
<div class="card">
<div class="cardTitle">
☎ 緊急通知
</div>

<div class="row">
${emergency ? emergency.memo || "なし" : "なし"}
</div>
</div>
`;

document.getElementById(
"dashboard"
).innerHTML = html;

}catch(error){

document.getElementById(
"dashboard"
).innerHTML =
"取得エラー";

}

}

loadDashboard();

</script>

</body>
</html>
