<script>

const scheduleData =
localStorage.getItem(
'scheduleData'
);

if(scheduleData){

const data =
JSON.parse(
scheduleData
);

document.getElementById(
'scheduleArea'
).innerHTML =

'🏥 ' +
(data.hospital || '-') +

'<br><br>' +

'🕒 ' +
(data.hospitalTime || '-') +

'<br><br>' +

'🛒 ' +
(data.shopping || '-') +

'<br><br>' +

'🕒 ' +
(data.shoppingTime || '-') +

'<br><br>' +

'🚌 ' +
(data.dayservice || '-') +

'<br><br>' +

'🕒 ' +
(data.dayserviceTime || '-') +

'<br><br>' +

'💊 ' +
(data.medicineTime || '-') +

'<br><br>' +

'📝 ' +
(data.memo || '-');

}

const lastSOS =
localStorage.getItem(
'lastSOS'
);

if(lastSOS){

const sos =
JSON.parse(
lastSOS
);

document.getElementById(
'sosArea'
).innerHTML =

'🚨 ' +
sos.type +

'<br><br>' +

sos.memo +

'<br><br>' +

sos.time;

}

</script>
