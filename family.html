<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>支援者ページ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#101827;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
color:#fff;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:linear-gradient(135deg,#1e293b,#0f172a);
padding:22px;
border-radius:24px;
margin-bottom:14px;
}

.title{
font-size:24px;
font-weight:900;
margin-bottom:12px;
}

.item{
padding:18px;
border-radius:18px;
background:rgba(255,255,255,.08);
font-size:20px;
font-weight:900;
line-height:1.8;
}

.sos{
border-left:8px solid #ef4444;
}

.genki{
border-left:8px solid #22c55e;
}

.medicine{
border-left:8px solid #3b82f6;
}

.gps{
border-left:8px solid #06b6d4;
}

.homeStatus{
border-left:8px solid #2563eb;
}

.schedule{
border-left:8px solid #8b5cf6;
}

.btn{
display:block;
width:100%;
padding:22px;
border-radius:22px;
text-decoration:none;
text-align:center;
font-size:24px;
font-weight:900;
color:#fff;
background:linear-gradient(135deg,#475569,#334155);
margin-top:16px;
}

</style>

</head>

<body>

<div class="header">
<h1>👪 支援者ページ</h1>
</div>

<div class="card">
<div class="title">🚨 SOS</div>
<div id="sosArea" class="item sos">
読込中...
</div>
</div>

<div class="card">
<div class="title">😊 今日の体調</div>
<div id="genkiArea" class="item genki">
読込中...
</div>
</div>

<div class="card">
<div class="title">🏠 帰宅しました</div>
<div id="homeArea" class="item homeStatus">
読込中...
</div>
</div>

<div class="card">
<div class="title">💊 服薬状況</div>
<div id="medicineArea" class="item medicine">
読込中...
</div>
</div>

<div class="card">
<div class="title">📅 今後の予定</div>
<div id="scheduleArea" class="item schedule">
読込中...
</div>
</div>

<div class="card">
<div class="title">📍 現在地</div>
<div id="gpsArea" class="item gps">
読込中...
</div>
</div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec';

const USER_ID =
localStorage.getItem(
'userId'
) || '';

function loadFamily(){

fetch(
GAS_URL +
'?action=family&id=' +
encodeURIComponent(USER_ID)
)

.then(r=>r.json())

.then(data=>{

if(data.sos){

document.getElementById(
'sosArea'
).innerHTML =

data.sos;

}

if(data.genki){

document.getElementById(
'genkiArea'
).innerHTML =

data.genki;

}

if(data.home){

document.getElementById(
'homeArea'
).innerHTML =

data.home;

}

if(data.medicine){

document.getElementById(
'medicineArea'
).innerHTML =

data.medicine;

}

if(data.schedule){

document.getElementById(
'scheduleArea'
).innerHTML =

data.schedule;

}

if(data.gps){

document.getElementById(
'gpsArea'
).innerHTML =

data.gps;

}

})

.catch(()=>{

document.getElementById(
'sosArea'
).innerHTML =
'取得失敗';

document.getElementById(
'genkiArea'
).innerHTML =
'取得失敗';

document.getElementById(
'homeArea'
).innerHTML =
'取得失敗';

document.getElementById(
'medicineArea'
).innerHTML =
'取得失敗';

document.getElementById(
'scheduleArea'
).innerHTML =
'取得失敗';

document.getElementById(
'gpsArea'
).innerHTML =
'取得失敗';

});

}

loadFamily();

</script>

<a href="index.html" class="btn">
🏠 トップへ戻る
</a>

</body>
</html>
