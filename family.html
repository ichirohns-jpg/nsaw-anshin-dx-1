<script>

const name =
new URLSearchParams(
location.search
).get("name") || "";

document.getElementById(
"userName"
).innerHTML =
name || "利用者";

document.getElementById(
"userAddress"
).innerHTML =
"志木市";

function checkPin(){

const pin =
document.getElementById(
"pin"
).value;

const savedPin =
localStorage.getItem(
"supportPin"
) || "1234";

if(
pin !== savedPin
){

alert(
"暗証番号が違います"
);

return;

}

document.getElementById(
"historyCard"
).style.display =
"block";

document.getElementById(
"mapCard"
).style.display =
"block";

document.getElementById(
"medicineCard"
).style.display =
"block";

document.getElementById(
"statusCard"
).style.display =
"block";

loadHistory();
loadMap();
loadMedicine();
loadStatus();

}
