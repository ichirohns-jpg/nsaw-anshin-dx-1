<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>支援者ページ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
background:#101827;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
padding:16px;
color:#fff;
}

.header{
background:linear-gradient(135deg,#111827,#334155);
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:34px;
font-weight:900;
}

.card{
background:linear-gradient(135deg,#1e293b,#0f172a);
padding:22px;
border-radius:24px;
margin-bottom:14px;
}

.title{
font-size:24px;
font-weight:900;
margin-bottom:12px;
}

.item{
padding:18px;
border-radius:18px;
background:rgba(255,255,255,.08);
font-size:20px;
font-weight:900;
line-height:1.8;
}

.sos{
border-left:8px solid #ef4444;
}

.trouble{
border-left:8px solid #f59e0b;
}

.genki{
border-left:8px solid #22c55e;
}

.medicine{
border-left:8px solid #3b82f6;
}

.gps{
border-left:8px solid #06b6d4;
}

.schedule{
border-left:8px solid #a855f7;
}

.btn{
display:block;
width:100%;
padding:22px;
border-radius:22px;
text-decoration:none;
text-align:center;
font-size:24px;
font-weight:900;
color:#fff;
background:linear-gradient(135deg,#475569,#334155);
margin-top:16px;
}

.mapBtn{
display:inline-block;
padding:12px 18px;
border-radius:14px;
background:#2563eb;
color:#fff;
text-decoration:none;
margin-top:10px;
}

</style>
</head>

<body>

<div class="header">
<h1>👪 支援者ページ</h1>
</div>

<div class="card">

<div class="title">
🚨 SOS・困りごと
</div>

<div id="sosArea" class="item sos">
記録なし
</div>

</div>

<div class="card">

<div class="title">
😊 最終元気です
</div>

<div id="genkiArea" class="item genki">
記録なし
</div>

</div>

<div class="card">

<div class="title">
💊 服薬状況
</div>

<div id="medicineArea" class="item medicine">
記録なし
</div>

</div>

<div class="card">

<div class="title">
📅 予定
</div>

<div id="scheduleArea" class="item schedule">
予定なし
</div>

</div>

<div class="card">

<div class="title">
📍 現在地
</div>

<div id="gpsArea" class="item gps">
位置情報なし
</div>

</div>

<a href="index.html" class="btn">
🏠 トップへ戻る
</a>

<script>

const lastSOS =
JSON.parse(
localStorage.getItem(
'lastSOS'
) || 'null'
);

if(lastSOS){

document.getElementById(
'sosArea'
).innerHTML =

(lastSOS.mainType || '') +
'<br><br>' +

(lastSOS.type || '') +
'<br><br>' +

(lastSOS.memo || '') +
'<br><br>' +

(lastSOS.time || '');

}

const lastGenki =
JSON.parse(
localStorage.getItem(
'lastGenki'
) || 'null'
);

if(lastGenki){

document.getElementById(
'genkiArea'
).innerHTML =

'😊 元気です<br><br>' +

lastGenki.time;

}

const medicine =
JSON.parse(
localStorage.getItem(
'medicineStatus'
) || '{}'
);

let med='';

if(medicine.morning){
med += '☑ 朝<br>';
}

if(medicine.noon){
med += '☑ 昼<br>';
}

if(medicine.evening){
med += '☑ 夕方<br>';
}

if(medicine.night){
med += '☑ 寝る前<br>';
}

if(med){
document.getElementById(
'medicineArea'
).innerHTML = med;
}

const schedules =
JSON.parse(
localStorage.getItem(
'schedules'
) || '[]'
);

if(schedules.length){

let html='';

schedules.slice(0,5).forEach(item=>{

html +=
item.date +
' ' +
(item.time || '') +

'<br>' +

item.title +

'<br><br>';

});

document.getElementById(
'scheduleArea'
).innerHTML =
html;

}

const gps =
JSON.parse(
localStorage.getItem(
'lastGPS'
) || 'null'
);

if(gps){

document.getElementById(
'gpsArea'
).innerHTML =

gps.time +

'<br><br>' +

'<a class="mapBtn" href="' +

gps.mapUrl +

'" target="_blank">地図を見る</a>';

}

</script>

</body>
</html>
