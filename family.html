<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>家族確認｜見守りDX</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:
linear-gradient(
180deg,
#000000 0%,
#0a1220 50%,
#000000 100%
);
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
color:#fff;
min-height:100vh;
}

.wrap{
max-width:760px;
margin:auto;
padding:18px;
}

.header{
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.15);
border-radius:28px;
padding:24px;
margin-bottom:18px;
}

.back{
font-size:18px;
font-weight:900;
cursor:pointer;
margin-bottom:14px;
}

.title{
font-size:38px;
font-weight:900;
}

.sub{
margin-top:8px;
font-size:15px;
opacity:.8;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.15);
border-radius:24px;
padding:18px;
margin-bottom:16px;
}

button{
width:100%;
border:none;
border-radius:20px;
padding:18px;
font-size:22px;
font-weight:900;
cursor:pointer;
color:#fff;
margin-bottom:12px;
}

.blue{
background:
linear-gradient(
135deg,
#1565c0,
#42a5f5
);
}

.green{
background:
linear-gradient(
135deg,
#00c853,
#00e676
);
}

.red{
background:
linear-gradient(
135deg,
#c62828,
#ef5350
);
}

.item{
background:rgba(255,255,255,.06);
border-radius:18px;
padding:14px;
margin-bottom:10px;
}

.name{
font-size:22px;
font-weight:900;
}

.status{
font-size:18px;
margin-top:6px;
}

.time{
font-size:13px;
opacity:.7;
margin-top:6px;
}

.footer{
text-align:center;
padding:20px;
font-size:12px;
opacity:.6;
}

</style>
</head>

<body>

<div class="wrap">

<div class="header">

<div
class="back"
onclick="location.href='index.html'">
← ホームへ戻る
</div>

<div class="title">
家族確認
</div>

<div class="sub">
見守り状況を確認します
</div>

</div>

<div class="card">

<button
class="blue"
onclick="loadRecords()">
最新状況を更新
</button>

<div id="records">
読み込み待機中
</div>

</div>

<div class="card">

<button
class="green"
onclick="loadUsers()">
利用者一覧
</button>

<div id="users">
読み込み待機中
</div>

</div>

<div class="card">

<button
class="red"
onclick="ping()">
サーバー確認
</button>

<div id="ping">
未確認
</div>

</div>

<div class="footer">
NSAW 家族確認システム
</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbxHknfXsWiwwIhuJ88JFDNRi51jEvD-vgzdeld3YTnfL_0CsrhKmTzxaWUFLVnisRCp/exec";

function loadRecords(){

fetch(GAS_URL + "?action=records")
.then(r=>r.json())
.then(data=>{

let html="";

(data.data || []).forEach(v=>{

html += `
<div class="item">

<div class="name">
${v.name || ""}
</div>

<div class="status">
${v.status || ""}
</div>

<div class="time">
${v.time || ""}
</div>

</div>
`;

});

document.getElementById("records").innerHTML =
html || "データなし";

})
.catch(()=>{

document.getElementById("records").innerHTML =
"取得エラー";

});

}

function loadUsers(){

fetch(GAS_URL + "?action=users")
.then(r=>r.json())
.then(data=>{

let html="";

(data.data || []).forEach(v=>{

html += `
<div class="item">
${v.name || ""}
</div>
`;

});

document.getElementById("users").innerHTML =
html || "利用者なし";

})
.catch(()=>{

document.getElementById("users").innerHTML =
"取得エラー";

});

}

function ping(){

fetch(GAS_URL + "?action=ping")
.then(r=>r.json())
.then(data=>{

document.getElementById("ping").innerHTML =
JSON.stringify(data);

})
.catch(()=>{

document.getElementById("ping").innerHTML =
"PING ERROR";

});

}

loadRecords();

</script>

</body>
</html>
