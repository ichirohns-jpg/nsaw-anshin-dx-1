<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>地域マップ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}

.header{
background:linear-gradient(135deg,#0f172a,#334155);
color:#fff;
padding:30px;
text-align:center;
}

.header h1{
font-size:40px;
font-weight:900;
}

.wrap{
padding:18px;
max-width:1000px;
margin:auto;
}

.btn{
display:block;
width:100%;
padding:22px;
margin-bottom:14px;
border-radius:24px;
text-decoration:none;
text-align:center;
font-size:26px;
font-weight:900;
color:#fff;
}

.hospital{
background:#2563eb;
}

.pharmacy{
background:#16a34a;
}

.store{
background:#ea580c;
}

.toilet{
background:#7c3aed;
}

.shelter{
background:#dc2626;
}

.map{
width:100%;
height:70vh;
border:none;
border-radius:30px;
margin-top:12px;
box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.back{
background:#334155;
}

</style>

</head>

<body>

<div class="header">
<h1>🗺 地域マップ</h1>
</div>

<div class="wrap">

<a
href="https://www.google.com/maps/search/病院"
target="_blank"
class="btn hospital">
🏥 病院
</a>

<a
href="https://www.google.com/maps/search/薬局"
target="_blank"
class="btn pharmacy">
💊 薬局
</a>

<a
href="https://www.google.com/maps/search/コンビニ"
target="_blank"
class="btn store">
🏪 コンビニ
</a>

<a
href="https://www.google.com/maps/search/公衆トイレ"
target="_blank"
class="btn toilet">
🚻 トイレ
</a>

<a
href="https://www.google.com/maps/search/避難所"
target="_blank"
class="btn shelter">
🚨 避難所
</a>

<iframe
class="map"
src="https://maps.google.com/maps?q=志木駅&t=&z=14&ie=UTF8&iwloc=&output=embed">
</iframe>

<a
href="index.html"
class="btn back">
トップへ戻る
</a>

</div>

</body>
</html>
