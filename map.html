<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>現在地・地図｜見守りDX</title>

<link rel="icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
background:linear-gradient(180deg,#000000 0%,#08111d 50%,#000000 100%);
color:#fff;
min-height:100vh;
}

.wrap{
max-width:900px;
margin:auto;
padding:16px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:20px;
margin-bottom:16px;
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
margin-bottom:15px;
}

.name{
font-size:24px;
font-weight:900;
text-align:center;
margin-bottom:15px;
}

.info{
font-size:18px;
line-height:1.8;
margin-bottom:10px;
}

#map{
width:100%;
height:400px;
border-radius:20px;
border:none;
background:#fff;
}

button{
width:100%;
border:none;
border-radius:18px;
padding:18px;
font-size:20px;
font-weight:900;
color:#fff;
cursor:pointer;
margin-bottom:10px;
}

.gps-btn{
background:linear-gradient(135deg,#00a3c4,#00d4ff);
}

.home-btn{
background:linear-gradient(135deg,#455a64,#607d8b);
}

.msg{
text-align:center;
font-size:18px;
font-weight:900;
margin-top:10px;
}

.footer{
text-align:center;
padding:20px;
font-size:12px;
opacity:.6;
}

</style>

</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
📍 現在地確認
</div>

<div
id="userName"
class="name">
読み込み中...
</div>

<div
id="locationText"
class="info">
位置情報未取得
</div>

<button
class="gps-btn"
onclick="sendLocation()">
📍 現在地を送信
</button>

<div
id="msg"
class="msg">
</div>

</div>

<div class="card">

<iframe
id="map"
src="https://maps.google.com/maps?q=35.8206,139.5753&z=15&output=embed">
</iframe>

</div>

<div class="card">

<button
class="home-btn"
onclick="location.href='app.html?id='+USER_ID">
😊 本人ページ
</button>

<button
class="home-btn"
onclick="location.href='index.html'">
🏠 ホームへ戻る
</button>

</div>

<div class="footer">
NSAW 位置情報管理
</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

const params =
new URLSearchParams(location.search);

const USER_ID =
params.get("id") || "";

async function loadUser(){

try{

const response =
await fetch(
GAS_URL +
"?action=user&id=" +
encodeURIComponent(USER_ID)
);

const json =
await response.json();

const user =
json.data || {};

document.getElementById("userName").innerHTML =
user.name || "利用者";

}catch(error){

document.getElementById("userName").innerHTML =
"利用者";

}

}

function sendLocation(){

if(!navigator.geolocation){

document.getElementById("msg").innerHTML =
"GPS非対応";

return;

}

document.getElementById("msg").innerHTML =
"取得中...";

navigator.geolocation.getCurrentPosition(

async function(position){

const lat =
position.coords.latitude;

const lng =
position.coords.longitude;

document.getElementById("locationText").innerHTML =
lat + "," + lng;

document.getElementById("map").src =
"https://maps.google.com/maps?q=" +
lat +
"," +
lng +
"&z=17&output=embed";

const body =
new URLSearchParams();

body.append("action","location");
body.append("id",USER_ID);
body.append("lat",lat);
body.append("lng",lng);

try{

await fetch(
GAS_URL,
{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:body.toString()
}
);

document.getElementById("msg").innerHTML =
"送信完了";

}catch(error){

document.getElementById("msg").innerHTML =
"送信失敗";

}

},

function(){

document.getElementById("msg").innerHTML =
"位置情報取得失敗";

}

);

}

loadUser();

</script>

</body>
</html>
