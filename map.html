<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>病院・避難所｜あんしん生活ボタン</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.app-box{
max-width:560px;
margin:0 auto;
padding:18px 14px 34px;
}

.badge{
display:inline-block;
background:#e53935;
color:#fff;
border-radius:999px;
padding:10px 18px;
font-size:17px;
font-weight:900;
}

.header{text-align:center;margin-bottom:16px}

.card{
background:#fff;
border-radius:26px;
padding:24px 20px;
box-shadow:0 8px 22px rgba(0,0,0,.10);
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
margin:0 0 8px;
color:#e53935;
}

.lead{
font-size:19px;
font-weight:800;
text-align:center;
line-height:1.6;
color:#555;
margin:0 0 22px;
}

.gps-box{
background:#fff3f3;
border:3px solid #ffd0d0;
border-radius:20px;
padding:16px;
font-size:20px;
font-weight:900;
line-height:1.7;
text-align:center;
margin-bottom:18px;
word-break:break-all;
}

.btn{
display:block;
width:100%;
border:none;
text-decoration:none;
border-radius:22px;
padding:24px 18px;
margin-bottom:16px;
font-size:27px;
font-weight:900;
color:#fff;
text-align:center;
box-shadow:0 6px 12px rgba(0,0,0,.13);
}

.red{background:#e53935}
.blue{background:#1976d2}
.green{background:#2eaf66}
.orange{background:#f39c12}
.gray{background:#607d8b}
.purple{background:#7e57c2}

.back{
display:block;
margin-top:22px;
text-align:center;
font-size:20px;
font-weight:900;
text-decoration:none;
color:#1976d2;
}
</style>
</head>

<body>

<div class="app-box">

  <div class="header">
    <span class="badge">近くの場所</span>
  </div>

  <div class="card">

    <h1 class="title">病院・避難所</h1>

    <p class="lead">
      現在地から近くの場所を<br>
      Googleマップで開きます。
    </p>

    <div class="gps-box" id="gpsBox">
      現在地を確認しています…
    </div>

    <button class="btn red" onclick="getGps()">📍 現在地を取得する</button>

    <a class="btn blue" id="hospital" target="_blank">🏥 近くの病院</a>
    <a class="btn green" id="pharmacy" target="_blank">💊 近くの薬局</a>
    <a class="btn orange" id="shelter" target="_blank">🏫 避難所</a>
    <a class="btn purple" id="supermarket" target="_blank">🛒 スーパー</a>
    <a class="btn gray" id="convenience" target="_blank">🏪 コンビニ</a>

    <a href="index.html" class="back">トップへ戻る</a>

  </div>

</div>

<script>
function setLinks(lat,lng){
  const base = "https://www.google.com/maps/search/";

  document.getElementById("hospital").href =
    base + encodeURIComponent("病院") + "/@" + lat + "," + lng + ",15z";

  document.getElementById("pharmacy").href =
    base + encodeURIComponent("薬局") + "/@" + lat + "," + lng + ",15z";

  document.getElementById("shelter").href =
    base + encodeURIComponent("避難所") + "/@" + lat + "," + lng + ",15z";

  document.getElementById("supermarket").href =
    base + encodeURIComponent("スーパー") + "/@" + lat + "," + lng + ",15z";

  document.getElementById("convenience").href =
    base + encodeURIComponent("コンビニ") + "/@" + lat + "," + lng + ",15z";
}

function showGps(lat,lng){
  document.getElementById("gpsBox").innerHTML =
    "現在地を使えます。<br>" +
    "緯度：" + lat + "<br>" +
    "経度：" + lng;

  setLinks(lat,lng);
}

function getGps(){
  const gpsBox = document.getElementById("gpsBox");

  if(!navigator.geolocation){
    gpsBox.innerHTML = "このスマホでは現在地取得が使えません。";
    return;
  }

  gpsBox.innerHTML = "現在地を取得しています…";

  navigator.geolocation.getCurrentPosition(
    function(pos){
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const now = new Date().toLocaleString("ja-JP");

      localStorage.setItem("lat",lat);
      localStorage.setItem("lng",lng);
      localStorage.setItem("gpsSavedAt",now);

      showGps(lat,lng);
    },
    function(){
      gpsBox.innerHTML =
        "現在地を取得できませんでした。<br>" +
        "設定画面でGPS取得を押してください。";
    },
    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:0
    }
  );
}

const savedLat = localStorage.getItem("lat");
const savedLng = localStorage.getItem("lng");

if(savedLat && savedLng){
  showGps(savedLat,savedLng);
}else{
  document.getElementById("gpsBox").innerHTML =
    "現在地はまだ保存されていません。<br>赤いボタンを押してください。";
}
</script>

</body>
</html>
