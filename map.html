<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>現在地送信</title>

<link rel="icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
background:linear-gradient(180deg,#000000 0%,#08111d 50%,#000000 100%);
color:#fff;
min-height:100vh;
}

.wrap{
max-width:760px;
margin:auto;
padding:16px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:20px;
margin-bottom:16px;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
margin-bottom:20px;
}

.name{
font-size:26px;
font-weight:900;
text-align:center;
margin-bottom:15px;
}

.location{
background:rgba(255,255,255,.08);
border-radius:18px;
padding:14px;
margin-bottom:12px;
line-height:1.8;
word-break:break-all;
}

button{
width:100%;
border:none;
cursor:pointer;
color:#fff;
font-weight:900;
padding:22px;
border-radius:20px;
font-size:22px;
margin-bottom:12px;
}

.send-btn{
background:linear-gradient(135deg,#00a3c4,#00d4ff);
}

.map-btn{
background:linear-gradient(135deg,#43a047,#66bb6a);
}

.home-btn{
background:linear-gradient(135deg,#37474f,#607d8b);
}

.msg{
text-align:center;
font-size:20px;
font-weight:900;
margin-top:10px;
min-height:30px;
}

.footer{
text-align:center;
padding:20px;
opacity:.6;
font-size:12px;
}

</style>

</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
📍 現在地送信
</div>

<div
id="userName"
class="name">
読み込み中...
</div>

<div
id="locationText"
class="location">
位置情報未取得
</div>

<button
class="send-btn"
onclick="sendLocation()">
📍 現在地を送信
</button>

<button
class="map-btn"
id="mapOpenBtn">
🗺 Googleマップで開く
</button>

<div
id="msg"
class="msg">
</div>

</div>

<div class="card">

<button
class="home-btn"
onclick="location.href='app.html?id='+USER_ID">
😊 本人ページ
</button>

<button
class="home-btn"
onclick="location.href='index.html'">
🏠 ホームへ戻る
</button>

</div>

<div class="footer">
NSAW 現在地送信
</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

const params =
new URLSearchParams(location.search);

const USER_ID =
params.get("id") || "";

let currentLat = "";
let currentLng = "";

async function loadUser(){

try{

const response =
await fetch(
GAS_URL +
"?action=user&id=" +
encodeURIComponent(USER_ID)
);

const json =
await response.json();

document.getElementById("userName").innerHTML =
(json.data || {}).name || "利用者";

}catch(error){

document.getElementById("userName").innerHTML =
"利用者";

}

}

function sendLocation(){

document.getElementById("msg").innerHTML =
"位置取得中...";

navigator.geolocation.getCurrentPosition(

async function(pos){

currentLat =
pos.coords.latitude;

currentLng =
pos.coords.longitude;

document.getElementById("locationText").innerHTML =
currentLat + "," + currentLng;

document.getElementById("mapOpenBtn").onclick =
function(){

window.open(
"https://maps.google.com/?q=" +
currentLat +
"," +
currentLng
);

};

try{

const body =
new URLSearchParams();

body.append("action","watch");
body.append("id",USER_ID);
body.append("status","位置情報");
body.append(
"memo",
currentLat + "," + currentLng
);

await fetch(
GAS_URL,
{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:body.toString()
}
);

document.getElementById("msg").innerHTML =
"送信完了";

}catch(error){

document.getElementById("msg").innerHTML =
"通信エラー";

}

},

function(){

document.getElementById("msg").innerHTML =
"位置取得失敗";

}

);

}

loadUser();

</script>

</body>
</html>
