<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>現在地｜見守りDX</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:linear-gradient(
180deg,
#000000 0%,
#0a1220 50%,
#000000 100%
);
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
color:#fff;
min-height:100vh;
}

.banner{
height:260px;
overflow:hidden;
margin-bottom:18px;
}

.banner img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.wrap{
max-width:900px;
margin:auto;
padding:18px;
}

.header{
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.15);
border-radius:28px;
padding:24px;
margin-bottom:18px;
}

.back{
font-size:18px;
font-weight:900;
cursor:pointer;
margin-bottom:14px;
}

.title{
font-size:38px;
font-weight:900;
}

.sub{
margin-top:8px;
font-size:15px;
opacity:.8;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.15);
border-radius:24px;
padding:18px;
margin-bottom:16px;
}

#map{
height:500px;
border-radius:20px;
overflow:hidden;
}

.btn{
width:100%;
border:none;
border-radius:20px;
padding:18px;
font-size:22px;
font-weight:900;
cursor:pointer;
color:#fff;
margin-top:14px;
background:linear-gradient(
135deg,
#1565c0,
#42a5f5
);
}

.footer{
text-align:center;
padding:20px;
font-size:12px;
opacity:.6;
}

</style>

</head>

<body>

<div class="banner">
<img src="map-top.jpg">
</div>

<div class="wrap">

<div class="header">

<div
class="back"
onclick="location.href='family.html'">
← 家族確認へ戻る
</div>

<div class="title">
📍 現在地
</div>

<div class="sub">
国土地理院地図
</div>

</div>

<div class="card">

<div id="map"></div>

<button
class="btn"
onclick="getLocation()">
現在地を取得
</button>

</div>

<div class="footer">
NSAW 地域マップ
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbxHknfXsWiwwIhuJ88JFDNRi51jEvD-vgzdeld3YTnfL_0CsrhKmTzxaWUFLVnisRCp/exec";

const map =
L.map("map").setView(
[35.7937,139.5756],
15
);

L.tileLayer(
"https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png",
{
attribution:"国土地理院"
}
).addTo(map);

let marker = null;

function getLocation(){

if(!navigator.geolocation){

alert("位置情報が使えません");
return;

}

navigator.geolocation.getCurrentPosition(

async function(pos){

const lat =
pos.coords.latitude;

const lng =
pos.coords.longitude;

map.setView(
[lat,lng],
17
);

if(marker){

map.removeLayer(marker);

}

marker =
L.marker([lat,lng])
.addTo(map)
.bindPopup("現在地")
.openPopup();

try{

const params =
new URLSearchParams();

params.append(
"name",
"山口貞一郎"
);

params.append(
"status",
"位置情報"
);

params.append(
"memo",
lat + "," + lng
);

await fetch(
GAS_URL,
{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:params.toString()
}
);

alert("位置情報を送信しました");

}catch(error){

alert("送信失敗");

}

},

function(){

alert("位置情報取得失敗");

}

);

}

</script>

</body>
</html>
