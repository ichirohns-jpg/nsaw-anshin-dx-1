<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>現在地｜見守りDX</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef4fb;
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
color:#1f2d3d;
}

.wrap{
max-width:560px;
margin:auto;
padding:16px;
}

.header{
background:#00897b;
color:#fff;
border-radius:26px;
padding:22px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.back{
font-size:16px;
font-weight:900;
margin-bottom:12px;
cursor:pointer;
}

.title{
font-size:34px;
font-weight:900;
}

.sub{
font-size:16px;
margin-top:6px;
opacity:.95;
}

.card{
background:#fff;
border-radius:26px;
padding:20px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.mapBox{
background:#e0f2f1;
border-radius:22px;
padding:20px;
text-align:center;
}

.mapTitle{
font-size:24px;
font-weight:900;
margin-bottom:12px;
color:#00695c;
}

.mapText{
font-size:18px;
font-weight:700;
line-height:1.7;
color:#555;
}

.btn{
width:100%;
border:none;
border-radius:22px;
padding:22px;
font-size:24px;
font-weight:900;
color:#fff;
background:#00897b;
margin-top:18px;
cursor:pointer;
}

.btn:active{
transform:scale(.97);
}

.footer{
display:flex;
justify-content:space-around;
margin-top:20px;
padding:18px 0;
background:#fff;
border-radius:22px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
font-size:14px;
font-weight:900;
color:#666;
}

.toast{
position:fixed;
left:50%;
bottom:30px;
transform:translateX(-50%);
background:#00897b;
color:#fff;
padding:16px 24px;
border-radius:18px;
font-size:18px;
font-weight:900;
display:none;
z-index:9999;
}

</style>
</head>

<body>

<div class="wrap">

<div class="header">

<div class="back" onclick="location.href='index.html'">
← トップへ戻る
</div>

<div class="title">
📍 現在地
</div>

<div class="sub">
位置情報を確認します
</div>

</div>

<div class="card">

<div class="mapBox">

<div class="mapTitle">
現在地確認
</div>

<div class="mapText">
ボタンを押すと現在地をGoogleマップで表示します。
</div>

<button class="btn" onclick="openMap()">
📍 現在地を開く
</button>

</div>

</div>

<div class="footer">

<div onclick="location.href='index.html'">
見守り
</div>

<div onclick="location.href='schedule.html'">
予定
</div>

<div onclick="location.href='gomi.html'">
ゴミ
</div>

<div onclick="location.href='news.html'">
地域情報
</div>

</div>

</div>

<div id="toast" class="toast"></div>

<script>

function showToast(text){

const toast=document.getElementById("toast");

toast.innerText=text;

toast.style.display="block";

setTimeout(function(){
toast.style.display="none";
},2000);

}

function openMap(){

if(!navigator.geolocation){

showToast("位置情報が使えません");
return;

}

showToast("現在地を取得しています");

navigator.geolocation.getCurrentPosition(function(pos){

const lat=pos.coords.latitude;
const lng=pos.coords.longitude;

window.open(
"https://www.google.com/maps?q="+lat+","+lng,
"_blank"
);

},function(){

showToast("位置情報を取得できませんでした");

});

}

</script>

</body>
</html>
