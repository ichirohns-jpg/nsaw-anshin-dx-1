<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>現在地確認</title>

<link rel="icon" href="icon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
background:linear-gradient(180deg,#000000 0%,#08111d 50%,#000000 100%);
color:#fff;
min-height:100vh;
}

.wrap{
max-width:900px;
margin:auto;
padding:16px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:20px;
margin-bottom:16px;
}

.title{
font-size:34px;
font-weight:900;
text-align:center;
margin-bottom:20px;
}

button{
width:100%;
border:none;
border-radius:24px;
padding:24px;
font-size:24px;
font-weight:900;
color:#fff;
cursor:pointer;
margin-bottom:12px;
}

.send-btn{
background:linear-gradient(135deg,#00897b,#26a69a);
}

.home-btn{
background:linear-gradient(135deg,#455a64,#607d8b);
}

#map{
width:100%;
height:500px;
border-radius:20px;
overflow:hidden;
}

.info{
font-size:20px;
font-weight:900;
text-align:center;
line-height:1.8;
}

.log{
background:rgba(255,255,255,.08);
padding:15px;
border-radius:18px;
margin-bottom:10px;
}

</style>

</head>

<body>

<div class="wrap">

<div class="card">

<div class="title">
📍 現在地確認
</div>

<button
class="send-btn"
onclick="sendLocation()">
📍 現在地を送信
</button>

<button
class="home-btn"
onclick="history.back()">
🏠 戻る
</button>

</div>

<div class="card">

<div id="info" class="info">
位置情報待機中...
</div>

</div>

<div class="card">

<iframe
id="map"
src="https://maps.google.com/maps?q=35.8302,139.5757&z=15&output=embed">
</iframe>

</div>

<div class="card">

<div
style="
font-size:24px;
font-weight:900;
margin-bottom:15px;
">
位置情報履歴
</div>

<div id="historyArea">
読み込み中...
</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyi5N-yWWLodlWnncZYtrOwe2w6I9Puf6F5aC6vvtpREKZZfbA5o_XBEp_DonYlLf3r/exec";

const USER_ID =
new URLSearchParams(
location.search
).get("id") || "";

async function sendLocation(){

if(!navigator.geolocation){

alert(
"位置情報が利用できません"
);

return;

}

navigator.geolocation.getCurrentPosition(

async function(position){

const lat =
position.coords.latitude;

const lng =
position.coords.longitude;

document.getElementById(
"info"
).innerHTML =
"緯度：" +
lat +
"<br>経度：" +
lng;

document.getElementById(
"map"
).src =
"https://maps.google.com/maps?q=" +
lat +
"," +
lng +
"&z=16&output=embed";

try{

const body =
new URLSearchParams();

body.append(
"action",
"watch"
);

body.append(
"id",
USER_ID
);

body.append(
"status",
"📍位置情報送信"
);

body.append(
"lat",
lat
);

body.append(
"lng",
lng
);

body.append(
"memo",
lat + "," + lng
);

const response =
await fetch(
GAS_URL,
{
method:"POST",
headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},
body:body.toString()
}
);

const json =
await response.json();

if(json.status==="OK"){

alert(
"位置情報を送信しました"
);

loadHistory();

}

}catch(error){

alert(
"送信失敗"
);

}

},

function(){

alert(
"位置情報取得失敗"
);

}

);

}

async function loadHistory(){

try{

const response =
await fetch(
GAS_URL +
"?action=records&id=" +
encodeURIComponent(USER_ID)
);

const json =
await response.json();

const data =
json.data || [];

let html = "";

data.forEach(item=>{

if(
String(item.status || "")
.indexOf("位置") === -1
){
return;
}

html += `
<div class="log">

<div style="
font-size:18px;
font-weight:900;
">
${item.status || ""}
</div>

<div>
${item.date || ""}
</div>

<div>
${item.memo || ""}
</div>

</div>
`;

});

document.getElementById(
"historyArea"
).innerHTML =
html ||
"履歴なし";

}catch(error){

document.getElementById(
"historyArea"
).innerHTML =
"取得失敗";

}

}

loadHistory();

</script>

</body>
</html>
